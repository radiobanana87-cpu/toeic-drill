packaged sandwiches and bottled drinks from 11:30 A.M.","The contractor has warned that discoloured water may come from the taps for up to an hour after the supply returns. Run the cold tap until the water is clear before drinking or making tea."],"questions":[{"q":"What will happen on 18 September?","o":["The building will close for the day","All restrooms will be closed","Water will be unavailable on the lower floors","The canteen will be relocated"],"a":2,"e":"1〜6階の給水が停止する。7階の手洗いは使用可能。"},{"q":"What is stated about the canteen?","o":["It will offer only cold items","It will open earlier than usual","It will move to floor 7","It will be closed all day"],"a":0,"e":"温かい食事は提供せず、包装済みサンドイッチと瓶入り飲料を販売する。"},{"q":"What are staff advised to do after the supply returns?","o":["Avoid using the seventh-floor restrooms","Let the tap run until the water is clear","Use bottled water for the rest of the day","Report any leaks to the contractor"],"a":1,"e":"最大1時間ほど濁った水が出る可能性があるため、透明になるまで水を流すよう指示している。"}],"ja":["館内のお知らせ ― 給水停止について","地下の主バルブ交換のため、9月18日（水）午前9時からおよそ午後3時まで、1階から6階への給水を停止します。","同フロアの手洗いは全時間帯にわたり閉鎖します。7階の手洗いは引き続き使用でき、全社員がご利用いただけます。通常より混み合いますので、余裕をもってご利用ください。","2階の食堂は当日、温かい食事の提供を行いませんが、午前11時30分より包装済みサンドイッチと瓶入り飲料を販売します。","給水再開後、最大1時間ほど蛇口から濁った水が出ることがあると施工業者から注意がありました。飲用やお茶を入れる前に、水が澄むまで冷水を流してください。"]},{"id":43,"part":3,"cat":"広告","theme":"広告：語学講座の案内","header":["LINGUA CENTRE — Spring Term Courses"],"body":["Evening courses in Spanish, Mandarin, and Portuguese begin the week of 8 April. Each course meets once a week for ten weeks, from 6:30 to 8:30 P.M.","Fees are €340 per course, including the textbook. Learners who register for two courses in the same term pay €620 in total. Payment may be made in two instalments, the second due before the fifth session.","New learners take a short placement conversation by telephone before enrolling, unless they are complete beginners. It takes about ten minutes and is arranged when you submit the registration form.","Classes are capped at twelve. If a course does not reach six learners by 1 April, it will not run and fees will be refunded in full within ten working days."],"questions":[{"q":"How much does a learner save by taking two courses?","o":["€340","€60","€620","€20"],"a":1,"e":"2講座なら340×2=680ユーロのところ620ユーロなので60ユーロ安い。"},{"q":"Who does not need the placement conversation?","o":["Learners taking two courses","Learners with no previous knowledge","Learners paying in instalments","Learners who register before 1 April"],"a":1,"e":"complete beginners may skip it（まったくの初心者は免除）。"},{"q":"What happens if too few people enrol?","o":["The course is postponed to the next term","The course is combined with another","The class size is reduced","The course is canceled and fees returned"],"a":3,"e":"4月1日までに6名に満たない講座は開講せず、10営業日以内に全額返金される。"}],"ja":["リングア・センター ― 春学期の講座","スペイン語、中国語、ポルトガル語の夜間講座を4月8日の週から開講します。各講座は週1回、午後6時30分から8時30分まで、全10回です。","受講料は1講座340ユーロで、教科書代を含みます。同じ学期に2講座を申し込む場合は合計620ユーロです。2回の分割払いも可能で、2回目は第5回の授業までにお支払いください。","新規の学習者は、まったくの初心者である場合を除き、申し込み前に電話での簡単なレベル確認会話を受けていただきます。所要は約10分で、申込書の提出時に日程を調整します。","定員は各12名です。4月1日までに6名に達しない講座は開講せず、受講料は10営業日以内に全額返金します。"]},{"id":44,"part":3,"cat":"求人広告","theme":"求人広告：図書館の司書補助","header":["Library Assistant (part-time) — Ashfield Public Library"],"body":["Ashfield Public Library is seeking a part-time Library Assistant to work eighteen hours a week across three days, including every Saturday.","The role involves shelving returned items, helping visitors use the catalogue computers, and running the weekly story session for young children. Experience with children is more important to us than library experience; training on our catalogue system is provided.","Applicants must be able to lift boxes of books weighing up to twelve kilograms and to work at the returns desk for extended periods.","The post is funded for two years, with the possibility of extension depending on the council&#x27;s budget. Interviews will be held on 22 and 23 May; please indicate on your application which of the two dates you are unable to attend, if either."],"questions":[{"q":"What is one duty of the position?","o":["Leading a session for children","Managing the library budget","Repairing damaged books","Ordering new books"],"a":0,"e":"幼児向けの読み聞かせ会を毎週担当する。"},{"q":"What does the library value most in applicants?","o":["A qualification in library science","Previous library employment","Knowledge of the catalogue system","Experience working with children"],"a":3,"e":"「図書館経験より子どもと接した経験を重視する」と明記されている。"},{"q":"What are applicants asked to state?","o":["Their preferred working days","Whether they can work full-time","Which interview date they cannot attend","The salary they expect"],"a":2,"e":"面接日2日のうち出席できない日があれば申込書に記載するよう求めている。"}],"ja":["図書館補助員（パートタイム）募集 ― アシュフィールド公共図書館","アシュフィールド公共図書館では、週18時間・週3日勤務のパートタイム補助員を募集します。毎週土曜日の勤務を含みます。","業務は、返却された資料の書架への戻し、来館者による目録用パソコンの利用支援、幼児向け読み聞かせ会の週1回の実施です。当館では図書館での経験よりも子どもと接した経験を重視します。目録システムの操作は研修します。","最大12キログラムの書籍の箱を持ち上げられること、返却カウンターで長時間立って業務にあたれることが条件です。","本職は2年間の予算措置によるもので、議会の予算次第で延長の可能性があります。面接は5月22日と23日に実施します。いずれかご出席できない日がある場合は、応募書類にご記入ください。"]},{"id":45,"part":3,"cat":"社内文書","theme":"社内文書：社用車の使用規定","header":["MEMORANDUM","宛先: Staff with pool car access","差出人: Fleet Administration","日付: 3 March"],"body":["From 1 April, all pool car bookings must be made through the online fleet system. Keys will be released only to the person named on the booking; colleagues may not collect a key on someone else&#x27;s behalf.","Drivers must record the odometer reading at the start and end of each trip. The fuel card in each vehicle may be used for fuel only. Parking charges and tolls should be claimed as expenses in the usual way.","Vehicles must be returned with at least a quarter tank of fuel. A car left below this level is likely to delay the next driver, so refuel before you return the car rather than leaving it for whoever books it next.","Report any damage on the same day, even if it appears minor. Damage found later cannot be attributed to a particular booking, and the cost is then charged to the department rather than to an individual."],"questions":[{"q":"What change takes effect on 1 April?","o":["Parking charges will be paid by the fleet office","Bookings must be made online","Pool cars will be replaced","Fuel cards will be withdrawn"],"a":1,"e":"オンラインの車両管理システム経由での予約が必須になる。"},{"q":"What may the fuel card be used for?","o":["Tolls","Any travel cost","Fuel only","Parking"],"a":2,"e":"燃料のみに使用可。駐車料金と通行料は通常の経費精算で申請する。"},{"q":"Why should damage be reported immediately?","o":["To avoid a charge to the department","To keep the odometer record accurate","To allow the car to be repaired the same day","To release the key to the next driver"],"a":0,"e":"後から見つかると特定の予約に紐づけられず、費用が部門負担になる。"}],"ja":["社内連絡　宛先：共用車を利用する社員　差出人：車両管理　日付：3月3日","4月1日より、共用車の予約はすべてオンラインの車両管理システムから行ってください。鍵は予約者本人にのみ渡されます。同僚が代理で受け取ることはできません。","運転者は各運行の開始時と終了時に走行距離計の数値を記録してください。各車両の燃料カードは燃料の支払いにのみ使用できます。駐車料金と通行料は、通常どおり経費として申請してください。","車両は燃料を4分の1以上残して返却してください。それを下回った状態の車は次の運転者を遅らせることになるため、次に予約した人に任せるのではなく、返却前にご自身で給油してください。","損傷は、軽微に見えても当日中に報告してください。後から見つかった損傷は特定の予約に結び付けられず、その費用は個人ではなく部門の負担となります。"]},{"id":46,"part":3,"cat":"記事","theme":"記事：農産物直売所の開設","header":["Bellhaven Gazette — 19 April"],"body":["A farmers&#x27; market will open in Bellhaven&#x27;s Waverley Square on the first Sunday of every month, beginning 4 May. The square has room for twenty stalls, of which sixteen have been confirmed; twelve of those are run by growers based within thirty kilometres of the town.","The market is organised by the Bellhaven Traders&#x27; Association, which already runs the December craft fair in the same square. Association chair Ruth Kemp said the monthly frequency was chosen deliberately: &quot;A weekly market would take custom from the greengrocer on Union Street. Once a month brings visitors in without doing that.&quot;","Stalls will trade from 9:00 A.M. to 2:00 P.M. Waverley Square is closed to traffic on Sundays year-round, so no additional road closures are required.","Applications from growers for the remaining four stalls close on 25 April."],"questions":[{"q":"Why was a monthly market chosen instead of a weekly one?","o":["Because the square is used on other Sundays","To avoid harming an existing shop","To reduce organising costs","Because too few growers applied"],"a":1,"e":"週1回だとユニオン通りの八百屋の客を奪うため、月1回にしたと会長が説明している。"},{"q":"What is indicated about Waverley Square?","o":["It is already car-free on Sundays","It will be closed to traffic for the market","It is being repaved before May","It hosts a weekly craft fair"],"a":0,"e":"日曜は年間を通じて車両通行止めなので、追加の閉鎖は不要。"},{"q":"What is stated about the stalls?","o":["They will operate until 5:00 P.M.","Every stall has been booked","Four are still available","Half are run by local growers"],"a":2,"e":"16区画のうち確定は12＋確定済み合計16…本文では16確定のうち残り4区画の応募を受付中とある。"}],"ja":["ベルヘイブン・ガゼット 4月19日","ベルヘイブンのウェーバリー広場で、5月4日を初回として毎月第1日曜に農産物直売所が開かれる。広場には20区画分の余地があり、うち16区画が確定している。その16のうち12は町から30キロ圏内の生産者による出店である。","主催はベルヘイブン商店会で、同会は同じ広場で12月の工芸市もすでに運営している。会長のルース・ケンプ氏は、月1回という頻度は意図的に選んだと述べた。「毎週開けばユニオン通りの八百屋から客を奪ってしまいます。月に一度なら、そうせずに来訪者を呼び込めます」","営業時間は午前9時から午後2時まで。ウェーバリー広場は年間を通じて日曜が車両通行止めのため、追加の道路封鎖は必要ない。","残り4区画への生産者からの申し込みは4月25日に締め切られる。"]},{"id":47,"part":3,"cat":"手紙","theme":"手紙：保険契約の更新通知","header":["Cranmore Insurance","宛先: Ms. Delia Nkemdirim","日付: 2 August"],"body":["Dear Ms. Nkemdirim,","Your shop insurance policy expires on 30 September. We are able to offer renewal for a further twelve months at £1,148, compared with £1,090 last year.","The increase reflects a change in how we assess stock held on the premises overnight. Your declared stock value rose from £18,000 to £24,000 when you updated your details in March, and this figure is now used in the calculation.","You do not need to take any action to renew. Unless you contact us before 23 September, the policy will continue automatically and the premium will be taken from the account on record.","If your stock level has fallen since March, please tell us before renewal; we can recalculate the premium, but we cannot adjust it retrospectively once the new policy has begun.","Yours sincerely,","Renewals Team"],"questions":[{"q":"Why has the premium increased?","o":["The value of stock declared has risen","The shop moved to a new location","The policy period has been extended","A claim was made during the year"],"a":0,"e":"3月に申告在庫額を18,000から24,000ポンドに更新したことが計算に反映されている。"},{"q":"What will happen if Ms. Nkemdirim does nothing?","o":["The premium will remain at last year&#x27;s level","A new quotation will be sent","The policy will renew automatically","The policy will lapse on 30 September"],"a":2,"e":"9月23日までに連絡がなければ自動更新され、登録口座から保険料が引き落とされる。"},{"q":"What is stated about adjusting the premium?","o":["It requires a visit from an assessor","It is reviewed every three months","It can be changed at any time","It cannot be changed after the new policy starts"],"a":3,"e":"新契約開始後は遡っての調整はできないと明記されている。"}],"ja":["クランモア保険　宛先：デリア・ンケムディリム様　日付：8月2日","ンケムディリム様","お客様の店舗保険は9月30日に満了します。さらに12か月の更新を1,148ポンドでご提供できます。昨年は1,090ポンドでした。","値上がりは、店舗内に夜間保管される在庫の評価方法を変更したことによるものです。3月にご登録内容を更新された際、申告在庫額が18,000ポンドから24,000ポンドに上がり、この数値が現在の計算に用いられています。","更新にあたってお手続きは不要です。9月23日までにご連絡がない限り、契約は自動的に継続し、保険料はご登録の口座から引き落とされます。","3月以降に在庫水準が下がっている場合は、更新前にお知らせください。保険料を再計算できますが、新契約の開始後に遡って調整することはできません。","更新担当チーム"]},{"id":48,"part":3,"cat":"チャット","theme":"チャット：展示ブースの人員調整","header":["Team chat — Tuesday, 11:05 A.M."],"body":["<b>Noor Haddad (11:05 A.M.)</b> Bad news. Emil has come down with something and won't make the trade fair on Thursday.","<b>Colin Ward (11:07 A.M.)</b> That leaves two of us on a stand that really needs three. Can we ask someone from the Lyon office?","<b>Noor Haddad (11:09 A.M.)</b> I checked. Their whole team is at a customer visit that day. What about cutting the demo down to a five-minute version so two people can manage?","<b>Colin Ward (11:12 A.M.)</b> The full demo is the reason most people stop at the stand. I'd rather drop the afternoon slot and run the whole thing all morning.","<b>Noor Haddad (11:14 A.M.)</b> Agreed. I'll put a sign on the stand saying demonstrations run 10:00 to 13:00 only, and we can talk to visitors one to one after that."],"questions":[{"q":"What problem are the writers discussing?","o":["The Lyon office has closed","A demonstration has been canceled","The stand has been moved","A colleague cannot attend an event"],"a":3,"e":"エミルが体調を崩し木曜の見本市に参加できないこと。"},{"q":"Why can the Lyon office not help?","o":["They have no experience with the demo","They will be visiting a customer","They were not asked in time","They are attending a different fair"],"a":1,"e":"当日はチーム全員が顧客訪問に出ている。"},{"q":"At 11:12 A.M., what does Mr. Ward mean when he writes, &quot;The full demo is the reason most people stop at the stand&quot;?","o":["He does not want to shorten the content of the demonstration","He believes the stand is in a poor location","He wants to add a second demonstration","He is explaining why Emil is needed"],"a":0,"e":"実演の内容こそが集客の要なので、5分版に切り詰める案には反対し、代わりに実施時間帯を減らす提案をしている。"}],"ja":["チームチャット 火曜日 午前11時5分","ヌール・ハダド（11:05）悪い知らせです。エミルが体調を崩して、木曜の見本市に来られません。","コリン・ウォード（11:07）本来3人必要なブースが2人になりますね。リヨン事務所の誰かに頼めませんか。","ヌール・ハダド（11:09）確認しました。当日はチーム全員が顧客訪問に出ています。実演を5分の短縮版にして2人で回せるようにするのはどうでしょう。","コリン・ウォード（11:12）完全版の実演こそ、大半の人がブースに足を止める理由です。それより午後の枠をなくして、午前中は通しで完全版を続けたいです。","ヌール・ハダド（11:14）賛成です。実演は10時から13時のみと掲示を出しておきます。その後は来場者と1対1でお話ししましょう。"]},{"id":49,"part":3,"cat":"案内","theme":"案内：美術館の会員制度","header":["Fenwick Gallery — Membership"],"body":["Membership costs £48 a year for individuals and £75 for two adults at the same address. Members enter all exhibitions without charge, including the paid summer exhibition, for which non-members pay £14.","Members also receive ten percent off in the shop and the café, and may bring one guest free of charge on the first Wednesday of each month.","Membership begins on the day of purchase, not on the first of the month. Cards are posted within ten days; until the card arrives, the confirmation e-mail may be shown at the desk.","Members are invited to a preview evening before each major exhibition opens. Places are limited and are allocated by ballot, as demand has exceeded capacity at every preview since 2023."],"questions":[{"q":"What is included in membership?","o":["A free guest at any time","Free entry to the summer exhibition","A guaranteed place at each preview","Free items from the shop"],"a":1,"e":"有料の夏季展を含め、すべての展覧会に無料で入場できる。"},{"q":"What should a new member do before the card arrives?","o":["Show the confirmation e-mail","Wait until the first of the month","Collect a temporary card at the desk","Pay the non-member price and claim a refund"],"a":0,"e":"カード到着までは確認メールを受付で提示すればよい。"},{"q":"How are preview places decided?","o":["By order of application","By the type of membership held","By random selection","By length of membership"],"a":2,"e":"希望者が定員を超えるため、抽選で割り当てられる。"}],"ja":["フェンウィック美術館 ― 会員制度","会費は個人が年48ポンド、同一住所の成人2名が年75ポンドです。会員は、非会員が14ポンドを支払う夏季の有料展を含め、すべての展覧会に無料で入場できます。","会員はまた、ショップとカフェで10パーセントの割引を受けられ、毎月第1水曜日には同伴者1名を無料でお連れいただけます。","会員資格は購入した当日から始まります。月の初日からではありません。カードは10日以内に郵送します。届くまでは、受付で確認メールをご提示ください。","会員は主要な展覧会の開幕前に行われる内覧会にご招待します。定員に限りがあり、2023年以降すべての内覧会で希望者が定員を超えているため、抽選で割り当てています。"]},{"id":50,"part":3,"cat":"明細書","theme":"明細書：ホテルの請求明細","header":["THE ALDERTON HOTEL — Guest Statement","宿泊者: R. Villanueva　部屋: 512","滞在: 14–17 June (3 nights)"],"body":["Room charge: 3 nights at $189 = $567. Breakfast: 3 at $22 = $66. Business centre printing: $9. Minibar: $0. City tax: $27. Total: $669.","Your room rate was booked under the conference delegate code, which includes breakfast. The breakfast line above has therefore been credited in full and does not form part of the balance due. Balance payable: $603.","Please note that the parking charge of $25 per night, which appeared on the estimate you received at check-in, has been removed. Our records show the space was not used.","A copy of this statement has been e-mailed to the address on file. If you require a version addressed to your employer rather than to you personally, contact the front desk before departure; we cannot reissue statements once a guest has checked out."],"questions":[{"q":"Why is the balance lower than the total?","o":["A discount was applied to the room rate","The city tax was waived","The guest paid a deposit","The breakfast charge was credited"],"a":3,"e":"会議参加者料金に朝食が含まれるため、朝食66ドルが全額差し引かれている（669−66＝603）。"},{"q":"What is indicated about the parking charge?","o":["It is included in the city tax","It will be billed separately","It was added after check-in","It was removed because the space was unused"],"a":3,"e":"駐車場が使用されなかった記録があるため請求から外された。"},{"q":"What must the guest do before checking out?","o":["Confirm the e-mail address on file","Request a statement addressed to the employer","Pay the minibar charge","Return the room key to the business centre"],"a":1,"e":"勤務先宛の明細が必要な場合はチェックアウト前に申し出る必要がある。"}],"ja":["オルダートン・ホテル ― ご精算明細　宿泊者：R・ビリャヌエバ　部屋：512　滞在：6月14〜17日（3泊）","室料：3泊×189ドル＝567ドル。朝食：3回×22ドル＝66ドル。ビジネスセンター印刷：9ドル。ミニバー：0ドル。市税：27ドル。合計：669ドル。","お客様の室料は朝食込みの会議参加者コードで予約されています。したがって上記の朝食分は全額を減算しており、お支払い残高には含まれません。お支払い額：603ドル。","なお、チェックイン時にお渡しした見積に記載されていた1泊25ドルの駐車料金は削除しました。当館の記録では区画が使用されておりません。","本明細の写しは登録のメールアドレスへ送信済みです。ご本人宛ではなく勤務先宛の明細が必要な場合は、ご出発前にフロントへお申し付けください。チェックアウト後の再発行はいたしかねます。"]},{"id":51,"part":3,"cat":"レビュー","theme":"レビュー：会計ソフトの評価","header":["Software review — Ledgerly for small business | by M. Okafor"],"body":["I run a two-person consultancy and moved to Ledgerly from spreadsheets six months ago. For invoicing and bank reconciliation it has been a clear improvement.","Setting up took an afternoon. Importing two years of transactions worked without errors, although the categories it suggested had to be corrected by hand about a third of the time.","Invoices can be sent directly from the program and marked as paid when the payment appears in the bank feed. That single feature has saved me perhaps two hours a month.","Where it falls short is reporting. The standard reports are adequate, but building a custom report requires a paid add-on, which was not clear on the pricing page. Anyone who needs tailored reports should factor that cost in before subscribing."],"questions":[{"q":"What does the reviewer say about the initial setup?","o":["Transactions had to be entered manually","The imported data contained no errors","It required outside help","It took several days"],"a":1,"e":"2年分の取引の取り込みはエラーなく完了した。ただし分類の候補は3分の1ほど手直しが必要だった。"},{"q":"Which feature does the reviewer value most?","o":["Sending invoices and matching payments","The pricing structure","Custom reporting","Category suggestions"],"a":0,"e":"請求書送付と入金の照合が月2時間ほどの節約になったと述べている。"},{"q":"What does the reviewer warn readers about?","o":["Poor customer support","A limit on the number of invoices","Frequent software updates","An extra cost for tailored reports"],"a":3,"e":"独自の帳票を作るには有料の追加機能が必要で、価格ページに明示されていなかった。"}],"ja":["ソフトウェアレビュー ― 小規模事業者向けレジャリー　投稿者 M・オカフォー","2人のコンサルティング事務所を営んでおり、6か月前に表計算からレジャリーに移行した。請求書発行と銀行口座の照合については明らかに改善した。","初期設定には半日かかった。2年分の取引の取り込みはエラーなく完了したが、提案された勘定科目は3分の1ほど手作業で直す必要があった。","請求書はソフトから直接送信でき、入金が銀行連携に現れた時点で支払済みとして記録できる。この機能だけで月におそらく2時間は節約できている。","物足りないのは帳票機能だ。標準の帳票は十分だが、独自の帳票を作るには有料の追加機能が必要で、これは価格ページでは分からなかった。独自帳票が必要な人は、契約前にその費用を見込んでおくべきだ。"]},{"id":52,"part":3,"cat":"プレスリリース","theme":"プレスリリース：助成金の授与","header":["PRESS RELEASE — The Harlow Foundation"],"body":["The Harlow Foundation has awarded £600,000 to eight organisations working on coastal erosion. Grants range from £40,000 to £120,000 and run for three years.","This is the first round in which applicants were required to name a partner organisation. The foundation introduced the requirement after an internal review found that projects run jointly were more likely to continue once funding ended.","Among the recipients is the Selby Shoreline Trust, which will use its £95,000 grant to train volunteers to record changes to the dune system. The trust&#x27;s partner in the project is a university department that will analyse the data collected.","Applications for the next round open in November. The foundation has confirmed that the partnership requirement will remain and that the total sum available will be unchanged."],"questions":[{"q":"What is new about this round of grants?","o":["Applicants had to name a partner","The total sum has increased","Grants now last three years","Only coastal organisations may apply"],"a":0,"e":"提携先を明記することが今回初めて要件となった。"},{"q":"Why was the new requirement introduced?","o":["To lower administrative costs","At the request of a university","To reduce the number of applications","Because joint projects tend to last longer"],"a":3,"e":"内部評価で、共同運営の事業は資金終了後も継続しやすいと分かったため。"},{"q":"What will the Selby Shoreline Trust do with its grant?","o":["Employ eight full-time staff","Analyse data on dune systems","Build a new visitor centre","Train volunteers to record changes"],"a":3,"e":"砂丘の変化を記録するボランティアの育成に充てる。データ分析は提携先の大学が担当。"}],"ja":["報道発表 ― ハーロウ財団","ハーロウ財団は、海岸浸食に取り組む8団体に総額60万ポンドを助成した。助成額は4万ポンドから12万ポンドで、期間はいずれも3年間である。","応募者に提携団体の明記を求めたのは今回が初めてである。財団は、共同で運営される事業のほうが助成終了後も継続しやすいという内部評価の結果を受けて、この要件を導入した。","受給団体のひとつであるセルビー海岸トラストは、9万5,000ポンドの助成金を、砂丘の変化を記録するボランティアの育成に充てる。同事業における提携先は、収集されたデータを分析する大学の一部門である。","次回の募集は11月に開始される。財団は、提携の要件は維持し、助成総額も据え置くと明らかにしている。"]},{"id":53,"part":3,"cat":"日程表","theme":"日程表：工場見学の受け入れ","header":["Visitor Programme — Northfield Plant"],"body":["Tours run on the second and fourth Thursday of each month at 10:00 A.M. and 1:30 P.M. Each tour lasts ninety minutes and is limited to fifteen visitors.","Morning tour (the afternoon tour follows the same order):<br>10:00  Safety briefing and equipment issue (Reception)<br>10:15  Assembly hall — walkway viewing only<br>10:50  Quality laboratory — questions welcome<br>11:15  Packing line<br>11:30  Close, return of equipment","Visitors must wear closed shoes; sandals are not permitted anywhere beyond Reception. Safety glasses and high-visibility vests are provided and must be returned at the end. Photography is allowed in the quality laboratory only.","Groups of six or more should book at least three weeks ahead. Schools may request a morning tour outside the usual dates, but these are arranged only between May and July, when the second production line is not running."],"questions":[{"q":"Where are visitors permitted to take photographs?","o":["Anywhere after the safety briefing","In the assembly hall","On the packing line","In the quality laboratory"],"a":3,"e":"写真撮影が許されるのは品質検査室のみ。"},{"q":"What is stated about school visits?","o":["They do not include the safety briefing","They require groups of fifteen or more","They are held only in the afternoon","They are available in a limited period of the year"],"a":3,"e":"5月から7月の間のみ、通常日程外の午前の見学を手配できる。"},{"q":"What must visitors do at the end of the tour?","o":["Complete a feedback form","Collect a certificate at Reception","Return the equipment provided","Sign out at the packing line"],"a":2,"e":"保護眼鏡と高視認性ベストは終了時に返却しなければならない。"}],"ja":["見学プログラム ― ノースフィールド工場","見学は毎月第2・第4木曜の午前10時と午後1時30分に実施します。所要は90分、定員は15名です。","午前の回（午後の回も同じ順序です）<br>10:00 安全説明と装備の貸与（受付）<br>10:15 組立ホール（通路からの見学のみ）<br>10:50 品質検査室（ご質問歓迎）<br>11:15 梱包ライン<br>11:30 終了、装備の返却","来訪者はつま先の覆われた靴を着用してください。受付から先ではサンダルは認められません。保護眼鏡と高視認性ベストは貸与し、終了時に返却していただきます。写真撮影は品質検査室でのみ可能です。","6名以上の団体は3週間以上前にご予約ください。学校は通常の日程外に午前の見学を希望できますが、第2生産ラインが稼働しない5月から7月の間に限り手配します。"]},{"id":54,"part":3,"cat":"取扱説明","theme":"取扱説明：電動自転車の充電","header":["Charging your e-bike battery — Model TR-3"],"body":["Charge the battery indoors at a temperature between 10 and 30 degrees Celsius. Charging below 10 degrees will not damage the battery but will take considerably longer and may stop before the battery is full.","A full charge from empty takes about four hours. The indicator on the charger shows red while charging and green when finished; a flashing red light means the battery is too cold rather than faulty.","The battery can be charged on or off the bike. If you remove it, carry it by the handle on the top — lifting it by the connector at the base is the most common cause of damage not covered by the warranty.","For storage of more than a month, charge to roughly half and store in a dry place. Do not store a fully discharged battery; doing so shortens its life."],"questions":[{"q":"What does a flashing red light indicate?","o":["The charger is faulty","The battery temperature is too low","The battery is fully charged","The battery must be replaced"],"a":1,"e":"赤の点滅は故障ではなく、電池が冷えすぎていることを示す。"},{"q":"What causes damage that the warranty does not cover?","o":["Using the bike in cold weather","Charging indoors","Charging the battery on the bike","Lifting the battery by the connector"],"a":3,"e":"底部の接続端子を持って持ち上げることが、保証対象外の損傷で最も多い原因。"},{"q":"How should the battery be stored for a long period?","o":["At about half charge","Fully charged","Fully discharged","Attached to the bike"],"a":0,"e":"1か月を超える保管はおよそ半分まで充電し、乾燥した場所に置く。"}],"ja":["電動自転車の電池の充電について ― TR-3型","電池は摂氏10度から30度の屋内で充電してください。10度未満での充電は電池を損なうことはありませんが、時間がかなり長くかかり、満充電になる前に停止することがあります。","空の状態からの満充電には約4時間かかります。充電器の表示ランプは充電中が赤、完了時が緑です。赤の点滅は故障ではなく、電池が冷えすぎていることを示します。","電池は自転車に取り付けたままでも、外してでも充電できます。取り外す場合は上部の取っ手を持って運んでください。底部の接続端子を持って持ち上げることが、保証の対象とならない損傷の最も多い原因です。","1か月を超えて保管する場合は、およそ半分まで充電し、乾燥した場所に保管してください。完全に放電した状態で保管すると寿命が縮みます。"]},{"id":55,"part":3,"cat":"Eメール","theme":"Eメール：キャンセル待ちの案内","header":["宛先: Mr. Andreas Holm","差出人: Registrations, Institute of Design","件名: Place available — Typography Intensive"],"body":["Dear Mr. Holm,","A place has become available on the Typography Intensive beginning 6 October, for which you joined the waiting list in July.","As you were the first person on the list, the place is offered to you before anyone else. To accept, please confirm and pay the £480 fee by Friday 19 September. If we do not hear from you by that date, the place will pass to the next person and your name will be removed from the list.","The course runs on six consecutive Mondays from 10:00 A.M. to 4:00 P.M. Please note that the session on 27 October takes place at our Southbank studio rather than the main building, as the letterpress equipment is housed there.","Registrations Office"],"questions":[{"q":"Why is Mr. Holm being contacted?","o":["A course has been rescheduled","A space on a course has opened up","His payment has not been received","His application was rejected"],"a":1,"e":"待機者名簿の1番目だった彼に空席が案内された。"},{"q":"What will happen if Mr. Holm does not reply by 19 September?","o":["He will be moved down the waiting list","He will be enrolled automatically","The place will be given to someone else","He will be charged a late fee"],"a":2,"e":"期日までに連絡がなければ次の人に回り、名簿からも削除される。"},{"q":"What is different about the session on 27 October?","o":["It is held at another location","It starts later in the day","It lasts two days","It is optional"],"a":0,"e":"活版印刷の設備がある別のスタジオで行われる。"}],"ja":["宛先：アンドレアス・ホルム様　差出人：デザイン学院 受講登録係　件名：空席のご案内 ― タイポグラフィ集中講座","ホルム様","7月にキャンセル待ちにご登録いただいた、10月6日開始のタイポグラフィ集中講座に空席が出ました。","お客様は名簿の1番目でしたので、他の方に先立ってご案内します。ご受講の場合は、9月19日（金）までに確認のご連絡と480ポンドの受講料のお支払いをお願いします。同日までにご連絡がない場合、席は次の方に移り、お名前は名簿から削除されます。","講座は月曜6回連続で、午前10時から午後4時まで行います。なお10月27日の回は、活版印刷の設備が置かれているサウスバンク・スタジオで実施し、本館では行いません。","受講登録係"]},{"id":56,"part":3,"cat":"お知らせ","theme":"お知らせ：郵便室の移転","header":["NOTICE — Mail Room Relocation"],"body":["The mail room will move from the basement to room G12 on the ground floor during the weekend of 8 and 9 June. Deliveries will be received as normal on Monday 10 June from the new location.","Outgoing post must be handed in by 3:30 P.M. rather than the current 4:00 P.M. The earlier deadline reflects the new collection time agreed with the courier, which cannot be changed.","Personal parcels will no longer be accepted. Staff who currently have items delivered to the office should arrange for them to be sent elsewhere before 10 June. Parcels arriving on or after that date will be returned to the sender unopened.","Pigeonholes will keep their current numbering, so there is no need to update the labels on internal envelopes."],"questions":[{"q":"What is changing about outgoing post?","o":["It requires a new label","It must be handed in earlier","It must be taken to the basement","It will be collected twice a day"],"a":1,"e":"締切が午後4時から3時30分に繰り上がる。集荷時刻の変更に伴うもの。"},{"q":"What will happen to personal parcels received after 10 June?","o":["They will be sent back to the sender","They will be held in room G12","They will be delivered to the employee&#x27;s desk","They will incur a handling charge"],"a":0,"e":"個人宛小包は受け付けず、未開封のまま差出人に返送される。"},{"q":"What is NOT changing?","o":["The acceptance of personal parcels","The numbering of the pigeonholes","The deadline for outgoing post","The location of the mail room"],"a":1,"e":"メールボックスの番号は現行のままなので、封筒の宛名表示を直す必要はない。"}],"ja":["お知らせ ― 郵便室の移転","6月8日・9日の週末に、郵便室を地下から1階のG12室へ移転します。6月10日（月）からは新しい場所で通常どおり配達物を受け取ります。","発送物の受付締切は、現行の午後4時から午後3時30分に繰り上がります。この繰り上げは配送業者と取り決めた新しい集荷時刻に伴うもので、変更はできません。","個人宛の小包は今後お預かりしません。現在オフィス宛に配達を受けている社員は、6月10日より前に別の場所に届くよう手配してください。同日以降に到着した小包は、未開封のまま差出人へ返送します。","メールボックスの番号は現行のまま変わりません。社内封筒の宛名表示を更新する必要はありません。"]},{"id":57,"part":3,"cat":"社内報","theme":"社内報：社内クラブの活動報告","header":["Staff Association Bulletin — Autumn"],"body":["The running club completed its charity relay on 14 September, raising £3,850 for the children&#x27;s hospital, well above the £2,500 target. Thirty-one colleagues took part, eleven of them running for the first time.","The club meets on Tuesdays at 5:30 P.M. outside the south entrance. Sessions are open to all levels; the group splits into two paces after the first kilometre, so nobody is left behind.","The photography group has changed its meeting day from Thursday to Wednesday following a members&#x27; vote. The group is looking for someone to take over as coordinator from January, when Bea Larsson moves to the Cardiff office.","Proposals for new clubs should be sent to the Staff Association by 30 November. A minimum of eight interested members is required before a club can be approved."],"questions":[{"q":"What is indicated about the charity relay?","o":["It raised more than the goal","It was held for the first time","It involved eleven runners","It took place in Cardiff"],"a":0,"e":"目標2,500ポンドに対し3,850ポンドを集めた。参加は31名で、うち11名が初参加。"},{"q":"Why is the photography group seeking a new coordinator?","o":["The meeting day has changed","The current one is transferring to another office","Membership has grown too large","The current one is retiring"],"a":1,"e":"ベア・ラーソンが1月にカーディフ事務所へ異動するため。"},{"q":"What is required to start a new club?","o":["A budget of at least £2,500","A meeting on a weekday evening","Approval from a department head","A written proposal and eight interested members"],"a":3,"e":"11月30日までの提案書と、最低8名の関心表明が必要。"}],"ja":["職員会だより ― 秋号","ランニングクラブは9月14日にチャリティー駅伝を完走し、小児病院のために3,850ポンドを集めました。目標の2,500ポンドを大きく上回る額です。31名の同僚が参加し、うち11名は初参加でした。","クラブは毎週火曜午後5時30分、南口の外に集合します。どの走力の方でも参加でき、最初の1キロを過ぎたところで2つのペースに分かれるため、取り残される人はいません。","写真同好会は、会員投票の結果、活動日を木曜から水曜に変更しました。同会では、ベア・ラーソンが1月にカーディフ事務所へ異動するのに伴い、後任の世話役を探しています。","新しいクラブの設立提案は、11月30日までに職員会へお送りください。承認には最低8名の関心者が必要です。"]},{"id":58,"part":3,"cat":"報告書","theme":"報告書：配送遅延の原因分析","header":["Delivery Performance Review — First Half"],"body":["On-time delivery fell from 94 percent to 88 percent between January and June. Of the 1,120 late deliveries recorded, 640 originated at the Trentham depot.","Analysis shows that most Trentham delays occurred on orders placed after 2:00 P.M. The depot&#x27;s cut-off for same-day picking is 2:00 P.M., but the ordering page continued to display a 4:00 P.M. cut-off until it was corrected in May. Customers therefore expected an earlier dispatch than was possible.","Since the correction, Trentham&#x27;s late deliveries have fallen by roughly 60 percent. The remaining delays are spread evenly across depots and are largely weather-related.","We recommend no further action at Trentham. Attention should instead move to the returns process, where processing times have grown for four consecutive quarters."],"questions":[{"q":"What was the main cause of delays at Trentham?","o":["Severe weather","Incorrect information shown to customers","A change in depot opening hours","A shortage of drivers"],"a":1,"e":"注文ページが実際の締切2時ではなく4時と表示し続けていたため、顧客の期待とずれが生じた。"},{"q":"What happened after the correction in May?","o":["Orders after 2:00 P.M. were refused","Trentham&#x27;s late deliveries dropped sharply","On-time delivery returned to 94 percent","Deliveries were transferred to other depots"],"a":1,"e":"訂正後、トレンサムの遅延は約60パーセント減少した。"},{"q":"What does the report recommend?","o":["Hiring additional staff","Further changes at Trentham","Extending the same-day cut-off","Focusing on the returns process"],"a":3,"e":"トレンサムへの追加対応は不要とし、処理時間が4四半期連続で伸びている返品業務に注力すべきとしている。"}],"ja":["配送実績の検証 ― 上半期","定時配送率は1月から6月にかけて94パーセントから88パーセントに低下した。記録された遅延1,120件のうち640件はトレンサム集配所に起因する。","分析によれば、トレンサムの遅延の大半は午後2時以降に入った注文で発生していた。同集配所の当日出荷の締切は午後2時だが、注文ページは5月に修正されるまで午後4時の締切を表示し続けていた。そのため顧客は、実際には不可能な早期の発送を期待していた。","修正以降、トレンサムの遅延はおよそ60パーセント減少した。残る遅延は各集配所に均等に分散しており、大半は天候によるものである。","トレンサムについて追加の対応は不要と考える。代わりに、処理時間が4四半期連続で伸びている返品業務に注意を向けるべきである。"]},{"id":59,"part":3,"cat":"Eメール","theme":"Eメール：値上げへの対応","header":["宛先: Sales, Vantor Components","差出人: Katrin Mueller, Purchasing","件名: Price notice dated 14 May"],"body":["Dear Sales Team,","Thank you for your notice of a 7 percent increase on all part numbers from 1 July. We understand that material costs have risen and we are not disputing the direction of the change.","Our concern is the timing. Our current agreement, signed in November, states that prices are fixed for twelve months. On that basis we expect the existing prices to apply until 31 October, with any increase taking effect from 1 November.","If we have misread the agreement, please point us to the clause in question. Otherwise, please confirm in writing that our orders through October will be invoiced at the current rate.","We have three deliveries scheduled in August and would prefer to resolve this before the first of them.","Katrin Mueller"],"questions":[{"q":"What is Ms. Mueller objecting to?","o":["A change in delivery schedules","The date on which the increase begins","The size of the price increase","The quality of recent deliveries"],"a":1,"e":"値上げ自体ではなく、契約の価格固定期間中に始まる時期を問題にしている。"},{"q":"When does Ms. Mueller believe the new prices should apply?","o":["31 October","Immediately","1 November","1 July"],"a":2,"e":"11月に締結し12か月固定なので、10月31日まで現行価格、11月1日から値上げと考えている。"},{"q":"What does Ms. Mueller request?","o":["A meeting with the sales team","A discount on August deliveries","Written confirmation of the current rate","A copy of the signed agreement"],"a":2,"e":"10月までの注文を現行価格で請求する旨の書面確認を求めている。"}],"ja":["宛先：ヴァントール・コンポーネンツ営業部　差出人：カトリン・ミュラー（購買）　件名：5月14日付の価格通知について","営業部御中","7月1日より全品番を7パーセント値上げする旨のご通知をありがとうございます。材料費が上昇していることは理解しており、値上げの方向性に異を唱えるものではありません。","当方の懸念は時期です。11月に締結した現行の契約では、価格は12か月間固定と定められています。それに基づけば、現行価格は10月31日まで適用され、値上げは11月1日からと理解しております。","当方の契約解釈に誤りがある場合は、該当する条項をお示しください。そうでなければ、10月までのご注文を現行価格で請求いただく旨、書面にてご確認をお願いします。","8月に3件の納品が予定されており、その最初の納品より前に本件を解決したいと考えております。","カトリン・ミュラー"]},{"id":60,"part":3,"cat":"お知らせ","theme":"お知らせ：資格取得支援制度","header":["Study Support Scheme — Applications for next year"],"body":["The company will again fund professional qualifications for staff who have completed twelve months of service. The scheme covers course fees and one examination attempt per subject; a resit must be paid for by the employee.","Applicants must give the name of the qualification, the awarding body, and the total cost. Approval is granted by the employee&#x27;s director, not by Human Resources, so allow time for this before the closing date of 31 January.","Study leave of up to five days a year is available and must be booked in the same way as annual leave. Days not used cannot be carried into the following year.","Employees who leave the company within twelve months of completing a funded qualification are asked to repay half the course fee. This condition is set out in the agreement signed at the start of the course."],"questions":[{"q":"What is NOT covered by the scheme?","o":["A first examination attempt","Course fees","Study leave","A repeated examination"],"a":3,"e":"再受験（resit）の費用は社員負担。"},{"q":"Who approves applications?","o":["The training provider","The employee&#x27;s director","Human Resources","The awarding body"],"a":1,"e":"承認は人事部ではなく所属部門の部門長が行う。"},{"q":"What happens if an employee resigns soon after qualifying?","o":["They lose their study leave entitlement","They must repay part of the course fee","The qualification is withdrawn","They must repay the examination fee only"],"a":1,"e":"資格取得から12か月以内に退職した場合、受講料の半額の返還を求められる。"}],"ja":["学習支援制度 ― 来年度の申請について","当社は今年度も、勤続12か月を満たした社員の専門資格取得を支援します。本制度は受講料と、科目ごとに1回分の受験料を対象とします。再受験の費用は社員のご負担です。","申請には、資格の名称、認定団体、総費用の記載が必要です。承認は人事部ではなく所属部門の部門長が行いますので、1月31日の締切までに余裕をもってお手続きください。","年間5日までの学習休暇を利用できます。年次有給休暇と同じ方法で申請してください。使わなかった日数を翌年に繰り越すことはできません。","支援を受けて資格を取得してから12か月以内に退職する社員には、受講料の半額の返還をお願いしています。この条件は、受講開始時に署名する同意書に定められています。"]},{"id":61,"part":4,"cat":"Eメール","theme":"Eメール：移転に伴う住所変更","header":["宛先: Accounts, Pelham Textiles","差出人: Ivo Novak, Marchetti Design","日付: 2 October","件名: New address from 1 November"],"body":["Dear Accounts Team,","Our studio is moving on 28 October. From 1 November our address will be 14 Foundry Walk, Leeds LS2 7QN. Our telephone numbers and bank details are unchanged.","Please update your records so that invoices issued from November onwards carry the new address. Invoices already in your system for October work do not need to be reissued; we will accept them as they are.","Post sent to the old address will be forwarded for six months, so nothing will be lost if a letter crosses with this message. After that period, mail will be returned to the sender.","If your system requires a signed change-of-details form, send it to me directly and I will return it within a day.","Ivo Novak"],"questions":[{"q":"What is the purpose of the e-mail?","o":["To request a change of bank details","To arrange the collection of post","To query an invoice issued in October","To notify a supplier of a change of address"],"a":3,"e":"11月1日からの新住所を伝え、記録の更新を求めるのが目的。銀行口座は変更なし。"},{"q":"What does Mr. Novak say about invoices for October work?","o":["They must be reissued with the new address","They require a signed form","They will be accepted in their current form","They should be sent after 1 November"],"a":2,"e":"10月分の請求書は再発行不要で、そのまま受け付けると述べている。"},{"q":"What will happen to mail sent to the old address after six months?","o":["It will be sent back to the sender","It will be forwarded automatically","It will be delivered by courier","It will be held at the new studio"],"a":0,"e":"6か月の転送期間の後は、差出人に返送される。"}],"ja":["宛先：ペルハム・テキスタイル経理部　差出人：イーヴォ・ノヴァク（マルケッティ・デザイン）　件名：11月1日からの新住所","経理ご担当者様","当スタジオは10月28日に移転します。11月1日より住所は 14 Foundry Walk, Leeds LS2 7QN となります。電話番号と銀行口座に変更はありません。","11月以降に発行される請求書に新住所が記載されるよう、記録の更新をお願いします。10月分の作業についてすでに貴社システムにある請求書は再発行不要で、そのまま受け付けます。","旧住所宛の郵便物は6か月間転送されますので、本メールと行き違いになった書面があっても失われることはありません。その期間の後は、郵便物は差出人に返送されます。","署名済みの変更届が必要な場合は、私宛に直接お送りください。1日以内に返送いたします。","イーヴォ・ノヴァク"]},{"id":62,"part":4,"cat":"お知らせ","theme":"お知らせ：社員証の切り替え","header":["NOTICE — New Staff Identification Cards"],"body":["All staff will receive a new identification card during the week of 13 May. The current cards stop working at midnight on 31 May, so both cards will open the doors for the rest of the month.","Collect your card from the security desk in the main lobby between 8:00 A.M. and 6:00 P.M. Bring your existing card with you; it will be destroyed at the desk once the new one has been tested on the reader.","The new cards also serve as payment cards in the canteen. This function is switched off until you register a payment method on the staff portal, and the card works as a door key whether or not you register.","Report a lost card to Security on the same day. There is no charge for the first replacement."],"questions":[{"q":"What is indicated about the current cards?","o":["They will be reprogrammed at the desk","They must be returned by 13 May","They cannot be used in the canteen","They will work until the end of May"],"a":3,"e":"5月31日深夜まで有効で、それまでは新旧どちらでも解錠できる。"},{"q":"What must staff bring when collecting a new card?","o":["A payment method","Their current card","A form of photo identification","A written request"],"a":1,"e":"現行の社員証を持参し、新カードの動作確認後にその場で廃棄される。"},{"q":"What is stated about the canteen payment function?","o":["It requires registration on the staff portal","It replaces the door-key function","It is available as soon as the card is collected","It is limited to certain hours"],"a":0,"e":"社内ポータルで支払い方法を登録するまで無効。ただし解錠機能は登録の有無にかかわらず使える。"}],"ja":["お知らせ ― 新しい社員証について","5月13日の週に、全社員へ新しい社員証をお渡しします。現行の社員証は5月31日の深夜まで有効ですので、月末までは新旧どちらのカードでも解錠できます。","カードは正面ロビーの警備デスクで、午前8時から午後6時の間にお受け取りください。現在お持ちのカードをご持参ください。新しいカードの読み取り確認が済んだ時点で、その場で廃棄します。","新しいカードは社員食堂での支払いカードも兼ねます。この機能は社内ポータルで支払い方法を登録するまで無効です。なお、解錠の機能は登録の有無にかかわらず利用できます。","紛失した場合は当日中に警備部へご報告ください。1回目の再発行に料金はかかりません。"]},{"id":63,"part":4,"cat":"広告","theme":"広告：クリーニング店の新サービス","header":["BRIGHT &amp; CLEAR DRY CLEANERS — Now collecting from your door"],"body":["From 5 June we will collect and return garments at no extra charge within three kilometres of our Castle Street shop. Book a collection slot online by 9:00 P.M. the day before.","Standard cleaning takes three working days from collection. A next-day service is available for an additional 40 percent, but items must be handed in at the shop rather than collected, as the express machines run only at Castle Street.","Wedding dresses and leather goods are quoted individually and are not part of the door-to-door service.","Customers who use the collection service four times receive their fifth cleaning free. The count is linked to your telephone number, so give the same number each time you book."],"questions":[{"q":"What is new from 5 June?","o":["Lower prices for standard cleaning","A second shop on Castle Street","Longer opening hours","A free collection and delivery service"],"a":3,"e":"半径3キロ以内で追加料金なしの集配を開始する。"},{"q":"Why must express items be brought to the shop?","o":["The service is not available to new customers","The garments must be inspected first","The express machines are only at that location","Payment must be made in advance"],"a":2,"e":"速達用の機械がキャッスル通り店にしかないため。"},{"q":"How is the loyalty count tracked?","o":["By the collection address","By e-mail address","By a printed card","By telephone number"],"a":3,"e":"電話番号に紐づけられるため、毎回同じ番号で予約する必要がある。"}],"ja":["ブライト・アンド・クリア クリーニング ― ご自宅までお引き取りに伺います","6月5日より、キャッスル通り店から半径3キロ以内であれば、追加料金なしで衣類の集配を行います。前日午後9時までにオンラインで集荷枠をご予約ください。","通常のクリーニングは集荷から3営業日で仕上がります。翌日仕上げは40パーセント増しでご利用いただけますが、速達用の機械がキャッスル通り店にしかないため、集荷ではなく店頭にお持ち込みいただく必要があります。","ウェディングドレスと革製品は個別見積となり、戸別集配サービスの対象外です。","集配サービスを4回ご利用いただくと、5回目のクリーニングが無料になります。回数はお電話番号に紐づけて記録しますので、ご予約の際は毎回同じ番号をお伝えください。"]},{"id":64,"part":4,"cat":"求人広告","theme":"求人広告：カフェの店長候補","header":["Assistant Manager — Rowan Tree Café, Galway"],"body":["Rowan Tree Café is looking for an Assistant Manager to support the owner in running our forty-seat café. You would open the café three mornings a week from 6:30 A.M., prepare the daily specials board, and supervise a team of five during service.","We ask for two years of experience in a café or restaurant, at least one of them in a supervisory role. A food safety certificate is required; if you do not hold one, we will pay for the course during your first month.","The café closes at 4:00 P.M., so there is no evening work. Hours are 35 per week over five days, including one weekend day.","Send a short message telling us about a service problem you have solved. We do not ask for a formal résumé at this stage."],"questions":[{"q":"What is one responsibility of the role?","o":["Designing the café interior","Managing the café accounts","Supervising staff during service","Ordering equipment for the kitchen"],"a":2,"e":"接客時間帯に5名のチームを監督する。"},{"q":"What is stated about the food safety certificate?","o":["It must be obtained before applying","The café will fund it if necessary","It is optional for supervisors","It is issued by the café"],"a":1,"e":"未取得でも、入社1か月目に講習費用を会社が負担する。"},{"q":"What are applicants asked to send?","o":["A short account of a problem they solved","A copy of their certificate","A formal résumé","Two references"],"a":0,"e":"解決したサービス上の問題について短く書いて送るよう求めている。履歴書は現段階では不要。"}],"ja":["副店長募集 ― ローワン・ツリー・カフェ（ゴールウェイ）","ローワン・ツリー・カフェでは、40席の当店の運営でオーナーを補佐する副店長を募集します。週3回、午前6時30分からの開店業務、日替わりメニュー黒板の準備、接客時間帯における5名のチームの監督を担当していただきます。","カフェまたはレストランでの2年以上の経験を求めます。うち1年以上は監督的立場での経験が必要です。食品衛生の資格が必要ですが、お持ちでない場合は入社1か月目に講習費用を当店が負担します。","当店は午後4時に閉店するため、夜間勤務はありません。勤務は週35時間、5日間で、週末のいずれか1日を含みます。","これまでに解決したサービス上の問題について、短い文章でお知らせください。現段階では正式な履歴書は求めていません。"]},{"id":65,"part":4,"cat":"社内文書","theme":"社内文書：会議室予約の見直し","header":["MEMORANDUM","宛先: All staff","差出人: Workplace Services","日付: 7 February"],"body":["A review of room use in January found that a third of booked rooms were empty at the time reserved. Two changes will take effect on 1 March.","First, a booking will be released automatically if nobody uses the tablet outside the room to confirm arrival within ten minutes of the start time. The room then becomes available to anyone.","Second, recurring bookings will expire after twelve weeks and must be renewed. Existing recurring bookings will be treated as starting on 1 March, so the first renewals fall due in late May.","Rooms 4A and 4B are exempt from both changes because they hold the video equipment used for client calls, which needs to be set up in advance.","Questions should go to Workplace Services rather than to the reception desk."],"questions":[{"q":"What problem prompted the changes?","o":["Rooms were being booked but not used","The tablets were frequently broken","Client calls were being interrupted","Too few rooms were available"],"a":0,"e":"1月の調査で、予約された部屋の3分の1が予約時刻に空だったことが判明した。"},{"q":"When will the first renewals of recurring bookings be due?","o":["In twelve months","In early March","On 1 February","In late May"],"a":3,"e":"3月1日開始として12週後なので5月下旬。本文にも明記されている。"},{"q":"Why are Rooms 4A and 4B treated differently?","o":["They are larger than the other rooms","They are used by senior staff only","They contain equipment that must be prepared beforehand","They have no tablet outside the door"],"a":2,"e":"顧客との通話に使う映像機器を事前に設営する必要があるため、両方の変更の対象外。"}],"ja":["社内連絡　宛先：全社員　差出人：職場サービス部　日付：2月7日","1月の会議室利用状況の調査で、予約された部屋の3分の1が予約時刻に無人であったことが分かりました。3月1日より2つの変更を実施します。","第一に、開始時刻から10分以内に室外のタブレットで到着確認が行われない予約は自動的に解除されます。その部屋は誰でも利用できる状態になります。","第二に、繰り返しの予約は12週間で期限切れとなり、更新が必要になります。既存の繰り返し予約は3月1日開始として扱いますので、最初の更新期限は5月下旬になります。","4A室と4B室は、顧客との通話に使う映像機器が置かれ、事前の設営が必要なため、いずれの変更の対象からも外します。","ご質問は受付ではなく職場サービス部までお願いします。"]},{"id":66,"part":4,"cat":"記事","theme":"記事：バスターミナルの改修","header":["Kesterly Herald — 8 March"],"body":["Work to rebuild the bus terminal beside Kesterly station will begin on 1 April and is expected to take fourteen months. During that period all services will use temporary stands on Mill Road, a four-minute walk from the station entrance.","The rebuilt terminal will have eight stands, two more than at present, and a covered waiting area with seating for sixty. The council says the extra stands will allow two routes that currently terminate outside the town to run into the centre.","Shopkeepers on Mill Road have raised concerns about deliveries. The council has agreed that the temporary stands will not be in use before 7:00 A.M., leaving a window for lorries each morning.","The project is funded jointly by the council and the regional transport authority. Neither body has released the total cost."],"questions":[{"q":"Where will buses stop during the work?","o":["Outside the town centre","On Mill Road","At the station entrance","At the existing terminal"],"a":1,"e":"工事期間中は駅から徒歩4分のミル通りの仮設乗り場を使う。"},{"q":"What benefit of the extra stands is mentioned?","o":["Two more routes will reach the centre","Shorter waiting times between services","Lower fares on local routes","More seating for passengers"],"a":0,"e":"現在は町外で終点となっている2路線が中心部まで乗り入れられるようになる。"},{"q":"What concession was made to shopkeepers?","o":["Mill Road will stay open to cars","Shops will receive compensation","Deliveries will be made by the council","Buses will not use the stands early in the morning"],"a":3,"e":"午前7時前は仮設乗り場を使わないことで、配送トラックの時間帯を確保した。"}],"ja":["ケスタリー・ヘラルド 3月8日","ケスタリー駅横のバスターミナルの建て替え工事が4月1日に始まり、14か月を要する見込みである。その期間、全路線は駅入口から徒歩4分のミル通りの仮設乗り場を使用する。","新しいターミナルには現在より2つ多い8つの乗り場と、60席の屋根付き待合スペースが設けられる。増設される乗り場により、現在は町外で終点となっている2路線が中心部まで乗り入れられるようになると議会は述べている。","ミル通りの商店主からは配送に関する懸念が出ていた。議会は、仮設乗り場を午前7時前には使用しないことに同意し、毎朝トラックのための時間帯が確保される。","本事業は議会と地域交通局が共同で出資している。総費用はいずれの機関も公表していない。"]},{"id":67,"part":4,"cat":"手紙","theme":"手紙：受賞の通知","header":["The Nordholm Design Prize","宛先: Ms. Tuva Lindgren","日付: 11 September"],"body":["Dear Ms. Lindgren,","I am delighted to tell you that your entry &quot;Folding Bench&quot; has been selected as one of three finalists in this year&#x27;s Nordholm Design Prize. The judges praised the way the piece can be assembled without tools.","The winner will be announced at the award evening in Malmö on 24 October. All three finalists receive 15,000 SEK; the winner receives a further 60,000 SEK and a place in the touring exhibition that opens in February.","We would like to display your prototype at the award evening. If you are able to send it, it must reach us by 10 October so that the display can be built around the three pieces. We will return it, carriage paid, within two weeks of the exhibition.","Sincerely,","Ingrid Falk, Prize Secretary"],"questions":[{"q":"What is the purpose of the letter?","o":["To inform Ms. Lindgren that she is a finalist","To announce the winner of a prize","To request a change to an entry","To invite Ms. Lindgren to judge a competition"],"a":0,"e":"最終候補3名の1人に選ばれたことを伝える通知。優勝者の発表は10月24日。"},{"q":"What will all three finalists receive?","o":["A place in the touring exhibition","60,000 SEK","15,000 SEK","A prototype display"],"a":2,"e":"最終候補3名全員に15,000クローナ。優勝者にはさらに60,000クローナと巡回展への出品権。"},{"q":"Why must the prototype arrive by 10 October?","o":["To be repaired before the evening","To be photographed for the catalogue","To allow the display to be constructed","To be judged a second time"],"a":2,"e":"3点を軸に展示台を組むため、10月10日までに届く必要がある。"}],"ja":["ノードホルム・デザイン賞　宛先：トゥーヴァ・リンドグレン様　日付：9月11日","リンドグレン様","ご応募いただいた「フォールディング・ベンチ」が、本年度ノードホルム・デザイン賞の最終候補3点のひとつに選ばれましたことをお知らせします。審査員は、工具なしで組み立てられる点を高く評価しました。","受賞者は10月24日にマルメで行われる授賞式で発表されます。最終候補3名にはそれぞれ15,000スウェーデンクローナ、受賞者にはさらに60,000クローナと、2月に始まる巡回展への出品権が贈られます。","授賞式では試作品を展示したく存じます。ご送付いただける場合は、3点を軸に展示台を組む都合上、10月10日までに当方へ到着する必要があります。展覧会終了後2週間以内に、送料当方負担でご返送します。","イングリッド・ファルク（賞事務局）"]},{"id":68,"part":4,"cat":"チャット","theme":"チャット：試供品発送の手配","header":["Team chat — Monday, 2:15 P.M."],"body":["<b>Ravi Menon (2:15 P.M.)</b> The sample boxes for the Helsinki buyers are packed, but we only have twelve and the guest list now shows fifteen.","<b>Sofia Brandt (2:17 P.M.)</b> Can we split the contents? Each box has four items, so three items each would cover fifteen.","<b>Ravi Menon (2:19 P.M.)</b> The fourth item is the new finish, which is the whole reason for the meeting. I'd rather send twelve complete boxes and post three more on Wednesday.","<b>Sofia Brandt (2:21 P.M.)</b> The meeting is Thursday morning. Posting Wednesday means they arrive after it.","<b>Ravi Menon (2:23 P.M.)</b> Then I'll drive the three over myself on Wednesday evening. It's two hours each way, but arriving empty-handed in front of three buyers is worse."],"questions":[{"q":"What is the problem?","o":["There are fewer sample boxes than guests","The meeting has been moved to Thursday","The samples were damaged in transit","The new finish is not ready"],"a":0,"e":"試供品の箱が12個しかないのに、来訪予定者は15名。"},{"q":"Why does Mr. Menon reject the idea of splitting the boxes?","o":["The buyers have already seen three items","The fourth item is central to the meeting","The boxes cannot be opened","It would take too long to repack"],"a":1,"e":"4点目が新しい仕上げで、会合の目的そのものだから。"},{"q":"At 2:23 P.M., what does Mr. Menon decide to do?","o":["Ask the buyers to share samples","Deliver the remaining boxes in person","Cancel the meeting","Send the boxes by courier"],"a":1,"e":"水曜の夕方に自分で車で3箱を届けると述べている。片道2時間でも手ぶらで臨むよりましだ、という判断。"}],"ja":["チームチャット 月曜日 午後2時15分","ラヴィ・メノン（2:15）ヘルシンキのバイヤー向け試供品の箱は梱包済みですが、12個しかなく、来訪予定者は現在15名です。","ソフィア・ブラント（2:17）中身を分けられませんか。1箱に4点入っているので、3点ずつにすれば15名分になります。","ラヴィ・メノン（2:19）4点目は新しい仕上げで、それこそが今回の会合の目的です。完全な12箱を送り、残り3箱は水曜に発送したいです。","ソフィア・ブラント（2:21）会合は木曜の午前です。水曜発送では到着が会合の後になります。","ラヴィ・メノン（2:23）では水曜の夕方に3箱を私が車で届けます。片道2時間ですが、3名のバイヤーの前に手ぶらで出るほうがよほど困ります。"]},{"id":69,"part":4,"cat":"案内","theme":"案内：陶芸教室の持ち物","header":["Clayworks Studio — Beginners&#x27; Weekend"],"body":["The course runs on Saturday 8 and Sunday 9 June, from 10:00 A.M. to 4:00 P.M. both days. The fee of €130 covers clay, tools, and firing.","Wear clothing you do not mind marking and bring a towel. Please leave rings and bracelets at home; they cannot be worn at the wheel, and we have nowhere secure to store them.","Lunch is not provided. There is a bakery two doors along, and you are welcome to eat in the courtyard.","Pieces made on the course must be fired before you can take them home, which takes about ten days. You may collect them from the studio during opening hours, or pay €12 to have them posted.","The studio is on the first floor and is reached by stairs only. Please tell us in advance if this presents a difficulty, as we can move a session to the ground-floor room."],"questions":[{"q":"What is included in the fee?","o":["Materials and firing","A towel","Lunch on both days","Postage of finished pieces"],"a":0,"e":"130ユーロには粘土・道具・焼成が含まれる。昼食と郵送は別。"},{"q":"Why are participants asked not to wear jewellery?","o":["It cannot be worn at the wheel and cannot be stored safely","It may be damaged by the clay","It is against studio insurance rules","It interferes with the firing process"],"a":0,"e":"ろくろでは着用できず、安全に預かる場所もないため。"},{"q":"What should participants do if they cannot use stairs?","o":["Arrive earlier on the first day","Choose a different course","Inform the studio beforehand","Ask for a refund"],"a":2,"e":"事前に伝えれば1階の部屋に振り替えられる。"}],"ja":["クレイワークス工房 ― 初心者向け週末講座","講座は6月8日（土）と9日（日）、両日とも午前10時から午後4時まで行います。受講料130ユーロには粘土、道具、焼成が含まれます。","汚れてもよい服装でお越しになり、タオルをご持参ください。指輪や腕輪はご自宅に置いてきてください。ろくろでは着用できず、安全にお預かりする場所もありません。","昼食のご用意はありません。2軒隣にパン屋があり、中庭でお召し上がりいただけます。","講座で制作した作品はお持ち帰りの前に焼成が必要で、約10日かかります。営業時間中に工房で受け取っていただくか、12ユーロで郵送いたします。","工房は2階にあり、階段のみでのご案内となります。差し支えのある方は事前にお知らせください。1階の部屋に振り替えることができます。"]},{"id":70,"part":4,"cat":"注文確認","theme":"注文確認：オンライン注文の確認","header":["ORDER CONFIRMATION — Halden Home","注文番号: HH-40218","注文日: 3 March"],"body":["Items: 2 armchairs at $290 each = $580; 1 side table at $145; 1 floor lamp at $95. Goods total: $820. Delivery: $60. Sales tax: $88. Amount charged: $968.","The armchairs are in stock and will be delivered on 12 March between 8:00 A.M. and noon. The side table and the lamp come from our Ontario warehouse and will follow on 19 March. You have been charged one delivery fee only.","Someone aged eighteen or over must be present to sign for each delivery. If nobody is at the address, the driver will leave a card and the items will return to the depot; a second attempt costs $35.","Report any damage within forty-eight hours of delivery, with a photograph, to claims@haldenhome.com."],"questions":[{"q":"What is indicated about the delivery charge?","o":["It covers both deliveries","It is included in the goods total","It is refunded if delivery is delayed","It is charged for each of the two deliveries"],"a":0,"e":"2回に分かれて配送されるが、配送料は1回分のみ請求されている。"},{"q":"What will happen if no one is at home?","o":["The order will be canceled","The items will be left with a neighbour","The driver will return later the same day","A card will be left and a fee applies to the next attempt"],"a":3,"e":"不在時は不在票が置かれ、商品は営業所に戻る。再配達は35ドル。"},{"q":"What is required when reporting damage?","o":["A signed form","A photograph","The original packaging","A visit to the store"],"a":1,"e":"配達から48時間以内に、写真を添えてメールで報告する。"}],"ja":["ご注文確認 ― ハルデン・ホーム　注文番号：HH-40218　注文日：3月3日","商品：肘掛け椅子2脚（各290ドル）＝580ドル、サイドテーブル1台145ドル、フロアランプ1台95ドル。商品合計820ドル。配送料60ドル。消費税88ドル。ご請求額968ドル。","肘掛け椅子は在庫があり、3月12日の午前8時から正午の間にお届けします。サイドテーブルとランプはオンタリオ倉庫からの発送となり、3月19日に続けてお届けします。配送料は1回分のみのご請求です。","各回のお届けには、18歳以上の方の署名が必要です。ご不在の場合は不在票を投函し、商品は営業所に戻ります。再配達には35ドルかかります。","破損があった場合は、配達から48時間以内に写真を添えて claims@haldenhome.com までご報告ください。"]},{"id":71,"part":4,"cat":"レビュー","theme":"レビュー：ホテル滞在の評価","header":["Traveller review — The Ashgrove, Edinburgh | ★★★☆☆ | by P. Sandoval"],"body":["I stayed three nights on business. The location is the reason to book here: the conference centre is a seven-minute walk and there is a tram stop outside the door.","The room was clean and quiet, which matters more to me than decoration, and the desk was large enough to work at properly. Breakfast, however, is served only until 8:30 A.M., which is early for a city hotel and meant I skipped it twice.","The bigger issue was check-in. Only one of the three desks was staffed at 6:00 P.M., and I waited twenty-five minutes behind four people. Staff apologised and were pleasant, so this seems to be a staffing decision rather than an attitude problem.","I would stay again for the location, but I would arrive outside the early-evening rush."],"questions":[{"q":"Why does the reviewer recommend the hotel?","o":["For its breakfast","For its decoration","For its room service","For its position"],"a":3,"e":"会議場まで徒歩7分、路面電車の停留所が目の前という立地が予約の理由だと述べている。"},{"q":"What does the reviewer say about the staff?","o":["They opened an extra desk","They were polite despite the delay","They were poorly trained","They refused to apologise"],"a":1,"e":"謝罪があり感じもよかったので、態度ではなく人員配置の問題だと見ている。"},{"q":"What does the reviewer say he would do differently?","o":["Stay for fewer nights","Have breakfast elsewhere","Book a room on a higher floor","Arrive at a different time of day"],"a":3,"e":"夕方の混雑時間帯を外して到着するようにする、と述べている。"}],"ja":["旅行者レビュー ― ジ・アッシュグローブ（エディンバラ）★★★☆☆　投稿者 P・サンドバル","出張で3泊した。ここを予約する理由は立地だ。会議場まで徒歩7分、路面電車の停留所が玄関前にある。","部屋は清潔で静かだった。私には内装より重要な点だ。机も仕事をするのに十分な大きさだった。ただし朝食は午前8時30分までしか提供されない。都市部のホテルとしては早く、2回は食べそびれた。","より大きな問題はチェックインだった。午後6時の時点で3つのカウンターのうち1つしか人がおらず、4人の後ろで25分待った。職員は謝罪してくれたし感じもよかったので、態度の問題ではなく人員配置の判断だろう。","立地のためにまた泊まるだろうが、夕方の混雑時間帯を外して到着するようにしたい。"]},{"id":72,"part":4,"cat":"プレスリリース","theme":"プレスリリース：大学との共同研究","header":["JOINT ANNOUNCEMENT — Corvin Foods and Larkfield University"],"body":["Corvin Foods and Larkfield University have signed a three-year agreement to study how packaging affects the shelf life of fresh bread. The work will be carried out at the university&#x27;s food science laboratory, with Corvin providing samples from its Dunmore bakery each week.","Corvin will fund two research posts. The university will own the results and will publish them; Corvin has the right to see each paper thirty days before publication but cannot prevent it appearing.","The company currently discards about four percent of its bread output. Reducing this figure is the stated aim of the project, though neither party has set a target.","A first summary of findings is expected eighteen months from the start date of 1 September."],"questions":[{"q":"What is the aim of the project?","o":["To open a second bakery","To train university students","To reduce the amount of bread discarded","To develop a new type of bread"],"a":2,"e":"現在約4パーセント廃棄されているパンを減らすことが目的とされている。"},{"q":"What right does Corvin Foods have?","o":["To own the research results","To choose which papers are published","To appoint the researchers","To see papers before they appear"],"a":3,"e":"公表30日前に論文を閲覧できるが、公表を止めることはできない。"},{"q":"When is the first summary of findings expected?","o":["On 1 September","Within thirty days","In eighteen months","After three years"],"a":2,"e":"9月1日の開始から18か月後に最初の要約が出る見込み。"}],"ja":["共同発表 ― コーヴィン・フーズおよびラークフィールド大学","コーヴィン・フーズとラークフィールド大学は、包装が食パンの日持ちに与える影響を研究する3年間の協定を締結した。研究は同大学の食品科学研究室で行われ、コーヴィン社はダンモア工場から毎週サンプルを提供する。","コーヴィン社は研究職2名分の資金を提供する。研究成果の権利は大学に帰属し、大学が公表する。コーヴィン社は公表の30日前に各論文を閲覧する権利を持つが、公表を差し止めることはできない。","同社は現在、製造したパンの約4パーセントを廃棄している。この数値を下げることが本事業の目的とされているが、具体的な目標値はいずれの当事者も設定していない。","最初の研究成果の要約は、開始日である9月1日から18か月後に出る見込みである。"]},{"id":73,"part":4,"cat":"日程表","theme":"日程表：新入社員研修の初週","header":["Induction Week — Programme for new starters"],"body":["Monday<br>09:30  Welcome and building tour<br>11:00  IT setup — bring your own laptop if you have one<br>14:00  Introduction to our clients<br><br>Tuesday<br>09:30  Health and safety (compulsory)<br>13:30  Department visits — see your personal schedule<br><br>Wednesday to Friday<br>With your team; no central sessions","The Tuesday morning session is the only compulsory item. If illness prevents you from attending, it runs again on the first Tuesday of the following month and you must join that date.","Lunch is provided on Monday and Tuesday in the fourth-floor canteen. From Wednesday you make your own arrangements.","Your line manager will meet you at 09:15 on Monday in the reception area. If you have not been told who this is by Friday, contact People Operations rather than waiting until Monday."],"questions":[{"q":"Which session must all new starters attend?","o":["The introduction to clients","The health and safety session","The building tour","The department visits"],"a":1,"e":"火曜午前の安全衛生が唯一の必須項目。"},{"q":"What should a new starter do if no line manager has been named by Friday?","o":["Attend the session the following month","Wait until Monday morning","Ask at the reception desk","Contact People Operations"],"a":3,"e":"月曜まで待たずに人事運営部へ連絡するよう指示されている。"},{"q":"What is stated about lunch?","o":["It must be eaten in the canteen","It is provided on the first two days","It is charged to the department","It is provided all week"],"a":1,"e":"月曜と火曜のみ提供され、水曜以降は各自で用意する。"}],"ja":["入社研修週間 ― 新入社員向け日程","月曜日<br>09:30 歓迎と館内案内<br>11:00 IT設定（お持ちの方はご自身のノートパソコンをご持参ください）<br>14:00 顧客のご紹介<br><br>火曜日<br>09:30 安全衛生（必須）<br>13:30 各部署訪問（個別の日程表をご確認ください）<br><br>水曜〜金曜<br>チームでの活動。全体セッションはありません。","必須項目は火曜午前のセッションのみです。体調不良で出席できない場合は、翌月の第1火曜日に同じ内容を実施しますので、その日にご参加ください。","昼食は月曜と火曜に4階の食堂で提供します。水曜以降は各自でご用意ください。","月曜の午前9時15分に、受付エリアで直属の上司がお迎えします。金曜までに担当者が知らされていない場合は、月曜まで待たずに人事運営部へご連絡ください。"]},{"id":74,"part":4,"cat":"取扱説明","theme":"取扱説明：加湿器の手入れ","header":["Care instructions — Room humidifier HX-9"],"body":["Empty and rinse the tank every day, even if water remains. Water left standing for more than twenty-four hours is the main cause of the smell that users report.","Once a week, fill the tank with a mixture of one part white vinegar to three parts water, leave it for thirty minutes, then rinse twice. Do not use bleach; it damages the seal and voids the guarantee.","The filter should be replaced every three months, or sooner if it turns yellow. Replacement filters are sold in packs of two and fit both the HX-9 and the older HX-7.","If the unit switches off by itself, the tank is probably not seated correctly. Lift it out and set it down again; the mechanism releases only when the tank is level."],"questions":[{"q":"What causes the smell that users report?","o":["Replacing the filter too often","Using vinegar to clean the tank","Running the unit overnight","Leaving water in the tank too long"],"a":3,"e":"24時間以上たまったままの水が主な原因とされている。"},{"q":"What is stated about bleach?","o":["It should be diluted before use","It damages the seal and voids the guarantee","It may be used once a month","It is supplied with the unit"],"a":1,"e":"漂白剤はパッキンを傷め、保証も無効になる。"},{"q":"What is the likely cause if the unit turns itself off?","o":["The tank is not sitting level","The filter has expired","The water is too cold","The vinegar mixture is too strong"],"a":0,"e":"タンクが正しく水平に据わっていない可能性が高い。"}],"ja":["お手入れ方法 ― 室内用加湿器 HX-9","水が残っていても、毎日タンクを空にしてすすいでください。24時間以上そのままにした水が、利用者から報告されるにおいの主な原因です。","週に1回、ホワイトビネガー1に対し水3の割合で満たし、30分置いてから2回すすいでください。漂白剤は使用しないでください。パッキンを傷め、保証も無効になります。","フィルターは3か月ごとに交換してください。黄色く変色した場合はそれより早く交換します。交換用フィルターは2個入りで販売されており、HX-9と旧型のHX-7の両方に適合します。","本体がひとりでに停止する場合は、タンクが正しく据わっていない可能性が高いです。一度持ち上げて置き直してください。タンクが水平でないと機構が解除されません。"]},{"id":75,"part":4,"cat":"Eメール","theme":"Eメール：請求書の記載誤りの指摘","header":["宛先: billing@stanwyckprint.com","差出人: Meera Kapoor, Office Manager","件名: Invoice SP-9914 — quantity query"],"body":["Dear Billing Team,","Invoice SP-9914, dated 6 May, charges us for 5,000 folded leaflets. Our purchase order, PO-2287, specifies 3,000, and the delivery note signed by our receptionist also records 3,000 boxes-worth.","I suspect the figure was carried over from our March order, which was indeed 5,000. Could you check and, if you agree, issue a credit note for the difference rather than a replacement invoice? Our system has already logged SP-9914, and a credit note is simpler for us to reconcile.","We will pay the undisputed amount by the due date of 5 June so that the account does not fall overdue while this is settled.","Meera Kapoor"],"questions":[{"q":"What is the problem with the invoice?","o":["It omits the purchase order number","It shows a larger quantity than ordered","It arrived after the due date","It was sent to the wrong company"],"a":1,"e":"注文は3,000部だが、請求は5,000部になっている。"},{"q":"What does Ms. Kapoor ask the supplier to issue?","o":["A refund by cheque","A replacement invoice","A credit note","A new delivery note"],"a":2,"e":"自社システムに登録済みのため、差額分の貸方票（credit note）を求めている。"},{"q":"What does Ms. Kapoor say she will do?","o":["Withhold payment until the matter is settled","Cancel the purchase order","Return the leaflets that were not ordered","Pay the part of the bill that is not disputed"],"a":3,"e":"延滞にならないよう、争いのない金額は6月5日の期日までに支払うと述べている。"}],"ja":["宛先：スタンウィック印刷 請求担当　差出人：ミーラ・カプール（総務課長）　件名：請求書SP-9914 数量に関する照会","請求ご担当者様","5月6日付の請求書SP-9914では、二つ折りチラシ5,000部分が請求されています。当社の発注書PO-2287では3,000部を指定しており、当社受付が署名した納品書にも3,000部相当と記録されています。","3月の注文が実際に5,000部でしたので、その数値がそのまま引き継がれたのではないかと推測しています。ご確認のうえ、もしご同意いただけるようでしたら、請求書の再発行ではなく差額分の貸方票をご発行いただけますか。当社システムではSP-9914をすでに登録済みで、貸方票のほうが照合が容易です。","本件の解決中に口座が延滞とならないよう、争いのない金額は6月5日の期日までにお支払いします。","ミーラ・カプール"]},{"id":76,"part":4,"cat":"お知らせ","theme":"お知らせ：社内図書コーナーの設置","header":["NOTICE — Staff Library, Room 2F"],"body":["A small library has been set up in Room 2F, next to the quiet room. It holds about four hundred titles, most of them donated by colleagues, together with twenty subscriptions to trade journals.","Books may be borrowed for four weeks. Write your name and the date in the notebook by the door; there is no electronic system, and nothing is checked automatically. Journals must stay in the room, as they are the only copies we hold.","You are welcome to donate books you no longer need, but please do not leave them in the room without telling us. Space is limited, and titles that duplicate what is already on the shelves will be passed to a local charity.","The room is open whenever the building is. Suggestions for purchases can be left in the same notebook."],"questions":[{"q":"How is borrowing recorded?","o":["By scanning a staff card","By e-mailing the librarian","By writing in a notebook","By an electronic system"],"a":2,"e":"電子システムはなく、扉の脇のノートに氏名と日付を記入する。"},{"q":"What is stated about the journals?","o":["They are donated by colleagues","They cannot be taken out of the room","They are replaced every year","They may be borrowed for four weeks"],"a":1,"e":"所蔵が1部ずつしかないため、室外への持ち出しはできない。"},{"q":"What may happen to donated books?","o":["They will be sold to raise funds","They will be stored in the quiet room","They will be returned if unwanted","They may be given to a charity if they duplicate existing titles"],"a":3,"e":"場所が限られているため、既存の蔵書と重複する本は地域の慈善団体に回される。"}],"ja":["お知らせ ― 社内図書コーナー（2F室）","静音室の隣の2F室に、小さな図書コーナーを設けました。同僚から寄贈された蔵書を中心に約400点と、業界誌20誌の定期購読があります。","書籍は4週間まで借りられます。扉の脇のノートにお名前と日付をご記入ください。電子的な仕組みはなく、自動で記録されるものは何もありません。雑誌は当社で所蔵する唯一の一部ですので、室外への持ち出しはご遠慮ください。","不要になった本のご寄贈は歓迎しますが、お知らせなく室内に置いていくことはお控えください。場所が限られており、すでに棚にあるものと重複する本は地域の慈善団体にお渡しします。","建物が開いている間はいつでもご利用いただけます。購入のご希望も同じノートにご記入ください。"]},{"id":77,"part":4,"cat":"社内報","theme":"社内報：緑化プロジェクトの報告","header":["Site Bulletin — Green Roof Project"],"body":["Planting on the warehouse roof finished last week, three weeks later than planned because of the wet spring. The area now carries 900 square metres of low-growing plants chosen for their tolerance of wind.","Measurements taken over the summer will tell us whether the roof reduces cooling costs in the offices below, as the supplier predicts. Two temperature sensors have been installed, one under the planted section and one under the bare section that has been left for comparison.","Volunteers are asked for two hours a month to check the drainage outlets. No gardening experience is needed; the plants themselves require no watering once established.","Anyone wishing to help should speak to Dan Oyelaran in Facilities. Roof access is by the external staircase and requires a short safety briefing."],"questions":[{"q":"Why did the planting finish later than planned?","o":["The weather was wet","Volunteers were unavailable","The plants arrived late","The roof needed repair"],"a":0,"e":"春の長雨のため、予定より3週間遅れた。"},{"q":"Why has part of the roof been left unplanted?","o":["To provide access for maintenance","To allow a comparison of temperatures","Because funding ran out","To store equipment"],"a":1,"e":"植栽部分と裸の部分の下に温度センサーを1つずつ置き、比較するため。"},{"q":"What is required of volunteers?","o":["Two hours a month and a safety briefing","Membership of the Facilities team","Daily watering of the plants","Gardening experience"],"a":0,"e":"月2時間の排水口点検と、屋上に上がるための短い安全説明が必要。園芸経験は不要。"}],"ja":["事業所だより ― 屋上緑化プロジェクト","倉庫屋上の植栽が先週完了しました。春の長雨のため、予定より3週間遅い完了となりました。現在、風に強い品種を選んだ背の低い植物が900平方メートルに植えられています。","夏の間の計測により、供給業者が予測するとおり、屋上が下階のオフィスの冷房費を下げるかどうかが分かります。温度センサーを2つ設置しており、1つは植栽部分の下、もう1つは比較のために残した植栽のない部分の下にあります。","ボランティアとして月2時間、排水口の点検にご協力いただける方を募集しています。園芸の経験は不要です。植物は根づいてしまえば水やりも要りません。","ご協力いただける方は施設管理部のダン・オイェラランまでお知らせください。屋上へは外階段からで、短い安全説明を受ける必要があります。"]},{"id":78,"part":4,"cat":"報告書","theme":"報告書：問い合わせ件数の分析","header":["Customer Contact Report — Third Quarter"],"body":["We handled 12,400 contacts, seven percent more than in the second quarter. Telephone calls fell by a fifth, while messages through the Web form rose by nearly half.","The largest single topic was order tracking, at 31 percent of all contacts. Most of these came within two days of dispatch, before the carrier&#x27;s tracking page begins to show movement. Adding an explanatory line to the dispatch e-mail is the cheapest way to reduce them, and this is now being drafted.","Complaints about damaged goods stayed flat at 4 percent, despite the higher volume of orders, which suggests packaging changes made in April are holding.","Average response time for Web messages was eleven hours, against a target of eight. The team was two people short for six weeks of the quarter."],"questions":[{"q":"What change in contact methods is reported?","o":["Neither method changed significantly","Calls decreased while Web messages increased","Calls increased while Web messages decreased","Both calls and Web messages increased"],"a":1,"e":"電話は5分の1減り、ウェブフォーム経由は5割近く増えた。"},{"q":"What is proposed to reduce tracking enquiries?","o":["Employing more staff","Extending the tracking page","Changing the carrier","Adding information to the dispatch e-mail"],"a":3,"e":"発送メールに説明の一文を加えるのが最も安価な方法とされ、現在文面を作成中。"},{"q":"Why was the response time target missed?","o":["The team was understaffed for part of the quarter","The target was lowered during the quarter","The Web form was unavailable","Complaints about damage increased"],"a":0,"e":"四半期のうち6週間、2名不足の状態だった。"}],"ja":["顧客対応報告 ― 第3四半期","対応件数は12,400件で、第2四半期より7パーセント増加しました。電話は5分の1減少した一方、ウェブフォーム経由のメッセージは5割近く増加しました。","最も多かった話題は配送状況の確認で、全体の31パーセントを占めます。その大半は発送から2日以内、運送会社の追跡ページに動きが表示される前に寄せられていました。発送通知メールに説明の一文を加えるのが最も安価な削減策であり、現在その文面を作成中です。","破損品に関する苦情は注文数の増加にもかかわらず4パーセントで横ばいでした。4月に実施した梱包の変更が効果を保っていることを示しています。","ウェブメッセージの平均応答時間は11時間で、目標の8時間に届きませんでした。当四半期のうち6週間、チームは2名不足の状態でした。"]},{"id":79,"part":4,"cat":"Eメール","theme":"Eメール：会議の議題募集","header":["宛先: Regional managers","差出人: Alina Costa","件名: Agenda items for 14 June"],"body":["Colleagues,","Our half-day meeting takes place on 14 June from 9:00 A.M. to 1:00 P.M. Three slots on the agenda are still open, each of twenty minutes.","If you would like one, reply by 31 May with the topic and what you want the meeting to decide. I will not schedule an item that is for information only; those can go in the written update circulated the week before.","Two items are already fixed: the pricing review, which the finance team will lead, and the depot closure, which we deferred from March.","Please note the change of venue. We are meeting at the Bracknell office, not at head office as in previous years, because the room here seats twenty-four and we now number twenty-six.","Alina"],"questions":[{"q":"What must a proposed agenda item include?","o":["A decision the meeting should reach","Approval from the finance team","A written summary of one page","An estimate of the cost involved"],"a":0,"e":"議題名に加えて、会議で何を決めたいのかを記す必要がある。報告のみの項目は取り上げない。"},{"q":"What will happen to items that are for information only?","o":["They will be deferred to the next meeting","They will be included in a written update","They will be discussed at the end of the meeting","They will be given a shorter slot"],"a":1,"e":"前週に配布される書面の更新に回される。"},{"q":"Why has the venue changed?","o":["The Bracknell office is nearer for most managers","The meeting has been shortened","The usual room is too small for the group","Head office is being renovated"],"a":2,"e":"本社の部屋は24名分だが、現在の人数は26名になったため。"}],"ja":["宛先：地域責任者各位　差出人：アリーナ・コスタ　件名：6月14日の議題募集","皆さん","半日会議は6月14日の午前9時から午後1時まで行います。議題の枠が3つ空いており、それぞれ20分です。","ご希望の方は、5月31日までに議題名と、会議で何を決めたいのかを添えてご返信ください。報告のみの項目は枠を設けません。それらは前週に配布する書面の更新に載せてください。","すでに確定している議題は2件です。財務チームが進行する価格見直しと、3月から持ち越した集配所の閉鎖です。","会場が変わる点にご注意ください。例年の本社ではなくブラックネル事業所で行います。本社の部屋は24名分の席しかなく、現在の人数は26名になったためです。","アリーナ"]},{"id":80,"part":4,"cat":"お知らせ","theme":"お知らせ：健康診断の実施","header":["NOTICE — Annual Health Checks"],"body":["The mobile clinic will visit the site from 21 to 25 October. Appointments last twenty minutes and cover blood pressure, hearing, and eyesight. Booking opens on 30 September through the staff portal.","Checks are voluntary for office staff. For anyone who operates machinery, the hearing test is required by our insurer once a year; if you miss the visit, arrange a test with your own doctor and send the result to Occupational Health by 30 November.","Appointments are during working hours and are treated as working time, so there is no need to make up the twenty minutes.","Results go to you directly, not to your manager. Occupational Health receives only confirmation that the hearing test was completed, without the reading itself."],"questions":[{"q":"Who must have the hearing test?","o":["Anyone booking through the portal","All employees","Staff who operate machinery","Office staff only"],"a":2,"e":"機械を扱う社員は保険会社の要件により年1回の聴力検査が必須。事務職は任意。"},{"q":"What should machinery operators do if they miss the visit?","o":["Book a second appointment on the portal","Inform their manager in writing","Arrange their own test and send the result","Wait for next year&#x27;s clinic"],"a":2,"e":"かかりつけ医で検査を受け、11月30日までに産業保健部門へ結果を送る。"},{"q":"What does Occupational Health receive?","o":["Nothing at all","A copy sent by the employee&#x27;s manager","Only confirmation that the hearing test was done","The full results of each check"],"a":2,"e":"数値そのものは受け取らず、聴力検査を受けたという確認のみが渡る。"}],"ja":["お知らせ ― 定期健康診断","巡回診療車が10月21日から25日まで当事業所を訪問します。所要は1件20分で、血圧、聴力、視力を検査します。予約は9月30日より社内ポータルで受け付けます。","事務職の受診は任意です。機械を扱う方については、保険会社の要件により年1回の聴力検査が必須です。訪問期間に受けられなかった場合は、ご自身のかかりつけ医で検査を受け、11月30日までに結果を産業保健部門へお送りください。","予約は勤務時間内に設定され、勤務時間として扱われますので、20分を後から埋め合わせる必要はありません。","結果はご本人に直接届き、上司には渡りません。産業保健部門が受け取るのは、聴力検査を受けたという確認のみで、測定値そのものは含まれません。"]},{"id":81,"part":5,"cat":"Eメール","theme":"Eメール：通訳の手配","header":["宛先: Bookings, Linden Language Services","差出人: Hugo Berndt, Aurex Machinery","日付: 4 September","件名: Interpreter for 16–17 October"],"body":["Dear Bookings Team,","We need a German-to-Japanese interpreter for our stand at the Hannover machinery fair on 16 and 17 October, from 9:00 A.M. to 5:00 P.M. on both days.","The work is consecutive interpreting in conversation with visitors, not conference interpreting from a booth. Most exchanges last five to ten minutes and concern hydraulic pumps; we will send a two-page glossary of our product names a fortnight beforehand.","Please quote for the two days including any travel and accommodation you would charge. If the same interpreter cannot cover both days, we would rather book one person for one day than two people across the two, as continuity matters more to us than full coverage.","Hugo Berndt"],"questions":[{"q":"What kind of interpreting is required?","o":["Telephone interpreting from an office","Simultaneous interpreting from a booth","Written translation of a glossary","Conversation with visitors at a stand"],"a":3,"e":"ブースからの会議通訳ではなく、来訪者との会話における逐次通訳。"},{"q":"What will Mr. Berndt send in advance?","o":["A list of expected visitors","A copy of the stand layout","Travel tickets","A glossary of product names"],"a":3,"e":"2週間前に自社製品名の用語集2ページを送ると述べている。"},{"q":"What does Mr. Berndt say he would prefer?","o":["A lower rate for the second day","One interpreter for a single day","An interpreter based in Hannover","Two interpreters covering both days"],"a":1,"e":"継続性を重視するため、2名で2日間より1名で1日のほうがよいとしている。"}],"ja":["宛先：リンデン言語サービス 予約担当　差出人：フーゴ・ベルント（オーレックス機械）　件名：10月16〜17日の通訳について","ご予約ご担当者様","10月16日と17日、ハノーバー機械見本市の当社ブースにて、両日とも午前9時から午後5時まで、ドイツ語から日本語への通訳者を必要としています。","業務はブースからの会議通訳ではなく、来訪者との会話における逐次通訳です。やり取りの多くは5〜10分程度で、油圧ポンプに関するものです。当社製品名の用語集2ページを2週間前にお送りします。","交通費・宿泊費を含めた2日間のお見積をお願いします。同一の通訳者が両日を担当できない場合は、2名で2日間を分担するよりも、1名に1日をお願いしたいと考えています。全日程の充足よりも継続性を重視するためです。","フーゴ・ベルント"]},{"id":82,"part":5,"cat":"お知らせ","theme":"お知らせ：避難訓練の実施","header":["NOTICE — Evacuation Drill, Thursday 13 November"],"body":["A full evacuation drill will take place at 10:30 A.M. on Thursday 13 November. The alarm will sound continuously for the drill; a series of short bursts, used for testing, does not require you to leave the building.","Leave by the nearest staircase and assemble at the marked point in the north car park. Lifts must not be used. Fire wardens in yellow vests will check each floor and will be the last to leave.","Visitors are the responsibility of the person who signed them in. Bring them with you to the assembly point rather than directing them to the exit alone.","Staff working in the laboratory may shut down equipment before leaving, which is expected to take about two minutes. No other exception applies."],"questions":[{"q":"What distinguishes the drill alarm from a test?","o":["The test alarm is announced beforehand","The drill alarm sounds without stopping","The test alarm sounds only on one floor","The drill alarm is quieter"],"a":1,"e":"訓練は連続音、点検は短い断続音で、後者では退避不要。"},{"q":"Who leaves the building last?","o":["Laboratory staff","The fire wardens","Visitors","Staff on the top floor"],"a":1,"e":"黄色いベストの防火責任者が各階を確認し、最後に退出する。"},{"q":"What are staff who signed in a visitor asked to do?","o":["Report the visitor&#x27;s name at the assembly point","Ask a fire warden to escort the visitor","Take the visitor with them","Send the visitor to the nearest exit"],"a":2,"e":"来訪者を1人で出口に向かわせず、集合場所まで同行させる。"}],"ja":["お知らせ ― 避難訓練（11月13日木曜）","11月13日（木）午前10時30分に全館避難訓練を実施します。訓練では警報が連続して鳴ります。点検の際に用いる短い断続音の場合は、建物から退避する必要はありません。","最寄りの階段から退出し、北側駐車場の表示された地点に集合してください。エレベーターは使用しないでください。黄色いベストを着た防火責任者が各階を確認し、最後に退出します。","来訪者については、入館手続きを行った社員が責任を負います。出口へ1人で向かわせるのではなく、集合場所まで同行してください。","実験室で作業中の職員は、退出前に機器を停止させて構いません。所要は約2分の見込みです。これ以外の例外はありません。"]},{"id":83,"part":5,"cat":"広告","theme":"広告：写真スタジオの企業向けプラン","header":["NORTHLIGHT STUDIO — Portraits for your tea
