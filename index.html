<script>
const READ  = [{"id":1,"theme":"採用・応募","words":[{"w":"applicant","jp":"応募者、志願者","tier":"S","ref":"TSL 28","note_html":"<code>qualified applicant</code>（適格な応募者）、<code>applicants for the position</code>。動詞 apply、名詞 application と語族でまとめて押さえる。Part 7の求人広告で頻出。"},{"w":"résumé","jp":"履歴書","tier":"S","ref":"TSL 26","note_html":"<code>submit / send a résumé</code>。米国式。英国式は CV。求人メールの定型は <code>Please send your résumé and cover letter to …</code>。"},{"w":"enclose","jp":"同封する","tier":"S","ref":"TSL 27","note_html":"<code>Enclosed please find …</code> / <code>I have enclosed …</code>。手紙・メールの定型表現で、Part 6の空所補充に直結する。"},{"w":"deadline","jp":"締切","tier":"S","ref":"TSL 18","note_html":"<code>meet the deadline</code>（間に合わせる）、<code>extend the deadline</code>（延長する）、<code>the deadline for ~</code>。前置詞は for。"},{"w":"submission","jp":"提出、提出物","tier":"S","ref":"TSL 157","note_html":"<code>submission deadline</code>、<code>deadline for submission</code>。動詞 submit の名詞形で、品詞問題の定番。"}],"translation":"応募者は全員、履歴書を提出し、推薦状3通を同封しなければなりません。提出の締切は3月14日午後5時です。","html":"All <b class=\"tg\">applicants</b> must submit a <b class=\"tg\">résumé</b> and <b class=\"tg\">enclose</b> three letters of reference. The <b class=\"tg\">deadline</b> for <b class=\"tg\">submission</b> is 5:00 P.M. on March 14.","part":1},{"id":2,"theme":"経理・請求","words":[{"w":"accountant","jp":"会計士、経理担当者","tier":"S","ref":"TSL 22","note_html":"<code>certified public accountant</code>（公認会計士）。accounting department（経理部）とセットで。"},{"w":"invoice","jp":"請求書、送り状","tier":"S","ref":"TSL 19","note_html":"<code>issue / send an invoice</code>、<code>the invoice dated ~</code>（〜付の請求書）、<code>pay an invoice</code>。TSL19位の最重要語。"},{"w":"overdue","jp":"期限を過ぎた、延滞した","tier":"A","ref":"TSL 348","note_html":"<code>an overdue payment</code>、<code>The invoice is two weeks overdue.</code>。図書館の返却期限や支払期限で使われる。"},{"w":"receipt","jp":"領収書、受領","tier":"S","ref":"TSL 33","note_html":"<code>keep / present the receipt</code>。<code>upon receipt of ~</code>（〜を受け取り次第）という別義もPart 7に出る。"},{"w":"reimburse","jp":"払い戻す、精算する","tier":"A","ref":"TSL 375","note_html":"<code>reimburse employees for travel expenses</code>（従業員に旅費を精算する）。人＋for＋費用の語順に注意。名詞 reimbursement も頻出。"}],"translation":"当社の経理担当者が、4月2日付の請求書が2週間延滞していることに気づきました。旅費の精算をご希望の場合は、領収書の原本をご送付ください。","html":"Our <b class=\"tg\">accountant</b> noticed that the <b class=\"tg\">invoice</b> dated April 2 is now two weeks <b class=\"tg\">overdue</b>. Please forward the original <b class=\"tg\">receipt</b> if you would like your travel costs <b class=\"tg\">reimbursed</b>.","part":1},{"id":3,"theme":"出張・移動","words":[{"w":"itinerary","jp":"旅程表","tier":"S","ref":"TSL 146","note_html":"<code>a detailed / revised itinerary</code>、<code>according to the itinerary</code>。出張案内のメールで必出。"},{"w":"departure","jp":"出発","tier":"S","ref":"TSL 113","note_html":"<code>departure time / gate</code>、<code>departures board</code>。反意語 arrival と対で。動詞は depart。"},{"w":"shuttle","jp":"送迎バス、シャトル便","tier":"S","ref":"TSL 204","note_html":"<code>a free shuttle (bus) to the airport</code>、<code>shuttle service</code>。ホテル・空港の話題で頻出。"},{"w":"fare","jp":"運賃","tier":"S","ref":"TSL 32","note_html":"<code>bus / train / taxi fare</code>、<code>pay the fare</code>。fee（手数料・会費）、fine（罰金）との区別が問われる。"},{"w":"luggage","jp":"手荷物","tier":"S","ref":"TSL 37","note_html":"不可算名詞。数えるときは <code>a piece of luggage</code>。<code>check luggage</code>（預ける）、<code>carry-on luggage</code>（機内持ち込み）。baggage とほぼ同義。"}],"translation":"改訂された旅程表によれば、出発は午前6時40分です。空港までは無料の送迎バスが運行しているため、運賃をお支払いいただくのは復路のみとなります。また各旅行者は手荷物を1個預けることができます。","html":"According to the revised <b class=\"tg\">itinerary</b>, <b class=\"tg\">departure</b> is at 6:40 A.M. A free <b class=\"tg\">shuttle</b> runs to the airport, so you will pay the <b class=\"tg\">fare</b> only for the return trip, and each traveler may check one piece of <b class=\"tg\">luggage</b>.","part":1},{"id":4,"theme":"返品・保証","words":[{"w":"merchandise","jp":"商品","tier":"S","ref":"TSL 71","note_html":"不可算名詞。<code>return / display merchandise</code>、<code>defective merchandise</code>。goods とほぼ同義だが単数扱い。"},{"w":"defective","jp":"欠陥のある、不良の","tier":"A","ref":"TSL 290","note_html":"<code>a defective product / part</code>。名詞 defect との品詞使い分けが問われる。"},{"w":"refund","jp":"返金","tier":"S","ref":"TSL 14","note_html":"<code>a full refund</code>（全額返金）、<code>request / issue / receive a refund</code>。動詞用法もあり <code>refund the purchase price</code>。"},{"w":"replacement","jp":"交換品、後任者","tier":"S","ref":"TSL 82","note_html":"<code>a replacement for the broken part</code>、<code>hire a replacement</code>（後任を雇う）。人にも物にも使う。"},{"w":"warranty","jp":"保証、保証書","tier":"S","ref":"TSL 42","note_html":"<code>under warranty</code>（保証期間内で）、<code>a one-year warranty</code>、<code>the warranty expires / lapses</code>。guarantee との言い換えが出る。"}],"translation":"商品が不良品の状態で届いたため、店は保証期間がすでに切れていたにもかかわらず、交換品ではなく全額返金を行いました。","html":"Because the <b class=\"tg\">merchandise</b> arrived <b class=\"tg\">defective</b>, the store issued a full <b class=\"tg\">refund</b> rather than a <b class=\"tg\">replacement</b>, even though the <b class=\"tg\">warranty</b> had already lapsed.","part":1},{"id":5,"theme":"移転・改装","words":[{"w":"renovation","jp":"改装、改修","tier":"S","ref":"TSL 79","note_html":"<code>undergo renovation</code>（改装中である）、<code>be closed for renovation</code>。動詞 renovate も同頻度で出る。"},{"w":"relocate","jp":"移転する、移転させる","tier":"S","ref":"TSL 236","note_html":"<code>relocate to Chicago</code>、<code>relocate the office</code>。自動詞・他動詞の両方で使う。名詞 relocation。"},{"w":"spacious","jp":"広々とした","tier":"A","ref":"TSL 399","note_html":"<code>a spacious office / lobby / apartment</code>。不動産・ホテル広告の定番形容詞。"},{"w":"headquarters","jp":"本社","tier":"S","ref":"TSL 203","note_html":"常に -s が付き、単数扱いも可。<code>corporate headquarters</code>、<code>be headquartered in Osaka</code>（大阪に本社を置く）。"},{"w":"contractor","jp":"請負業者、業者","tier":"S","ref":"TSL 188","note_html":"<code>hire a contractor</code>、<code>general contractor</code>（総合建設業者）。契約 contract の派生語。"}],"translation":"3階の改装が完了した後、マーケティングチームは本社入口近くの、より広々とした区画へ移転します。請負業者は6月までに工事が終わる見込みだとしています。","html":"After the <b class=\"tg\">renovation</b> of the third floor is complete, the marketing team will <b class=\"tg\">relocate</b> to a more <b class=\"tg\">spacious</b> area near the <b class=\"tg\">headquarters</b> entrance. The <b class=\"tg\">contractor</b> expects the work to finish by June.","part":1},{"id":6,"theme":"日程調整","words":[{"w":"postpone","jp":"延期する","tier":"S","ref":"TSL 65","note_html":"<code>postpone the meeting until next week</code>。後ろは動名詞（<code>postpone making a decision</code>）。put off の言い換え。"},{"w":"reschedule","jp":"予定を変更する","tier":"S","ref":"TSL 77","note_html":"<code>reschedule the appointment for Friday</code>。前置詞は for / to。TOEICでは「日程変更」の合図語。"},{"w":"venue","jp":"会場","tier":"S","ref":"TSL 175","note_html":"<code>change / reserve the venue</code>、<code>the venue for the conference</code>。place より格式ばった語。"},{"w":"attendee","jp":"出席者、参加者","tier":"S","ref":"TSL 102","note_html":"<code>the number of attendees</code>、<code>register attendees</code>。attend / attendance / attendant と語族で混同されやすい。"},{"w":"at your earliest convenience","jp":"ご都合のつき次第、なるべく早く","tier":"S","ref":"TSL 149","note_html":"<code>Please reply at your earliest convenience.</code>。as soon as possible の丁寧な定型表現。"}],"translation":"会場が使用できないため、木曜日の説明会を延期し、来週に日程を変更しなければなりません。出席者数をご都合のつき次第ご確認ください。","html":"We must <b class=\"tg\">postpone</b> Thursday&#x27;s briefing and <b class=\"tg\">reschedule</b> it for next week because the <b class=\"tg\">venue</b> is unavailable. Please confirm the number of <b class=\"tg\">attendees</b> <b class=\"tg\">at your earliest convenience</b>.","part":1},{"id":7,"theme":"物流・在庫","words":[{"w":"shipment","jp":"発送、積荷","tier":"S","ref":"TSL 38","note_html":"<code>a delayed shipment</code>、<code>track the shipment</code>。動詞 ship（発送する）から。"},{"w":"warehouse","jp":"倉庫","tier":"S","ref":"TSL 131","note_html":"<code>store items in the warehouse</code>、<code>warehouse staff</code>。Part 1の写真描写にも登場する。"},{"w":"in transit","jp":"輸送中で","tier":"A","ref":"TSL 327","note_html":"<code>The package is still in transit.</code>、<code>damaged in transit</code>（輸送中に破損した）。前置詞句としてそのまま覚える。"},{"w":"courier","jp":"宅配業者、配達人","tier":"S","ref":"TSL 242","note_html":"<code>a courier service</code>、<code>send by courier</code>。delivery company の言い換え。"},{"w":"inventory","jp":"在庫、棚卸し","tier":"S","ref":"TSL 60","note_html":"<code>take inventory</code>（棚卸しをする）、<code>inventory levels</code>、<code>out of stock</code> と関連。"}],"translation":"その積荷は月曜日に当社の倉庫を出発し、現在も輸送中です。到着次第、宅配業者から連絡がありますので、それに合わせて在庫システムを更新します。","html":"The <b class=\"tg\">shipment</b> left our <b class=\"tg\">warehouse</b> on Monday and is still <b class=\"tg\">in transit</b>. The <b class=\"tg\">courier</b> will call once it arrives, and we will update the <b class=\"tg\">inventory</b> system accordingly.","part":1},{"id":8,"theme":"人事・研修","words":[{"w":"intern","jp":"インターン、研修生","tier":"A","ref":"TSL 307","note_html":"<code>hire an intern</code>、<code>a summer intern</code>。internship（インターンシップ）も同頻度。"},{"w":"workshop","jp":"研修会、講習会","tier":"S","ref":"TSL 16","note_html":"<code>attend / conduct a workshop</code>、<code>a two-day workshop</code>。seminar の言い換え。"},{"w":"orientation","jp":"新人研修、オリエンテーション","tier":"A","ref":"TSL 356","note_html":"<code>new employee orientation</code>、<code>during orientation</code>。会社説明の場面で頻出。"},{"w":"supervisor","jp":"上司、監督者","tier":"S","ref":"TSL 13","note_html":"<code>report to your supervisor</code>（上司に報告する）。動詞 supervise、名詞 supervision も併せて。"},{"w":"expertise","jp":"専門知識、専門技能","tier":"A","ref":"TSL 311","note_html":"不可算名詞。<code>expertise in marketing</code>、<code>technical expertise</code>。前置詞は in。"}],"translation":"インターンは全員、オリエンテーション期間中に2日間の研修会に参加します。そこでは物流分野で10年以上の専門知識を持つ上司が講習を進行します。","html":"Every <b class=\"tg\">intern</b> attends a two-day <b class=\"tg\">workshop</b> during <b class=\"tg\">orientation</b>, where a <b class=\"tg\">supervisor</b> with more than a decade of <b class=\"tg\">expertise</b> in logistics leads the sessions.","part":1},{"id":9,"theme":"不動産・契約","words":[{"w":"tenant","jp":"賃借人、テナント","tier":"S","ref":"TSL 111","note_html":"<code>a commercial tenant</code>、<code>tenants of the building</code>。貸主は landlord。"},{"w":"renewal","jp":"更新","tier":"A","ref":"TSL 295","note_html":"<code>contract / lease renewal</code>、<code>up for renewal</code>（更新時期である）。動詞 renew から。"},{"w":"lease","jp":"賃貸契約、賃貸借する","tier":"S","ref":"TSL 48","note_html":"<code>sign / renew a lease</code>、<code>a five-year lease</code>。動詞では <code>lease office space</code>。"},{"w":"notify","jp":"通知する","tier":"S","ref":"TSL 50","note_html":"<code>notify someone of something</code>（人に〜を知らせる）。目的語は必ず人。inform と同型で、Part 5の語法問題に出る。"},{"w":"vacancy","jp":"空室、欠員","tier":"A","ref":"TSL 339","note_html":"<code>fill a vacancy</code>（欠員を埋める）、<code>No vacancies</code>（満室）。形容詞 vacant（空いている）。"}],"translation":"賃借人が更新契約に署名しないことを決めたため、賃貸契約は9月に終了します。空室として掲載され次第、仲介業者に通知してください。","html":"The <b class=\"tg\">tenant</b> has decided not to sign the <b class=\"tg\">renewal</b>, so the <b class=\"tg\">lease</b> will end in September. Please <b class=\"tg\">notify</b> the agent as soon as the <b class=\"tg\">vacancy</b> is listed.","part":1},{"id":10,"theme":"顧客対応","words":[{"w":"inconvenience","jp":"不便、迷惑","tier":"S","ref":"TSL 116","note_html":"<code>We apologize for any inconvenience.</code>（ご迷惑をおかけして申し訳ありません）が定型。お詫び文の必出表現。"},{"w":"patron","jp":"常連客、後援者","tier":"A","ref":"TSL 269","note_html":"<code>valued patrons</code>（お得意様）。customer より格式ばった掲示・案内文向きの語。"},{"w":"complimentary","jp":"無料の","tier":"S","ref":"TSL 231","note_html":"<code>a complimentary breakfast / shuttle / upgrade</code>。free の言い換え。complementary（補完的な）との綴り違いに注意。"},{"w":"voucher","jp":"引換券、クーポン券","tier":"A","ref":"TSL 315","note_html":"<code>a gift / meal voucher</code>、<code>redeem a voucher</code>（引き換える）。"},{"w":"promptly","jp":"迅速に、時間どおりに","tier":"A","ref":"TSL 337","note_html":"<code>respond promptly to inquiries</code>、<code>begin promptly at 9:00</code>（9時ちょうどに開始）。2つの語義がどちらも出る。"}],"translation":"不便をおかけしたお詫びとして、ホテルは各常連客に無料の朝食と次回宿泊用の引換券を提供し、支配人はすべての苦情に迅速に対応しました。","html":"To apologize for the <b class=\"tg\">inconvenience</b>, the hotel offered each <b class=\"tg\">patron</b> a <b class=\"tg\">complimentary</b> breakfast and a <b class=\"tg\">voucher</b> for a future stay, and the manager responded <b class=\"tg\">promptly</b> to every complaint.","part":1},{"id":11,"theme":"工場・点検","words":[{"w":"inspection","jp":"検査、点検","tier":"S","ref":"TSL 136","note_html":"<code>conduct / undergo an inspection</code>、<code>a routine (annual) inspection</code>。動詞 inspect、名詞 inspector。"},{"w":"technician","jp":"技術者、整備士","tier":"S","ref":"TSL 30","note_html":"<code>a service / lab technician</code>、<code>call a technician</code>。修理依頼の場面で頻出。"},{"w":"defect","jp":"欠陥、不具合","tier":"A","ref":"TSL 278","note_html":"<code>a minor / manufacturing defect</code>。形容詞 defective との品詞問題に注意。"},{"w":"machinery","jp":"機械類","tier":"S","ref":"TSL 249","note_html":"不可算の集合名詞。<code>operate heavy machinery</code>、<code>a piece of machinery</code>。machine の複数形ではない点が狙われる。"},{"w":"protective gear","jp":"保護具、防護具","tier":"A","ref":"TSL 322","note_html":"<code>wear protective gear / equipment</code>。工場・工事現場の安全指示で必出。"}],"translation":"年次点検の際、技術者が包装機械に軽微な欠陥を発見しました。修理が完了するまで、フロアにいる従業員は全員、保護具を着用しなければなりません。","html":"During the annual <b class=\"tg\">inspection</b>, a <b class=\"tg\">technician</b> discovered a minor <b class=\"tg\">defect</b> in the packaging <b class=\"tg\">machinery</b>. All staff on the floor must wear <b class=\"tg\">protective gear</b> until the repair is finished.","part":1},{"id":12,"theme":"広告・販促","words":[{"w":"distribution","jp":"配布、流通","tier":"S","ref":"TSL 215","note_html":"<code>the distribution of brochures</code>、<code>distribution center</code>（物流センター）。動詞 distribute。"},{"w":"brochure","jp":"パンフレット、小冊子","tier":"S","ref":"TSL 20","note_html":"<code>request / enclose a brochure</code>、<code>a product brochure</code>。TSL20位。"},{"w":"flyer","jp":"チラシ","tier":"A","ref":"TSL 367","note_html":"<code>hand out / post flyers</code>、<code>a one-page flyer</code>。leaflet の言い換え。"},{"w":"promotional","jp":"販促の","tier":"A","ref":"TSL 424","note_html":"<code>a promotional code / campaign / offer</code>、<code>promotional materials</code>（販促資料）。名詞 promotion には「昇進」の意味もある。"},{"w":"subscriber","jp":"購読者、契約者","tier":"A","ref":"TSL 350","note_html":"<code>subscribers to the newsletter</code>。動詞 subscribe（<code>subscribe to ~</code>）、名詞 subscription と語族で。"}],"translation":"新しいパンフレットの配布は金曜日に始まります。また、販促用コードを記載した1ページのチラシが全購読者に郵送されます。","html":"The <b class=\"tg\">distribution</b> of the new <b class=\"tg\">brochure</b> begins Friday, and a one-page <b class=\"tg\">flyer</b> with a <b class=\"tg\">promotional</b> code will be mailed to every <b class=\"tg\">subscriber</b>.","part":1},{"id":13,"theme":"社内行事","words":[{"w":"anniversary","jp":"記念日、周年","tier":"A","ref":"TSL 288","note_html":"<code>the company&#x27;s twentieth anniversary</code>、<code>celebrate an anniversary</code>。序数詞とともに使う。"},{"w":"banquet hall","jp":"宴会場","tier":"S","ref":"TSL 117","note_html":"<code>reserve the banquet hall</code>。banquet（宴会、晩餐会）単独でも出る。"},{"w":"cater","jp":"料理を提供する、仕出しをする","tier":"A","ref":"TSL 264","note_html":"<code>cater an event</code>、<code>cater to customers&#x27; needs</code>（要望に応える）の2用法。名詞 caterer / catering。"},{"w":"refreshments","jp":"軽食、飲み物","tier":"S","ref":"TSL 211","note_html":"通常は複数形。<code>Refreshments will be served / provided.</code>（軽食をご用意します）が定型。"},{"w":"beverage","jp":"飲み物","tier":"S","ref":"TSL 134","note_html":"<code>complimentary beverages</code>、<code>a selection of beverages</code>。drink の格式ばった言い換えで、案内文に使われる。"}],"translation":"当社の20周年を記念して、宴会場を予約し、地元のレストランにイベントの料理提供を依頼しました。軽食と各種飲み物を6時から提供いたします。","html":"To mark the company&#x27;s twentieth <b class=\"tg\">anniversary</b>, we have reserved the <b class=\"tg\">banquet hall</b> and asked a local restaurant to <b class=\"tg\">cater</b> the event. Light <b class=\"tg\">refreshments</b> and a selection of <b class=\"tg\">beverages</b> will be served from six o&#x27;clock.","part":1},{"id":14,"theme":"IT・設備","words":[{"w":"installation","jp":"設置、取り付け","tier":"S","ref":"TSL 227","note_html":"<code>the installation of new equipment</code>、<code>installation fee</code>。動詞 install。"},{"w":"projector","jp":"プロジェクター","tier":"A","ref":"TSL 397","note_html":"<code>set up / operate the projector</code>。会議室設備の定番語。"},{"w":"laptop (computer)","jp":"ノートパソコン","tier":"S","ref":"TSL 96","note_html":"<code>bring your laptop</code>。desktop と対で。Part 1の写真描写にも出る。"},{"w":"upgrade","jp":"改良する、格上げする／改良","tier":"S","ref":"TSL 80","note_html":"<code>upgrade the software / system</code>、<code>a free upgrade</code>。名詞・動詞の両用法。"},{"w":"automated","jp":"自動化された","tier":"A","ref":"TSL 388","note_html":"<code>an automated system / response</code>、<code>fully automated</code>。動詞 automate、名詞 automation。"}],"translation":"新しいプロジェクターの設置は火曜日に予定されており、会議室のすべてのノートパソコンが改良されて、予約システムが完全に自動化されます。","html":"The <b class=\"tg\">installation</b> of the new <b class=\"tg\">projector</b> is scheduled for Tuesday, and every <b class=\"tg\">laptop computer</b> in the conference room will be <b class=\"tg\">upgraded</b> so that the booking system becomes fully <b class=\"tg\">automated</b>.","part":1},{"id":15,"theme":"通勤・交通","words":[{"w":"congestion","jp":"渋滞、混雑","tier":"A","ref":"TSL 811","note_html":"<code>traffic congestion</code>、<code>heavy congestion</code>。交通情報のアナウンスで頻出。"},{"w":"terminal","jp":"ターミナル、発着所","tier":"S","ref":"TSL 193","note_html":"<code>bus / airport terminal</code>、<code>Terminal 2</code>。形容詞では「末期の」だがTOEICでは名詞用法。"},{"w":"commuter","jp":"通勤者","tier":"S","ref":"TSL 176","note_html":"<code>commuter train / traffic</code>。動詞 commute（<code>commute to work by train</code>）と併せて。"},{"w":"alternate","jp":"代わりの／交替する","tier":"A","ref":"TSL 480","note_html":"<code>an alternate route</code>（迂回路）、<code>an alternate date</code>。alternative とほぼ同義で使われる。"},{"w":"downtown","jp":"中心街へ、繁華街","tier":"S","ref":"TSL 17","note_html":"副詞用法に注意し <code>go downtown</code>（to は不要）。<code>downtown Chicago</code>のように形容詞的にも使う。"}],"translation":"ターミナル付近のひどい渋滞のため、多くの通勤者が現在は中心街へ向かう迂回路を使い、20分早く到着しています。","html":"Because of heavy <b class=\"tg\">congestion</b> near the <b class=\"tg\">terminal</b>, many <b class=\"tg\">commuters</b> now take an <b class=\"tg\">alternate</b> route into <b class=\"tg\">downtown</b> and arrive twenty minutes earlier.","part":1},{"id":16,"theme":"財務・監査","words":[{"w":"audit","jp":"監査、監査する","tier":"S","ref":"TSL 187","note_html":"<code>an external / internal audit</code>、<code>conduct an audit</code>。名詞 auditor（監査人）。"},{"w":"profitable","jp":"利益の出る、もうかる","tier":"A","ref":"TSL 373","note_html":"<code>a profitable division / venture</code>、<code>remain profitable</code>。名詞 profit / profitability。"},{"w":"quarterly","jp":"四半期の、四半期ごとに","tier":"A","ref":"TSL 425","note_html":"<code>quarterly report / earnings / meeting</code>。annually、biannually と対比して覚える。"},{"w":"confidential","jp":"機密の","tier":"A","ref":"TSL 381","note_html":"<code>strictly confidential</code>、<code>keep the information confidential</code>。文書のヘッダーによく登場する。"},{"w":"finalize","jp":"最終決定する、仕上げる","tier":"A","ref":"TSL 390","note_html":"<code>finalize the report / contract / details</code>。決裁の話題で頻出。"}],"translation":"外部監査により、その部門が4四半期連続で黒字であったことが確認されました。数値は取締役会が報告書を最終決定するまで機密扱いです。","html":"The external <b class=\"tg\">audit</b> confirmed that the division remained <b class=\"tg\">profitable</b> for a fourth <b class=\"tg\">quarterly</b> period. The figures are <b class=\"tg\">confidential</b> until the board <b class=\"tg\">finalizes</b> the report.","part":1},{"id":17,"theme":"施設・環境","words":[{"w":"container","jp":"容器、コンテナ","tier":"S","ref":"TSL 154","note_html":"<code>a plastic / storage container</code>、<code>place items in a container</code>。Part 1の写真描写に出やすい。"},{"w":"recycling","jp":"リサイクル、再生利用","tier":"S","ref":"TSL 109","note_html":"<code>a recycling program / bin / company</code>。動詞 recycle、形容詞 recyclable。"},{"w":"disposal","jp":"処分、廃棄","tier":"A","ref":"TSL 343","note_html":"<code>proper disposal of waste</code>、<code>waste disposal</code>。動詞句 <code>dispose of ~</code>（〜を処分する）は of が必須。"},{"w":"appliance","jp":"家電製品","tier":"S","ref":"TSL 88","note_html":"<code>kitchen / home appliances</code>、<code>an appliance store</code>。機器全般ではなく家庭用電化製品を指す。"},{"w":"utility","jp":"公共料金、公共設備","tier":"A","ref":"TSL 314","note_html":"<code>utility costs / bills</code>（光熱費）、<code>utility company</code>。複数形 utilities で「水道光熱」。"}],"translation":"使用済みの容器は、リサイクル業者が回収できるよう青い箱に入れてください。古い家電製品を適切に廃棄することも、毎月の光熱費の削減につながります。","html":"Please place used <b class=\"tg\">containers</b> in the blue bin so that the <b class=\"tg\">recycling</b> company can collect them. Proper <b class=\"tg\">disposal</b> of old <b class=\"tg\">appliances</b> also lowers our monthly <b class=\"tg\">utility</b> costs.","part":1},{"id":18,"theme":"購読・更新","words":[{"w":"subscription","jp":"定期購読、契約","tier":"S","ref":"TSL 53","note_html":"<code>renew / cancel a subscription</code>、<code>a subscription to a magazine</code>。前置詞は to。"},{"w":"expire","jp":"期限が切れる","tier":"S","ref":"TSL 121","note_html":"<code>The warranty / coupon expires on May 1.</code>。名詞 expiration（<code>expiration date</code> 有効期限）。"},{"w":"invalid","jp":"無効な","tier":"S","ref":"TSL 94","note_html":"<code>an invalid ticket / code / password</code>。反意語 valid（<code>valid for 30 days</code> 30日間有効）と対で。"},{"w":"renew","jp":"更新する","tier":"S","ref":"TSL 110","note_html":"<code>renew a subscription / membership / license</code>。名詞 renewal、形容詞 renewable。"},{"w":"confirmation","jp":"確認、確認書","tier":"A","ref":"TSL 309","note_html":"<code>a confirmation number / email</code>、<code>send confirmation</code>。動詞 confirm。"}],"translation":"お客様の定期購読は今月末で期限が切れ、その日以降は割引コードが無効になります。オンラインで更新のうえ、確認番号を記録として保管してください。","html":"Your <b class=\"tg\">subscription</b> will <b class=\"tg\">expire</b> at the end of the month, and the discount code becomes <b class=\"tg\">invalid</b> after that date. Please <b class=\"tg\">renew</b> online and keep the <b class=\"tg\">confirmation</b> number for your records.","part":1},{"id":19,"theme":"小売・店舗","words":[{"w":"retailer","jp":"小売業者、小売店","tier":"A","ref":"TSL 338","note_html":"<code>a major retailer</code>、<code>online retailer</code>。retail（小売）、wholesale（卸売）と対で。"},{"w":"bargain","jp":"お買い得品、特価／交渉する","tier":"S","ref":"TSL 230","note_html":"<code>a bargain on winter coats</code>、<code>bargain prices</code>。動詞では「値切る」。"},{"w":"coupon","jp":"クーポン、割引券","tier":"S","ref":"TSL 75","note_html":"<code>present / redeem a coupon</code>、<code>a discount coupon</code>。voucher とほぼ同義。"},{"w":"cashier","jp":"レジ係、会計担当","tier":"A","ref":"TSL 329","note_html":"<code>pay at the cashier</code>、<code>the cashier&#x27;s counter</code>。cash register（レジ）と混同しない。"},{"w":"aisle","jp":"通路","tier":"S","ref":"TSL 138","note_html":"<code>aisle seven</code>、<code>an aisle seat</code>（通路側の席）。発音は /aɪl/ で s は無音。Part 1・Part 2の頻出語。"}],"translation":"アウトレットモールのある小売店が冬物コートを特価で販売しています。クーポンをレジ係に提示し、7番通路の端にある陳列をご覧ください。","html":"A <b class=\"tg\">retailer</b> in the outlet mall is offering a <b class=\"tg\">bargain</b> on winter coats. Bring the <b class=\"tg\">coupon</b> to the <b class=\"tg\">cashier</b> and look for the display at the end of <b class=\"tg\">aisle</b> seven.","part":1},{"id":20,"theme":"社内文書・承認","words":[{"w":"memo","jp":"社内連絡文書、メモ","tier":"S","ref":"TSL 6","note_html":"<code>send / circulate a memo</code>、<code>according to the memo</code>。正式には memorandum。Part 7の文書形式として頻出。"},{"w":"administrative","jp":"管理の、事務の","tier":"S","ref":"TSL 212","note_html":"<code>administrative department / assistant / duties</code>。名詞 administration、administrator。"},{"w":"authorize","jp":"許可する、権限を与える","tier":"S","ref":"TSL 213","note_html":"<code>authorize overtime / a payment</code>、<code>be authorized to do ~</code>（〜する権限がある）。名詞 authorization、authority。"},{"w":"correspondence","jp":"通信文、やり取り","tier":"A","ref":"TSL 284","note_html":"不可算名詞。<code>business correspondence</code>、<code>keep correspondence on file</code>。手紙・メール全般を指す。"},{"w":"paperwork","jp":"書類、事務手続き","tier":"S","ref":"TSL 222","note_html":"不可算名詞。<code>complete / fill out the paperwork</code>。「書類仕事」全般をまとめて指す。"}],"translation":"管理部門からの社内連絡文書によれば、残業を許可できるのは部長職のみです。後で書類を検証できるよう、関連する通信文はすべて保管しておいてください。","html":"The <b class=\"tg\">memo</b> from the <b class=\"tg\">administrative</b> department states that only a director may <b class=\"tg\">authorize</b> overtime. Keep all related <b class=\"tg\">correspondence</b> on file so that the <b class=\"tg\">paperwork</b> can be verified later.","part":1},{"id":21,"theme":"設備の不具合","words":[{"w":"malfunction","jp":"正常に作動しない／故障","tier":"A","ref":"TSL 445","note_html":"<code>The printer is malfunctioning.</code>、<code>a malfunction in the system</code>。動詞・名詞の両方で使う。"},{"w":"faulty","jp":"欠陥のある、故障した","tier":"A","ref":"TSL 497","note_html":"<code>a faulty wire / switch / part</code>。defective の言い換えとしてPart 7で対応する。"},{"w":"outdated","jp":"時代遅れの、旧式の","tier":"A","ref":"TSL 446","note_html":"<code>outdated equipment / software / information</code>。out-of-date とほぼ同義。"},{"w":"remodel","jp":"改装する","tier":"A","ref":"TSL 509","note_html":"<code>remodel the kitchen / lobby</code>。renovate の言い換えで、米国式の語。"},{"w":"closure","jp":"閉鎖、閉店","tier":"A","ref":"TSL 543","note_html":"<code>a temporary closure</code>、<code>road closure</code>（通行止め）。動詞 close の名詞形。"}],"translation":"先週から暖房装置が正常に作動しなくなり、技術者が、欠陥のある制御パネルは単に旧式なだけだと確認しました。経営陣は部屋全体を改装することを決定し、これには2週間の閉鎖が必要になります。","html":"The heating unit began to <b class=\"tg\">malfunction</b> last week, and an engineer confirmed that the <b class=\"tg\">faulty</b> control panel is simply <b class=\"tg\">outdated</b>. Management has decided to <b class=\"tg\">remodel</b> the entire room, which will require a two-week <b class=\"tg\">closure</b>.","part":2},{"id":22,"theme":"安全・規則遵守","words":[{"w":"comply with","jp":"〜に従う、順守する","tier":"A","ref":"TSL 595","note_html":"<code>comply with regulations / safety standards</code>。with が必須。名詞 compliance。"},{"w":"mandatory","jp":"義務的な、必須の","tier":"A","ref":"TSL 421","note_html":"<code>Attendance is mandatory.</code>、<code>a mandatory training session</code>。反意語 optional。"},{"w":"precaution","jp":"予防措置、用心","tier":"A","ref":"TSL 593","note_html":"<code>as a precaution</code>（念のため）、<code>take precautions</code>。safety precautions の形が多い。"},{"w":"adhere","jp":"順守する、付着する","tier":"A","ref":"TSL 591","note_html":"<code>adhere to the schedule / policy</code>。to が必須で、comply with と同義。"},{"w":"cautious","jp":"慎重な、用心深い","tier":"A","ref":"TSL 894","note_html":"<code>be cautious about ~</code>、副詞 cautiously。名詞 caution（<code>with caution</code> 注意して）。"}],"translation":"来場者は全員、現場の規則に従わなければならず、この先はヘルメットの着用が義務です。予防措置として、表示された通路を守り、走行中の車両の周辺では慎重に行動してください。","html":"All visitors must <b class=\"tg\">comply with</b> the site rules, and wearing a helmet is <b class=\"tg\">mandatory</b> beyond this point. As a <b class=\"tg\">precaution</b>, please <b class=\"tg\">adhere</b> to the marked path and remain <b class=\"tg\">cautious</b> around moving vehicles.","part":2},{"id":23,"theme":"採用活動","words":[{"w":"recruiter","jp":"採用担当者、人材紹介業者","tier":"A","ref":"TSL 533","note_html":"<code>a corporate recruiter</code>、<code>speak with a recruiter</code>。動詞 recruit。"},{"w":"prospective","jp":"見込みのある、将来の","tier":"A","ref":"TSL 449","note_html":"<code>prospective clients / employees / buyers</code>。potential の言い換え。"},{"w":"job seeker","jp":"求職者","tier":"A","ref":"TSL 428","note_html":"<code>job seekers attending the fair</code>。job fair、job opening と同じ求人文脈で使う。"},{"w":"apprenticeship","jp":"見習い期間、実習制度","tier":"A","ref":"TSL 565","note_html":"<code>complete an apprenticeship</code>、<code>an apprenticeship program</code>。apprentice（見習い）から。"},{"w":"recruitment","jp":"採用、募集","tier":"A","ref":"TSL 645","note_html":"<code>recruitment process / drive</code>、<code>recruitment closes on ~</code>。hiring の言い換え。"}],"translation":"木曜日に人材紹介会社の採用担当者が、見込みのある候補者と面談します。溶接の見習い期間を修了した求職者はぜひ応募してください。当工場の採用は今月で締め切られます。","html":"A <b class=\"tg\">recruiter</b> from the agency will meet <b class=\"tg\">prospective</b> candidates on Thursday. Any <b class=\"tg\">job seeker</b> who completed an <b class=\"tg\">apprenticeship</b> in welding is encouraged to apply, as <b class=\"tg\">recruitment</b> for the plant closes this month.","part":2},{"id":24,"theme":"人事評価","words":[{"w":"appraisal","jp":"評価、査定","tier":"A","ref":"TSL 564","note_html":"<code>a performance appraisal</code>（人事考課）、<code>an appraisal of the property</code>（不動産査定）。"},{"w":"dedication","jp":"献身、専念","tier":"A","ref":"TSL 708","note_html":"<code>dedication to the job</code>、<code>years of dedication</code>。形容詞 dedicated（<code>a dedicated employee</code>）。"},{"w":"mentor","jp":"指導者、助言者","tier":"A","ref":"TSL 607","note_html":"<code>work with a mentor</code>、<code>serve as a mentor</code>。動詞用法もあり <code>mentor new hires</code>。"},{"w":"advancement","jp":"昇進、進歩","tier":"A","ref":"TSL 656","note_html":"<code>career advancement</code>、<code>opportunities for advancement</code>。promotion の言い換え。"},{"w":"turnover","jp":"離職率、売上高","tier":"A","ref":"TSL 620","note_html":"<code>high employee turnover</code>（高い離職率）と <code>annual turnover</code>（年間売上高）の2義。文脈で判別する。"}],"translation":"年次の人事考課では、年功ではなく献身が評価されます。また、指導者とともに働く従業員のほうが昇進を得やすくなっています。その結果、社員の離職率は大幅に低下しました。","html":"The annual performance <b class=\"tg\">appraisal</b> rewards <b class=\"tg\">dedication</b> rather than seniority, and employees who work with a <b class=\"tg\">mentor</b> are more likely to earn <b class=\"tg\">advancement</b>. As a result, staff <b class=\"tg\">turnover</b> has fallen sharply.","part":2},{"id":25,"theme":"医療・薬局","words":[{"w":"pharmacy","jp":"薬局、調剤薬局","tier":"A","ref":"TSL 423","note_html":"<code>pick up a prescription at the pharmacy</code>。drugstore とほぼ同義。"},{"w":"pharmacist","jp":"薬剤師","tier":"A","ref":"TSL 471","note_html":"<code>consult a pharmacist</code>、<code>a licensed pharmacist</code>。"},{"w":"physician","jp":"医師、内科医","tier":"A","ref":"TSL 611","note_html":"<code>see a physician</code>、<code>your primary care physician</code>。doctor の格式ばった言い換え。"},{"w":"(medical) checkup","jp":"健康診断","tier":"A","ref":"TSL 854","note_html":"<code>have / get an annual checkup</code>、<code>a routine checkup</code>。動詞は have / get。"},{"w":"pharmaceutical","jp":"製薬の、医薬品の","tier":"A","ref":"TSL 582","note_html":"<code>a pharmaceutical company</code>、<code>pharmaceutical products</code>。名詞複数形 pharmaceuticals で「医薬品」。"}],"translation":"1階の薬局は8時まで営業しており、資格を持つ薬剤師が常時勤務しています。あなたの医師は年1回の健康診断を勧めており、その費用は製薬会社が負担します。","html":"The <b class=\"tg\">pharmacy</b> on the ground floor is open until eight, and a licensed <b class=\"tg\">pharmacist</b> is always on duty. Your <b class=\"tg\">physician</b> recommends an annual <b class=\"tg\">medical checkup</b>, and the <b class=\"tg\">pharmaceutical</b> company will cover the cost.","part":2},{"id":26,"theme":"不動産・賃貸","words":[{"w":"landlord","jp":"家主、大家","tier":"A","ref":"TSL 578","note_html":"<code>the landlord raised the rent</code>。借り手は tenant / renter。"},{"w":"vacate","jp":"明け渡す、退去する","tier":"A","ref":"TSL 883","note_html":"<code>vacate the premises / apartment by ~</code>。形容詞 vacant、名詞 vacancy と語族で。"},{"w":"residential","jp":"住宅の","tier":"A","ref":"TSL 426","note_html":"<code>a residential area / building</code>。commercial（商業の）と対で出題される。"},{"w":"adjacent","jp":"隣接した","tier":"A","ref":"TSL 479","note_html":"<code>adjacent to the station</code>（駅に隣接して）。to が必須。next to の格式ばった言い換え。"},{"w":"renter","jp":"借り手、賃借人","tier":"A","ref":"TSL 785","note_html":"<code>find a new renter</code>。動詞 rent、名詞 rental と併せて。"}],"translation":"家主は現在の入居者に、5月末までに部屋を明け渡すよう求めました。駅に隣接するその住宅用建物は人気があるため、新しい借り手はすぐに見つかるはずです。","html":"The <b class=\"tg\">landlord</b> has asked the current occupant to <b class=\"tg\">vacate</b> the unit by the end of May. The <b class=\"tg\">residential</b> building <b class=\"tg\">adjacent</b> to the station is popular, so a new <b class=\"tg\">renter</b> should be found quickly.","part":2},{"id":27,"theme":"貨物・流通","words":[{"w":"freight","jp":"貨物、貨物輸送料","tier":"A","ref":"TSL 716","note_html":"不可算名詞。<code>freight costs / charges</code>、<code>ship by freight</code>。"},{"w":"vendor","jp":"納入業者、売り手","tier":"A","ref":"TSL 454","note_html":"<code>a local vendor</code>、<code>switch vendors</code>。supplier の言い換え。露店商の意味もある。"},{"w":"parcel","jp":"小包","tier":"A","ref":"TSL 729","note_html":"<code>send / deliver a parcel</code>。package とほぼ同義で、英国式でよく使われる。"},{"w":"distributor","jp":"卸売業者、販売代理店","tier":"A","ref":"TSL 815","note_html":"<code>an authorized distributor</code>。distribution、distribute と語族で。"},{"w":"unload","jp":"荷を降ろす","tier":"A","ref":"TSL 881","note_html":"<code>unload the truck / containers</code>。反意語 load。Part 1の写真描写でも出る。"}],"translation":"納入業者が運送会社を変更した後、当社の貨物費用は上昇し、小包1個が1週間遅延しました。卸売業者は、到着から2時間以内にコンテナの荷降ろしを行うと約束しています。","html":"Our <b class=\"tg\">freight</b> costs rose after the <b class=\"tg\">vendor</b> switched carriers, and one <b class=\"tg\">parcel</b> was delayed for a week. The <b class=\"tg\">distributor</b> has promised to <b class=\"tg\">unload</b> the containers within two hours of arrival.","part":2},{"id":28,"theme":"給与・予算","words":[{"w":"payroll","jp":"給与支払名簿、給与総額","tier":"A","ref":"TSL 581","note_html":"<code>the payroll department</code>、<code>be on the payroll</code>（雇用されている）。"},{"w":"insufficient","jp":"不十分な","tier":"A","ref":"TSL 722","note_html":"<code>insufficient funds / evidence / time</code>。反意語 sufficient。"},{"w":"compensate","jp":"補償する、報酬を払う","tier":"A","ref":"TSL 569","note_html":"<code>compensate employees for overtime</code>（人＋for＋対象）。名詞 compensation。"},{"w":"allocate","jp":"割り当てる、配分する","tier":"A","ref":"TSL 699","note_html":"<code>allocate funds / resources to ~</code>。名詞 allocation。"},{"w":"accounts payable","jp":"買掛金、支払勘定","tier":"A","ref":"TSL 686","note_html":"<code>settle accounts payable</code>。対語は accounts receivable（売掛金）。経理文書の定型語。"}],"translation":"給与部門は、週末勤務分の手当を従業員に支払うには予算が不十分だと報告しました。部長は追加資金を配分し、金曜日までに買掛金を清算する予定です。","html":"The <b class=\"tg\">payroll</b> department reported that the budget was <b class=\"tg\">insufficient</b> to <b class=\"tg\">compensate</b> staff for weekend shifts. The director will <b class=\"tg\">allocate</b> additional funds and settle the <b class=\"tg\">accounts payable</b> by Friday.","part":2},{"id":29,"theme":"会議・リハーサル","words":[{"w":"preliminary","jp":"予備の、暫定の","tier":"A","ref":"TSL 687","note_html":"<code>a preliminary version / report / round</code>。「最終版ではない」という含意が問われる。"},{"w":"timetable","jp":"予定表、時刻表","tier":"A","ref":"TSL 653","note_html":"<code>a revised timetable</code>、<code>according to the timetable</code>。schedule の言い換え。"},{"w":"rehearse","jp":"リハーサルをする","tier":"A","ref":"TSL 615","note_html":"<code>rehearse for the presentation</code>。名詞 rehearsal（<code>dress rehearsal</code> 本番同様の通し稽古）。"},{"w":"auditorium","jp":"講堂、観客席","tier":"A","ref":"TSL 516","note_html":"<code>hold the ceremony in the auditorium</code>。大学・劇場の場面で頻出。"},{"w":"facilitator","jp":"進行役、まとめ役","tier":"A","ref":"TSL 573","note_html":"<code>serve as a facilitator</code>。動詞 facilitate（<code>facilitate discussion</code> 議論を促進する）。"}],"translation":"予備版のプログラムが掲示されていますが、予定表はまだ変更される可能性があります。登壇者は月曜日に講堂でリハーサルを行ってください。そこで進行役が形式について説明します。","html":"A <b class=\"tg\">preliminary</b> version of the program has been posted, and the <b class=\"tg\">timetable</b> may still change. Speakers should <b class=\"tg\">rehearse</b> in the <b class=\"tg\">auditorium</b> on Monday, where the <b class=\"tg\">facilitator</b> will explain the format.","part":2},{"id":30,"theme":"苦情処理","words":[{"w":"apology","jp":"謝罪、わび状","tier":"A","ref":"TSL 434","note_html":"<code>a letter of apology</code>、<code>accept / offer an apology</code>。動詞 apologize（<code>apologize for ~</code>）。"},{"w":"dissatisfied","jp":"不満を持った","tier":"A","ref":"TSL 765","note_html":"<code>dissatisfied customers</code>、<code>be dissatisfied with ~</code>。反意語 satisfied。"},{"w":"rebate","jp":"払い戻し、割戻金","tier":"A","ref":"TSL 871","note_html":"<code>a mail-in rebate</code>、<code>offer a rebate</code>。refund が「返金」なのに対し、購入後の一部返戻を指す。"},{"w":"courtesy","jp":"礼儀、無料提供","tier":"A","ref":"TSL 761","note_html":"<code>as a courtesy</code>（サービスとして）、<code>courtesy shuttle</code>（無料送迎バス）。complimentary と近い用法。"},{"w":"relieve","jp":"和らげる、軽減する","tier":"A","ref":"TSL 736","note_html":"<code>relieve stress / pressure / congestion</code>。形容詞 relieved（ほっとした）。"}],"translation":"供給業者から謝罪の書面を受け取りましたが、不満を持つ顧客の何人かは依然として払い戻しを求めています。サービスとして保証期間を延長する予定で、これによりサポートチームの負担が多少軽減されるはずです。","html":"We received a letter of <b class=\"tg\">apology</b> from the supplier, but several <b class=\"tg\">dissatisfied</b> customers are still requesting a <b class=\"tg\">rebate</b>. As a <b class=\"tg\">courtesy</b>, we will extend the warranty, which should <b class=\"tg\">relieve</b> some of the pressure on our support team.","part":2},{"id":31,"theme":"IT導入","words":[{"w":"compatible","jp":"互換性のある、両立する","tier":"A","ref":"TSL 757","note_html":"<code>compatible with the system</code>。with が必須。名詞 compatibility。"},{"w":"customize","jp":"好みに合わせる、特注する","tier":"A","ref":"TSL 707","note_html":"<code>customize the settings / interface</code>。形容詞 customizable。"},{"w":"documentation","jp":"説明書類、文書一式","tier":"A","ref":"TSL 675","note_html":"不可算名詞。<code>technical documentation</code>、<code>supporting documentation</code>（証拠書類）。"},{"w":"browse","jp":"ざっと目を通す、閲覧する","tier":"A","ref":"TSL 806","note_html":"<code>browse the manual / catalog / website</code>。目を通す程度の読み方を指す。"},{"w":"tablet computer","jp":"タブレット端末","tier":"A","ref":"TSL 746","note_html":"<code>read on a tablet</code>。laptop、desktop と並べて出題される。"}],"translation":"新しいソフトウェアは既存のサーバーと完全な互換性があり、各部署がインターフェースを好みに合わせて設定できます。詳細な説明書類も用意されているため、従業員はタブレット端末でマニュアルに目を通すことができます。","html":"The new software is fully <b class=\"tg\">compatible</b> with our existing servers, and each department may <b class=\"tg\">customize</b> the interface. Detailed <b class=\"tg\">documentation</b> is available, so staff can <b class=\"tg\">browse</b> the manual on a <b class=\"tg\">tablet computer</b>.","part":2},{"id":32,"theme":"製造・設計","words":[{"w":"blueprint","jp":"設計図、青写真","tier":"A","ref":"TSL 892","note_html":"<code>according to the blueprint</code>、<code>draw up a blueprint</code>。計画案の比喩でも使う。"},{"w":"assembly line","jp":"組立ライン","tier":"A","ref":"TSL 540","note_html":"<code>work on the assembly line</code>。assembly（組立、集会）、assemble（組み立てる、集まる）と語族で。"},{"w":"streamline","jp":"効率化する、合理化する","tier":"A","ref":"TSL 793","note_html":"<code>streamline the process / operations</code>。「無駄をなくす」の意味で経営文脈に頻出。"},{"w":"equip","jp":"備え付ける","tier":"A","ref":"TSL 462","note_html":"<code>be equipped with ~</code>（〜を備えている）が最頻出形。名詞 equipment は不可算。"},{"w":"durable","jp":"丈夫な、耐久性のある","tier":"A","ref":"TSL 442","note_html":"<code>durable materials</code>、<code>built to be durable</code>。名詞 durability。"}],"translation":"設計図には、生産を効率化するために組立ラインをどう再編するかが示されています。各作業場には、10年もつよう設計された丈夫な工具が備え付けられます。","html":"The <b class=\"tg\">blueprint</b> shows how the <b class=\"tg\">assembly line</b> will be reorganized to <b class=\"tg\">streamline</b> production. Every station will be <b class=\"tg\">equipped</b> with <b class=\"tg\">durable</b> tools designed to last a decade.","part":2},{"id":33,"theme":"法務・知的財産","words":[{"w":"attorney","jp":"弁護士","tier":"A","ref":"TSL 660","note_html":"<code>consult an attorney</code>、<code>attorney&#x27;s fees</code>。lawyer の米国式の言い換え。"},{"w":"patent","jp":"特許","tier":"A","ref":"TSL 685","note_html":"<code>file for / apply for a patent</code>、<code>a patent application</code>。動詞では「特許を取る」。"},{"w":"invention","jp":"発明、発明品","tier":"A","ref":"TSL 681","note_html":"<code>patent an invention</code>。動詞 invent、名詞 inventor。"},{"w":"consent","jp":"同意、承諾","tier":"A","ref":"TSL 669","note_html":"<code>written consent</code>、<code>give / obtain consent</code>。動詞では <code>consent to ~</code>。"},{"w":"authorization","jp":"許可、承認","tier":"A","ref":"TSL 661","note_html":"<code>prior authorization</code>（事前承認）、<code>without authorization</code>。動詞 authorize。"}],"translation":"当社の弁護士は、発明を公表する前に特許を出願するよう助言しました。研究パートナーからの書面による同意と、取締役会からの正式な承認が必要です。","html":"Our <b class=\"tg\">attorney</b> advised us to file for a <b class=\"tg\">patent</b> before announcing the <b class=\"tg\">invention</b>. Written <b class=\"tg\">consent</b> from the research partner is required, along with formal <b class=\"tg\">authorization</b> from the board.","part":2},{"id":34,"theme":"出張・宿泊","words":[{"w":"airfare","jp":"航空運賃","tier":"A","ref":"TSL 493","note_html":"<code>round-trip airfare</code>、<code>airfare and lodging</code>。fare の複合語。"},{"w":"overhead bin","jp":"頭上の手荷物入れ","tier":"A","ref":"TSL 506","note_html":"<code>stow luggage in the overhead bin</code>。機内アナウンスの定番。"},{"w":"concierge","jp":"コンシェルジュ、接客係","tier":"A","ref":"TSL 668","note_html":"<code>ask the concierge for directions</code>。ホテル場面のPart 3で頻出。"},{"w":"excursion","jp":"小旅行、遠足","tier":"A","ref":"TSL 463","note_html":"<code>a guided excursion</code>、<code>an afternoon excursion</code>。tour の言い換え。"},{"w":"amenity","jp":"設備、アメニティ","tier":"A","ref":"TSL 845","note_html":"通常は複数形 amenities。<code>hotel amenities</code>、<code>a full range of amenities</code>。"}],"translation":"航空運賃は手ごろでしたが、頭上の手荷物入れには空きが残っていませんでした。ホテルではコンシェルジュが午後の小旅行を手配してくれ、全客室に一通りの設備が備わっています。","html":"The <b class=\"tg\">airfare</b> was reasonable, but there was no space left in the <b class=\"tg\">overhead bin</b>. At the hotel, the <b class=\"tg\">concierge</b> arranged an afternoon <b class=\"tg\">excursion</b>, and every room includes a full range of <b class=\"tg\">amenities</b>.","part":2},{"id":35,"theme":"広報・宣伝活動","words":[{"w":"advertiser","jp":"広告主","tier":"A","ref":"TSL 657","note_html":"<code>a major advertiser</code>。advertisement（広告）、advertising（広告業）と区別する。"},{"w":"nationwide","jp":"全国的に、全国的な","tier":"A","ref":"TSL 779","note_html":"<code>expand nationwide</code>、<code>a nationwide campaign</code>。副詞・形容詞の両用法。"},{"w":"publicity","jp":"知名度、宣伝","tier":"A","ref":"TSL 784","note_html":"不可算名詞。<code>generate / attract publicity</code>、<code>a publicity campaign</code>。"},{"w":"spokesperson","jp":"広報担当者","tier":"A","ref":"TSL 491","note_html":"<code>a company spokesperson said ~</code>。ニュース記事形式のPart 7で頻出。"},{"w":"influential","jp":"影響力のある","tier":"A","ref":"TSL 778","note_html":"<code>an influential figure / critic</code>。名詞 influence（<code>have an influence on ~</code>）。"}],"translation":"著名な広告主が当社のキャンペーンを全国規模で展開すると申し出ており、これは相当な知名度を生むはずです。会社の広報担当者が、影響力のある業界ブロガーとともに登場する予定です。","html":"A well-known <b class=\"tg\">advertiser</b> has offered to run our campaign <b class=\"tg\">nationwide</b>, which should generate considerable <b class=\"tg\">publicity</b>. The company <b class=\"tg\">spokesperson</b> will appear alongside an <b class=\"tg\">influential</b> industry blogger.","part":2},{"id":36,"theme":"経営・起業","words":[{"w":"founder","jp":"創業者、設立者","tier":"A","ref":"TSL 771","note_html":"<code>the founder of the company</code>、<code>co-founder</code>。動詞 found（found–founded–founded）。"},{"w":"ambitious","jp":"野心的な、意欲的な","tier":"A","ref":"TSL 700","note_html":"<code>an ambitious plan / project</code>、<code>an ambitious young executive</code>。人にも計画にも使う。"},{"w":"entrepreneur","jp":"起業家","tier":"A","ref":"TSL 676","note_html":"<code>a successful entrepreneur</code>。名詞 entrepreneurship（起業家精神）。"},{"w":"merge","jp":"合併する","tier":"A","ref":"TSL 469","note_html":"<code>merge with a rival firm</code>。with が伴う。名詞 merger（<code>a merger and acquisition</code>）。"},{"w":"strategic","jp":"戦略的な","tier":"A","ref":"TSL 876","note_html":"<code>a strategic plan / partnership / decision</code>。名詞 strategy、副詞 strategically。"}],"translation":"創業者である野心的な若手起業家は、アジア市場に参入するための戦略的計画の一環として、競合他社と合併することを決めました。","html":"The <b class=\"tg\">founder</b>, an <b class=\"tg\">ambitious</b> young <b class=\"tg\">entrepreneur</b>, decided to <b class=\"tg\">merge</b> with a rival firm as part of a <b class=\"tg\">strategic</b> plan to enter the Asian market.","part":2},{"id":37,"theme":"大学・奨学金","words":[{"w":"faculty","jp":"教授陣、学部","tier":"A","ref":"TSL 767","note_html":"集合名詞。<code>faculty members</code>、<code>the faculty voted</code>。「能力」の意味もあるがTOEICでは大学文脈。"},{"w":"tuition","jp":"授業料","tier":"A","ref":"TSL 694","note_html":"不可算名詞。<code>pay / raise / freeze tuition</code>、<code>tuition reimbursement</code>（学費補助）。"},{"w":"scholarship","jp":"奨学金","tier":"A","ref":"TSL 427","note_html":"<code>apply for / receive a scholarship</code>、<code>a full scholarship</code>。"},{"w":"campus","jp":"キャンパス、構内","tier":"A","ref":"TSL 662","note_html":"<code>on campus</code>（構内で、冠詞なし）。前置詞の使い方が問われる。"},{"w":"diploma","jp":"卒業証書、修了証","tier":"A","ref":"TSL 814","note_html":"<code>a copy of your diploma</code>、<code>earn a diploma</code>。degree（学位）との違いに注意。"}],"translation":"教授陣は来年度の授業料を据え置くことを議決し、東キャンパスの学生に新たな奨学金が支給されることになりました。応募者は卒業証書の写しを提出する必要があります。","html":"The <b class=\"tg\">faculty</b> voted to freeze <b class=\"tg\">tuition</b> for the coming year, and a new <b class=\"tg\">scholarship</b> will be offered to students on the eastern <b class=\"tg\">campus</b>. Applicants must submit a copy of their <b class=\"tg\">diploma</b>.","part":2},{"id":38,"theme":"環境・廃棄物","words":[{"w":"consumption","jp":"消費、消費量","tier":"A","ref":"TSL 758","note_html":"<code>energy / fuel consumption</code>、<code>reduce consumption</code>。動詞 consume、名詞 consumer。"},{"w":"disposable","jp":"使い捨ての","tier":"A","ref":"TSL 860","note_html":"<code>disposable cups / gloves</code>。reusable（再利用可能な）と対で。"},{"w":"dispose of","jp":"〜を処分する","tier":"A","ref":"TSL 860","note_html":"of が必須。<code>dispose of waste properly</code>。名詞 disposal。Part 5の前置詞問題に直結。"},{"w":"environmentally","jp":"環境的に","tier":"A","ref":"TSL 818","note_html":"<code>environmentally friendly</code>（環境に優しい）が最頻出。この形でまとめて覚える。"},{"w":"accumulate","jp":"蓄積する、たまる","tier":"A","ref":"TSL 563","note_html":"<code>accumulate points / experience / dust</code>。自動詞・他動詞の両方で使う。"}],"translation":"オフィスが使い捨てのカップを陶器のマグに切り替えて以来、エネルギー消費量は減少しています。生ごみは緑の箱に処分してください。また、環境に優しい取り組みは、認証取得に向けたポイントの蓄積にも役立ちます。","html":"Energy <b class=\"tg\">consumption</b> has fallen since the office replaced <b class=\"tg\">disposable</b> cups with ceramic mugs. Please <b class=\"tg\">dispose of</b> food waste in the green bin, and note that <b class=\"tg\">environmentally</b> friendly practices help us <b class=\"tg\">accumulate</b> points toward certification.","part":2},{"id":39,"theme":"飲食・ケータリング","words":[{"w":"caterer","jp":"仕出し業者","tier":"A","ref":"TSL 439","note_html":"<code>hire a caterer</code>。動詞 cater、名詞 catering と語族で。"},{"w":"culinary","jp":"料理の","tier":"A","ref":"TSL 629","note_html":"<code>culinary skill / school / arts</code>。cooking の格式ばった形容詞。"},{"w":"specialty","jp":"名物、専門分野","tier":"A","ref":"TSL 587","note_html":"<code>the restaurant&#x27;s specialty</code>、<code>a specialty store</code>（専門店）。英国式は speciality。"},{"w":"baked goods","jp":"焼き菓子、パン類","tier":"A","ref":"TSL 494","note_html":"常に複数形。<code>fresh baked goods</code>。bakery の商品を総称する。"},{"w":"diner","jp":"軽食堂／食事客","tier":"A","ref":"TSL 596","note_html":"<code>a roadside diner</code>、<code>the diner ordered soup</code>。店と人の2義があり、文脈で判別する。"}],"translation":"レセプションのために雇われた仕出し業者は料理の腕前で知られており、その名物は地元産のシーフードです。新鮮なパン類も通りの向かいの軽食堂から届けられます。","html":"The <b class=\"tg\">caterer</b> hired for the reception is known for its <b class=\"tg\">culinary</b> skill, and its <b class=\"tg\">specialty</b> is regional seafood. Fresh <b class=\"tg\">baked goods</b> will also be delivered from the <b class=\"tg\">diner</b> across the street.","part":2},{"id":40,"theme":"事務・書類","words":[{"w":"proofread","jp":"校正する","tier":"A","ref":"TSL 532","note_html":"<code>proofread the contract / draft</code>。活用は proofread–proofread–proofread。名詞 proofreader。"},{"w":"duplicate","jp":"複製、写し／複製する","tier":"A","ref":"TSL 597","note_html":"<code>keep a duplicate</code>、<code>duplicate the file</code>。名詞の発音は /-ət/、動詞は /-eɪt/。"},{"w":"postage","jp":"郵便料金","tier":"A","ref":"TSL 613","note_html":"不可算名詞。<code>postage paid</code>、<code>postage and handling</code>（送料手数料）。"},{"w":"stapler","jp":"ホチキス","tier":"A","ref":"TSL 792","note_html":"<code>a stapler on the shelf</code>。Part 1の写真描写や事務用品リストに登場。"},{"w":"reminder","jp":"催促状、思い出させるもの","tier":"A","ref":"TSL 737","note_html":"<code>send a reminder</code>、<code>a friendly reminder that ~</code>（〜のお知らせ）。動詞 remind（<code>remind someone of ~</code>）。"}],"translation":"契約書を注意深く校正し、写しを1部保管しておいてください。郵便料金はすでに支払い済みで、ホチキスは棚の上にあります。宅配業者が到着する前に、私から催促のご連絡をします。","html":"Please <b class=\"tg\">proofread</b> the contract carefully and keep a <b class=\"tg\">duplicate</b> for the file. The <b class=\"tg\">postage</b> has already been paid, and a <b class=\"tg\">stapler</b> is on the shelf; I will send a <b class=\"tg\">reminder</b> before the courier arrives.","part":2},{"id":41,"theme":"出張費の精算","words":[{"w":"discrepancy","jp":"不一致、食い違い","tier":"A","ref":"TSL 970","note_html":"<code>a discrepancy between A and B</code>、<code>resolve a discrepancy</code>。請求額と実額のずれを指す定番語。"},{"w":"reimbursement","jp":"払い戻し、経費精算","tier":"A","ref":"TSL 941","note_html":"<code>travel expense reimbursement</code>、<code>submit a request for reimbursement</code>。動詞 reimburse。"},{"w":"refundable","jp":"返金可能な","tier":"A","ref":"TSL 940","note_html":"<code>fully refundable</code>、<code>non-refundable deposit</code>（返金不可の手付金）。否定形での出題が多い。"},{"w":"waive","jp":"免除する、放棄する","tier":"A","ref":"TSL 955","note_html":"<code>waive the fee / charge / requirement</code>。「本来必要なものを免除する」の意。"},{"w":"expedite","jp":"迅速に処理する","tier":"A","ref":"TSL 1046","note_html":"<code>expedite the process / shipment / paperwork</code>。speed up の格式ばった言い換え。"}],"translation":"財務チームは、報告書と実際の精算額との間に食い違いを発見しました。会議の参加費は金曜日まで返金可能で、書類手続きを迅速に進めれば延滞料を免除すると主催者が同意しています。","html":"The finance team found a <b class=\"tg\">discrepancy</b> between the report and the actual <b class=\"tg\">reimbursement</b> amount. The conference fee is <b class=\"tg\">refundable</b> until Friday, and the organizer agreed to <b class=\"tg\">waive</b> the late charge if we <b class=\"tg\">expedite</b> the paperwork.","part":3},{"id":42,"theme":"チーム運営","words":[{"w":"oversee","jp":"監督する、統括する","tier":"A","ref":"TSL 929","note_html":"<code>oversee a project / department</code>。supervise の言い換え。過去形は oversaw。"},{"w":"brainstorm","jp":"意見を出し合う","tier":"A","ref":"TSL 961","note_html":"<code>brainstorm ideas</code>、<code>a brainstorming session</code>。会議場面の頻出語。"},{"w":"enthusiasm","jp":"熱意","tier":"A","ref":"TSL 907","note_html":"不可算名詞。<code>show enthusiasm for ~</code>。形容詞 enthusiastic、副詞 enthusiastically。"},{"w":"willingness","jp":"意欲、進んで〜する姿勢","tier":"A","ref":"TSL 1193","note_html":"<code>willingness to listen / help / relocate</code>。後ろは to 不定詞。"},{"w":"collaboration","jp":"協働、共同作業","tier":"A","ref":"TSL 964","note_html":"<code>in collaboration with ~</code>、<code>collaboration between departments</code>。動詞 collaborate。"}],"translation":"オルティスさんがそのプロジェクトを統括し、社員が自由に意見を出し合うよう促します。彼女の熱意と、耳を傾ける姿勢が、2部門間の協働をはるかに容易にしました。","html":"Ms. Ortiz will <b class=\"tg\">oversee</b> the project and encourage staff to <b class=\"tg\">brainstorm</b> freely. Her <b class=\"tg\">enthusiasm</b> and her <b class=\"tg\">willingness</b> to listen have made <b class=\"tg\">collaboration</b> between the two departments far easier.","part":3},{"id":43,"theme":"品質管理","words":[{"w":"flaw","jp":"欠陥、傷","tier":"A","ref":"TSL 1049","note_html":"<code>a flaw in the design</code>。defect とほぼ同義だが、より小さな傷にも使う。"},{"w":"flawless","jp":"完璧な、傷のない","tier":"A","ref":"TSL 1049","note_html":"<code>a flawless performance / finish</code>。-less で反対の意味になる派生が問われる。"},{"w":"validate","jp":"検証する、有効にする","tier":"A","ref":"TSL 1191","note_html":"<code>validate the results / a parking ticket</code>（駐車券に認証を受ける）の2用法。"},{"w":"modification","jp":"変更、改良","tier":"A","ref":"TSL 926","note_html":"<code>make a modification to ~</code>、<code>minor modifications</code>。動詞 modify。"},{"w":"reliability","jp":"信頼性","tier":"A","ref":"TSL 942","note_html":"<code>improve product reliability</code>。形容詞 reliable、副詞 reliably。"}],"translation":"2番目のロットは無傷でしたが、塗装のわずか1つの欠陥が出荷を遅らせるのに十分でした。技術者は製品の信頼性を守るため、来週その変更点を検証します。","html":"A single <b class=\"tg\">flaw</b> in the coating was enough to delay shipping, although the second batch was <b class=\"tg\">flawless</b>. Engineers will <b class=\"tg\">validate</b> the <b class=\"tg\">modification</b> next week to protect the <b class=\"tg\">reliability</b> of the product.","part":3},{"id":44,"theme":"設備・停電","words":[{"w":"power outage","jp":"停電","tier":"A","ref":"TSL 1156","note_html":"<code>during the power outage</code>、<code>a scheduled outage</code>。outage 単独でも「供給停止」。"},{"w":"generator","jp":"発電機","tier":"A","ref":"TSL 914","note_html":"<code>a backup generator</code>、<code>the generator kicked in</code>。施設トラブルの場面で頻出。"},{"w":"operational","jp":"稼働している、運用上の","tier":"A","ref":"TSL 1155","note_html":"<code>remain / become fully operational</code>。operation（運営）、operate から。"},{"w":"fire extinguisher","jp":"消火器","tier":"A","ref":"TSL 1047","note_html":"<code>check / inspect the fire extinguisher</code>。安全点検の場面で必出。"},{"w":"hallway","jp":"廊下","tier":"A","ref":"TSL 915","note_html":"<code>at the end of the hallway</code>。corridor とほぼ同義で、Part 1・道案内の場面に出る。"}],"translation":"停電により建物は1時間照明を失いましたが、予備の発電機のおかげでサーバーは稼働を続けました。従業員は、廊下にあるすべての消火器が点検期限内であることを確認しました。","html":"A <b class=\"tg\">power outage</b> left the building without lighting for an hour, but the backup <b class=\"tg\">generator</b> kept the servers <b class=\"tg\">operational</b>. Staff checked that every <b class=\"tg\">fire extinguisher</b> in the <b class=\"tg\">hallway</b> was still within its inspection date.","part":3},{"id":45,"theme":"決算・監査","words":[{"w":"consecutive","jp":"連続した","tier":"A","ref":"TSL 966","note_html":"<code>for the third consecutive year / quarter</code>。in a row の言い換え。"},{"w":"fiscal year","jp":"会計年度","tier":"A","ref":"TSL 980","note_html":"<code>the current fiscal year</code>、<code>fiscal year 2026</code>。日本語の「年度」に相当する。"},{"w":"tremendous","jp":"すさまじい、莫大な","tier":"A","ref":"TSL 1017","note_html":"<code>tremendous growth / success / potential</code>。enormous の言い換え。"},{"w":"auditor","jp":"監査人","tier":"A","ref":"TSL 1030","note_html":"<code>an external / internal auditor</code>。動詞・名詞 audit から。"},{"w":"compliance","jp":"順守、法令遵守","tier":"A","ref":"TSL 1038","note_html":"<code>in compliance with ~</code>（〜に準拠して）、<code>strict compliance</code>。動詞 comply with。"}],"translation":"同社は3会計年度連続で目覚ましい成長を報告しました。外部監査人は、新しい報告基準を厳格に順守している点について経理チームを称賛しました。","html":"For the third <b class=\"tg\">consecutive</b> <b class=\"tg\">fiscal year</b>, the firm reported <b class=\"tg\">tremendous</b> growth. The external <b class=\"tg\">auditor</b> praised the accounting team for its strict <b class=\"tg\">compliance</b> with the new reporting standards.","part":3},{"id":46,"theme":"顧客の囲い込み","words":[{"w":"loyalty program","jp":"ポイント制度、会員優待制度","tier":"A","ref":"TSL 994","note_html":"<code>join / enroll in a loyalty program</code>。rewards program と同義。"},{"w":"personalized","jp":"個人向けにした","tier":"A","ref":"TSL 1002","note_html":"<code>a personalized offer / message / recommendation</code>。動詞 personalize。"},{"w":"exclusively","jp":"〜だけに、独占的に","tier":"A","ref":"TSL 977","note_html":"<code>available exclusively to members</code>。形容詞 exclusive（<code>an exclusive offer</code>）。"},{"w":"compliment","jp":"褒め言葉／褒める","tier":"A","ref":"TSL 1112","note_html":"<code>pay / receive a compliment</code>。complement（補完する）と同音異義なので綴りに注意。"},{"w":"reassure","jp":"安心させる","tier":"A","ref":"TSL 1006","note_html":"<code>reassure customers that ~</code>。that節を伴う形が多い。形容詞 reassuring。"}],"translation":"当社の会員優待制度の加入者は、個人向けの特典を受け取り、内覧時間帯に会員だけで買い物ができます。お客様から褒め言葉をいただいたときは個別に返信し、苦情の際は問題に対応中であることをお伝えして安心していただきます。","html":"Members of our <b class=\"tg\">loyalty program</b> receive <b class=\"tg\">personalized</b> offers and can shop <b class=\"tg\">exclusively</b> during the preview hours. When a customer sends a <b class=\"tg\">compliment</b>, we reply personally; when one complains, we <b class=\"tg\">reassure</b> them that the issue is being handled.","part":3},{"id":47,"theme":"社員旅行","words":[{"w":"company retreat","jp":"社員研修旅行、合宿","tier":"A","ref":"TSL 1171","note_html":"<code>attend the annual company retreat</code>。retreat 単独でも「保養・合宿」。"},{"w":"athletic","jp":"運動の、運動好きな","tier":"A","ref":"TSL 1028","note_html":"<code>an athletic competition / event</code>、<code>athletic shoes</code>。名詞 athlete。"},{"w":"attire","jp":"服装","tier":"A","ref":"TSL 1029","note_html":"不可算名詞。<code>casual / formal / business attire</code>。dress code の説明に使われる。"},{"w":"sunscreen","jp":"日焼け止め","tier":"A","ref":"TSL 1230","note_html":"<code>apply / bring sunscreen</code>。屋外イベントの案内で登場する。"},{"w":"thunderstorm","jp":"雷雨","tier":"A","ref":"TSL 951","note_html":"<code>a thunderstorm is forecast for ~</code>。天気予報アナウンスの定番語。"}],"translation":"社員研修旅行では土曜日に運動競技が行われるため、カジュアルな服装で構いません。日焼け止めを持参してください。なお、日曜日の午後は雷雨の予報が出ています。","html":"The <b class=\"tg\">company retreat</b> includes an <b class=\"tg\">athletic</b> competition on Saturday, so casual <b class=\"tg\">attire</b> is fine. Bring <b class=\"tg\">sunscreen</b>, and note that a <b class=\"tg\">thunderstorm</b> is forecast for Sunday afternoon.","part":3},{"id":48,"theme":"配送・大量発注","words":[{"w":"dispatch","jp":"発送する、派遣する","tier":"A","ref":"TSL 971","note_html":"<code>dispatch the goods / a technician</code>。send の格式ばった言い換え。"},{"w":"fleet","jp":"車両群、船団","tier":"A","ref":"TSL 981","note_html":"<code>a fleet of trucks / vehicles</code>。企業が保有する車両全体を指す。"},{"w":"in bulk","jp":"大量に、まとめて","tier":"A","ref":"TSL 1032","note_html":"<code>buy / order in bulk</code>。前置詞句としてそのまま覚える。"},{"w":"bulk order","jp":"大量注文","tier":"A","ref":"TSL 1032","note_html":"<code>place a bulk order</code>、<code>bulk discount</code>（まとめ買い割引）。"},{"w":"retrieve","jp":"取り出す、回収する","tier":"A","ref":"TSL 1076","note_html":"<code>retrieve data / your order history / lost luggage</code>。「保管場所から取り戻す」の意。"}],"translation":"商品は明日発送し、配送は自社のトラック車両が担当します。まとめ買いをするレストランは15%割引となり、過去の大量注文の履歴はオンラインアカウントから取り出すことができます。","html":"We will <b class=\"tg\">dispatch</b> the goods tomorrow, and our own <b class=\"tg\">fleet</b> of trucks will handle delivery. Restaurants that buy <b class=\"tg\">in bulk</b> save fifteen percent, and you can <b class=\"tg\">retrieve</b> your past <b class=\"tg\">bulk order</b> history from the online account.","part":3},{"id":49,"theme":"IT・電子化","words":[{"w":"activate","jp":"有効にする、起動する","tier":"A","ref":"TSL 957","note_html":"<code>activate your account / card / alarm</code>。反意語 deactivate。"},{"w":"electronically","jp":"電子的に、オンラインで","tier":"A","ref":"TSL 1128","note_html":"<code>submit / sign electronically</code>。形容詞 electronic。"},{"w":"archive","jp":"保存記録、書庫／保管する","tier":"A","ref":"TSL 1025","note_html":"<code>move files to the archive</code>、<code>archived documents</code>。名詞・動詞の両用法。"},{"w":"interactive","jp":"双方向の、対話型の","tier":"A","ref":"TSL 1057","note_html":"<code>an interactive dashboard / map / display</code>。名詞 interaction。"},{"w":"smartphone","jp":"スマートフォン","tier":"A","ref":"TSL 1178","note_html":"<code>works on a smartphone</code>、<code>a smartphone app</code>。mobile device と併せて。"}],"translation":"月曜日までにアカウントを有効化してください。その日からすべての書式がオンラインに移行し、電子署名が必要になります。古いファイルは保存記録に移され、新しい双方向ダッシュボードはスマートフォンでも利用できます。","html":"Please <b class=\"tg\">activate</b> your account before Monday, when all forms move online and must be signed <b class=\"tg\">electronically</b>. Older files will be moved to the <b class=\"tg\">archive</b>, and the new <b class=\"tg\">interactive</b> dashboard also works on a <b class=\"tg\">smartphone</b>.","part":3},{"id":50,"theme":"住居・引っ越し","words":[{"w":"relocation","jp":"移転、転勤","tier":"A","ref":"TSL 1074","note_html":"<code>a relocation package</code>（転勤支援制度）、<code>relocation expenses</code>。動詞 relocate。"},{"w":"condominium","jp":"分譲マンション","tier":"A","ref":"TSL 965","note_html":"短縮形 condo。<code>purchase a condominium</code>。apartment（賃貸)と区別される。"},{"w":"residence","jp":"住居、邸宅","tier":"A","ref":"TSL 1075","note_html":"<code>a private residence</code>、<code>place of residence</code>。動詞 reside、名詞 resident。"},{"w":"rug","jp":"敷物、ラグ","tier":"A","ref":"TSL 1079","note_html":"<code>roll up / replace the rug</code>。carpet より小さい敷物。Part 1に出る。"},{"w":"light fixture","jp":"照明器具","tier":"A","ref":"TSL 1214","note_html":"<code>install / replace a light fixture</code>。fixture は「取り付け備品」。"}],"translation":"部長の転勤支援制度には、オフィス近くの分譲マンションの敷金が含まれています。新居は家具付きですが、玄関の敷物と照明器具は取り替えるつもりだそうです。","html":"The manager&#x27;s <b class=\"tg\">relocation</b> package covers the deposit on a <b class=\"tg\">condominium</b> near the office. His new <b class=\"tg\">residence</b> comes furnished, though he plans to replace the <b class=\"tg\">rug</b> and the <b class=\"tg\">light fixture</b> in the entryway.","part":3},{"id":51,"theme":"ブランド・広報","words":[{"w":"publicize","jp":"公表する、宣伝する","tier":"A","ref":"TSL 935","note_html":"<code>publicize the launch / an event</code>。名詞 publicity。"},{"w":"prestigious","jp":"一流の、権威ある","tier":"A","ref":"TSL 1004","note_html":"<code>a prestigious award / journal / university</code>。名詞 prestige。"},{"w":"trademark","jp":"商標","tier":"A","ref":"TSL 1187","note_html":"<code>register a trademark</code>、<code>a registered trademark</code>。copyright（著作権）、patent（特許）と区別する。"},{"w":"prominently","jp":"目立つように","tier":"A","ref":"TSL 1072","note_html":"<code>appear / be displayed prominently</code>。形容詞 prominent（<code>a prominent figure</code> 著名人）。"},{"w":"acclaimed","jp":"高く評価された","tier":"A","ref":"TSL 1243","note_html":"<code>a critically acclaimed film / photographer</code>。名詞・動詞 acclaim。"}],"translation":"代理店は3誌を通じて発売を宣伝し、そのうち1誌は権威あるデザイン誌です。当社の商標はパッケージに目立つように表示されなければならず、高い評価を受けている写真家がこのキャンペーンの撮影を引き受けました。","html":"The agency will <b class=\"tg\">publicize</b> the launch through three magazines, one of them a <b class=\"tg\">prestigious</b> design journal. Our <b class=\"tg\">trademark</b> must appear <b class=\"tg\">prominently</b> on the packaging, and the <b class=\"tg\">acclaimed</b> photographer has agreed to shoot the campaign.","part":3},{"id":52,"theme":"法務・免責","words":[{"w":"imperative","jp":"絶対必要な","tier":"A","ref":"TSL 919","note_html":"<code>It is imperative that S (should) 原形</code>。that節が原形になる仮定法現在の構文が問われる。"},{"w":"waiver","jp":"権利放棄書、免責同意書","tier":"A","ref":"TSL 955","note_html":"<code>sign a waiver</code>。動詞 waive（免除する）の名詞形。"},{"w":"advisable","jp":"賢明な、望ましい","tier":"A","ref":"TSL 1024","note_html":"<code>It is advisable to do ~</code>。advice、advise と語族で。"},{"w":"copyright","jp":"著作権","tier":"A","ref":"TSL 1115","note_html":"<code>register / hold the copyright</code>、<code>copyright infringement</code>（著作権侵害）。"},{"w":"assurance","jp":"保証、確約","tier":"A","ref":"TSL 1027","note_html":"<code>give an assurance that ~</code>。動詞 assure（<code>assure someone that ~</code>）、insurance（保険）と混同しない。"}],"translation":"ツアー開始前に、参加者全員が免責同意書に署名することが絶対に必要です。出版社からの書面による確約には法的拘束力がないため、今のうちに著作権を登録するのが賢明だと当社の弁護士は述べています。","html":"It is <b class=\"tg\">imperative</b> that every participant sign the <b class=\"tg\">waiver</b> before the tour begins. Our lawyer says it is <b class=\"tg\">advisable</b> to register the <b class=\"tg\">copyright</b> now, since a written <b class=\"tg\">assurance</b> from the publisher is not legally binding.","part":3},{"id":53,"theme":"研修・学習","words":[{"w":"memorize","jp":"暗記する","tier":"A","ref":"TSL 924","note_html":"<code>memorize the manual / a speech</code>。名詞 memory、形容詞 memorable。"},{"w":"familiarity","jp":"精通、なじみ","tier":"A","ref":"TSL 1048","note_html":"<code>familiarity with the software</code>。with が必須。動詞 familiarize（<code>familiarize yourself with ~</code>）。"},{"w":"integral","jp":"不可欠な","tier":"A","ref":"TSL 1056","note_html":"<code>an integral part of ~</code>、<code>be integral to the job</code>。essential の言い換え。"},{"w":"worthwhile","jp":"価値のある","tier":"A","ref":"TSL 1022","note_html":"<code>It is worthwhile to attend / attending</code>。worth、worthy と混同しやすい。"},{"w":"professionally","jp":"専門的に、プロらしく","tier":"A","ref":"TSL 934","note_html":"<code>handle complaints professionally</code>、<code>professionally trained</code>。形容詞 professional。"}],"translation":"新入社員はマニュアル全体を暗記する必要はありませんが、安全に関する章に精通していることは業務に不可欠です。任意の夜間セッションに参加する価値はあり、社員が苦情によりプロらしく対応する助けになります。","html":"New hires need not <b class=\"tg\">memorize</b> the entire manual, but <b class=\"tg\">familiarity</b> with the safety chapter is <b class=\"tg\">integral</b> to the job. Attending the optional evening session is <b class=\"tg\">worthwhile</b>, and it helps staff handle complaints more <b class=\"tg\">professionally</b>.","part":3},{"id":54,"theme":"飲食・接客","words":[{"w":"appetizer","jp":"前菜","tier":"A","ref":"TSL 1100","note_html":"<code>order an appetizer</code>。コース構成 appetizer → entrée → dessert で覚える。"},{"w":"superb","jp":"見事な、極上の","tier":"A","ref":"TSL 1015","note_html":"<code>a superb performance / meal / view</code>。excellent の言い換え。"},{"w":"pastry","jp":"焼き菓子、生地","tier":"A","ref":"TSL 1001","note_html":"<code>fresh pastries</code>、<code>a pastry chef</code>。baked goods と近い語。"},{"w":"cheerful","jp":"愛想のよい、明るい","tier":"A","ref":"TSL 1204","note_html":"<code>a cheerful greeting / atmosphere</code>。接客評価の描写に使う。"},{"w":"hospitality industry","jp":"接客業、ホテル・飲食業界","tier":"A","ref":"TSL 1221","note_html":"<code>work in the hospitality industry</code>。hospitality（もてなし）から。"}],"translation":"シェフの前菜は見事で、隣のパン屋が毎朝焼きたての菓子パンを納入しています。接客業では、愛想のよい挨拶が料理と同じくらい重要です。","html":"The chef&#x27;s <b class=\"tg\">appetizer</b> was <b class=\"tg\">superb</b>, and the bakery next door supplies fresh <b class=\"tg\">pastry</b> every morning. In the <b class=\"tg\">hospitality industry</b>, a <b class=\"tg\">cheerful</b> greeting matters as much as the food.","part":3},{"id":55,"theme":"健康・医療","words":[{"w":"prescribe","jp":"処方する","tier":"A","ref":"TSL 1070","note_html":"<code>prescribe medication for ~</code>。名詞 prescription（処方箋）。"},{"w":"X-ray","jp":"レントゲン、X線","tier":"A","ref":"TSL 936","note_html":"<code>take / review an X-ray</code>。ハイフン付きで大文字X。"},{"w":"nutritionist","jp":"栄養士","tier":"A","ref":"TSL 1227","note_html":"<code>a registered nutritionist</code>。dietitian と近い職名。"},{"w":"nutrition","jp":"栄養","tier":"A","ref":"TSL 1227","note_html":"不可算名詞。<code>good / proper nutrition</code>。形容詞 nutritional（<code>nutritional information</code> 栄養成分表示）。"},{"w":"beneficial","jp":"有益な","tier":"A","ref":"TSL 1105","note_html":"<code>be beneficial for / to ~</code>。名詞 benefit（<code>employee benefits</code> 福利厚生）。"}],"translation":"診療所はレントゲンの結果を確認したうえでのみ薬を処方します。登録栄養士は、1日中デスクに座っている従業員にとって、より良い栄養摂取が有益だと説明しています。","html":"The clinic will <b class=\"tg\">prescribe</b> medication only after reviewing your <b class=\"tg\">X-ray</b> results. A registered <b class=\"tg\">nutritionist</b> explains that better <b class=\"tg\">nutrition</b> is <b class=\"tg\">beneficial</b> for employees who sit at a desk all day.","part":3},{"id":56,"theme":"進行状況","words":[{"w":"underway","jp":"進行中で","tier":"A","ref":"TSL 1018","note_html":"<code>Construction is already underway.</code>、<code>get underway</code>（始まる）。1語で書く点に注意。"},{"w":"rehearsal","jp":"リハーサル、下稽古","tier":"A","ref":"TSL 1168","note_html":"<code>a dress rehearsal</code>、<code>the final rehearsal</code>。動詞 rehearse。"},{"w":"time slot","jp":"時間枠、放送枠","tier":"A","ref":"TSL 1012","note_html":"<code>move to a later time slot</code>、<code>book a time slot</code>。予約・番組表の場面で出る。"},{"w":"additionally","jp":"さらに、加えて","tier":"A","ref":"TSL 958","note_html":"文頭で用いる接続副詞。<code>Additionally, ~</code>。in addition、moreover と同じ働き。"},{"w":"formally","jp":"正式に","tier":"A","ref":"TSL 984","note_html":"<code>formally approve / announce / request</code>。formerly（以前は）と混同しやすいので注意。"}],"translation":"建設はすでに進行中で、最終リハーサルは後の時間枠に変更されました。さらに、そのスケジュールは月曜日の会議で正式に承認される予定です。","html":"Construction is already <b class=\"tg\">underway</b>, and the final <b class=\"tg\">rehearsal</b> has been moved to a later <b class=\"tg\">time slot</b>. <b class=\"tg\">Additionally</b>, the schedule will be <b class=\"tg\">formally</b> approved at Monday&#x27;s meeting.","part":3},{"id":57,"theme":"問い合わせ対応","words":[{"w":"query","jp":"問い合わせ、質問","tier":"A","ref":"TSL 1163","note_html":"<code>receive / respond to a query</code>。inquiry の言い換え。動詞用法もある。"},{"w":"reluctant","jp":"気が進まない","tier":"A","ref":"TSL 943","note_html":"<code>be reluctant to do ~</code>。後ろは to 不定詞。副詞 reluctantly。"},{"w":"occurrence","jp":"出来事、発生","tier":"A","ref":"TSL 1154","note_html":"<code>a rare / common occurrence</code>。動詞 occur（つづりは occurred と r を重ねる）。"},{"w":"partial","jp":"部分的な","tier":"A","ref":"TSL 1067","note_html":"<code>a partial refund / payment</code>。副詞 partially、反意語 complete / full。"},{"w":"considerate","jp":"思いやりのある","tier":"A","ref":"TSL 1206","note_html":"<code>a considerate reply</code>。considerable（かなりの）と意味がまったく違う点が最頻出の狙い目。"}],"translation":"再注文をためらっていたお客様から、配送料についての問い合わせを受けました。こうした事例はまれなので、部分的な返金を提案し、担当者の思いやりのある返信によって問題は解決しました。","html":"We received a <b class=\"tg\">query</b> about the delivery fee from a customer who was <b class=\"tg\">reluctant</b> to order again. Such an <b class=\"tg\">occurrence</b> is rare, so we offered a <b class=\"tg\">partial</b> refund, and the <b class=\"tg\">considerate</b> reply from our agent resolved the matter.","part":3},{"id":58,"theme":"客室清掃","words":[{"w":"housekeeping","jp":"客室清掃、家事","tier":"A","ref":"TSL 1053","note_html":"<code>the housekeeping staff</code>、<code>housekeeping services</code>。ホテル文脈の必出語。"},{"w":"discard","jp":"捨てる、処分する","tier":"A","ref":"TSL 1209","note_html":"<code>discard the empty bottles / old files</code>。throw away の格式ばった言い換え。"},{"w":"pillow","jp":"枕","tier":"A","ref":"TSL 931","note_html":"<code>replace / fluff the pillow</code>、<code>an extra pillow</code>。Part 1・ホテル会話に出る。"},{"w":"wrinkle","jp":"しわ","tier":"A","ref":"TSL 1097","note_html":"<code>press out the wrinkles</code>、<code>wrinkle-free fabric</code>。動詞では「しわになる」。"},{"w":"broom","jp":"ほうき","tier":"A","ref":"TSL 1108","note_html":"<code>sweep with a broom</code>。動詞 sweep とセットでPart 1に登場する。"}],"translation":"客室清掃係が空き瓶を処分し、枕をすべて交換し、カーテンのしわをアイロンで伸ばします。ほうきとモップは廊下の突き当たりの物入れに保管されています。","html":"The <b class=\"tg\">housekeeping</b> staff will <b class=\"tg\">discard</b> the empty bottles, replace each <b class=\"tg\">pillow</b>, and press any <b class=\"tg\">wrinkle</b> out of the curtains. A <b class=\"tg\">broom</b> and a mop are stored in the closet at the end of the corridor.","part":3},{"id":59,"theme":"業績・表彰","words":[{"w":"soar","jp":"急上昇する","tier":"A","ref":"TSL 1179","note_html":"<code>Sales soared.</code>、<code>soaring costs</code>。skyrocket と同義で、増加を表す最上級の動詞。"},{"w":"thrilled","jp":"大喜びして","tier":"A","ref":"TSL 1184","note_html":"<code>be thrilled to do ~</code>、<code>be thrilled about ~</code>。delighted より強い喜び。"},{"w":"nomination","jp":"推薦、ノミネート","tier":"A","ref":"TSL 998","note_html":"<code>receive a nomination for ~</code>。動詞 nominate（<code>nominate someone for an award</code>）。"},{"w":"excellence","jp":"卓越、優秀さ","tier":"A","ref":"TSL 976","note_html":"<code>an award for excellence in ~</code>。形容詞 excellent。"},{"w":"engagement","jp":"関わり、約束、婚約","tier":"A","ref":"TSL 1130","note_html":"<code>customer engagement</code>（顧客との関係構築）、<code>a prior engagement</code>（先約）。TOEICでは後者の「先約」で断り文句に使われる。"}],"translation":"デザイン刷新の後、売上は急上昇し、チームは業界賞への推薦を知って大喜びしました。審査員は、顧客との関係構築における同社の卓越性を挙げました。","html":"Sales <b class=\"tg\">soared</b> after the redesign, and the team was <b class=\"tg\">thrilled</b> to learn of its <b class=\"tg\">nomination</b> for the industry award. The judges cited the company&#x27;s <b class=\"tg\">excellence</b> in customer <b class=\"tg\">engagement</b>.","part":3},{"id":60,"theme":"出版・記録","words":[{"w":"biography","jp":"伝記","tier":"A","ref":"TSL 1106","note_html":"<code>a biography of the founder</code>、<code>write a biography</code>。autobiography（自伝）と区別する。"},{"w":"pamphlet","jp":"小冊子、パンフレット","tier":"A","ref":"TSL 1066","note_html":"<code>distribute a pamphlet</code>。brochure より簡素な冊子を指す。"},{"w":"timeline","jp":"年表、日程","tier":"A","ref":"TSL 1241","note_html":"<code>an illustrated timeline</code>、<code>the project timeline</code>。「時系列の図」と「工程表」の2義。"},{"w":"reunion","jp":"同窓会、再会","tier":"A","ref":"TSL 1008","note_html":"<code>an alumni reunion</code>、<code>a family reunion</code>。re-（再び）+ union。"},{"w":"enrollment","jp":"登録、入学者数","tier":"A","ref":"TSL 1131","note_html":"<code>early enrollment</code>、<code>enrollment is limited</code>。動詞 enroll（<code>enroll in a course</code>）。"}],"translation":"創業者の伝記が、短い小冊子と会社の歴史を図解した年表とともに刊行されます。刊行時期は卒業生の同窓会と重なるため、早期の登録が推奨されます。","html":"A <b class=\"tg\">biography</b> of the founder will be released with a short <b class=\"tg\">pamphlet</b> and an illustrated <b class=\"tg\">timeline</b> of the company&#x27;s history. The launch coincides with the alumni <b class=\"tg\">reunion</b>, so early <b class=\"tg\">enrollment</b> is recommended.","part":3},{"id":61,"theme":"休暇・旅行","words":[{"w":"vacation","jp":"休暇","tier":"S","ref":"TSL 2","note_html":"<code>take / request a week of vacation</code>、<code>be on vacation</code>。TSL2位。英国式は holiday。"},{"w":"upcoming","jp":"今度の、来たるべき","tier":"S","ref":"TSL 86","note_html":"<code>the upcoming trip / event / election</code>。名詞の前でのみ使う。"},{"w":"depart","jp":"出発する","tier":"S","ref":"TSL 76","note_html":"<code>depart from Gate 12</code>、<code>depart for Osaka</code>。名詞 departure。leave の格式ばった語。"},{"w":"overnight","jp":"一晩、一泊で","tier":"S","ref":"TSL 174","note_html":"<code>stay overnight</code>、<code>an overnight delivery</code>（翌日配達）。副詞・形容詞の両用法。"},{"w":"destination","jp":"目的地、行き先","tier":"S","ref":"TSL 63","note_html":"<code>reach the final destination</code>、<code>a popular tourist destination</code>。"}],"translation":"今度の記念旅行のために1週間の休暇を申請しました。4日に出発し、リスボンで一泊して、翌日の午後に最終目的地に着きます。","html":"I have requested a week of <b class=\"tg\">vacation</b> for our <b class=\"tg\">upcoming</b> anniversary trip. We <b class=\"tg\">depart</b> on the fourth, stay <b class=\"tg\">overnight</b> in Lisbon, and reach our final <b class=\"tg\">destination</b> the next afternoon.","part":4},{"id":62,"theme":"空港・機内","words":[{"w":"identification","jp":"身分証明書、識別","tier":"S","ref":"TSL 74","note_html":"<code>a form of photo identification</code>、短縮形 ID。<code>present identification</code>。"},{"w":"baggage","jp":"手荷物","tier":"S","ref":"TSL 152","note_html":"不可算名詞。<code>check your baggage</code>、<code>baggage claim</code>（手荷物受取所）。luggage と同義。"},{"w":"flight attendant","jp":"客室乗務員","tier":"S","ref":"TSL 52","note_html":"<code>A flight attendant will ~</code>。機内アナウンス設定のPart 4に頻出。"},{"w":"exit","jp":"出口／退出する","tier":"S","ref":"TSL 101","note_html":"<code>the nearest exit</code>、<code>emergency exit</code>。動詞では <code>exit the building</code>。"},{"w":"compact","jp":"小型の","tier":"S","ref":"TSL 70","note_html":"<code>a compact bag / car / design</code>。「小さくまとまった」の意で、small より肯定的。"}],"translation":"手荷物をお預けになる前に、カウンターで写真付きの身分証明書をご提示ください。客室乗務員が最寄りの出口をご案内します。小型のかばんは足元に置いていただけます。","html":"Please show a form of photo <b class=\"tg\">identification</b> at the counter before checking your <b class=\"tg\">baggage</b>. A <b class=\"tg\">flight attendant</b> will point out the nearest <b class=\"tg\">exit</b>, and a <b class=\"tg\">compact</b> bag may be kept at your feet.","part":4},{"id":63,"theme":"ホテル・受付","words":[{"w":"receptionist","jp":"受付係","tier":"S","ref":"TSL 72","note_html":"<code>ask the receptionist</code>。reception（受付、歓迎会）と区別する。"},{"w":"reservation","jp":"予約","tier":"S","ref":"TSL 7","note_html":"<code>make / confirm / cancel a reservation</code>。TSL7位。動詞 reserve。"},{"w":"valid","jp":"有効な","tier":"S","ref":"TSL 94","note_html":"<code>valid until six o&#x27;clock</code>、<code>a valid ticket / passport</code>。反意語 invalid。"},{"w":"accommodate","jp":"収容する、便宜を図る","tier":"S","ref":"TSL 217","note_html":"<code>accommodate forty guests</code>、<code>accommodate a request</code>。「収容」と「対応」の2義。"}, rt / an article</code>。名詞 publisher、publication。"},{"w":"preview","jp":"試写、先行公開","tier":"S","ref":"TSL 51","note_html":"<code>a preview chapter / screening</code>。「本公開前に見せるもの」の意。"},{"w":"subscribe","jp":"定期購読する、加入する","tier":"S","ref":"TSL 206","note_html":"<code>subscribe to a magazine</code>。to が必須。名詞 subscription、subscriber。"},{"w":"photographer","jp":"写真家","tier":"S","ref":"TSL 182","note_html":"<code>the photographer who shot the cover</code>。photograph（写真）、photography（写真撮影）と区別する。"}],"translation":"その出版社は来春に報告書を刊行し、会員はオンラインで試読用の章を読むことができます。今月購読を申し込んだ読者には、表紙を撮影した写真家によるプリントも贈られます。","html":"The <b class=\"tg\">publishing</b> house will <b class=\"tg\">publish</b> the report next spring, and members may read a <b class=\"tg\">preview</b> chapter online. Readers who <b class=\"tg\">subscribe</b> this month also receive a print by the <b class=\"tg\">photographer</b> who shot the cover.","part":4},{"id":66,"theme":"応募・資格","words":[{"w":"occupation","jp":"職業","tier":"S","ref":"TSL 64","note_html":"<code>state your current occupation</code>。job より書類向きの語。形容詞 occupational。"},{"w":"certificate","jp":"証明書、修了証","tier":"S","ref":"TSL 159","note_html":"<code>attach a copy of your certificate</code>。動詞 certify、名詞 certification。"},{"w":"eligible","jp":"資格がある","tier":"S","ref":"TSL 150","note_html":"<code>be eligible for the allowance</code>、<code>eligible to apply</code>。for か to不定詞を伴う。名詞 eligibility。"},{"w":"resume","jp":"再開する","tier":"S","ref":"TSL 26","note_html":"<code>resume training / operations</code>。名詞 résumé（履歴書）と同じつづりだが発音・意味が別。TOEICで狙われる。"},{"w":"signature","jp":"署名","tier":"A","ref":"TSL 252","note_html":"<code>require a signature</code>、<code>sign your name</code>。動詞 sign。"}],"translation":"用紙の上部に現在の職業を記入し、証明書の写しを添付してください。手当の受給資格がある職員のみが研修を再開でき、全ページに署名が必要です。","html":"List your current <b class=\"tg\">occupation</b> at the top of the form and attach a copy of your <b class=\"tg\">certificate</b>. Only staff who are <b class=\"tg\">eligible</b> for the allowance may <
