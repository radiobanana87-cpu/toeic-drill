/b> baker in Vienna and works <b class=\"tg\">exceptionally</b> quickly.","part":7},{"id":135,"theme":"研修制度","words":[{"w":"mentoring program","jp":"指導制度、メンター制度","tier":"A","ref":"TSL 607","note_html":"<code>Our mentoring program offers ~</code>。名詞 mentor、mentee。"},{"w":"introductory","jp":"入門の、導入の","tier":"A","ref":"TSL 723","note_html":"<code>an introductory course / offer / price</code>。動詞 introduce、名詞 introduction。"},{"w":"beginner","jp":"初心者","tier":"A","ref":"TSL 849","note_html":"<code>a complete beginner</code>。動詞 begin。novice の言い換え。"},{"w":"hesitant","jp":"ためらっている","tier":"A","ref":"TSL 825","note_html":"<code>be hesitant to sign up</code>。後ろは to 不定詞。動詞 hesitate、名詞 hesitation。"},{"w":"opt","jp":"選ぶ","tier":"A","ref":"TSL 609","note_html":"<code>opt for the shorter version</code>、<code>opt to do ~</code>。形容詞 optional、名詞 option。"}],"translation":"当社の指導制度では、まったくの初心者向けに入門講座を用意しています。申し込みをためらっている方は、代わりに短時間のオンライン版を選ぶこともできます。","html":"Our <b class=\"tg\">mentoring program</b> offers an <b class=\"tg\">introductory</b> course for anyone who is a complete <b class=\"tg\">beginner</b>. If you are <b class=\"tg\">hesitant</b> to sign up, you may <b class=\"tg\">opt</b> for the shorter online version instead.","part":7},{"id":136,"theme":"組織・効率化","words":[{"w":"maximize","jp":"最大化する","tier":"A","ref":"TSL 639","note_html":"<code>maximize output / profit</code>。反意語 minimize。名詞 maximum。"},{"w":"allocation","jp":"配分、割り当て","tier":"A","ref":"TSL 699","note_html":"<code>the allocation of staff</code>、<code>budget allocation</code>。動詞 allocate。"},{"w":"organizational","jp":"組織の、組織上の","tier":"A","ref":"TSL 833","note_html":"<code>an organizational change / chart</code>。名詞 organization、動詞 organize。"},{"w":"creativity","jp":"創造性","tier":"A","ref":"TSL 762","note_html":"<code>room for creativity</code>。形容詞 creative、動詞 create。"},{"w":"entrepreneurship","jp":"起業家精神、起業","tier":"A","ref":"TSL 676","note_html":"<code>a course in entrepreneurship</code>。名詞 entrepreneur。"}],"translation":"生産量を最大化するため、部長は3つのチーム間での人員配分を見直しました。この組織上の変更は創造性を発揮する余地も広げるもので、起業に関する講座も開講される予定です。","html":"To <b class=\"tg\">maximize</b> output, the director revised the <b class=\"tg\">allocation</b> of staff across three teams. The <b class=\"tg\">organizational</b> change also gives more room for <b class=\"tg\">creativity</b>, and a course in <b class=\"tg\">entrepreneurship</b> will be offered.","part":7},{"id":137,"theme":"郵便・配送","words":[{"w":"postal","jp":"郵便の","tier":"A","ref":"TSL 783","note_html":"<code>the postal service</code>、<code>postal code</code>（郵便番号）。名詞 postage、post。"},{"w":"detach","jp":"はがれる、取り外す","tier":"A","ref":"TSL 674","note_html":"<code>The label had begun to detach.</code>、<code>detach the coupon</code>。反意語 attach。"},{"w":"repeatedly","jp":"繰り返し、何度も","tier":"A","ref":"TSL 787","note_html":"<code>We have written repeatedly.</code>。動詞 repeat、名詞 repetition。"},{"w":"urgently","jp":"緊急に、至急","tier":"A","ref":"TSL 799","note_html":"<code>need the form urgently</code>。形容詞 urgent、名詞 urgency。"},{"w":"timely","jp":"時宜を得た、タイミングのよい","tier":"A","ref":"TSL 843","note_html":"<code>a timely reply</code>。**-ly で終わるが形容詞**である点が狙われる。"}],"translation":"宛名ラベルがはがれかけていたため、郵便局が封筒を返送してきました。当方から繰り返し書面を送っており、署名済みの用紙が至急必要ですので、早めのご返信をいただければ幸いです。","html":"The <b class=\"tg\">postal</b> service returned the envelope because the address label had begun to <b class=\"tg\">detach</b>. We have written <b class=\"tg\">repeatedly</b> and now need the signed form <b class=\"tg\">urgently</b>, so a <b class=\"tg\">timely</b> reply would be appreciated.","part":7},{"id":138,"theme":"清掃・手入れ","words":[{"w":"polish","jp":"磨く／つや出し剤","tier":"A","ref":"TSL 612","note_html":"<code>polish the brass railing</code>、<code>furniture polish</code>。比喩で「仕上げを整える」の意もある。"},{"w":"vase","jp":"花瓶","tier":"A","ref":"TSL 654","note_html":"<code>wipe the glass vase</code>。発音は米 /veɪs/。Part 1の室内描写に出る。"},{"w":"customizable","jp":"好みに合わせて変更できる","tier":"A","ref":"TSL 707","note_html":"<code>The chair covers are customizable.</code>。動詞 customize。"},{"w":"fabric","jp":"生地、布地","tier":"A","ref":"TSL 821","note_html":"<code>a heavier fabric</code>、<code>fabric samples</code>。cloth より産業・素材寄りの語。"},{"w":"ideally","jp":"理想的には、できれば","tier":"A","ref":"TSL 720","note_html":"<code>would ideally last three seasons</code>。形容詞 ideal。"}],"translation":"真鍮の手すりを磨き、フロントデスクのガラスの花瓶を拭いてください。椅子カバーは好みに合わせて変更でき、厚手の生地であれば理想的には3シーズンもつはずです。","html":"Please <b class=\"tg\">polish</b> the brass railing and wipe the glass <b class=\"tg\">vase</b> on the front desk. The chair covers are <b class=\"tg\">customizable</b>, and a heavier <b class=\"tg\">fabric</b> would <b class=\"tg\">ideally</b> last three seasons.","part":7},{"id":139,"theme":"予想外の事態","words":[{"w":"unexpected","jp":"予期しない","tier":"A","ref":"TSL 589","note_html":"<code>an unexpected delay / guest</code>。副詞 unexpectedly。反意語 expected。"},{"w":"overlook","jp":"見落とす／見渡す","tier":"A","ref":"TSL 684","note_html":"<code>nearly overlooked the deadline</code> と <code>a room overlooking the sea</code>（海を見渡す部屋）。正反対に見える2義があり頻出。"},{"w":"contrary to","jp":"〜に反して","tier":"A","ref":"TSL 813","note_html":"<code>Contrary to the early reports, ~</code>。後ろは名詞句。"},{"w":"on the contrary","jp":"それどころか、逆に","tier":"A","ref":"TSL 813","note_html":"<code>On the contrary, the backup worked.</code>。前文を否定して逆を述べる。contrary to との使い分けが狙われる。"},{"w":"relieved","jp":"ほっとした","tier":"A","ref":"TSL 736","note_html":"<code>The team was relieved.</code>、<code>be relieved to hear ~</code>。動詞 relieve、名詞 relief。"}],"translation":"予期しない遅れにより、私たちは危うく締切を見落とすところでした。当初の報告に反してデータの損失はなく、それどころかバックアップは完璧に機能し、チームは安堵しました。","html":"An <b class=\"tg\">unexpected</b> delay meant that we nearly <b class=\"tg\">overlooked</b> the deadline. <b class=\"tg\">Contrary to</b> the early reports, no data was lost; <b class=\"tg\">on the contrary</b>, the backup worked perfectly, and the team was <b class=\"tg\">relieved</b>.","part":7},{"id":140,"theme":"新入社員の歓迎","words":[{"w":"Welcome aboard!","jp":"ようこそ、入社おめでとう","tier":"A","ref":"TSL 655","note_html":"新入社員やチームへの加入者を迎える定型のあいさつ。"},{"w":"conveniently","jp":"便利に、都合よく","tier":"A","ref":"TSL 759","note_html":"<code>conveniently located beside ~</code>（〜の隣という便利な場所にある）が最頻出のかたち。"},{"w":"administer","jp":"実施する、管理する","tier":"A","ref":"TSL 802","note_html":"<code>administer a test</code>、<code>administer a program</code>。名詞 administration、administrator。"},{"w":"documentary","jp":"記録映画、ドキュメンタリー","tier":"A","ref":"TSL 630","note_html":"<code>a documentary about the company&#x27;s history</code>。document（文書）から。"},{"w":"eagerly","jp":"熱心に、心待ちに","tier":"A","ref":"TSL 598","note_html":"<code>eagerly waiting to meet you</code>、<code>eagerly anticipated</code>。形容詞 eager。"}],"translation":"ご入社おめでとうございます。研修室は社員食堂の隣という便利な場所にあり、そこで簡単な適性テストを実施します。その後、会社の歴史に関する記録映像を上映します。チーム一同、お会いできるのを心待ちにしています。","html":"<b class=\"tg\">Welcome aboard!</b> The training room is <b class=\"tg\">conveniently</b> located beside the cafeteria, where we will <b class=\"tg\">administer</b> a short placement test. Afterward, a <b class=\"tg\">documentary</b> about the company&#x27;s history will be shown, and the team is <b class=\"tg\">eagerly</b> waiting to meet you.","part":7},{"id":141,"theme":"遠隔会議","words":[{"w":"chairperson","jp":"議長、委員長","tier":"A","ref":"TSL 852","note_html":"<code>The chairperson will join ~</code>。chairman の性別中立形で、公式文書ではこちらが使われる。"},{"w":"videoconference","jp":"テレビ会議","tier":"A","ref":"TSL 1250","note_html":"<code>join by videoconference</code>、<code>hold a videoconference</code>。teleconference（電話会議）と区別する。"},{"w":"convey","jp":"伝える、運ぶ","tier":"A","ref":"TSL 898","note_html":"<code>convey the board&#x27;s decision</code>、<code>convey goods</code>。「意思を伝達する」の意で頻出。"},{"w":"incoming","jp":"入ってくる、着任予定の","tier":"A","ref":"TSL 1222","note_html":"<code>incoming questions / calls / president</code>（次期社長）。反意語 outgoing。"},{"w":"departmental","jp":"部門の、学科の","tier":"A","ref":"TSL 1118","note_html":"<code>the departmental representative</code>、<code>a departmental meeting</code>。名詞 department。"}],"translation":"議長はテレビ会議で参加し、取締役会の決定を伝えます。届いた質問は正午までに部門の担当者に転送してください。","html":"The <b class=\"tg\">chairperson</b> will join by <b class=\"tg\">videoconference</b> and <b class=\"tg\">convey</b> the board&#x27;s decision. Please forward any <b class=\"tg\">incoming</b> questions to the <b class=\"tg\">departmental</b> representative before noon.","part":8},{"id":142,"theme":"障害・中断","words":[{"w":"outage","jp":"供給停止、停電","tier":"A","ref":"TSL 1156","note_html":"<code>a power outage</code>、<code>a service outage</code>。out（外へ）＋-age。"},{"w":"disrupt","jp":"混乱させる、中断させる","tier":"A","ref":"TSL 861","note_html":"<code>disrupt the network / traffic</code>。名詞 disruption。"},{"w":"disruptive","jp":"混乱を招く、妨げになる","tier":"A","ref":"TSL 861","note_html":"<code>The noise may be disruptive.</code>。物・事の性質を表す形容詞。"},{"w":"recur","jp":"再発する、繰り返し起こる","tier":"A","ref":"TSL 872","note_html":"<code>If the problem should recur ~</code>。過去形は recurred。形容詞 recurring。"},{"w":"distraction","jp":"気を散らすもの、注意散漫","tier":"A","ref":"TSL 904","note_html":"<code>less distraction</code>、<code>a source of distraction</code>。動詞 distract。"}],"translation":"停電により2時間ネットワークが遮断され、修理の騒音も業務の妨げになるかもしれません。万一その問題が再発した場合は、気の散る要素が少ない上の階へチームを移動させてください。","html":"A power <b class=\"tg\">outage</b> will <b class=\"tg\">disrupt</b> the network for two hours, and the noise from the repairs may be <b class=\"tg\">disruptive</b>. If the problem should <b class=\"tg\">recur</b>, move the team upstairs, where there is less <b class=\"tg\">distraction</b>.","part":8},{"id":143,"theme":"信頼性・精度","words":[{"w":"dependable","jp":"信頼できる","tier":"A","ref":"TSL 858","note_html":"<code>a dependable scanner / employee</code>。reliable の言い換え。"},{"w":"accuracy","jp":"正確さ、精度","tier":"A","ref":"TSL 1098","note_html":"<code>accuracy drops</code>、<code>improve accuracy</code>。形容詞 accurate、副詞 accurately。"},{"w":"flawed","jp":"欠陥のある","tier":"A","ref":"TSL 1049","note_html":"<code>One sensor is flawed.</code>、<code>a flawed design</code>。名詞 flaw、反意語 flawless。"},{"w":"partially","jp":"部分的に","tier":"A","ref":"TSL 1159","note_html":"<code>works only partially</code>。形容詞 partial、反意語 completely / fully。"},{"w":"dependence","jp":"依存","tier":"A","ref":"TSL 903","note_html":"<code>our dependence on a single unit</code>。**on** が続く。動詞 depend on、形容詞 dependent。"}],"translation":"旧型のスキャナーは信頼できますが、寒冷時には精度が落ちます。センサーの1つに欠陥があり部分的にしか作動しないため、1台の機器への依存は危険です。","html":"The older scanner is <b class=\"tg\">dependable</b>, but its <b class=\"tg\">accuracy</b> drops in cold weather. One sensor is <b class=\"tg\">flawed</b> and works only <b class=\"tg\">partially</b>, so our <b class=\"tg\">dependence</b> on a single unit is risky.","part":8},{"id":144,"theme":"商取引・小売","words":[{"w":"commerce","jp":"商業、通商","tier":"A","ref":"TSL 897","note_html":"<code>local commerce</code>、<code>e-commerce</code>、<code>the Chamber of Commerce</code>（商工会議所）。不可算名詞。"},{"w":"dealership","jp":"販売代理店、特約店","tier":"A","ref":"TSL 857","note_html":"<code>a car dealership</code>。dealer（販売業者）＋-ship。"},{"w":"merchant","jp":"商人、小売業者","tier":"A","ref":"TSL 925","note_html":"<code>a merchant who buys in bulk</code>。形容詞的に <code>a merchant ship</code>（商船）。"},{"w":"bulk","jp":"大量、大部分","tier":"A","ref":"TSL 1032","note_html":"<code>buy in bulk</code>、<code>the bulk of the work</code>（仕事の大半）。2用法とも出る。"},{"w":"debit card","jp":"デビットカード","tier":"A","ref":"TSL 901","note_html":"<code>pay by debit card</code>。credit card と対で、支払い方法の選択肢として登場する。"}],"translation":"メインストリートに自動車販売代理店が開業して以来、地域の商業は活発になりました。大量に仕入れる小売業者は、カウンターでデビットカードでの支払いが可能です。","html":"Local <b class=\"tg\">commerce</b> has grown since the car <b class=\"tg\">dealership</b> opened on Main Street. A <b class=\"tg\">merchant</b> who buys in <b class=\"tg\">bulk</b> may pay by <b class=\"tg\">debit card</b> at the counter.","part":8},{"id":145,"theme":"縫製・生地","words":[{"w":"tailor","jp":"仕立屋／仕立てる、合わせる","tier":"A","ref":"TSL 948","note_html":"<code>a tailor will sew ~</code>、<code>tailor the program to your needs</code>（要望に合わせる）。動詞用法も頻出。"},{"w":"sew","jp":"縫う","tier":"A","ref":"TSL 1176","note_html":"<code>sew the lining by hand</code>。活用は sew–sewed–sewn。発音は /soʊ/ で saw とは異なる。"},{"w":"delicate","jp":"繊細な、壊れやすい","tier":"A","ref":"TSL 902","note_html":"<code>too delicate for the machine</code>、<code>a delicate fabric / matter</code>。物にも問題にも使う。"},{"w":"sewing machine","jp":"ミシン","tier":"A","ref":"TSL 1176","note_html":"<code>use the sewing machine</code>。日本語の「ミシン」は machine の訛りに由来する。"},{"w":"evenly","jp":"均等に、平らに","tier":"A","ref":"TSL 975","note_html":"<code>spread the padding evenly</code>、<code>evenly divided</code>。形容詞 even。"}],"translation":"その絹地はミシンにかけるには繊細すぎるため、仕立屋が裏地を手縫いします。作業を始める前に、詰め物を均等に広げてください。","html":"A <b class=\"tg\">tailor</b> will <b class=\"tg\">sew</b> the lining by hand because the silk is too <b class=\"tg\">delicate</b> for the <b class=\"tg\">sewing machine</b>. Spread the padding <b class=\"tg\">evenly</b> before you begin.","part":8},{"id":146,"theme":"美術・工芸","words":[{"w":"pottery","jp":"陶器、陶芸","tier":"A","ref":"TSL 933","note_html":"不可算名詞。<code>a pottery collection / class</code>。名詞 potter（陶芸家）。"},{"w":"architectural","jp":"建築の、建築上の","tier":"A","ref":"TSL 889","note_html":"<code>architectural models / design</code>。名詞 architect、architecture。"},{"w":"scenery","jp":"風景、景色","tier":"A","ref":"TSL 1174","note_html":"不可算名詞。<code>coastal scenery</code>、<code>enjoy the scenery</code>。数える場合は <code>a piece of scenery</code>。"},{"w":"acclaim","jp":"称賛／称賛する","tier":"A","ref":"TSL 1243","note_html":"<code>win wide acclaim</code>、<code>be acclaimed for ~</code>。名詞・動詞の両用法。"},{"w":"critically acclaimed","jp":"批評家に高く評価された","tier":"A","ref":"TSL 1243","note_html":"<code>a critically acclaimed sculpture / film</code>。決まった組み合わせの表現。"}],"translation":"そのギャラリーの陶器コレクションは、建築模型の写真や海岸の風景画の隣に展示されています。この展覧会は広く称賛を集めており、批評家に高く評価された彫刻1点が来年巡回する予定です。","html":"The gallery&#x27;s <b class=\"tg\">pottery</b> collection is displayed beside photographs of <b class=\"tg\">architectural</b> models and paintings of coastal <b class=\"tg\">scenery</b>. The exhibit has won wide <b class=\"tg\">acclaim</b>, and one <b class=\"tg\">critically acclaimed</b> sculpture will tour next year.","part":8},{"id":147,"theme":"顧客・ファン","words":[{"w":"loyalty","jp":"忠誠、愛顧","tier":"A","ref":"TSL 994","note_html":"<code>customer loyalty</code>、<code>a loyalty program</code>。形容詞 loyal。"},{"w":"foster","jp":"育む、促進する","tier":"A","ref":"TSL 1135","note_html":"<code>foster closer ties / innovation</code>。「時間をかけて育てる」の意。"},{"w":"prominent","jp":"著名な、目立つ","tier":"A","ref":"TSL 1072","note_html":"<code>a prominent enthusiast / figure</code>。副詞 prominently。"},{"w":"enthusiast","jp":"愛好家、熱心なファン","tier":"A","ref":"TSL 908","note_html":"<code>a cycling enthusiast</code>。名詞 enthusiasm、形容詞 enthusiastic。"},{"w":"enthusiastically","jp":"熱心に","tier":"A","ref":"TSL 863","note_html":"<code>spoke enthusiastically about ~</code>。about が続く。"}],"translation":"地元のクラブとの結びつきを深めるようになって以来、顧客の愛顧は高まっています。発表会では、著名なサイクリング愛好家が新しいフレームについて熱心に語りました。","html":"Customer <b class=\"tg\">loyalty</b> has grown since we began to <b class=\"tg\">foster</b> closer ties with local clubs. A <b class=\"tg\">prominent</b> cycling <b class=\"tg\">enthusiast</b> spoke <b class=\"tg\">enthusiastically</b> about the new frame at the launch.","part":8},{"id":148,"theme":"施設・備品","words":[{"w":"ballroom","jp":"大広間、宴会場","tier":"A","ref":"TSL 1104","note_html":"<code>the hotel ballroom</code>。banquet hall と近い語で、式典会場として出る。"},{"w":"gymnasium","jp":"体育館、ジム","tier":"A","ref":"TSL 1217","note_html":"短縮形 gym。<code>on the lower floor</code>。学校・ホテルの設備説明で登場。"},{"w":"(light) bulb","jp":"電球","tier":"A","ref":"TSL 1202","note_html":"<code>replace the burned-out light bulb</code>。<code>burn out</code>（切れる）とセットで覚える。"},{"w":"bookcase","jp":"本棚","tier":"A","ref":"TSL 1233","note_html":"<code>above the bookcase</code>。bookshelf とほぼ同義でPart 1に出る。"},{"w":"microwave (oven)","jp":"電子レンジ","tier":"A","ref":"TSL 995","note_html":"<code>The microwave oven is out of order.</code>。動詞では「レンジで温める」。"}],"translation":"ホテルの宴会場は下の階の体育館の隣にあります。本棚の上の切れた電球を交換してください。なお、休憩室の電子レンジは故障中です。","html":"The hotel <b class=\"tg\">ballroom</b> is next to the <b class=\"tg\">gymnasium</b> on the lower floor. Replace the burned-out <b class=\"tg\">light bulb</b> above the <b class=\"tg\">bookcase</b>, and note that the <b class=\"tg\">microwave oven</b> in the staff room is out of order.","part":8},{"id":149,"theme":"解体・屋外作業","words":[{"w":"demolish","jp":"取り壊す、解体する","tier":"A","ref":"TSL 1117","note_html":"<code>demolish the old shed / building</code>。名詞 demolition。"},{"w":"intersection","jp":"交差点","tier":"A","ref":"TSL 1143","note_html":"<code>near the intersection</code>、<code>at the intersection of A and B</code>。道案内で頻出。"},{"w":"lawn mower","jp":"芝刈り機","tier":"A","ref":"TSL 1226","note_html":"<code>return the lawn mower to the shed</code>。lawn（芝生）＋mow（刈る）。"},{"w":"backpack","jp":"リュックサック","tier":"A","ref":"TSL 1103","note_html":"<code>bring a backpack</code>。Part 1の人物描写にも出る。"},{"w":"blanket","jp":"毛布","tier":"A","ref":"TSL 851","note_html":"<code>a warm blanket</code>。機内サービスや宿泊設備の説明で登場する。"}],"translation":"作業班が火曜日に、交差点近くの古い物置を取り壊します。事前に芝刈り機を物置に戻しておいてください。日没後も残る予定の方は、リュックと暖かい毛布をご持参ください。","html":"Crews will <b class=\"tg\">demolish</b> the old shed near the <b class=\"tg\">intersection</b> on Tuesday. Return the <b class=\"tg\">lawn mower</b> to the shed beforehand, and bring a <b class=\"tg\">backpack</b> and a warm <b class=\"tg\">blanket</b> if you plan to stay after dark.","part":8},{"id":150,"theme":"働き方","words":[{"w":"freelance","jp":"フリーランスの、自由契約の","tier":"A","ref":"TSL 864","note_html":"<code>freelance designers / writers</code>。名詞 freelancer。"},{"w":"flexibility","jp":"柔軟性、融通","tier":"A","ref":"TSL 910","note_html":"<code>the flexibility of the contract</code>、<code>scheduling flexibility</code>。形容詞 flexible。"},{"w":"strategically","jp":"戦略的に","tier":"A","ref":"TSL 876","note_html":"<code>plan strategically</code>、<code>strategically located</code>（立地条件がよい）。形容詞 strategic。"},{"w":"attain","jp":"達成する、到達する","tier":"A","ref":"TSL 890","note_html":"<code>attain the annual target</code>。achieve の格式ばった語。名詞 attainment。"},{"w":"invaluable","jp":"きわめて貴重な","tier":"A","ref":"TSL 868","note_html":"<code>Their experience has proved invaluable.</code>。**valuable の強調形**で、「価値がない」ではない点が最頻出の狙い目。"}],"translation":"当社のフリーランスのデザイナーは、新しい契約の柔軟性を高く評価しています。戦略的に計画すれば年間目標は達成でき、彼らの社外経験はきわめて貴重であることが実証されました。","html":"Our <b class=\"tg\">freelance</b> designers value the <b class=\"tg\">flexibility</b> of the new contract. If we plan <b class=\"tg\">strategically</b>, we can <b class=\"tg\">attain</b> the annual target, and their outside experience has proved <b class=\"tg\">invaluable</b>.","part":8},{"id":151,"theme":"研究・栄養","words":[{"w":"biology","jp":"生物学","tier":"A","ref":"TSL 850","note_html":"<code>the biology lab</code>。形容詞 biological、名詞 biologist。"},{"w":"reproduce","jp":"再現する、複製する","tier":"A","ref":"TSL 873","note_html":"<code>cannot reproduce the earlier results</code>、<code>reproduce a document</code>。名詞 reproduction。"},{"w":"cautiously","jp":"慎重に","tier":"A","ref":"TSL 894","note_html":"<code>handle each sample cautiously</code>。形容詞 cautious、名詞 caution。"},{"w":"dispose","jp":"処分する","tier":"A","ref":"TSL 860","note_html":"<code>Dispose of expired reagents.</code>。**of が必須**。名詞 disposal、形容詞 disposable。"},{"w":"nutritional","jp":"栄養の、栄養上の","tier":"A","ref":"TSL 1227","note_html":"<code>nutritional content / information</code>（栄養成分表示）。名詞 nutrition、nutritionist。"}],"translation":"生物学の実験室では以前の結果を再現できていないため、各検体は慎重に取り扱ってください。使用期限切れの試薬は適切に処分し、各ロットの栄養成分を記録してください。","html":"The <b class=\"tg\">biology</b> lab cannot <b class=\"tg\">reproduce</b> the earlier results, so handle each sample <b class=\"tg\">cautiously</b>. <b class=\"tg\">Dispose</b> of expired reagents properly, and record the <b class=\"tg\">nutritional</b> content of every batch.","part":8},{"id":152,"theme":"屋外イベント","words":[{"w":"spectator","jp":"観客、見物人","tier":"A","ref":"TSL 1084","note_html":"<code>spectators at the rally</code>、<code>a spectator sport</code>。audience（聴衆）との違いは「見る」対象であること。"},{"w":"automotive","jp":"自動車の","tier":"A","ref":"TSL 1199","note_html":"<code>an automotive rally / industry / parts</code>。auto、automobile と語族で。"},{"w":"retriever","jp":"レトリバー犬","tier":"A","ref":"TSL 1076","note_html":"<code>a golden retriever</code>。動詞 retrieve（回収する）から。"},{"w":"slot","jp":"枠、時間帯","tier":"A","ref":"TSL 1012","note_html":"<code>a thirty-minute slot</code>、<code>a time slot</code>。予定表の「枠」を指す。"}],"translation":"自動車ラリーの観客は、レースの合間にゴールデンレトリバーの実演で楽しみました。各クラブには30分の枠が与えられました。","html":"<b class=\"tg\">Spectators</b> at the <b class=\"tg\">automotive</b> rally were entertained between races by a golden <b class=\"tg\">retriever</b> demonstration. Each club was given a thirty-minute <b class=\"tg\">slot</b>.","part":8},{"id":153,"theme":"法律事務所","words":[{"w":"paralegal","jp":"弁護士補助職員","tier":"A","ref":"TSL 1158","note_html":"<code>The paralegal will file ~</code>。para-（補助の）＋legal。法律事務所の職名として出る。"},{"w":"erase","jp":"消去する、消す","tier":"A","ref":"TSL 1211","note_html":"<code>erase the draft from the drive</code>。名詞 eraser（消しゴム）。delete と同義。"},{"w":"fortunately","jp":"幸いにも","tier":"A","ref":"TSL 912","note_html":"<code>Fortunately, the client waited ~</code>。文頭で用いる。形容詞 fortunate、反意語 unfortunately。"},{"w":"comfortably","jp":"快適に、くつろいで","tier":"A","ref":"TSL 1037","note_html":"<code>waited comfortably in the lounge</code>。形容詞 comfortable、名詞 comfort。"}],"translation":"弁護士補助職員が、書類の提出後に共有ドライブから草案を消去します。幸いにも、書類が準備される間、依頼人はラウンジで快適にお待ちいただけました。","html":"The <b class=\"tg\">paralegal</b> will <b class=\"tg\">erase</b> the draft from the shared drive once it is filed. <b class=\"tg\">Fortunately</b>, the client waited <b class=\"tg\">comfortably</b> in the lounge while the documents were prepared.","part":8},{"id":154,"theme":"社員研修旅行","words":[{"w":"retreat","jp":"研修旅行、保養／退却する","tier":"A","ref":"TSL 1171","no :"brew","jp":"淹れる、醸造する","tier":"B","ref":"頻度表外","note_html":"<code>brew coffee / beer</code>。名詞では「淹れたもの」。"},{"w":"gourmet","jp":"高級な、美食の","tier":"B","ref":"頻度表外","note_html":"<code>a gourmet menu / restaurant</code>。名詞では「美食家」。発音は /ˈɡʊrmeɪ/。"},{"w":"cuisine","jp":"料理、料理法","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>regional / French cuisine</code>。food より「様式としての料理」を指す。"}],"translation":"乳製品などの傷みやすい品は、到着後すぐに冷蔵する必要があります。そのカフェは店内でコーヒーを淹れ、高級メニューには郷土料理が並びます。","html":"<b class=\"tg\">Perishable</b> items such as <b class=\"tg\">dairy</b> products must be refrigerated on arrival. The café will <b class=\"tg\">brew</b> coffee on site, and the <b class=\"tg\">gourmet</b> menu features regional <b class=\"tg\">cuisine</b>.","part":9},{"id":164,"theme":"造園・園芸","words":[{"w":"horticulture","jp":"園芸、園芸学","tier":"B","ref":"頻度表外","note_html":"<code>the horticulture club / department</code>。形容詞 horticultural。"},{"w":"greenhouse","jp":"温室","tier":"B","ref":"頻度表外","note_html":"<code>maintain the greenhouse</code>、<code>greenhouse gas</code>（温室効果ガス）。"},{"w":"fertilizer","jp":"肥料","tier":"B","ref":"頻度表外","note_html":"<code>apply fertilizer</code>。動詞 fertilize。"},{"w":"irrigation","jp":"灌漑、散水","tier":"B","ref":"頻度表外","note_html":"<code>irrigation hoses / system</code>。動詞 irrigate。"},{"w":"bush","jp":"低木、茂み","tier":"B","ref":"頻度表外","note_html":"<code>trim the bush</code>。tree より低い植え込みを指す。Part 1に出る。"}],"translation":"園芸クラブが図書館裏の温室を管理しています。梅雨の前に肥料をまき、散水用ホースを点検し、門の脇の低木を刈り込んでください。","html":"The <b class=\"tg\">horticulture</b> club maintains the <b class=\"tg\">greenhouse</b> behind the library. Apply <b class=\"tg\">fertilizer</b> before the rainy season, check the <b class=\"tg\">irrigation</b> hoses, and trim the <b class=\"tg\">bush</b> beside the gate.","part":9},{"id":165,"theme":"環境保護","words":[{"w":"habitat","jp":"生息地","tier":"B","ref":"頻度表外","note_html":"<code>a protected habitat</code>、<code>natural habitat</code>。動植物の生息環境を指す。"},{"w":"endangered","jp":"絶滅危惧の","tier":"B","ref":"頻  the office, new <b class=\"tg\">insulation</b> will <b class=\"tg\">insulate</b> the roof, and the <b class=\"tg\">exterior</b> will be repainted.","part":9},{"id":169,"theme":"出版・資料","words":[{"w":"manuscript","jp":"原稿","tier":"B","ref":"頻度表外","note_html":"<code>The manuscript is being reviewed.</code>、<code>submit a manuscript</code>。"},{"w":"excerpt","jp":"抜粋","tier":"B","ref":"頻度表外","note_html":"<code>an excerpt will appear in ~</code>、<code>an excerpt from the novel</code>。"},{"w":"leaflet","jp":"ちらし、小冊子","tier":"B","ref":"頻度表外","note_html":"<code>distribute a leaflet</code>。flyer、pamphlet と近い語。"},{"w":"handout","jp":"配布資料","tier":"B","ref":"頻度表外","note_html":"<code>a one-page handout</code>。会議・講義で配る資料。"},{"w":"bibliography","jp":"参考文献一覧","tier":"B","ref":"頻度表外","note_html":"<code>a short bibliography</code>。論文や記事の末尾に付す。"}],"translation":"原稿は現在査読中で、抜粋が来月号に掲載されます。講演では、ちらしと1ページの配布資料が、短い参考文献一覧とともに配られます。","html":"The <b class=\"tg\">manuscript</b> is being reviewed, and an <b class=\"tg\">excerpt</b> will appear in next month&#x27;s issue. A <b class=\"tg\">leaflet</b> and a one-page <b class=\"tg\">handout</b> will be distributed at the talk, along with a short <b class=\"tg\">bibliography</b>.","part":9},{"id":170,"theme":"専門職","words":[{"w":"optician","jp":"眼鏡技師、眼鏡店","tier":"B","ref":"頻度表外","note_html":"<code>an optician has opened an office</code>。眼科医は ophthalmologist。"},{"w":"pediatrician","jp":"小児科医","tier":"B","ref":"頻度表外","note_html":"<code>see a pediatrician</code>。英国式は paediatrician。"},{"w":"meteorologist","jp":"気象学者、気象予報士","tier":"B","ref":"頻度表外","note_html":"<code>the local meteorologist</code>。weather forecaster と同義。"},{"w":"mason","jp":"石工、れんが職人","tier":"B","ref":"頻度表外","note_html":"<code>hire a mason</code>。石材・れんがを扱う職人。"},{"w":"locksmith","jp":"錠前屋、鍵師","tier":"B","ref":"頻度表外","note_html":"<code>call a locksmith</code>。lock（錠）＋smith（職人）。"}],"translation":"眼鏡技師と小児科医が新しい医療センターに開業しました。地元の気象予報士が催しで講演し、改修工事のために石工と鍵師が雇われました。","html":"An <b class=\"tg\">optician</b> and a <b class=\"tg\">pediatrician</b> have opened offices in the new medical center. The local <b class=\"tg\">meteorologist</b> will speak at the fair, and a <b class=\"tg\">mason</b> and a <b class=\"tg\">locksmith</b> have been hired for the renovation.","part":9},{"id":171,"theme":"品質・水準","words":[{"w":"impeccable","jp":"申し分のない、非の打ちどころのない","tier":"B","ref":"頻度表外","note_html":"<code>an impeccable record / reputation</code>。flawless の言い換え。"},{"w":"exemplary","jp":"模範的な","tier":"B","ref":"頻度表外","note_html":"<code>exemplary service / conduct</code>。名詞 example から。"},{"w":"obsolete","jp":"時代遅れの、廃れた","tier":"B","ref":"頻度表外","note_html":"<code>The software is now obsolete.</code>。outdated より強く「もう使われない」の意。"},{"w":"optimal","jp":"最適な","tier":"B","ref":"頻度表外","note_html":"<code>the optimal replacement / solution</code>。名詞 optimum、動詞 optimize。"},{"w":"intact","jp":"そのままの、無傷の","tier":"B","ref":"頻度表外","note_html":"<code>keep the data intact</code>、<code>remain intact</code>。叙述用法が中心。"}],"translation":"検査官は、その厨房の記録を申し分のないもの、職員の対応を模範的なものと評しました。旧来のソフトウェアは現在では時代遅れですが、最適な後継製品は既存のデータをそのまま保持できるものでなければなりません。","html":"The inspector described the kitchen&#x27;s record as <b class=\"tg\">impeccable</b> and the staff&#x27;s service as <b class=\"tg\">exemplary</b>. The older software is now <b class=\"tg\">obsolete</b>, but the <b class=\"tg\">optimal</b> replacement must keep the existing data <b class=\"tg\">intact</b>.","part":9},{"id":172,"theme":"道路・歩行者","words":[{"w":"pavement","jp":"舗装、歩道","tier":"B","ref":"頻度表外","note_html":"<code>repairs to the pavement</code>。米国では車道の舗装面、英国では歩道を指す。"},{"w":"crosswalk","jp":"横断歩道","tier":"B","ref":"頻度表外","note_html":"<code>near the crosswalk</code>。英国式は pedestrian crossing。"},{"w":"detour","jp":"迂回路","tier":"B","ref":"頻度表外","note_html":"<code>follow the marked detour</code>、<code>take a detour</code>。工事の告知で頻出。"},{"w":"lamppost","jp":"街灯柱","tier":"B","ref":"頻度表外","note_html":"<code>a damaged lamppost at the corner</code>。Part 1の屋外描写に出る。"},{"w":"curb","jp":"縁石、歩道の縁","tier":"B","ref":"頻度表外","note_html":"<code>park along the curb</code>。動詞では「抑制する」（<code>curb spending</code>）。"}],"translation":"横断歩道付近の舗装の補修が月曜日に始まるため、運転者は表示された迂回路に従ってください。角の破損した街灯柱は交換され、配送車は縁石沿いに駐車してはいけません。","html":"Repairs to the <b class=\"tg\">pavement</b> near the <b class=\"tg\">crosswalk</b> will begin Monday, so drivers should follow the marked <b class=\"tg\">detour</b>. A damaged <b class=\"tg\">lamppost</b> at the corner will be replaced, and delivery vans must not park along the <b class=\"tg\">curb</b>.","part":9},{"id":173,"theme":"会議・意見","words":[{"w":"compelling","jp":"説得力のある、心を引きつける","tier":"B","ref":"頻度表外","note_html":"<code>a compelling case / argument / story</code>。"},{"w":"compel","jp":"強いる、余儀なくさせる","tier":"B","ref":"頻度表外","note_html":"<code>compel someone to do ~</code>。force の格式ばった語。"},{"w":"counterpart","jp":"対応する人、同等の相手","tier":"B","ref":"頻度表外","note_html":"<code>our counterpart in Osaka</code>。他部署・他社の同じ立場の人を指す。"},{"w":"critique","jp":"批評、講評","tier":"B","ref":"頻度表外","note_html":"<code>submit a detailed critique</code>。criticism より中立的で、分析的な講評を指す。"},{"w":"conversely","jp":"逆に、反対に","tier":"B","ref":"頻度表外","note_html":"<code>Conversely, the Nagoya office ~</code>。前文と逆の事実を導く接続副詞。"}],"translation":"コンサルタントはその支店の閉鎖について説得力のある主張を展開しましたが、取締役会に実行を強いるものは何もありません。大阪の担当者は詳細な講評を提出しましたが、逆に名古屋の事業所からは異議が出ませんでした。","html":"The consultant made a <b class=\"tg\">compelling</b> case for closing the branch, though nothing can <b class=\"tg\">compel</b> the board to act. Our <b class=\"tg\">counterpart</b> in Osaka submitted a detailed <b class=\"tg\">critique</b>; <b class=\"tg\">conversely</b>, the Nagoya office raised no objections.","part":9},{"id":174,"theme":"天候・遅延","words":[{"w":"inclement weather","jp":"悪天候","tier":"B","ref":"頻度表外","note_html":"<code>Inclement weather delayed ~</code>。天候による遅延・中止の告知で使われる定型。"},{"w":"harsh","jp":"厳しい、過酷な","tier":"B","ref":"頻度表外","note_html":"<code>harsh conditions / weather / criticism</code>。severe の言い換え。"},{"w":"moisture","jp":"湿気、水分","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>High moisture damaged ~</code>。形容詞 moist。"},{"w":"humidifier","jp":"加湿器","tier":"B","ref":"頻度表外","note_html":"<code>remove a humidifier</code>。反対の機器は dehumidifier（除湿機）。"},{"w":"notification","jp":"通知","tier":"B","ref":"頻度表外","note_html":"<code>a notification was sent to ~</code>。動詞 notify（<code>notify someone of ~</code>）。"}],"translation":"悪天候により出荷が遅れ、週末は過酷な状況が予報されています。高い湿気が在庫の一部を傷めたため、加湿器が保管室から撤去され、全顧客に通知が送られました。","html":"<b class=\"tg\">Inclement weather</b> delayed the shipment, and <b class=\"tg\">harsh</b> conditions are forecast for the weekend. High <b class=\"tg\">moisture</b> damaged part of the stock, so a <b class=\"tg\">humidifier</b> was removed from the storeroom, and a <b class=\"tg\">notification</b> was sent to all clients.","part":9},{"id":175,"theme":"後任人事","words":[{"w":"narrow down","jp":"絞り込む","tier":"追加","ref":"ランク表外","note_html":"<code>narrow down the list / the options / the candidates</code>。選択肢を減らしていく動作。"},{"w":"replacement","jp":"後継者、後任","tier":"S","ref":"TSL 82","note_html":"<code>the director&#x27;s replacement</code>、<code>hire a replacement</code>。「交換品」の語義が有名だが、**人に対して「後任」**の意味でもよく出る。"},{"w":"well-rounded","jp":"多方面に優れた、バランスの取れた","tier":"追加","ref":"ランク表外","note_html":"<code>a well-rounded manager / education</code>。特定分野に偏らない能力を指す。"},{"w":"hold a position","jp":"職に就いている","tier":"追加","ref":"ランク表外","note_html":"<code>has held a position overseas</code>。post、role でも同じ形が使える。"},{"w":"credentials","jp":"実績、資格","tier":"B","ref":"頻度表外","note_html":"<code>review each applicant&#x27;s credentials</code>。学位・免許だけでなく**職歴を含む「実績」全般**を指す。通常は複数形。"}],"translation":"委員会は金曜日までに、部長の後任候補の一覧を絞り込みます。海外で職に就いた経験のある、多方面に優れた管理職を求めており、各応募者の実績は個別に審査されます。","html":"The committee will <b class=\"tg\">narrow down</b> the list of candidates for the director&#x27;s <b class=\"tg\">replacement</b> by Friday. We are looking for a <b class=\"tg\">well-rounded</b> manager who has <b class=\"tg\">held a position</b> overseas, and each applicant&#x27;s <b class=\"tg\">credentials</b> will be reviewed individually.","part":9},{"id":176,"theme":"応募者の評価","words":[{"w":"postgraduate","jp":"大学院の","tier":"追加","ref":"ランク表外","note_html":"<code>a postgraduate degree / program</code>。米国式では graduate school という。"},{"w":"meticulous","jp":"細部まで行き届いた、几帳面な","tier":"追加","ref":"ランク表外","note_html":"<code>meticulous record keeping</code>、<code>meticulously prepared</code>。careful の最上級的な語。"},{"w":"set ~ apart","jp":"〜を際立たせる、他と区別する","tier":"追加","ref":"ランク表外","note_html":"<code>Her record set her apart from the others.</code>。目的語を間に挟む。distinguish の言い換え。"},{"w":"underprepared","jp":"準備不足の","tier":"追加","ref":"ランク表外","note_html":"<code>The candidate seemed underprepared.</code>。under-（不足）＋prepared。"},{"w":"entrust","jp":"委託する、任せる","tier":"追加","ref":"ランク表外","note_html":"<code>entrust the account to her</code>、<code>entrust her with the account</code>。**2つの語順**があり、前置詞が to / with で入れ替わる点が問われる。"}],"translation":"レイエスさんは物流の大学院学位を持ち、その几帳面な記録管理が他の応募者から彼女を際立たせました。最初の候補者は準備不足に見えたため、取締役会は代わりに彼女にその取引先を任せることを決めました。","html":"Ms. Reyes holds a <b class=\"tg\">postgraduate</b> degree in logistics, and her <b class=\"tg\">meticulous</b> record keeping <b class=\"tg\">set</b> her <b class=\"tg\">apart</b> from the other applicants. The first candidate seemed <b class=\"tg\">underprepared</b>, so the board decided to <b class=\"tg\">entrust</b> the account to her instead.","part":9},{"id":177,"theme":"会議での賛否","words":[{"w":"pro","jp":"賛成、賛成論","tier":"追加","ref":"ランク表外","note_html":"通常は複数形。<code>the pros and cons</code>（賛否両論、利点と欠点）。"},{"w":"con","jp":"反対、反対論","tier":"追加","ref":"ランク表外","note_html":"<code>list the cons</code>。pro と対で用いるのが定型で、単独ではあまり使わない。"},{"w":"remark on","jp":"〜について感想を述べる、言及する","tier":"追加","ref":"ランク表外","note_html":"<code>remarked on the cost</code>。on が必須。名詞 remark（発言）。"},{"w":"by all means","jp":"ぜひとも、どうぞ","tier":"追加","ref":"ランク表外","note_html":"<code>By all means, ask for a copy.</code>。相手の申し出を快く承諾する定型表現。"},{"w":"have a word with","jp":"〜と少し話をする","tier":"追加","ref":"ランク表外","note_html":"<code>have a word with the treasurer</code>。**a word** と単数なのが要点。複数形 words にすると「口論する」の意になる。"}],"translation":"採決の前に、工場移転の賛成論と反対論を挙げてください。数名の委員が費用について感想を述べました。数値をご覧になりたい場合は、ぜひ写しをご請求いただくか、会計担当と直接お話しください。","html":"Before the vote, please list the <b class=\"tg\">pros</b> and the <b class=\"tg\">cons</b> of relocating the plant. Several members <b class=\"tg\">remarked on</b> the cost, and if you would like to see the figures, <b class=\"tg\">by all means</b> ask for a copy — or <b class=\"tg\">have a word with</b> the treasurer directly.","part":9},{"id":178,"theme":"施設案内","words":[{"w":"floor plan","jp":"見取り図、間取り図","tier":"追加","ref":"ランク表外","note_html":"<code>according to the floor plan</code>。不動産広告や社内案内で頻出。"},{"w":"east wing","jp":"東棟、東翼","tier":"追加","ref":"ランク表外","note_html":"<code>the meeting rooms are in the east wing</code>。wing は建物から張り出した棟を指す。"},{"w":"patio","jp":"中庭、テラス","tier":"B","ref":"頻度表外","note_html":"<code>lunch will be served on the patio</code>。前置詞は on。"},{"w":"put up","jp":"掲示する、掲げる","tier":"追加","ref":"ランク表外","note_html":"<code>put up the schedule / a notice / a sign</code>。「建てる」「宿泊させる」の語義もある。"},{"w":"upper management","jp":"上層部、経営幹部","tier":"追加","ref":"ランク表外","note_html":"<code>so that upper management can see it</code>。senior management と同義。"}],"translation":"見取り図によれば、会議室は東棟にあり、昼食は中庭で提供されます。経営幹部が見られるよう、改訂版の予定表をエレベーター付近に掲示してください。","html":"According to the <b class=\"tg\">floor plan</b>, the meeting rooms are in the <b class=\"tg\">east wing</b>, and lunch will be served on the <b class=\"tg\">patio</b>. Please <b class=\"tg\">put up</b> the revised schedule near the elevator so that <b class=\"tg\">upper management</b> can see it.","part":9},{"id":179,"theme":"広告・出版","words":[{"w":"publishing house","jp":"出版社","tier":"追加","ref":"ランク表外","note_html":"<code>The publishing house decided to ~</code>。publisher と同義。"},{"w":"run","jp":"広告を出す、掲載する","tier":"S","ref":"NGSL 192","note_html":"<code>run an advertisement / a story</code>。「走る」ではなく**掲載する**の意。"},{"w":"place","jp":"広告を出す、注文する","tier":"S","ref":"NGSL 114","note_html":"<code>place an advertisement / an order</code>。run とほぼ同義で言い換えに使われる。"},{"w":"competitive","jp":"他より安い、競争力のある","tier":"A","ref":"NGSL 1824","note_html":"<code>Our rates are more competitive.</code>。価格文脈では**「安い」**を意味する点が要注意。"},{"w":"publicity","jp":"評判、知名度","tier":"A","ref":"TSL 784","note_html":"<code>improve the firm&#x27;s publicity</code>。宣伝活動だけでなく、その結果としての**世間の評判**も指す。"}],"translation":"その出版社は、3誌に全面広告を掲載し、オンラインには短い広告を出すことを決めました。当社の料金は先方より安く、創業者を紹介した最近の記事は同社の評判を高めました。","html":"The <b class=\"tg\">publishing house</b> decided to <b class=\"tg\">run</b> a full-page advertisement in three magazines and <b class=\"tg\">place</b> a shorter one online. Our rates are more <b class=\"tg\">competitive</b> than theirs, and a recent article that <b class=\"tg\">profiled</b> the founder has improved the firm&#x27;s <b class=\"tg\">publicity</b>.","part":9},{"id":180,"theme":"空港・移動","words":[{"w":"luggage allowance","jp":"手荷物許容量、無料手荷物枠","tier":"追加","ref":"ランク表外","note_html":"<code>a luggage allowance of two bags</code>。baggage allowance ともいう。"},{"w":"be subject to","jp":"〜次第である、〜を受けやすい","tier":"追加","ref":"ランク表外","note_html":"<code>subject to change without notice</code>（予告なく変更されることがある）が最頻出の定型。to は前置詞。"},{"w":"shower","jp":"にわか雨","tier":"追加","ref":"ランク表外","note_html":"<code>a brief shower is expected</code>。天気予報での定番語。「シャワー」以外のこの語義が問われる。"},{"w":"drop-off","jp":"車寄せ、持ち込み場所","tier":"追加","ref":"ランク表外","note_html":"<code>the covered drop-off area</code>、<code>a drop-off point</code>。動詞句 drop off（降ろす、届ける）から。"},{"w":"save ~ the trouble","jp":"〜の手間を省く","tier":"追加","ref":"ランク表外","note_html":"<code>It will save you the trouble of walking.</code>。of の後ろは動名詞。"}],"translation":"航空券には手荷物2個分の無料枠が含まれますが、重量制限は予告なく変更されることがあります。今日の午後はにわか雨が予想されるため、4番ゲートの屋根付き車寄せをご利用ください。駐車場を歩く手間が省けます。","html":"Your ticket includes a <b class=\"tg\">luggage allowance</b> of two bags, though the weight limit <b class=\"tg\">is subject to</b> change without notice. A brief <b class=\"tg\">shower</b> is expected this afternoon, so use the covered <b class=\"tg\">drop-off</b> area at Gate 4 — it will <b class=\"tg\">save</b> you the <b class=\"tg\">trouble</b> of walking across the lot.","part":9},{"id":181,"theme":"備品・退社前","words":[{"w":"out of the box","jp":"箱から出してすぐ使える、初期設定不要で","tier":"追加","ref":"ランク表外","note_html":"<code>The scanner works out of the box.</code>。設定作業が要らないことを表す。"},{"w":"deteriorate","jp":"劣化する、悪化する","tier":"追加","ref":"ランク表外","note_html":"<code>The seal will deteriorate if ~</code>。物にも状況にも使う。名詞 deterioration。"},{"w":"staple","jp":"ホチキスの針／ホチキスで留める","tier":"追加","ref":"ランク表外","note_html":"<code>refill the staples</code>。**針**を指す点に注意。器具は stapler。「主要産物」の語義もある。"},{"w":"handout","jp":"配布資料","tier":"B","ref":"頻度表外","note_html":"<code>copy the handout for tomorrow</code>。会議や講義で配る紙資料。"},{"w":"leave for the day","jp":"その日の仕事を終えて退社する","tier":"追加","ref":"ランク表外","note_html":"<code>before you leave for the day</code>。単なる leave との違いは「その日の業務終了」を含意すること。"}],"translation":"そのスキャナーは箱から出してすぐ使えるので、設定は不要です。ゴム製のパッキンは暖房器具の近くに保管すると劣化します。退社する前に、ホチキスの針を補充し、明日の配布資料をコピーしておいてください。","html":"The scanner works <b class=\"tg\">out of the box</b>, so no setup is required. The rubber seal will <b class=\"tg\">deteriorate</b> if it is stored near a heater. Please refill the <b class=\"tg\">staples</b> and copy the <b class=\"tg\">handout</b> for tomorrow before you <b class=\"tg\">leave for the day</b>.","part":9},{"id":182,"theme":"催し・表彰","words":[{"w":"premiere","jp":"初日、初公開","tier":"B","ref":"頻度表外","note_html":"<code>the premiere of the documentary</code>、<code>a film premiere</code>。映画・演劇の初回上演を指す。発音は /prɪˈmɪr/。"},{"w":"commend","jp":"賞賛する、推薦する","tier":"B","ref":"頻度表外","note_html":"<code>commend the volunteers for their work</code>。for が続く。名詞 commendation。"},{"w":"contestant","jp":"出場者、参加者","tier":"追加","ref":"ランク表外","note_html":"<code>each contestant received a gift</code>。コンテストや競技の参加者。名詞 contest。"},{"w":"fond memories","jp":"楽しい思い出","tier":"追加","ref":"ランク表外","note_html":"<code>take away fond memories of ~</code>。fond は「愛情のこもった」。<code>be fond of ~</code>（〜が好きだ）とセットで。"}],"translation":"そのドキュメンタリーの初日上映には大勢の人が集まり、市長はボランティアの働きを賞賛しました。出場者にはそれぞれ小さな贈り物が渡され、多くの来場者がその晩の楽しい思い出を持ち帰ると話していました。","html":"The <b class=\"tg\">premiere</b> of the documentary drew a large crowd, and the mayor <b class=\"tg\">commended</b> the volunteers for their work. Each <b class=\"tg\">contestant</b> received a small gift, and many guests said they would take away <b class=\"tg\">fond memories</b> of the evening.","part":9},{"id":183,"theme":"仲介契約の条件","words":[{"w":"commission","jp":"依頼する／手数料","tier":"A","ref":"NGSL 1593","note_html":"動詞では <code>be commissioned to do ~</code>（〜するよう委託される）、<code>commission an artist</code>。名詞では「手数料、委員会」。TOEICでは動詞・名詞の両方で出る。"},{"w":"be obligated to","jp":"〜する義務がある","tier":"追加","ref":"ランク表外","note_html":"<code>be obligated to submit a report</code>。後ろは to 不定詞。名詞 obligation。be obliged to とほぼ同義。"},{"w":"stipulated","jp":"規定の、明記された","tier":"追加","ref":"ランク表外","note_html":"<code>the stipulated rate / period / conditions</code>。動詞 stipulate（契約書などで明記する）。"},{"w":"payable commission","jp":"未払いの手数料","tier":"追加","ref":"ランク表外","note_html":"payable は「支払われるべき、未払いの」。<code>accounts payable</code>（買掛金）と同じ用法で、**「支払可能な」ではない**点に注意。"},{"w":"whereby","jp":"それによって、〜という","tier":"追加","ref":"ランク表外","note_html":"<code>a clause whereby either party may withdraw</code>。関係副詞で、直前の名詞（規定・仕組み）の内容を説明する。書面でよく使われる。"}],"translation":"本契約に基づき、代理店は当該建物の入居者を探すことを委託され、毎月書面で報告する義務を負います。規定の料率は5パーセントで、未払いの手数料は賃貸契約の締結から30日後に精算されます。契約にはまた、いずれの当事者も60日前の通知により解除できるという条項が含まれています。","html":"Under the agreement, the agency is <b class=\"tg\">commissioned</b> to find tenants for the building and is <b class=\"tg\">obligated to</b> submit a written report each month. The <b class=\"tg\">stipulated</b> rate is five percent, and any <b class=\"tg\">payable commission</b> is settled thirty days after a lease is signed. The contract also contains a clause <b class=\"tg\">whereby</b> either party may withdraw with sixty days&#x27; notice.","part":10},{"id":184,"theme":"工場の操業停止","words":[{"w":"close one's doors","jp":"閉店する、操業をやめる","tier":"追加","ref":"ランク表外","note_html":"<code>The plant will close its doors in June.</code>。事業の終了を表す慣用表現。"},{"w":"faulty","jp":"欠陥のある","tier":"A","ref":"TSL 497","note_html":"<code>a faulty batch / wire / switch</code>。defective の言い換え。名詞 fault。"},{"w":"abruptly","jp":"突然に、出し抜けに","tier":"追加","ref":"ランク表外","note_html":"<code>ended the contract abruptly</code>。suddenly より「前触れなく、無愛想に」という含みがある。形容詞 abrupt。"},{"w":"be billed","jp":"請求される","tier":"追加","ref":"ランク表外","note_html":"<code>buyers who had already been billed</code>。動詞 bill（請求する）の受動態。名詞 bill（請求書）。"},{"w":"shortcoming","jp":"欠点、至らない点","tier":"B","ref":"頻度表外","note_html":"<code>acknowledge the shortcoming in the process</code>。通常は可算名詞で、複数形 shortcomings も多い。weakness の言い換え。"}],"translation":"そのバルブ工場は、欠陥のあったロットが回収されてから18か月後の6月に操業を停止します。最大の取引先が供給契約を突然打ち切り、回収対象の製品についてすでに請求を受けていた購入者には全額が返金されました。経営陣はその後、検査工程における至らなさを認めています。","html":"The valve plant will <b class=\"tg\">close its doors</b> in June, eighteen months after a <b class=\"tg\">faulty</b> batch was recalled. Its largest customer ended the supply contract <b class=\"tg\">abruptly</b>, and buyers who had already <b class=\"tg\">been billed</b> for the recalled units received full refunds. Management has since acknowledged the <b class=\"tg\">shortcoming</b> in its inspection process.","part":10},{"id":185,"theme":"販売促進","words":[{"w":"manufacturer","jp":"製造元、メーカー","tier":"A","ref":"NGSL 1896","note_html":"<code>a small manufacturer of hiking boots</code>。動詞 manufacture、名詞 manufacturing。"},{"w":"have a following of","jp":"〜の支持を受けている","tier":"追加","ref":"ランク表外","note_html":"<code>has built a following of loyal customers</code>。following は「支持者、愛好者の層」を指す名詞。<code>a large following</code> の形も多い。"},{"w":"drum up","jp":"かき立てる、掘り起こす","tier":"追加","ref":"ランク表外","note_html":"<code>drum up interest / support / business</code>。太鼓を打って人を集めるイメージから。"},{"w":"testimonial","jp":"利用者の声、推薦文","tier":"B","ref":"頻度表外","note_html":"<code>gather testimonials from buyers</code>。広告に載る顧客の評価。testify（証言する）と同語源。"},{"w":"attribute","jp":"特性、属性","tier":"A","ref":"NGSL 2300","note_html":"名詞では <code>mention the same attribute</code>。動詞では <code>attribute A to B</code>（AをBのせいにする）で、名詞は /ˈætrɪbjuːt/、動詞は /əˈtrɪbjuːt/ とアクセントが移る。"}],"translation":"登山靴の小さな製造元が、同じ型を毎年買い替える顧客層の支持を集めています。春の発売前に関心を掘り起こすため、マーケティングチームは長年の購入者30名から利用者の声を集めました。その大半が同じ特性、すなわち捨てずに交換できる靴底に言及していました。","html":"A small <b class=\"tg\">manufacturer</b> of hiking boots has built <b class=\"tg\">a following of</b> customers who replace their boots with the same model year after year. To <b class=\"tg\">drum up</b> interest before the spring launch, the marketing team gathered <b class=\"tg\">testimonials</b> from thirty long-term buyers. Nearly all of them mentioned the same <b class=\"tg\">attribute</b>: a sole that can be replaced rather than discarded.","part":10},{"id":186,"theme":"会計報告","words":[{"w":"accountant","jp":"会計士、経理担当者","tier":"S","ref":"TSL 22","note_html":"<code>our accountant met to review ~</code>。会計処理を担う専門職。"},{"w":"treasurer","jp":"会計係、出納責任者","tier":"B","ref":"頻度表外","note_html":"<code>the club treasurer</code>。団体やクラブで資金を管理する役職。accountant が職業、treasurer が役職という違いを押さえる。"},{"w":"proceeds","jp":"収益、売上金","tier":"A","ref":"NGSL 1367","note_html":"常に複数形。<code>the proceeds from the fair</code>。「催しや売却で得られた金額」を指し、profit（利益）とは異なる。"},{"w":"proceedings","jp":"議事録、議事","tier":"B","ref":"頻度表外","note_html":"常に複数形。<code>the proceedings of the meeting record ~</code>。proceeds と綴りが近いが「議事の記録」を指す。動詞 proceed から。"},{"w":"late fee","jp":"延滞料","tier":"追加","ref":"ランク表外","note_html":"<code>a late fee of £5 will apply</code>。図書館の返却遅れや支払い遅延で発生する料金。"}],"translation":"当会の会計士とクラブの会計係が月曜に集まり、夏祭りの収益を確認しました。金額は4,180ポンドでした。その会合の議事録には、規約の変更が1点記録されています。5月31日以降に納入された会費には5ポンドの延滞料が適用される、というものです。","html":"Our <b class=\"tg\">accountant</b> and the club <b class=\"tg\">treasurer</b> met on Monday to review the <b class=\"tg\">proceeds</b> from the summer fair, which came to £4,180. The <b class=\"tg\">proceedings</b> of that meeting record one change to the rules: a <b class=\"tg\">late fee</b> of £5 will apply to any subscription paid after 31 May.","part":10},{"id":187,"theme":"人員と引き継ぎ","words":[{"w":"staffing","jp":"人員配置、要員","tier":"追加","ref":"ランク表外","note_html":"不可算名詞。<code>Staffing has been thin.</code>、<code>staffing levels</code>（人員水準）。動詞 staff（人員を配置する）から。"},{"w":"outsourced","jp":"外部に委託されている","tier":"追加","ref":"ランク表外","note_html":"<code>two roles were outsourced</code>。動詞 outsource、名詞 outsourcing。反対は in-house（社内で）。"},{"w":"be called upon to","jp":"〜することを要請される","tier":"追加","ref":"ランク表外","note_html":"<code>are called upon to handle escalations</code>。be asked to より格式ばった表現で、responsibility の含みがある。"},{"w":"handover","jp":"引き継ぎ、引き渡し","tier":"追加","ref":"ランク表外","note_html":"<code>a detailed handover note</code>。動詞句 hand over から。英国式の語で、米国式では transition。"},{"w":"swap with","jp":"〜と交換する","tier":"追加","ref":"ランク表外","note_html":"<code>swap shifts with one another</code>。exchange の口語的な言い換え。名詞では <code>a swap</code>。"}],"translation":"昨秋に2つの職務が外部委託されて以来、サポートチームの人員は手薄な状態が続いています。若手が上位対応を要請されることも常態化しているため、退職する担当者はそれぞれ詳細な引き継ぎ書を作成しています。またチーム内では、双方が事前に上長へ知らせることを条件に、勤務を互いに交換することもできます。","html":"<b class=\"tg\">Staffing</b> in the support team has been thin since two roles were <b class=\"tg\">outsourced</b> last autumn. Junior members are now regularly <b class=\"tg\">called upon to</b> handle escalations, so each departing colleague writes a detailed <b class=\"tg\">handover</b> note. Team members may also <b class=\"tg\">swap</b> shifts <b class=\"tg\">with</b> one another, provided both inform the supervisor in advance.","part":10},{"id":188,"theme":"施設の改善","words":[{"w":"steering","jp":"運営の、舵取りの","tier":"追加","ref":"ランク表外","note_html":"<code>the steering group / committee</code>（運営委員会）。事業の方向を決める組織を指す。動詞 steer（舵を取る、導く）。"},{"w":"ramp","jp":"スロープ、傾斜路","tier":"B","ref":"頻度表外","note_html":"<code>a ramp at the rear entrance</code>。段差を解消する斜面。Part 1の写真描写にも出る。"},{"w":"canteen","jp":"食堂","tier":"追加","ref":"ランク表外","note_html":"<code>the canteen will open an hour earlier</code>。英国式で、米国式では cafeteria。社内食堂を指す。"},{"w":"congestion","jp":"渋滞、混雑","tier":"A","ref":"TSL 811","note_html":"<code>the morning congestion on Bramley Road</code>。形容詞 congested。"},{"w":"source","jp":"調達する","tier":"S","ref":"NGSL 623","note_html":"<code>source the seating from a supplier</code>。動詞では「仕入れ先を見つけて調達する」。名詞「情報源、出所」との使い分けが問われる。"}],"translation":"運営委員会はブラムリー拠点における2つの変更を承認しました。裏口にスロープが設置され、また食堂の開店が1時間早まります。これにより、職員はブラムリー通りの朝の渋滞の前に食事を済ませられます。交換用の座席は県内の業者から調達する予定です。","html":"The <b class=\"tg\">steering</b> group has approved two changes at the Bramley site. A <b class=\"tg\">ramp</b> will be built at the rear entrance, and the <b class=\"tg\">canteen</b> will open an hour earlier so that staff can eat before the morning <b class=\"tg\">congestion</b> on Bramley Road. We will <b class=\"tg\">source</b> the replacement seating from a supplier within the county.","part":10},{"id":189,"theme":"受講案内と請求","words":[{"w":"short placement conversation","jp":"クラス分けのための短い面談","tier":"追加","ref":"ランク表外","note_html":"<code>have a short placement conversation by telephone</code>。placement は「配置、割り当て」で、ここでは**受講者を適切なクラスに振り分けるための会話**を指す。就職面接の意味ではない点に注意（就職斡旋の文脈では <code>job placement</code>、<code>the placement office</code>＝就職課となり、そちらは別の語義）。"},{"w":"prose","jp":"散文、文章","tier":"追加","ref":"ランク表外","note_html":"不可算名詞。<code>submit in plain prose rather than bullet points</code>。箇条書きや詩に対する「地の文」を指す。"},{"w":"concise","jp":"簡潔な","tier":"追加","ref":"ランク表外","note_html":"<code>keep it concise</code>。短いだけでなく「無駄がなく要点を押さえている」の意。名詞 concision、副詞 concisely。"},{"w":"account","jp":"取引先、口座、説明","tier":"S","ref":"NGSL 436","note_html":"<code>invoiced per account</code>。法人顧客そのものを指す用法があり、<code>account manager</code>（顧客担当者）はこの意味。「口座」「説明」との区別が問われる。"},{"w":"payable","jp":"支払うべき、未払いの","tier":"追加","ref":"ランク表外","note_html":"<code>the amount still payable</code>。「支払可能な」ではなく「支払義務のある」の意。<code>accounts payable</code>（買掛金）も同じ用法。"}],"translation":"受講希望者には全員、開講前に電話での短いクラス分け面談を受けていただきます。適切なグループに振り分けるためです。提出物は箇条書きではなく通常の文章で作成し、簡潔にまとめてください。法人のお客様には取引先ごとに請求し、毎月の明細に未払い残高を表示します。","html":"Every applicant has a <b class=\"tg\">short placement conversation</b> by telephone before the course begins, so that we can assign a suitable group. Written work should be submitted in plain <b class=\"tg\">prose</b> rather than in bullet points, and we ask that each piece be <b class=\"tg\">concise</b>. Corporate clients are invoiced per <b class=\"tg\">account</b>, and the monthly statement shows the amount still <b class=\"tg\">payable</b>.","part":10}];
const GRAM  = [{"id":1,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）","items":[{"en":"The technicians completed the installation quickly.","ok":true,"note":"正：動詞 completed を修飾するので副詞 quickly。","ja":"技術者たちはその設置作業を素早く完了した。"},{"en":"The delivery arrived prompt on Tuesday morning.","ok":false,"note":"prompt -&gt; promptly：動詞 arrived を修飾するので副詞。","ja":"配達は火曜日の朝に時間どおり到着した。"},{"en":"The new printer operates quiet even at full speed.","ok":false,"note":"quiet -&gt; quietly：動詞 operates を修飾するので副詞が必要。","ja":"新しいプリンターは全速力でも静かに動作する。"},{"en":"Sales rose sharply after the campaign began.","ok":true,"note":"正：自動詞 rose を修飾する副詞 sharply。","ja":"キャンペーン開始後、売上は急激に伸びた。"}]},{"id":2,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）","items":[{"en":"The instructions remain unclearly to new employees.","ok":false,"note":"unclearly -&gt; unclear：remain の補語は形容詞。","ja":"その指示は新入社員には依然として不明瞭だ。"},{"en":"Mr. Ito became a supervisor after only two years.","ok":true,"note":"正：become の補語に名詞句。","ja":"伊藤氏はわずか2年で監督者になった。"},{"en":"Attendance at the seminar was disappointing low.","ok":false,"note":"disappointing -&gt; disappointingly：形容詞 low を修飾するので副詞。","ja":"セミナーの出席率は残念なほど低かった。"},{"en":"The proposal seems reasonable to most board members.","ok":true,"note":"正：seem は補語に形容詞をとる。","ja":"その提案は取締役の大半にとって妥当に思える。"}]},{"id":3,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）","items":[{"en":"The company announced the expansion of its Osaka plant.","ok":true,"note":"正：the ___ of ... の位置は名詞 expansion。","ja":"同社は大阪工場の拡張を発表した。"},{"en":"The applicant has extensive experience in logistics.","ok":true,"note":"正：形容詞 extensive が名詞 experience を修飾。","ja":"その応募者は物流分野で豊富な経験を持つ。"},{"en":"We appreciate your cooperative during the renovation.","ok":false,"note":"cooperative -&gt; cooperation：所有格の後ろは名詞。","ja":"改装期間中のご協力に感謝いたします。"},{"en":"Improve in productivity was noted last quarter.","ok":false,"note":"Improve -&gt; Improvement：主語の位置には名詞。","ja":"前四半期に生産性の向上が認められた。"}]},{"id":4,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）", ust submit two references.","ok":true,"note":"正：人を表す名詞 applicants。","ja":"応募者は全員、推薦状を2通提出しなければならない。"},{"en":"The application deadline has been extended.","ok":true,"note":"正：application が名詞として deadline を修飾する複合名詞。","ja":"出願の締め切りが延長された。"},{"en":"The company hired three new employment last month.","ok":false,"note":"employment -&gt; employees：雇うのは人なので可算の人名詞。","ja":"同社は先月、新たに3名を雇用した。"}]},{"id":8,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）","items":[{"en":"This is a relatively simple procedure.","ok":true,"note":"正：副詞 relatively が形容詞 simple を修飾。","ja":"これは比較的簡単な手順だ。"},{"en":"The firm made a considerable investment in training.","ok":true,"note":"正：形容詞 considerable が名詞 investment を修飾。","ja":"その会社は研修に多額の投資を行った。"},{"en":"She gave a clearly explanation of the policy.","ok":false,"note":"clearly -&gt; clear：名詞 explanation を修飾するので形容詞。","ja":"彼女はその方針について明確な説明をした。"},{"en":"We received a surprising large number of orders.","ok":false,"note":"surprising -&gt; surprisingly：形容詞 large を修飾するので副詞。","ja":"当社は驚くほど多くの注文を受けた。"}]},{"id":9,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）","items":[{"en":"Their decision surprised many shareholders.","ok":true,"note":"正：所有格 Their + 名詞 decision。","ja":"彼らの決定は多くの株主を驚かせた。"},{"en":"The director praised our department&#x27;s efficiency.","ok":true,"note":"正：所有格の後ろに名詞 efficiency。","ja":"部長は我々の部署の効率性を称賛した。"},{"en":"His analyze of the data was thorough.","ok":false,"note":"analyze -&gt; analysis：主語の位置は名詞。","ja":"彼のデータ分析は徹底していた。"},{"en":"We value your loyal as a customer.","ok":false,"note":"loyal -&gt; loyalty：所有格の後ろは名詞。","ja":"顧客としてのあなたの信頼を大切にしています。"}]},{"id":10,"part":1,"cat":"品詞","theme":"品詞の識別（名詞・形容詞・副詞・動詞形）","items":[{"en":"Attendance has risen steady since March.","ok":false,"note":"steady -&gt; steadily：動詞 has risen を修飾するので副詞。","ja":"3月以降、出席率は着実に上昇している。"},{"en":"The staff responded immediate to the request.","ok":false,"note":"immediate -&gt; immediately：動詞 responded を修飾するので副詞。","ja":"スタッフはその要請に即座に対応した。"},{"en":"The equipment is design f
