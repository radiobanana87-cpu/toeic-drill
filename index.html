goods`。bakery の商品を総称する。","tier":"A","ref":"TSL 494","note_html":"常に複数形。<code>fresh baked goods</code>。bakery の商品を総称する。"},{"w":"diner","jp":"軽食堂／食事客","note":"`a roadside diner`、`the diner ordered soup`。店と人の2義があり、文脈で判別する。","tier":"A","ref":"TSL 596","note_html":"<code>a roadside diner</code>、<code>the diner ordered soup</code>。店と人の2義があり、文脈で判別する。"}],"translation":"レセプションのために雇われた仕出し業者は料理の腕前で知られており、その名物は地元産のシーフードです。新鮮なパン類も通りの向かいの軽食堂から届けられます。","html":"The <b class=\"tg\">caterer</b> hired for the reception is known for its <b class=\"tg\">culinary</b> skill, and its <b class=\"tg\">specialty</b> is regional seafood. Fresh <b class=\"tg\">baked goods</b> will also be delivered from the <b class=\"tg\">diner</b> across the street."},{"id":40,"vol":2,"theme":"事務・書類","sentence":"Please **proofread** the contract carefully and keep a **duplicate** for the file. The **postage** has already been paid, and a **stapler** is on the shelf; I will send a **reminder** before the courier arrives.","words":[{"w":"proofread","jp":"校正する","note":"`proofread the contract / draft`。活用は proofread–proofread–proofread。名詞 proofreader。","tier":"A","ref":"TSL 532","note_html":"<code>proofread the contract / draft</code>。活用は proofread–proofread–proofread。名詞 proofreader。"},{"w":"duplicate","jp":"複製、写し／複製する","note":"`keep a duplicate`、`duplicate the file`。名詞の発音は /-ət/、動詞は /-eɪt/。","tier":"A","ref":"TSL 597","note_html":"<code>keep a duplicate</code>、<code>duplicate the file</code>。名詞の発音は /-ət/、動詞は /-eɪt/。"},{"w":"postage","jp":"郵便料金","note":"不可算名詞。`postage paid`、`postage and handling`（送料手数料）。","tier":"A","ref":"TSL 613","note_html":"不可算名詞。<code>postage paid</code>、<code>postage and handling</code>（送料手数料）。"},{"w":"stapler","jp":"ホチキス","note":"`a stapler on the shelf`。Part 1の写真描写や事務用品リストに登場。","tier":"A","ref":"TSL 792","note_html":"<code>a stapler on the shelf</code>。Part 1の写真描写や事務用品リストに登場。"},{"w":"reminder","jp":"催促状、思い出させるもの","note":"`send a reminder`、`a friendly reminder that ~`（〜のお知らせ）。動詞 remind（`remind someone of ~`）。","tier":"A","ref":"TSL 737","note_html":"<code>send a reminder</code>、<code>a friendly reminder that ~</code>（〜のお知らせ）。動詞 remind（<code>remind someone of ~</code>）。"}],"translation":"契約書を注意深く校正し、写しを1部保管しておいてください。郵便料金はすでに支払い済みで、ホチキスは棚の上にあります。宅配業者が到着する前に、私から催促のご連絡をします。","html":"Please <b class=\"tg\">proofread</b> the contract carefully and keep a <b class=\"tg\">duplicate</b> for the file. The <b class=\"tg\">postage</b> has already been paid, and a <b class=\"tg\">stapler</b> is on the shelf; I will send a <b class=\"tg\">reminder</b> before the courier arrives."},{"id":41,"vol":3,"theme":"出張費の精算","sentence":"The finance team found a **discrepancy** between the report and the actual **reimbursement** amount. The conference fee is **refundable** until Friday, and the organizer agreed to **waive** the late charge if we **expedite** the paperwork.","words":[{"w":"discrepancy","jp":"不一致、食い違い","note":"`a discrepancy between A and B`、`resolve a discrepancy`。請求額と実額のずれを指す定番語。","tier":"A","ref":"TSL 970","note_html":"<code>a discrepancy between A and B</code>、<code>resolve a discrepancy</code>。請求額と実額のずれを指す定番語。"},{"w":"reimbursement","jp":"払い戻し、経費精算","note":"`travel expense reimbursement`、`submit a request for reimbursement`。動詞 reimburse。","tier":"A","ref":"TSL 941","note_html":"<code>travel expense reimbursement</code>、<code>submit a request for reimbursement</code>。動詞 reimburse。"},{"w":"refundable","jp":"返金可能な","note":"`fully refundable`、`non-refundable deposit`（返金不可の手付金）。否定形での出題が多い。","tier":"A","ref":"TSL 940","note_html":"<code>fully refundable</code>、<code>non-refundable deposit</code>（返金不可の手付金）。否定形での出題が多い。"},{"w":"waive","jp":"免除する、放棄する","note":"`waive the fee / charge / requirement`。「本来必要なものを免除する」の意。","tier":"A","ref":"TSL 955","note_html":"<code>waive the fee / charge / requirement</code>。「本来必要なものを免除する」の意。"},{"w":"expedite","jp":"迅速に処理する","note":"`expedite the process / shipment / paperwork`。speed up の格式ばった言い換え。","tier":"A","ref":"TSL 1046","note_html":"<code>expedite the process / shipment / paperwork</code>。speed up の格式ばった言い換え。"}],"translation":"財務チームは、報告書と実際の精算額との間に食い違いを発見しました。会議の参加費は金曜日まで返金可能で、書類手続きを迅速に進めれば延滞料を免除すると主催者が同意しています。","html":"The finance team found a <b class=\"tg\">discrepancy</b> between the report and the actual <b class=\"tg\">reimbursement</b> amount. The conference fee is <b class=\"tg\">refundable</b> until Friday, and the organizer agreed to <b class=\"tg\">waive</b> the late charge if we <b class=\"tg\">expedite</b> the paperwork."},{"id":42,"vol":3,"theme":"チーム運営","sentence":"Ms. Ortiz will **oversee** the project and encourage staff to **brainstorm** freely. Her **enthusiasm** and her **willingness** to listen have made **collaboration** between the two departments far easier.","words":[{"w":"oversee","jp":"監督する、統括する","note":"`oversee a project / department`。supervise の言い換え。過去形は oversaw。","tier":"A","ref":"TSL 929","note_html":"<code>oversee a project / department</code>。supervise の言い換え。過去形は oversaw。"},{"w":"brainstorm","jp":"意見を出し合う","note":"`brainstorm ideas`、`a brainstorming session`。会議場面の頻出語。","tier":"A","ref":"TSL 961","note_html":"<code>brainstorm ideas</code>、<code>a brainstorming session</code>。会議場面の頻出語。"},{"w":"enthusiasm","jp":"熱意","note":"不可算名詞。`show enthusiasm for ~`。形容詞 enthusiastic、副詞 enthusiastically。","tier":"A","ref":"TSL 907","note_html":"不可算名詞。<code>show enthusiasm for ~</code>。形容詞 enthusiastic、副詞 enthusiastically。"},{"w":"willingness","jp":"意欲、進んで〜する姿勢","note":"`willingness to listen / help / relocate`。後ろは to 不定詞。","tier":"A","ref":"TSL 1193","note_html":"<code>willingness to listen / help / relocate</code>。後ろは to 不定詞。"},{"w":"collaboration","jp":"協働、共同作業","note":"`in collaboration with ~`、`collaboration between departments`。動詞 collaborate。","tier":"A","ref":"TSL 964","note_html":"<code>in collaboration with ~</code>、<code>collaboration between departments</code>。動詞 collaborate。"}],"translation":"オルティスさんがそのプロジェクトを統括し、社員が自由に意見を出し合うよう促します。彼女の熱意と、耳を傾ける姿勢が、2部門間の協働をはるかに容易にしました。","html":"Ms. Ortiz will <b class=\"tg\">oversee</b> the project and encourage staff to <b class=\"tg\">brainstorm</b> freely. Her <b class=\"tg\">enthusiasm</b> and her <b class=\"tg\">willingness</b> to listen have made <b class=\"tg\">collaboration</b> between the two departments far easier."},{"id":43,"vol":3,"theme":"品質管理","sentence":"A single **flaw** in the coating was enough to delay shipping, although the second batch was **flawless**. Engineers will **validate** the **modification** next week to protect the **reliability** of the product.","words":[{"w":"flaw","jp":"欠陥、傷","note":"`a flaw in the design`。defect とほぼ同義だが、より小さな傷にも使う。","tier":"A","ref":"TSL 1049","note_html":"<code>a flaw in the design</code>。defect とほぼ同義だが、より小さな傷にも使う。"},{"w":"flawless","jp":"完璧な、傷のない","note":"`a flawless performance / finish`。-less で反対の意味になる派生が問われる。","tier":"A","ref":"TSL 1049","note_html":"<code>a flawless performance / finish</code>。-less で反対の意味になる派生が問われる。"},{"w":"validate","jp":"検証する、有効にする","note":"`validate the results / a parking ticket`（駐車券に認証を受ける）の2用法。","tier":"A","ref":"TSL 1191","note_html":"<code>validate the results / a parking ticket</code>（駐車券に認証を受ける）の2用法。"},{"w":"modification","jp":"変更、改良","note":"`make a modification to ~`、`minor modifications`。動詞 modify。","tier":"A","ref":"TSL 926","note_html":"<code>make a modification to ~</code>、<code>minor modifications</code>。動詞 modify。"},{"w":"reliability","jp":"信頼性","note":"`improve product reliability`。形容詞 reliable、副詞 reliably。","tier":"A","ref":"TSL 942","note_html":"<code>improve product reliability</code>。形容詞 reliable、副詞 reliably。"}],"translation":"2番目のロットは無傷でしたが、塗装のわずか1つの欠陥が出荷を遅らせるのに十分でした。技術者は製品の信頼性を守るため、来週その変更点を検証します。","html":"A single <b class=\"tg\">flaw</b> in the coating was enough to delay shipping, although the second batch was <b class=\"tg\">flawless</b>. Engineers will <b class=\"tg\">validate</b> the <b class=\"tg\">modification</b> next week to protect the <b class=\"tg\">reliability</b> of the product."},{"id":44,"vol":3,"theme":"設備・停電","sentence":"A **power outage** left the building without lighting for an hour, but the backup **generator** kept the servers **operational**. Staff checked that every **fire extinguisher** in the **hallway** was still within its inspection date.","words":[{"w":"power outage","jp":"停電","note":"`during the power outage`、`a scheduled outage`。outage 単独でも「供給停止」。","tier":"A","ref":"TSL 1156","note_html":"<code>during the power outage</code>、<code>a scheduled outage</code>。outage 単独でも「供給停止」。"},{"w":"generator","jp":"発電機","note":"`a backup generator`、`the generator kicked in`。施設トラブルの場面で頻出。","tier":"A","ref":"TSL 914","note_html":"<code>a backup generator</code>、<code>the generator kicked in</code>。施設トラブルの場面で頻出。"},{"w":"operational","jp":"稼働している、運用上の","note":"`remain / become fully operational`。operation（運営）、operate から。","tier":"A","ref":"TSL 1155","note_html":"<code>remain / become fully operational</code>。operation（運営）、operate から。"},{"w":"fire extinguisher","jp":"消火器","note":"`check / inspect the fire extinguisher`。安全点検の場面で必出。","tier":"A","ref":"TSL 1047","note_html":"<code>check / inspect the fire extinguisher</code>。安全点検の場面で必出。"},{"w":"hallway","jp":"廊下","note":"`at the end of the hallway`。corridor とほぼ同義で、Part 1・道案内の場面に出る。","tier":"A","ref":"TSL 915","note_html":"<code>at the end of the hallway</code>。corridor とほぼ同義で、Part 1・道案内の場面に出る。"}],"translation":"停電により建物は1時間照明を失いましたが、予備の発電機のおかげでサーバーは稼働を続けました。従業員は、廊下にあるすべての消火器が点検期限内であることを確認しました。","html":"A <b class=\"tg\">power outage</b> left the building without lighting for an hour, but the backup <b class=\"tg\">generator</b> kept the servers <b class=\"tg\">operational</b>. Staff checked that every <b class=\"tg\">fire extinguisher</b> in the <b class=\"tg\">hallway</b> was still within its inspection date."},{"id":45,"vol":3,"theme":"決算・監査","sentence":"For the third **consecutive** **fiscal year**, the firm reported **tremendous** growth. The external **auditor** praised the accounting team for its strict **compliance** with the new reporting standards.","words":[{"w":"consecutive","jp":"連続した","note":"`for the third consecutive year / quarter`。in a row の言い換え。","tier":"A","ref":"TSL 966","note_html":"<code>for the third consecutive year / quarter</code>。in a row の言い換え。"},{"w":"fiscal year","jp":"会計年度","note":"`the current fiscal year`、`fiscal year 2026`。日本語の「年度」に相当する。","tier":"A","ref":"TSL 980","note_html":"<code>the current fiscal year</code>、<code>fiscal year 2026</code>。日本語の「年度」に相当する。"},{"w":"tremendous","jp":"すさまじい、莫大な","note":"`tremendous growth / success / potential`。enormous の言い換え。","tier":"A","ref":"TSL 1017","note_html":"<code>tremendous growth / success / potential</code>。enormous の言い換え。"},{"w":"auditor","jp":"監査人","note":"`an external / internal auditor`。動詞・名詞 audit から。","tier":"A","ref":"TSL 1030","note_html":"<code>an external / internal auditor</code>。動詞・名詞 audit から。"},{"w":"compliance","jp":"順守、法令遵守","note":"`in compliance with ~`（〜に準拠して）、`strict compliance`。動詞 comply with。","tier":"A","ref":"TSL 1038","note_html":"<code>in compliance with ~</code>（〜に準拠して）、<code>strict compliance</code>。動詞 comply with。"}],"translation":"同社は3会計年度連続で目覚ましい成長を報告しました。外部監査人は、新しい報告基準を厳格に順守している点について経理チームを称賛しました。","html":"For the third <b class=\"tg\">consecutive</b> <b class=\"tg\">fiscal year</b>, the firm reported <b class=\"tg\">tremendous</b> growth. The external <b class=\"tg\">auditor</b> praised the accounting team for its strict <b class=\"tg\">compliance</b> with the new reporting standards."},{"id":46,"vol":3,"theme":"顧客の囲い込み","sentence":"Members of our **loyalty program** receive **personalized** offers and can shop **exclusively** during the preview hours. When a customer sends a **compliment**, we reply personally; when one complains, we **reassure** them that the issue is being handled.","words":[{"w":"loyalty program","jp":"ポイント制度、会員優待制度","note":"`join / enroll in a loyalty program`。rewards program と同義。","tier":"A","ref":"TSL 994","note_html":"<code>join / enroll in a loyalty program</code>。rewards program と同義。"},{"w":"personalized","jp":"個人向けにした","note":"`a personalized offer / message / recommendation`。動詞 personalize。","tier":"A","ref":"TSL 1002","note_html":"<code>a personalized offer / message / recommendation</code>。動詞 personalize。"},{"w":"exclusively","jp":"〜だけに、独占的に","note":"`available exclusively to members`。形容詞 exclusive（`an exclusive offer`）。","tier":"A","ref":"TSL 977","note_html":"<code>available exclusively to members</code>。形容詞 exclusive（<code>an exclusive offer</code>）。"},{"w":"compliment","jp":"褒め言葉／褒める","note":"`pay / receive a compliment`。complement（補完する）と同音異義なので綴りに注意。","tier":"A","ref":"TSL 1112","note_html":"<code>pay / receive a compliment</code>。complement（補完する）と同音異義なので綴りに注意。"},{"w":"reassure","jp":"安心させる","note":"`reassure customers that ~`。that節を伴う形が多い。形容詞 reassuring。","tier":"A","ref":"TSL 1006","note_html":"<code>reassure customers that ~</code>。that節を伴う形が多い。形容詞 reassuring。"}],"translation":"当社の会員優待制度の加入者は、個人向けの特典を受け取り、内覧時間帯に会員だけで買い物ができます。お客様から褒め言葉をいただいたときは個別に返信し、苦情の際は問題に対応中であることをお伝えして安心していただきます。","html":"Members of our <b class=\"tg\">loyalty program</b> receive <b class=\"tg\">personalized</b> offers and can shop <b class=\"tg\">exclusively</b> during the preview hours. When a customer sends a <b class=\"tg\">compliment</b>, we reply personally; when one complains, we <b class=\"tg\">reassure</b> them that the issue is being handled."},{"id":47,"vol":3,"theme":"社員旅行","sentence":"The **company retreat** includes an **athletic** competition on Saturday, so casual **attire** is fine. Bring **sunscreen**, and note that a **thunderstorm** is forecast for Sunday afternoon.","words":[{"w":"company retreat","jp":"社員研修旅行、合宿","note":"`attend the annual company retreat`。retreat 単独でも「保養・合宿」。","tier":"A","ref":"TSL 1171","note_html":"<code>attend the annual company retreat</code>。retreat 単独でも「保養・合宿」。"},{"w":"athletic","jp":"運動の、運動好きな","note":"`an athletic competition / event`、`athletic shoes`。名詞 athlete。","tier":"A","ref":"TSL 1028","note_html":"<code>an athletic competition / event</code>、<code>athletic shoes</code>。名詞 athlete。"},{"w":"attire","jp":"服装","note":"不可算名詞。`casual / formal / business attire`。dress code の説明に使われる。","tier":"A","ref":"TSL 1029","note_html":"不可算名詞。<code>casual / formal / business attire</code>。dress code の説明に使われる。"},{"w":"sunscreen","jp":"日焼け止め","note":"`apply / bring sunscreen`。屋外イベントの案内で登場する。","tier":"A","ref":"TSL 1230","note_html":"<code>apply / bring sunscreen</code>。屋外イベントの案内で登場する。"},{"w":"thunderstorm","jp":"雷雨","note":"`a thunderstorm is forecast for ~`。天気予報アナウンスの定番語。","tier":"A","ref":"TSL 951","note_html":"<code>a thunderstorm is forecast for ~</code>。天気予報アナウンスの定番語。"}],"translation":"社員研修旅行では土曜日に運動競技が行われるため、カジュアルな服装で構いません。日焼け止めを持参してください。なお、日曜日の午後は雷雨の予報が出ています。","html":"The <b class=\"tg\">company retreat</b> includes an <b class=\"tg\">athletic</b> competition on Saturday, so casual <b class=\"tg\">attire</b> is fine. Bring <b class=\"tg\">sunscreen</b>, and note that a <b class=\"tg\">thunderstorm</b> is forecast for Sunday afternoon."},{"id":48,"vol":3,"theme":"配送・大量発注","sentence":"We will **dispatch** the goods tomorrow, and our own **fleet** of trucks will handle delivery. Restaurants that buy **in bulk** save fifteen percent, and you can **retrieve** your past **bulk order** history from the online account.","words":[{"w":"dispatch","jp":"発送する、派遣する","note":"`dispatch the goods / a technician`。send の格式ばった言い換え。","tier":"A","ref":"TSL 971","note_html":"<code>dispatch the goods / a technician</code>。send の格式ばった言い換え。"},{"w":"fleet","jp":"車両群、船団","note":"`a fleet of trucks / vehicles`。企業が保有する車両全体を指す。","tier":"A","ref":"TSL 981","note_html":"<code>a fleet of trucks / vehicles</code>。企業が保有する車両全体を指す。"},{"w":"in bulk","jp":"大量に、まとめて","note":"`buy / order in bulk`。前置詞句としてそのまま覚える。","tier":"A","ref":"TSL 1032","note_html":"<code>buy / order in bulk</code>。前置詞句としてそのまま覚える。"},{"w":"bulk order","jp":"大量注文","note":"`place a bulk order`、`bulk discount`（まとめ買い割引）。","tier":"A","ref":"TSL 1032","note_html":"<code>place a bulk order</code>、<code>bulk discount</code>（まとめ買い割引）。"},{"w":"retrieve","jp":"取り出す、回収する","note":"`retrieve data / your order history / lost luggage`。「保管場所から取り戻す」の意。","tier":"A","ref":"TSL 1076","note_html":"<code>retrieve data / your order history / lost luggage</code>。「保管場所から取り戻す」の意。"}],"translation":"商品は明日発送し、配送は自社のトラック車両が担当します。まとめ買いをするレストランは15%割引となり、過去の大量注文の履歴はオンラインアカウントから取り出すことができます。","html":"We will <b class=\"tg\">dispatch</b> the goods tomorrow, and our own <b class=\"tg\">fleet</b> of trucks will handle delivery. Restaurants that buy <b class=\"tg\">in bulk</b> save fifteen percent, and you can <b class=\"tg\">retrieve</b> your past <b class=\"tg\">bulk order</b> history from the online account."},{"id":49,"vol":3,"theme":"IT・電子化","sentence":"Please **activate** your account before Monday, when all forms move online and must be signed **electronically**. Older files will be moved to the **archive**, and the new **interactive** dashboard also works on a **smartphone**.","words":[{"w":"activate","jp":"有効にする、起動する","note":"`activate your account / card / alarm`。反意語 deactivate。","tier":"A","ref":"TSL 957","note_html":"<code>activate your account / card / alarm</code>。反意語 deactivate。"},{"w":"electronically","jp":"電子的に、オンラインで","note":"`submit / sign electronically`。形容詞 electronic。","tier":"A","ref":"TSL 1128","note_html":"<code>submit / sign electronically</code>。形容詞 electronic。"},{"w":"archive","jp":"保存記録、書庫／保管する","note":"`move files to the archive`、`archived documents`。名詞・動詞の両用法。","tier":"A","ref":"TSL 1025","note_html":"<code>move files to the archive</code>、<code>archived documents</code>。名詞・動詞の両用法。"},{"w":"interactive","jp":"双方向の、対話型の","note":"`an interactive dashboard / map / display`。名詞 interaction。","tier":"A","ref":"TSL 1057","note_html":"<code>an interactive dashboard / map / display</code>。名詞 interaction。"},{"w":"smartphone","jp":"スマートフォン","note":"`works on a smartphone`、`a smartphone app`。mobile device と併せて。","tier":"A","ref":"TSL 1178","note_html":"<code>works on a smartphone</code>、<code>a smartphone app</code>。mobile device と併せて。"}],"translation":"月曜日までにアカウントを有効化してください。その日からすべての書式がオンラインに移行し、電子署名が必要になります。古いファイルは保存記録に移され、新しい双方向ダッシュボードはスマートフォンでも利用できます。","html":"Please <b class=\"tg\">activate</b> your account before Monday, when all forms move online and must be signed <b class=\"tg\">electronically</b>. Older files will be moved to the <b class=\"tg\">archive</b>, and the new <b class=\"tg\">interactive</b> dashboard also works on a <b class=\"tg\">smartphone</b>."},{"id":50,"vol":3,"theme":"住居・引っ越し","sentence":"The manager's **relocation** package covers the deposit on a **condominium** near the office. His new **residence** comes furnished, though he plans to replace the **rug** and the **light fixture** in the entryway.","words":[{"w":"relocation","jp":"移転、転勤","note":"`a relocation package`（転勤支援制度）、`relocation expenses`。動詞 relocate。","tier":"A","ref":"TSL 1074","note_html":"<code>a relocation package</code>（転勤支援制度）、<code>relocation expenses</code>。動詞 relocate。"},{"w":"condominium","jp":"分譲マンション","note":"短縮形 condo。`purchase a condominium`。apartment（賃貸)と区別される。","tier":"A","ref":"TSL 965","note_html":"短縮形 condo。<code>purchase a condominium</code>。apartment（賃貸)と区別される。"},{"w":"residence","jp":"住居、邸宅","note":"`a private residence`、`place of residence`。動詞 reside、名詞 resident。","tier":"A","ref":"TSL 1075","note_html":"<code>a private residence</code>、<code>place of residence</code>。動詞 reside、名詞 resident。"},{"w":"rug","jp":"敷物、ラグ","note":"`roll up / replace the rug`。carpet より小さい敷物。Part 1に出る。","tier":"A","ref":"TSL 1079","note_html":"<code>roll up / replace the rug</code>。carpet より小さい敷物。Part 1に出る。"},{"w":"light fixture","jp":"照明器具","note":"`install / replace a light fixture`。fixture は「取り付け備品」。","tier":"A","ref":"TSL 1214","note_html":"<code>install / replace a light fixture</code>。fixture は「取り付け備品」。"}],"translation":"部長の転勤支援制度には、オフィス近くの分譲マンションの敷金が含まれています。新居は家具付きですが、玄関の敷物と照明器具は取り替えるつもりだそうです。","html":"The manager&#x27;s <b class=\"tg\">relocation</b> package covers the deposit on a <b class=\"tg\">condominium</b> near the office. His new <b class=\"tg\">residence</b> comes furnished, though he plans to replace the <b class=\"tg\">rug</b> and the <b class=\"tg\">light fixture</b> in the entryway."},{"id":51,"vol":3,"theme":"ブランド・広報","sentence":"The agency will **publicize** the launch through three magazines, one of them a **prestigious** design journal. Our **trademark** must appear **prominently** on the packaging, and the **acclaimed** photographer has agreed to shoot the campaign.","words":[{"w":"publicize","jp":"公表する、宣伝する","note":"`publicize the launch / an event`。名詞 publicity。","tier":"A","ref":"TSL 935","note_html":"<code>publicize the launch / an event</code>。名詞 publicity。"},{"w":"prestigious","jp":"一流の、権威ある","note":"`a prestigious award / journal / university`。名詞 prestige。","tier":"A","ref":"TSL 1004","note_html":"<code>a prestigious award / journal / university</code>。名詞 prestige。"},{"w":"trademark","jp":"商標","note":"`register a trademark`、`a registered trademark`。copyright（著作権）、patent（特許）と区別する。","tier":"A","ref":"TSL 1187","note_html":"<code>register a trademark</code>、<code>a registered trademark</code>。copyright（著作権）、patent（特許）と区別する。"},{"w":"prominently","jp":"目立つように","note":"`appear / be displayed prominently`。形容詞 prominent（`a prominent figure` 著名人）。","tier":"A","ref":"TSL 1072","note_html":"<code>appear / be displayed prominently</code>。形容詞 prominent（<code>a prominent figure</code> 著名人）。"},{"w":"acclaimed","jp":"高く評価された","note":"`a critically acclaimed film / photographer`。名詞・動詞 acclaim。","tier":"A","ref":"TSL 1243","note_html":"<code>a critically acclaimed film / photographer</code>。名詞・動詞 acclaim。"}],"translation":"代理店は3誌を通じて発売を宣伝し、そのうち1誌は権威あるデザイン誌です。当社の商標はパッケージに目立つように表示されなければならず、高い評価を受けている写真家がこのキャンペーンの撮影を引き受けました。","html":"The agency will <b class=\"tg\">publicize</b> the launch through three magazines, one of them a <b class=\"tg\">prestigious</b> design journal. Our <b class=\"tg\">trademark</b> must appear <b class=\"tg\">prominently</b> on the packaging, and the <b class=\"tg\">acclaimed</b> photographer has agreed to shoot the campaign."},{"id":52,"vol":3,"theme":"法務・免責","sentence":"It is **imperative** that every participant sign the **waiver** before the tour begins. Our lawyer says it is **advisable** to register the **copyright** now, since a written **assurance** from the publisher is not legally binding.","words":[{"w":"imperative","jp":"絶対必要な","note":"`It is imperative that S (should) 原形`。that節が原形になる仮定法現在の構文が問われる。","tier":"A","ref":"TSL 919","note_html":"<code>It is imperative that S (should) 原形</code>。that節が原形になる仮定法現在の構文が問われる。"},{"w":"waiver","jp":"権利放棄書、免責同意書","note":"`sign a waiver`。動詞 waive（免除する）の名詞形。","tier":"A","ref":"TSL 955","note_html":"<code>sign a waiver</code>。動詞 waive（免除する）の名詞形。"},{"w":"advisable","jp":"賢明な、望ましい","note":"`It is advisable to do ~`。advice、advise と語族で。","tier":"A","ref":"TSL 1024","note_html":"<code>It is advisable to do ~</code>。advice、advise と語族で。"},{"w":"copyright","jp":"著作権","note":"`register / hold the copyright`、`copyright infringement`（著作権侵害）。","tier":"A","ref":"TSL 1115","note_html":"<code>register / hold the copyright</code>、<code>copyright infringement</code>（著作権侵害）。"},{"w":"assurance","jp":"保証、確約","note":"`give an assurance that ~`。動詞 assure（`assure someone that ~`）、insurance（保険）と混同しない。","tier":"A","ref":"TSL 1027","note_html":"<code>give an assurance that ~</code>。動詞 assure（<code>assure someone that ~</code>）、insurance（保険）と混同しない。"}],"translation":"ツアー開始前に、参加者全員が免責同意書に署名することが絶対に必要です。出版社からの書面による確約には法的拘束力がないため、今のうちに著作権を登録するのが賢明だと当社の弁護士は述べています。","html":"It is <b class=\"tg\">imperative</b> that every participant sign the <b class=\"tg\">waiver</b> before the tour begins. Our lawyer says it is <b class=\"tg\">advisable</b> to register the <b class=\"tg\">copyright</b> now, since a written <b class=\"tg\">assurance</b> from the publisher is not legally binding."},{"id":53,"vol":3,"theme":"研修・学習","sentence":"New hires need not **memorize** the entire manual, but **familiarity** with the safety chapter is **integral** to the job. Attending the optional evening session is **worthwhile**, and it helps staff handle complaints more **professionally**.","words":[{"w":"memorize","jp":"暗記する","note":"`memorize the manual / a speech`。名詞 memory、形容詞 memorable。","tier":"A","ref":"TSL 924","note_html":"<code>memorize the manual / a speech</code>。名詞 memory、形容詞 memorable。"},{"w":"familiarity","jp":"精通、なじみ","note":"`familiarity with the software`。with が必須。動詞 familiarize（`familiarize yourself with ~`）。","tier":"A","ref":"TSL 1048","note_html":"<code>familiarity with the software</code>。with が必須。動詞 familiarize（<code>familiarize yourself with ~</code>）。"},{"w":"integral","jp":"不可欠な","note":"`an integral part of ~`、`be integral to the job`。essential の言い換え。","tier":"A","ref":"TSL 1056","note_html":"<code>an integral part of ~</code>、<code>be integral to the job</code>。essential の言い換え。"},{"w":"worthwhile","jp":"価値のある","note":"`It is worthwhile to attend / attending`。worth、worthy と混同しやすい。","tier":"A","ref":"TSL 1022","note_html":"<code>It is worthwhile to attend / attending</code>。worth、worthy と混同しやすい。"},{"w":"professionally","jp":"専門的に、プロらしく","note":"`handle complaints professionally`、`professionally trained`。形容詞 professional。","tier":"A","ref":"TSL 934","note_html":"<code>handle complaints professionally</code>、<code>professionally trained</code>。形容詞 professional。"}],"translation":"新入社員はマニュアル全体を暗記する必要はありませんが、安全に関する章に精通していることは業務に不可欠です。任意の夜間セッションに参加する価値はあり、社員が苦情によりプロらしく対応する助けになります。","html":"New hires need not <b class=\"tg\">memorize</b> the entire manual, but <b class=\"tg\">familiarity</b> with the safety chapter is <b class=\"tg\">integral</b> to the job. Attending the optional evening session is <b class=\"tg\">worthwhile</b>, and it helps staff handle complaints more <b class=\"tg\">professionally</b>."},{"id":54,"vol":3,"theme":"飲食・接客","sentence":"The chef's **appetizer** was **superb**, and the bakery next door supplies fresh **pastry** every morning. In the **hospitality industry**, a **cheerful** greeting matters as much as the food.","words":[{"w":"appetizer","jp":"前菜","note":"`order an appetizer`。コース構成 appetizer → entrée → dessert で覚える。","tier":"A","ref":"TSL 1100","note_html":"<code>order an appetizer</code>。コース構成 appetizer → entrée → dessert で覚える。"},{"w":"superb","jp":"見事な、極上の","note":"`a superb performance / meal / view`。excellent の言い換え。","tier":"A","ref":"TSL 1015","note_html":"<code>a superb performance / meal / view</code>。excellent の言い換え。"},{"w":"pastry","jp":"焼き菓子、生地","note":"`fresh pastries`、`a pastry chef`。baked goods と近い語。","tier":"A","ref":"TSL 1001","note_html":"<code>fresh pastries</code>、<code>a pastry chef</code>。baked goods と近い語。"},{"w":"cheerful","jp":"愛想のよい、明るい","note":"`a cheerful greeting / atmosphere`。接客評価の描写に使う。","tier":"A","ref":"TSL 1204","note_html":"<code>a cheerful greeting / atmosphere</code>。接客評価の描写に使う。"},{"w":"hospitality industry","jp":"接客業、ホテル・飲食業界","note":"`work in the hospitality industry`。hospitality（もてなし）から。","tier":"A","ref":"TSL 1221","note_html":"<code>work in the hospitality industry</code>。hospitality（もてなし）から。"}],"translation":"シェフの前菜は見事で、隣のパン屋が毎朝焼きたての菓子パンを納入しています。接客業では、愛想のよい挨拶が料理と同じくらい重要です。","html":"The chef&#x27;s <b class=\"tg\">appetizer</b> was <b class=\"tg\">superb</b>, and the bakery next door supplies fresh <b class=\"tg\">pastry</b> every morning. In the <b class=\"tg\">hospitality industry</b>, a <b class=\"tg\">cheerful</b> greeting matters as much as the food."},{"id":55,"vol":3,"theme":"健康・医療","sentence":"The clinic will **prescribe** medication only after reviewing your **X-ray** results. A registered **nutritionist** explains that better **nutrition** is **beneficial** for employees who sit at a desk all day.","words":[{"w":"prescribe","jp":"処方する","note":"`prescribe medication for ~`。名詞 prescription（処方箋）。","tier":"A","ref":"TSL 1070","note_html":"<code>prescribe medication for ~</code>。名詞 prescription（処方箋）。"},{"w":"X-ray","jp":"レントゲン、X線","note":"`take / review an X-ray`。ハイフン付きで大文字X。","tier":"A","ref":"TSL 936","note_html":"<code>take / review an X-ray</code>。ハイフン付きで大文字X。"},{"w":"nutritionist","jp":"栄養士","note":"`a registered nutritionist`。dietitian と近い職名。","tier":"A","ref":"TSL 1227","note_html":"<code>a registered nutritionist</code>。dietitian と近い職名。"},{"w":"nutrition","jp":"栄養","note":"不可算名詞。`good / proper nutrition`。形容詞 nutritional（`nutritional information` 栄養成分表示）。","tier":"A","ref":"TSL 1227","note_html":"不可算名詞。<code>good / proper nutrition</code>。形容詞 nutritional（<code>nutritional information</code> 栄養成分表示）。"},{"w":"beneficial","jp":"有益な","note":"`be beneficial for / to ~`。名詞 benefit（`employee benefits` 福利厚生）。","tier":"A","ref":"TSL 1105","note_html":"<code>be beneficial for / to ~</code>。名詞 benefit（<code>employee benefits</code> 福利厚生）。"}],"translation":"診療所はレントゲンの結果を確認したうえでのみ薬を処方します。登録栄養士は、1日中デスクに座っている従業員にとって、より良い栄養摂取が有益だと説明しています。","html":"The clinic will <b class=\"tg\">prescribe</b> medication only after reviewing your <b class=\"tg\">X-ray</b> results. A registered <b class=\"tg\">nutritionist</b> explains that better <b class=\"tg\">nutrition</b> is <b class=\"tg\">beneficial</b> for employees who sit at a desk all day."},{"id":56,"vol":3,"theme":"進行状況","sentence":"Construction is already **underway**, and the final **rehearsal** has been moved to a later **time slot**. **Additionally**, the schedule will be **formally** approved at Monday's meeting.","words":[{"w":"underway","jp":"進行中で","note":"`Construction is already underway.`、`get underway`（始まる）。1語で書く点に注意。","tier":"A","ref":"TSL 1018","note_html":"<code>Construction is already underway.</code>、<code>get underway</code>（始まる）。1語で書く点に注意。"},{"w":"rehearsal","jp":"リハーサル、下稽古","note":"`a dress rehearsal`、`the final rehearsal`。動詞 rehearse。","tier":"A","ref":"TSL 1168","note_html":"<code>a dress rehearsal</code>、<code>the final rehearsal</code>。動詞 rehearse。"},{"w":"time slot","jp":"時間枠、放送枠","note":"`move to a later time slot`、`book a time slot`。予約・番組表の場面で出る。","tier":"A","ref":"TSL 1012","note_html":"<code>move to a later time slot</code>、<code>book a time slot</code>。予約・番組表の場面で出る。"},{"w":"additionally","jp":"さらに、加えて","note":"文頭で用いる接続副詞。`Additionally, ~`。in addition、moreover と同じ働き。","tier":"A","ref":"TSL 958","note_html":"文頭で用いる接続副詞。<code>Additionally, ~</code>。in addition、moreover と同じ働き。"},{"w":"formally","jp":"正式に","note":"`formally approve / announce / request`。formerly（以前は）と混同しやすいので注意。","tier":"A","ref":"TSL 984","note_html":"<code>formally approve / announce / request</code>。formerly（以前は）と混同しやすいので注意。"}],"translation":"建設はすでに進行中で、最終リハーサルは後の時間枠に変更されました。さらに、そのスケジュールは月曜日の会議で正式に承認される予定です。","html":"Construction is already <b class=\"tg\">underway</b>, and the final <b class=\"tg\">rehearsal</b> has been moved to a later <b class=\"tg\">time slot</b>. <b class=\"tg\">Additionally</b>, the schedule will be <b class=\"tg\">formally</b> approved at Monday&#x27;s meeting."},{"id":57,"vol":3,"theme":"問い合わせ対応","sentence":"We received a **query** about the delivery fee from a customer who was **reluctant** to order again. Such an **occurrence** is rare, so we offered a **partial** refund, and the **considerate** reply from our agent resolved the matter.","words":[{"w":"query","jp":"問い合わせ、質問","note":"`receive / respond to a query`。inquiry の言い換え。動詞用法もある。","tier":"A","ref":"TSL 1163","note_html":"<code>receive / respond to a query</code>。inquiry の言い換え。動詞用法もある。"},{"w":"reluctant","jp":"気が進まない","note":"`be reluctant to do ~`。後ろは to 不定詞。副詞 reluctantly。","tier":"A","ref":"TSL 943","note_html":"<code>be reluctant to do ~</code>。後ろは to 不定詞。副詞 reluctantly。"},{"w":"occurrence","jp":"出来事、発生","note":"`a rare / common occurrence`。動詞 occur（つづりは occurred と r を重ねる）。","tier":"A","ref":"TSL 1154","note_html":"<code>a rare / common occurrence</code>。動詞 occur（つづりは occurred と r を重ねる）。"},{"w":"partial","jp":"部分的な","note":"`a partial refund / payment`。副詞 partially、反意語 complete / full。","tier":"A","ref":"TSL 1067","note_html":"<code>a partial refund / payment</code>。副詞 partially、反意語 complete / full。"},{"w":"considerate","jp":"思いやりのある","note":"`a considerate reply`。considerable（かなりの）と意味がまったく違う点が最頻出の狙い目。","tier":"A","ref":"TSL 1206","note_html":"<code>a considerate reply</code>。considerable（かなりの）と意味がまったく違う点が最頻出の狙い目。"}],"translation":"再注文をためらっていたお客様から、配送料についての問い合わせを受けました。こうした事例はまれなので、部分的な返金を提案し、担当者の思いやりのある返信によって問題は解決しました。","html":"We received a <b class=\"tg\">query</b> about the delivery fee from a customer who was <b class=\"tg\">reluctant</b> to order again. Such an <b class=\"tg\">occurrence</b> is rare, so we offered a <b class=\"tg\">partial</b> refund, and the <b class=\"tg\">considerate</b> reply from our agent resolved the matter."},{"id":58,"vol":3,"theme":"客室清掃","sentence":"The **housekeeping** staff will **discard** the empty bottles, replace each **pillow**, and press any **wrinkle** out of the curtains. A **broom** and a mop are stored in the closet at the end of the corridor.","words":[{"w":"housekeeping","jp":"客室清掃、家事","note":"`the housekeeping staff`、`housekeeping services`。ホテル文脈の必出語。","tier":"A","ref":"TSL 1053","note_html":"<code>the housekeeping staff</code>、<code>housekeeping services</code>。ホテル文脈の必出語。"},{"w":"discard","jp":"捨てる、処分する","note":"`discard the empty bottles / old files`。throw away の格式ばった言い換え。","tier":"A","ref":"TSL 1209","note_html":"<code>discard the empty bottles / old files</code>。throw away の格式ばった言い換え。"},{"w":"pillow","jp":"枕","note":"`replace / fluff the pillow`、`an extra pillow`。Part 1・ホテル会話に出る。","tier":"A","ref":"TSL 931","note_html":"<code>replace / fluff the pillow</code>、<code>an extra pillow</code>。Part 1・ホテル会話に出る。"},{"w":"wrinkle","jp":"しわ","note":"`press out the wrinkles`、`wrinkle-free fabric`。動詞では「しわになる」。","tier":"A","ref":"TSL 1097","note_html":"<code>press out the wrinkles</code>、<code>wrinkle-free fabric</code>。動詞では「しわになる」。"},{"w":"broom","jp":"ほうき","note":"`sweep with a broom`。動詞 sweep とセットでPart 1に登場する。","tier":"A","ref":"TSL 1108","note_html":"<code>sweep with a broom</code>。動詞 sweep とセットでPart 1に登場する。"}],"translation":"客室清掃係が空き瓶を処分し、枕をすべて交換し、カーテンのしわをアイロンで伸ばします。ほうきとモップは廊下の突き当たりの物入れに保管されています。","html":"The <b class=\"tg\">housekeeping</b> staff will <b class=\"tg\">discard</b> the empty bottles, replace each <b class=\"tg\">pillow</b>, and press any <b class=\"tg\">wrinkle</b> out of the curtains. A <b class=\"tg\">broom</b> and a mop are stored in the closet at the end of the corridor."},{"id":59,"vol":3,"theme":"業績・表彰","sentence":"Sales **soared** after the redesign, and the team was **thrilled** to learn of its **nomination** for the industry award. The judges cited the company's **excellence** in customer **engagement**.","words":[{"w":"soar","jp":"急上昇する","note":"`Sales soared.`、`soaring costs`。skyrocket と同義で、増加を表す最上級の動詞。","tier":"A","ref":"TSL 1179","note_html":"<code>Sales soared.</code>、<code>soaring costs</code>。skyrocket と同義で、増加を表す最上級の動詞。"},{"w":"thrilled","jp":"大喜びして","note":"`be thrilled to do ~`、`be thrilled about ~`。delighted より強い喜び。","tier":"A","ref":"TSL 1184","note_html":"<code>be thrilled to do ~</code>、<code>be thrilled about ~</code>。delighted より強い喜び。"},{"w":"nomination","jp":"推薦、ノミネート","note":"`receive a nomination for ~`。動詞 nominate（`nominate someone for an award`）。","tier":"A","ref":"TSL 998","note_html":"<code>receive a nomination for ~</code>。動詞 nominate（<code>nominate someone for an award</code>）。"},{"w":"excellence","jp":"卓越、優秀さ","note":"`an award for excellence in ~`。形容詞 excellent。","tier":"A","ref":"TSL 976","note_html":"<code>an award for excellence in ~</code>。形容詞 excellent。"},{"w":"engagement","jp":"関わり、約束、婚約","note":"`customer engagement`（顧客との関係構築）、`a prior engagement`（先約）。TOEICでは後者の「先約」で断り文句に使われる。","tier":"A","ref":"TSL 1130","note_html":"<code>customer engagement</code>（顧客との関係構築）、<code>a prior engagement</code>（先約）。TOEICでは後者の「先約」で断り文句に使われる。"}],"translation":"デザイン刷新の後、売上は急上昇し、チームは業界賞への推薦を知って大喜びしました。審査員は、顧客との関係構築における同社の卓越性を挙げました。","html":"Sales <b class=\"tg\">soared</b> after the redesign, and the team was <b class=\"tg\">thrilled</b> to learn of its <b class=\"tg\">nomination</b> for the industry award. The judges cited the company&#x27;s <b class=\"tg\">excellence</b> in customer <b class=\"tg\">engagement</b>."},{"id":60,"vol":3,"theme":"出版・記録","sentence":"A **biography** of the founder will be released with a short **pamphlet** and an illustrated **timeline** of the company's history. The launch coincides with the alumni **reunion**, so early **enrollment** is recommended.","words":[{"w":"biography","jp":"伝記","note":"`a biography of the founder`、`write a biography`。autobiography（自伝）と区別する。","tier":"A","ref":"TSL 1106","note_html":"<code>a biography of the founder</code>、<code>write a biography</code>。autobiography（自伝）と区別する。"},{"w":"pamphlet","jp":"小冊子、パンフレット","note":"`distribute a pamphlet`。brochure より簡素な冊子を指す。","tier":"A","ref":"TSL 1066","note_html":"<code>distribute a pamphlet</code>。brochure より簡素な冊子を指す。"},{"w":"timeline","jp":"年表、日程","note":"`an illustrated timeline`、`the project timeline`。「時系列の図」と「工程表」の2義。","tier":"A","ref":"TSL 1241","note_html":"<code>an illustrated timeline</code>、<code>the project timeline</code>。「時系列の図」と「工程表」の2義。"},{"w":"reunion","jp":"同窓会、再会","note":"`an alumni reunion`、`a family reunion`。re-（再び）+ union。","tier":"A","ref":"TSL 1008","note_html":"<code>an alumni reunion</code>、<code>a family reunion</code>。re-（再び）+ union。"},{"w":"enrollment","jp":"登録、入学者数","note":"`early enrollment`、`enrollment is limited`。動詞 enroll（`enroll in a course`）。","tier":"A","ref":"TSL 1131","note_html":"<code>early enrollment</code>、<code>enrollment is limited</code>。動詞 enroll（<code>enroll in a course</code>）。"}],"translation":"創業者の伝記が、短い小冊子と会社の歴史を図解した年表とともに刊行されます。刊行時期は卒業生の同窓会と重なるため、早期の登録が推奨されます。","html":"A <b class=\"tg\">biography</b> of the founder will be released with a short <b class=\"tg\">pamphlet</b> and an illustrated <b class=\"tg\">timeline</b> of the company&#x27;s history. The launch coincides with the alumni <b class=\"tg\">reunion</b>, so early <b class=\"tg\">enrollment</b> is recommended."},{"id":61,"vol":4,"theme":"休暇・旅行","sentence":"I have requested a week of **vacation** for our **upcoming** anniversary trip. We **depart** on the fourth, stay **overnight** in Lisbon, and reach our final **destination** the next afternoon.","words":[{"w":"vacation","jp":"休暇","note":"`take / request a week of vacation`、`be on vacation`。TSL2位。英国式は holiday。","tier":"S","ref":"TSL 2","note_html":"<code>take / request a week of vacation</code>、<code>be on vacation</code>。TSL2位。英国式は holiday。"},{"w":"upcoming","jp":"今度の、来たるべき","note":"`the upcoming trip / event / election`。名詞の前でのみ使う。","tier":"S","ref":"TSL 86","note_html":"<code>the upcoming trip / event / election</code>。名詞の前でのみ使う。"},{"w":"depart","jp":"出発する","note":"`depart from Gate 12`、`depart for Osaka`。名詞 departure。leave の格式ばった語。","tier":"S","ref":"TSL 76","note_html":"<code>depart from Gate 12</code>、<code>depart for Osaka</code>。名詞 departure。leave の格式ばった語。"},{"w":"overnight","jp":"一晩、一泊で","note":"`stay overnight`、`an overnight delivery`（翌日配達）。副詞・形容詞の両用法。","tier":"S","ref":"TSL 174","note_html":"<code>stay overnight</code>、<code>an overnight delivery</code>（翌日配達）。副詞・形容詞の両用法。"},{"w":"destination","jp":"目的地、行き先","note":"`reach the final destination`、`a popular tourist destination`。","tier":"S","ref":"TSL 63","note_html":"<code>reach the final destination</code>、<code>a popular tourist destination</code>。"}],"translation":"今度の記念旅行のために1週間の休暇を申請しました。4日に出発し、リスボンで一泊して、翌日の午後に最終目的地に着きます。","html":"I have requested a week of <b class=\"tg\">vacation</b> for our <b class=\"tg\">upcoming</b> anniversary trip. We <b class=\"tg\">depart</b> on the fourth, stay <b class=\"tg\">overnight</b> in Lisbon, and reach our final <b class=\"tg\">destination</b> the next afternoon."},{"id":62,"vol":4,"theme":"空港・機内","sentence":"Please show a form of photo **identification** at the counter before checking your **baggage**. A **flight attendant** will point out the nearest **exit**, and a **compact** bag may be kept at your feet.","words":[{"w":"identification","jp":"身分証明書、識別","note":"`a form of photo identification`、短縮形 ID。`present identification`。","tier":"S","ref":"TSL 74","note_html":"<code>a form of photo identification</code>、短縮形 ID。<code>present identification</code>。"},{"w":"baggage","jp":"手荷物","note":"不可算名詞。`check your baggage`、`baggage claim`（手荷物受取所）。luggage と同義。","tier":"S","ref":"TSL 152","note_html":"不可算名詞。<code>check your baggage</code>、<code>baggage claim</code>（手荷物受取所）。luggage と同義。"},{"w":"flight attendant","jp":"客室乗務員","note":"`A flight attendant will ~`。機内アナウンス設定のPart 4に頻出。","tier":"S","ref":"TSL 52","note_html":"<code>A flight attendant will ~</code>。機内アナウンス設定のPart 4に頻出。"},{"w":"exit","jp":"出口／退出する","note":"`the nearest exit`、`emergency exit`。動詞では `exit the building`。","tier":"S","ref":"TSL 101","note_html":"<code>the nearest exit</code>、<code>emergency exit</code>。動詞では <code>exit the building</code>。"},{"w":"compact","jp":"小型の","note":"`a compact bag / car / design`。「小さくまとまった」の意で、small より肯定的。","tier":"S","ref":"TSL 70","note_html":"<code>a compact bag / car / design</code>。「小さくまとまった」の意で、small より肯定的。"}],"translation":"手荷物をお預けになる前に、カウンターで写真付きの身分証明書をご提示ください。客室乗務員が最寄りの出口をご案内します。小型のかばんは足元に置いていただけます。","html":"Please show a form of photo <b class=\"tg\">identification</b> at the counter before checking your <b class=\"tg\">baggage</b>. A <b class=\"tg\">flight attendant</b> will point out the nearest <b class=\"tg\">exit</b>, and a <b class=\"tg\">compact</b> bag may be kept at your feet."},{"id":63,"vol":4,"theme":"ホテル・受付","sentence":"The **receptionist** confirmed that our **reservation** is still **valid** until six o'clock. The hotel can **accommodate** forty guests, and the meeting will begin in the **lobby**.","words":[{"w":"receptionist","jp":"受付係","note":"`ask the receptionist`。reception（受付、歓迎会）と区別する。","tier":"S","ref":"TSL 72","note_html":"<code>ask the receptionist</code>。reception（受付、歓迎会）と区別する。"},{"w":"reservation","jp":"予約","note":"`make / confirm / cancel a reservation`。TSL7位。動詞 reserve。","tier":"S","ref":"TSL 7","note_html":"<code>make / confirm / cancel a reservation</code>。TSL7位。動詞 reserve。"},{"w":"valid","jp":"有効な","note":"`valid until six o'clock`、`a valid ticket / passport`。反意語 invalid。","tier":"S","ref":"TSL 94","note_html":"<code>valid until six o&#x27;clock</code>、<code>a valid ticket / passport</code>。反意語 invalid。"},{"w":"accommodate","jp":"収容する、便宜を図る","note":"`accommodate forty guests`、`accommodate a request`。「収容」と「対応」の2義。","tier":"S","ref":"TSL 217","note_html":"<code>accommodate forty guests</code>、<code>accommodate a request</code>。「収容」と「対応」の2義。"},{"w":"lobby","jp":"ロビー","note":"`meet in the lobby`、`the hotel lobby`。Part 3の待ち合わせ場面で定番。","tier":"S","ref":"TSL 24","note_html":"<code>meet in the lobby</code>、<code>the hotel lobby</code>。Part 3の待ち合わせ場面で定番。"}],"translation":"受付係が、私たちの予約が6時までまだ有効であることを確認しました。ホテルは40名を収容でき、会合はロビーで始まります。","html":"The <b class=\"tg\">receptionist</b> confirmed that our <b class=\"tg\">reservation</b> is still <b class=\"tg\">valid</b> until six o&#x27;clock. The hotel can <b class=\"tg\">accommodate</b> forty guests, and the meeting will begin in the <b class=\"tg\">lobby</b>."},{"id":64,"vol":4,"theme":"会計・返金","sentence":"The **clerk** at the counter processed the **transaction** in under a minute. Because the jacket was damaged, the store offered a **full refund** rather than an **affordable** exchange, along with a **gift certificate** for the inconvenience.","words":[{"w":"clerk","jp":"店員、事務員","note":"`a sales clerk`、`the clerk at the counter`。発音は /klɜːrk/。","tier":"S","ref":"TSL 23","note_html":"<code>a sales clerk</code>、<code>the clerk at the counter</code>。発音は /klɜːrk/。"},{"w":"transaction","jp":"取引、売買","note":"`process / complete a transaction`、`an online transaction`。","tier":"S","ref":"TSL 238","note_html":"<code>process / complete a transaction</code>、<code>an online transaction</code>。"},{"w":"full refund","jp":"全額返金","note":"`offer / receive a full refund`。partial refund（一部返金）と対で。","tier":"S","ref":"TSL 14","note_html":"<code>offer / receive a full refund</code>。partial refund（一部返金）と対で。"},{"w":"affordable","jp":"手ごろな価格の","note":"`an affordable price / option`。動詞 afford（`can afford to buy ~`）。","tier":"S","ref":"TSL 218","note_html":"<code>an affordable price / option</code>。動詞 afford（<code>can afford to buy ~</code>）。"},{"w":"gift certificate","jp":"商品券、ギフト券","note":"`issue / redeem a gift certificate`。voucher と近い語。","tier":"S","ref":"TSL 159","note_html":"<code>issue / redeem a gift certificate</code>。voucher と近い語。"}],"translation":"カウンターの店員は1分もかからずに取引を処理しました。上着に傷があったため、店は手ごろな価格での交換ではなく全額返金を申し出て、お詫びとして商品券も渡しました。","html":"The <b class=\"tg\">clerk</b> at the counter processed the <b class=\"tg\">transaction</b> in under a minute. Because the jacket was damaged, the store offered a <b class=\"tg\">full refund</b> rather than an <b class=\"tg\">affordable</b> exchange, along with a <b class=\"tg\">gift certificate</b> for the inconvenience."},{"id":65,"vol":4,"theme":"出版・広報","sentence":"The **publishing** house will **publish** the report next spring, and members may read a **preview** chapter online. Readers who **subscribe** this month also receive a print by the **photographer** who shot the cover.","words":[{"w":"publishing","jp":"出版業","note":"`a publishing house`（出版社）、`the publishing industry`。","tier":"S","ref":"TSL 25","note_html":"<code>a publishing house</code>（出版社）、<code>the publishing industry</code>。"},{"w":"publish","jp":"出版する、公表する","note":"`publish a report / an article`。名詞 publisher、publication。","tier":"S","ref":"TSL 25","note_html":"<code>publish a report / an article</code>。名詞 publisher、publication。"},{"w":"preview","jp":"試写、先行公開","note":"`a preview chapter / screening`。「本公開前に見せるもの」の意。","tier":"S","ref":"TSL 51","note_html":"<code>a preview chapter / screening</code>。「本公開前に見せるもの」の意。"},{"w":"subscribe","jp":"定期購読する、加入する","note":"`subscribe to a magazine`。to が必須。名詞 subscription、subscriber。","tier":"S","ref":"TSL 206","note_html":"<code>subscribe to a magazine</code>。to が必須。名詞 subscription、subscriber。"},{"w":"photographer","jp":"写真家","note":"`the photographer who shot the cover`。photograph（写真）、photography（写真撮影）と区別する。","tier":"S","ref":"TSL 182","note_html":"<code>the photographer who shot the cover</code>。photograph（写真）、photography（写真撮影）と区別する。"}],"translation":"その出版社は来春に報告書を刊行し、会員はオンラインで試読用の章を読むことができます。今月購読を申し込んだ読者には、表紙を撮影した写真家によるプリントも贈られます。","html":"The <b class=\"tg\">publishing</b> house will <b class=\"tg\">publish</b> the report next spring, and members may read a <b class=\"tg\">preview</b> chapter online. Readers who <b class=\"tg\">subscribe</b> this month also receive a print by the <b class=\"tg\">photographer</b> who shot the cover."},{"id":66,"vol":4,"theme":"応募・資格","sentence":"List your current **occupation** at the top of the form and attach a copy of your **certificate**. Only staff who are **eligible** for the allowance may **resume** their training, and every page requires a **signature**.","words":[{"w":"occupation","jp":"職業","note":"`state your current occupation`。job より書類向きの語。形容詞 occupational。","tier":"S","ref":"TSL 64","note_html":"<code>state your current occupation</code>。job より書類向きの語。形容詞 occupational。"},{"w":"certificate","jp":"証明書、修了証","note":"`attach a copy of your certificate`。動詞 certify、名詞 certification。","tier":"S","ref":"TSL 159","note_html":"<code>attach a copy of your certificate</code>。動詞 certify、名詞 certification。"},{"w":"eligible","jp":"資格がある","note":"`be eligible for the allowance`、`eligible to apply`。for か to不定詞を伴う。名詞 eligibility。","tier":"S","ref":"TSL 150","note_html":"<code>be eligible for the allowance</code>、<code>eligible to apply</code>。for か to不定詞を伴う。名詞 eligibility。"},{"w":"resume","jp":"再開する","note":"`resume training / operations`。名詞 résumé（履歴書）と同じつづりだが発音・意味が別。TOEICで狙われる。","tier":"S","ref":"TSL 26","note_html":"<code>resume training / operations</code>。名詞 résumé（履歴書）と同じつづりだが発音・意味が別。TOEICで狙われる。"},{"w":"signature","jp":"署名","note":"`require a signature`、`sign your name`。動詞 sign。","tier":"A","ref":"TSL 252","note_html":"<code>require a signature</code>、<code>sign your name</code>。動詞 sign。"}],"translation":"用紙の上部に現在の職業を記入し、証明書の写しを添付してください。手当の受給資格がある職員のみが研修を再開でき、全ページに署名が必要です。","html":"List your current <b class=\"tg\">occupation</b> at the top of the form and attach a copy of your <b class=\"tg\">certificate</b>. Only staff who are <b class=\"tg\">eligible</b> for the allowance may <b class=\"tg\">resume</b> their training, and every page requires a <b class=\"tg\">signature</b>."},{"id":67,"vol":4,"theme":"社内業務","sentence":"The **memorandum** posted in the **workplace** states that **overtime** must be approved in advance. My **coworker** and I have been given the same **assignment**, so we will divide the hours.","words":[{"w":"memorandum","jp":"社内連絡文書","note":"短縮形 memo。`post / circulate a memorandum`。","tier":"A","ref":"TSL 259","note_html":"短縮形 memo。<code>post / circulate a memorandum</code>。"},{"w":"workplace","jp":"職場","note":"`in the workplace`、`workplace safety`。「勤務先の環境」を指す。","tier":"S","ref":"TSL 147","note_html":"<code>in the workplace</code>、<code>workplace safety</code>。「勤務先の環境」を指す。"},{"w":"overtime","jp":"残業、残業手当","note":"`work overtime`、`approve overtime`。副詞的にも使う（前置詞不要）。","tier":"S","ref":"TSL 164","note_html":"<code>work overtime</code>、<code>approve overtime</code>。副詞的にも使う（前置詞不要）。"},{"w":"coworker","jp":"同僚","note":"`my coworker and I`。colleague と同義で、米国式の口語寄り。","tier":"S","ref":"TSL 85","note_html":"<code>my coworker and I</code>。colleague と同義で、米国式の口語寄り。"},{"w":"assignment","jp":"任務、課題","note":"`be given an assignment`、`complete an assignment`。動詞 assign（`assign a task to someone`）。","tier":"S","ref":"TSL 100","note_html":"<code>be given an assignment</code>、<code>complete an assignment</code>。動詞 assign（<code>assign a task to someone</code>）。"}],"translation":"職場に掲示された社内連絡文書によれば、残業は事前に承認を得なければなりません。同僚と私は同じ任務を与えられているので、時間を分担する予定です。","html":"The <b class=\"tg\">memorandum</b> posted in the <b class=\"tg\">workplace</b> states that <b class=\"tg\">overtime</b> must be approved in advance. My <b class=\"tg\">coworker</b> and I have been given the same <b class=\"tg\">assignment</b>, so we will divide the hours."},{"id":68,"vol":4,"theme":"日程調整2","sentence":"Please check your **availability** for Wednesday, and I will **coordinate** the room booking. A **thorough** review of the contract is **urgent**, so I will send the revised draft **shortly**.","words":[{"w":"availability","jp":"都合、空き状況","note":"`check your availability`、`subject to availability`（空きがある場合に限る）。","tier":"S","ref":"TSL 229","note_html":"<code>check your availability</code>、<code>subject to availability</code>（空きがある場合に限る）。"},{"w":"coordinate","jp":"調整する、まとめる","note":"`coordinate the schedule / booking`。名詞 coordination、coordinator。","tier":"S","ref":"TSL 221","note_html":"<code>coordinate the schedule / booking</code>。名詞 coordination、coordinator。"},{"w":"thorough","jp":"徹底的な、入念な","note":"`a thorough review / inspection`。発音は /ˈθɜːroʊ/。副詞 thoroughly。","tier":"A","ref":"TSL 262","note_html":"<code>a thorough review / inspection</code>。発音は /ˈθɜːroʊ/。副詞 thoroughly。"},{"w":"urgent","jp":"緊急の","note":"`an urgent matter / request`。名詞 urgency、副詞 urgently。","tier":"A","ref":"TSL 296","note_html":"<code>an urgent matter / request</code>。名詞 urgency、副詞 urgently。"},{"w":"shortly","jp":"まもなく","note":"`I will send it shortly.`、`shortly after ~`（〜の直後に）。soon の言い換え。","tier":"S","ref":"TSL 129","note_html":"<code>I will send it shortly.</code>、<code>shortly after ~</code>（〜の直後に）。soon の言い換え。"}],"translation":"水曜日のご都合をご確認ください。会議室の予約は私が調整します。契約書の入念な確認が急務ですので、修正稿をまもなくお送りします。","html":"Please check your <b class=\"tg\">availability</b> for Wednesday, and I will <b class=\"tg\">coordinate</b> the room booking. A <b class=\"tg\">thorough</b> review of the contract is <b class=\"tg\">urgent</b>, so I will send the revised draft <b class=\"tg\">shortly</b>."},{"id":69,"vol":4,"theme":"取引先対応","sentence":"A **client** wrote to **inquire** whether the new policy would **prohibit** outside consultants from attending. Our service **provider** replied that the **recipient** of the notice may bring one guest.","words":[{"w":"client","jp":"顧客、依頼人","note":"`a corporate client`、`meet with a client`。TSL3位。専門サービスの顧客を指す。","tier":"S","ref":"TSL 3","note_html":"<code>a corporate client</code>、<code>meet with a client</code>。TSL3位。専門サービスの顧客を指す。"},{"w":"inquire","jp":"問い合わせる","note":"`inquire about / whether ~`。名詞 inquiry。英国式は enquire。","tier":"S","ref":"TSL 173","note_html":"<code>inquire about / whether ~</code>。名詞 inquiry。英国式は enquire。"},{"w":"prohibit","jp":"禁止する","note":"`prohibit someone from doing ~`。from が必須で、Part 5の語法問題に直結。","tier":"S","ref":"TSL 191","note_html":"<code>prohibit someone from doing ~</code>。from が必須で、Part 5の語法問題に直結。"},{"w":"provider","jp":"提供業者","note":"`a service / internet provider`。動詞 provide（`provide someone with ~`）。","tier":"S","ref":"TSL 133","note_html":"<code>a service / internet provider</code>。動詞 provide（<code>provide someone with ~</code>）。"},{"w":"recipient","jp":"受取人","note":"`the recipient of the notice / award`。動詞 receive の派生語。","tier":"S","ref":"TSL 137","note_html":"<code>the recipient of the notice / award</code>。動詞 receive の派生語。"}],"translation":"ある顧客から、新方針によって外部コンサルタントの出席が禁止されるのかという問い合わせがありました。当社のサービス提供業者は、通知の受取人は1名まで同伴できると回答しました。","html":"A <b class=\"tg\">client</b> wrote to <b class=\"tg\">inquire</b> whether the new policy would <b class=\"tg\">prohibit</b> outside consultants from attending. Our service <b class=\"tg\">provider</b> replied that the <b class=\"tg\">recipient</b> of the notice may bring one guest."},{"id":70,"vol":4,"theme":"社員食堂","sentence":"Employees may **dine** in the **cafeteria** from eleven to two, and the **dining area** on the second floor is quieter. Each **snack** is labeled, so anyone with an allergy can check every **ingredient**.","words":[{"w":"dine","jp":"食事をする","note":"`dine in the cafeteria`、`dine out`（外食する）。eat の格式ばった語。名詞 diner。","tier":"S","ref":"TSL 83","note_html":"<code>dine in the cafeteria</code>、<code>dine out</code>（外食する）。eat の格式ばった語。名詞 diner。"},{"w":"cafeteria","jp":"社員食堂、カフェテリア","note":"`the company cafeteria`。セルフサービス式の食堂を指す。","tier":"S","ref":"TSL 43","note_html":"<code>the company cafeteria</code>。セルフサービス式の食堂を指す。"},{"w":"dining area","jp":"食事スペース","note":"`the dining area on the second floor`。間取り説明で使われる。","tier":"S","ref":"TSL 83","note_html":"<code>the dining area on the second floor</code>。間取り説明で使われる。"},{"w":"snack","jp":"軽食、菓子","note":"`snacks and beverages`、`a snack bar`。","tier":"S","ref":"TSL 130","note_html":"<code>snacks and beverages</code>、<code>a snack bar</code>。"},{"w":"ingredient","jp":"材料、成分","note":"`check every ingredient`、`fresh ingredients`。レシピ・アレルギー表示の話題で頻出。","tier":"S","ref":"TSL 144","note_html":"<code>check every ingredient</code>、<code>fresh ingredients</code>。レシピ・アレルギー表示の話題で頻出。"}],"translation":"従業員は11時から2時まで社員食堂で食事ができ、2階の食事スペースのほうが静かです。軽食にはすべて表示があるので、アレルギーのある方は各材料を確認できます。","html":"Employees may <b class=\"tg\">dine</b> in the <b class=\"tg\">cafeteria</b> from eleven to two, and the <b class=\"tg\">dining area</b> on the second floor is quieter. Each <b class=\"tg\">snack</b> is labeled, so anyone with an allergy can check every <b class=\"tg\">ingredient</b>."},{"id":71,"vol":4,"theme":"飲食・宴会","sentence":"The **banquet** menu features a regional **recipe** with a mild **flavor**, and the **catering** company will set up at five. Coffee will be served afterward at the **café** beside the entrance.","words":[{"w":"banquet","jp":"宴会、晩餐会","note":"`a banquet menu / hall`、`host a banquet`。","tier":"S","ref":"TSL 117","note_html":"<code>a banquet menu / hall</code>、<code>host a banquet</code>。"},{"w":"recipe","jp":"レシピ、調理法","note":"`a regional recipe`、`follow a recipe`。発音は /ˈresəpi/（3音節）。","tier":"S","ref":"TSL 210","note_html":"<code>a regional recipe</code>、<code>follow a recipe</code>。発音は /ˈresəpi/（3音節）。"},{"w":"flavor","jp":"風味、味","note":"`a mild / rich flavor`、`three flavors of ice cream`。英国式は flavour。","tier":"S","ref":"TSL 208","note_html":"<code>a mild / rich flavor</code>、<code>three flavors of ice cream</code>。英国式は flavour。"},{"w":"catering","jp":"仕出し、給食","note":"`a catering company`、`catering services`。動詞 cater、名詞 caterer。","tier":"A","ref":"TSL 264","note_html":"<code>a catering company</code>、<code>catering services</code>。動詞 cater、名詞 caterer。"},{"w":"café","jp":"カフェ、喫茶店","note":"`at the café beside the entrance`。coffee shop と同義。","tier":"S","ref":"TSL 105","note_html":"<code>at the café beside the entrance</code>。coffee shop と同義。"}],"translation":"宴会のメニューには、まろやかな風味の郷土料理が含まれており、仕出し会社が5時に準備を始めます。その後、入口横のカフェでコーヒーが提供されます。","html":"The <b class=\"tg\">banquet</b> menu features a regional <b class=\"tg\">recipe</b> with a mild <b class=\"tg\">flavor</b>, and the <b class=\"tg\">catering</b> company will set up at five. Coffee will be served afterward at the <b class=\"tg\">café</b> beside the entrance."},{"id":72,"vol":4,"theme":"医療・検査","sentence":"The pharmacy cannot release the **medication** without a valid **prescription**. The **lab** will **verify** the sample this week, and your **dentist** has asked for a copy of the results.","words":[{"w":"medication","jp":"薬、投薬","note":"`release / take medication`、`prescription medication`。medicine とほぼ同義。","tier":"S","ref":"TSL 108","note_html":"<code>release / take medication</code>、<code>prescription medication</code>。medicine とほぼ同義。"},{"w":"prescription","jp":"処方箋","note":"`a valid prescription`、`fill a prescription`（処方薬を調剤する）。動詞 prescribe。","tier":"A","ref":"TSL 270","note_html":"<code>a valid prescription</code>、<code>fill a prescription</code>（処方薬を調剤する）。動詞 prescribe。"},{"w":"lab","jp":"研究室、検査室","note":"正式には laboratory。`the lab will verify ~`、`lab results`。","tier":"S","ref":"TSL 156","note_html":"正式には laboratory。<code>the lab will verify ~</code>、<code>lab results</code>。"},{"w":"verify","jp":"確認する、検証する","note":"`verify the sample / the information`。名詞 verification。","tier":"S","ref":"TSL 240","note_html":"<code>verify the sample / the information</code>。名詞 verification。"},{"w":"dentist","jp":"歯科医","note":"`see / visit the dentist`、`a dentist's appointment`。Part 2の予定変更で頻出。","tier":"S","ref":"TSL 73","note_html":"<code>see / visit the dentist</code>、<code>a dentist&#x27;s appointment</code>。Part 2の予定変更で頻出。"}],"translation":"薬局は有効な処方箋がなければ薬を渡すことができません。検査室が今週その検体を確認する予定で、あなたの歯科医が結果の写しを求めています。","html":"The pharmacy cannot release the <b class=\"tg\">medication</b> without a valid <b class=\"tg\">prescription</b>. The <b class=\"tg\">lab</b> will <b class=\"tg\">verify</b> the sample this week, and your <b class=\"tg\">dentist</b> has asked for a copy of the results."},{"id":73,"vol":4,"theme":"寄付・式典","sentence":"Thanks to a **generous** **donation** from a former student, **admission** to the ceremony is free. A **reception** follows in the east hall, and guests who wish to **donate** may do so at the desk.","words":[{"w":"generous","jp":"気前のよい、寛大な","note":"`a generous donation / offer`。名詞 generosity、副詞 generously。","tier":"A","ref":"TSL 369","note_html":"<code>a generous donation / offer</code>。名詞 generosity、副詞 generously。"},{"w":"donation","jp":"寄付、寄付金","note":"`make / receive a donation`、`a donation from ~`。","tier":"S","ref":"TSL 127","note_html":"<code>make / receive a donation</code>、<code>a donation from ~</code>。"},{"w":"admission","jp":"入場、入場料、入学","note":"`admission is free`、`admission fee`。動詞 admit（入場・入学を認める）。","tier":"S","ref":"TSL 95","note_html":"<code>admission is free</code>、<code>admission fee</code>。動詞 admit（入場・入学を認める）。"},{"w":"reception","jp":"歓迎会、受付","note":"`a reception follows in ~`、`the reception desk`。「歓迎会」の意味が特に頻出。","tier":"S","ref":"TSL 46","note_html":"<code>a reception follows in ~</code>、<code>the reception desk</code>。「歓迎会」の意味が特に頻出。"},{"w":"donate","jp":"寄付する","note":"`donate to a charity`、`donate money / equipment`。名詞 donation、donor。","tier":"S","ref":"TSL 166","note_html":"<code>donate to a charity</code>、<code>donate money / equipment</code>。名詞 donation、donor。"}],"translation":"卒業生からの気前のよい寄付のおかげで、式典への入場は無料です。その後、東ホールで歓迎会が開かれ、寄付をご希望の方は受付でお申し出いただけます。","html":"Thanks to a <b class=\"tg\">generous</b> <b class=\"tg\">donation</b> from a former student, <b class=\"tg\">admission</b> to the ceremony is free. A <b class=\"tg\">reception</b> follows in the east hall, and guests who wish to <b class=\"tg\">donate</b> may do so at the desk."},{"id":74,"vol":4,"theme":"環境・廃棄物2","sentence":"Paper cups are **recyclable**, so please do not put them in the **garbage**. The company now buys **renewable** energy, and staff are asked to **recycle** bottles rather than leave them beside the **trash** bin.","words":[{"w":"recyclable","jp":"再生利用できる","note":"`recyclable materials / cups`。名詞複数 recyclables（資源ごみ）。","tier":"S","ref":"TSL 109","note_html":"<code>recyclable materials / cups</code>。名詞複数 recyclables（資源ごみ）。"},{"w":"garbage","jp":"ごみ、生ごみ","note":"`put in the garbage`、`garbage collection`。米国式で、英国式は rubbish。","tier":"A","ref":"TSL 279","note_html":"<code>put in the garbage</code>、<code>garbage collection</code>。米国式で、英国式は rubbish。"},{"w":"renewable","jp":"再生可能な","note":"`renewable energy / resources`。動詞 renew、名詞 renewal と語族で。","tier":"S","ref":"TSL 110","note_html":"<code>renewable energy / resources</code>。動詞 renew、名詞 renewal と語族で。"},{"w":"recycle","jp":"再生利用する","note":"`recycle bottles / paper`。名詞 recycling。","tier":"S","ref":"TSL 109","note_html":"<code>recycle bottles / paper</code>。名詞 recycling。"},{"w":"trash","jp":"ごみ、くず","note":"`the trash bin / can`、`take out the trash`。garbage とほぼ同義。","tier":"A","ref":"TSL 385","note_html":"<code>the trash bin / can</code>、<code>take out the trash</code>。garbage とほぼ同義。"}],"translation":"紙コップは再生利用できるので、生ごみと一緒に捨てないでください。当社は現在、再生可能エネルギーを購入しており、従業員には瓶をごみ箱の脇に置くのではなくリサイクルするようお願いしています。","html":"Paper cups are <b class=\"tg\">recyclable</b>, so please do not put them in the <b class=\"tg\">garbage</b>. The company now buys <b class=\"tg\">renewable</b> energy, and staff are asked to <b class=\"tg\">recycle</b> bottles rather than leave them beside the <b class=\"tg\">trash</b> bin."},{"id":75,"vol":4,"theme":"建築・工事","sentence":"The **architect** and the property **developer** met to review the plan before the crew began to **renovate** the lobby. The **general contractor** promised **completion** by the end of August.","words":[{"w":"architect","jp":"建築家","note":"`the architect who designed ~`。形容詞 architectural、名詞 architecture。","tier":"S","ref":"TSL 148","note_html":"<code>the architect who designed ~</code>。形容詞 architectural、名詞 architecture。"},{"w":"developer","jp":"開発業者、開発者","note":"`a property developer`（不動産開発業者）、`a software developer`。文脈で職種が変わる。","tier":"S","ref":"TSL 202","note_html":"<code>a property developer</code>（不動産開発業者）、<code>a software developer</code>。文脈で職種が変わる。"},{"w":"renovate","jp":"改装する","note":"`renovate the lobby / building`。名詞 renovation。remodel の言い換え。","tier":"S","ref":"TSL 124","note_html":"<code>renovate the lobby / building</code>。名詞 renovation。remodel の言い換え。"},{"w":"general contractor","jp":"総合建設業者、元請業者","note":"`hire a general contractor`。下請は subcontractor。","tier":"S","ref":"TSL 188","note_html":"<code>hire a general contractor</code>。下請は subcontractor。"},{"w":"completion","jp":"完成、完了","note":"`promise completion by ~`、`upon completion of the project`。動詞 complete。","tier":"A","ref":"TSL 277","note_html":"<code>promise completion by ~</code>、<code>upon completion of the project</code>。動詞 complete。"}],"translation":"作業員がロビーの改装に取りかかる前に、建築家と不動産開発業者が計画を検討するために会合しました。総合建設業者は8月末までの完成を約束しました。","html":"The <b class=\"tg\">architect</b> and the property <b class=\"tg\">developer</b> met to review the plan before the crew began to <b class=\"tg\">renovate</b> the lobby. The <b class=\"tg\">general contractor</b> promised <b class=\"tg\">completion</b> by the end of August."},{"id":76,"vol":4,"theme":"修理・作業","sentence":"A **plumber** was called after a **leak** appeared under the sink, and a **mechanic** is checking the delivery van. The **electrical** panel is at the top of the stairs, so bring the **ladder** from the storeroom.","words":[{"w":"plumber","jp":"配管工","note":"`call a plumber`。発音は /ˈplʌmər/ で b は無音。名詞 plumbing（配管）。","tier":"A","ref":"TSL 359","note_html":"<code>call a plumber</code>。発音は /ˈplʌmər/ で b は無音。名詞 plumbing（配管）。"},{"w":"leak","jp":"漏れ、漏れる","note":"`a leak under the sink`、`The pipe is leaking.`。名詞・動詞の両用法。","tier":"A","ref":"TSL 292","note_html":"<code>a leak under the sink</code>、<code>The pipe is leaking.</code>。名詞・動詞の両用法。"},{"w":"mechanic","jp":"整備士","note":"`a mechanic is checking the van`。形容詞 mechanical、名詞 mechanism。","tier":"S","ref":"TSL 140","note_html":"<code>a mechanic is checking the van</code>。形容詞 mechanical、名詞 mechanism。"},{"w":"electrical","jp":"電気の","note":"`the electrical panel / wiring`。electric（電動の）、electrician（電気技師）と使い分ける。","tier":"S","ref":"TSL 98","note_html":"<code>the electrical panel / wiring</code>。electric（電動の）、electrician（電気技師）と使い分ける。"},{"w":"ladder","jp":"はしご","note":"`bring / climb a ladder`。Part 1の写真描写に頻出。","tier":"A","ref":"TSL 285","note_html":"<code>bring / climb a ladder</code>。Part 1の写真描写に頻出。"}],"translation":"流しの下で水漏れが見つかったため配管工が呼ばれ、整備士が配送用バンを点検しています。電気の配電盤は階段を上ったところにあるので、倉庫からはしごを持ってきてください。","html":"A <b class=\"tg\">plumber</b> was called after a <b class=\"tg\">leak</b> appeared under the sink, and a <b class=\"tg\">mechanic</b> is checking the delivery van. The <b class=\"tg\">electrical</b> panel is at the top of the stairs, so bring the <b class=\"tg\">ladder</b> from the storeroom."},{"id":77,"vol":4,"theme":"事務用品3","sentence":"The **photocopier** is out of paper, and extra **stationery** is kept in the bottom **drawer**. Notices are posted on the **bulletin board**, and someone has left a **briefcase** in the meeting room.","words":[{"w":"photocopier","jp":"コピー機","note":"`The photocopier is out of paper.`。copy machine と同義。","tier":"A","ref":"TSL 260","note_html":"<code>The photocopier is out of paper.</code>。copy machine と同義。"},{"w":"stationery","jp":"文房具","note":"不可算名詞。`order stationery`。stationary（動かない）と同音異義なので綴りが狙われる。","tier":"S","ref":"TSL 205","note_html":"不可算名詞。<code>order stationery</code>。stationary（動かない）と同音異義なので綴りが狙われる。"},{"w":"drawer","jp":"引き出し","note":"`the bottom drawer`、`keep it in the drawer`。Part 1にも出る。","tier":"S","ref":"TSL 155","note_html":"<code>the bottom drawer</code>、<code>keep it in the drawer</code>。Part 1にも出る。"},{"w":"bulletin board","jp":"掲示板","note":"`post a notice on the bulletin board`。社内連絡の定番。","tier":"S","ref":"TSL 158","note_html":"<code>post a notice on the bulletin board</code>。社内連絡の定番。"},{"w":"briefcase","jp":"書類かばん","note":"`leave a briefcase in the meeting room`。brief（要旨）＋case。","tier":"S","ref":"TSL 169","note_html":"<code>leave a briefcase in the meeting room</code>。brief（要旨）＋case。"}],"translation":"コピー機の用紙が切れており、予備の文房具は一番下の引き出しに入っています。お知らせは掲示板に貼られており、会議室に誰かが書類かばんを置き忘れています。","html":"The <b class=\"tg\">photocopier</b> is out of paper, and extra <b class=\"tg\">stationery</b> is kept in the bottom <b class=\"tg\">drawer</b>. Notices are posted on the <b class=\"tg\">bulletin board</b>, and someone has left a <b class=\"tg\">briefcase</b> in the meeting room."},{"id":78,"vol":4,"theme":"企業・組織","sentence":"The **merger** was announced after the board granted **authority** to the negotiating team. Only **authorized** staff may speak to the press, since the firm is now **headquartered in** Singapore and sells its products **worldwide**.","words":[{"w":"merger","jp":"合併","note":"`announce a merger`、`a merger between A and B`。動詞 merge。","tier":"S","ref":"TSL 141","note_html":"<code>announce a merger</code>、<code>a merger between A and B</code>。動詞 merge。"},{"w":"authority","jp":"権限、当局","note":"`grant authority to ~`、`local authorities`（地方自治体）。2義があり文脈で判別する。","tier":"S","ref":"TSL 224","note_html":"<code>grant authority to ~</code>、<code>local authorities</code>（地方自治体）。2義があり文脈で判別する。"},{"w":"authorized","jp":"許可された、公認の","note":"`authorized staff only`、`an authorized dealer`。動詞 authorize、名詞 authorization。","tier":"S","ref":"TSL 213","note_html":"<code>authorized staff only</code>、<code>an authorized dealer</code>。動詞 authorize、名詞 authorization。"},{"w":"be headquartered in","jp":"〜に本社を置く","note":"`The firm is headquartered in Singapore.`。名詞 headquarters から派生した受動態の定型。","tier":"S","ref":"TSL 203","note_html":"<code>The firm is headquartered in Singapore.</code>。名詞 headquarters から派生した受動態の定型。"},{"w":"worldwide","jp":"世界中で、世界的な","note":"`sell products worldwide`、`a worldwide network`。副詞・形容詞の両用法で前置詞は不要。","tier":"A","ref":"TSL 253","note_html":"<code>sell products worldwide</code>、<code>a worldwide network</code>。副詞・形容詞の両用法で前置詞は不要。"}],"translation":"取締役会が交渉チームに権限を与えた後、合併が発表されました。同社は現在シンガポールに本社を置き、世界中で製品を販売しているため、報道機関に対応できるのは許可された職員のみです。","html":"The <b class=\"tg\">merger</b> was announced after the board granted <b class=\"tg\">authority</b> to the negotiating team. Only <b class=\"tg\">authorized</b> staff may speak to the press, since the firm is now <b class=\"tg\">headquartered in</b> Singapore and sells its products <b class=\"tg\">worldwide</b>."},{"id":79,"vol":4,"theme":"調査・分析","sentence":"We sent a **questionnaire** to two thousand customers, and each **respondent** commented on one **aspect** of the service. From the **feedback**, we can **infer** that delivery speed matters more than price.","words":[{"w":"questionnaire","jp":"アンケート用紙","note":"`send / complete a questionnaire`。survey が「調査」全体、questionnaire は「用紙」。","tier":"S","ref":"TSL 244","note_html":"<code>send / complete a questionnaire</code>。survey が「調査」全体、questionnaire は「用紙」。"},{"w":"respondent","jp":"回答者","note":"`each respondent commented on ~`。動詞 respond、名詞 response。","tier":"S","ref":"TSL 162","note_html":"<code>each respondent commented on ~</code>。動詞 respond、名詞 response。"},{"w":"aspect","jp":"側面、面","note":"`one aspect of the service`、`in every aspect`。","tier":"S","ref":"TSL 186","note_html":"<code>one aspect of the service</code>、<code>in every aspect</code>。"},{"w":"feedback","jp":"意見、反応","note":"不可算名詞。`receive / provide feedback on ~`。","tier":"S","ref":"TSL 128","note_html":"不可算名詞。<code>receive / provide feedback on ~</code>。"},{"w":"infer","jp":"推測する","note":"`infer that ~`、`What can be inferred about ~?`。**Part 7の設問文そのもの**なので必ず押さえる。","tier":"S","ref":"TSL 39","note_html":"<code>infer that ~</code>、<code>What can be inferred about ~?</code>。**Part 7の設問文そのもの**なので必ず押さえる。"}],"translation":"私たちは2,000名の顧客にアンケート用紙を送り、各回答者がサービスの一側面について意見を述べました。その意見から、配達の速さが価格よりも重視されていると推測できます。","html":"We sent a <b class=\"tg\">questionnaire</b> to two thousand customers, and each <b class=\"tg\">respondent</b> commented on one <b class=\"tg\">aspect</b> of the service. From the <b class=\"tg\">feedback</b>, we can <b class=\"tg\">infer</b> that delivery speed matters more than price."},{"id":80,"vol":4,"theme":"業務効率化","sentence":"To raise **productivity**, the manager will **delegate** routine tasks and **designate** one person as the contact for each account. Working more **efficiently** should **minimize** the need for weekend shifts.","words":[{"w":"productivity","jp":"生産性","note":"`raise / improve productivity`。形容詞 productive、動詞 produce。","tier":"S","ref":"TSL 234","note_html":"<code>raise / improve productivity</code>。形容詞 productive、動詞 produce。"},{"w":"delegate","jp":"委任する／代表者","note":"`delegate routine tasks to staff`。動詞と名詞で発音が変わる（動詞 /-eɪt/、名詞 /-ət/）。","tier":"A","ref":"TSL 274","note_html":"<code>delegate routine tasks to staff</code>。動詞と名詞で発音が変わる（動詞 /-eɪt/、名詞 /-ət/）。"},{"w":"designate","jp":"指定する、任命する","note":"`designate one person as the contact`、`a designated area`（指定区域）。","tier":"A","ref":"TSL 255","note_html":"<code>designate one person as the contact</code>、<code>a designated area</code>（指定区域）。"},{"w":"efficiently","jp":"効率的に","note":"`work more efficiently`。形容詞 efficient、名詞 efficiency。effectively（効果的に）と区別する。","tier":"A","ref":"TSL 366","note_html":"<code>work more efficiently</code>。形容詞 efficient、名詞 efficiency。effectively（効果的に）と区別する。"},{"w":"minimize","jp":"最小限に抑える","note":"`minimize the need / cost / risk`。反意語 maximize。","tier":"A","ref":"TSL 318","note_html":"<code>minimize the need / cost / risk</code>。反意語 maximize。"}],"translation":"生産性を高めるため、部長は定型業務を委任し、各取引先の担当者を1名ずつ指定します。より効率的に働くことで、週末勤務の必要性を最小限に抑えられるはずです。","html":"To raise <b class=\"tg\">productivity</b>, the manager will <b class=\"tg\">delegate</b> routine tasks and <b class=\"tg\">designate</b> one person as the contact for each account. Working more <b class=\"tg\">efficiently</b> should <b class=\"tg\">minimize</b> the need for weekend shifts."},{"id":81,"vol":5,"theme":"レンタカー・車両","sentence":"The **car rental agency** near the station offers a weekly **rental** rate, and the **automobile** you reserved is a hybrid model. If you would rather use public **transit**, the **auto** repair shop next door can store the vehicle overnight.","words":[{"w":"car rental agency","jp":"レンタカー会社","note":"`pick up a car at the rental agency`。Part 3の旅行場面で頻出。","tier":"S","ref":"TSL 41","note_html":"<code>pick up a car at the rental agency</code>。Part 3の旅行場面で頻出。"},{"w":"rental","jp":"賃貸、レンタル料／賃貸の","note":"`a weekly rental rate`、`rental car / property`。動詞 rent、名詞 renter。","tier":"S","ref":"TSL 41","note_html":"<code>a weekly rental rate</code>、<code>rental car / property</code>。動詞 rent、名詞 renter。"},{"w":"automobile","jp":"自動車","note":"`an automobile manufacturer`。car の格式ばった語で、記事や社名に使われる。","tier":"S","ref":"TSL 241","note_html":"<code>an automobile manufacturer</code>。car の格式ばった語で、記事や社名に使われる。"},{"w":"transit","jp":"交通機関、輸送","note":"`public transit`（公共交通機関）、`in transit`（輸送中で）。2用法とも出る。","tier":"A","ref":"TSL 327","note_html":"<code>public transit</code>（公共交通機関）、<code>in transit</code>（輸送中で）。2用法とも出る。"},{"w":"auto","jp":"自動車の、自動車","note":"`an auto repair shop`、`the auto industry`。automobile の短縮形で複合語をつくる。","tier":"A","ref":"TSL 361","note_html":"<code>an auto repair shop</code>、<code>the auto industry</code>。automobile の短縮形で複合語をつくる。"}],"translation":"駅近くのレンタカー会社は週単位の料金を設定しており、ご予約いただいた自動車はハイブリッド車です。公共交通機関をお使いになりたい場合は、隣の自動車修理店で車を一晩預かることができます。","html":"The <b class=\"tg\">car rental agency</b> near the station offers a weekly <b class=\"tg\">rental</b> rate, and the <b class=\"tg\">automobile</b> you reserved is a hybrid model. If you would rather use public <b class=\"tg\">transit</b>, the <b class=\"tg\">auto</b> repair shop next door can store the vehicle overnight."},{"id":82,"vol":5,"theme":"通勤","sentence":"My **commute** takes forty minutes on an ordinary **weekday**, but the new express line is far more **convenient**. **Lately** I have been leaving earlier, mainly for the **convenience** of finding a seat.","words":[{"w":"commute","jp":"通勤する／通勤","note":"`My commute takes forty minutes.`、`commute to work by train`。名詞 commuter。","tier":"S","ref":"TSL 220","note_html":"<code>My commute takes forty minutes.</code>、<code>commute to work by train</code>。名詞 commuter。"},{"w":"weekday","jp":"平日","note":"`on a weekday`、`weekdays only`。weekend と対で。","tier":"S","ref":"TSL 194","note_html":"<code>on a weekday</code>、<code>weekdays only</code>。weekend と対で。"},{"w":"convenient","jp":"便利な、都合のよい","note":"`a convenient location / time`、`if it is convenient for you`。人を主語にしない点に注意。","tier":"S","ref":"TSL 54","note_html":"<code>a convenient location / time</code>、<code>if it is convenient for you</code>。人を主語にしない点に注意。"},{"w":"lately","jp":"最近","note":"現在完了とともに使う。`Lately I have been ~`。late（遅く）の副詞形ではない点が狙われる。","tier":"S","ref":"TSL 248","note_html":"現在完了とともに使う。<code>Lately I have been ~</code>。late（遅く）の副詞形ではない点が狙われる。"},{"w":"convenience","jp":"便利さ、好都合","note":"`for the convenience of ~`、`at your earliest convenience`。形容詞 convenient。","tier":"S","ref":"TSL 149","note_html":"<code>for the convenience of ~</code>、<code>at your earliest convenience</code>。形容詞 convenient。"}],"translation":"私の通勤は普通の平日で40分かかりますが、新しい急行路線のほうがはるかに便利です。最近は、主に座席を確保する都合から、早めに家を出るようにしています。","html":"My <b class=\"tg\">commute</b> takes forty minutes on an ordinary <b class=\"tg\">weekday</b>, but the new express line is far more <b class=\"tg\">convenient</b>. <b class=\"tg\">Lately</b> I have been leaving earlier, mainly for the <b class=\"tg\">convenience</b> of finding a seat."},{"id":83,"vol":5,"theme":"買い物・商業施設","sentence":"The **supermarket** on Elm Street is larger than the old **grocery store**, and it now sells **grocery** items in bulk. An **appliance store** and a **stationery store** have opened in the same complex.","words":[{"w":"supermarket","jp":"スーパーマーケット","note":"`shop at the supermarket`。grocery store より大型の店を指す。","tier":"S","ref":"TSL 93","note_html":"<code>shop at the supermarket</code>。grocery store より大型の店を指す。"},{"w":"grocery store","jp":"食料品店","note":"`the old grocery store`。日常買い物の場面で最頻出。","tier":"A","ref":"TSL 257","note_html":"<code>the old grocery store</code>。日常買い物の場面で最頻出。"},{"w":"grocery","jp":"食料雑貨","note":"通常は複数形 groceries（`buy groceries`）。`grocery items` のように形容詞的にも使う。","tier":"A","ref":"TSL 257","note_html":"通常は複数形 groceries（<code>buy groceries</code>）。<code>grocery items</code> のように形容詞的にも使う。"},{"w":"appliance store","jp":"家電量販店","note":"`an appliance store opened nearby`。appliance は家庭用電化製品。","tier":"S","ref":"TSL 88","note_html":"<code>an appliance store opened nearby</code>。appliance は家庭用電化製品。"},{"w":"stationery store","jp":"文房具店","note":"`order from the stationery store`。stationery（文房具）と stationary（動かない）の綴りに注意。","tier":"S","ref":"TSL 205","note_html":"<code>order from the stationery store</code>。stationery（文房具）と stationary（動かない）の綴りに注意。"}],"translation":"エルム通りのスーパーマーケットは古い食料品店より大きく、現在は食料雑貨をまとめ買いできる形で販売しています。同じ複合施設内に家電量販店と文房具店も開店しました。","html":"The <b class=\"tg\">supermarket</b> on Elm Street is larger than the old <b class=\"tg\">grocery store</b>, and it now sells <b class=\"tg\">grocery</b> items in bulk. An <b class=\"tg\">appliance store</b> and a <b class=\"tg\">stationery store</b> have opened in the same complex."},{"id":84,"vol":5,"theme":"空港・観光","sentence":"Collect your bags at the **baggage claim area**, where an **attendant** will help with oversized items. Keep your **wallet** in your **cabin** bag, and note that the **sightseeing** bus departs from Door 3.","words":[{"w":"baggage claim (area)","jp":"手荷物受取所","note":"`collect your bags at the baggage claim area`。空港案内の定型。","tier":"S","ref":"TSL 152","note_html":"<code>collect your bags at the baggage claim area</code>。空港案内の定型。"},{"w":"attendant","jp":"係員、案内係","note":"`a parking / flight attendant`。「その場で世話をする係」の総称。","tier":"S","ref":"TSL 52","note_html":"<code>a parking / flight attendant</code>。「その場で世話をする係」の総称。"},{"w":"cabin","jp":"機内、船室、小屋","note":"`cabin bag`（機内持ち込み手荷物）、`a log cabin`。文脈で意味が変わる。","tier":"A","ref":"TSL 304","note_html":"<code>cabin bag</code>（機内持ち込み手荷物）、<code>a log cabin</code>。文脈で意味が変わる。"},{"w":"wallet","jp":"財布","note":"`keep your wallet ~`、`leave a wallet behind`。Part 1・落とし物の話題に出る。","tier":"A","ref":"TSL 328","note_html":"<code>keep your wallet ~</code>、<code>leave a wallet behind</code>。Part 1・落とし物の話題に出る。"},{"w":"sightseeing","jp":"観光","note":"`a sightseeing bus / tour`、`go sightseeing`。名詞で、前に go を伴う形が多い。","tier":"A","ref":"TSL 325","note_html":"<code>a sightseeing bus / tour</code>、<code>go sightseeing</code>。名詞で、前に go を伴う形が多い。"}],"translation":"手荷物受取所で荷物をお受け取りください。そこでは係員が大型の荷物を手伝います。財布は機内持ち込み用のかばんに入れておき、観光バスは3番出口から出発することにご留意ください。","html":"Collect your bags at the <b class=\"tg\">baggage claim area</b>, where an <b class=\"tg\">attendant</b> will help with oversized items. Keep your <b class=\"tg\">wallet</b> in your <b class=\"tg\">cabin</b> bag, and note that the <b class=\"tg\">sightseeing</b> bus departs from Door 3."},{"id":85,"vol":5,"theme":"監督・立ち入り検査","sentence":"The **safety insp
