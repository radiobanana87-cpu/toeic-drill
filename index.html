 -&gt; returns：時を表す副詞節では will を使わない。","ja":"部長が戻るまでここでお待ちください。"},{"en":"If it rains tomorrow, the event will be postponed.","ok":true,"note":"正：条件の副詞節は現在形。","ja":"明日雨が降れば、そのイベントは延期される。"},{"en":"We will call you when the order arrives.","ok":true,"note":"正：時を表す副詞節では未来を現在形で表す。","ja":"注文品が届いたらお電話します。"}]},{"id":35,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Employees can requests additional leave.","ok":false,"note":"requests -&gt; request：助動詞の後ろは原形。","ja":"従業員は追加の休暇を申請できる。"},{"en":"The shipment should arrive by Thursday.","ok":true,"note":"正：助動詞 should + 原形。","ja":"出荷は木曜日までに到着するはずだ。"},{"en":"All staff must attend the safety briefing.","ok":true,"note":"正：助動詞 + 動詞の原形。","ja":"全職員は安全説明会に出席しなければならない。"},{"en":"The report must be submits by noon.","ok":false,"note":"submits -&gt; submitted：must be の後ろは過去分詞。","ja":"報告書は正午までに提出されなければならない。"}]},{"id":36,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She had already left when the call came in.","ok":true,"note":"正：過去完了 + 過去。","ja":"電話がかかってきたとき、彼女はすでに退社していた。"},{"en":"The train had left before we will get there.","ok":false,"note":"will get -&gt; got：過去の話なので過去形。","ja":"私たちが着く前に電車は出発していた。"},{"en":"We have finished the audit before the deadline passed.","ok":false,"note":"have finished -&gt; had finished：過去の基準時より前なので過去完了。","ja":"締め切りが過ぎる前に監査を終えていた。"},{"en":"By the time we arrived, the meeting had ended.","ok":true,"note":"正：過去のある時点より前の完了は過去完了。","ja":"我々が到着したときには、会議は終わっていた。"}]},{"id":37,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Every employee have received a new ID card.","ok":false,"note":"have -&gt; has：every + 単数名詞は単数扱い。","ja":"全従業員が新しいIDカードを受け取った。"},{"en":"A number of employees were transferred.","ok":true,"note":"正：a number of ... は複数扱い。","ja":"多くの従業員が異動になった。"},{"en":"Ten percent of the budget is reserved for training.","ok":true,"note":"正：of の後ろが不可算名詞なので単数扱い。","ja":"予算の10パーセントが研修用に確保されている。"},{"en":"Neither of the proposals were accepted.","ok":false,"note":"were -&gt; was：neither of ... は単数扱いが原則。","ja":"どちらの提案も採用されなかった。"}]},{"id":38,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She told us that she will attend the conference.","ok":false,"note":"will -&gt; would：主節が過去なので時制を一致させる。","ja":"彼女は会議に出席すると私たちに言った。"},{"en":"The manager said that the deadline had been extended.","ok":true,"note":"正：主節が過去なので従属節も過去完了。","ja":"部長は締め切りが延長されたと言った。"},{"en":"They announced that the office is closed last Friday.","ok":false,"note":"is -&gt; was：last Friday という過去の時点に合わせる。","ja":"先週の金曜日は休業だと彼らは告知した。"},{"en":"He explained that the system was under maintenance.","ok":true,"note":"正：時制の一致で過去形。","ja":"彼はシステムが保守中だと説明した。"}]},{"id":39,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The documents are needing to be signed today.","ok":false,"note":"are needing -&gt; need：状態を表す need は進行形にしない。","ja":"その書類は本日署名が必要だ。"},{"en":"The office was belonged to a bank before.","ok":false,"note":"was belonged -&gt; belonged：belong は受動態にできない自動詞。","ja":"そのオフィスは以前、銀行の所有だった。"},{"en":"The results will be announced next week.","ok":true,"note":"正：未来の受動態。","ja":"結果は来週発表される。"},{"en":"The proposal is being reviewed at the moment.","ok":true,"note":"正：進行形の受動態。","ja":"その提案は現在検討中である。"}]},{"id":40,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"I have submitted the form two days ago.","ok":false,"note":"have submitted -&gt; submitted：ago は現在完了と併用できない。","ja":"私は2日前にその用紙を提出した。"},{"en":"The company has expanded into three new markets.","ok":true,"note":"正：現在までの結果を表す現在完了。","ja":"同社は3つの新市場に進出した。"},{"en":"We finished the renovation last month.","ok":true,"note":"正：過去の一点を示す語句があるので過去形。","ja":"私たちは先月、改装を終えた。"},{"en":"The CEO has resigned in 2019.","ok":false,"note":"has resigned -&gt; resigned：in 2019 は過去の一点。","ja":"そのCEOは2019年に辞任した。"}]},{"id":41,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She always check the inventory before closing.","ok":false,"note":"check -&gt; checks：三単現の -s が必要。","ja":"彼女は閉店前に必ず在庫を確認する。"},{"en":"The delivery truck arrive at noon each day.","ok":false,"note":"arrive -&gt; arrives：主語が三人称単数。","ja":"配送トラックは毎日正午に到着する。"},{"en":"Mr. Cho reviews the invoices on Mondays.","ok":true,"note":"正：三人称単数現在の -s。","ja":"チョウ氏は毎週月曜日に請求書を確認する。"},{"en":"The office opens at eight thirty every weekday.","ok":true,"note":"正：習慣を表す現在形の三単現。","ja":"そのオフィスは平日は8時半に開く。"}]},{"id":42,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"He is knowing the answer to that question.","ok":false,"note":"is knowing -&gt; knows：know は状態動詞で進行形にしない。","ja":"彼はその質問の答えを知っている。"},{"en":"The technicians are installing the new servers now.","ok":true,"note":"正：現在進行形。","ja":"技術者たちは今、新しいサーバーを設置している。"},{"en":"We are currently updating the customer database.","ok":true,"note":"正：currently と現在進行形の組み合わせ。","ja":"当社は現在、顧客データベースを更新している。"},{"en":"The auditors is reviewing the accounts this week.","ok":false,"note":"is -&gt; are：主語 auditors は複数。","ja":"監査人たちは今週、会計を精査している。"}]},{"id":43,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The machine is looked after by the maintenance team.","ok":true,"note":"正：look after の受動態は after を残す。","ja":"その機械は保守チームによって管理されている。"},{"en":"The old files were disposed by the staff.","ok":false,"note":"disposed -&gt; disposed of：dispose of の of を残す。","ja":"古いファイルはスタッフによって処分された。"},{"en":"The proposal was turned down by the committee.","ok":true,"note":"正：群動詞 turn down の受動態。","ja":"その提案は委員会によって却下された。"},{"en":"The issue was dealt by the supervisor.","ok":false,"note":"dealt -&gt; dealt with：deal with の with を省略できない。","ja":"その問題は監督者によって処理された。"}]},{"id":44,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She let the intern to leave early.","ok":false,"note":"to leave -&gt; leave：let は原形不定詞をとる。","ja":"彼女はインターンを早退させた。"},{"en":"They had the technician to check the wiring.","ok":false,"note":"to check -&gt; check：使役の have は原形不定詞。","ja":"彼らは技術者に配線を点検してもらった。"},{"en":"We made the employees stay late.","ok":true,"note":"正：make + 目的語 + 原形不定詞。","ja":"私たちは従業員を残業させた。"},{"en":"The manager had the report revised before noon.","ok":true,"note":"正：have + 目的語 + 過去分詞。","ja":"部長は正午前に報告書を修正させた。"}]},{"id":45,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The printer has been making a strange noise.","ok":true,"note":"正：継続する動作を表す現在完了進行形。","ja":"そのプリンターは変な音を出し続けている。"},{"en":"She has been worked here for a decade.","ok":false,"note":"has been worked -&gt; has been working：能動の意味なので進行形。","ja":"彼女は10年間ここで働いている。"},{"en":"They have been waiting for the shipment since Monday.","ok":true,"note":"正：現在完了進行形で継続中の動作。","ja":"彼らは月曜日から出荷を待ち続けている。"},{"en":"We have been knowing each other for years.","ok":false,"note":"have been knowing -&gt; have known：状態動詞は完了進行形にしない。","ja":"私たちは何年も前から知り合いだ。"}]},{"id":46,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"There are several options available.","ok":true,"note":"正：後ろの名詞が複数なので are。","ja":"いくつかの選択肢が利用できる。"},{"en":"There has been many complaints this month.","ok":false,"note":"has -&gt; have：complaints は複数。","ja":"今月は多くの苦情が寄せられている。"},{"en":"There were a delay in the delivery.","ok":false,"note":"were -&gt; was：a delay は単数。","ja":"配送に遅れが生じた。"},{"en":"There is a meeting scheduled for Friday.","ok":true,"note":"正：後ろの名詞が単数なので is。","ja":"金曜日に予定されている会議がある。"}]},{"id":47,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"By 2020, the plant had produce one million units.","ok":false,"note":"had produce -&gt; had produced：完了形は過去分詞。","ja":"2020年までに、その工場は100万台を生産していた。"},{"en":"By the end of May, we will completed the survey.","ok":false,"note":"will completed -&gt; will have completed：未来完了の形。","ja":"5月末までに、私たちは調査を終えているだろう。"},{"en":"The renovation will have finished by the time you return.","ok":true,"note":"正：未来完了 + 時の副詞節（現在形）。","ja":"あなたが戻るころには改装は終わっているだろう。"},{"en":"By next June, the team will have completed the audit.","ok":true,"note":"正：未来のある時点までの完了は未来完了。","ja":"来年の6月までに、チームは監査を完了しているだろう。"}]},{"id":48,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The equipment has been inspected twice this year.","ok":true,"note":"正：現在完了の受動態。","ja":"その機器は今年2回点検されている。"},{"en":"The building has been renovate recently.","ok":false,"note":"renovate -&gt; renovated：been の後ろは過去分詞。","ja":"その建物は最近改装された。"},{"en":"The documents had been filed before the audit began.","ok":true,"note":"正：過去完了の受動態。","ja":"監査が始まる前に書類は整理されていた。"},{"en":"The keys had been leave on the desk.","ok":false,"note":"leave -&gt; left：受動態は過去分詞。","ja":"鍵は机の上に置かれていた。"}]},{"id":49,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Both the CEO and the CFO was present.","ok":false,"note":"was -&gt; were：both A and B は複数扱い。","ja":"CEOとCFOの両方が出席していた。"},{"en":"Either the director or the supervisor is attending.","ok":true,"note":"正：近い方の主語 supervisor は単数。","ja":"部長か監督者のどちらかが出席する。"},{"en":"Not only the staff but also the manager were informed.","ok":false,"note":"were -&gt; was：動詞に近い manager が単数。","ja":"スタッフだけでなく部長にも知らされていた。"},{"en":"Neither the manager nor the assistants are available.","ok":true,"note":"正：nor の場合、動詞は近い方の主語に一致。","ja":"部長も助手たちも手が空いていない。"}]},{"id":50,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Sales have raised by five percent.","ok":false,"note":"have raised -&gt; have risen：目的語がないので自動詞 rise。","ja":"売上は5パーセント伸びた。"},{"en":"The manager rose the issue at the meeting.","ok":false,"note":"rose -&gt; raised：目的語があるので他動詞 raise。","ja":"部長は会議でその問題を提起した。"},{"en":"The company raised its prices last month.","ok":true,"note":"正：raise は他動詞で目的語をとる。","ja":"同社は先月、価格を引き上げた。"},{"en":"The prices have risen sharply this quarter.","ok":true,"note":"正：rise は自動詞（rise-rose-risen）。","ja":"今四半期、価格は急激に上昇した。"}]},{"id":51,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Please explain the procedure to the new staff.","ok":true,"note":"正：explain は explain A to B の型。","ja":"新入社員にその手順を説明してください。"},{"en":"She explained me the new system.","ok":false,"note":"explained me -&gt; explained to me：explain は二重目的語をとらない。","ja":"彼女は私に新しいシステムを説明した。"},{"en":"They discussed about the budget for an hour.","ok":false,"note":"discussed about -&gt; discussed：discuss は他動詞なので前置詞不要。","ja":"彼らは1時間その予算について議論した。"},{"en":"The company provided employees with new laptops.","ok":true,"note":"正：provide A with B の型。","ja":"会社は従業員に新しいノートパソコンを支給した。"}]},{"id":52,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The conference is going to be held in Osaka.","ok":true,"note":"正：be going to + 受動態。","ja":"その会議は大阪で開催される予定だ。"},{"en":"The seminar is take place next Tuesday.","ok":false,"note":"is take -&gt; takes：be 動詞と原形は並べられない。","ja":"そのセミナーは来週の火曜日に開かれる。"},{"en":"I will be send you the file this afternoon.","ok":false,"note":"will be send -&gt; will send：will の後ろは原形。","ja":"今日の午後、ファイルをお送りします。"},{"en":"The flight leaves at seven tomorrow morning.","ok":true,"note":"正：確定した予定は現在形で表せる。","ja":"その便は明日の朝7時に出発する。"}]},{"id":53,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"He must have forgotten the appointment.","ok":true,"note":"正：過去の推量は must have + 過去分詞。","ja":"彼は約束を忘れていたに違いない。"},{"en":"She could have went to the wrong office.","ok":false,"note":"went -&gt; gone：助動詞 + have の後ろは過去分詞。","ja":"彼女は間違ったオフィスに行ってしまったのかもしれない。"},{"en":"They might have been finish the work already.","ok":false,"note":"been finish -&gt; finished：might have finished とする。","ja":"彼らはすでに作業を終えているかもしれない。"},{"en":"The shipment should have arrived by now.","ok":true,"note":"正：should have + 過去分詞。","ja":"出荷は今ごろ到着しているはずだ。"}]},{"id":54,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The manager insisted that the report is completed today.","ok":false,"note":"is -&gt; be：insist の that 節は原形。","ja":"部長は報告書を今日中に仕上げるよう強く求めた。"},{"en":"The board recommended that the policy be revised.","ok":true,"note":"正：提案を表す動詞の that 節は原形（仮定法現在）。","ja":"取締役会はその方針を改訂するよう勧告した。"},{"en":"It is essential that every employee submit the form.","ok":true,"note":"正：essential の that 節は原形。","ja":"全従業員がその用紙を提出することが不可欠だ。"},{"en":"We suggest that he attends the training.","ok":false,"note":"attends -&gt; attend：suggest の that 節は原形。","ja":"彼が研修に参加することを提案します。"}]},{"id":55,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Reviewing the contracts take several hours.","ok":false,"note":"take -&gt; takes：動名詞主語は単数扱い。","ja":"契約書の確認には数時間かかる。"},{"en":"Whether the plan works depend on funding.","ok":false,"note":"depend -&gt; depends：名詞節主語は単数扱い。","ja":"その計画がうまくいくかどうかは資金次第だ。"},{"en":"Managing multiple projects requires strong planning.","ok":true,"note":"正：動名詞主語は単数扱い。","ja":"複数のプロジェクトを管理するには強い計画性が必要だ。"},{"en":"What the clients want is faster delivery.","ok":true,"note":"正：名詞節主語は単数扱い。","ja":"顧客が求めているのはより速い配送だ。"}]},{"id":56,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The committee has chosen a new chairperson.","ok":true,"note":"正：choose-chose-chosen。","ja":"委員会は新しい委員長を選出した。"},{"en":"The files were kept in the archive room.","ok":true,"note":"正：keep-kept-kept の受動態。","ja":"そのファイルは書庫に保管されていた。"},{"en":"The report was wrote by two analysts.","ok":false,"note":"wrote -&gt; written：受動態は過去分詞。","ja":"その報告書は2人の分析担当者によって書かれた。"},{"en":"The invoice has already been sended.","ok":false,"note":"sended -&gt; sent：send は不規則変化。","ja":"請求書はすでに送付済みだ。"}]},{"id":57,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The accident occurred near the loading dock.","ok":true,"note":"正：occur は自動詞で能動のまま。","ja":"その事故は搬入口の近くで起きた。"},{"en":"The meeting was consisted of five members.","ok":false,"note":"was consisted -&gt; consisted：consist of は受動態にしない。","ja":"その会議は5名で構成されていた。"},{"en":"The prices have remained stable this year.","ok":true,"note":"正：remain は自動詞。","ja":"今年、価格は安定したままだ。"},{"en":"The problem was happened during the test.","ok":false,"note":"was happened -&gt; happened：happen は受動態にできない。","ja":"その問題は試験中に発生した。"}]},{"id":58,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"When the manager will arrive, we will begin.","ok":false,"note":"will arrive -&gt; arrives：時の副詞節では未来を現在形で表す。","ja":"部長が到着したら始めます。"},{"en":"While we waited, the technician was fix the printer.","ok":false,"note":"was fix -&gt; was fixing：進行形は be + 現在分詞。","ja":"私たちが待っている間、技術者はプリンターを修理していた。"},{"en":"While she was reviewing the data, the power went out.","ok":true,"note":"正：進行中の動作は過去進行形。","ja":"彼女がデータを確認している間に停電した。"},{"en":"When the alarm sounded, everyone left the building.","ok":true,"note":"正：過去の出来事の連続。","ja":"警報が鳴ったとき、全員が建物から出た。"}]},{"id":59,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She works here since last April.","ok":false,"note":"works -&gt; has worked：since があるので現在完了。","ja":"彼女は昨年4月からここで働いている。"},{"en":"It has been three months since the launch.","ok":true,"note":"正：It has been ... since の定型。","ja":"発売から3か月が経つ。"},{"en":"They have joined the company for five years.","ok":false,"note":"have joined -&gt; have worked at：join は瞬間的動作なので継続期間と合わない。","ja":"彼らは5年間その会社に勤めている。"},{"en":"The branch has been closed for two weeks.","ok":true,"note":"正：状態の継続を表す現在完了。","ja":"その支店は2週間閉鎖されている。"}]},{"id":60,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Most of the equipment is stored in the warehouse.","ok":true,"note":"正：equipment は不可算なので単数扱い。","ja":"機器の大半は倉庫に保管されている。"},{"en":"Two thirds of the budget have been spent.","ok":false,"note":"have -&gt; has：budget は単数。","ja":"予算の3分の2がすでに使われた。"},{"en":"All of the information were confidential.","ok":false,"note":"were -&gt; was：information は不可算名詞。","ja":"その情報はすべて機密だった。"},{"en":"Half of the participants were from overseas.","ok":true,"note":"正：of の後ろが複数なので複数扱い。","ja":"参加者の半数は海外からだった。"}]},{"id":61,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Despite the flight was delayed, we arrived on time.","ok":false,"note":"Despite -&gt; Although：後ろが節なので接続詞。","ja":"便が遅れたにもかかわらず、私たちは時間どおり到着した。"},{"en":"Despite the heavy rain, the ceremony took place.","ok":true,"note":"正：Despite は前置詞で後ろに名詞句。","ja":"大雨にもかかわらず、式典は行われた。"},{"en":"Although the traffic, we reached the venue early.","ok":false,"note":"Although -&gt; Despite：後ろが名詞句なので前置詞。","ja":"渋滞にもかかわらず、私たちは早めに会場に着いた。"},{"en":"Although the weather was poor, the event continued.","ok":true,"note":"正：Although は接続詞で後ろに節。","ja":"天候は悪かったが、そのイベントは続行された。"}]},{"id":62,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"We left early because the road was closed.","ok":true,"note":"正：because + 節。","ja":"道路が閉鎖されていたので、私たちは早めに出た。"},{"en":"The delay occurred because of the machine broke down.","ok":false,"note":"because of -&gt; because：後ろが節。","ja":"機械が故障したため、遅延が生じた。"},{"en":"The event was canceled because of the storm.","ok":true,"note":"正：because of + 名詞句。","ja":"嵐のため、そのイベントは中止された。"},{"en":"Sales fell because the economic downturn.","ok":false,"note":"because -&gt; because of：後ろが名詞句。","ja":"景気後退のため、売上が落ちた。"}]},{"id":63,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"While the manager was speaking, the phone rang.","ok":true,"note":"正：While は接続詞。","ja":"部長が話している間、電話が鳴った。"},{"en":"During the presentation, the projector failed.","ok":true,"note":"正：During は前置詞。","ja":"プレゼンテーションの最中、プロジェクターが故障した。"},{"en":"During the manager was speaking, no one interrupted.","ok":false,"note":"During -&gt; While：後ろが節なので接続詞。","ja":"部長が話している間、誰も口を挟まなかった。"},{"en":"While the renovation, the office will be closed.","ok":false,"note":"While -&gt; During：後ろが名詞句なので前置詞。","ja":"改装期間中、そのオフィスは閉鎖される。"}]},{"id":64,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The company which employees are highly trained is hiring.","ok":false,"note":"which -&gt; whose：所有関係を表すので所有格。","ja":"従業員が高度に訓練されているその会社は人材を募集している。"},{"en":"The employee who submitted the form was promoted.","ok":true,"note":"正：人が先行詞の主格 who。","ja":"その用紙を提出した従業員が昇進した。"},{"en":"The client whose is waiting in the lobby called.","ok":false,"note":"whose -&gt; who：直後が動詞なので主格。","ja":"ロビーで待っている顧客から電話があった。"},{"en":"The report which arrived yesterday needs revision.","ok":true,"note":"正：物が先行詞の主格 which。","ja":"昨日届いた報告書は修正が必要だ。"}]},{"id":65,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"That is the reason why we changed suppliers.","ok":true,"note":"正：理由を表す関係副詞 why。","ja":"それが供給業者を変更した理由だ。"},{"en":"This is the office where the meeting will be held.","ok":true,"note":"正：場所を表す関係副詞 where。","ja":"ここが会議が開かれるオフィスだ。"},{"en":"This is the room which the equipment is stored.","ok":false,"note":"which -&gt; where：後ろが完全な文なので関係副詞。","ja":"ここが機器を保管している部屋だ。"},{"en":"I remember the day when the branch opened.","ok":true,"note":"正：時を表す関係副詞 when。","ja":"その支店が開店した日を覚えている。"}]},{"id":66,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Even though the budget was small, the project succeeded.","ok":true,"note":"正：even though + 節。","ja":"予算は少なかったが、そのプロジェクトは成功した。"},{"en":"Even though the delay, the goods arrived intact.","ok":false,"note":"Even though -&gt; In spite of：後ろが名詞句。","ja":"遅延にもかかわらず、商品は無傷で到着した。"},{"en":"In spite of the budget was small, we succeeded.","ok":false,"note":"In spite of -&gt; Even though：後ろが節。","ja":"予算は少なかったが、私たちは成功した。"},{"en":"In spite of the delay, the goods arrived intact.","ok":true,"note":"正：in spite of + 名詞句。","ja":"遅延にもかかわらず、商品は無傷で到着した。"}]},{"id":67,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The box was such heavy that two people carried it.","ok":false,"note":"such -&gt; so：後ろが形容詞単独なので so。","ja":"その箱はとても重かったので、2人で運んだ。"},{"en":"It was so long meeting that we skipped lunch.","ok":false,"note":"so -&gt; such：後ろに名詞があるので such。","ja":"とても長い会議だったので、私たちは昼食を抜いた。"},{"en":"It was such a long meeting that we skipped lunch.","ok":true,"note":"正：such + a + 形容詞 + 名詞 + that。","ja":"とても長い会議だったので、私たちは昼食を抜いた。"},{"en":"The instructions were clear so that everyone understood.","ok":true,"note":"正：so that + 節で結果や目的。","ja":"指示は明確だったので、全員が理解した。"}]},{"id":68,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Whether or not the plan works, we will continue.","ok":true,"note":"正：whether or not は譲歩の副詞節を作れる。","ja":"その計画がうまくいくかどうかにかかわらず、私たちは続ける。"},{"en":"The question is if we should expand.","ok":false,"note":"if -&gt; whether：be 動詞の補語になる名詞節に if は使えない。","ja":"問題は事業を拡大すべきかどうかだ。"},{"en":"We are not sure whether the parts will arrive today.","ok":true,"note":"正：不確実さを表す whether 節。","ja":"部品が今日届くかどうかは分からない。"},{"en":"Please let us know whether you can attend.","ok":true,"note":"正：「～かどうか」の名詞節。","ja":"出席できるかどうかをお知らせください。"}]},{"id":69,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The building, which was built in 1990, is being renovated.","ok":true,"note":"正：非制限用法は which。","ja":"その建物は1990年に建てられたが、現在改装中だ。"},{"en":"The proposal that the committee approved is final.","ok":true,"note":"正：制限用法の目的格 that。","ja":"委員会が承認したその提案が最終案だ。"},{"en":"The building, that was built in 1990, is closed.","ok":false,"note":"that -&gt; which：コンマ付きの非制限用法に that は使えない。","ja":"その建物は1990年に建てられたが、現在は閉鎖されている。"},{"en":"The manager who&#x27;s office is upstairs is out.","ok":false,"note":"who&#x27;s -&gt; whose：所有格は whose。","ja":"執務室が上の階にある部長は外出中だ。"}]},{"id":70,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The office will be closed until Monday.","ok":true,"note":"正：until は継続の終点（～まで）。","ja":"そのオフィスは月曜日まで閉まっている。"},{"en":"The store stays open by nine o&#x27;clock.","ok":false,"note":"by -&gt; until：状態の継続なので until。","ja":"その店は9時まで開いている。"},{"en":"Please submit the form by Friday.","ok":true,"note":"正：by は期限（～までに）。","ja":"金曜日までにその用紙を提出してください。"},{"en":"We must finish the report until noon.","ok":false,"note":"until -&gt; by：完了の期限なので by。","ja":"正午までに報告書を仕上げなければならない。"}]},{"id":71,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The costs increased, but profits remained stable.","ok":true,"note":"正：等位接続詞 but。","ja":"費用は増加したが、利益は安定していた。"},{"en":"Therefore the sales rose, the team celebrated.","ok":false,"note":"Therefore -&gt; Because：節をつなぐには接続詞が必要。","ja":"売上が伸びたので、チームは祝った。"},{"en":"The costs increased; however, profits remained stable.","ok":true,"note":"正：セミコロン + 接続副詞。","ja":"費用は増加したが、利益は安定していた。"},{"en":"The costs increased, however profits remained stable.","ok":false,"note":"however -&gt; but：however は副詞なので節同士を接続できない。","ja":"費用は増加したが、利益は安定していた。"}]},{"id":72,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The device works like it was designed to.","ok":false,"note":"like -&gt; as：後ろが節なので接続詞 as。","ja":"その装置は設計どおりに動く。"},{"en":"He works as an engineer.","ok":true,"note":"正：as は「～として」の前置詞。","ja":"彼は技術者として働いている。"},{"en":"The new model looks like the previous one.","ok":true,"note":"正：like + 名詞句。","ja":"その新型モデルは前のモデルに似ている。"},{"en":"Please complete the form as instructed.","ok":true,"note":"正：as は接続詞として節や分詞句を導ける。","ja":"指示どおりに用紙を記入してください。"}]},{"id":73,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Unless you don&#x27;t register, you cannot attend.","ok":false,"note":"don&#x27;t register -&gt; register：unless 自体が否定を含むので二重否定になる。","ja":"登録しない限り、参加できません。"},{"en":"The event will proceed unless it will rain.","ok":false,"note":"will rain -&gt; rains：条件の副詞節は現在形。","ja":"雨が降らない限り、そのイベントは実施される。"},{"en":"Unless you register today, you cannot attend.","ok":true,"note":"正：unless は「～でない限り」。","ja":"今日登録しない限り、参加できません。"},{"en":"You cannot enter unless you have a badge.","ok":true,"note":"正：unless 節は肯定形。","ja":"バッジがなければ入場できません。"}]},{"id":74,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The supplier with who we work is reliable.","ok":false,"note":"who -&gt; whom：前置詞の直後は目的格。","ja":"私たちが取引しているその供給業者は信頼できる。"},{"en":"The supplier with whom we signed a contract is reliable.","ok":true,"note":"正：前置詞 + whom。","ja":"私たちが契約を結んだその供給業者は信頼できる。"},{"en":"The topic about which she spoke was complex.","ok":true,"note":"正：前置詞 + which。","ja":"彼女が話した話題は複雑だった。"},{"en":"The colleague that I rely is on leave.","ok":false,"note":"rely -&gt; rely on：rely on の on が欠けている。","ja":"私が頼りにしている同僚は休暇中だ。"}]},{"id":75,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"You can pay either by card or in cash.","ok":true,"note":"正：either A or B。","ja":"カードか現金のどちらかで支払えます。"},{"en":"The plan is both efficient as well as affordable.","ok":false,"note":"as well as -&gt; and：both と対応するのは and。","ja":"その計画は効率的でありながら手ごろでもある。"},{"en":"The seminar covers both marketing and finance.","ok":true,"note":"正：both A and B。","ja":"そのセミナーはマーケティングと財務の両方を扱う。"},{"en":"Neither the copier or the printer is working.","ok":false,"note":"or -&gt; nor：neither と対応するのは nor。","ja":"コピー機もプリンターも動いていない。"}]},{"id":76,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The survey was popular among younger customers.","ok":true,"note":"正：3 者以上の集団には among。","ja":"その調査は若い顧客の間で人気があった。"},{"en":"Cooperation between all the members is essential.","ok":false,"note":"between -&gt; among：不特定多数の集団には among。","ja":"メンバー全員の協力が不可欠だ。"},{"en":"The prize was shared among the two winners.","ok":false,"note":"among -&gt; between：2 者間なので between。","ja":"賞金は2人の受賞者で分けられた。"},{"en":"The budget was divided between the two departments.","ok":true,"note":"正：2 者間は between。","ja":"予算は2つの部署の間で分けられた。"}]},{"id":77,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"What the manager suggested was reasonable.","ok":true,"note":"正：先行詞を含む関係代名詞 what。","ja":"部長が提案したことは妥当だった。"},{"en":"We believe what the deadline is realistic.","ok":false,"note":"what -&gt; that：後ろが完全な文なので that。","ja":"締め切りは現実的だと私たちは考えている。"},{"en":"We believe that the deadline is realistic.","ok":true,"note":"正：完全な文を導く接続詞 that。","ja":"締め切りは現実的だと私たちは考えている。"},{"en":"That the manager suggested was reasonable.","ok":false,"note":"That -&gt; What：後ろが目的語の欠けた不完全文なので what。","ja":"部長が提案したことは妥当だった。"}]},{"id":78,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Owing to the workers went on strike, deliveries stopped.","ok":false,"note":"Owing to -&gt; Because：後ろが節。","ja":"労働者がストライキをしたため、配送が止まった。"},{"en":"Thanks to your support, the campaign succeeded.","ok":true,"note":"正：thanks to + 名詞句。","ja":"ご支援のおかげで、そのキャンペーンは成功した。"},{"en":"Owing to the strike, deliveries were delayed.","ok":true,"note":"正：owing to + 名詞句。","ja":"ストライキのため、配送が遅れた。"},{"en":"Thanks to the team worked overtime, we met the deadline.","ok":false,"note":"Thanks to -&gt; Because：後ろが節なので接続詞。","ja":"チームが残業したおかげで、締め切りに間に合った。"}]},{"id":79,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"She is one of the employees who work in Osaka.","ok":true,"note":"正：先行詞は複数の employees。","ja":"彼女は大阪で働く従業員の一人だ。"},{"en":"The candidates, who they applied online, were shortlisted.","ok":false,"note":"who they -&gt; who：関係代名詞が主語なので they は不要。","ja":"オンラインで応募した候補者たちが選考を通過した。"},{"en":"Mr. Sato, who joined last year, leads the team.","ok":true,"note":"正：人を補足説明する非制限用法。","ja":"昨年入社した佐藤氏がそのチームを率いている。"},{"en":"The files which is on the desk belong to Ms. Kim.","ok":false,"note":"is -&gt; are：先行詞 files は複数。","ja":"机の上にあるファイルはキムさんのものだ。"}]},{"id":80,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Whereas the delay, the project finished on time.","ok":false,"note":"Whereas -&gt; Despite：後ろが名詞句なので前置詞。","ja":"遅延があったにもかかわらず、プロジェクトは予定どおり終わった。"},{"en":"In contrast the previous model, this one is lighter.","ok":false,"note":"In contrast -&gt; Unlike：名詞句を導くには前置詞が必要。","ja":"前のモデルと違って、こちらの方が軽い。"},{"en":"While the design is simple, the mechanism is complex.","ok":true,"note":"正：while は対比も表す。","ja":"デザインは単純だが、仕組みは複雑だ。"},{"en":"Sales rose in Asia, whereas they fell in Europe.","ok":true,"note":"正：対比を表す接続詞 whereas。","ja":"アジアでは売上が伸びたが、欧州では落ち込んだ。"}]},{"id":81,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"In the event of a power failure, use the stairs.","ok":true,"note":"正：in the event of + 名詞句。","ja":"停電の際は階段をご利用ください。"},{"en":"Take an umbrella in case it rains.","ok":true,"note":"正：in case + 節。","ja":"雨が降るといけないので傘を持って行きなさい。"},{"en":"In the event that the system fails, call support.","ok":true,"note":"正：in the event that + 節。","ja":"システムに障害が起きた場合はサポートへご連絡ください。"},{"en":"In case of the alarm sounds, leave the building.","ok":false,"note":"In case of -&gt; In case：後ろが節なので of は不要。","ja":"警報が鳴った場合は建物から出てください。"}]},{"id":82,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"We have known each other during ten years.","ok":false,"note":"during -&gt; for：期間の長さには for。","ja":"私たちは10年来の知り合いだ。"},{"en":"The office has been closed for three days.","ok":true,"note":"正：for + 期間の長さ。","ja":"そのオフィスは3日間閉まっている。"},{"en":"The manager has been away since Tuesday.","ok":true,"note":"正：since + 起点。","ja":"部長は火曜日から不在だ。"},{"en":"The training lasted since two hours.","ok":false,"note":"since -&gt; for：長さを表すので for。","ja":"その研修は2時間続いた。"}]},{"id":83,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The person standing near the entrance is our client.","ok":true,"note":"正：現在分詞の後置修飾。","ja":"入口付近に立っている人が当社の顧客だ。"},{"en":"The employee works in Osaka is retiring.","ok":false,"note":"works -&gt; who works：主格の関係代名詞は省略できない。","ja":"大阪で働いているその従業員は退職する。"},{"en":"The book I ordered arrived this morning.","ok":true,"note":"正：目的格の関係代名詞は省略できる。","ja":"私が注文した本が今朝届いた。"},{"en":"The report was submitted late needs revision.","ok":false,"note":"was submitted -&gt; submitted：関係代名詞と be を省略した分詞形にする。","ja":"遅れて提出された報告書は修正が必要だ。"}]},{"id":84,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"You may use the room as long as you clean it.","ok":true,"note":"正：as long as は条件。","ja":"掃除をしてくれるなら、その部屋を使ってよい。"},{"en":"As far as I know, the deadline has not changed.","ok":true,"note":"正：as far as は範囲・程度。","ja":"私の知る限り、締め切りは変わっていない。"},{"en":"As long as I know, the office is closed.","ok":false,"note":"As long as -&gt; As far as：知識の範囲を表すので as far as。","ja":"私の知る限り、そのオフィスは閉まっている。"},{"en":"As far as you submit the form, you can join.","ok":false,"note":"As far as -&gt; As long as：条件を表すので as long as。","ja":"用紙を提出しさえすれば、参加できる。"}]},{"id":85,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Without your help, we could not have finished.","ok":true,"note":"正：without + 名詞句。","ja":"あなたの助けがなければ、私たちは終えられなかっただろう。"},{"en":"Without the manager approves it, we cannot proceed.","ok":false,"note":"Without -&gt; Unless：後ろが節なので接続詞。","ja":"部長が承認しない限り、進められない。"},{"en":"With the system was upgraded, errors decreased.","ok":false,"note":"With -&gt; After：後ろが節なので接続詞が必要。","ja":"システムが更新された後、エラーが減少した。"},{"en":"With the new software, processing became faster.","ok":true,"note":"正：with + 名詞句。","ja":"新しいソフトウェアによって、処理が速くなった。"}]},{"id":86,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Whomever submits the form first gets a prize.","ok":false,"note":"Whomever -&gt; Whoever：節内で主語の働きをする。","ja":"最初に用紙を提出した人が賞をもらえる。"},{"en":"Whoever submits the form first will receive a discount.","ok":true,"note":"正：節内で主語なので Whoever。","ja":"最初に用紙を提出した人が割引を受けられる。"},{"en":"Whatever you decide, we will support it.","ok":true,"note":"正：複合関係代名詞 Whatever。","ja":"あなたが何を決めても、私たちは支持します。"},{"en":"However you try hard, the deadline is fixed.","ok":false,"note":"However you try hard -&gt; However hard you try：however の直後に形容詞や副詞を置く。","ja":"どんなに努力しても、締め切りは変わらない。"}]},{"id":87,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The role involves planning, to organize, and reporting.","ok":false,"note":"to organize -&gt; organizing：並列は同じ形に揃える。","ja":"その職務には計画、組織化、報告が含まれる。"},{"en":"She is responsible for hiring and training new staff.","ok":true,"note":"正：動名詞同士の並列。","ja":"彼女は新入社員の採用と研修を担当している。"},{"en":"He is both efficient and works quickly.","ok":false,"note":"works quickly -&gt; quick：both A and B は同じ品詞を並べる。","ja":"彼は効率的で仕事が速い。"},{"en":"The job requires patience, accuracy, and creativity.","ok":true,"note":"正：名詞が三つ並列。","ja":"その仕事には忍耐力、正確さ、創造性が必要だ。"}]},{"id":88,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Please arrive to the airport two hours early.","ok":false,"note":"to -&gt; at：arrive at [in] が正しい。","ja":"2時間前には空港に到着してください。"},{"en":"Our office is on the fifth floor.","ok":true,"note":"正：階数には on。","ja":"当社のオフィスは5階にある。"},{"en":"The conference will be held at the Hilton Hotel.","ok":true,"note":"正：地点を表す at。","ja":"その会議はヒルトンホテルで開催される。"},{"en":"The documents are in the top shelf.","ok":false,"note":"in -&gt; on：棚の上面には on。","ja":"その書類は一番上の棚にある。"}]},{"id":89,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The city where the plant is located is growing.","ok":true,"note":"正：後ろが完全文なので関係副詞。","ja":"その工場がある都市は成長している。"},{"en":"The factory which the products are made is in Osaka.","ok":false,"note":"which -&gt; where：後ろが完全文なので関係副詞。","ja":"製品が作られているその工場は大阪にある。"},{"en":"The situation where we cannot control is difficult.","ok":false,"note":"where -&gt; which：control の目的語が欠けているので関係代名詞。","ja":"私たちが制御できないその状況は厄介だ。"},{"en":"The city which we visited last year is growing.","ok":true,"note":"正：visited の目的語が欠けているので関係代名詞。","ja":"私たちが昨年訪れたその都市は成長している。"}]},{"id":90,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"By the time you arrive, we will have started.","ok":true,"note":"正：by the time + 節。","ja":"あなたが到着するころには、私たちは始めているだろう。"},{"en":"Once the contract is signed, work will begin.","ok":true,"note":"正：once + 節。","ja":"契約が締結され次第、作業が始まる。"},{"en":"Once the signature, the work will begin.","ok":false,"note":"Once -&gt; Upon：後ろが名詞句なので前置詞。","ja":"署名され次第、作業が始まる。"},{"en":"As soon as the confirmation, we will ship the goods.","ok":false,"note":"As soon as -&gt; Upon：後ろが名詞句なので前置詞。","ja":"確認が取れ次第、商品を発送します。"}]},{"id":91,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"She agreed postponing the meeting.","ok":false,"note":"postponing -&gt; to postpone：agree は to 不定詞をとる。","ja":"彼女は会議を延期することに同意した。"},{"en":"The company avoided to make a comment.","ok":false,"note":"to make -&gt; making：avoid は動名詞をとる。","ja":"その会社はコメントを避けた。"},{"en":"We decided to postpone the launch.","ok":true,"note":"正：decide は to 不定詞を目的語にとる。","ja":"私たちは発売を延期することに決めた。"},{"en":"They finished reviewing the contract.","ok":true,"note":"正：finish は動名詞を目的語にとる。","ja":"彼らは契約書の確認を終えた。"}]},{"id":92,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"Remember to lock the door before leaving.","ok":true,"note":"正：これからすることは remember to do。","ja":"出かける前にドアの施錠を忘れないでください。"},{"en":"I regret to inform you that the position is filled.","ok":true,"note":"正：これから伝えることは regret to do。","ja":"残念ながらその職は埋まったことをお伝えします。"},{"en":"Please remember locking the door tomorrow.","ok":false,"note":"locking -&gt; to lock：未来の行為なので to 不定詞。","ja":"明日はドアの施錠を忘れないでください。"},{"en":"We regret informing you that the event is canceled.","ok":false,"note":"informing -&gt; to inform：これから知らせる内容なので to 不定詞。","ja":"残念ながらそのイベントは中止となったことをお伝えします。"}]},{"id":93,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"Having completed the audit, the team submitted the report.","ok":true,"note":"正：完了分詞構文で主語が一致。","ja":"監査を終えて、チームは報告書を提出した。"},{"en":"Located near the station, the hotel is convenient.","ok":true,"note":"正：受動の分詞構文。","ja":"駅の近くに位置しているので、そのホテルは便利だ。"},{"en":"Written in simple English, everyone can read the manual.","ok":false,"note":"Written -&gt; Because it is written：分詞の意味上の主語が主節主語と一致していない。","ja":"平易な英語で書かれているので、誰でもそのマニュアルを読める。"},{"en":"Comparing to last year, sales have doubled.","ok":false,"note":"Comparing -&gt; Compared：比較される側なので過去分詞。","ja":"昨年と比べて、売上は倍増した。"}]},{"id":94,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"If I would have more time, I would revise it.","ok":false,"note":"would have -&gt; had：if 節に would は置かない。","ja":"もっと時間があれば、書き直すのに。"},{"en":"If I had more time, I would revise the proposal.","ok":true,"note":"正：仮定法過去は if 節が過去形。","ja":"もっと時間があれば、その提案書を書き直すのに。"},{"en":"If the machine was faster, we will finish sooner.","ok":false,"note":"will -&gt; would：仮定法過去の主節は would + 原形。","ja":"その機械がもっと速ければ、早く終わるのに。"},{"en":"If the budget were larger, we could hire more staff.","ok":true,"note":"正：仮定法の be 動詞は were。","ja":"予算がもっと多ければ、人員を増やせるのに。"}]},{"id":95,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"If we had left earlier, we would have caught the train.","ok":true,"note":"正：仮定法過去完了。","ja":"もっと早く出ていれば、電車に間に合っただろう。"},{"en":"If we would have left earlier, we would have caught it.","ok":false,"note":"would have left -&gt; had left：if 節は過去完了形。","ja":"もっと早く出ていれば、間に合っただろう。"},{"en":"If she had known, she would intervene at that time.","ok":false,"note":"would intervene -&gt; would have intervened：過去の反実仮想なので完了形。","ja":"彼女が知っていたら、そのとき介入していただろう。"},{"en":"Had the manager known, she would have intervened.","ok":true,"note":"正：if の省略による倒置。","ja":"部長が知っていたら、介入していただろう。"}]},{"id":96,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"The report is more longer than expected.","ok":false,"note":"more longer -&gt; longer：比較級を二重にしない。","ja":"その報告書は予想より長い。"},{"en":"Sales are higher this year as last year.","ok":false,"note":"as -&gt; than：比較級と対応するのは than。","ja":"今年の売上は昨年より高い。"},{"en":"The new office is much larger than the old one.","ok":true,"note":"正：比較級の強調は much。","ja":"新しいオフィスは以前のものよりずっと広い。"},{"en":"This model is more efficient than the previous one.","ok":true,"note":"正：三音節以上は more をつける。","ja":"このモデルは前のモデルより効率的だ。"}]},{"id":97,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"This is the most reliable supplier we have used.","ok":true,"note":"正：最上級 the most + 形容詞。","ja":"これは当社が使った中で最も信頼できる供給業者だ。"},{"en":"She is the best qualified candidate on the list.","ok":true,"note":"正：best が qualified を修飾する最上級。","ja":"彼女は名簿の中で最も適格な候補者だ。"},{"en":"This is the most cheapest option available.","ok":false,"note":"most cheapest -&gt; cheapest：最上級を二重にしない。","ja":"これは入手できる中で最も安い選択肢だ。"},{"en":"Of the three plans, this one is the better.","ok":false,"note":"better -&gt; best：三つ以上の比較は最上級。","ja":"3つの案のうち、これが最良だ。"}]},{"id":98,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"He works as harder as his colleagues.","ok":false,"note":"as harder as -&gt; as hard as：原級で挟む。","ja":"彼は同僚と同じくらい熱心に働く。"},{"en":"The device is as more efficient as the previous model.","ok":false,"note":"as more efficient as -&gt; as efficient as：as ... as の間は原級。","ja":"その装置は前のモデルと同じくらい効率的だ。"},{"en":"The new printer is as fast as the old one.","ok":true,"note":"正：as + 原級 + as。","ja":"新しいプリンターは古いものと同じくらい速い。"},{"en":"Please respond as soon as possible.","ok":true,"note":"正：as ... as possible の定型。","ja":"できるだけ早くご返信ください。"}]},{"id":99,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"She went to the warehouse to check the inventory.","ok":true,"note":"正：目的を表す副詞用法。","ja":"彼女は在庫を確認しに倉庫へ行った。"},{"en":"We have a lot of work to do this week.","ok":true,"note":"正：不定詞の形容詞用法。","ja":"今週はやるべき仕事がたくさんある。"},{"en":"The manager is too busy to attending the meeting.","ok":false,"note":"attending -&gt; attend：too ... to do は原形。","ja":"部長は忙しすぎて会議に出られない。"},{"en":"The instructions are enough clear to follow.","ok":false,"note":"enough clear -&gt; clear enough：enough は形容詞の後ろ。","ja":"その指示は理解できるほど十分に明確だ。"}]},{"id":100,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"This model is very cheaper than that one.","ok":false,"note":"very -&gt; much：比較級の強調に very は使えない。","ja":"このモデルはあちらよりずっと安い。"},{"en":"The new plant produces twice as many units as the old one.","ok":true,"note":"正：倍数 + as ... as。","ja":"新しい工場は旧工場の2倍の台数を生産する。"},{"en":"Revenue is three times higher than last year.","ok":true,"note":"正：倍数 + 比較級 + than。","ja":"収益は昨年の3倍だ。"},{"en":"The room is twice as larger as the other.","ok":false,"note":"as larger as -&gt; as large as：as ... as の間は原級。","ja":"その部屋はもう一方の2倍の広さだ。"}]},{"id":101,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"We appreciate your attending the ceremony.","ok":true,"note":"正：動名詞の意味上の主語は所有格。","ja":"式典へのご出席に感謝いたします。"},{"en":"We appreciate you to attend the ceremony.","ok":false,"note":"to attend -&gt; attending：appreciate は動名詞をとる。","ja":"式典へのご出席に感謝いたします。"},{"en":"He admitted to make an error.","ok":false,"note":"to make -&gt; making：admit は動名詞をとる。","ja":"彼はミスをしたことを認めた。"},{"en":"She denied having seen the document.","ok":true,"note":"正：完了動名詞で主節より前の内容。","ja":"彼女はその書類を見たことを否定した。"}]},{"id":102,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"It is important to submit the form on time.","ok":true,"note":"正：形式主語 It + to 不定詞。","ja":"期限どおりに用紙を提出することが重要だ。"},{"en":"It was kind of you to help us.","ok":true,"note":"正：人の性質を表す形容詞は of + 人。","ja":"手伝ってくださって親切でした。"},{"en":"It is important of the manager to be informed.","ok":false,"note":"of -&gt; for：性質を表さない形容詞では for + 人。","ja":"部長に知らせておくことが重要だ。"},{"en":"To submitting the form early is recommended.","ok":false,"note":"To submitting -&gt; Submitting：to の後ろは原形。","ja":"早めに用紙を提出することが推奨される。"}]},{"id":103,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"She was heard to complaining about the noise.","ok":false,"note":"to complaining -&gt; complain：to 不定詞なら原形にする。","ja":"彼女が騒音について不平を言うのが聞こえた。"},{"en":"The staff were made to work overtime.","ok":true,"note":"正：使役の受動態では to 不定詞が現れる。","ja":"スタッフは残業させられた。"},{"en":"The staff were made work overtime.","ok":false,"note":"work -&gt; to work：受動態では to が必要。","ja":"スタッフは残業させられた。"},{"en":"He was seen entering the building.","ok":true,"note":"正：知覚動詞の受動態 + 現在分詞。","ja":"彼が建物に入るのが目撃された。"}]},{"id":104,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"The employees attending the seminar must register.","ok":true,"note":"正：能動関係の現在分詞。","ja":"そのセミナーに出席する従業員は登録が必要だ。"},{"en":"The documents attached to the email are confidential.","ok":true,"note":"正：受動の意味なので過去分詞。","ja":"メールに添付された書類は機密です。"},{"en":"The man interviewing the candidates is our director.","ok":true,"note":"正：能動の意味なので現在分詞。","ja":"候補者の面接をしている男性が当社の役員だ。"},{"en":"The results announcing yesterday were positive.","ok":false,"note":"announcing -&gt; announced：results は発表される側。","ja":"昨日発表された結果は良好だった。"}]},{"id":105,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"I wish I have more time yesterday.","ok":false,"note":"have -&gt; had had：過去についての願望は過去完了。","ja":"昨日もっと時間があればよかったのに。"},{"en":"I wish I had more experience in marketing.","ok":true,"note":"正：現在の願望は wish + 過去形。","ja":"マーケティングの経験がもっとあればよいのに。"},{"en":"He talks as if he were the manager.","ok":true,"note":"正：as if + 仮定法過去。","ja":"彼はまるで自分が部長であるかのように話す。"},{"en":"He speaks as if he was knowing the answer.","ok":false,"note":"was knowing -&gt; knew：状態動詞は進行形にしない。","ja":"彼はまるで答えを知っているかのように話す。"}]},{"id":106,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"More we practice, the better we become.","ok":false,"note":"More -&gt; The more：前半にも the が必要。","ja":"練習すればするほど、上達する。"},{"en":"The sooner we start, the earlier we finish.","ok":true,"note":"正：the + 比較級, the + 比較級。","ja":"早く始めるほど、早く終わる。"},{"en":"The more sooner we start, the better.","ok":false,"note":"more sooner -&gt; sooner：比較級を重ねない。","ja":"早く始めるほどよい。"},{"en":"The more you practice, the better you become.","ok":true,"note":"正：比例を表す構文。","ja":"練習すればするほど、上達する。"}]},{"id":107,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"He seems to have forgotten the appointment.","ok":true,"note":"正：主節より前の内容は完了不定詞。","ja":"彼は約束を忘れてしまったようだ。"},{"en":"He seems to forget the appointment yesterday.","ok":false,"note":"to forget -&gt; to have forgotten：yesterday なので完了不定詞。","ja":"彼は昨日の約束を忘れていたようだ。"},{"en":"She decided not to renew the contract.","ok":true,"note":"正：不定詞の否定は not + to do。","ja":"彼女は契約を更新しないことに決めた。"},{"en":"She decided to not renewing the contract.","ok":false,"note":"to not renewing -&gt; not to renew：否定語は to の前、後ろは原形。","ja":"彼女は契約を更新しないことに決めた。"}]},{"id":108,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"He suggested to change the schedule.","ok":false,"note":"to change -&gt; changing：suggest は動名詞をとる。","ja":"彼は予定の変更を提案した。"},{"en":"We recommend to book the room in advance.","ok":false,"note":"to book -&gt; booking：recommend は動名詞をとる。","ja":"事前に部屋を予約されることをお勧めします。"},{"en":"The company considered relocating its headquarters.","ok":true,"note":"正：consider は動名詞をとる。","ja":"同社は本社の移転を検討した。"},{"en":"They postponed announcing the results.","ok":true,"note":"正：postpone は動名詞をとる。","ja":"彼らは結果の発表を延期した。"}]},{"id":109,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"This branch is larger than any other branch in the region.","ok":true,"note":"正：自分以外と比べるので any other。","ja":"この支店は地域内の他のどの支店よりも大きい。"},{"en":"No other model sells better than this one.","ok":true,"note":"正：no other + 単数名詞。","ja":"このモデルより売れているモデルはない。"},{"en":"This branch is larger tha "},{"en":"Please answer to my question.","ok":false,"note":"answer to -&gt; answer：answer は他動詞。","ja":"私の質問に答えてください。"},{"en":"She entered the conference room quietly.","ok":true,"note":"正：enter は他動詞。","ja":"彼女は静かに会議室へ入った。"}]},{"id":192,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"She was aware of the policy had changed.","ok":false,"note":"of -&gt; that：節を導くには that が必要。","ja":"彼女は方針が変更されたことを知っていた。"},{"en":"She was aware that the policy had changed.","ok":true,"note":"正：aware + that 節。","ja":"彼女は方針が変更されたことを知っていた。"},{"en":"We are confident of the project will succeed.","ok":false,"note":"of -&gt; that：後ろが節なので that。","ja":"私たちはそのプロジェクトが成功すると確信している。"},{"en":"We are confident that the project will succeed.","ok":true,"note":"正：形容詞 + that 節。","ja":"私たちはそのプロジェクトが成功すると確信している。"}]},{"id":193,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"The manager as well as the assistants were informed.","ok":false,"note":"were -&gt; was：主語は The manager（単数）。","ja":"助手たちだけでなく部長にも知らされていた。"},{"en":"The role requires not only accuracy but also to work fast.","ok":false,"note":"to work fast -&gt; speed：並列は同じ品詞に揃える。","ja":"その職務には正確さだけでなく速さも求められる。"},{"en":"The manager as well as the assistants was informed.","ok":true,"note":"正：A as well as B では A に動詞を合わせる。","ja":"助手たちだけでなく部長にも知らされていた。"},{"en":"The role requires not only accuracy but also speed.","ok":true,"note":"正：not only A but also B は同じ品詞。","ja":"その職務には正確さだけでなく速さも求められる。"}]},{"id":194,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"We got the technician repair the printer.","ok":false,"note":"repair -&gt; to repair：get は to 不定詞をとる。","ja":"私たちは技術者にプリンターを修理してもらった。"},{"en":"She helped to us prepare the presentation.","ok":false,"note":"helped to us -&gt; helped us：help の目的語に to は不要。","ja":"彼女は私たちがプレゼンの準備をするのを手伝ってくれた。"},{"en":"She helped us prepare the presentation.","ok":true,"note":"正：help + 目的語 + 原形不定詞。","ja":"彼女は私たちがプレゼンの準備をするのを手伝ってくれた。"},{"en":"We got the technician to repair the printer.","ok":true,"note":"正：get const FOCUS = [{"id":1,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"Ms. Tanaka provided <u class=\"blank\">＿＿＿</u> information about the new safety regulations at yesterday&#x27;s briefing.","o":["many","a great deal of","several","a few"],"a":1,"e":"<b>information</b> は不可算。many / several / a few はすべて可算複数専用なので即消去できる。a great deal of は不可算専用の数量詞。"},{"id":2,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"Because of the merger, the accounting department now handles <u class=\"blank\">＿＿＿</u> paperwork than before.","o":["fewer","less","few","many"],"a":1,"e":"<b>paperwork</b> は不可算なので比較級は <code>less</code>。fewer は可算複数（fewer documents）に対応する。この fewer/less の対比は Part 5 頻出。"},{"id":3,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"<u class=\"blank\">＿＿＿</u> employees have requested a transfer to the Singapore office this quarter.","o":["Much","A great deal of","Fewer","A large amount of"],"a":2,"e":"<b>employees</b> は可算複数。much / a great deal of / a large amount of はいずれも不可算専用。可算複数に使えるのは fewer。"},{"id":4,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"The technician said there was <u class=\"blank\">＿＿＿</u> equipment left in the storage room.","o":["a few","many","little","several"],"a":2,"e":"<b>equipment</b> は不可算。「ほとんど残っていない」は <code>little</code>。a few / several / many は可算複数専用。"},{"id":5,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"We have received <u class=\"blank\">＿＿＿</u> feedback from customers since the redesign of our website.","o":["numerous","a number of","a great deal of","several"],"a":2,"e":"<b>feedback</b> は不可算。a number of / numerous / several は可算複数を取る。"},{"id":6,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"<u class=\"blank\">＿＿＿</u> of the furniture in the lobby was damaged during the renovation.","o":["Many","Few","Much","Several"],"a":2,"e":"<b>furniture</b> は不可算。動詞が <code>was</code>（単数）である点も手がかりになる。"},{"id":7,"part":1,"cat":"数量詞の選択","sub":"不可算名詞" const PARTS = m => [...new Set(MODES[m].data.map(q => q.part))].sort((a,b) => a-b);

/* ---- 保存領域 ---- */
const Store = (() => {
  const mem = {};
  const hasW = typeof window.storage !== 'undefined' && window.storage;
  return {
    async load(key, fallback){
      try{
        if(hasW){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
        const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback;
      }catch(e){ return (key in mem) ? mem[key] : fallback; }
    },
    async save(key, obj){
      mem[key] = obj;
      try{
        if(hasW){ await window.storage.set(key, JSON.stringify(obj)); return; }
        localStorage.setItem(key, JSON.stringify(obj));
      }catch(e){}
    }
  };
})();
const KEY_MARKS = 'toeic_sa_drill_v1';
const KEY_POS   = 'toeic_sa_drill_pos';

/* ---- 状態 ---- */
let marks = {};                 // { "read:12":"done", "gram:5":"again" }
let mode = 'read';
const NATURAL  = {};
const order    = {};
const shuffled = {};
const filterOf = {};
for(const k of Object.keys(MODES)){
  NATURAL[k]  = MODES[k].data.map(q => q.id);
  order[k]    = NATURAL[k].slice();
  shuffled[k] = false;
  filterOf[k] = 'all';
}
let cursor = 0, revealed = false, view = 'start';
let sel = [];                    // 現在の問題で選んだ選択肢（添字）

const $ = s => document.querySelector(s);
const cur = () => MODES[mode];
const byId = id => cur().data.find(q => q.id === id);
const mk = (m, id) => m + ':' + id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function visible(){
  const f = filterOf[mode];
  return order[mode].filter(id => {
    const q = byId(id);
    if(f === 'all') return true;
    if(f === 'again') return marks[mk(mode, id)] === 'again';
    return String(q.part) === f;
  });
}
function counts(m){
  const total = MODES[m].data.length;
  let done = 0, again = 0;
  for(const id of NATURAL[m]){
    const v = marks[mk(m, id)];
    if(v === 'done') done++; else if(v === 'again') again++;
  }
  return { total, done, again, todo: total - done - again };
}
async function savePos(){
  const vis = visible();
  await Store.save(KEY_POS, { mode, filter: filterOf[mode], id: vis[cursor] || null });
}

/* ================= 上部バー ================= */
function renderBar(){
  const bar = $('#appbar');
  if(view === 'start'){ bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  if(view === 'menu'){
    bar.innerHTML = '<button class="barbtn" id="back">← 問題に戻る</button>'
                  + '<span class="barttl">' + cur().label + '　メニュー</span>';
    $('#back').onclick = () => { view = 'drill'; render(); };
  }else{
    const vis = visible();
    bar.innerHTML = '<button class="barbtn" id="toStart">← ホーム</button>'
                  + '<button class="barbtn" id="toMenu">≡ 問題一覧</button>'
                  + '<span class="barttl">' + cur().label + '　'
                  + (vis.length ? (cursor + 1) + ' / ' + vis.length : '0 / 0') + '</span>';
    $('#toStart').onclick = () => { view = 'start'; render(); };
    $('#toMenu').onclick  = () => { view = 'menu'; render(); };
  }
}

/* ================= スタート画面 ================= */
function renderStart(){
  const c = counts(mode);
  const pDone  = (c.done  / c.total * 100).toFixed(2);
  const pAgain = (c.again / c.total * 100).toFixed(2);
  const deco = [0,1,2,3,4,5,6,7,8].map(i => '<i class="' + (i % 4 === 0 ? 'f' : '') + '"></i>').join('');
  const modeBtns = Object.values(MODES).map(m => {
    const mc = counts(m.key);
    return '<button class="modebtn" data-m="' + m.key + '" aria-pressed="' + (m.key === mode) + '">'
         + '<b>' + m.label + 'モード</b><span>' + m.sub + '</span></button>';
  }).join('');

  $('#main').innerHTML = `
  <section class="start">
    <div class="mark">${deco}</div>
    <h1>TOEIC Drill</h1>
    <p class="lead">${cur().desc}</p>

    <div class="modesel">${modeBtns}</div>

    <div class="bar">
      <span class="b-done" style="width:${pDone}%"></span>
      <span class="b-again" style="width:${pAgain}%"></span>
    </div>
    <div class="legend">
      <span>覚えた <b>${c.done}</b></span>
      <span>要復習 <b>${c.again}</b></span>
      <span>未着手 <b>${c.todo}</b></span>
    </div>

    <div class="startbtns">
      <button class="big" id="resume">${c.done + c.again ? '続きから始める' : '学習を始める'}</button>
      ${c.again ? '<button class="big warn" id="doAgain">要復習だけ解く（' + c.again + '問）</button>' : ''}
      <button class="big alt" id="fromTop">最初から解く</button>
      <button class="big alt" id="openMenu">問題一覧・設定</button>
    </div>

    <p class="startnote">
      画面を左右にスワイプすると前後の問題に移動できます。<br>
      学習記録はモードごとに、この端末に保存されます。
    </p>
  </section>`;

  document.querySelectorAll('.modebtn').forEach(b => {
    b.onclick = () => { mode = b.dataset.m; cursor = 0; revealed = false; render(); };
  });
  $('#resume').onclick = async () => {
    const pos = await Store.load(KEY_POS, null);
    if(pos && pos.mode === mode && pos.filter) filterOf[mode] = pos.filter;
    const vis = visible();
    const i = (pos && pos.mode === mode && pos.id != null) ? vis.indexOf(pos.id) : -1;
    cursor = i >= 0 ? i : 0;
    revealed = false; view = 'drill'; render();
  };
  const ag = $('#doAgain');
  if(ag) ag.onclick = () => { filterOf[mode] = 'again'; cursor = 0; revealed = false; view = 'drill'; render(); };
  $('#fromTop').onclick = () => { filterOf[mode] = 'all'; cursor = 0; revealed = false; view = 'drill'; render(); };
  $('#openMenu').onclick = () => { view = 'menu'; render(); };
}

/* ================= メニュー ================= */
function renderMenu(){
  const c = counts(mode);
  const vis = visible();
  const here = vis[cursor];
  const parts = PARTS(mode);

  let groups = '';
  for(const p of parts){
    const ids = NATURAL[mode].filter(id => byId(id).part === p);
    if(!ids.length) continue;
    const cats = [...new Set(ids.map(id => byId(id).cat).filter(Boolean))];
    groups += '<div class="volgroup"><span class="vlab">第' + p + 'パート &nbsp;Q'
            + ids[0] + '–Q' + ids[ids.length - 1]
            + (cats.length ? ' &nbsp;<em>' + esc(cats.join(' / ')) + '</em>' : '')
            + '</span><div class="bubbles">'
            + ids.map(id => {
                const m = marks[mk(mode, id)] ? ' ' + marks[mk(mode, id)] : '';
                const h = id === here ? ' here' : '';
                return '<button class="bub' + m + h + '" data-id="' + id + '" title="'
                     + esc(byId(id).theme) + '">' + id + '</button>';
              }).join('')
            + '</div></div>';
  }

  $('#main').innerHTML = `
  <section class="sect">
    <h2>モード</h2>
    <div class="seg" id="modeseg">
      ${Object.values(MODES).map(m =>
        '<button data-m="' + m.key + '" aria-pressed="' + (m.key === mode) + '">'
        + m.label + '（' + counts(m.key).total + '問）</button>').join('')}
    </div>
  </section>

  <section class="sect">
    <h2>問題一覧</h2>
    <div class="sheet-note">
      <span>■ 覚えた ${c.done} ／ ▨ 要復習 ${c.again} ／ ○ 未着手 ${c.todo}</span>
      <span>番号をタップでその問題へ</span>
    </div>
    ${groups}
  </section>

  <section class="sect">
    <h2>出題範囲</h2>
    <div class="seg" id="filter">
      <button data-f="all">全${c.total}問</button>
      ${parts.map(p => '<button data-f="' + p + '">第' + p + 'パート</button>').join('')}
      <button data-f="again">要復習</button>
    </div>
  </section>

  <section class="sect">
    <h2>出題順</h2>
    <div class="row">
      <button class="ghost${shuffled[mode] ? '' : ' on'}" id="natural">番号順</button>
      <button class="ghost${shuffled[mode] ? ' on' : ''}" id="shuffle">シャッフル</button>
    </div>
  </section>

  <section class="sect">
    <h2>学習記録</h2>
    <div class="row">
      <button class="ghost" id="export">記録を書き出す</button>
      <button class="ghost" id="import">記録を読み込む</button>
      <button class="ghost" id="reset">このモードの記録を消す</button>
    </div>
  </section>

  <footer>
    読解演習：TOEIC Service List 1.2 (Browne &amp; Culligan, 2016) /
    New General Service List 1.2 (Browne, Culligan &amp; Phillips, 2013)、ともに CC BY-SA 4.0。<br>
    記録はこの端末にのみ保存され、外部には送信されません。機種変更の前に書き出しておいてください。
  </footer>`;

  document.querySelectorAll('#modeseg button').forEach(b => {
    b.onclick = () => { mode = b.dataset.m; cursor = 0; revealed = false; render(); };
  });
  document.querySelectorAll('.bub').forEach(b => {
    b.onclick = () => {
      const id = Number(b.dataset.id);
      let i = visible().indexOf(id);
      if(i < 0){ filterOf[mode] = 'all'; i = visible().indexOf(id); }
      cursor = Math.max(0, i); revealed = false; sel = []; view = 'drill'; render(); savePos();
    };
  });
  document.querySelectorAll('#filter button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.f === filterOf[mode]));
    b.onclick = () => { filterOf[mode] = b.dataset.f; cursor = 0; revealed = false; render(); savePos(); };
  });
  $('#natural').onclick = () => {
    if(!shuffled[mode]) return;
    const keep = visible()[cursor];
    order[mode] = NATURAL[mode].slice(); shuffled[mode] = false;
    const i = visible().indexOf(keep); cursor = i >= 0 ? i : 0;
    render();
  };
  $('#shuffle').onclick = () => {
    const keep = visible()[cursor];
    const a = order[mode];
    for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
    shuffled[mode] = true;
    const i = visible().indexOf(keep); cursor = i >= 0 ? i : 0;
    render();
  };
  $('#export').onclick = () => {
    const blob = new Blob([JSON.stringify({version:2, savedAt:new Date().toISOString(), marks}, null, 1)],
                          {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'toeic_drill_progress_' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $('#import').onclick = () => $('#importFile').click();
  $('#reset').onclick = async () => {
    if(!confirm(cur().label + 'モードの記録をすべて消します。よろしいですか？')) return;
    for(const id of NATURAL[mode]) delete marks[mk(mode, id)];
    await Store.save(KEY_MARKS, marks);
    cursor = 0; revealed = false; render();
  };
}

/* ================= 問題カード ================= */
function cardRead(q){
  const words = q.words.map(w => `
    <li>
      <div class="whead">
        <span class="wen">${w.w}</span>
        <span class="wjp">${w.jp}</span>
        <span class="chip ${w.tier}">${w.tier} · ${w.ref}</span>
      </div>
      <p class="wnote">${w.note_html}</p>
    </li>`).join('');
  return {
    body: `<p class="sentence">${q.html}</p>
           <p class="hint">太字の語の意味と使い方を言えるか確認してから、解答を開いてください。</p>`,
    reveal: `<ul class="wlist">${words}</ul>
             <p class="trans"><b>全文訳</b>${q.translation}</p>`
  };
}

function cardGram(q){
  const LTR = ['A','B','C','D'];
  const nOK = q.items.filter(i => i.ok).length;
  const hit = sel.length === nOK && sel.every(i => q.items[i].ok);
  const list = q.items.map((it, i) => `
    <li class="gitem ${it.ok ? 'y' : 'n'}${sel.includes(i) ? ' sel' : ''}"
        data-i="${i}" ${revealed ? '' : 'role="button" tabindex="0"'}>
      <div class="ghead">
        <span class="gltr">${LTR[i]}</span>
        <p class="gen">${it.en}</p>
        <span class="badge ${it.ok ? 'y' : 'n'}">${it.ok ? '正しい' : '誤り'}</span>
        ${sel.includes(i) ? '<span class="badge pick">選んだ</span>' : ''}
      </div>
      <div class="gfb">
        <p class="gja">${it.ja}</p>
        <p class="gnote">${it.note}</p>
      </div>
    </li>`).join('');
  return {
    body: `<p class="split">正しい記述：${nOK} ／ 誤った記述：${q.items.length - nOK}</p>
           <p class="verdict ${hit ? 'hit' : 'miss'}">${sel.length ? (hit ? '正解' : '不正解') : '選択なしで解答を表示'}</p>
           <ul class="glist">${list}</ul>
           <p class="hint">正しい記述を${nOK}つ選ぶと解答が開きます。</p>`,
    reveal: ''
  };
}

function cardFocus(q){
  const LTR = ['A','B','C','D'];
  const picked = sel.length ? sel[0] : -1;
  const hit = picked === q.a;
  const list = q.o.map((o, i) => `
    <li class="gitem ${i === q.a ? 'y' : 'n'}${i === picked ? ' sel' : ''}"
        data-i="${i}" ${revealed ? '' : 'role="button" tabindex="0"'}>
      <div class="ghead">
        <span class="gltr">${LTR[i]}</span>
        <p class="gen">${o}</p>
        <span class="badge ${i === q.a ? 'y' : 'n'}">${i === q.a ? '正解' : '誤り'}</span>
        ${i === picked ? '<span class="badge pick">選んだ</span>' : ''}
      </div>
    </li>`).join('');
  return {
    body: `<p class="qsent">${q.q}</p>
           <p class="verdict ${hit ? 'hit' : 'miss'}">${picked >= 0 ? (hit ? '正解' : '不正解') : '選択なしで解答を表示'}</p>
           <ul class="glist">${list}</ul>
           <p class="hint">選択肢をタップすると解答が開きます。</p>`,
    reveal: `<p class="exp"><span>解説</span>${q.e}</p>`
  };
}

function renderDrill(){
  const vis = visible();
  const main = $('#main');
  if(!vis.length){
    main.innerHTML = '<div class="empty">該当する問題がありません。<br>「要復習」に印を付けた問題がここに集まります。</div>';
    return;
  }
  if(cursor >= vis.length) cursor = vis.length - 1;
  const q = byId(vis[cursor]);
  const c = mode === 'read' ? cardRead(q) : (mode === 'gram' ? cardGram(q) : cardFocus(q));
  const noBorder = mode === 'gram';

  main.innerHTML = `
  <article class="card${revealed ? ' open' : ''}" id="card">
    <div class="eyebrow">
      <span>Q${q.id}</span><span>Part ${q.part}</span><span class="theme">${esc(q.theme)}</span>
    </div>
    ${c.body}

    <div class="actions">
      <button class="btn${revealed ? ' shut' : ''}" id="toggle">${revealed ? '解答を閉じる' : '解答を見る'}</button>
    </div>

    <div class="reveal" id="rev" ${revealed ? '' : 'hidden'} ${noBorder ? 'style="border:0;margin:0;padding:0"' : ''}>
      ${c.reveal}
      <div class="actions">
        <button class="btn ok" id="mDone">覚えた</button>
        <button class="btn again" id="mAgain">要復習</button>
      </div>
    </div>

    <div class="nav">
      <button id="prev" ${cursor === 0 ? 'disabled' : ''}>← 前の問題</button>
      <button id="next" ${cursor === vis.length - 1 ? 'disabled' : ''}>次の問題 →</button>
    </div>
  </article>
  <p class="swipehint">左右にスワイプしても移動できます</p>`;

  $('#toggle').onclick = () => {
    revealed = !revealed;
    const t = $('#toggle');
    $('#rev').hidden = !revealed;
    $('#card').classList.toggle('open', revealed);
    t.textContent = revealed ? '解答を閉じる' : '解答を見る';
    t.classList.toggle('shut', revealed);
    if(!revealed) $('#card').scrollIntoView({block:'start', behavior:'smooth'});
  };
  $('#prev').onclick  = () => go(-1);
  $('#next').onclick  = () => go(1);
  $('#mDone').onclick = () => mark(q.id, 'done');
  $('#mAgain').onclick= () => mark(q.id, 'again');

  if(!revealed && mode !== 'read'){
    const nOK = mode === 'gram' ? q.items.filter(i => i.ok).length : 1;
    document.querySelectorAll('.gitem[role="button"]').forEach(li => {
      const pick = () => {
        const i = Number(li.dataset.i);
        if(mode === 'focus'){
          sel = [i];
        }else{
          const s = new Set(sel);
          s.has(i) ? s.delete(i) : s.add(i);
          sel = [...s].sort((a, b) => a - b);
        }
        if(sel.length >= nOK) revealed = true;      // 必要数を選んだ時点で解答を開く
        const y = window.scrollY;
        render();
        window.scrollTo({top:y});
      };
      li.onclick = pick;
      li.onkeydown = ev => { if(ev.key === ' ' || ev.key === 'Enter'){ ev.preventDefault(); pick(); } };
    });
  }
}

function go(delta){
  const vis = visible();
  const n = cursor + delta;
  if(n < 0 || n >= vis.length) return;
  cursor = n; revealed = false; sel = []; render(); savePos();
  window.scrollTo({top:0});
}

async function mark(id, v){
  marks[mk(mode, id)] = v;
  await Store.save(KEY_MARKS, marks);
  const vis = visible();
  const i = vis.indexOf(id);
  if(i >= 0 && i < vis.length - 1) cursor = i + 1;
  else if(filterOf[mode] === 'again') cursor = 0;
  revealed = false; sel = []; render(); savePos();
  window.scrollTo({top:0});
}

function render(){
  renderBar();
  if(view === 'start') renderStart();
  else if(view === 'menu') renderMenu();
  else renderDrill();
}

/* ================= スワイプ ================= */
(function(){
  let x0 = null, y0 = null, dx = 0, locked = null;
  const main = document.getElementById('main');
  main.addEventListener('touchstart', e => {
    if(view !== 'drill' || e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; locked = null;
  }, {passive:true});
  main.addEventListener('touchmove', e => {
    if(x0 === null) return;
    const t = e.touches[0], ax = t.clientX - x0, ay = t.clientY - y0;
    if(locked === null && (Math.abs(ax) > 8 || Math.abs(ay) > 8)) locked = Math.abs(ax) > Math.abs(ay) ? 'x' : 'y';
    if(locked !== 'x') return;
    dx = ax;
    const card = document.getElementById('card');
    if(card){ card.classList.add('swiping'); card.style.transform = 'translateX(' + (dx * .3) + 'px)'; }
  }, {passive:true});
  main.addEventListener('touchend', () => {
    const card = document.getElementById('card');
    if(card){ card.classList.remove('swiping'); card.style.transform = ''; }
    if(locked === 'x' && Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
    x0 = y0 = null; dx = 0; locked = null;
  }, {passive:true});
})();

/* ================= 記録の読み込み ================= */
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    const incoming = obj && obj.marks ? obj.marks : obj;
    if(typeof incoming !== 'object' || incoming === null) throw new Error('形式が不正です');
    const valid = {};
    for(const [k, v] of Object.entries(incoming)){
      if(v !== 'done' && v !== 'again') continue;
      const key = /^\d+$/.test(k) ? mk('read', k) : k;       // 旧形式（数値キー）は読解として扱う
      const [m, idStr] = key.split(':');
      if(MODES[m] && MODES[m].data.some(q => String(q.id) === idStr)) valid[key] = v;
    }
    marks = valid;
    await Store.save(KEY_MARKS, marks);
    cursor = 0; revealed = false; render();
    alert('学習記録を読み込みました（' + Object.keys(valid).length + '問）。');
  }catch(err){
    alert('読み込めませんでした：' + err.message);
  }finally{ e.target.value = ''; }
};

/* ================= キーボード ================= */
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(view !== 'drill') return;
  if(e.key === 'ArrowLeft')  go(-1);
  if(e.key === 'ArrowRight') go(1);
  if(e.key === ' '){ e.preventDefault(); const t = $('#toggle'); if(t) t.click(); }
  if(e.key === 'Escape'){ view = 'menu'; render(); }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(async () => {
  const raw = await Store.load(KEY_MARKS, {}) || {};
  // 旧形式（数値キー＝読解モード）を新形式へ移行
  let migrated = false;
  for(const [k, v] of Object.entries(raw)){
    if(/^\d+$/.test(k)){ raw[mk('read', k)] = v; delete raw[k]; migrated = true; }
  }
  marks = raw;
  if(migrated) await Store.save(KEY_MARKS, marks);
  const pos = await Store.load(KEY_POS, null);
  if(pos && MODES[pos.mode]) mode = pos.mode;
  view = 'start';
  render();
})();
</script>
</body>
