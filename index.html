<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC Drill — 読解演習 / 文法演習</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOEIC Drill">
<meta name="theme-color" content="#0E1218">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --paper:#0E1218;
  --paper-2:#161B24;
  --ink:#E4EAF3;
  --graphite:#C3CAD6;
  --graphite-soft:#828B9C;
  --dropout:#2E5462;
  --dropout-deep:#7CCADC;
  --gold:#CBB991;
  --rule:#28303E;
  --ok:#4C9E78;
  --ng:#D2796B;
  --again:#CE9257;
  --code-bg:#1E2632;
  --trans-bg:#1A212C;
  --again-hatch:#5A4531;
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,var(--jp);
  --book:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--graphite);font-family:var(--ui);
  line-height:1.75;-webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
.wrap{max-width:760px;margin:0 auto;
  padding:0 calc(20px + env(safe-area-inset-right)) calc(64px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
.file-hidden{display:none}
button{font-family:inherit}

.appbar{display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 0 12px;
  border-bottom:1px solid var(--rule);margin-bottom:20px}
.appbar[hidden]{display:none}
.barbtn{font:600 13px/1 var(--ui);background:none;border:0;color:var(--graphite-soft);
  cursor:pointer;padding:8px 4px}
.barbtn:hover{color:var(--gold)}
.barttl{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;color:var(--graphite-soft);
  text-transform:uppercase;margin-left:auto}

/* ---------- スタート画面 ---------- */
.start{padding:calc(30px + env(safe-area-inset-top)) 0 0;text-align:center}
.mark{width:78px;height:78px;margin:0 auto 22px;display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;place-items:center}
.mark i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--gold);display:block;opacity:.5}
.mark i.f{background:var(--gold);border-color:var(--gold);opacity:1}
.start h1{font-family:var(--mono);font-size:17px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);margin:0 0 8px}
.start .lead{font-size:13px;color:var(--graphite-soft);margin:0 0 18px}
.cd{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--graphite-soft);
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:9px 4px;margin:0 0 24px;min-height:40px}
.cd b{font-size:19px;color:var(--gold);font-weight:700;padding:0 3px;letter-spacing:0}
.cd .d{opacity:.65}
.cd .past{color:var(--again)}
.cd button{background:none;border:0;color:var(--dropout-deep);font:inherit;cursor:pointer;
  padding:3px 2px;text-decoration:underline;text-underline-offset:2px}
.cd button:hover{color:var(--gold)}
.cd input{font:inherit;font-size:12px;background:var(--paper-2);color:var(--graphite);
  border:1px solid var(--rule);border-radius:3px;padding:5px 7px;color-scheme:dark}
.modesel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:400px;margin:0 auto 26px}
.modebtn{background:transparent;border:1px solid var(--rule);border-radius:4px;
  padding:14px 10px;cursor:pointer;color:var(--graphite-soft);text-align:center;transition:.15s}
.modebtn b{display:block;font:700 14px/1.4 var(--ui);color:var(--graphite)}
.modebtn span{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.modebtn[aria-pressed="true"]{border-color:var(--gold);background:rgba(203,185,145,.07)}
.modebtn[aria-pressed="true"] b{color:var(--gold)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--rule);margin:0 0 10px}
.bar span{display:block;height:100%}
.bar .b-done{background:var(--gold)}
.bar .b-again{background:var(--again)}
.legend{display:flex;justify-content:center;gap:16px;font-family:var(--mono);font-size:11px;
  color:var(--graphite-soft);letter-spacing:.05em;margin-bottom:28px;flex-wrap:wrap}
.legend b{color:var(--ink);font-weight:700}
.startbtns{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}
.big{font:700 15px/1 var(--ui);padding:16px 20px;border-radius:3px;border:1.5px solid var(--gold);
  background:var(--gold);color:var(--paper);cursor:pointer}
.big.alt{background:transparent;color:var(--gold)}
.big.warn{border-color:var(--again);color:var(--again);background:transparent}
.big:hover{opacity:.88}
.startnote{font-size:11.5px;color:var(--graphite-soft);margin-top:26px;line-height:1.9}

/* ---------- メニュー ---------- */
.sect{margin-bottom:30px}
.sect h2{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dropout-deep);margin:0 0 12px;font-weight:700}
.sheet-note{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;
  color:var(--graphite-soft);margin-bottom:10px;flex-wrap:wrap;gap:8px}
.bubbles{display:flex;flex-wrap:wrap;gap:6px}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--dropout);
  background:var(--paper-2);font-family:var(--mono);font-size:11px;color:var(--dropout-deep);
  display:grid;place-items:center;cursor:pointer;padding:0;transition:.18s}
.bub:hover{border-color:var(--dropout-deep)}
.bub.done{background:var(--gold);border-color:var(--gold);color:var(--paper)}
.bub.again{background:repeating-linear-gradient(45deg,var(--paper-2) 0 3px,var(--again-hatch) 3px 6px);
  border-color:var(--again);color:var(--again)}
.bub.here{outline:2px solid var(--gold);outline-offset:2px}
.bub:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.volgroup{margin-bottom:16px}
.volgroup .vlab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--graphite-soft);
  margin-bottom:6px;display:block}
.volgroup .vlab em{font-style:normal;font-family:var(--jp);color:var(--graphite-soft);opacity:.8}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--paper-2)}
.seg button{font:600 12px/1 var(--ui);padding:10px 12px;border:0;background:transparent;color:var(--graphite-soft);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--paper)}
.ghost{font:600 12px/1 var(--ui);padding:10px 12px;border:1px solid var(--rule);border-radius:3px;
  background:var(--paper-2);color:var(--graphite-soft);cursor:pointer}
.ghost:hover{border-color:var(--graphite);color:var(--graphite)}
.ghost.on{border-color:var(--gold);color:var(--gold)}

/* ---------- カード共通 ---------- */
.card{background:var(--paper-2);border:1px solid var(--rule);border-left:3px solid var(--gold);
  padding:26px 26px 24px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.eyebrow{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;color:var(--dropout-deep);text-transform:uppercase;margin-bottom:14px;flex-wrap:wrap}
.eyebrow .theme{font-family:var(--jp);letter-spacing:.06em;text-transform:none;color:var(--graphite-soft)}
.sentence{font-family:var(--book);font-size:20px;line-height:1.85;color:var(--ink);margin:0 0 22px}
.tg{font-weight:700;background:linear-gradient(transparent 62%,var(--dropout) 62%);padding:0 1px}
.hint{font-size:12.5px;color:var(--graphite-soft);margin:0 0 18px}
.reveal{border-top:1px dashed var(--rule);margin-top:20px;padding-top:20px}
.reveal[hidden]{display:none}
.wlist{list-style:none;margin:0 0 20px;padding:0}
.wlist li{padding:12px 0;border-bottom:1px solid var(--rule)}
.wlist li:last-child{border-bottom:0}
.whead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.wen{font-family:var(--book);font-size:17px;font-weight:700;color:var(--ink)}
.wjp{font-size:14px;color:var(--graphite)}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid var(--rule);
  border-radius:2px;padding:2px 6px;color:var(--graphite-soft);white-space:nowrap}
.chip.S{border-color:var(--gold);color:var(--gold)}
.chip.B{border-color:var(--rule);color:var(--graphite-soft);opacity:.85}
.wnote{font-size:13.5px;color:var(--graphite);margin:5px 0 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:1px 5px;border-radius:2px;color:var(--ink)}
.trans{background:var(--trans-bg);border-left:2px solid var(--dropout);padding:13px 16px;font-size:14px;margin:0}
.trans b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dropout-deep);
  display:block;margin-bottom:4px;font-weight:700}

/* ---------- 文法カード ---------- */
.split{font-family:var(--mono);font-size:11.5px;color:var(--graphite-soft);margin:0 0 16px;
  letter-spacing:.04em}
.glist{list-style:none;margin:0;padding:0}
.gitem{border:1px solid var(--rule);border-radius:4px;padding:13px 15px;margin-bottom:10px;
  background:var(--paper);transition:border-color .18s}
.ghead{display:flex;gap:10px;align-items:flex-start}
.gltr{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--dropout-deep);
  border:1px solid var(--rule);border-radius:50%;width:24px;height:24px;flex:0 0 24px;
  display:grid;place-items:center;margin-top:2px}
.gen{font-family:var(--book);font-size:16.5px;line-height:1.7;color:var(--ink);margin:0;flex:1}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border-radius:2px;
  padding:2px 7px;white-space:nowrap;margin-left:6px;display:none;align-self:flex-start;margin-top:4px}
.gfb{display:none;margin:11px 0 0;padding-top:10px;border-top:1px dashed var(--rule)}
.gfb p{margin:0}
.gja{font-size:13.5px;color:var(--graphite)}
.gnote{font-size:13px;color:var(--graphite-soft);margin-top:4px !important}
.gitem.sel{border-color:var(--gold);background:rgba(203,185,145,.06)}
.gitem[role="button"]{cursor:pointer}
.card.open .gitem[role="button"]{cursor:default}
.card.open .badge{display:inline-block}
.card.open .gfb{display:block}
.card.open .gitem.y{border-color:var(--ok)}
.card.open .gitem.n{border-color:var(--ng)}
.badge.y{border:1px solid var(--ok);color:var(--ok)}
.badge.n{border:1px solid var(--ng);color:var(--ng)}
.badge.pick{border:1px solid var(--gold);color:var(--gold);display:none}
.card.open .badge.pick{display:inline-block}

 /* ---------- 検索 ---------- */
.srchbar{display:flex;gap:8px;margin:0 0 18px}
.srchbar input{flex:1;font:16px/1.4 var(--ui);background:var(--paper-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:12px 13px;-webkit-appearance:none}
.srchbar input::placeholder{color:var(--graphite-soft)}
.srchbar button{font:700 13px/1 var(--ui);padding:0 16px;border-radius:3px;
  border:1.5px solid var(--gold);background:var(--gold);color:var(--paper);cursor:pointer}
.srchnote{font-family:var(--mono);font-size:11px;color:var(--graphite-soft);margin:0 0 18px;
  letter-spacing:.04em}
.hits{list-style:none;margin:0;padding:0}
.hits li{border-bottom:1px solid var(--rule)}
.hits button{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:13px 2px;color:inherit;font:inherit}
.hits button:hover{background:rgba(124,202,220,.05)}
.hitmeta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dropout-deep);
  display:flex;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.hitmeta .th{font-family:var(--jp);letter-spacing:0;color:var(--graphite-soft)}
.hitsnip{font-family:var(--book);font-size:14.5px;line-height:1.7;color:var(--graphite);margin:0}
mark{background:rgba(203,185,145,.26);color:var(--gold);padding:0 2px;border-radius:2px}
.groupttl{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--gold);margin:24px 0 6px;font-weight:700}
.groupttl:first-of-type{margin-top:0}

/* ---------- Part 7 カード ---------- */
.p7head{font-family:var(--mono);font-size:11.5px;line-height:1.9;color:var(--graphite-soft);
  border:1px solid var(--rule);border-radius:3px;padding:10px 13px;margin:0 0 16px;background:var(--paper)}
.p7body{font-family:var(--book);font-size:16.5px;line-height:1.85;color:var(--ink);margin:0 0 6px}
.p7body b{color:var(--gold);font-family:var(--ui);font-size:13px;font-weight:700}
.qblock{border-top:1px solid var(--rule);margin-top:20px;padding-top:18px}
.qtext{font-family:var(--book);font-size:16px;color:var(--ink);margin:0 0 12px;display:flex;gap:9px}
.qnum{font-family:var(--mono);font-size:12px;color:var(--gold);flex:0 0 auto;padding-top:3px}
.qexp{font-size:13px;color:var(--graphite-soft);margin:10px 0 0;padding:10px 13px;
  background:var(--trans-bg);border-left:2px solid var(--dropout);display:none}
.card.open .qexp{display:block}
.ja{background:var(--trans-bg);border-left:2px solid var(--gold);padding:14px 16px;font-size:13.5px;margin:0}
.ja span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--gold);
  display:block;margin-bottom:6px;font-weight:700}
.ja p{margin:0 0 8px}
.ja p:last-child{margin:0}

/* ---------- 特化カード ---------- */
.qsent{font-family:var(--book);font-size:19px;line-height:1.9;color:var(--ink);margin:0 0 20px}
.blank{text-decoration:none;color:var(--gold);letter-spacing:.06em}
.exp{background:var(--trans-bg);border-left:2px solid var(--gold);padding:14px 16px;
  font-size:13.5px;margin:0;color:var(--graphite)}
.exp b{color:var(--ink)}
.exp>span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--gold);
  display:block;margin-bottom:5px;font-weight:700}
.verdict{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;margin:0 0 14px;display:none}
.card.open .verdict{display:block}
.verdict.hit{color:var(--ok)}
.verdict.miss{color:var(--ng)}

.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{font:700 14px/1 var(--ui);padding:14px 20px;border-radius:3px;border:1.5px solid var(--gold);
  background:var(--gold);color:var(--paper);cursor:pointer;flex:1 1 150px}
.btn.ok{border-color:var(--ok);background:var(--ok);color:var(--paper)}
.btn.again{border-color:var(--again);background:transparent;color:var(--again)}
.btn.shut{background:transparent;color:var(--gold)}
.btn:hover{opacity:.9}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{font:600 12.5px/1 var(--ui);background:none;border:0;color:var(--graphite-soft);cursor:pointer;padding:8px 2px}
.nav button:hover{color:var(--gold)}
.nav button[disabled]{opacity:.3;cursor:default}
.swipehint{text-align:center;font-size:11px;color:var(--graphite-soft);margin-top:16px}
.empty{text-align:center;padding:60px 20px;color:var(--graphite-soft);font-size:14px}
.swiping{transition:transform .06s linear}
footer{margin-top:34px;font-size:11.5px;color:var(--graphite-soft);line-height:1.9;
  border-top:1px solid var(--rule);padding-top:16px}
@media (max-width:520px){
  .sentence{font-size:17.5px}
  .gen{font-size:15.5px}
  .card{padding:20px 18px}
  .bub{width:28px;height:28px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
