/b> baker in Vienna and works <b class=\"tg\">exceptionally</b> quickly.","part":7},{"id":135,"theme":"研修制度","words":[{"w":"mentoring program","jp":"指導制度、メンター制度","tier":"A","ref":"TSL 607","note_html":"<code>Our mentoring program offers ~</code>。名詞 mentor、mentee。"},{"w":"introductory","jp":"入門の、導入の","tier":"A","ref":"TSL 723","note_html":"<code>an introductory course / offer / price</code>。動詞 introduce、名詞 introduction。"},{"w":"beginner","jp":"初心者","tier":"A","ref":"TSL 849","note_html":"<code>a complete beginner</code>。動詞 begin。novice の言い換え。"},{"w":"hesitant","jp":"ためらっている","tier":"A","ref":"TSL 825","note_html":"<code>be hesitant to sign up</code>。後ろは to 不定詞。動詞 hesitate、名詞 hesitation。"},{"w":"opt","jp":"選ぶ","tier":"A","ref":"TSL 609","note_html":"<code>opt for the shorter version</code>、<code>opt to do ~</code>。形容詞 optional、名詞 option。"}],"translation":"当社の指導制度では、まったくの初心者向けに入門講座を用意しています。申し込みをためらっている方は、代わりに短時間のオンライン版を選ぶこともできます。","html":"Our <b class=\"tg\">mentoring program</b> offers an <b class=\"tg\">introductory</b> course for anyone who is a complete <b class=\"tg\">beginner</b>. If you are <b class=\"tg\">hesitant</b> to sign up, you may <b class=\"tg\">opt</b> for the shorter online version instead.","part":7},{"id":136,"theme":"組織・効率化","words":[{"w":"maximize","jp":"最大化する","tier":"A","ref":"TSL 639","note_html":"<code>maximize output / profit</code>。反意語 minimize。名詞 maximum。"},{"w":"allocation","jp":"配分、割り当て","tier":"A","ref":"TSL 699","note_html":"<code>the allocation of staff</code>、<code>budget allocation</code>。動詞 allocate。"},{"w":"organizational","jp":"組織の、組織上の","tier":"A","ref":"TSL 833","note_html":"<code>an organizational change / chart</code>。名詞 organization、動詞 organize。"},{"w":"creativity","jp":"創造性","tier":"A","ref":"TSL 762","note_html":"<code>room for creativity</code>。形容詞 creative、動詞 create。"},{"w":"entrepreneurship","jp":"起業家精神、起業","tier":"A","ref":"TSL 676","note_html":"<code>a course in entrepreneurship</code>。名詞 entrepreneur。"}],"translation":"生産量を最大化するため、部長は3つのチーム間での人員配分を見直しました。この組織上の変更は創造性を発揮する余地も広げるもので、起業に関する講座も開講される予定です。","html":"To <b class=\"tg\">maximize</b> output, the director revised the <b class=\"tg\">allocation</b> of staff across three teams. The <b class=\"tg\">organizational</b> change also gives more room for <b class=\"tg\">creativity</b>, and a course in <b class=\"tg\">entrepreneurship</b> will be offered.","part":7},{"id":137,"theme":"郵便・配送","words":[{"w":"postal","jp":"郵便の","tier":"A","ref":"TSL 783","note_html":"<code>the postal service</code>、<code>postal code</code>（郵便番号）。名詞 postage、post。"},{"w":"detach","jp":"はがれる、取り外す","tier":"A","ref":"TSL 674","note_html":"<code>The label had begun to detach.</code>、<code>detach the coupon</code>。反意語 attach。"},{"w":"repeatedly","jp":"繰り返し、何度も","tier":"A","ref":"TSL 787","note_html":"<code>We have written repeatedly.</code>。動詞 repeat、名詞 repetition。"},{"w":"urgently","jp":"緊急に、至急","tier":"A","ref":"TSL 799","note_html":"<code>need the form urgently</code>。形容詞 urgent、名詞 urgency。"},{"w":"timely","jp":"時宜を得た、タイミングのよい","tier":"A","ref":"TSL 843","note_html":"<code>a timely reply</code>。**-ly で終わるが形容詞**である点が狙われる。"}],"translation":"宛名ラベルがはがれかけていたため、郵便局が封筒を返送してきました。当方から繰り返し書面を送っており、署名済みの用紙が至急必要ですので、早めのご返信をいただければ幸いです。","html":"The <b class=\"tg\">postal</b> service returned the envelope because the address label had begun to <b class=\"tg\">detach</b>. We have written <b class=\"tg\">repeatedly</b> and now need the signed form <b class=\"tg\">urgently</b>, so a <b class=\"tg\">timely</b> reply would be appreciated.","part":7},{"id":138,"theme":"清掃・手入れ","words":[{"w":"polish","jp":"磨く／つや出し剤","tier":"A","ref":"TSL 612","note_html":"<code>polish the brass railing</code>、<code>furniture polish</code>。比喩で「仕上げを整える」の意もある。"},{"w":"vase","jp":"花瓶","tier":"A","ref":"TSL 654","note_html":"<code>wipe the glass vase</code>。発音は米 /veɪs/。Part 1の室内描写に出る。"},{"w":"customizable","jp":"好みに合わせて変更できる","tier":"A","ref":"TSL 707","note_html":"<code>The chair covers are customizable.</code>。動詞 customize。"},{"w":"fabric","jp":"生地、布地","tier":"A","ref":"TSL 821","note_html":"<code>a heavier fabric</code>、<code>fabric samples</code>。cloth より産業・素材寄りの語。"},{"w":"ideally","jp":"理想的には、できれば","tier":"A","ref":"TSL 720","note_html":"<code>would ideally last three seasons</code>。形容詞 ideal。"}],"translation":"真鍮の手すりを磨き、フロントデスクのガラスの花瓶を拭いてください。椅子カバーは好みに合わせて変更でき、厚手の生地であれば理想的には3シーズンもつはずです。","html":"Please <b class=\"tg\">polish</b> the brass railing and wipe the glass <b class=\"tg\">vase</b> on the front desk. The chair covers are <b class=\"tg\">customizable</b>, and a heavier <b class=\"tg\">fabric</b> would <b class=\"tg\">ideally</b> last three seasons.","part":7},{"id":139,"theme":"予想外の事態","words":[{"w":"unexpected","jp":"予期しない","tier":"A","ref":"TSL 589","note_html":"<code>an unexpected delay / guest</code>。副詞 unexpectedly。反意語 expected。"},{"w":"overlook","jp":"見落とす／見渡す","tier":"A","ref":"TSL 684","note_html":"<code>nearly overlooked the deadline</code> と <code>a room overlooking the sea</code>（海を見渡す部屋）。正反対に見える2義があり頻出。"},{"w":"contrary to","jp":"〜に反して","tier":"A","ref":"TSL 813","note_html":"<code>Contrary to the early reports, ~</code>。後ろは名詞句。"},{"w":"on the contrary","jp":"それどころか、逆に","tier":"A","ref":"TSL 813","note_html":"<code>On the contrary, the backup worked.</code>。前文を否定して逆を述べる。contrary to との使い分けが狙われる。"},{"w":"relieved","jp":"ほっとした","tier":"A","ref":"TSL 736","note_html":"<code>The team was relieved.</code>、<code>be relieved to hear ~</code>。動詞 relieve、名詞 relief。"}],"translation":"予期しない遅れにより、私たちは危うく締切を見落とすところでした。当初の報告に反してデータの損失はなく、それどころかバックアップは完璧に機能し、チームは安堵しました。","html":"An <b class=\"tg\">unexpected</b> delay meant that we nearly <b class=\"tg\">overlooked</b> the deadline. <b class=\"tg\">Contrary to</b> the early reports, no data was lost; <b class=\"tg\">on the contrary</b>, the backup worked perfectly, and the team was <b class=\"tg\">relieved</b>.","part":7},{"id":140,"theme":"新入社員の歓迎","words":[{"w":"Welcome aboard!","jp":"ようこそ、入社おめでとう","tier":"A","ref":"TSL 655","note_html":"新入社員やチームへの加入者を迎える定型のあいさつ。"},{"w":"conveniently","jp":"便利に、都合よく","tier":"A","ref":"TSL 759","note_html":"<code>conveniently located beside ~</code>（〜の隣という便利な場所にある）が最頻出のかたち。"},{"w":"administer","jp":"実施する、管理する","tier":"A","ref":"TSL 802","note_html":"<code>administer a test</code>、<code>administer a program</code>。名詞 administration、administrator。"},{"w":"documentary","jp":"記録映画、ドキュメンタリー","tier":"A","ref":"TSL 630","note_html":"<code>a documentary about the company&#x27;s history</code>。document（文書）から。"},{"w":"eagerly","jp":"熱心に、心待ちに","tier":"A","ref":"TSL 598","note_html":"<code>eagerly waiting to meet you</code>、<code>eagerly anticipated</code>。形容詞 eager。"}],"translation":"ご入社おめでとうございます。研修室は社員食堂の隣という便利な場所にあり、そこで簡単な適性テストを実施します。その後、会社の歴史に関する記録映像を上映します。チーム一同、お会いできるのを心待ちにしています。","html":"<b class=\"tg\">Welcome aboard!</b> The training room is <b class=\"tg\">conveniently</b> located beside the cafeteria, where we will <b class=\"tg\">administer</b> a short placement test. Afterward, a <b class=\"tg\">documentary</b> about the company&#x27;s history will be shown, and the team is <b class=\"tg\">eagerly</b> waiting to meet you.","part":7},{"id":141,"theme":"遠隔会議","words":[{"w":"chairperson","jp":"議長、委員長","tier":"A","ref":"TSL 852","note_html":"<code>The chairperson will join ~</code>。chairman の性別中立形で、公式文書ではこちらが使われる。"},{"w":"videoconference","jp":"テレビ会議","tier":"A","ref":"TSL 1250","note_html":"<code>join by videoconference</code>、<code>hold a videoconference</code>。teleconference（電話会議）と区別する。"},{"w":"convey","jp":"伝える、運ぶ","tier":"A","ref":"TSL 898","note_html":"<code>convey the board&#x27;s decision</code>、<code>convey goods</code>。「意思を伝達する」の意で頻出。"},{"w":"incoming","jp":"入ってくる、着任予定の","tier":"A","ref":"TSL 1222","note_html":"<code>incoming questions / calls / president</code>（次期社長）。反意語 outgoing。"},{"w":"departmental","jp":"部門の、学科の","tier":"A","ref":"TSL 1118","note_html":"<code>the departmental representative</code>、<code>a departmental meeting</code>。名詞 department。"}],"translation":"議長はテレビ会議で参加し、取締役会の決定を伝えます。届いた質問は正午までに部門の担当者に転送してください。","html":"The <b class=\"tg\">chairperson</b> will join by <b class=\"tg\">videoconference</b> and <b class=\"tg\">convey</b> the board&#x27;s decision. Please forward any <b class=\"tg\">incoming</b> questions to the <b class=\"tg\">departmental</b> representative before noon.","part":8},{"id":142,"theme":"障害・中断","words":[{"w":"outage","jp":"供給停止、停電","tier":"A","ref":"TSL 1156","note_html":"<code>a power outage</code>、<code>a service outage</code>。out（外へ）＋-age。"},{"w":"disrupt","jp":"混乱させる、中断させる","tier":"A","ref":"TSL 861","note_html":"<code>disrupt the network / traffic</code>。名詞 disruption。"},{"w":"disruptive","jp":"混乱を招く、妨げになる","tier":"A","ref":"TSL 861","note_html":"<code>The noise may be disruptive.</code>。物・事の性質を表す形容詞。"},{"w":"recur","jp":"再発する、繰り返し起こる","tier":"A","ref":"TSL 872","note_html":"<code>If the problem should recur ~</code>。過去形は recurred。形容詞 recurring。"},{"w":"distraction","jp":"気を散らすもの、注意散漫","tier":"A","ref":"TSL 904","note_html":"<code>less distraction</code>、<code>a source of distraction</code>。動詞 distract。"}],"translation":"停電により2時間ネットワークが遮断され、修理の騒音も業務の妨げになるかもしれません。万一その問題が再発した場合は、気の散る要素が少ない上の階へチームを移動させてください。","html":"A power <b class=\"tg\">outage</b> will <b class=\"tg\">disrupt</b> the network for two hours, and the noise from the repairs may be <b class=\"tg\">disruptive</b>. If the problem should <b class=\"tg\">recur</b>, move the team upstairs, where there is less <b class=\"tg\">distraction</b>.","part":8},{"id":143,"theme":"信頼性・精度","words":[{"w":"dependable","jp":"信頼できる","tier":"A","ref":"TSL 858","note_html":"<code>a dependable scanner / employee</code>。reliable の言い換え。"},{"w":"accuracy","jp":"正確さ、精度","tier":"A","ref":"TSL 1098","note_html":"<code>accuracy drops</code>、<code>improve accuracy</code>。形容詞 accurate、副詞 accurately。"},{"w":"flawed","jp":"欠陥のある","tier":"A","ref":"TSL 1049","note_html":"<code>One sensor is flawed.</code>、<code>a flawed design</code>。名詞 flaw、反意語 flawless。"},{"w":"partially","jp":"部分的に","tier":"A","ref":"TSL 1159","note_html":"<code>works only partially</code>。形容詞 partial、反意語 completely / fully。"},{"w":"dependence","jp":"依存","tier":"A","ref":"TSL 903","note_html":"<code>our dependence on a single unit</code>。**on** が続く。動詞 depend on、形容詞 dependent。"}],"translation":"旧型のスキャナーは信頼できますが、寒冷時には精度が落ちます。センサーの1つに欠陥があり部分的にしか作動しないため、1台の機器への依存は危険です。","html":"The older scanner is <b class=\"tg\">dependable</b>, but its <b class=\"tg\">accuracy</b> drops in cold weather. One sensor is <b class=\"tg\">flawed</b> and works only <b class=\"tg\">partially</b>, so our <b class=\"tg\">dependence</b> on a single unit is risky.","part":8},{"id":144,"theme":"商取引・小売","words":[{"w":"commerce","jp":"商業、通商","tier":"A","ref":"TSL 897","note_html":"<code>local commerce</code>、<code>e-commerce</code>、<code>the Chamber of Commerce</code>（商工会議所）。不可算名詞。"},{"w":"dealership","jp":"販売代理店、特約店","tier":"A","ref":"TSL 857","note_html":"<code>a car dealership</code>。dealer（販売業者）＋-ship。"},{"w":"merchant","jp":"商人、小売業者","tier":"A","ref":"TSL 925","note_html":"<code>a merchant who buys in bulk</code>。形容詞的に <code>a merchant ship</code>（商船）。"},{"w":"bulk","jp":"大量、大部分","tier":"A","ref":"TSL 1032","note_html":"<code>buy in bulk</code>、<code>the bulk of the work</code>（仕事の大半）。2用法とも出る。"},{"w":"debit card","jp":"デビットカード","tier":"A","ref":"TSL 901","note_html":"<code>pay by debit card</code>。credit card と対で、支払い方法の選択肢として登場する。"}],"translation":"メインストリートに自動車販売代理店が開業して以来、地域の商業は活発になりました。大量に仕入れる小売業者は、カウンターでデビットカードでの支払いが可能です。","html":"Local <b class=\"tg\">commerce</b> has grown since the car <b class=\"tg\">dealership</b> opened on Main Street. A <b class=\"tg\">merchant</b> who buys in <b class=\"tg\">bulk</b> may pay by <b class=\"tg\">debit card</b> at the counter.","part":8},{"id":145,"theme":"縫製・生地","words":[{"w":"tailor","jp":"仕立屋／仕立てる、合わせる","tier":"A","ref":"TSL 948","note_html":"<code>a tailor will sew ~</code>、<code>tailor the program to your needs</code>（要望に合わせる）。動詞用法も頻出。"},{"w":"sew","jp":"縫う","tier":"A","ref":"TSL 1176","note_html":"<code>sew the lining by hand</code>。活用は sew–sewed–sewn。発音は /soʊ/ で saw とは異なる。"},{"w":"delicate","jp":"繊細な、壊れやすい","tier":"A","ref":"TSL 902","note_html":"<code>too delicate for the machine</code>、<code>a delicate fabric / matter</code>。物にも問題にも使う。"},{"w":"sewing machine","jp":"ミシン","tier":"A","ref":"TSL 1176","note_html":"<code>use the sewing machine</code>。日本語の「ミシン」は machine の訛りに由来する。"},{"w":"evenly","jp":"均等に、平らに","tier":"A","ref":"TSL 975","note_html":"<code>spread the padding evenly</code>、<code>evenly divided</code>。形容詞 even。"}],"translation":"その絹地はミシンにかけるには繊細すぎるため、仕立屋が裏地を手縫いします。作業を始める前に、詰め物を均等に広げてください。","html":"A <b class=\"tg\">tailor</b> will <b class=\"tg\">sew</b> the lining by hand because the silk is too <b class=\"tg\">delicate</b> for the <b class=\"tg\">sewing machine</b>. Spread the padding <b class=\"tg\">evenly</b> before you begin.","part":8},{"id":146,"theme":"美術・工芸","words":[{"w":"pottery","jp":"陶器、陶芸","tier":"A","ref":"TSL 933","note_html":"不可算名詞。<code>a pottery collection / class</code>。名詞 potter（陶芸家）。"},{"w":"architectural","jp":"建築の、建築上の","tier":"A","ref":"TSL 889","note_html":"<code>architectural models / design</code>。名詞 architect、architecture。"},{"w":"scenery","jp":"風景、景色","tier":"A","ref":"TSL 1174","note_html":"不可算名詞。<code>coastal scenery</code>、<code>enjoy the scenery</code>。数える場合は <code>a piece of scenery</code>。"},{"w":"acclaim","jp":"称賛／称賛する","tier":"A","ref":"TSL 1243","note_html":"<code>win wide acclaim</code>、<code>be acclaimed for ~</code>。名詞・動詞の両用法。"},{"w":"critically acclaimed","jp":"批評家に高く評価された","tier":"A","ref":"TSL 1243","note_html":"<code>a critically acclaimed sculpture / film</code>。決まった組み合わせの表現。"}],"translation":"そのギャラリーの陶器コレクションは、建築模型の写真や海岸の風景画の隣に展示されています。この展覧会は広く称賛を集めており、批評家に高く評価された彫刻1点が来年巡回する予定です。","html":"The gallery&#x27;s <b class=\"tg\">pottery</b> collection is displayed beside photographs of <b class=\"tg\">architectural</b> models and paintings of coastal <b class=\"tg\">scenery</b>. The exhibit has won wide <b class=\"tg\">acclaim</b>, and one <b class=\"tg\">critically acclaimed</b> sculpture will tour next year.","part":8},{"id":147,"theme":"顧客・ファン","words":[{"w":"loyalty","jp":"忠誠、愛顧","tier":"A","ref":"TSL 994","note_html":"<code>customer loyalty</code>、<code>a loyalty program</code>。形容詞 loyal。"},{"w":"foster","jp":"育む、促進する","tier":"A","ref":"TSL 1135","note_html":"<code>foster closer ties / innovation</code>。「時間をかけて育てる」の意。"},{"w":"prominent","jp":"著名な、目立つ","tier":"A","ref":"TSL 1072","note_html":"<code>a prominent enthusiast / figure</code>。副詞 prominently。"},{"w":"enthusiast","jp":"愛好家、熱心なファン","tier":"A","ref":"TSL 908","note_html":"<code>a cycling enthusiast</code>。名詞 enthusiasm、形容詞 enthusiastic。"},{"w":"enthusiastically","jp":"熱心に","tier":"A","ref":"TSL 863","note_html":"<code>spoke enthusiastically about ~</code>。about が続く。"}],"translation":"地元のクラブとの結びつきを深めるようになって以来、顧客の愛顧は高まっています。発表会では、著名なサイクリング愛好家が新しいフレームについて熱心に語りました。","html":"Customer <b class=\"tg\">loyalty</b> has grown since we began to <b class=\"tg\">foster</b> closer ties with local clubs. A <b class=\"tg\">prominent</b> cycling <b class=\"tg\">enthusiast</b> spoke <b class=\"tg\">enthusiastically</b> about the new frame at the launch.","part":8},{"id":148,"theme":"施設・備品","words":[{"w":"ballroom","jp":"大広間、宴会場","tier":"A","ref":"TSL 1104","note_html":"<code>the hotel ballroom</code>。banquet hall と近い語で、式典会場として出る。"},{"w":"gymnasium","jp":"体育館、ジム","tier":"A","ref":"TSL 1217","note_html":"短縮形 gym。<code>on the lower floor</code>。学校・ホテルの設備説明で登場。"},{"w":"(light) bulb","jp":"電球","tier":"A","ref":"TSL 1202","note_html":"<code>replace the burned-out light bulb</code>。<code>burn out</code>（切れる）とセットで覚える。"},{"w":"bookcase","jp":"本棚","tier":"A","ref":"TSL 1233","note_html":"<code>above the bookcase</code>。bookshelf とほぼ同義でPart 1に出る。"},{"w":"microwave (oven)","jp":"電子レンジ","tier":"A","ref":"TSL 995","note_html":"<code>The microwave oven is out of order.</code>。動詞では「レンジで温める」。"}],"translation":"ホテルの宴会場は下の階の体育館の隣にあります。本棚の上の切れた電球を交換してください。なお、休憩室の電子レンジは故障中です。","html":"The hotel <b class=\"tg\">ballroom</b> is next to the <b class=\"tg\">gymnasium</b> on the lower floor. Replace the burned-out <b class=\"tg\">light bulb</b> above the <b class=\"tg\">bookcase</b>, and note that the <b class=\"tg\">microwave oven</b> in the staff room is out of order.","part":8},{"id":149,"theme":"解体・屋外作業","words":[{"w":"demolish","jp":"取り壊す、解体する","tier":"A","ref":"TSL 1117","note_html":"<code>demolish the old shed / building</code>。名詞 demolition。"},{"w":"intersection","jp":"交差点","tier":"A","ref":"TSL 1143","note_html":"<code>near the intersection</code>、<code>at the intersection of A and B</code>。道案内で頻出。"},{"w":"lawn mower","jp":"芝刈り機","tier":"A","ref":"TSL 1226","note_html":"<code>return the lawn mower to the shed</code>。lawn（芝生）＋mow（刈る）。"},{"w":"backpack","jp":"リュックサック","tier":"A","ref":"TSL 1103","note_html":"<code>bring a backpack</code>。Part 1の人物描写にも出る。"},{"w":"blanket","jp":"毛布","tier":"A","ref":"TSL 851","note_html":"<code>a warm blanket</code>。機内サービスや宿泊設備の説明で登場する。"}],"translation":"作業班が火曜日に、交差点近くの古い物置を取り壊します。事前に芝刈り機を物置に戻しておいてください。日没後も残る予定の方は、リュックと暖かい毛布をご持参ください。","html":"Crews will <b class=\"tg\">demolish</b> the old shed near the <b class=\"tg\">intersection</b> on Tuesday. Return the <b class=\"tg\">lawn mower</b> to the shed beforehand, and bring a <b class=\"tg\">backpack</b> and a warm <b class=\"tg\">blanket</b> if you plan to stay after dark.","part":8},{"id":150,"theme":"働き方","words":[{"w":"freelance","jp":"フリーランスの、自由契約の","tier":"A","ref":"TSL 864","note_html":"<code>freelance designers / writers</code>。名詞 freelancer。"},{"w":"flexibility","jp":"柔軟性、融通","tier":"A","ref":"TSL 910","note_html":"<code>the flexibility of the contract</code>、<code>scheduling flexibility</code>。形容詞 flexible。"},{"w":"strategically","jp":"戦略的に","tier":"A","ref":"TSL 876","note_html":"<code>plan strategically</code>、<code>strategically located</code>（立地条件がよい）。形容詞 strategic。"},{"w":"attain","jp":"達成する、到達する","tier":"A","ref":"TSL 890","note_html":"<code>attain the annual target</code>。achieve の格式ばった語。名詞 attainment。"},{"w":"invaluable","jp":"きわめて貴重な","tier":"A","ref":"TSL 868","note_html":"<code>Their experience has proved invaluable.</code>。**valuable の強調形**で、「価値がない」ではない点が最頻出の狙い目。"}],"translation":"当社のフリーランスのデザイナーは、新しい契約の柔軟性を高く評価しています。戦略的に計画すれば年間目標は達成でき、彼らの社外経験はきわめて貴重であることが実証されました。","html":"Our <b class=\"tg\">freelance</b> designers value the <b class=\"tg\">flexibility</b> of the new contract. If we plan <b class=\"tg\">strategically</b>, we can <b class=\"tg\">attain</b> the annual target, and their outside experience has proved <b class=\"tg\">invaluable</b>.","part":8},{"id":151,"theme":"研究・栄養","words":[{"w":"biology","jp":"生物学","tier":"A","ref":"TSL 850","note_html":"<code>the biology lab</code>。形容詞 biological、名詞 biologist。"},{"w":"reproduce","jp":"再現する、複製する","tier":"A","ref":"TSL 873","note_html":"<code>cannot reproduce the earlier results</code>、<code>reproduce a document</code>。名詞 reproduction。"},{"w":"cautiously","jp":"慎重に","tier":"A","ref":"TSL 894","note_html":"<code>handle each sample cautiously</code>。形容詞 cautious、名詞 caution。"},{"w":"dispose","jp":"処分する","tier":"A","ref":"TSL 860","note_html":"<code>Dispose of expired reagents.</code>。**of が必須**。名詞 disposal、形容詞 disposable。"},{"w":"nutritional","jp":"栄養の、栄養上の","tier":"A","ref":"TSL 1227","note_html":"<code>nutritional content / information</code>（栄養成分表示）。名詞 nutrition、nutritionist。"}],"translation":"生物学の実験室では以前の結果を再現できていないため、各検体は慎重に取り扱ってください。使用期限切れの試薬は適切に処分し、各ロットの栄養成分を記録してください。","html":"The <b class=\"tg\">biology</b> lab cannot <b class=\"tg\">reproduce</b> the earlier results, so handle each sample <b class=\"tg\">cautiously</b>. <b class=\"tg\">Dispose</b> of expired reagents properly, and record the <b class=\"tg\">nutritional</b> content of every batch.","part":8},{"id":152,"theme":"屋外イベント","words":[{"w":"spectator","jp":"観客、見物人","tier":"A","ref":"TSL 1084","note_html":"<code>spectators at the rally</code>、<code>a spectator sport</code>。audience（聴衆）との違いは「見る」対象であること。"},{"w":"automotive","jp":"自動車の","tier":"A","ref":"TSL 1199","note_html":"<code>an automotive rally / industry / parts</code>。auto、automobile と語族で。"},{"w":"retriever","jp":"レトリバー犬","tier":"A","ref":"TSL 1076","note_html":"<code>a golden retriever</code>。動詞 retrieve（回収する）から。"},{"w":"slot","jp":"枠、時間帯","tier":"A","ref":"TSL 1012","note_html":"<code>a thirty-minute slot</code>、<code>a time slot</code>。予定表の「枠」を指す。"}],"translation":"自動車ラリーの観客は、レースの合間にゴールデンレトリバーの実演で楽しみました。各クラブには30分の枠が与えられました。","html":"<b class=\"tg\">Spectators</b> at the <b class=\"tg\">automotive</b> rally were entertained between races by a golden <b class=\"tg\">retriever</b> demonstration. Each club was given a thirty-minute <b class=\"tg\">slot</b>.","part":8},{"id":153,"theme":"法律事務所","words":[{"w":"paralegal","jp":"弁護士補助職員","tier":"A","ref":"TSL 1158","note_html":"<code>The paralegal will file ~</code>。para-（補助の）＋legal。法律事務所の職名として出る。"},{"w":"erase","jp":"消去する、消す","tier":"A","ref":"TSL 1211","note_html":"<code>erase the draft from the drive</code>。名詞 eraser（消しゴム）。delete と同義。"},{"w":"fortunately","jp":"幸いにも","tier":"A","ref":"TSL 912","note_html":"<code>Fortunately, the client waited ~</code>。文頭で用いる。形容詞 fortunate、反意語 unfortunately。"},{"w":"comfortably","jp":"快適に、くつろいで","tier":"A","ref":"TSL 1037","note_html":"<code>waited comfortably in the lounge</code>。形容詞 comfortable、名詞 comfort。"}],"translation":"弁護士補助職員が、書類の提出後に共有ドライブから草案を消去します。幸いにも、書類が準備される間、依頼人はラウンジで快適にお待ちいただけました。","html":"The <b class=\"tg\">paralegal</b> will <b class=\"tg\">erase</b> the draft from the shared drive once it is filed. <b class=\"tg\">Fortunately</b>, the client waited <b class=\"tg\">comfortably</b> in the lounge while the documents were prepared.","part":8},{"id":154,"theme":"社員研修旅行","words":[{"w":"retreat","jp":"研修旅行、保養／退却する","tier":"A","ref":"TSL 1171","note_html":"<code>this year&#x27;s retreat</code>、<code>a company retreat</code>。名詞用法が中心。"},{"w":"donut","jp":"ドーナツ","tier":"A","ref":"TSL 1126","note_html":"<code>coffee and a donut</code>。doughnut の簡略表記で、米国式。"},{"w":"revolutionize","jp":"大変革をもたらす","tier":"A","ref":"TSL 1009","note_html":"<code>revolutionize the industry</code>。名詞 revolution、形容詞 revolutionary。"},{"w":"traditionally","jp":"伝統的に、従来は","tier":"A","ref":"TSL 1016","note_html":"<code>has traditionally relied on ~</code>。形容詞 traditional、名詞 tradition。"}],"translation":"今年の研修旅行は、ロビーでのコーヒーとドーナツから始まります。基調講演者は、従来は目視検査に頼ってきたこの業界に、自動化が大変革をもたらすと主張しています。","html":"This year&#x27;s <b class=\"tg\">retreat</b> will open with coffee and a <b class=\"tg\">donut</b> in the lobby. The keynote speaker claims that automation will <b class=\"tg\">revolutionize</b> the industry, which has <b class=\"tg\">traditionally</b> relied on manual inspection.","part":8},{"id":155,"theme":"施設清掃","words":[{"w":"custodian","jp":"管理人、用務員","tier":"B","ref":"頻度表外","note_html":"<code>the building custodian</code>。施設の維持管理を担う職名。custody（保管）から。"},{"w":"odor","jp":"におい、悪臭","tier":"B","ref":"頻度表外","note_html":"<code>a strong odor</code>、<code>an odor coming from ~</code>。英国式は odour。中立〜否定的な語感。"},{"w":"janitor","jp":"清掃員、管理人","tier":"B","ref":"頻度表外","note_html":"<code>a janitor will clean ~</code>。custodian とほぼ同義で、米国式の口語寄り。"},{"w":"disinfect","jp":"消毒する","tier":"B","ref":"頻度表外","note_html":"<code>disinfect the shelves / surfaces</code>。名詞 disinfectant（消毒剤）。"},{"w":"dustpan","jp":"ちりとり","tier":"B","ref":"頻度表外","note_html":"<code>a broom and a dustpan</code>。Part 1の清掃場面で broom とセットで出る。"}],"translation":"管理人が、保管室から強いにおいがしていると報告しました。今晩、清掃員が棚を消毒します。また、2階用に新しいちりとりが発注されました。","html":"The <b class=\"tg\">custodian</b> reported that a strong <b class=\"tg\">odor</b> was coming from the storage room. A <b class=\"tg\">janitor</b> will <b class=\"tg\">disinfect</b> the shelves this evening, and a new <b class=\"tg\">dustpan</b> has been ordered for the second floor.","part":9},{"id":156,"theme":"建設・掘削","words":[{"w":"excavate","jp":"掘削する、発掘する","tier":"B","ref":"頻度表外","note_html":"<code>excavate the site</code>。工事にも遺跡発掘にも使う。"},{"w":"excavation","jp":"掘削、発掘現場","tier":"B","ref":"頻度表外","note_html":"<code>the excavation revealed ~</code>。動詞 excavate の名詞形。"},{"w":"debris","jp":"がれき、破片","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>clear the debris</code>。発音は /dəˈbriː/ で s は無音。"},{"w":"gravel","jp":"砂利","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>spread gravel</code>、<code>a gravel path</code>。"},{"w":"lumber","jp":"木材、材木","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>lumber will arrive ~</code>、<code>a lumber yard</code>（製材所）。timber とほぼ同義。"}],"translation":"作業班は月曜日にその用地の掘削を開始し、掘削作業により古い排水管が見つかりました。砂利を敷く前にがれきを撤去する必要があり、木材は木曜日に到着します。","html":"Crews began to <b class=\"tg\">excavate</b> the site on Monday, and the <b class=\"tg\">excavation</b> revealed an old drainage pipe. <b class=\"tg\">Debris</b> must be cleared before the <b class=\"tg\">gravel</b> is spread, and the <b class=\"tg\">lumber</b> will arrive Thursday.","part":9},{"id":157,"theme":"美術館・展示","words":[{"w":"curator","jp":"学芸員、館長","tier":"B","ref":"頻度表外","note_html":"<code>the curator arranged ~</code>。展示の企画・管理を担う職名。"},{"w":"artwork","jp":"美術作品","tier":"B","ref":"頻度表外","note_html":"不可算扱いが一般的。<code>arrange the artwork by period</code>。"},{"w":"artifact","jp":"工芸品、遺物","tier":"B","ref":"頻度表外","note_html":"<code>a rare artifact</code>。博物館の展示物を指す。英国式は artefact。"},{"w":"mural","jp":"壁画","tier":"B","ref":"頻度表外","note_html":"<code>a large mural covers ~</code>、<code>paint a mural</code>。建物の壁に直接描かれた絵。"},{"w":"memorabilia","jp":"記念品、収集品","tier":"B","ref":"頻度表外","note_html":"常に複数形。<code>film memorabilia</code>、<code>sports memorabilia</code>。memory と同語源。"}],"translation":"学芸員は美術作品を時代順に並べ、珍しい工芸品を入口近くに配置しました。北側の壁一面には大きな壁画があり、側面のギャラリーには1950年代の映画の記念品が並んでいます。","html":"The <b class=\"tg\">curator</b> arranged the <b class=\"tg\">artwork</b> by period and placed a rare <b class=\"tg\">artifact</b> near the entrance. A large <b class=\"tg\">mural</b> covers the north wall, and film <b class=\"tg\">memorabilia</b> from the 1950s fills the side gallery.","part":9},{"id":158,"theme":"物流・梱包","words":[{"w":"logistics","jp":"物流、配送業務","tier":"B","ref":"頻度表外","note_html":"複数形だが単数扱いも可。<code>our logistics team</code>。"},{"w":"crate","jp":"木箱、輸送箱","tier":"B","ref":"頻度表外","note_html":"<code>pack goods in a wooden crate</code>。Part 1の倉庫場面に出る。"},{"w":"cardboard","jp":"段ボール","tier":"B","ref":"頻度表外","note_html":"<code>cardboard boxes</code>。不可算名詞で、形容詞的に使う。"},{"w":"bulky","jp":"かさばる","tier":"B","ref":"頻度表外","note_html":"<code>bulky orders / items</code>。重さではなく体積の大きさを指す。"},{"w":"logistical","jp":"物流上の、手配上の","tier":"B","ref":"頻度表外","note_html":"<code>a logistical problem / challenge</code>。名詞 logistics の形容詞形。"}],"translation":"当社の物流チームは、壊れやすい商品は木箱に、軽い品物は段ボール箱に梱包します。かさばる注文は配送車にとって手配上の問題となります。","html":"Our <b class=\"tg\">logistics</b> team packs fragile goods in a wooden <b class=\"tg\">crate</b> and lighter items in <b class=\"tg\">cardboard</b> boxes. <b class=\"tg\">Bulky</b> orders create a <b class=\"tg\">logistical</b> problem for the delivery van.","part":9},{"id":159,"theme":"提案の検討","words":[{"w":"feasibility","jp":"実現可能性","tier":"B","ref":"頻度表外","note_html":"<code>a feasibility study</code>（実現可能性調査）が定型。"},{"w":"feasible","jp":"実現可能な","tier":"B","ref":"頻度表外","note_html":"<code>feasible within the budget</code>。possible より「実行に無理がない」の意。"},{"w":"pertinent","jp":"関連のある、適切な","tier":"B","ref":"頻度表外","note_html":"<code>pertinent documents / information</code>。relevant の言い換え。"},{"w":"conclusive","jp":"決定的な、確定的な","tier":"B","ref":"頻度表外","note_html":"<code>The results are not conclusive.</code>。動詞 conclude、名詞 conclusion。"},{"w":"entail","jp":"伴う、必要とする","tier":"B","ref":"頻度表外","note_html":"<code>entail additional staffing / costs</code>。「結果として必要になる」の意。"}],"translation":"実現可能性調査により、その計画が予算内で実行可能かどうかが分かります。関連書類を添付してください。結果はまだ確定的ではなく、この事業には追加の人員配置が伴う可能性があります。", :"brew","jp":"淹れる、醸造する","tier":"B","ref":"頻度表外","note_html":"<code>brew coffee / beer</code>。名詞では「淹れたもの」。"},{"w":"gourmet","jp":"高級な、美食の","tier":"B","ref":"頻度表外","note_html":"<code>a gourmet menu / restaurant</code>。名詞では「美食家」。発音は /ˈɡʊrmeɪ/。"},{"w":"cuisine","jp":"料理、料理法","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>regional / French cuisine</code>。food より「様式としての料理」を指す。"}],"translation":"乳製品などの傷みやすい品は、到着後すぐに冷蔵する必要があります。そのカフェは店内でコーヒーを淹れ、高級メニューには郷土料理が並びます。","html":"<b class=\"tg\">Perishable</b> items such as <b class=\"tg\">dairy</b> products must be refrigerated on arrival. The café will <b class=\"tg\">brew</b> coffee on site, and the <b class=\"tg\">gourmet</b> menu features regional <b class=\"tg\">cuisine</b>.","part":9},{"id":164,"theme":"造園・園芸","words":[{"w":"horticulture","jp":"園芸、園芸学","tier":"B","ref":"頻度表外","note_html":"<code>the horticulture club / department</code>。形容詞 horticultural。"},{"w":"greenhouse","jp":"温室","tier":"B","ref":"頻度表外","note_html":"<code>maintain the greenhouse</code>、<code>greenhouse gas</code>（温室効果ガス）。"},{"w":"fertilizer","jp":"肥料","tier":"B","ref":"頻度表外","note_html":"<code>apply fertilizer</code>。動詞 fertilize。"},{"w":"irrigation","jp":"灌漑、散水","tier":"B","ref":"頻度表外","note_html":"<code>irrigation hoses / system</code>。動詞 irrigate。"},{"w":"bush","jp":"低木、茂み","tier":"B","ref":"頻度表外","note_html":"<code>trim the bush</code>。tree より低い植え込みを指す。Part 1に出る。"}],"translation":"園芸クラブが図書館裏の温室を管理しています。梅雨の前に肥料をまき、散水用ホースを点検し、門の脇の低木を刈り込んでください。","html":"The <b class=\"tg\">horticulture</b> club maintains the <b class=\"tg\">greenhouse</b> behind the library. Apply <b class=\"tg\">fertilizer</b> before the rainy season, check the <b class=\"tg\">irrigation</b> hoses, and trim the <b class=\"tg\">bush</b> beside the gate.","part":9},{"id":165,"theme":"環境保護","words":[{"w":"habitat","jp":"生息地","tier":"B","ref":"頻度表外","note_html":"<code>a protected habitat</code>、<code>natural habitat</code>。動植物の生息環境を指す。"},{"w":"endangered","jp":"絶滅危惧の","tier":"B","ref":"頻度表外","note_html":"<code>endangered birds / species</code>。動詞 endanger（危険にさらす）。"},{"w":"conservation","jp":"保護、保全","tier":"B","ref":"頻度表外","note_html":"<code>a conservation program</code>、<code>energy conservation</code>（省エネ）。"},{"w":"conserve","jp":"保護する、節約する","tier":"B","ref":"頻度表外","note_html":"<code>conserve water / energy</code>。preserve（保存する）と使い分ける。"},{"w":"biodegradable","jp":"生分解性の","tier":"B","ref":"頻度表外","note_html":"<code>biodegradable packaging</code>。bio（生物）＋degrade（分解する）。"}],"translation":"その湿地は複数の絶滅危惧種の鳥にとって保護された生息地です。当センターの保全プログラムでは来場者に節水を呼びかけており、センターで販売される包装材はすべて生分解性です。","html":"The wetland is a protected <b class=\"tg\">habitat</b> for several <b class=\"tg\">endangered</b> birds. Our <b class=\"tg\">conservation</b> program encourages visitors to <b class=\"tg\">conserve</b> water, and all packaging sold at the center is <b class=\"tg\">biodegradable</b>.","part":9},{"id":166,"theme":"人事・受け入れ","words":[{"w":"onboarding","jp":"新入社員の受け入れ、導入研修","tier":"B","ref":"頻度表外","note_html":"<code>an onboarding session / process</code>。orientation と近い語。"},{"w":"perk","jp":"福利厚生、特典","tier":"B","ref":"頻度表外","note_html":"<code>every perk offered to employees</code>。benefits のくだけた言い方。"},{"w":"mentee","jp":"指導を受ける側","tier":"B","ref":"頻度表外","note_html":"<code>each mentee is paired with ~</code>。mentor（指導者）と対で。"},{"w":"aspiring","jp":"〜を目指している","tier":"B","ref":"頻度表外","note_html":"<code>aspiring managers / writers</code>。名詞の前でのみ使う。動詞 aspire。"},{"w":"credentials","jp":"資格、経歴","tier":"B","ref":"頻度表外","note_html":"常に複数形。<code>submit your credentials</code>。学位・免許・職歴などの総称。"}],"translation":"導入研修では、新入社員に提供されるすべての福利厚生について説明します。指導を受ける各メンバーには先輩社員が1名ずつ付き、管理職を目指す方は金曜日までに資格・経歴を提出してください。","html":"The <b class=\"tg\">onboarding</b> session explains every <b class=\"tg\">perk</b> offered to new employees. Each <b class=\"tg\">mentee</b> is paired with a senior member, and <b class=\"tg\">aspiring</b> managers should submit their <b class=\"tg\">credentials</b> by Friday.","part":9},{  the office, new <b class=\"tg\">insulation</b> will <b class=\"tg\">insulate</b> the roof, and the <b class=\"tg\">exterior</b> will be repainted.","part":9},{"id":169,"theme":"出版・資料","words":[{"w":"manuscript","jp":"原稿","tier":"B","ref":"頻度表外","note_html":"<code>The manuscript is being reviewed.</code>、<code>submit a manuscript</code>。"},{"w":"excerpt","jp":"抜粋","tier":"B","ref":"頻度表外","note_html":"<code>an excerpt will appear in ~</code>、<code>an excerpt from the novel</code>。"},{"w":"leaflet","jp":"ちらし、小冊子","tier":"B","ref":"頻度表外","note_html":"<code>distribute a leaflet</code>。flyer、pamphlet と近い語。"},{"w":"handout","jp":"配布資料","tier":"B","ref":"頻度表外","note_html":"<code>a one-page handout</code>。会議・講義で配る資料。"},{"w":"bibliography","jp":"参考文献一覧","tier":"B","ref":"頻度表外","note_html":"<code>a short bibliography</code>。論文や記事の末尾に付す。"}],"translation":"原稿は現在査読中で、抜粋が来月号に掲載されます。講演では、ちらしと1ページの配布資料が、短い参考文献一覧とともに配られます。","html":"The <b class=\"tg\">manuscript</b> is being reviewed, and an <b class=\"tg\">excerpt</b> will appear in next month&#x27;s issue. A <b class=\"tg\">leaflet</b> and a one-page <b class=\"tg\">handout</b> will be distributed at the talk, along with a short <b class=\"tg\">bibliography</b>.","part":9},{"id":170,"theme":"専門職","words":[{"w":"optician","jp":"眼鏡技師、眼鏡店","tier":"B","ref":"頻度表外","note_html":"<code>an optician has opened an office</code>。眼科医は ophthalmologist。"},{"w":"pediatrician","jp":"小児科医","tier":"B","ref":"頻度表外","note_html":"<code>see a pediatrician</code>。英国式は paediatrician。"},{"w":"meteorologist","jp":"気象学者、気象予報士","tier":"B","ref":"頻度表外","note_html":"<code>the local meteorologist</code>。weather forecaster と同義。"},{"w":"mason","jp":"石工、れんが職人","tier":"B","ref":"頻度表外","note_html":"<code>hire a mason</code>。石材・れんがを扱う職人。"},{"w":"locksmith","jp":"錠前屋、鍵師","tier":"B","ref":"頻度表外","note_html":"<code>call a locksmith</code>。lock（錠）＋smith（職人）。"}],"translation":"眼鏡技師と小児科医が新しい医療センターに開業しました。地元の気象予報士が催しで講演し、改修工事のために石工と鍵師が雇われました。","html":"An <b class=\"tg\">optician</b> and a <b class=\"tg\">pediatrician</b> have opened offices in the new medical center. The local <b class=\"tg\">meteorologist</b> will speak at the fair, and a <b class=\"tg\">mason</b> and a <b class=\"tg\">locksmith</b> have been hired for the renovation.","part":9},{"id":171,"theme":"品質・水準","words":[{"w":"impeccable","jp":"申し分のない、非の打ちどころのない","tier":"B","ref":"頻度表外","note_html":"<code>an impeccable record / reputation</code>。flawless の言い換え。"},{"w":"exemplary","jp":"模範的な","tier":"B","ref":"頻度表外","note_html":"<code>exemplary service / conduct</code>。名詞 example から。"},{"w":"obsolete","jp":"時代遅れの、廃れた","tier":"B","ref":"頻度表外","note_html":"<code>The software is now obsolete.</code>。outdated より強く「もう使われない」の意。"},{"w":"optimal","jp":"最適な","tier":"B","ref":"頻度表外","note_html":"<code>the optimal replacement / solution</code>。名詞 optimum、動詞 optimize。"},{"w":"intact","jp":"そのままの、無傷の","tier":"B","ref":"頻度表外","note_html":"<code>keep the data intact</code>、<code>remain intact</code>。叙述用法が中心。"}],"translation":"検査官は、その厨房の記録を申し分のないもの、職員の対応を模範的なものと評しました。旧来のソフトウェアは現在では時代遅れですが、最適な後継製品は既存のデータをそのまま保持できるものでなければなりません。","html":"The inspector described the kitchen&#x27;s record as <b class=\"tg\">impeccable</b> and the staff&#x27;s service as <b class=\"tg\">exemplary</b>. The older software is now <b class=\"tg\">obsolete</b>, but the <b class=\"tg\">optimal</b> replacement must keep the existing data <b class=\"tg\">intact</b>.","part":9},{"id":172,"theme":"道路・歩行者","words":[{"w":"pavement","jp":"舗装、歩道","tier":"B","ref":"頻度表外","note_html":"<code>repairs to the pavement</code>。米国では車道の舗装面、英国では歩道を指す。"},{"w":"crosswalk","jp":"横断歩道","tier":"B","ref":"頻度表外","note_html":"<code>near the crosswalk</code>。英国式は pedestrian crossing。"},{"w":"detour","jp":"迂回路","tier":"B","ref":"頻度表外","note_html":"<code>follow the marked detour</code>、<code>take a detour</code>。工事の告知で頻出。"},{"w":"lamppost","jp":"街灯柱","tier":"B","ref":"頻度表外","note_html":"<code>a damaged lamppost at the corner</code>。Part 1の屋外描写に出る。"},{"w":"curb","jp":"縁石、歩道の縁","tier":"B","ref":"頻度表外","note_html":"<code>park along the curb</code>。動詞では「抑制する」（<code>curb spending</code>）。"}],"translation":"横断歩道付近の舗装の補修が月曜日に始まるため、運転者は表示された迂回路に従ってください。角の破損した街灯柱は交換され、配送車は縁石沿いに駐車してはいけません。","html":"Repairs to the <b class=\"tg\">pavement</b> near the <b class=\"tg\">crosswalk</b> will begin Monday, so drivers should follow the marked <b class=\"tg\">detour</b>. A damaged <b class=\"tg\">lamppost</b> at the corner will be replaced, and delivery vans must not park along the <b class=\"tg\">curb</b>.","part":9},{"id":173,"theme":"会議・意見","words":[{"w":"compelling","jp":"説得力のある、心を引きつける","tier":"B","ref":"頻度表外","note_html":"<code>a compelling case / argument / story</code>。"},{"w":"compel","jp":"強いる、余儀なくさせる","tier":"B","ref":"頻度表外","note_html":"<code>compel someone to do ~</code>。force の格式ばった語。"},{"w":"counterpart","jp":"対応する人、同等の相手","tier":"B","ref":"頻度表外","note_html":"<code>our counterpart in Osaka</code>。他部署・他社の同じ立場の人を指す。"},{"w":"critique","jp":"批評、講評","tier":"B","ref":"頻度表外","note_html":"<code>submit a detailed critique</code>。criticism より中立的で、分析的な講評を指す。"},{"w":"conversely","jp":"逆に、反対に","tier":"B","ref":"頻度表外","note_html":"<code>Conversely, the Nagoya office ~</code>。前文と逆の事実を導く接続副詞。"}],"translation":"コンサルタントはその支店の閉鎖について説得力のある主張を展開しましたが、取締役会に実行を強いるものは何もありません。大阪の担当者は詳細な講評を提出しましたが、逆に名古屋の事業所からは異議が出ませんでした。","html":"The consultant made a <b class=\"tg\">compelling</b> case for closing the branch, though nothing can <b class=\"tg\">compel</b> the board to act. Our <b class=\"tg\">counterpart</b> in Osaka submitted a detailed <b class=\"tg\">critique</b>; <b class=\"tg\">conversely</b>, the Nagoya office raised no objections.","part":9},{"id":174,"theme":"天候・遅延","words":[{"w":"inclement weather","jp":"悪天候","tier":"B","ref":"頻度表外","note_html":"<code>Inclement weather delayed ~</code>。天候による遅延・中止の告知で使われる定型。"},{"w":"harsh","jp":"厳しい、過酷な","tier":"B","ref":"頻度表外","note_html":"<code>harsh conditions / weather / criticism</code>。severe の言い換え。"},{"w":"moisture","jp":"湿気、水分","tier":"B","ref":"頻度表外","note_html":"不可算名詞。<code>High moisture damaged ~</code>。形容詞 moist。"},{"w":"humidifier","jp":"加湿器","tier":"B","ref":"頻度表外","note_html":"<code>remove a humidifier</code>。反対の機器は dehumidifier（除湿機）。"},{"w":"notification","jp":"通知","tier":"B","ref":"頻度表外","note_html":"<code>a notification was sent to ~</code>。動詞 notify（<code>notify someone of ~</code>）。"}],"translation":"悪天候により出荷が遅れ、週末は過酷な状況が予報されています。高い湿気が在庫の一部を傷めたため、加湿器が保管室から撤去され、全顧客に通知が送られました。","html":"<b class=\"tg\">Inclement weather</b> delayed the shipment, and <b class=\"tg\">harsh</b> conditions are forecast for the weekend. High <b class=\"tg\">moisture</b> damaged part of the stock, so a <b class=\"tg\">humidifier</b> was removed from the storeroom, and a <b class=\"tg\">notification</b> was sent to all clients.","part":9},{"id":175,"theme":"後任人事","words":[{"w":"narrow down","jp":"絞り込む","tier":"追加","ref":"ランク表外","note_html":"<code>narrow down the list / the options / the candidates</code>。選択肢を減らしていく動作。"},{"w":"replacement","jp":"後継者、後任","tier":"S","ref":"TSL 82","note_html":"<code>the director&#x27;s replacement</code>、<code>hire a replacement</code>。「交換品」の語義が有名だが、**人に対して「後任」**の意味でもよく出る。"},{"w":"well-rounded","jp":"多方面に優れた、バランスの取れた","tier":"追加","ref":"ランク表外","note_html":"<code>a well-rounded manager / education</code>。特定分野に偏らない能力を指す。"},{"w":"hold a position","jp":"職に就いている","tier":"追加","ref":"ランク表外","note_html":"<code>has held a position overseas</code>。post、role でも同じ形が使える。"},{"w":"credentials","jp":"実績、資格","tier":"B","ref":"頻度表外","note_html":"<code>review each applicant&#x27;s credentials</code>。学位・免許だけでなく**職歴を含む「実績」全般**を指す。通常は複数形。"}],"translation":"委員会は金曜日までに、部長の後任候補の一覧を絞り込みます。海外で職に就いた経験のある、多方面に優れた管理職を求めており、各応募者の実績は個別に審査されます。","html":"The committee will <b class=\"tg\">narrow down</b> the list of candidates for the director&#x27;s <b class=\"tg\">replacement</b> by Friday. We are looking for a <b class=\"tg\">well-rounded</b> manager who has <b class=\"tg\">held a position</b> overseas, and each applicant&#x27;s <b class=\"tg\">credentials</b> will be reviewed individually.","part":9},{"id":176,"theme":"応募者の評価","words":[{"w":"postgraduate","jp":"大学院の","tier":"追加","ref":"ランク表外","note_html":"<code>a postgraduate degree / program</code>。米国式では graduate school という。"},{"w":"meticulous","jp":"細部まで行き届いた、几帳面な","tier":"追加","ref":"ランク表外","note_html":"<code>meticulous record keeping</code>、<code>meticulously prepared</code>。careful の最上級的な語。"},{"w":"set ~ apart","jp":"〜を際立たせる、他と区別する","tier":"追加","ref":"ランク表外","note_html":"<code>Her record set her apart from the others.</code>。目的語を間に挟む。distinguish の言い換え。"},{"w":"underprepared","jp":"準備不足の","tier":"追加","ref":"ランク表外","note_html":"<code>The candidate seemed underprepared.</code>。under-（不足）＋prepared。"},{"w":"entrust","jp":"委託する、任せる","tier":"追加","ref":"ランク表外","note_html":"<code>entrust the account to her</code>、<code>entrust her with the account</code>。**2つの語順**があり、前置詞が to / with で入れ替わる点が問われる。"}],"translation":"レイエスさんは物流の大学院学位を持ち、その几帳面な記録管理が他の応募者から彼女を際立たせました。最初の候補者は準備不足に見えたため、取締役会は代わりに彼女にその取引先を任せることを決めました。","html":"Ms. Reyes holds a <b class=\"tg\">postgraduate</b> degree in logistics, and her <b class=\"tg\">meticulous</b> record keeping <b class=\"tg\">set</b> her <b class=\"tg\">apart</b> from the other applicants. The first candidate seemed <b class=\"tg\">underprepared</b>, so the board decided to <b class=\"tg\">entrust</b> the account to her instead.","part":9},{"id":177,"theme":"会議での賛否","words":[{"w":"pro","jp":"賛成、賛成論","tier":"追加","ref":"ランク表外","note_html":"通常は複数形。<code>the pros and cons</code>（賛否両論、利点と欠点）。"},{"w":"con","jp":"反対、反対論","tier":"追加","ref":"ランク表外","note_html":"<code>list the cons</code>。pro と対で用いるのが定型で、単独ではあまり使わない。"},{"w":"remark on","jp":"〜について感想を述べる、言及する","tier":"追加","ref":"ランク表外","note_html":"<code>remarked on the cost</code>。on が必須。名詞 remark（発言）。"},{"w":"by all means","jp":"ぜひとも、どうぞ","tier":"追加","ref":"ランク表外","note_html":"<code>By all means, ask for a copy.</code>。相手の申し出を快く承諾する定型表現。"},{"w":"have a word with","jp":"〜と少し話をする","tier":"追加","ref":"ランク表外","note_html":"<code>have a word with the treasurer</code>。**a word** と単数なのが要点。複数形 words にすると「口論する」の意になる。"}],"translation":"採決の前に、工場移転の賛成論と反対論を挙げてください。数名の委員が費用について感想を述べました。数値をご覧になりたい場合は、ぜひ写しをご請求いただくか、会計担当と直接お話しください。","html":"Before the vote, please list the <b class=\"tg\">pros</b> and the <b class=\"tg\">cons</b> of relocating the plant. Several members <b class=\"tg\">remarked on</b> the cost, and if you would like to see the figures, <b class=\"tg\">by all means</b> ask for a copy — or <b class=\"tg\">have a word with</b> the treasurer directly.","part":9},{"id":178,"theme":"施設案内","words":[{"w":"floor plan","jp":"見取り図、間取り図","tier":"追加","ref":"ランク表外","note_html":"<code>according to the floor plan</code>。不動産広告や社内案内で頻出。"},{"w":"east wing","jp":"東棟、東翼","tier":"追加","ref":"ランク表外","note_html":"<code>the meeting rooms are in the east wing</code>。wing は建物から張り出した棟を指す。"},{"w":"patio","jp":"中庭、テラス","tier":"B","ref":"頻度表外","note_html":"<code>lunch will be served on the patio</code>。前置詞は on。"},{"w":"put up","jp":"掲示する、掲げる","tier":"追加","ref":"ランク表外","note_html":"<code>put up the schedule / a notice / a sign</code>。「建てる」「宿泊させる」の語義もある。"},{"w":"upper management","jp":"上層部、経営幹部","tier":"追加","ref":"ランク表外","note_html":"<code>so that upper management can see it</code>。senior management と同義。"}],"translation":"見取り図によれば、会議室は東棟にあり、昼食は中庭で提供されます。経営幹部が見られるよう、改訂版の予定表をエレベーター付近に掲示してください。","html":"According to the <b class=\"tg\">floor plan</b>, the meeting rooms are in the <b class=\"tg\">east wing</b>, and lunch will be served on the <b class=\"tg\">patio</b>. Please <b class=\"tg\">put up</b> the revised schedule near the elevator so that <b class=\"tg\">upper management</b> can see it.","part":9},{"id":179,"theme":"広告・出版","words":[{"w":"publishing house","jp":"出版社","tier":"追加","ref":"ランク表外","note_html":"<code>The publishing house decided to ~</code>。publisher と同義。"},{"w":"run","jp":"広告を出す、掲載する","ti
