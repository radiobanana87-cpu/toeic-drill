and pans** must be washed by hand rather than in the **dishwasher**.","words":[{"w":"entrée","jp":"主菜、メインディッシュ","note":"`recommend the seafood entrée`。米国では主菜、フランス語では前菜を指す。","tier":"A","ref":"TSL 714","note_html":"<code>recommend the seafood entrée</code>。米国では主菜、フランス語では前菜を指す。"},{"w":"authentic","jp":"本格的な、本物の","note":"`an authentic regional sauce`、`authentic cuisine`。名詞 authenticity。","tier":"A","ref":"TSL 753","note_html":"<code>an authentic regional sauce</code>、<code>authentic cuisine</code>。名詞 authenticity。"},{"w":"spill","jp":"こぼす／こぼれ","note":"`If you spill anything ~`、`a spill on the floor`。名詞・動詞の両用法。","tier":"A","ref":"TSL 743","note_html":"<code>If you spill anything ~</code>、<code>a spill on the floor</code>。名詞・動詞の両用法。"},{"w":"pots and pans","jp":"鍋類","note":"`wash the pots and pans by hand`。決まった組み合わせの表現。","tier":"A","ref":"TSL 728","note_html":"<code>wash the pots and pans by hand</code>。決まった組み合わせの表現。"},{"w":"dishwasher","jp":"食器洗い機、皿洗い係","note":"`in the dishwasher`。機械と人の両方を指す。","tier":"A","ref":"TSL 711","note_html":"<code>in the dishwasher</code>。機械と人の両方を指す。"}],"translation":"シェフのおすすめは魚介の主菜で、本格的な郷土のソースを使っています。何かこぼした場合は給仕にお伝えください。なお、鍋類は食器洗い機ではなく手洗いする必要があります。","html":"The chef recommends the seafood <b class=\"tg\">entrée</b>, which uses an <b class=\"tg\">authentic</b> regional sauce. If you <b class=\"tg\">spill</b> anything, tell a server, and note that the <b class=\"tg\">pots and pans</b> must be washed by hand rather than in the <b class=\"tg\">dishwasher</b>."},{"id":132,"vol":7,"theme":"車両・道路","sentence":"A truck blocking the **walkway** had to be **towed**, and drivers were charged a **toll** on the bridge. Store small items in the overhead **compartment**, and use the upper **deck** for oversized luggage.","words":[{"w":"walkway","jp":"歩道、通路","note":"`block the walkway`、`a covered walkway`。屋内外の歩行用通路を指す。","tier":"A","ref":"TSL 800","note_html":"<code>block the walkway</code>、<code>a covered walkway</code>。屋内外の歩行用通路を指す。"},{"w":"tow","jp":"けん引する","note":"`The truck had to be towed.`、`a tow truck`（レッカー車）。発音は /toʊ/。","tier":"A","ref":"TSL 692","note_html":"<code>The truck had to be towed.</code>、<code>a tow truck</code>（レッカー車）。発音は /toʊ/。"},{"w":"toll","jp":"通行料","note":"`charge a toll`、`a toll road / booth`。「犠牲・被害」の意味もある。","tier":"A","ref":"TSL 797","note_html":"<code>charge a toll</code>、<code>a toll road / booth</code>。「犠牲・被害」の意味もある。"},{"w":"compartment","jp":"区画、収納棚","note":"`the overhead compartment`（頭上の物入れ）、`a luggage compartment`。","tier":"A","ref":"TSL 756","note_html":"<code>the overhead compartment</code>（頭上の物入れ）、<code>a luggage compartment</code>。"},{"w":"deck","jp":"甲板、階層","note":"`the upper deck`、`a sun deck`。船・バス・建物のいずれにも使う。","tier":"A","ref":"TSL 672","note_html":"<code>the upper deck</code>、<code>a sun deck</code>。船・バス・建物のいずれにも使う。"}],"translation":"歩道をふさいでいたトラックはレッカー移動され、運転手は橋の通行料を請求されました。小さな荷物は頭上の物入れに収納し、大型の荷物には上のデッキをご利用ください。","html":"A truck blocking the <b class=\"tg\">walkway</b> had to be <b class=\"tg\">towed</b>, and drivers were charged a <b class=\"tg\">toll</b> on the bridge. Store small items in the overhead <b class=\"tg\">compartment</b>, and use the upper <b class=\"tg\">deck</b> for oversized luggage."},{"id":133,"vol":7,"theme":"天候・環境","sentence":"High **humidity** makes the storage room **uncomfortable**, and **excessive** heat can damage the stock. Demand for our fans is **seasonal**, and the units are produced **locally**.","words":[{"w":"humidity","jp":"湿度、湿気","note":"`high humidity`、`temperature and humidity`。形容詞 humid、名詞 humidifier。","tier":"A","ref":"TSL 777","note_html":"<code>high humidity</code>、<code>temperature and humidity</code>。形容詞 humid、名詞 humidifier。"},{"w":"uncomfortable","jp":"不快な、居心地の悪い","note":"`makes the room uncomfortable`。反意語 comfortable。","tier":"A","ref":"TSL 844","note_html":"<code>makes the room uncomfortable</code>。反意語 comfortable。"},{"w":"excessive","jp":"過度の、行き過ぎた","note":"`excessive heat / noise / spending`。名詞 excess、動詞 exceed。","tier":"A","ref":"TSL 634","note_html":"<code>excessive heat / noise / spending</code>。名詞 excess、動詞 exceed。"},{"w":"seasonal","jp":"季節的な","note":"`Demand is seasonal.`、`seasonal workers`（季節労働者）。名詞 season。","tier":"A","ref":"TSL 618","note_html":"<code>Demand is seasonal.</code>、<code>seasonal workers</code>（季節労働者）。名詞 season。"},{"w":"locally","jp":"地元で","note":"`produced locally`、`locally grown`。形容詞 local。","tier":"A","ref":"TSL 606","note_html":"<code>produced locally</code>、<code>locally grown</code>。形容詞 local。"}],"translation":"高い湿度が保管室を不快にしており、過度の暑さは在庫品を傷めるおそれがあります。当社の扇風機の需要は季節的なもので、製品は地元で生産されています。","html":"High <b class=\"tg\">humidity</b> makes the storage room <b class=\"tg\">uncomfortable</b>, and <b class=\"tg\">excessive</b> heat can damage the stock. Demand for our fans is <b class=\"tg\">seasonal</b>, and the units are produced <b class=\"tg\">locally</b>."},{"id":134,"vol":7,"theme":"品質・評価","sentence":"The service has been **consistently** rated as **satisfactory**, but the dessert menu is **exceptional**. Our pastry chef trained under a **renowned** baker in Vienna and works **exceptionally** quickly.","words":[{"w":"consistently","jp":"一貫して、常に","note":"`consistently rated as ~`。形容詞 consistent、名詞 consistency。","tier":"A","ref":"TSL 670","note_html":"<code>consistently rated as ~</code>。形容詞 consistent、名詞 consistency。"},{"w":"satisfactory","jp":"満足のいく、可もなく不可もない","note":"`rated as satisfactory`。「合格水準だが特別ではない」という含みがある。","tier":"A","ref":"TSL 617","note_html":"<code>rated as satisfactory</code>。「合格水準だが特別ではない」という含みがある。"},{"w":"exceptional","jp":"例外的に優れた","note":"`The dessert menu is exceptional.`、`exceptional service`。名詞 exception。","tier":"A","ref":"TSL 677","note_html":"<code>The dessert menu is exceptional.</code>、<code>exceptional service</code>。名詞 exception。"},{"w":"renowned","jp":"名高い、著名な","note":"`a renowned baker`、`renowned for ~`。famous の格式ばった語。","tier":"A","ref":"TSL 648","note_html":"<code>a renowned baker</code>、<code>renowned for ~</code>。famous の格式ばった語。"},{"w":"exceptionally","jp":"並外れて、非常に","note":"`works exceptionally quickly`。形容詞・副詞を強める用法が中心。","tier":"A","ref":"TSL 677","note_html":"<code>works exceptionally quickly</code>。形容詞・副詞を強める用法が中心。"}],"translation":"そのサービスは一貫して満足のいく水準と評価されていますが、デザートのメニューは格別です。当店のパティシエはウィーンの著名なパン職人のもとで修業し、並外れて手際よく仕事をします。","html":"The service has been <b class=\"tg\">consistently</b> rated as <b class=\"tg\">satisfactory</b>, but the dessert menu is <b class=\"tg\">exceptional</b>. Our pastry chef trained under a <b class=\"tg\">renowned</b> baker in Vienna and works <b class=\"tg\">exceptionally</b> quickly."},{"id":135,"vol":7,"theme":"研修制度","sentence":"Our **mentoring program** offers an **introductory** course for anyone who is a complete **beginner**. If you are **hesitant** to sign up, you may **opt** for the shorter online version instead.","words":[{"w":"mentoring program","jp":"指導制度、メンター制度","note":"`Our mentoring program offers ~`。名詞 mentor、mentee。","tier":"A","ref":"TSL 607","note_html":"<code>Our mentoring program offers ~</code>。名詞 mentor、mentee。"},{"w":"introductory","jp":"入門の、導入の","note":"`an introductory course / offer / price`。動詞 introduce、名詞 introduction。","tier":"A","ref":"TSL 723","note_html":"<code>an introductory course / offer / price</code>。動詞 introduce、名詞 introduction。"},{"w":"beginner","jp":"初心者","note":"`a complete beginner`。動詞 begin。novice の言い換え。","tier":"A","ref":"TSL 849","note_html":"<code>a complete beginner</code>。動詞 begin。novice の言い換え。"},{"w":"hesitant","jp":"ためらっている","note":"`be hesitant to sign up`。後ろは to 不定詞。動詞 hesitate、名詞 hesitation。","tier":"A","ref":"TSL 825","note_html":"<code>be hesitant to sign up</code>。後ろは to 不定詞。動詞 hesitate、名詞 hesitation。"},{"w":"opt","jp":"選ぶ","note":"`opt for the shorter version`、`opt to do ~`。形容詞 optional、名詞 option。","tier":"A","ref":"TSL 609","note_html":"<code>opt for the shorter version</code>、<code>opt to do ~</code>。形容詞 optional、名詞 option。"}],"translation":"当社の指導制度では、まったくの初心者向けに入門講座を用意しています。申し込みをためらっている方は、代わりに短時間のオンライン版を選ぶこともできます。","html":"Our <b class=\"tg\">mentoring program</b> offers an <b class=\"tg\">introductory</b> course for anyone who is a complete <b class=\"tg\">beginner</b>. If you are <b class=\"tg\">hesitant</b> to sign up, you may <b class=\"tg\">opt</b> for the shorter online version instead."},{"id":136,"vol":7,"theme":"組織・効率化","sentence":"To **maximize** output, the director revised the **allocation** of staff across three teams. The **organizational** change also gives more room for **creativity**, and a course in **entrepreneurship** will be offered.","words":[{"w":"maximize","jp":"最大化する","note":"`maximize output / profit`。反意語 minimize。名詞 maximum。","tier":"A","ref":"TSL 639","note_html":"<code>maximize output / profit</code>。反意語 minimize。名詞 maximum。"},{"w":"allocation","jp":"配分、割り当て","note":"`the allocation of staff`、`budget allocation`。動詞 allocate。","tier":"A","ref":"TSL 699","note_html":"<code>the allocation of staff</code>、<code>budget allocation</code>。動詞 allocate。"},{"w":"organizational","jp":"組織の、組織上の","note":"`an organizational change / chart`。名詞 organization、動詞 organize。","tier":"A","ref":"TSL 833","note_html":"<code>an organizational change / chart</code>。名詞 organization、動詞 organize。"},{"w":"creativity","jp":"創造性","note":"`room for creativity`。形容詞 creative、動詞 create。","tier":"A","ref":"TSL 762","note_html":"<code>room for creativity</code>。形容詞 creative、動詞 create。"},{"w":"entrepreneurship","jp":"起業家精神、起業","note":"`a course in entrepreneurship`。名詞 entrepreneur。","tier":"A","ref":"TSL 676","note_html":"<code>a course in entrepreneurship</code>。名詞 entrepreneur。"}],"translation":"生産量を最大化するため、部長は3つのチーム間での人員配分を見直しました。この組織上の変更は創造性を発揮する余地も広げるもので、起業に関する講座も開講される予定です。","html":"To <b class=\"tg\">maximize</b> output, the director revised the <b class=\"tg\">allocation</b> of staff across three teams. The <b class=\"tg\">organizational</b> change also gives more room for <b class=\"tg\">creativity</b>, and a course in <b class=\"tg\">entrepreneurship</b> will be offered."},{"id":137,"vol":7,"theme":"郵便・配送","sentence":"The **postal** service returned the envelope because the address label had begun to **detach**. We have written **repeatedly** and now need the signed form **urgently**, so a **timely** reply would be appreciated.","words":[{"w":"postal","jp":"郵便の","note":"`the postal service`、`postal code`（郵便番号）。名詞 postage、post。","tier":"A","ref":"TSL 783","note_html":"<code>the postal service</code>、<code>postal code</code>（郵便番号）。名詞 postage、post。"},{"w":"detach","jp":"はがれる、取り外す","note":"`The label had begun to detach.`、`detach the coupon`。反意語 attach。","tier":"A","ref":"TSL 674","note_html":"<code>The label had begun to detach.</code>、<code>detach the coupon</code>。反意語 attach。"},{"w":"repeatedly","jp":"繰り返し、何度も","note":"`We have written repeatedly.`。動詞 repeat、名詞 repetition。","tier":"A","ref":"TSL 787","note_html":"<code>We have written repeatedly.</code>。動詞 repeat、名詞 repetition。"},{"w":"urgently","jp":"緊急に、至急","note":"`need the form urgently`。形容詞 urgent、名詞 urgency。","tier":"A","ref":"TSL 799","note_html":"<code>need the form urgently</code>。形容詞 urgent、名詞 urgency。"},{"w":"timely","jp":"時宜を得た、タイミングのよい","note":"`a timely reply`。**-ly で終わるが形容詞**である点が狙われる。","tier":"A","ref":"TSL 843","note_html":"<code>a timely reply</code>。**-ly で終わるが形容詞**である点が狙われる。"}],"translation":"宛名ラベルがはがれかけていたため、郵便局が封筒を返送してきました。当方から繰り返し書面を送っており、署名済みの用紙が至急必要ですので、早めのご返信をいただければ幸いです。","html":"The <b class=\"tg\">postal</b> service returned the envelope because the address label had begun to <b class=\"tg\">detach</b>. We have written <b class=\"tg\">repeatedly</b> and now need the signed form <b class=\"tg\">urgently</b>, so a <b class=\"tg\">timely</b> reply would be appreciated."},{"id":138,"vol":7,"theme":"清掃・手入れ","sentence":"Please **polish** the brass railing and wipe the glass **vase** on the front desk. The chair covers are **customizable**, and a heavier **fabric** would **ideally** last three seasons.","words":[{"w":"polish","jp":"磨く／つや出し剤","note":"`polish the brass railing`、`furniture polish`。比喩で「仕上げを整える」の意もある。","tier":"A","ref":"TSL 612","note_html":"<code>polish the brass railing</code>、<code>furniture polish</code>。比喩で「仕上げを整える」の意もある。"},{"w":"vase","jp":"花瓶","note":"`wipe the glass vase`。発音は米 /veɪs/。Part 1の室内描写に出る。","tier":"A","ref":"TSL 654","note_html":"<code>wipe the glass vase</code>。発音は米 /veɪs/。Part 1の室内描写に出る。"},{"w":"customizable","jp":"好みに合わせて変更できる","note":"`The chair covers are customizable.`。動詞 customize。","tier":"A","ref":"TSL 707","note_html":"<code>The chair covers are customizable.</code>。動詞 customize。"},{"w":"fabric","jp":"生地、布地","note":"`a heavier fabric`、`fabric samples`。cloth より産業・素材寄りの語。","tier":"A","ref":"TSL 821","note_html":"<code>a heavier fabric</code>、<code>fabric samples</code>。cloth より産業・素材寄りの語。"},{"w":"ideally","jp":"理想的には、できれば","note":"`would ideally last three seasons`。形容詞 ideal。","tier":"A","ref":"TSL 720","note_html":"<code>would ideally last three seasons</code>。形容詞 ideal。"}],"translation":"真鍮の手すりを磨き、フロントデスクのガラスの花瓶を拭いてください。椅子カバーは好みに合わせて変更でき、厚手の生地であれば理想的には3シーズンもつはずです。","html":"Please <b class=\"tg\">polish</b> the brass railing and wipe the glass <b class=\"tg\">vase</b> on the front desk. The chair covers are <b class=\"tg\">customizable</b>, and a heavier <b class=\"tg\">fabric</b> would <b class=\"tg\">ideally</b> last three seasons."},{"id":139,"vol":7,"theme":"予想外の事態","sentence":"An **unexpected** delay meant that we nearly **overlooked** the deadline. **Contrary to** the early reports, no data was lost; **on the contrary**, the backup worked perfectly, and the team was **relieved**.","words":[{"w":"unexpected","jp":"予期しない","note":"`an unexpected delay / guest`。副詞 unexpectedly。反意語 expected。","tier":"A","ref":"TSL 589","note_html":"<code>an unexpected delay / guest</code>。副詞 unexpectedly。反意語 expected。"},{"w":"overlook","jp":"見落とす／見渡す","note":"`nearly overlooked the deadline` と `a room overlooking the sea`（海を見渡す部屋）。正反対に見える2義があり頻出。","tier":"A","ref":"TSL 684","note_html":"<code>nearly overlooked the deadline</code> と <code>a room overlooking the sea</code>（海を見渡す部屋）。正反対に見える2義があり頻出。"},{"w":"contrary to","jp":"〜に反して","note":"`Contrary to the early reports, ~`。後ろは名詞句。","tier":"A","ref":"TSL 813","note_html":"<code>Contrary to the early reports, ~</code>。後ろは名詞句。"},{"w":"on the contrary","jp":"それどころか、逆に","note":"`On the contrary, the backup worked.`。前文を否定して逆を述べる。contrary to との使い分けが狙われる。","tier":"A","ref":"TSL 813","note_html":"<code>On the contrary, the backup worked.</code>。前文を否定して逆を述べる。contrary to との使い分けが狙われる。"},{"w":"relieved","jp":"ほっとした","note":"`The team was relieved.`、`be relieved to hear ~`。動詞 relieve、名詞 relief。","tier":"A","ref":"TSL 736","note_html":"<code>The team was relieved.</code>、<code>be relieved to hear ~</code>。動詞 relieve、名詞 relief。"}],"translation":"予期しない遅れにより、私たちは危うく締切を見落とすところでした。当初の報告に反してデータの損失はなく、それどころかバックアップは完璧に機能し、チームは安堵しました。","html":"An <b class=\"tg\">unexpected</b> delay meant that we nearly <b class=\"tg\">overlooked</b> the deadline. <b class=\"tg\">Contrary to</b> the early reports, no data was lost; <b class=\"tg\">on the contrary</b>, the backup worked perfectly, and the team was <b class=\"tg\">relieved</b>."},{"id":140,"vol":7,"theme":"新入社員の歓迎","sentence":"**Welcome aboard!** The training room is **conveniently** located beside the cafeteria, where we will **administer** a short placement test. Afterward, a **documentary** about the company's history will be shown, and the team is **eagerly** waiting to meet you.","words":[{"w":"Welcome aboard!","jp":"ようこそ、入社おめでとう","note":"新入社員やチームへの加入者を迎える定型のあいさつ。","tier":"A","ref":"TSL 655","note_html":"新入社員やチームへの加入者を迎える定型のあいさつ。"},{"w":"conveniently","jp":"便利に、都合よく","note":"`conveniently located beside ~`（〜の隣という便利な場所にある）が最頻出のかたち。","tier":"A","ref":"TSL 759","note_html":"<code>conveniently located beside ~</code>（〜の隣という便利な場所にある）が最頻出のかたち。"},{"w":"administer","jp":"実施する、管理する","note":"`administer a test`、`administer a program`。名詞 administration、administrator。","tier":"A","ref":"TSL 802","note_html":"<code>administer a test</code>、<code>administer a program</code>。名詞 administration、administrator。"},{"w":"documentary","jp":"記録映画、ドキュメンタリー","note":"`a documentary about the company's history`。document（文書）から。","tier":"A","ref":"TSL 630","note_html":"<code>a documentary about the company&#x27;s history</code>。document（文書）から。"},{"w":"eagerly","jp":"熱心に、心待ちに","note":"`eagerly waiting to meet you`、`eagerly anticipated`。形容詞 eager。","tier":"A","ref":"TSL 598","note_html":"<code>eagerly waiting to meet you</code>、<code>eagerly anticipated</code>。形容詞 eager。"}],"translation":"ご入社おめでとうございます。研修室は社員食堂の隣という便利な場所にあり、そこで簡単な適性テストを実施します。その後、会社の歴史に関する記録映像を上映します。チーム一同、お会いできるのを心待ちにしています。","html":"<b class=\"tg\">Welcome aboard!</b> The training room is <b class=\"tg\">conveniently</b> located beside the cafeteria, where we will <b class=\"tg\">administer</b> a short placement test. Afterward, a <b class=\"tg\">documentary</b> about the company&#x27;s history will be shown, and the team is <b class=\"tg\">eagerly</b> waiting to meet you."},{"id":141,"vol":8,"theme":"遠隔会議","sentence":"The **chairperson** will join by **videoconference** and **convey** the board's decision. Please forward any **incoming** questions to the **departmental** representative before noon.","words":[{"w":"chairperson","jp":"議長、委員長","note":"`The chairperson will join ~`。chairman の性別中立形で、公式文書ではこちらが使われる。","tier":"A","ref":"TSL 852","note_html":"<code>The chairperson will join ~</code>。chairman の性別中立形で、公式文書ではこちらが使われる。"},{"w":"videoconference","jp":"テレビ会議","note":"`join by videoconference`、`hold a videoconference`。teleconference（電話会議）と区別する。","tier":"A","ref":"TSL 1250","note_html":"<code>join by videoconference</code>、<code>hold a videoconference</code>。teleconference（電話会議）と区別する。"},{"w":"convey","jp":"伝える、運ぶ","note":"`convey the board's decision`、`convey goods`。「意思を伝達する」の意で頻出。","tier":"A","ref":"TSL 898","note_html":"<code>convey the board&#x27;s decision</code>、<code>convey goods</code>。「意思を伝達する」の意で頻出。"},{"w":"incoming","jp":"入ってくる、着任予定の","note":"`incoming questions / calls / president`（次期社長）。反意語 outgoing。","tier":"A","ref":"TSL 1222","note_html":"<code>incoming questions / calls / president</code>（次期社長）。反意語 outgoing。"},{"w":"departmental","jp":"部門の、学科の","note":"`the departmental representative`、`a departmental meeting`。名詞 department。","tier":"A","ref":"TSL 1118","note_html":"<code>the departmental representative</code>、<code>a departmental meeting</code>。名詞 department。"}],"translation":"議長はテレビ会議で参加し、取締役会の決定を伝えます。届いた質問は正午までに部門の担当者に転送してください。","html":"The <b class=\"tg\">chairperson</b> will join by <b class=\"tg\">videoconference</b> and <b class=\"tg\">convey</b> the board&#x27;s decision. Please forward any <b class=\"tg\">incoming</b> questions to the <b class=\"tg\">departmental</b> representative before noon."},{"id":142,"vol":8,"theme":"障害・中断","sentence":"A power **outage** will **disrupt** the network for two hours, and the noise from the repairs may be **disruptive**. If the problem should **recur**, move the team upstairs, where there is less **distraction**.","words":[{"w":"outage","jp":"供給停止、停電","note":"`a power outage`、`a service outage`。out（外へ）＋-age。","tier":"A","ref":"TSL 1156","note_html":"<code>a power outage</code>、<code>a service outage</code>。out（外へ）＋-age。"},{"w":"disrupt","jp":"混乱させる、中断させる","note":"`disrupt the network / traffic`。名詞 disruption。","tier":"A","ref":"TSL 861","note_html":"<code>disrupt the network / traffic</code>。名詞 disruption。"},{"w":"disruptive","jp":"混乱を招く、妨げになる","note":"`The noise may be disruptive.`。物・事の性質を表す形容詞。","tier":"A","ref":"TSL 861","note_html":"<code>The noise may be disruptive.</code>。物・事の性質を表す形容詞。"},{"w":"recur","jp":"再発する、繰り返し起こる","note":"`If the problem should recur ~`。過去形は recurred。形容詞 recurring。","tier":"A","ref":"TSL 872","note_html":"<code>If the problem should recur ~</code>。過去形は recurred。形容詞 recurring。"},{"w":"distraction","jp":"気を散らすもの、注意散漫","note":"`less distraction`、`a source of distraction`。動詞 distract。","tier":"A","ref":"TSL 904","note_html":"<code>less distraction</code>、<code>a source of distraction</code>。動詞 distract。"}],"translation":"停電により2時間ネットワークが遮断され、修理の騒音も業務の妨げになるかもしれません。万一その問題が再発した場合は、気の散る要素が少ない上の階へチームを移動させてください。","html":"A power <b class=\"tg\">outage</b> will <b class=\"tg\">disrupt</b> the network for two hours, and the noise from the repairs may be <b class=\"tg\">disruptive</b>. If the problem should <b class=\"tg\">recur</b>, move the team upstairs, where there is less <b class=\"tg\">distraction</b>."},{"id":143,"vol":8,"theme":"信頼性・精度","sentence":"The older scanner is **dependable**, but its **accuracy** drops in cold weather. One sensor is **flawed** and works only **partially**, so our **dependence** on a single unit is risky.","words":[{"w":"dependable","jp":"信頼できる","note":"`a dependable scanner / employee`。reliable の言い換え。","tier":"A","ref":"TSL 858","note_html":"<code>a dependable scanner / employee</code>。reliable の言い換え。"},{"w":"accuracy","jp":"正確さ、精度","note":"`accuracy drops`、`improve accuracy`。形容詞 accurate、副詞 accurately。","tier":"A","ref":"TSL 1098","note_html":"<code>accuracy drops</code>、<code>improve accuracy</code>。形容詞 accurate、副詞 accurately。"},{"w":"flawed","jp":"欠陥のある","note":"`One sensor is flawed.`、`a flawed design`。名詞 flaw、反意語 flawless。","tier":"A","ref":"TSL 1049","note_html":"<code>One sensor is flawed.</code>、<code>a flawed design</code>。名詞 flaw、反意語 flawless。"},{"w":"partially","jp":"部分的に","note":"`works only partially`。形容詞 partial、反意語 completely / fully。","tier":"A","ref":"TSL 1159","note_html":"<code>works only partially</code>。形容詞 partial、反意語 completely / fully。"},{"w":"dependence","jp":"依存","note":"`our dependence on a single unit`。**on** が続く。動詞 depend on、形容詞 dependent。","tier":"A","ref":"TSL 903","note_html":"<code>our dependence on a single unit</code>。**on** が続く。動詞 depend on、形容詞 dependent。"}],"translation":"旧型のスキャナーは信頼できますが、寒冷時には精度が落ちます。センサーの1つに欠陥があり部分的にしか作動しないため、1台の機器への依存は危険です。","html":"The older scanner is <b class=\"tg\">dependable</b>, but its <b class=\"tg\">accuracy</b> drops in cold weather. One sensor is <b class=\"tg\">flawed</b> and works only <b class=\"tg\">partially</b>, so our <b class=\"tg\">dependence</b> on a single unit is risky."},{"id":144,"vol":8,"theme":"商取引・小売","sentence":"Local **commerce** has grown since the car **dealership** opened on Main Street. A **merchant** who buys in **bulk** may pay by **debit card** at the counter.","words":[{"w":"commerce","jp":"商業、通商","note":"`local commerce`、`e-commerce`、`the Chamber of Commerce`（商工会議所）。不可算名詞。","tier":"A","ref":"TSL 897","note_html":"<code>local commerce</code>、<code>e-commerce</code>、<code>the Chamber of Commerce</code>（商工会議所）。不可算名詞。"},{"w":"dealership","jp":"販売代理店、特約店","note":"`a car dealership`。dealer（販売業者）＋-ship。","tier":"A","ref":"TSL 857","note_html":"<code>a car dealership</code>。dealer（販売業者）＋-ship。"},{"w":"merchant","jp":"商人、小売業者","note":"`a merchant who buys in bulk`。形容詞的に `a merchant ship`（商船）。","tier":"A","ref":"TSL 925","note_html":"<code>a merchant who buys in bulk</code>。形容詞的に <code>a merchant ship</code>（商船）。"},{"w":"bulk","jp":"大量、大部分","note":"`buy in bulk`、`the bulk of the work`（仕事の大半）。2用法とも出る。","tier":"A","ref":"TSL 1032","note_html":"<code>buy in bulk</code>、<code>the bulk of the work</code>（仕事の大半）。2用法とも出る。"},{"w":"debit card","jp":"デビットカード","note":"`pay by debit card`。credit card と対で、支払い方法の選択肢として登場する。","tier":"A","ref":"TSL 901","note_html":"<code>pay by debit card</code>。credit card と対で、支払い方法の選択肢として登場する。"}],"translation":"メインストリートに自動車販売代理店が開業して以来、地域の商業は活発になりました。大量に仕入れる小売業者は、カウンターでデビットカードでの支払いが可能です。","html":"Local <b class=\"tg\">commerce</b> has grown since the car <b class=\"tg\">dealership</b> opened on Main Street. A <b class=\"tg\">merchant</b> who buys in <b class=\"tg\">bulk</b> may pay by <b class=\"tg\">debit card</b> at the counter."},{"id":145,"vol":8,"theme":"縫製・生地","sentence":"A **tailor** will **sew** the lining by hand because the silk is too **delicate** for the **sewing machine**. Spread the padding **evenly** before you begin.","words":[{"w":"tailor","jp":"仕立屋／仕立てる、合わせる","note":"`a tailor will sew ~`、`tailor the program to your needs`（要望に合わせる）。動詞用法も頻出。","tier":"A","ref":"TSL 948","note_html":"<code>a tailor will sew ~</code>、<code>tailor the program to your needs</code>（要望に合わせる）。動詞用法も頻出。"},{"w":"sew","jp":"縫う","note":"`sew the lining by hand`。活用は sew–sewed–sewn。発音は /soʊ/ で saw とは異なる。","tier":"A","ref":"TSL 1176","note_html":"<code>sew the lining by hand</code>。活用は sew–sewed–sewn。発音は /soʊ/ で saw とは異なる。"},{"w":"delicate","jp":"繊細な、壊れやすい","note":"`too delicate for the machine`、`a delicate fabric / matter`。物にも問題にも使う。","tier":"A","ref":"TSL 902","note_html":"<code>too delicate for the machine</code>、<code>a delicate fabric / matter</code>。物にも問題にも使う。"},{"w":"sewing machine","jp":"ミシン","note":"`use the sewing machine`。日本語の「ミシン」は machine の訛りに由来する。","tier":"A","ref":"TSL 1176","note_html":"<code>use the sewing machine</code>。日本語の「ミシン」は machine の訛りに由来する。"},{"w":"evenly","jp":"均等に、平らに","note":"`spread the padding evenly`、`evenly divided`。形容詞 even。","tier":"A","ref":"TSL 975","note_html":"<code>spread the padding evenly</code>、<code>evenly divided</code>。形容詞 even。"}],"translation":"その絹地はミシンにかけるには繊細すぎるため、仕立屋が裏地を手縫いします。作業を始める前に、詰め物を均等に広げてください。","html":"A <b class=\"tg\">tailor</b> will <b class=\"tg\">sew</b> the lining by hand because the silk is too <b class=\"tg\">delicate</b> for the <b class=\"tg\">sewing machine</b>. Spread the padding <b class=\"tg\">evenly</b> before you begin."},{"id":146,"vol":8,"theme":"美術・工芸","sentence":"The gallery's **pottery** collection is displayed beside photographs of **architectural** models and paintings of coastal **scenery**. The exhibit has won wide **acclaim**, and one **critically acclaimed** sculpture will tour next year.","words":[{"w":"pottery","jp":"陶器、陶芸","note":"不可算名詞。`a pottery collection / class`。名詞 potter（陶芸家）。","tier":"A","ref":"TSL 933","note_html":"不可算名詞。<code>a pottery collection / class</code>。名詞 potter（陶芸家）。"},{"w":"architectural","jp":"建築の、建築上の","note":"`architectural models / design`。名詞 architect、architecture。","tier":"A","ref":"TSL 889","note_html":"<code>architectural models / design</code>。名詞 architect、architecture。"},{"w":"scenery","jp":"風景、景色","note":"不可算名詞。`coastal scenery`、`enjoy the scenery`。数える場合は `a piece of scenery`。","tier":"A","ref":"TSL 1174","note_html":"不可算名詞。<code>coastal scenery</code>、<code>enjoy the scenery</code>。数える場合は <code>a piece of scenery</code>。"},{"w":"acclaim","jp":"称賛／称賛する","note":"`win wide acclaim`、`be acclaimed for ~`。名詞・動詞の両用法。","tier":"A","ref":"TSL 1243","note_html":"<code>win wide acclaim</code>、<code>be acclaimed for ~</code>。名詞・動詞の両用法。"},{"w":"critically acclaimed","jp":"批評家に高く評価された","note":"`a critically acclaimed sculpture / film`。決まった組み合わせの表現。","tier":"A","ref":"TSL 1243","note_html":"<code>a critically acclaimed sculpture / film</code>。決まった組み合わせの表現。"}],"translation":"そのギャラリーの陶器コレクションは、建築模型の写真や海岸の風景画の隣に展示されています。この展覧会は広く称賛を集めており、批評家に高く評価された彫刻1点が来年巡回する予定です。","html":"The gallery&#x27;s <b class=\"tg\">pottery</b> collection is displayed beside photographs of <b class=\"tg\">architectural</b> models and paintings of coastal <b class=\"tg\">scenery</b>. The exhibit has won wide <b class=\"tg\">acclaim</b>, and one <b class=\"tg\">critically acclaimed</b> sculpture will tour next year."},{"id":147,"vol":8,"theme":"顧客・ファン","sentence":"Customer **loyalty** has grown since we began to **foster** closer ties with local clubs. A **prominent** cycling **enthusiast** spoke **enthusiastically** about the new frame at the launch.","words":[{"w":"loyalty","jp":"忠誠、愛顧","note":"`customer loyalty`、`a loyalty program`。形容詞 loyal。","tier":"A","ref":"TSL 994","note_html":"<code>customer loyalty</code>、<code>a loyalty program</code>。形容詞 loyal。"},{"w":"foster","jp":"育む、促進する","note":"`foster closer ties / innovation`。「時間をかけて育てる」の意。","tier":"A","ref":"TSL 1135","note_html":"<code>foster closer ties / innovation</code>。「時間をかけて育てる」の意。"},{"w":"prominent","jp":"著名な、目立つ","note":"`a prominent enthusiast / figure`。副詞 prominently。","tier":"A","ref":"TSL 1072","note_html":"<code>a prominent enthusiast / figure</code>。副詞 prominently。"},{"w":"enthusiast","jp":"愛好家、熱心なファン","note":"`a cycling enthusiast`。名詞 enthusiasm、形容詞 enthusiastic。","tier":"A","ref":"TSL 908","note_html":"<code>a cycling enthusiast</code>。名詞 enthusiasm、形容詞 enthusiastic。"},{"w":"enthusiastically","jp":"熱心に","note":"`spoke enthusiastically about ~`。about が続く。","tier":"A","ref":"TSL 863","note_html":"<code>spoke enthusiastically about ~</code>。about が続く。"}],"translation":"地元のクラブとの結びつきを深めるようになって以来、顧客の愛顧は高まっています。発表会では、著名なサイクリング愛好家が新しいフレームについて熱心に語りました。","html":"Customer <b class=\"tg\">loyalty</b> has grown since we began to <b class=\"tg\">foster</b> closer ties with local clubs. A <b class=\"tg\">prominent</b> cycling <b class=\"tg\">enthusiast</b> spoke <b class=\"tg\">enthusiastically</b> about the new frame at the launch."},{"id":148,"vol":8,"theme":"施設・備品","sentence":"The hotel **ballroom** is next to the **gymnasium** on the lower floor. Replace the burned-out **light bulb** above the **bookcase**, and note that the **microwave oven** in the staff room is out of order.","words":[{"w":"ballroom","jp":"大広間、宴会場","note":"`the hotel ballroom`。banquet hall と近い語で、式典会場として出る。","tier":"A","ref":"TSL 1104","note_html":"<code>the hotel ballroom</code>。banquet hall と近い語で、式典会場として出る。"},{"w":"gymnasium","jp":"体育館、ジム","note":"短縮形 gym。`on the lower floor`。学校・ホテルの設備説明で登場。","tier":"A","ref":"TSL 1217","note_html":"短縮形 gym。<code>on the lower floor</code>。学校・ホテルの設備説明で登場。"},{"w":"(light) bulb","jp":"電球","note":"`replace the burned-out light bulb`。`burn out`（切れる）とセットで覚える。","tier":"A","ref":"TSL 1202","note_html":"<code>replace the burned-out light bulb</code>。<code>burn out</code>（切れる）とセットで覚える。"},{"w":"bookcase","jp":"本棚","note":"`above the bookcase`。bookshelf とほぼ同義でPart 1に出る。","tier":"A","ref":"TSL 1233","note_html":"<code>above the bookcase</code>。bookshelf とほぼ同義でPart 1に出る。"},{"w":"microwave (oven)","jp":"電子レンジ","note":"`The microwave oven is out of order.`。動詞では「レンジで温める」。","tier":"A","ref":"TSL 995","note_html":"<code>The microwave oven is out of order.</code>。動詞では「レンジで温める」。"}],"translation":"ホテルの宴会場は下の階の体育館の隣にあります。本棚の上の切れた電球を交換してください。なお、休憩室の電子レンジは故障中です。","html":"The hotel <b class=\"tg\">ballroom</b> is next to the <b class=\"tg\">gymnasium</b> on the lower floor. Replace the burned-out <b class=\"tg\">light bulb</b> above the <b class=\"tg\">bookcase</b>, and note that the <b class=\"tg\">microwave oven</b> in the staff room is out of order."},{"id":149,"vol":8,"theme":"解体・屋外作業","sentence":"Crews will **demolish** the old shed near the **intersection** on Tuesday. Return the **lawn mower** to the shed beforehand, and bring a **backpack** and a warm **blanket** if you plan to stay after dark.","words":[{"w":"demolish","jp":"取り壊す、解体する","note":"`demolish the old shed / building`。名詞 demolition。","tier":"A","ref":"TSL 1117","note_html":"<code>demolish the old shed / building</code>。名詞 demolition。"},{"w":"intersection","jp":"交差点","note":"`near the intersection`、`at the intersection of A and B`。道案内で頻出。","tier":"A","ref":"TSL 1143","note_html":"<code>near the intersection</code>、<code>at the intersection of A and B</code>。道案内で頻出。"},{"w":"lawn mower","jp":"芝刈り機","note":"`return the lawn mower to the shed`。lawn（芝生）＋mow（刈る）。","tier":"A","ref":"TSL 1226","note_html":"<code>return the lawn mower to the shed</code>。lawn（芝生）＋mow（刈る）。"},{"w":"backpack","jp":"リュックサック","note":"`bring a backpack`。Part 1の人物描写にも出る。","tier":"A","ref":"TSL 1103","note_html":"<code>bring a backpack</code>。Part 1の人物描写にも出る。"},{"w":"blanket","jp":"毛布","note":"`a warm blanket`。機内サービスや宿泊設備の説明で登場する。","tier":"A","ref":"TSL 851","note_html":"<code>a warm blanket</code>。機内サービスや宿泊設備の説明で登場する。"}],"translation":"作業班が火曜日に、交差点近くの古い物置を取り壊します。事前に芝刈り機を物置に戻しておいてください。日没後も残る予定の方は、リュックと暖かい毛布をご持参ください。","html":"Crews will <b class=\"tg\">demolish</b> the old shed near the <b class=\"tg\">intersection</b> on Tuesday. Return the <b class=\"tg\">lawn mower</b> to the shed beforehand, and bring a <b class=\"tg\">backpack</b> and a warm <b class=\"tg\">blanket</b> if you plan to stay after dark."},{"id":150,"vol":8,"theme":"働き方","sentence":"Our **freelance** designers value the **flexibility** of the new contract. If we plan **strategically**, we can **attain** the annual target, and their outside experience has proved **invaluable**.","words":[{"w":"freelance","jp":"フリーランスの、自由契約の","note":"`freelance designers / writers`。名詞 freelancer。","tier":"A","ref":"TSL 864","note_html":"<code>freelance designers / writers</code>。名詞 freelancer。"},{"w":"flexibility","jp":"柔軟性、融通","note":"`the flexibility of the contract`、`scheduling flexibility`。形容詞 flexible。","tier":"A","ref":"TSL 910","note_html":"<code>the flexibility of the contract</code>、<code>scheduling flexibility</code>。形容詞 flexible。"},{"w":"strategically","jp":"戦略的に","note":"`plan strategically`、`strategically located`（立地条件がよい）。形容詞 strategic。","tier":"A","ref":"TSL 876","note_html":"<code>plan strategically</code>、<code>strategically located</code>（立地条件がよい）。形容詞 strategic。"},{"w":"attain","jp":"達成する、到達する","note":"`attain the annual target`。achieve の格式ばった語。名詞 attainment。","tier":"A","ref":"TSL 890","note_html":"<code>attain the annual target</code>。achieve の格式ばった語。名詞 attainment。"},{"w":"invaluable","jp":"きわめて貴重な","note":"`Their experience has proved invaluable.`。**valuable の強調形**で、「価値がない」ではない点が最頻出の狙い目。","tier":"A","ref":"TSL 868","note_html":"<code>Their experience has proved invaluable.</code>。**valuable の強調形**で、「価値がない」ではない点が最頻出の狙い目。"}],"translation":"当社のフリーランスのデザイナーは、新しい契約の柔軟性を高く評価しています。戦略的に計画すれば年間目標は達成でき、彼らの社外経験はきわめて貴重であることが実証されました。","html":"Our <b class=\"tg\">freelance</b> designers value the <b class=\"tg\">flexibility</b> of the new contract. If we plan <b class=\"tg\">strategically</b>, we can <b class=\"tg\">attain</b> the annual target, and their outside experience has proved <b class=\"tg\">invaluable</b>."},{"id":151,"vol":8,"theme":"研究・栄養","sentence":"The **biology** lab cannot **reproduce** the earlier results, so handle each sample **cautiously**. **Dispose** of expired reagents properly, and record the **nutritional** content of every batch.","words":[{"w":"biology","jp":"生物学","note":"`the biology lab`。形容詞 biological、名詞 biologist。","tier":"A","ref":"TSL 850","note_html":"<code>the biology lab</code>。形容詞 biological、名詞 biologist。"},{"w":"reproduce","jp":"再現する、複製する","note":"`cannot reproduce the earlier results`、`reproduce a document`。名詞 reproduction。","tier":"A","ref":"TSL 873","note_html":"<code>cannot reproduce the earlier results</code>、<code>reproduce a document</code>。名詞 reproduction。"},{"w":"cautiously","jp":"慎重に","note":"`handle each sample cautiously`。形容詞 cautious、名詞 caution。","tier":"A","ref":"TSL 894","note_html":"<code>handle each sample cautiously</code>。形容詞 cautious、名詞 caution。"},{"w":"dispose","jp":"処分する","note":"`Dispose of expired reagents.`。**of が必須**。名詞 disposal、形容詞 disposable。","tier":"A","ref":"TSL 860","note_html":"<code>Dispose of expired reagents.</code>。**of が必須**。名詞 disposal、形容詞 disposable。"},{"w":"nutritional","jp":"栄養の、栄養上の","note":"`nutritional content / information`（栄養成分表示）。名詞 nutrition、nutritionist。","tier":"A","ref":"TSL 1227","note_html":"<code>nutritional content / information</code>（栄養成分表示）。名詞 nutrition、nutritionist。"}],"translation":"生物学の実験室では以前の結果を再現できていないため、各検体は慎重に取り扱ってください。使用期限切れの試薬は適切に処分し、各ロットの栄養成分を記録してください。","html":"The <b class=\"tg\">biology</b> lab cannot <b class=\"tg\">reproduce</b> the earlier results, so handle each sample <b class=\"tg\">cautiously</b>. <b class=\"tg\">Dispose</b> of expired reagents properly, and record the <b class=\"tg\">nutritional</b> content of every batch."},{"id":152,"vol":8,"theme":"屋外イベント","sentence":"**Spectators** at the **automotive** rally were entertained between races by a golden **retriever** demonstration. Each club was given a thirty-minute **slot**.","words":[{"w":"spectator","jp":"観客、見物人","note":"`spectators at the rally`、`a spectator sport`。audience（聴衆）との違いは「見る」対象であること。","tier":"A","ref":"TSL 1084","note_html":"<code>spectators at the rally</code>、<code>a spectator sport</code>。audience（聴衆）との違いは「見る」対象であること。"},{"w":"automotive","jp":"自動車の","note":"`an automotive rally / industry / parts`。auto、automobile と語族で。","tier":"A","ref":"TSL 1199","note_html":"<code>an automotive rally / industry / parts</code>。auto、automobile と語族で。"},{"w":"retriever","jp":"レトリバー犬","note":"`a golden retriever`。動詞 retrieve（回収する）から。","tier":"A","ref":"TSL 1076","note_html":"<code>a golden retriever</code>。動詞 retrieve（回収する）から。"},{"w":"slot","jp":"枠、時間帯","note":"`a thirty-minute slot`、`a time slot`。予定表の「枠」を指す。","tier":"A","ref":"TSL 1012","note_html":"<code>a thirty-minute slot</code>、<code>a time slot</code>。予定表の「枠」を指す。"}],"translation":"自動車ラリーの観客は、レースの合間にゴールデンレトリバーの実演で楽しみました。各クラブには30分の枠が与えられました。","html":"<b class=\"tg\">Spectators</b> at the <b class=\"tg\">automotive</b> rally were entertained between races by a golden <b class=\"tg\">retriever</b> demonstration. Each club was given a thirty-minute <b class=\"tg\">slot</b>."},{"id":153,"vol":8,"theme":"法律事務所","sentence":"The **paralegal** will **erase** the draft from the shared drive once it is filed. **Fortunately**, the client waited **comfortably** in the lounge while the documents were prepared.","words":[{"w":"paralegal","jp":"弁護士補助職員","note":"`The paralegal will file ~`。para-（補助の）＋legal。法律事務所の職名として出る。","tier":"A","ref":"TSL 1158","note_html":"<code>The paralegal will file ~</code>。para-（補助の）＋legal。法律事務所の職名として出る。"},{"w":"erase","jp":"消去する、消す","note":"`erase the draft from the drive`。名詞 eraser（消しゴム）。delete と同義。","tier":"A","ref":"TSL 1211","note_html":"<code>erase the draft from the drive</code>。名詞 eraser（消しゴム）。delete と同義。"},{"w":"fortunately","jp":"幸いにも","note":"`Fortunately, the client waited ~`。文頭で用いる。形容詞 fortunate、反意語 unfortunately。","tier":"A","ref":"TSL 912","note_html":"<code>Fortunately, the client waited ~</code>。文頭で用いる。形容詞 fortunate、反意語 unfortunately。"},{"w":"comfortably","jp":"快適に、くつろいで","note":"`waited comfortably in the lounge`。形容詞 comfortable、名詞 comfort。","tier":"A","ref":"TSL 1037","note_html":"<code>waited comfortably in the lounge</code>。形容詞 comfortable、名詞 comfort。"}],"translation":"弁護士補助職員が、書類の提出後に共有ドライブから草案を消去します。幸いにも、書類が準備される間、依頼人はラウンジで快適にお待ちいただけました。","html":"The <b class=\"tg\">paralegal</b> will <b class=\"tg\">erase</b> the draft from the shared drive once it is filed. <b class=\"tg\">Fortunately</b>, the client waited <b class=\"tg\">comfortably</b> in the lounge while the documents were prepared."},{"id":154,"vol":8,"theme":"社員研修旅行","sentence":"This year's **retreat** will open with coffee and a **donut** in the lobby. The keynote speaker claims that automation will **revolutionize** the industry, which has **traditionally** relied on manual inspection.","words":[{"w":"retreat","jp":"研修旅行、保養／退却する","note":"`this year's retreat`、`a company retreat`。名詞用法が中心。","tier":"A","ref":"TSL 1171","note_html":"<code>this year&#x27;s retreat</code>、<code>a company retreat</code>。名詞用法が中心。"},{"w":"donut","jp":"ドーナツ","note":"`coffee and a donut`。doughnut の簡略表記で、米国式。","tier":"A","ref":"TSL 1126","note_html":"<code>coffee and a donut</code>。doughnut の簡略表記で、米国式。"},{"w":"revolutionize","jp":"大変革をもたらす","note":"`revolutionize the industry`。名詞 revolution、形容詞 revolutionary。","tier":"A","ref":"TSL 1009","note_html":"<code>revolutionize the industry</code>。名詞 revolution、形容詞 revolutionary。"},{"w":"traditionally","jp":"伝統的に、従来は","note":"`has traditionally relied on ~`。形容詞 traditional、名詞 tradition。","tier":"A","ref":"TSL 1016","note_html":"<code>has traditionally relied on ~</code>。形容詞 traditional、名詞 tradition。"}],"translation":"今年の研修旅行は、ロビーでのコーヒーとドーナツから始まります。基調講演者は、従来は目視検査に頼ってきたこの業界に、自動化が大変革をもたらすと主張しています。","html":"This year&#x27;s <b class=\"tg\">retreat</b> will open with coffee and a <b class=\"tg\">donut</b> in the lobby. The keynote speaker claims that automation will <b class=\"tg\">revolutionize</b> the industry, which has <b class=\"tg\">traditionally</b> relied on manual inspection."}];

/* ---- 保存領域：window.storage → localStorage → メモリ ---- */
const Store = (() => {
  const mem = {};
  const hasW = typeof window.storage !== 'undefined' && window.storage;
  return {
    async load(key, fallback){
      try{
        if(hasW){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
        const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback;
      }catch(e){ return (key in mem) ? mem[key] : fallback; }
    },
    async save(key, obj){
      mem[key] = obj;
      try{
        if(hasW){ await window.storage.set(key, JSON.stringify(obj)); return; }
        localStorage.setItem(key, JSON.stringify(obj));
      }catch(e){ /* メモリ保持のみ */ }
    }
  };
})();
const KEY_MARKS = 'toeic_sa_drill_v1';
const KEY_THEME = 'toeic_sa_drill_theme';

function applyTheme(dark){
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  const btn = document.getElementById('theme');
  if(btn){
    btn.textContent = dark ? 'ライトモード' : 'ダークモード';
    btn.setAttribute('aria-pressed', String(dark));
  }
}

let marks = {};            // {id: 'done' | 'again'}
let order = DATA.map(q => q.id);
let filter = 'all';
let cursor = 0;
let revealed = false;

const $ = s => document.querySelector(s);
const byId = id => DATA.find(q => q.id === id);

function visible(){
  return order.filter(id => {
    const q = byId(id);
    if(filter === 'all') return true;
    if(filter === 'again') return marks[id] === 'again';
    return String(q.vol) === filter;
  });
}

function renderBubbles(){
  const box = $('#bubbles');
  box.innerHTML = '';
  const vis = visible();
  const here = vis[cursor];
  order.forEach(id => {
    const b = document.createElement('button');
    b.className = 'bub' + (marks[id] ? ' ' + marks[id] : '') + (id === here ? ' here' : '');
    b.textContent = id;
    b.title = 'Q' + id + '（' + byId(id).theme + '）';
    b.onclick = () => {
      const i = visible().indexOf(id);
      if(i >= 0){ cursor = i; revealed = false; render(); }
    };
    box.appendChild(b);
  });
}

function renderStat(){
  const done = Object.values(marks).filter(v => v === 'done').length;
  const again = Object.values(marks).filter(v => v === 'again').length;
  $('#stat').textContent = `覚えた ${done} ／ 要復習 ${again} ／ 未着手 ${DATA.length - done - again}`;
}

function render(){
  const vis = visible();
  const main = $('#main');
  if(!vis.length){
    main.innerHTML = '<div class="empty">該当する問題がありません。「要復習」に印を付けた問題がここに集まります。</div>';
    renderBubbles(); renderStat(); return;
  }
  if(cursor >= vis.length) cursor = vis.length - 1;
  const q = byId(vis[cursor]);

  const words = q.words.map(w => `
    <li>
      <div class="whead">
        <span class="wen">${w.w}</span>
        <span class="wjp">${w.jp}</span>
        <span class="chip ${w.tier}">${w.tier} · ${w.ref}</span>
      </div>
      <p class="wnote">${w.note_html}</p>
    </li>`).join('');

  main.innerHTML = `
  <article class="card">
    <div class="eyebrow">
      <span>Q${q.id}</span><span>Vol.${q.vol}</span><span class="theme">${q.theme}</span>
      <span style="margin-left:auto">${cursor + 1} / ${vis.length}</span>
    </div>
    <p class="sentence">${q.html}</p>
    <p class="hint">太字の語の意味と使い方を言えるか確認してから、解答を開いてください。</p>

    <div class="actions" id="revealBar" ${revealed ? 'hidden' : ''}>
      <button class="btn" id="show">解答を見る</button>
    </div>

    <div class="reveal" id="rev" ${revealed ? '' : 'hidden'}>
      <ul class="wlist">${words}</ul>
      <p class="trans"><b>全文訳</b>${q.translation}</p>
      <div class="actions">
        <button class="btn ok" id="mDone">覚えた</button>
        <button class="btn again" id="mAgain">要復習</button>
      </div>
    </div>

    <div class="nav">
      <button id="prev" ${cursor === 0 ? 'disabled' : ''}>← 前の問題</button>
      <button id="next" ${cursor === vis.length - 1 ? 'disabled' : ''}>次の問題 →</button>
    </div>
  </article>`;

  $('#show').onclick = () => { revealed = true; $('#rev').hidden = false; $('#revealBar').hidden = true; };
  $('#prev').onclick = () => { if(cursor > 0){ cursor--; revealed = false; render(); } };
  $('#next').onclick = () => { if(cursor < vis.length - 1){ cursor++; revealed = false; render(); } };
  $('#mDone').onclick = () => mark(q.id, 'done');
  $('#mAgain').onclick = () => mark(q.id, 'again');

  renderBubbles(); renderStat();
}

async function mark(id, v){
  marks[id] = v;
  await Store.save(KEY_MARKS, marks);
  const vis = visible();
  const i = vis.indexOf(id);
  if(i >= 0 && i < vis.length - 1) cursor = i + 1;
  else if(filter === 'again') cursor = 0;
  revealed = false;
  render();
}

document.querySelectorAll('#filter button').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('#filter button').forEach(x => x.setAttribute('aria-pressed', x === b));
    filter = b.dataset.f; cursor = 0; revealed = false; render();
  };
});
$('#shuffle').onclick = () => {
  for(let i = order.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  cursor = 0; revealed = false; render();
};
$('#reset').onclick = async () => {
  if(!confirm('覚えた・要復習の記録をすべて消します。よろしいですか？')) return;
  marks = {}; await Store.save(KEY_MARKS, marks); cursor = 0; revealed = false; render();
};
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowLeft')  $('#prev') && !$('#prev').disabled && $('#prev').click();
  if(e.key === 'ArrowRight') $('#next') && !$('#next').disabled && $('#next').click();
  if(e.key === ' '){ e.preventDefault(); const s = $('#show'); if(s && !$('#revealBar').hidden) s.click(); }
});

$('#theme').onclick = async () => {
  const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
  applyTheme(dark);
  await Store.save(KEY_THEME, dark);
};

$('#export').onclick = () => {
  const blob = new Blob([JSON.stringify({version:1, savedAt:new Date().toISOString(), marks}, null, 1)],
                        {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'toeic_drill_progress_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#import').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    const incoming = obj && obj.marks ? obj.marks : obj;
    if(typeof incoming !== 'object' || incoming === null) throw new Error('形式が不正です');
    const valid = {};
    for(const [k, v] of Object.entries(incoming)){
      if((v === 'done' || v === 'again') && DATA.some(q => String(q.id) === String(k))) valid[k] = v;
    }
    marks = valid;
    await Store.save(KEY_MARKS, marks);
    cursor = 0; revealed = false; render();
    alert('学習記録を読み込みました（' + Object.keys(valid).length + '問）。');
  }catch(err){
    alert('読み込めませんでした：' + err.message);
  }finally{
    e.target.value = '';
  }
};

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(async () => {
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(await Store.load(KEY_THEME, prefersDark));
  marks = await Store.load(KEY_MARKS, {}) || {};
  render();
})();
</script>
