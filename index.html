<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TOEIC Drill">

<meta name="theme-color" content="#0F131B" media="(prefers-color-scheme: dark)">

<title>TOEIC S/Aランク語ドリル — 154問 / 767語</title>
<style>
:root{
  --paper:#F7F7F4;          /* 答案用紙 */
  --paper-2:#FFFFFF;
  --ink:#16233D;            /* 濃紺インク */
  --graphite:#3F4148;       /* 鉛筆 */
  --graphite-soft:#8A8D96;
  --dropout:#BFE6EE;        /* マークシートのドロップアウトインク */
  --dropout-deep:#2E8A9E;
  --rule:#DEDDD6;
  --ok:#2F6F4E;
  --again:#9A5B2A;
  --jp:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,var(--jp);
  --book:Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --code-bg:#F1F4F3;
  --trans-bg:#F4F6F5;
  --again-hatch:#E4C9AE;
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#0F131B;
  --paper-2:#171D28;
  --ink:#DCE6F4;
  --graphite:#C2C9D6;
  --graphite-soft:#848D9E;
  --dropout:#2C5563;
  --dropout-deep:#6FC4D8;
  --rule:#2A3242;
  --ok:#4A9B74;
  --again:#CE9257;
  --code-bg:#1F2734;
  --trans-bg:#1B2230;
  --again-hatch:#5C452C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);
  transition:background .2s,color .2s;
  color:var(--graphite);
  font-family:var(--ui);
  line-height:1.75;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px;margin:0 auto;
  padding:0 calc(20px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left))}
header{padding-top:calc(26px + env(safe-area-inset-top))}
.file-hidden{display:none}

/* ---- ヘッダー ---- */
header{border-bottom:2px solid var(--ink);padding:26px 0 14px;margin-bottom:22px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-family:var(--mono);font-size:15px;letter-spacing:.14em;text-transform:uppercase;
   color:var(--ink);margin:0;font-weight:700}
.sub{font-size:12.5px;color:var(--graphite-soft);letter-spacing:.02em}

/* ---- マークシート型プログレス ---- */
.sheet{margin:18px 0 6px}
.sheet-label{display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--graphite-soft);margin-bottom:8px}
.bubbles{display:flex;flex-wrap:wrap;gap:5px}
.bub{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--dropout);
  background:var(--paper-2);font-family:var(--mono);font-size:9.5px;color:var(--dropout-deep);
  display:grid;place-items:center;cursor:pointer;padding:0;transition:background .18s,border-color .18s,color .18s}
.bub:hover{border-color:var(--dropout-deep)}
.bub.done{background:var(--graphite);border-color:var(--graphite);color:var(--paper-2)}
.bub.again{background:repeating-linear-gradient(45deg,var(--paper-2) 0 3px,var(--again-hatch) 3px 6px);
  border-color:var(--again);color:var(--again)}
.bub.here{outline:2px solid var(--ink);outline-offset:2px}
.bub:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---- 操作列 ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 0;margin:16px 0 26px}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--paper-2)}
.seg button{font:600 12px/1 var(--ui);padding:8px 11px;border:0;background:transparent;color:var(--graphite-soft);cursor:pointer}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper-2)}
.ghost{font:600 12px/1 var(--ui);padding:8px 11px;border:1px solid var(--rule);border-radius:2px;
  background:var(--paper-2);color:var(--graphite-soft);cursor:pointer}
.ghost:hover{border-color:var(--graphite);color:var(--graphite)}
.stat{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--graphite-soft);letter-spacing:.04em}

/* ---- 問題カード ---- */
.card{background:var(--paper-2);border:1px solid var(--rule);border-left:3px solid var(--dropout-deep);
  padding:26px 26px 24px;box-shadow:0 1px 0 rgba(22,35,61,.04)}
.eyebrow{display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;
  letter-spacing:.12em;color:var(--dropout-deep);text-transform:uppercase;margin-bottom:14px}
.eyebrow .theme{font-family:var(--jp);letter-spacing:.06em;text-transform:none;color:var(--graphite-soft)}
.sentence{font-family:var(--book);font-size:20px;line-height:1.85;color:var(--ink);margin:0 0 22px}
.tg{font-weight:700;background:linear-gradient(transparent 62%,var(--dropout) 62%);padding:0 1px}
.hint{font-size:12.5px;color:var(--graphite-soft);margin:0 0 18px}

.reveal{border-top:1px dashed var(--rule);margin-top:20px;padding-top:20px}
.reveal[hidden]{display:none}
.wlist{list-style:none;margin:0 0 20px;padding:0}
.wlist li{padding:12px 0;border-bottom:1px solid var(--rule)}
.wlist li:last-child{border-bottom:0}
.whead{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.wen{font-family:var(--book);font-size:17px;font-weight:700;color:var(--ink)}
.wjp{font-size:14px;color:var(--graphite)}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid var(--rule);
  border-radius:2px;padding:2px 6px;color:var(--graphite-soft);white-space:nowrap}
.chip.S{border-color:var(--ink);color:var(--ink)}
.wnote{font-size:13.5px;color:var(--graphite);margin:5px 0 0}
code{font-family:var(--mono);font-size:12.5px;background:var(--code-bg);padding:1px 5px;border-radius:2px;color:var(--ink)}
.trans{background:var(--trans-bg);border-left:2px solid var(--dropout);padding:13px 16px;font-size:14px;margin:0}
.trans b{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dropout-deep);
  display:block;margin-bottom:4px;font-weight:700}

/* ---- ボタン ---- */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{font:700 14px/1 var(--ui);padding:13px 20px;border-radius:2px;border:1.5px solid var(--ink);
  background:var(--ink);color:var(--paper-2);cursor:pointer;flex:1 1 160px}
.btn.alt{background:var(--paper-2);color:var(--ink)}
.btn.ok{border-color:var(--ok);background:var(--ok)}
.btn.again{border-color:var(--again);background:var(--paper-2);color:var(--again)}
.btn:hover{opacity:.9}
.nav{display:flex;justify-content:space-between;margin-top:14px}
.nav button{font:600 12.5px/1 var(--ui);background:none;border:0;color:var(--graphite-soft);cursor:pointer;padding:6px 2px}
.nav button:hover{color:var(--ink)}
.nav button[disabled]{opacity:.3;cursor:default}
.empty{text-align:center;padding:60px 20px;color:var(--graphite-soft);font-size:14px}
footer{margin-top:30px;font-size:11.5px;color:var(--graphite-soft);line-height:1.9}
@media (max-width:520px){
  .sentence{font-size:17.5px}
  .card{padding:20px 18px}
  .bub{width:20px;height:20px;font-size:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <h1>TOEIC S/A Drill</h1>
    <span class="sub">154問 / 767語 &nbsp;·&nbsp; TSL 1.2 &amp; NGSL 1.2 準拠</span>

  <div class="sheet">
    <div class="sheet-label"><span>解答記入欄</span><span id="legend">■ 覚えた　▨ 要復習　○ 未着手</span></div>

<div class="controls">
  <div class="seg" id="filter">
    <button data-f="all" aria-pressed="true">全154問</button>

    <button data-f="2" aria-pressed="false">第2弾</button>
    <button data-f="3" aria-pressed="false">第3弾</button>

  <button class="ghost" id="export">記録を書き出す</button>
  <button class="ghost" id="import">記録を読み込む</button>
  <input type="file" id="importFile" accept="application/json,.json" class="file-hidden">

</div>

<script>
const DATA = [{"id":1,"vol":1,"theme":"採用・応募","sentence":"All **applicants** must submit a **résumé** and **enclose** three letters of reference. The **deadline** for **submission** is 5:00 P.M. on March 14.","words":[{"w":"applicant","jp":"応募者、志願者","note":"`qualified applicant`（適格な応募者）、`applicants for the position`。動詞 apply、名詞 application と語族でまとめて押さえる。Part 7の求人広告で頻出。","tier":"S","ref":"TSL 28","note_html":"<code>qualified applicant</code>（適格な応募者）、<code>applicants for the position</code>。動詞 apply、名詞 application と語族でまとめて押さえる。Part 7の求人広告で頻出。"},{"w":"résumé","jp":"履歴書","note":"`submit / send a résumé`。米国式。英国式は CV。求人メールの定型は `Please send your résumé and cover letter to …`。","tier":"S","ref":"TSL 26","note_html":"<code>submit / send a résumé</code>。米国式。英国式は CV。求人メールの定型は <code>Please send your résumé and cover letter to …</code>。"},{"w":"enclose","jp":"同封する","note":"`Enclosed please find …` / `I have enclosed …`。手紙・メールの定型表現で、Part 6の空所補充に直結する。","tier":"S","ref":"TSL 27","note_html":"<code>Enclosed please find …</code> / <code>I have enclosed …</code>。手紙・メールの定型表現で、Part 6の空所補充に直結する。"},{"w":"deadline","jp":"締切","note":"`meet the deadline`（間に合わせる）、`extend the deadline`（延長する）、`the deadline for ~`。前置詞は for。","tier":"S","ref":"TSL 18","note_html":"<code>meet the deadline</code>（間に合わせる）、<code>extend the deadline</code>（延長する）、<code>the deadline for ~</code>。前置詞は for。"},{"w":"submission","jp":"提出、提出物","note":"`submission deadline`、`deadline for submission`。動詞 submit の名詞形で、品詞問題の定番。","tier":"S","ref":"TSL 157","note_html":"<code>submission deadline</code>、<code>deadline for submission</code>。動詞 submit の名詞形で、品詞問題の定番。"}],"translation":"応募者は全員、履歴書を提出し、推薦状3通を同封しなければなりません。提出の締切は3月14日午後5時です。","html":"All <b class=\"tg\">applicants</b> must submit a <b class=\"tg\">résumé</b> and <b class=\"tg\">enclose</b> three letters of reference. The <b class=\"tg\">deadline</b> for <b class=\"tg\">submission</b> is 5:00 P.M. on March 14."},{"id":2,"vol":1,"theme":"経理・請求","sentence":"Our **accountant** noticed that the **invoice** dated April 2 is now two weeks **overdue**. Please forward the original **receipt** if you would like your travel costs **reimbursed**.","words":[{"w":"accountant","jp":"会計士、経理担当者","note":"`certified public accountant`（公認会計士）。accounting department（経理部）とセットで。","tier":"S","ref":"TSL 22","note_html":"<code>certified public accountant</code>（公認会計士）。accounting department（経理部）とセットで。"},{"w":"invoice","jp":"請求書、送り状","note":"`issue / send an invoice`、`the invoice dated ~`（〜付の請求書）、`pay an invoice`。TSL19位の最重要語。","tier":"S","ref":"TSL 19","note_html":"<code>issue / send an invoice</code>、<code>the invoice dated ~</code>（〜付の請求書）、<code>pay an invoice</code>。TSL19位の最重要語。"},{"w":"overdue","jp":"期限を過ぎた、延滞した","note":"`an overdue payment`、`The invoice is two weeks overdue.`。図書館の返却期限や支払期限で使われる。","tier":"A","ref":"TSL 348","note_html":"<code>an overdue payment</code>、<code>The invoice is two weeks overdue.</code>。図書館の返却期限や支払期限で使われる。"},{"w":"receipt","jp":"領収書、受領","note":"`keep / present the receipt`。`upon receipt of ~`（〜を受け取り次第）という別義もPart 7に出る。","tier":"S","ref":"TSL 33","note_html":"<code>keep / present the receipt</code>。<code>upon receipt of ~</code>（〜を受け取り次第）という別義もPart 7に出る。"},{"w":"reimburse","jp":"払い戻す、精算する","note":"`reimburse employees for travel expenses`（従業員に旅費を精算する）。人＋for＋費用の語順に注意。名詞 reimbursement も頻出。","tier":"A","ref":"TSL 375","note_html":"<code>reimburse employees for travel expenses</code>（従業員に旅費を精算する）。人＋for＋費用の語順に注意。名詞 reimbursement も頻出。"}],"translation":"当社の経理担当者が、4月2日付の請求書が2週間延滞していることに気づきました。旅費の精算をご希望の場合は、領収書の原本をご送付ください。","html":"Our <b class=\"tg\">accountant</b> noticed that the <b class=\"tg\">invoice</b> dated April 2 is now two weeks <b class=\"tg\">overdue</b>. Please forward the original <b class=\"tg\">receipt</b> if you would like your travel costs <b class=\"tg\">reimbursed</b>."},{"id":3,"vol":1,"theme":"出張・移動","sentence":"According to the revised **itinerary**, **departure** is at 6:40 A.M. A free **shuttle** runs to the airport, so you will pay the **fare** only for the return trip, and each traveler may check one piece of **luggage**.","words":[{"w":"itinerary","jp":"旅程表","note":"`a detailed / revised itinerary`、`according to the itinerary`。出張案内のメールで必出。","tier":"S","ref":"TSL 146","note_html":"<code>a detailed / revised itinerary</code>、<code>according to the itinerary</code>。出張案内のメールで必出。"},{"w":"departure","jp":"出発","note":"`departure time / gate`、`departures board`。反意語 arrival と対で。動詞は depart。","tier":"S","ref":"TSL 113","note_html":"<code>departure time / gate</code>、<code>departures board</code>。反意語 arrival と対で。動詞は depart。"},{"w":"shuttle","jp":"送迎バス、シャトル便","note":"`a free shuttle (bus) to the airport`、`shuttle service`。ホテル・空港の話題で頻出。","tier":"S","ref":"TSL 204","note_html":"<code>a free shuttle (bus) to the airport</code>、<code>shuttle service</code>。ホテル・空港の話題で頻出。"},{"w":"fare","jp":"運賃","note":"`bus / train / taxi fare`、`pay the fare`。fee（手数料・会費）、fine（罰金）との区別が問われる。","tier":"S","ref":"TSL 32","note_html":"<code>bus / train / taxi fare</code>、<code>pay the fare</code>。fee（手数料・会費）、fine（罰金）との区別が問われる。"},{"w":"luggage","jp":"手荷物","note":"不可算名詞。数えるときは `a piece of luggage`。`check luggage`（預ける）、`carry-on luggage`（機内持ち込み）。baggage とほぼ同義。","tier":"S","ref":"TSL 37","note_html":"不可算名詞。数えるときは <code>a piece of luggage</code>。<code>check luggage</code>（預ける）、<code>carry-on luggage</code>（機内持ち込み）。baggage とほぼ同義。"}],"translation":"改訂された旅程表によれば、出発は午前6時40分です。空港までは無料の送迎バスが運行しているため、運賃をお支払いいただくのは復路のみとなります。また各旅行者は手荷物を1個預けることができます。","html":"According to the revised <b class=\"tg\">itinerary</b>, <b class=\"tg\">departure</b> is at 6:40 A.M. A free <b class=\"tg\">shuttle</b> runs to the airport, so you will pay the <b class=\"tg\">fare</b> only for the return trip, and each traveler may check one piece of <b class=\"tg\">luggage</b>."},{"id":4,"vol":1,"theme":"返品・保証","sentence":"Because the **merchandise** arrived **defective**, the store issued a full **refund** rather than a **replacement**, even though the **warranty** had already lapsed.","words":[{"w":"merchandise","jp":"商品","note":"不可算名詞。`return / display merchandise`、`defective merchandise`。goods とほぼ同義だが単数扱い。","tier":"S","ref":"TSL 71","note_html":"不可算名詞。<code>return / display merchandise</code>、<code>defective merchandise</code>。goods とほぼ同義だが単数扱い。"},{"w":"defective","jp":"欠陥のある、不良の","note":"`a defective product / part`。名詞 defect との品詞使い分けが問われる。","tier":"A","ref":"TSL 290","note_html":"<code>a defective product / part</code>。名詞 defect との品詞使い分けが問われる。"},{"w":"refund","jp":"返金","note":"`a full refund`（全額返金）、`request / issue / receive a refund`。動詞用法もあり `refund the purchase price`。","tier":"S","ref":"TSL 14","note_html":"<code>a full refund</code>（全額返金）、<code>request / issue / receive a refund</code>。動詞用法もあり <code>refund the purchase price</code>。"},{"w":"replacement","jp":"交換品、後任者","note":"`a replacement for the broken part`、`hire a replacement`（後任を雇う）。人にも物にも使う。","tier":"S","ref":"TSL 82","note_html":"<code>a replacement for the broken part</code>、<code>hire a replacement</code>（後任を雇う）。人にも物にも使う。"},{"w":"warranty","jp":"保証、保証書","note":"`under warranty`（保証期間内で）、`a one-year warranty`、`the warranty expires / lapses`。guarantee との言い換えが出る。","tier":"S","ref":"TSL 42","note_html":"<code>under warranty</code>（保証期間内で）、<code>a one-year warranty</code>、<code>the warranty expires / lapses</code>。guarantee との言い換えが出る。"}],"translation":"商品が不良品の状態で届いたため、店は保証期間がすでに切れていたにもかかわらず、交換品ではなく全額返金を行いました。","html":"Because the <b class=\"tg\">merchandise</b> arrived <b class=\"tg\">defective</b>, the store issued a full <b class=\"tg\">refund</b> rather than a <b class=\"tg\">replacement</b>, even though the <b class=\"tg\">warranty</b> had already lapsed."},{"id":5,"vol":1,"theme":"移転・改装","sentence":"After the **renovation** of the third floor is complete, the marketing team will **relocate** to a more **spacious** area near the **headquarters** entrance. The **contractor** expects the work to finish by June.","words":[{"w":"renovation","jp":"改装、改修","note":"`undergo renovation`（改装中である）、`be closed for renovation`。動詞 renovate も同頻度で出る。","tier":"S","ref":"TSL 79","note_html":"<code>undergo renovation</code>（改装中である）、<code>be closed for renovation</code>。動詞 renovate も同頻度で出る。"},{"w":"relocate","jp":"移転する、移転させる","note":"`relocate to Chicago`、`relocate the office`。自動詞・他動詞の両方で使う。名詞 relocation。","tier":"S","ref":"TSL 236","note_html":"<code>relocate to Chicago</code>、<code>relocate the office</code>。自動詞・他動詞の両方で使う。名詞 relocation。"},{"w":"spacious","jp":"広々とした","note":"`a spacious office / lobby / apartment`。不動産・ホテル広告の定番形容詞。","tier":"A","ref":"TSL 399","note_html":"<code>a spacious office / lobby / apartment</code>。不動産・ホテル広告の定番形容詞。"},{"w":"headquarters","jp":"本社","note":"常に -s が付き、単数扱いも可。`corporate headquarters`、`be headquartered in Osaka`（大阪に本社を置く）。","tier":"S","ref":"TSL 203","note_html":"常に -s が付き、単数扱いも可。<code>corporate headquarters</code>、<code>be headquartered in Osaka</code>（大阪に本社を置く）。"},{"w":"contractor","jp":"請負業者、業者","note":"`hire a contractor`、`general contractor`（総合建設業者）。契約 contract の派生語。","tier":"S","ref":"TSL 188","note_html":"<code>hire a contractor</code>、<code>general contractor</code>（総合建設業者）。契約 contract の派生語。"}],"translation":"3階の改装が完了した後、マーケティングチームは本社入口近くの、より広々とした区画へ移転します。請負業者は6月までに工事が終わる見込みだとしています。","html":"After the <b class=\"tg\">renovation</b> of the third floor is complete, the marketing team will <b class=\"tg\">relocate</b> to a more <b class=\"tg\">spacious</b> area near the <b class=\"tg\">headquarters</b> entrance. The <b class=\"tg\">contractor</b> expects the work to finish by June."},{"id":6,"vol":1,"theme":"日程調整","sentence":"We must **postpone** Thursday's briefing and **reschedule** it for next week because the **venue** is unavailable. Please confirm the number of **attendees** **at your earliest convenience**.","words":[{"w":"postpone","jp":"延期する","note":"`postpone the meeting until next week`。後ろは動名詞（`postpone making a decision`）。put off の言い換え。","tier":"S","ref":"TSL 65","note_html":"<code>postpone the meeting until next week</code>。後ろは動名詞（<code>postpone making a decision</code>）。put off の言い換え。"},{"w":"reschedule","jp":"予定を変更する","note":"`reschedule the appointment for Friday`。前置詞は for / to。TOEICでは「日程変更」の合図語。","tier":"S","ref":"TSL 77","note_html":"<code>reschedule the appointment for Friday</code>。前置詞は for / to。TOEICでは「日程変更」の合図語。"},{"w":"venue","jp":"会場","note":"`change / reserve the venue`、`the venue for the conference`。place より格式ばった語。","tier":"S","ref":"TSL 175","note_html":"<code>change / reserve the venue</code>、<code>the venue for the conference</code>。place より格式ばった語。"},{"w":"attendee","jp":"出席者、参加者","note":"`the number of attendees`、`register attendees`。attend / attendance / attendant と語族で混同されやすい。","tier":"S","ref":"TSL 102","note_html":"<code>the number of attendees</code>、<code>register attendees</code>。attend / attendance / attendant と語族で混同されやすい。"},{"w":"at your earliest convenience","jp":"ご都合のつき次第、なるべく早く","note":"`Please reply at your earliest convenience.`。as soon as possible の丁寧な定型表現。","tier":"S","ref":"TSL 149","note_html":"<code>Please reply at your earliest convenience.</code>。as soon as possible の丁寧な定型表現。"}],"translation":"会場が使用できないため、木曜日の説明会を延期し、来週に日程を変更しなければなりません。出席者数をご都合のつき次第ご確認ください。","html":"We must <b class=\"tg\">postpone</b> Thursday&#x27;s briefing and <b class=\"tg\">reschedule</b> it for next week because the <b class=\"tg\">venue</b> is unavailable. Please confirm the number of <b class=\"tg\">attendees</b> <b class=\"tg\">at your earliest convenience</b>."},{"id":7,"vol":1,"theme":"物流・在庫","sentence":"The **shipment** left our **warehouse** on Monday and is still **in transit**. The **courier** will call once it arrives, and we will update the **inventory** system accordingly.","words":[{"w":"shipment","jp":"発送、積荷","note":"`a delayed shipment`、`track the shipment`。動詞 ship（発送する）から。","tier":"S","ref":"TSL 38","note_html":"<code>a delayed shipment</code>、<code>track the shipment</code>。動詞 ship（発送する）から。"},{"w":"warehouse","jp":"倉庫","note":"`store items in the warehouse`、`warehouse staff`。Part 1の写真描写にも登場する。","tier":"S","ref":"TSL 131","note_html":"<code>store items in the warehouse</code>、<code>warehouse staff</code>。Part 1の写真描写にも登場する。"},{"w":"in transit","jp":"輸送中で","note":"`The package is still in transit.`、`damaged in transit`（輸送中に破損した）。前置詞句としてそのまま覚える。","tier":"A","ref":"TSL 327","note_html":"<code>The package is still in transit.</code>、<code>damaged in transit</code>（輸送中に破損した）。前置詞句としてそのまま覚える。"},{"w":"courier","jp":"宅配業者、配達人","note":"`a courier service`、`send by courier`。delivery company の言い換え。","tier":"S","ref":"TSL 242","note_html":"<code>a courier service</code>、<code>send by courier</code>。delivery company の言い換え。"},{"w":"inventory","jp":"在庫、棚卸し","note":"`take inventory`（棚卸しをする）、`inventory levels`、`out of stock` と関連。","tier":"S","ref":"TSL 60","note_html":"<code>take inventory</code>（棚卸しをする）、<code>inventory levels</code>、<code>out of stock</code> と関連。"}],"translation":"その積荷は月曜日に当社の倉庫を出発し、現在も輸送中です。到着次第、宅配業者から連絡がありますので、それに合わせて在庫システムを更新します。","html":"The <b class=\"tg\">shipment</b> left our <b class=\"tg\">warehouse</b> on Monday and is still <b class=\"tg\">in transit</b>. The <b class=\"tg\">courier</b> will call once it arrives, and we will update the <b class=\"tg\">inventory</b> system accordingly."},{"id":8,"vol":1,"theme":"人事・研修","sentence":"Every **intern** attends a two-day **workshop** during **orientation**, where a **supervisor** with more than a decade of **expertise** in logistics leads the sessions.","words":[{"w":"intern","jp":"インターン、研修生","note":"`hire an intern`、`a summer intern`。internship（インターンシップ）も同頻度。","tier":"A","ref":"TSL 307","note_html":"<code>hire an intern</code>、<code>a summer intern</code>。internship（インターンシップ）も同頻度。"},{"w":"workshop","jp":"研修会、講習会","note":"`attend / conduct a workshop`、`a two-day workshop`。seminar の言い換え。","tier":"S","ref":"TSL 16","note_html":"<code>attend / conduct a workshop</code>、<code>a two-day workshop</code>。seminar の言い換え。"},{"w":"orientation","jp":"新人研修、オリエンテーション","note":"`new employee orientation`、`during orientation`。会社説明の場面で頻出。","tier":"A","ref":"TSL 356","note_html":"<code>new employee orientation</code>、<code>during orientation</code>。会社説明の場面で頻出。"},{"w":"supervisor","jp":"上司、監督者","note":"`report to your supervisor`（上司に報告する）。動詞 supervise、名詞 supervision も併せて。","tier":"S","ref":"TSL 13","note_html":"<code>report to your supervisor</code>（上司に報告する）。動詞 supervise、名詞 supervision も併せて。"},{"w":"expertise","jp":"専門知識、専門技能","note":"不可算名詞。`expertise in marketing`、`technical expertise`。前置詞は in。","tier":"A","ref":"TSL 311","note_html":"不可算名詞。<code>expertise in marketing</code>、<code>technical expertise</code>。前置詞は in。"}],"translation":"インターンは全員、オリエンテーション期間中に2日間の研修会に参加します。そこでは物流分野で10年以上の専門知識を持つ上司が講習を進行します。","html":"Every <b class=\"tg\">intern</b> attends a two-day <b class=\"tg\">workshop</b> during <b class=\"tg\">orientation</b>, where a <b class=\"tg\">supervisor</b> with more than a decade of <b class=\"tg\">expertise</b> in logistics leads the sessions."},{"id":9,"vol":1,"theme":"不動産・契約","sentence":"The **tenant** has decided not to sign the **renewal**, so the **lease** will end in September. Please **notify** the agent as soon as the **vacancy** is listed.","words":[{"w":"tenant","jp":"賃借人、テナント","note":"`a commercial tenant`、`tenants of the building`。貸主は landlord。","tier":"S","ref":"TSL 111","note_html":"<code>a commercial tenant</code>、<code>tenants of the building</code>。貸主は landlord。"},{"w":"renewal","jp":"更新","note":"`contract / lease renewal`、`up for renewal`（更新時期である）。動詞 renew から。","tier":"A","ref":"TSL 295","note_html":"<code>contract / lease renewal</code>、<code>up for renewal</code>（更新時期である）。動詞 renew から。"},{"w":"lease","jp":"賃貸契約、賃貸借する","note":"`sign / renew a lease`、`a five-year lease`。動詞では `lease office space`。","tier":"S","ref":"TSL 48","note_html":"<code>sign / renew a lease</code>、<code>a five-year lease</code>。動詞では <code>lease office space</code>。"},{"w":"notify","jp":"通知する","note":"`notify someone of something`（人に〜を知らせる）。目的語は必ず人。inform と同型で、Part 5の語法問題に出る。","tier":"S","ref":"TSL 50","note_html":"<code>notify someone of something</code>（人に〜を知らせる）。目的語は必ず人。inform と同型で、Part 5の語法問題に出る。"},{"w":"vacancy","jp":"空室、欠員","note":"`fill a vacancy`（欠員を埋める）、`No vacancies`（満室）。形容詞 vacant（空いている）。","tier":"A","ref":"TSL 339","note_html":"<code>fill a vacancy</code>（欠員を埋める）、<code>No vacancies</code>（満室）。形容詞 vacant（空いている）。"}],"translation":"賃借人が更新契約に署名しないことを決めたため、賃貸契約は9月に終了します。空室として掲載され次第、仲介業者に通知してください。","html":"The <b class=\"tg\">tenant</b> has decided not to sign the <b class=\"tg\">renewal</b>, so the <b class=\"tg\">lease</b> will end in September. Please <b class=\"tg\">notify</b> the agent as soon as the <b class=\"tg\">vacancy</b> is listed."},{"id":10,"vol":1,"theme":"顧客対応","sentence":"To apologize for the **inconvenience**, the hotel offered each **patron** a **complimentary** breakfast and a **voucher** for a future stay, and the manager responded **promptly** to every complaint.","words":[{"w":"inconvenience","jp":"不便、迷惑","note":"`We apologize for any inconvenience.`（ご迷惑をおかけして申し訳ありません）が定型。お詫び文の必出表現。","tier":"S","ref":"TSL 116","note_html":"<code>We apologize for any inconvenience.</code>（ご迷惑をおかけして申し訳ありません）が定型。お詫び文の必出表現。"},{"w":"patron","jp":"常連客、後援者","note":"`valued patrons`（お得意様）。customer より格式ばった掲示・案内文向きの語。","tier":"A","ref":"TSL 269","note_html":"<code>valued patrons</code>（お得意様）。customer より格式ばった掲示・案内文向きの語。"},{"w":"complimentary","jp":"無料の","note":"`a complimentary breakfast / shuttle / upgrade`。free の言い換え。complementary（補完的な）との綴り違いに注意。","tier":"S","ref":"TSL 231","note_html":"<code>a complimentary breakfast / shuttle / upgrade</code>。free の言い換え。complementary（補完的な）との綴り違いに注意。"},{"w":"voucher","jp":"引換券、クーポン券","note":"`a gift / meal voucher`、`redeem a voucher`（引き換える）。","tier":"A","ref":"TSL 315","note_html":"<code>a gift / meal voucher</code>、<code>redeem a voucher</code>（引き換える）。"},{"w":"promptly","jp":"迅速に、時間どおりに","note":"`respond promptly to inquiries`、`begin promptly at 9:00`（9時ちょうどに開始）。2つの語義がどちらも出る。","tier":"A","ref":"TSL 337","note_html":"<code>respond promptly to inquiries</code>、<code>begin promptly at 9:00</code>（9時ちょうどに開始）。2つの語義がどちらも出る。"}],"translation":"不便をおかけしたお詫びとして、ホテルは各常連客に無料の朝食と次回宿泊用の引換券を提供し、支配人はすべての苦情に迅速に対応しました。","html":"To apologize for the <b class=\"tg\">inconvenience</b>, the hotel offered each <b class=\"tg\">patron</b> a <b class=\"tg\">complimentary</b> breakfast and a <b class=\"tg\">voucher</b> for a future stay, and the manager responded <b class=\"tg\">promptly</b> to every complaint."},{"id":11,"vol":1,"theme":"工場・点検","sentence":"During the annual **inspection**, a **technician** discovered a minor **defect** in the packaging **machinery**. All staff on the floor must wear **protective gear** until the repair is finished.","words":[{"w":"inspection","jp":"検査、点検","note":"`conduct / undergo an inspection`、`a routine (annual) inspection`。動詞 inspect、名詞 inspector。","tier":"S","ref":"TSL 136","note_html":"<code>conduct / undergo an inspection</code>、<code>a routine (annual) inspection</code>。動詞 inspect、名詞 inspector。"},{"w":"technician","jp":"技術者、整備士","note":"`a service / lab technician`、`call a technician`。修理依頼の場面で頻出。","tier":"S","ref":"TSL 30","note_html":"<code>a service / lab technician</code>、<code>call a technician</code>。修理依頼の場面で頻出。"},{"w":"defect","jp":"欠陥、不具合","note":"`a minor / manufacturing defect`。形容詞 defective との品詞問題に注意。","tier":"A","ref":"TSL 278","note_html":"<code>a minor / manufacturing defect</code>。形容詞 defective との品詞問題に注意。"},{"w":"machinery","jp":"機械類","note":"不可算の集合名詞。`operate heavy machinery`、`a piece of machinery`。machine の複数形ではない点が狙われる。","tier":"S","ref":"TSL 249","note_html":"不可算の集合名詞。<code>operate heavy machinery</code>、<code>a piece of machinery</code>。machine の複数形ではない点が狙われる。"},{"w":"protective gear","jp":"保護具、防護具","note":"`wear protective gear / equipment`。工場・工事現場の安全指示で必出。","tier":"A","ref":"TSL 322","note_html":"<code>wear protective gear / equipment</code>。工場・工事現場の安全指示で必出。"}],"translation":"年次点検の際、技術者が包装機械に軽微な欠陥を発見しました。修理が完了するまで、フロアにいる従業員は全員、保護具を着用しなければなりません。","html":"During the annual <b class=\"tg\">inspection</b>, a <b class=\"tg\">technician</b> discovered a minor <b class=\"tg\">defect</b> in the packaging <b class=\"tg\">machinery</b>. All staff on the floor must wear <b class=\"tg\">protective gear</b> until the repair is finished."},{"id":12,"vol":1,"theme":"広告・販促","sentence":"The **distribution** of the new **brochure** begins Friday, and a one-page **flyer** with a **promotional** code will be mailed to every **subscriber**.","words":[{"w":"distribution","jp":"配布、流通","note":"`the distribution of brochures`、`distribution center`（物流センター）。動詞 distribute。","tier":"S","ref":"TSL 215","note_html":"<code>the distribution of brochures</code>、<code>distribution center</code>（物流センター）。動詞 distribute。"},{"w":"brochure","jp":"パンフレット、小冊子","note":"`request / enclose a brochure`、`a product brochure`。TSL20位。","tier":"S","ref":"TSL 20","note_html":"<code>request / enclose a brochure</code>、<code>a product brochure</code>。TSL20位。"},{"w":"flyer","jp":"チラシ","note":"`hand out / post flyers`、`a one-page flyer`。leaflet の言い換え。","tier":"A","ref":"TSL 367","note_html":"<code>hand out / post flyers</code>、<code>a one-page flyer</code>。leaflet の言い換え。"},{"w":"promotional","jp":"販促の","note":"`a promotional code / campaign / offer`、`promotional materials`（販促資料）。名詞 promotion には「昇進」の意味もある。","tier":"A","ref":"TSL 424","note_html":"<code>a promotional code / campaign / offer</code>、<code>promotional materials</code>（販促資料）。名詞 promotion には「昇進」の意味もある。"},{"w":"subscriber","jp":"購読者、契約者","note":"`subscribers to the newsletter`。動詞 subscribe（`subscribe to ~`）、名詞 subscription と語族で。","tier":"A","ref":"TSL 350","note_html":"<code>subscribers to the newsletter</code>。動詞 subscribe（<code>subscribe to ~</code>）、名詞 subscription と語族で。"}],"translation":"新しいパンフレットの配布は金曜日に始まります。また、販促用コードを記載した1ページのチラシが全購読者に郵送されます。","html":"The <b class=\"tg\">distribution</b> of the new <b class=\"tg\">brochure</b> begins Friday, and a one-page <b class=\"tg\">flyer</b> with a <b class=\"tg\">promotional</b> code will be mailed to every <b class=\"tg\">subscriber</b>."},{"id":13,"vol":1,"theme":"社内行事","sentence":"To mark the company's twentieth **anniversary**, we have reserved the **banquet hall** and asked a local restaurant to **cater** the event. Light **refreshments** and a selection of **beverages** will be served from six o'clock.","words":[{"w":"anniversary","jp":"記念日、周年","note":"`the company's twentieth anniversary`、`celebrate an anniversary`。序数詞とともに使う。","tier":"A","ref":"TSL 288","note_html":"<code>the company&#x27;s twentieth anniversary</code>、<code>celebrate an anniversary</code>。序数詞とともに使う。"},{"w":"banquet hall","jp":"宴会場","note":"`reserve the banquet hall`。banquet（宴会、晩餐会）単独でも出る。","tier":"S","ref":"TSL 117","note_html":"<code>reserve the banquet hall</code>。banquet（宴会、晩餐会）単独でも出る。"},{"w":"cater","jp":"料理を提供する、仕出しをする","note":"`cater an event`、`cater to customers' needs`（要望に応える）の2用法。名詞 caterer / catering。","tier":"A","ref":"TSL 264","note_html":"<code>cater an event</code>、<code>cater to customers&#x27; needs</code>（要望に応える）の2用法。名詞 caterer / catering。"},{"w":"refreshments","jp":"軽食、飲み物","note":"通常は複数形。`Refreshments will be served / provided.`（軽食をご用意します）が定型。","tier":"S","ref":"TSL 211","note_html":"通常は複数形。<code>Refreshments will be served / provided.</code>（軽食をご用意します）が定型。"},{"w":"beverage","jp":"飲み物","note":"`complimentary beverages`、`a selection of beverages`。drink の格式ばった言い換えで、案内文に使われる。","tier":"S","ref":"TSL 134","note_html":"<code>complimentary beverages</code>、<code>a selection of beverages</code>。drink の格式ばった言い換えで、案内文に使われる。"}],"translation":"当社の20周年を記念して、宴会場を予約し、地元のレストランにイベントの料理提供を依頼しました。軽食と各種飲み物を6時から提供いたします。","html":"To mark the company&#x27;s twentieth <b class=\"tg\">anniversary</b>, we have reserved the <b class=\"tg\">banquet hall</b> and asked a local restaurant to <b class=\"tg\">cater</b> the event. Light <b class=\"tg\">refreshments</b> and a selection of <b class=\"tg\">beverages</b> will be served from six o&#x27;clock."},{"id":14,"vol":1,"theme":"IT・設備","sentence":"The **installation** of the new **projector** is scheduled for Tuesday, and every **laptop computer** in the conference room will be **upgraded** so that the booking system becomes fully **automated**.","words":[{"w":"installation","jp":"設置、取り付け","note":"`the installation of new equipment`、`installation fee`。動詞 install。","tier":"S","ref":"TSL 227","note_html":"<code>the installation of new equipment</code>、<code>installation fee</code>。動詞 install。"},{"w":"projector","jp":"プロジェクター","note":"`set up / operate the projector`。会議室設備の定番語。","tier":"A","ref":"TSL 397","note_html":"<code>set up / operate the projector</code>。会議室設備の定番語。"},{"w":"laptop (computer)","jp":"ノートパソコン","note":"`bring your laptop`。desktop と対で。Part 1の写真描写にも出る。","tier":"S","ref":"TSL 96","note_html":"<code>bring your laptop</code>。desktop と対で。Part 1の写真描写にも出る。"},{"w":"upgrade","jp":"改良する、格上げする／改良","note":"`upgrade the software / system`、`a free upgrade`。名詞・動詞の両用法。","tier":"S","ref":"TSL 80","note_html":"<code>upgrade the software / system</code>、<code>a free upgrade</code>。名詞・動詞の両用法。"},{"w":"automated","jp":"自動化された","note":"`an automated system / response`、`fully automated`。動詞 automate、名詞 automation。","tier":"A","ref":"TSL 388","note_html":"<code>an automated system / response</code>、<code>fully automated</code>。動詞 automate、名詞 automation。"}],"translation":"新しいプロジェクターの設置は火曜日に予定されており、会議室のすべてのノートパソコンが改良されて、予約システムが完全に自動化されます。","html":"The <b class=\"tg\">installation</b> of the new <b class=\"tg\">projector</b> is scheduled for Tuesday, and every <b class=\"tg\">laptop computer</b> in the conference room will be <b class=\"tg\">upgraded</b> so that the booking system becomes fully <b class=\"tg\">automated</b>."},{"id":15,"vol":1,"theme":"通勤・交通","sentence":"Because of heavy **congestion** near the **terminal**, many **commuters** now take an **alternate** route into **downtown** and arrive twenty minutes earlier.","words":[{"w":"congestion","jp":"渋滞、混雑","note":"`traffic congestion`、`heavy congestion`。交通情報のアナウンスで頻出。","tier":"A","ref":"TSL 811","note_html":"<code>traffic congestion</code>、<code>heavy congestion</code>。交通情報のアナウンスで頻出。"},{"w":"terminal","jp":"ターミナル、発着所","note":"`bus / airport terminal`、`Terminal 2`。形容詞では「末期の」だがTOEICでは名詞用法。","tier":"S","ref":"TSL 193","note_html":"<code>bus / airport terminal</code>、<code>Terminal 2</code>。形容詞では「末期の」だがTOEICでは名詞用法。"},{"w":"commuter","jp":"通勤者","note":"`commuter train / traffic`。動詞 commute（`commute to work by train`）と併せて。","tier":"S","ref":"TSL 176","note_html":"<code>commuter train / traffic</code>。動詞 commute（<code>commute to work by train</code>）と併せて。"},{"w":"alternate","jp":"代わりの／交替する","note":"`an alternate route`（迂回路）、`an alternate date`。alternative とほぼ同義で使われる。","tier":"A","ref":"TSL 480","note_html":"<code>an alternate route</code>（迂回路）、<code>an alternate date</code>。alternative とほぼ同義で使われる。"},{"w":"downtown","jp":"中心街へ、繁華街","note":"副詞用法に注意し `go downtown`（to は不要）。`downtown Chicago`のように形容詞的にも使う。","tier":"S","ref":"TSL 17","note_html":"副詞用法に注意し <code>go downtown</code>（to は不要）。<code>downtown Chicago</code>のように形容詞的にも使う。"}],"translation":"ターミナル付近のひどい渋滞のため、多くの通勤者が現在は中心街へ向かう迂回路を使い、20分早く到着しています。","html":"Because of heavy <b class=\"tg\">congestion</b> near the <b class=\"tg\">terminal</b>, many <b class=\"tg\">commuters</b> now take an <b class=\"tg\">alternate</b> route into <b class=\"tg\">downtown</b> and arrive twenty minutes earlier."},{"id":16,"vol":1,"theme":"財務・監査","sentence":"The external **audit** confirmed that the division remained **profitable** for a fourth **quarterly** period. The figures are **confidential** until the board **finalizes** the report.","words":[{"w":"audit","jp":"監査、監査する","note":"`an external / internal audit`、`conduct an audit`。名詞 auditor（監査人）。","tier":"S","ref":"TSL 187","note_html":"<code>an external / internal audit</code>、<code>conduct an audit</code>。名詞 auditor（監査人）。"},{"w":"profitable","jp":"利益の出る、もうかる","note":"`a profitable division / venture`、`remain profitable`。名詞 profit / profitability。","tier":"A","ref":"TSL 373","note_html":"<code>a profitable division / venture</code>、<code>remain profitable</code>。名詞 profit / profitability。"},{"w":"quarterly","jp":"四半期の、四半期ごとに","note":"`quarterly report / earnings / meeting`。annually、biannually と対比して覚える。","tier":"A","ref":"TSL 425","note_html":"<code>quarterly report / earnings / meeting</code>。annually、biannually と対比して覚える。"},{"w":"confidential","jp":"機密の","note":"`strictly confidential`、`keep the information confidential`。文書のヘッダーによく登場する。","tier":"A","ref":"TSL 381","note_html":"<code>strictly confidential</code>、<code>keep the information confidential</code>。文書のヘッダーによく登場する。"},{"w":"finalize","jp":"最終決定する、仕上げる","note":"`finalize the report / contract / details`。決裁の話題で頻出。","tier":"A","ref":"TSL 390","note_html":"<code>finalize the report / contract / details</code>。決裁の話題で頻出。"}],"translation":"外部監査により、その部門が4四半期連続で黒字であったことが確認されました。数値は取締役会が報告書を最終決定するまで機密扱いです。","html":"The external <b class=\"tg\">audit</b> confirmed that the division remained <b class=\"tg\">profitable</b> for a fourth <b class=\"tg\">quarterly</b> period. The figures are <b class=\"tg\">confidential</b> until the board <b class=\"tg\">finalizes</b> the report."},{"id":17,"vol":1,"theme":"施設・環境","sentence":"Please place used **containers** in the blue bin so that the **recycling** company can collect them. Proper **disposal** of old **appliances** also lowers our monthly **utility** costs.","words":[{"w":"container","jp":"容器、コンテナ","note":"`a plastic / storage container`、`place items in a container`。Part 1の写真描写に出やすい。","tier":"S","ref":"TSL 154","note_html":"<code>a plastic / storage container</code>、<code>place items in a container</code>。Part 1の写真描写に出やすい。"},{"w":"recycling","jp":"リサイクル、再生利用","note":"`a recycling program / bin / company`。動詞 recycle、形容詞 recyclable。","tier":"S","ref":"TSL 109","note_html":"<code>a recycling program / bin / company</code>。動詞 recycle、形容詞 recyclable。"},{"w":"disposal","jp":"処分、廃棄","note":"`proper disposal of waste`、`waste disposal`。動詞句 `dispose of ~`（〜を処分する）は of が必須。","tier":"A","ref":"TSL 343","note_html":"<code>proper disposal of waste</code>、<code>waste disposal</code>。動詞句 <code>dispose of ~</code>（〜を処分する）は of が必須。"},{"w":"appliance","jp":"家電製品","note":"`kitchen / home appliances`、`an appliance store`。機器全般ではなく家庭用電化製品を指す。","tier":"S","ref":"TSL 88","note_html":"<code>kitchen / home appliances</code>、<code>an appliance store</code>。機器全般ではなく家庭用電化製品を指す。"},{"w":"utility","jp":"公共料金、公共設備","note":"`utility costs / bills`（光熱費）、`utility company`。複数形 utilities で「水道光熱」。","tier":"A","ref":"TSL 314","note_html":"<code>utility costs / bills</code>（光熱費）、<code>utility company</code>。複数形 utilities で「水道光熱」。"}],"translation":"使用済みの容器は、リサイクル業者が回収できるよう青い箱に入れてください。古い家電製品を適切に廃棄することも、毎月の光熱費の削減につながります。","html":"Please place used <b class=\"tg\">containers</b> in the blue bin so that the <b class=\"tg\">recycling</b> company can collect them. Proper <b class=\"tg\">disposal</b> of old <b class=\"tg\">appliances</b> also lowers our monthly <b class=\"tg\">utility</b> costs."},{"id":18,"vol":1,"theme":"購読・更新","sentence":"Your **subscription** will **expire** at the end of the month, and the discount code becomes **invalid** after that date. Please **renew** online and keep the **confirmation** number for your records.","words":[{"w":"subscription","jp":"定期購読、契約","note":"`renew / cancel a subscription`、`a subscription to a magazine`。前置詞は to。","tier":"S","ref":"TSL 53","note_html":"<code>renew / cancel a subscription</code>、<code>a subscription to a magazine</code>。前置詞は to。"},{"w":"expire","jp":"期限が切れる","note":"`The warranty / coupon expires on May 1.`。名詞 expiration（`expiration date` 有効期限）。","tier":"S","ref":"TSL 121","note_html":"<code>The warranty / coupon expires on May 1.</code>。名詞 expiration（<code>expiration date</code> 有効期限）。"},{"w":"invalid","jp":"無効な","note":"`an invalid ticket / code / password`。反意語 valid（`valid for 30 days` 30日間有効）と対で。","tier":"S","ref":"TSL 94","note_html":"<code>an invalid ticket / code / password</code>。反意語 valid（<code>valid for 30 days</code> 30日間有効）と対で。"},{"w":"renew","jp":"更新する","note":"`renew a subscription / membership / license`。名詞 renewal、形容詞 renewable。","tier":"S","ref":"TSL 110","note_html":"<code>renew a subscription / membership / license</code>。名詞 renewal、形容詞 renewable。"},{"w":"confirmation","jp":"確認、確認書","note":"`a confirmation number / email`、`send confirmation`。動詞 confirm。","tier":"A","ref":"TSL 309","note_html":"<code>a confirmation number / email</code>、<code>send confirmation</code>。動詞 confirm。"}],"translation":"お客様の定期購読は今月末で期限が切れ、その日以降は割引コードが無効になります。オンラインで更新のうえ、確認番号を記録として保管してください。","html":"Your <b class=\"tg\">subscription</b> will <b class=\"tg\">expire</b> at the end of the month, and the discount code becomes <b class=\"tg\">invalid</b> after that date. Please <b class=\"tg\">renew</b> online and keep the <b class=\"tg\">confirmation</b> number for your records."},{"id":19,"vol":1,"theme":"小売・店舗","sentence":"A **retailer** in the outlet mall is offering a **bargain** on winter coats. Bring the **coupon** to the **cashier** and look for the display at the end of **aisle** seven.","words":[{"w":"retailer","jp":"小売業者、小売店","note":"`a major retailer`、`online retailer`。retail（小売）、wholesale（卸売）と対で。","tier":"A","ref":"TSL 338","note_html":"<code>a major retailer</code>、<code>online retailer</code>。retail（小売）、wholesale（卸売）と対で。"},{"w":"bargain","jp":"お買い得品、特価／交渉する","note":"`a bargain on winter coats`、`bargain prices`。動詞では「値切る」。","tier":"S","ref":"TSL 230","note_html":"<code>a bargain on winter coats</code>、<code>bargain prices</code>。動詞では「値切る」。"},{"w":"coupon","jp":"クーポン、割引券","note":"`present / redeem a coupon`、`a discount coupon`。voucher とほぼ同義。","tier":"S","ref":"TSL 75","note_html":"<code>present / redeem a coupon</code>、<code>a discount coupon</code>。voucher とほぼ同義。"},{"w":"cashier","jp":"レジ係、会計担当","note":"`pay at the cashier`、`the cashier's counter`。cash register（レジ）と混同しない。","tier":"A","ref":"TSL 329","note_html":"<code>pay at the cashier</code>、<code>the cashier&#x27;s counter</code>。cash register（レジ）と混同しない。"},{"w":"aisle","jp":"通路","note":"`aisle seven`、`an aisle seat`（通路側の席）。発音は /aɪl/ で s は無音。Part 1・Part 2の頻出語。","tier":"S","ref":"TSL 138","note_html":"<code>aisle seven</code>、<code>an aisle seat</code>（通路側の席）。発音は /aɪl/ で s は無音。Part 1・Part 2の頻出語。"}],"translation":"アウトレットモールのある小売店が冬物コートを特価で販売しています。クーポンをレジ係に提示し、7番通路の端にある陳列をご覧ください。","html":"A <b class=\"tg\">retailer</b> in the outlet mall is offering a <b class=\"tg\">bargain</b> on winter coats. Bring the <b class=\"tg\">coupon</b> to the <b class=\"tg\">cashier</b> and look for the display at the end of <b class=\"tg\">aisle</b> seven."},{"id":20,"vol":1,"theme":"社内文書・承認","sentence":"The **memo** from the **administrative** department states that only a director may **authorize** overtime. Keep all related **correspondence** on file so that the **paperwork** can be verified later.","words":[{"w":"memo","jp":"社内連絡文書、メモ","note":"`send / circulate a memo`、`according to the memo`。正式には memorandum。Part 7の文書形式として頻出。","tier":"S","ref":"TSL 6","note_html":"<code>send / circulate a memo</code>、<code>according to the memo</code>。正式には memorandum。Part 7の文書形式として頻出。"},{"w":"administrative","jp":"管理の、事務の","note":"`administrative department / assistant / duties`。名詞 administration、administrator。","tier":"S","ref":"TSL 212","note_html":"<code>administrative department / assistant / duties</code>。名詞 administration、administrator。"},{"w":"authorize","jp":"許可する、権限を与える","note":"`authorize overtime / a payment`、`be authorized to do ~`（〜する権限がある）。名詞 authorization、authority。","tier":"S","ref":"TSL 213","note_html":"<code>authorize overtime / a payment</code>、<code>be authorized to do ~</code>（〜する権限がある）。名詞 authorization、authority。"},{"w":"correspondence","jp":"通信文、やり取り","note":"不可算名詞。`business correspondence`、`keep correspondence on file`。手紙・メール全般を指す。","tier":"A","ref":"TSL 284","note_html":"不可算名詞。<code>business correspondence</code>、<code>keep correspondence on file</code>。手紙・メール全般を指す。"},{"w":"paperwork","jp":"書類、事務手続き","note":"不可算名詞。`complete / fill out the paperwork`。「書類仕事」全般をまとめて指す。","tier":"S","ref":"TSL 222","note_html":"不可算名詞。<code>complete / fill out the paperwork</code>。「書類仕事」全般をまとめて指す。"}],"translation":"管理部門からの社内連絡文書によれば、残業を許可できるのは部長職のみです。後で書類を検証できるよう、関連する通信文はすべて保管しておいてください。","html":"The <b class=\"tg\">memo</b> from the <b class=\"tg\">administrative</b> department states that only a director may <b class=\"tg\">authorize</b> overtime. Keep all related <b class=\"tg\">correspondence</b> on file so that the <b class=\"tg\">paperwork</b> can be verified later."},{"id":21,"vol":2,"theme":"設備の不具合","sentence":"The heating unit began to **malfunction** last week, and an engineer confirmed that the **faulty** control panel is simply **outdated**. Management has decided to **remodel** the entire room, which will require a two-week **closure**.","words":[{"w":"malfunction","jp":"正常に作動しない／故障","note":"`The printer is malfunctioning.`、`a malfunction in the system`。動詞・名詞の両方で使う。","tier":"A","ref":"TSL 445","note_html":"<code>The printer is malfunctioning.</code>、<code>a malfunction in the system</code>。動詞・名詞の両方で使う。"},{"w":"faulty","jp":"欠陥のある、故障した","note":"`a faulty wire / switch / part`。defective の言い換えとしてPart 7で対応する。","tier":"A","ref":"TSL 497","note_html":"<code>a faulty wire / switch / part</code>。defective の言い換えとしてPart 7で対応する。"},{"w":"outdated","jp":"時代遅れの、旧式の","note":"`outdated equipment / software / information`。out-of-date とほぼ同義。","tier":"A","ref":"TSL 446","note_html":"<code>outdated equipment / software / information</code>。out-of-date とほぼ同義。"},{"w":"remodel","jp":"改装する","note":"`remodel the kitchen / lobby`。renovate の言い換えで、米国式の語。","tier":"A","ref":"TSL 509","note_html":"<code>remodel the kitchen / lobby</code>。renovate の言い換えで、米国式の語。"},{"w":"closure","jp":"閉鎖、閉店","note":"`a temporary closure`、`road closure`（通行止め）。動詞 close の名詞形。","tier":"A","ref":"TSL 543","note_html":"<code>a temporary closure</code>、<code>road closure</code>（通行止め）。動詞 close の名詞形。"}],"translation":"先週から暖房装置が正常に作動しなくなり、技術者が、欠陥のある制御パネルは単に旧式なだけだと確認しました。経営陣は部屋全体を改装することを決定し、これには2週間の閉鎖が必要になります。","html":"The heating unit began to <b class=\"tg\">malfunction</b> last week, and an engineer confirmed that the <b class=\"tg\">faulty</b> control panel is simply <b class=\"tg\">outdated</b>. Management has decided to <b class=\"tg\">remodel</b> the entire room, which will require a two-week <b class=\"tg\">closure</b>."},{"id":22,"vol":2,"theme":"安全・規則遵守","sentence":"All visitors must **comply with** the site rules, and wearing a helmet is **mandatory** beyond this point. As a **precaution**, please **adhere** to the marked path and remain **cautious** around moving vehicles.","words":[{"w":"comply with","jp":"〜に従う、順守する","note":"`comply with regulations / safety standards`。with が必須。名詞 compliance。","tier":"A","ref":"TSL 595","note_html":"<code>comply with regulations / safety standards</code>。with が必須。名詞 compliance。"},{"w":"mandatory","jp":"義務的な、必須の","note":"`Attendance is mandatory.`、`a mandatory training session`。反意語 optional。","tier":"A","ref":"TSL 421","note_html":"<code>Attendance is mandatory.</code>、<code>a mandatory training session</code>。反意語 optional。"},{"w":"precaution","jp":"予防措置、用心","note":"`as a precaution`（念のため）、`take precautions`。safety precautions の形が多い。","tier":"A","ref":"TSL 593","note_html":"<code>as a precaution</code>（念のため）、<code>take precautions</code>。safety precautions の形が多い。"},{"w":"adhere","jp":"順守する、付着する","note":"`adhere to the schedule / policy`。to が必須で、comply with と同義。","tier":"A","ref":"TSL 591","note_html":"<code>adhere to the schedule / policy</code>。to が必須で、comply with と同義。"},{"w":"cautious","jp":"慎重な、用心深い","note":"`be cautious about ~`、副詞 cautiously。名詞 caution（`with caution` 注意して）。","tier":"A","ref":"TSL 894","note_html":"<code>be cautious about ~</code>、副詞 cautiously。名詞 caution（<code>with caution</code> 注意して）。"}],"translation":"来場者は全員、現場の規則に従わなければならず、この先はヘルメットの着用が義務です。予防措置として、表示された通路を守り、走行中の車両の周辺では慎重に行動してください。","html":"All visitors must <b class=\"tg\">comply with</b> the site rules, and wearing a helmet is <b class=\"tg\">mandatory</b> beyond this point. As a <b class=\"tg\">precaution</b>, please <b class=\"tg\">adhere</b> to the marked path and remain <b class=\"tg\">cautious</b> around moving vehicles."},{"id":23,"vol":2,"theme":"採用活動","sentence":"A **recruiter** from the agency will meet **prospective** candidates on Thursday. Any **job seeker** who completed an **apprenticeship** in welding is encouraged to apply, as **recruitment** for the plant closes this month.","words":[{"w":"recruiter","jp":"採用担当者、人材紹介業者","note":"`a corporate recruiter`、`speak with a recruiter`。動詞 recruit。","tier":"A","ref":"TSL 533","note_html":"<code>a corporate recruiter</code>、<code>speak with a recruiter</code>。動詞 recruit。"},{"w":"prospective","jp":"見込みのある、将来の","note":"`prospective clients / employees / buyers`。potential の言い換え。","tier":"A","ref":"TSL 449","note_html":"<code>prospective clients / employees / buyers</code>。potential の言い換え。"},{"w":"job seeker","jp":"求職者","note":"`job seekers attending the fair`。job fair、job opening と同じ求人文脈で使う。","tier":"A","ref":"TSL 428","note_html":"<code>job seekers attending the fair</code>。job fair、job opening と同じ求人文脈で使う。"},{"w":"apprenticeship","jp":"見習い期間、実習制度","note":"`complete an apprenticeship`、`an apprenticeship program`。apprentice（見習い）から。","tier":"A","ref":"TSL 565","note_html":"<code>complete an apprenticeship</code>、<code>an apprenticeship program</code>。apprentice（見習い）から。"},{"w":"recruitment","jp":"採用、募集","note":"`recruitment process / drive`、`recruitment closes on ~`。hiring の言い換え。","tier":"A","ref":"TSL 645","note_html":"<code>recruitment process / drive</code>、<code>recruitment closes on ~</code>。hiring の言い換え。"}],"translation":"木曜日に人材紹介会社の採用担当者が、見込みのある候補者と面談します。溶接の見習い期間を修了した求職者はぜひ応募してください。当工場の採用は今月で締め切られます。","html":"A <b class=\"tg\">recruiter</b> from the agency will meet <b class=\"tg\">prospective</b> candidates on Thursday. Any <b class=\"tg\">job seeker</b> who completed an <b class=\"tg\">apprenticeship</b> in welding is encouraged to apply, as <b class=\"tg\">recruitment</b> for the plant closes this month."},{"id":24,"vol":2,"theme":"人事評価","sentence":"The annual performance **appraisal** rewards **dedication** rather than seniority, and employees who work with a **mentor** are more likely to earn **advancement**. As a result, staff **turnover** has fallen sharply.","words":[{"w":"appraisal","jp":"評価、査定","note":"`a performance appraisal`（人事考課）、`an appraisal of the property`（不動産査定）。","tier":"A","ref":"TSL 564","note_html":"<code>a performance appraisal</code>（人事考課）、<code>an appraisal of the property</code>（不動産査定）。"},{"w":"dedication","jp":"献身、専念","note":"`dedication to the job`、`years of dedication`。形容詞 dedicated（`a dedicated employee`）。","tier":"A","ref":"TSL 708","note_html":"<code>dedication to the job</code>、<code>years of dedication</code>。形容詞 dedicated（<code>a dedicated employee</code>）。"},{"w":"mentor","jp":"指導者、助言者","note":"`work with a mentor`、`serve as a mentor`。動詞用法もあり `mentor new hires`。","tier":"A","ref":"TSL 607","note_html":"<code>work with a mentor</code>、<code>serve as a mentor</code>。動詞用法もあり <code>mentor new hires</code>。"},{"w":"advancement","jp":"昇進、進歩","note":"`career advancement`、`opportunities for advancement`。promotion の言い換え。","tier":"A","ref":"TSL 656","note_html":"<code>career advancement</code>、<code>opportunities for advancement</code>。promotion の言い換え。"},{"w":"turnover","jp":"離職率、売上高","note":"`high employee turnover`（高い離職率）と `annual turnover`（年間売上高）の2義。文脈で判別する。","tier":"A","ref":"TSL 620","note_html":"<code>high employee turnover</code>（高い離職率）と <code>annual turnover</code>（年間売上高）の2義。文脈で判別する。"}],"translation":"年次の人事考課では、年功ではなく献身が評価されます。また、指導者とともに働く従業員のほうが昇進を得やすくなっています。その結果、社員の離職率は大幅に低下しました。","html":"The annual performance <b class=\"tg\">appraisal</b> rewards <b class=\"tg\">dedication</b> rather than seniority, and employees who work with a <b class=\"tg\">mentor</b> are more likely to earn <b class=\"tg\">advancement</b>. As a result, staff <b class=\"tg\">turnover</b> has fallen sharply."},{"id":25,"vol":2,"theme":"医療・薬局","sentence":"The **pharmacy** on the ground floor is open until eight, and a licensed **pharmacist** is always on duty. Your **physician** recommends an annual **medical checkup**, and the **pharmaceutical** company will cover the cost.","words":[{"w":"pharmacy","jp":"薬局、調剤薬局","note":"`pick up a prescription at the pharmacy`。drugstore とほぼ同義。","tier":"A","ref":"TSL 423","note_html":"<code>pick up a prescription at the pharmacy</code>。drugstore とほぼ同義。"},{"w":"pharmacist","jp":"薬剤師","note":"`consult a pharmacist`、`a licensed pharmacist`。","tier":"A","ref":"TSL 471","note_html":"<code>consult a pharmacist</code>、<code>a licensed pharmacist</code>。"},{"w":"physician","jp":"医師、内科医","note":"`see a physician`、`your primary care physician`。doctor の格式ばった言い換え。","tier":"A","ref":"TSL 611","note_html":"<code>see a physician</code>、<code>your primary care physician</code>。doctor の格式ばった言い換え。"},{"w":"(medical) checkup","jp":"健康診断","note":"`have / get an annual checkup`、`a routine checkup`。動詞は have / get。","tier":"A","ref":"TSL 854","note_html":"<code>have / get an annual checkup</code>、<code>a routine checkup</code>。動詞は have / get。"},{"w":"pharmaceutical","jp":"製薬の、医薬品の","note":"`a pharmaceutical company`、`pharmaceutical products`。名詞複数形 pharmaceuticals で「医薬品」。","tier":"A","ref":"TSL 582","note_html":"<code>a pharmaceutical company</code>、<code>pharmaceutical products</code>。名詞複数形 pharmaceuticals で「医薬品」。"}],"translation":"1階の薬局は8時まで営業しており、資格を持つ薬剤師が常時勤務しています。あなたの医師は年1回の健康診断を勧めており、その費用は製薬会社が負担します。","html":"The <b class=\"tg\">pharmacy</b> on the ground floor is open until eight, and a licensed <b class=\"tg\">pharmacist</b> is always on duty. Your <b class=\"tg\">physician</b> recommends an annual <b class=\"tg\">medical checkup</b>, and the <b class=\"tg\">pharmaceutical</b> company will cover the cost."},{"id":26,"vol":2,"theme":"不動産・賃貸","sentence":"The **landlord** has asked the current occupant to **vacate** the unit by the end of May. The **residential** building **adjacent** to the station is popular, so a new **renter** should be found quickly.","words":[{"w":"landlord","jp":"家主、大家","note":"`the landlord raised the rent`。借り手は tenant / renter。","tier":"A","ref":"TSL 578","note_html":"<code>the landlord raised the rent</code>。借り手は tenant / renter。"},{"w":"vacate","jp":"明け渡す、退去する","note":"`vacate the premises / apartment by ~`。形容詞 vacant、名詞 vacancy と語族で。","tier":"A","ref":"TSL 883","note_html":"<code>vacate the premises / apartment by ~</code>。形容詞 vacant、名詞 vacancy と語族で。"},{"w":"residential","jp":"住宅の","note":"`a residential area / building`。commercial（商業の）と対で出題される。","tier":"A","ref":"TSL 426","note_html":"<code>a residential area / building</code>。commercial（商業の）と対で出題される。"},{"w":"adjacent","jp":"隣接した","note":"`adjacent to the station`（駅に隣接して）。to が必須。next to の格式ばった言い換え。","tier":"A","ref":"TSL 479","note_html":"<code>adjacent to the station</code>（駅に隣接して）。to が必須。next to の格式ばった言い換え。"},{"w":"renter","jp":"借り手、賃借人","note":"`find a new renter`。動詞 rent、名詞 rental と併せて。","tier":"A","ref":"TSL 785","note_html":"<code>find a new renter</code>。動詞 rent、名詞 rental と併せて。"}],"translation":"家主は現在の入居者に、5月末までに部屋を明け渡すよう求めました。駅に隣接するその住宅用建物は人気があるため、新しい借り手はすぐに見つかるはずです。","html":"The <b class=\"tg\">landlord</b> has asked the current occupant to <b class=\"tg\">vacate</b> the unit by the end of May. The <b class=\"tg\">residential</b> building <b class=\"tg\">adjacent</b> to the station is popular, so a new <b class=\"tg\">renter</b> should be found quickly."},{"id":27,"vol":2,"theme":"貨物・流通","sentence":"Our **freight** costs rose after the **vendor** switched carriers, and one **parcel** was delayed for a week. The **distributor** has promised to **unload** the containers within two hours of arrival.","words":[{"w":"freight","jp":"貨物、貨物輸送料","note":"不可算名詞。`freight costs / charges`、`ship by freight`。","tier":"A","ref":"TSL 716","note_html":"不可算名詞。<code>freight costs / charges</code>、<code>ship by freight</code>。"},{"w":"vendor","jp":"納入業者、売り手","note":"`a local vendor`、`switch vendors`。supplier の言い換え。露店商の意味もある。","tier":"A","ref":"TSL 454","note_html":"<code>a local vendor</code>、<code>switch vendors</code>。supplier の言い換え。露店商の意味もある。"},{"w":"parcel","jp":"小包","note":"`send / deliver a parcel`。package とほぼ同義で、英国式でよく使われる。","tier":"A","ref":"TSL 729","note_html":"<code>send / deliver a parcel</code>。package とほぼ同義で、英国式でよく使われる。"},{"w":"distributor","jp":"卸売業者、販売代理店","note":"`an authorized distributor`。distribution、distribute と語族で。","tier":"A","ref":"TSL 815","note_html":"<code>an authorized distributor</code>。distribution、distribute と語族で。"},{"w":"unload","jp":"荷を降ろす","note":"`unload the truck / containers`。反意語 load。Part 1の写真描写でも出る。","tier":"A","ref":"TSL 881","note_html":"<code>unload the truck / containers</code>。反意語 load。Part 1の写真描写でも出る。"}],"translation":"納入業者が運送会社を変更した後、当社の貨物費用は上昇し、小包1個が1週間遅延しました。卸売業者は、到着から2時間以内にコンテナの荷降ろしを行うと約束しています。","html":"Our <b class=\"tg\">freight</b> costs rose after the <b class=\"tg\">vendor</b> switched carriers, and one <b class=\"tg\">parcel</b> was delayed for a week. The <b class=\"tg\">distributor</b> has promised to <b class=\"tg\">unload</b> the containers within two hours of arrival."},{"id":28,"vol":2,"theme":"給与・予算","sentence":"The **payroll** department reported that the budget was **insufficient** to **compensate** staff for weekend shifts. The director will **allocate** additional funds and settle the **accounts payable** by Friday.","words":[{"w":"payroll","jp":"給与支払名簿、給与総額","note":"`the payroll department`、`be on the payroll`（雇用されている）。","tier":"A","ref":"TSL 581","note_html":"<code>the payroll department</code>、<code>be on the payroll</code>（雇用されている）。"},{"w":"insufficient","jp":"不十分な","note":"`insufficient funds / evidence / time`。反意語 sufficient。","tier":"A","ref":"TSL 722","note_html":"<code>insufficient funds / evidence / time</code>。反意語 sufficient。"},{"w":"compensate","jp":"補償する、報酬を払う","note":"`compensate employees for overtime`（人＋for＋対象）。名詞 compensation。","tier":"A","ref":"TSL 569","note_html":"<code>compensate employees for overtime</code>（人＋for＋対象）。名詞 compensation。"},{"w":"allocate","jp":"割り当てる、配分する","note":"`allocate funds / resources to ~`。名詞 allocation。","tier":"A","ref":"TSL 699","note_html":"<code>allocate funds / resources to ~</code>。名詞 allocation。"},{"w":"accounts payable","jp":"買掛金、支払勘定","note":"`settle accounts payable`。対語は accounts receivable（売掛金）。経理文書の定型語。","tier":"A","ref":"TSL 686","note_html":"<code>settle accounts payable</code>。対語は accounts receivable（売掛金）。経理文書の定型語。"}],"translation":"給与部門は、週末勤務分の手当を従業員に支払うには予算が不十分だと報告しました。部長は追加資金を配分し、金曜日までに買掛金を清算する予定です。","html":"The <b class=\"tg\">payroll</b> department reported that the budget was <b class=\"tg\">insufficient</b> to <b class=\"tg\">compensate</b> staff for weekend shifts. The director will <b class=\"tg\">allocate</b> additional funds and settle the <b class=\"tg\">accounts payable</b> by Friday."},{"id":29,"vol":2,"theme":"会議・リハーサル","sentence":"A **preliminary** version of the program has been posted, and the **timetable** may still change. Speakers should **rehearse** in the **auditorium** on Monday, where the **facilitator** will explain the format.","words":[{"w":"preliminary","jp":"予備の、暫定の","note":"`a preliminary version / report / round`。「最終版ではない」という含意が問われる。","tier":"A","ref":"TSL 687","note_html":"<code>a preliminary version / report / round</code>。「最終版ではない」という含意が問われる。"},{"w":"timetable","jp":"予定表、時刻表","note":"`a revised timetable`、`according to the timetable`。schedule の言い換え。","tier":"A","ref":"TSL 653","note_html":"<code>a revised timetable</code>、<code>according to the timetable</code>。schedule の言い換え。"},{"w":"rehearse","jp":"リハーサルをする","note":"`rehearse for the presentation`。名詞 rehearsal（`dress rehearsal` 本番同様の通し稽古）。","tier":"A","ref":"TSL 615","note_html":"<code>rehearse for the presentation</code>。名詞 rehearsal（<code>dress rehearsal</code> 本番同様の通し稽古）。"},{"w":"auditorium","jp":"講堂、観客席","note":"`hold the ceremony in the auditorium`。大学・劇場の場面で頻出。","tier":"A","ref":"TSL 516","note_html":"<code>hold the ceremony in the auditorium</code>。大学・劇場の場面で頻出。"},{"w":"facilitator","jp":"進行役、まとめ役","note":"`serve as a facilitator`。動詞 facilitate（`facilitate discussion` 議論を促進する）。","tier":"A","ref":"TSL 573","note_html":"<code>serve as a facilitator</code>。動詞 facilitate（<code>facilitate discussion</code> 議論を促進する）。"}],"translation":"予備版のプログラムが掲示されていますが、予定表はまだ変更される可能性があります。登壇者は月曜日に講堂でリハーサルを行ってください。そこで進行役が形式について説明します。","html":"A <b class=\"tg\">preliminary</b> version of the program has been posted, and the <b class=\"tg\">timetable</b> may still change. Speakers should <b class=\"tg\">rehearse</b> in the <b class=\"tg\">auditorium</b> on Monday, where the <b class=\"tg\">facilitator</b> will explain the format."},{"id":30,"vol":2,"theme":"苦情処理","sentence":"We received a letter of **apology** from the supplier, but several **dissatisfied** customers are still requesting a **rebate**. As a **courtesy**, we will extend the warranty, which should **relieve** some of the pressure on our support team.","words":[{"w":"apology","jp":"謝罪、わび状","note":"`a letter of apology`、`accept / offer an apology`。動詞 apologize（`apologize for ~`）。","tier":"A","ref":"TSL 434","note_html":"<code>a letter of apology</code>、<code>accept / offer an apology</code>。動詞 apologize（<code>apologize for ~</code>）。"},{"w":"dissatisfied","jp":"不満を持った","note":"`dissatisfied customers`、`be dissatisfied with ~`。反意語 satisfied。","tier":"A","ref":"TSL 765","note_html":"<code>dissatisfied customers</code>、<code>be dissatisfied with ~</code>。反意語 satisfied。"},{"w":"rebate","jp":"払い戻し、割戻金","note":"`a mail-in rebate`、`offer a rebate`。refund が「返金」なのに対し、購入後の一部返戻を指す。","tier":"A","ref":"TSL 871","note_html":"<code>a mail-in rebate</code>、<code>offer a rebate</code>。refund が「返金」なのに対し、購入後の一部返戻を指す。"},{"w":"courtesy","jp":"礼儀、無料提供","note":"`as a courtesy`（サービスとして）、`courtesy shuttle`（無料送迎バス）。complimentary と近い用法。","tier":"A","ref":"TSL 761","note_html":"<code>as a courtesy</code>（サービスとして）、<code>courtesy shuttle</code>（無料送迎バス）。complimentary と近い用法。"},{"w":"relieve","jp":"和らげる、軽減する","note":"`relieve stress / pressure / congestion`。形容詞 relieved（ほっとした）。","tier":"A","ref":"TSL 736","note_html":"<code>relieve stress / pressure / congestion</code>。形容詞 relieved（ほっとした）。"}],"translation":"供給業者から謝罪の書面を受け取りましたが、不満を持つ顧客の何人かは依然として払い戻しを求めています。サービスとして保証期間を延長する予定で、これによりサポートチームの負担が多少軽減されるはずです。","html":"We received a letter of <b class=\"tg\">apology</b> from the supplier, but several <b class=\"tg\">dissatisfied</b> customers are still requesting a <b class=\"tg\">rebate</b>. As a <b class=\"tg\">courtesy</b>, we will extend the warranty, which should <b class=\"tg\">relieve</b> some of the pressure on our support team."},{"id":31,"vol":2,"theme":"IT導入","sentence":"The new software is fully **compatible** with our existing servers, and each department may **customize** the interface. Detailed **documentation** is available, so staff can **browse** the manual on a **tablet computer**.","words":[{"w":"compatible","jp":"互換性のある、両立する","note":"`compatible with the system`。with が必須。名詞 compatibility。","tier":"A","ref":"TSL 757","note_html":"<code>compatible with the system</code>。with が必須。名詞 compatibility。"},{"w":"customize","jp":"好みに合わせる、特注する","note":"`customize the settings / interface`。形容詞 customizable。","tier":"A","ref":"TSL 707","note_html":"<code>customize the settings / interface</code>。形容詞 customizable。"},{"w":"documentation","jp":"説明書類、文書一式","note":"不可算名詞。`technical documentation`、`supporting documentation`（証拠書類）。","tier":"A","ref":"TSL 675","note_html":"不可算名詞。<code>technical documentation</code>、<code>supporting documentation</code>（証拠書類）。"},{"w":"browse","jp":"ざっと目を通す、閲覧する","note":"`browse the manual / catalog / website`。目を通す程度の読み方を指す。","tier":"A","ref":"TSL 806","note_html":"<code>browse the manual / catalog / website</code>。目を通す程度の読み方を指す。"},{"w":"tablet computer","jp":"タブレット端末","note":"`read on a tablet`。laptop、desktop と並べて出題される。","tier":"A","ref":"TSL 746","note_html":"<code>read on a tablet</code>。laptop、desktop と並べて出題される。"}],"translation":"新しいソフトウェアは既存のサーバーと完全な互換性があり、各部署がインターフェースを好みに合わせて設定できます。詳細な説明書類も用意されているため、従業員はタブレット端末でマニュアルに目を通すことができます。","html":"The new software is fully <b class=\"tg\">compatible</b> with our existing servers, and each department may <b class=\"tg\">customize</b> the interface. Detailed <b class=\"tg\">documentation</b> is available, so staff can <b class=\"tg\">browse</b> the manual on a <b class=\"tg\">tablet computer</b>."},{"id":32,"vol":2,"theme":"製造・設計","sentence":"The **blueprint** shows how the **assembly line** will be reorganized to **streamline** production. Every station will be **equipped** with **durable** tools designed to last a decade.","words":[{"w":"blueprint","jp":"設計図、青写真","note":"`according to the blueprint`、`draw up a blueprint`。計画案の比喩でも使う。","tier":"A","ref":"TSL 892","note_html":"<code>according to the blueprint</code>、<code>draw up a blueprint</code>。計画案の比喩でも使う。"},{"w":"assembly line","jp":"組立ライン","note":"`work on the assembly line`。assembly（組立、集会）、assemble（組み立てる、集まる）と語族で。","tier":"A","ref":"TSL 540","note_html":"<code>work on the assembly line</code>。assembly（組立、集会）、assemble（組み立てる、集まる）と語族で。"},{"w":"streamline","jp":"効率化する、合理化する","note":"`streamline the process / operations`。「無駄をなくす」の意味で経営文脈に頻出。","tier":"A","ref":"TSL 793","note_html":"<code>streamline the process / operations</code>。「無駄をなくす」の意味で経営文脈に頻出。"},{"w":"equip","jp":"備え付ける","note":"`be equipped with ~`（〜を備えている）が最頻出形。名詞 equipment は不可算。","tier":"A","ref":"TSL 462","note_html":"<code>be equipped with ~</code>（〜を備えている）が最頻出形。名詞 equipment は不可算。"},{"w":"durable","jp":"丈夫な、耐久性のある","note":"`durable materials`、`built to be durable`。名詞 durability。","tier":"A","ref":"TSL 442","note_html":"<code>durable materials</code>、<code>built to be durable</code>。名詞 durability。"}],"translation":"設計図には、生産を効率化するために組立ラインをどう再編するかが示されています。各作業場には、10年もつよう設計された丈夫な工具が備え付けられます。","html":"The <b class=\"tg\">blueprint</b> shows how the <b class=\"tg\">assembly line</b> will be reorganized to <b class=\"tg\">streamline</b> production. Every station will be <b class=\"tg\">equipped</b> with <b class=\"tg\">durable</b> tools designed to last a decade."},{"id":33,"vol":2,"theme":"法務・知的財産","sentence":"Our **attorney** advised us to file for a **patent** before announcing the **invention**. Written **consent** from the research partner is required, along with formal **authorization** from the board.","words":[{"w":"attorney","jp":"弁護士","note":"`consult an attorney`、`attorney's fees`。lawyer の米国式の言い換え。","tier":"A","ref":"TSL 660","note_html":"<code>consult an attorney</code>、<code>attorney&#x27;s fees</code>。lawyer の米国式の言い換え。"},{"w":"patent","jp":"特許","note":"`file for / apply for a patent`、`a patent application`。動詞では「特許を取る」。","tier":"A","ref":"TSL 685","note_html":"<code>file for / apply for a patent</code>、<code>a patent application</code>。動詞では「特許を取る」。"},{"w":"invention","jp":"発明、発明品","note":"`patent an invention`。動詞 invent、名詞 inventor。","tier":"A","ref":"TSL 681","note_html":"<code>patent an invention</code>。動詞 invent、名詞 inventor。"},{"w":"consent","jp":"同意、承諾","note":"`written consent`、`give / obtain consent`。動詞では `consent to ~`。","tier":"A","ref":"TSL 669","note_html":"<code>written consent</code>、<code>give / obtain consent</code>。動詞では <code>consent to ~</code>。"},{"w":"authorization","jp":"許可、承認","note":"`prior authorization`（事前承認）、`without authorization`。動詞 authorize。","tier":"A","ref":"TSL 661","note_html":"<code>prior authorization</code>（事前承認）、<code>without authorization</code>。動詞 authorize。"}],"translation":"当社の弁護士は、発明を公表する前に特許を出願するよう助言しました。研究パートナーからの書面による同意と、取締役会からの正式な承認が必要です。","html":"Our <b class=\"tg\">attorney</b> advised us to file for a <b class=\"tg\">patent</b> before announcing the <b class=\"tg\">invention</b>. Written <b class=\"tg\">consent</b> from the research partner is required, along with formal <b class=\"tg\">authorization</b> from the board."},{"id":34,"vol":2,"theme":"出張・宿泊","sentence":"The **airfare** was reasonable, but there was no space left in the **overhead bin**. At the hotel, the **concierge** arranged an afternoon **excursion**, and every room includes a full range of **amenities**.","words":[{"w":"airfare","jp":"航空運賃","note":"`round-trip airfare`、`airfare and lodging`。fare の複合語。","tier":"A","ref":"TSL 493","note_html":"<code>round-trip airfare</code>、<code>airfare and lodging</code>。fare の複合語。"},{"w":"overhead bin","jp":"頭上の手荷物入れ","note":"`stow luggage in the overhead bin`。機内アナウンスの定番。","tier":"A","ref":"TSL 506","note_html":"<code>stow luggage in the overhead bin</code>。機内アナウンスの定番。"},{"w":"concierge","jp":"コンシェルジュ、接客係","note":"`ask the concierge for directions`。ホテル場面のPart 3で頻出。","tier":"A","ref":"TSL 668","note_html":"<code>ask the concierge for directions</code>。ホテル場面のPart 3で頻出。"},{"w":"excursion","jp":"小旅行、遠足","note":"`a guided excursion`、`an afternoon excursion`。tour の言い換え。","tier":"A","ref":"TSL 463","note_html":"<code>a guided excursion</code>、<code>an afternoon excursion</code>。tour の言い換え。"},{"w":"amenity","jp":"設備、アメニティ","note":"通常は複数形 amenities。`hotel amenities`、`a full range of amenities`。","tier":"A","ref":"TSL 845","note_html":"通常は複数形 amenities。<code>hotel amenities</code>、<code>a full range of amenities</code>。"}],"translation":"航空運賃は手ごろでしたが、頭上の手荷物入れには空きが残っていませんでした。ホテルではコンシェルジュが午後の小旅行を手配してくれ、全客室に一通りの設備が備わっています。","html":"The <b class=\"tg\">airfare</b> was reasonable, but there was no space left in the <b class=\"tg\">overhead bin</b>. At the hotel, the <b class=\"tg\">concierge</b> arranged an afternoon <b class=\"tg\">excursion</b>, and every room includes a full range of <b class=\"tg\">amenities</b>."},{"id":35,"vol":2,"theme":"広報・宣伝活動","sentence":"A well-known **advertiser** has offered to run our campaign **nationwide**, which should generate considerable **publicity**. The company **spokesperson** will appear alongside an **influential** industry blogger.","words":[{"w":"advertiser","jp":"広告主","note":"`a major advertiser`。advertisement（広告）、advertising（広告業）と区別する。","tier":"A","ref":"TSL 657","note_html":"<code>a major advertiser</code>。advertisement（広告）、advertising（広告業）と区別する。"},{"w":"nationwide","jp":"全国的に、全国的な","note":"`expand nationwide`、`a nationwide campaign`。副詞・形容詞の両用法。","tier":"A","ref":"TSL 779","note_html":"<code>expand nationwide</code>、<code>a nationwide campaign</code>。副詞・形容詞の両用法。"},{"w":"publicity","jp":"知名度、宣伝","note":"不可算名詞。`generate / attract publicity`、`a publicity campaign`。","tier":"A","ref":"TSL 784","note_html":"不可算名詞。<code>generate / attract publicity</code>、<code>a publicity campaign</code>。"},{"w":"spokesperson","jp":"広報担当者","note":"`a company spokesperson said ~`。ニュース記事形式のPart 7で頻出。","tier":"A","ref":"TSL 491","note_html":"<code>a company spokesperson said ~</code>。ニュース記事形式のPart 7で頻出。"},{"w":"influential","jp":"影響力のある","note":"`an influential figure / critic`。名詞 influence（`have an influence on ~`）。","tier":"A","ref":"TSL 778","note_html":"<code>an influential figure / critic</code>。名詞 influence（<code>have an influence on ~</code>）。"}],"translation":"著名な広告主が当社のキャンペーンを全国規模で展開すると申し出ており、これは相当な知名度を生むはずです。会社の広報担当者が、影響力のある業界ブロガーとともに登場する予定です。","html":"A well-known <b class=\"tg\">advertiser</b> has offered to run our campaign <b class=\"tg\">nationwide</b>, which should generate considerable <b class=\"tg\">publicity</b>. The company <b class=\"tg\">spokesperson</b> will appear alongside an <b class=\"tg\">influential</b> industry blogger."},{"id":36,"vol":2,"theme":"経営・起業","sentence":"The **founder**, an **ambitious** young **entrepreneur**, decided to **merge** with a rival firm as part of a **strategic** plan to enter the Asian market.","words":[{"w":"founder","jp":"創業者、設立者","note":"`the founder of the company`、`co-founder`。動詞 found（found–founded–founded）。","tier":"A","ref":"TSL 771","note_html":"<code>the founder of the company</code>、<code>co-founder</code>。動詞 found（found–founded–founded）。"},{"w":"ambitious","jp":"野心的な、意欲的な","note":"`an ambitious plan / project`、`an ambitious young executive`。人にも計画にも使う。","tier":"A","ref":"TSL 700","note_html":"<code>an ambitious plan / project</code>、<code>an ambitious young executive</code>。人にも計画にも使う。"},{"w":"entrepreneur","jp":"起業家","note":"`a successful entrepreneur`。名詞 entrepreneurship（起業家精神）。","tier":"A","ref":"TSL 676","note_html":"<code>a successful entrepreneur</code>。名詞 entrepreneurship（起業家精神）。"},{"w":"merge","jp":"合併する","note":"`merge with a rival firm`。with が伴う。名詞 merger（`a merger and acquisition`）。","tier":"A","ref":"TSL 469","note_html":"<code>merge with a rival firm</code>。with が伴う。名詞 merger（<code>a merger and acquisition</code>）。"},{"w":"strategic","jp":"戦略的な","note":"`a strategic plan / partnership / decision`。名詞 strategy、副詞 strategically。","tier":"A","ref":"TSL 876","note_html":"<code>a strategic plan / partnership / decision</code>。名詞 strategy、副詞 strategically。"}],"translation":"創業者である野心的な若手起業家は、アジア市場に参入するための戦略的計画の一環として、競合他社と合併することを決めました。","html":"The <b class=\"tg\">founder</b>, an <b class=\"tg\">ambitious</b> young <b class=\"tg\">entrepreneur</b>, decided to <b class=\"tg\">merge</b> with a rival firm as part of a <b class=\"tg\">strategic</b> plan to enter the Asian market."},{"id":37,"vol":2,"theme":"大学・奨学金","sentence":"The **faculty** voted to freeze **tuition** for the coming year, and a new **scholarship** will be offered to students on the eastern **campus**. Applicants must submit a copy of their **diploma**.","words":[{"w":"faculty","jp":"教授陣、学部","note":"集合名詞。`faculty members`、`the faculty voted`。「能力」の意味もあるがTOEICでは大学文脈。","tier":"A","ref":"TSL 767","note_html":"集合名詞。<code>faculty members</code>、<code>the faculty voted</code>。「能力」の意味もあるがTOEICでは大学文脈。"},{"w":"tuition","jp":"授業料","note":"不可算名詞。`pay / raise / freeze tuition`、`tuition reimbursement`（学費補助）。","tier":"A","ref":"TSL 694","note_html":"不可算名詞。<code>pay / raise / freeze tuition</code>、<code>tuition reimbursement</code>（学費補助）。"},{"w":"scholarship","jp":"奨学金","note":"`apply for / receive a scholarship`、`a full scholarship`。","tier":"A","ref":"TSL 427","note_html":"<code>apply for / receive a scholarship</code>、<code>a full scholarship</code>。"},{"w":"campus","jp":"キャンパス、構内","note":"`on campus`（構内で、冠詞なし）。前置詞の使い方が問われる。","tier":"A","ref":"TSL 662","note_html":"<code>on campus</code>（構内で、冠詞なし）。前置詞の使い方が問われる。"},{"w":"diploma","jp":"卒業証書、修了証","note":"`a copy of your diploma`、`earn a diploma`。degree（学位）との違いに注意。","tier":"A","ref":"TSL 814","note_html":"<code>a copy of your diploma</code>、<code>earn a diploma</code>。degree（学位）との違いに注意。"}],"translation":"教授陣は来年度の授業料を据え置くことを議決し、東キャンパスの学生に新たな奨学金が支給されることになりました。応募者は卒業証書の写しを提出する必要があります。","html":"The <b class=\"tg\">faculty</b> voted to freeze <b class=\"tg\">tuition</b> for the coming year, and a new <b class=\"tg\">scholarship</b> will be offered to students on the eastern <b class=\"tg\">campus</b>. Applicants must submit a copy of their <b class=\"tg\">diploma</b>."},{"id":38,"vol":2,"theme":"環境・廃棄物","sentence":"Energy **consumption** has fallen since the office replaced **disposable** cups with ceramic mugs. Please **dispose of** food waste in the green bin, and note that **environmentally** friendly practices help us **accumulate** points toward certification.","words":[{"w":"consumption","jp":"消費、消費量","note":"`energy / fuel consumption`、`reduce consumption`。動詞 consume、名詞 consumer。","tier":"A","ref":"TSL 758","note_html":"<code>energy / fuel consumption</code>、<code>reduce consumption</code>。動詞 consume、名詞 consumer。"},{"w":"disposable","jp":"使い捨ての","note":"`disposable cups / gloves`。reusable（再利用可能な）と対で。","tier":"A","ref":"TSL 860","note_html":"<code>disposable cups / gloves</code>。reusable（再利用可能な）と対で。"},{"w":"dispose of","jp":"〜を処分する","note":"of が必須。`dispose of waste properly`。名詞 disposal。Part 5の前置詞問題に直結。","tier":"A","ref":"TSL 860","note_html":"of が必須。<code>dispose of waste properly</code>。名詞 disposal。Part 5の前置詞問題に直結。"},{"w":"environmentally","jp":"環境的に","note":"`environmentally friendly`（環境に優しい）が最頻出。この形でまとめて覚える。","tier":"A","ref":"TSL 818","note_html":"<code>environmentally friendly</code>（環境に優しい）が最頻出。この形でまとめて覚える。"},{"w":"accumulate","jp":"蓄積する、たまる","note":"`accumulate points / experience / dust`。自動詞・他動詞の両方で使う。","tier":"A","ref":"TSL 563","note_html":"<code>accumulate points / experience / dust</code>。自動詞・他動詞の両方で使う。"}],"translation":"オフィスが使い捨てのカップを陶器のマグに切り替えて以来、エネルギー消費量は減少しています。生ごみは緑の箱に処分してください。また、環境に優しい取り組みは、認証取得に向けたポイントの蓄積にも役立ちます。","html":"Energy <b class=\"tg\">consumption</b> has fallen since the office replaced <b class=\"tg\">disposable</b> cups with ceramic mugs. Please <b class=\"tg\">dispose of</b> food waste in the green bin, and note that <b class=\"tg\">environmentally</b> friendly practices help us <b class=\"tg\">accumulate</b> points toward certification."},{"id":39,"vol":2,"theme":"飲食・ケータリング","sentence":"The **caterer** hired for the reception is known for its **culinary** skill, and its **specialty** is regional seafood. Fresh **baked goods** will also be delivered from the **diner** across the street.","words":[{"w":"caterer","jp":"仕出し業者","note":"`hire a caterer`。動詞 cater、名詞 catering と語族で。","tier":"A","ref":"TSL 439","note_html":"<code>hire a caterer</code>。動詞 cater、名詞 catering と語族で。"},{"w":"culinary","jp":"料理の","note":"`culinary skill / school / arts`。cooking の格式ばった形容詞。","tier":"A","ref":"TSL 629","note_html":"<code>culinary skill / school / arts</code>。cooking の格式ばった形容詞。"},{"w":"specialty","jp":"名物、専門分野","note":"`the restaurant's specialty`、`a specialty store`（専門店）。英国式は speciality。","tier":"A","ref":"TSL 587","note_html":"<code>the restaurant&#x27;s specialty</code>、<code>a specialty store</code>（専門店）。英国式は speciality。"},{"w":"baked goods","jp":"焼き菓子、パン類","note":"常に複数形。`fresh baked
