ector** will **inspect** the loading dock on Tuesday. Ms. Vance will **supervise** the crew, because direct **supervision** is required during the visit, and a second **inspector** will review the report afterward.","words":[{"w":"safety inspector","jp":"安全検査官","note":"`The safety inspector will visit ~`。工場・建設現場の場面で頻出。","tier":"A","ref":"TSL 306","note_html":"<code>The safety inspector will visit ~</code>。工場・建設現場の場面で頻出。"},{"w":"inspect","jp":"検査する、点検する","note":"`inspect the equipment / dock`。名詞 inspection。","tier":"S","ref":"TSL 139","note_html":"<code>inspect the equipment / dock</code>。名詞 inspection。"},{"w":"supervise","jp":"監督する","note":"`supervise the crew / a project`。oversee の言い換え。","tier":"S","ref":"TSL 199","note_html":"<code>supervise the crew / a project</code>。oversee の言い換え。"},{"w":"supervision","jp":"監督、管理","note":"`under close supervision`、`direct supervision is required`。不可算名詞。","tier":"S","ref":"TSL 199","note_html":"<code>under close supervision</code>、<code>direct supervision is required</code>。不可算名詞。"},{"w":"inspector","jp":"検査官、調査員","note":"`a second inspector will review ~`。動詞 inspect の行為者形。","tier":"A","ref":"TSL 306","note_html":"<code>a second inspector will review ~</code>。動詞 inspect の行為者形。"}],"translation":"安全検査官が火曜日に荷積み場を検査します。訪問中は直接の監督が求められるため、ヴァンスさんが作業員を監督し、その後もう1名の検査官が報告書を確認します。","html":"The <b class=\"tg\">safety inspector</b> will <b class=\"tg\">inspect</b> the loading dock on Tuesday. Ms. Vance will <b class=\"tg\">supervise</b> the crew, because direct <b class=\"tg\">supervision</b> is required during the visit, and a second <b class=\"tg\">inspector</b> will review the report afterward."},{"id":86,"vol":5,"theme":"管理部門","sentence":"The **administrative department** has updated the staff **directory**, and the new **administrator** starts on Monday. Careful **coordination** will be needed when the visiting **delegation** arrives next week.","words":[{"w":"administrative department","jp":"総務部、管理部門","note":"`a notice from the administrative department`。組織図の語彙として押さえる。","tier":"S","ref":"TSL 212","note_html":"<code>a notice from the administrative department</code>。組織図の語彙として押さえる。"},{"w":"directory","jp":"名簿、住所録","note":"`a staff directory`、`a building directory`（館内案内板）。","tier":"A","ref":"TSL 342","note_html":"<code>a staff directory</code>、<code>a building directory</code>（館内案内板）。"},{"w":"administrator","jp":"管理者、事務職員","note":"`the new administrator starts Monday`。動詞 administer、名詞 administration。","tier":"A","ref":"TSL 378","note_html":"<code>the new administrator starts Monday</code>。動詞 administer、名詞 administration。"},{"w":"coordination","jp":"調整、連携","note":"`careful coordination between departments`。動詞 coordinate、名詞 coordinator。","tier":"S","ref":"TSL 221","note_html":"<code>careful coordination between departments</code>。動詞 coordinate、名詞 coordinator。"},{"w":"delegation","jp":"代表団、委任","note":"`a visiting delegation`（訪問団）と `delegation of authority`（権限委譲）の2義。","tier":"A","ref":"TSL 274","note_html":"<code>a visiting delegation</code>（訪問団）と <code>delegation of authority</code>（権限委譲）の2義。"}],"translation":"総務部が職員名簿を更新し、新しい事務職員が月曜日から着任します。来週、訪問団が到着する際には入念な調整が必要になります。","html":"The <b class=\"tg\">administrative department</b> has updated the staff <b class=\"tg\">directory</b>, and the new <b class=\"tg\">administrator</b> starts on Monday. Careful <b class=\"tg\">coordination</b> will be needed when the visiting <b class=\"tg\">delegation</b> arrives next week."},{"id":87,"vol":5,"theme":"給与・福利厚生","sentence":"Your **paycheck** now includes the bonus that is paid **annually**, and the performance review is held **yearly** in March. Joining the pension plan is **optional**, and we send a note of **appreciation** to staff who complete ten years.","words":[{"w":"paycheck","jp":"給料、給与小切手","note":"`Your paycheck includes ~`、`a weekly paycheck`。payroll（給与支払名簿）と区別する。","tier":"A","ref":"TSL 320","note_html":"<code>Your paycheck includes ~</code>、<code>a weekly paycheck</code>。payroll（給与支払名簿）と区別する。"},{"w":"annually","jp":"年に1度、毎年","note":"`paid annually`、`held annually`。形容詞 annual。","tier":"A","ref":"TSL 297","note_html":"<code>paid annually</code>、<code>held annually</code>。形容詞 annual。"},{"w":"yearly","jp":"年1回の、毎年","note":"`a yearly review`。annually とほぼ同義で、言い換え問題に出る。","tier":"A","ref":"TSL 411","note_html":"<code>a yearly review</code>。annually とほぼ同義で、言い換え問題に出る。"},{"w":"optional","jp":"任意の、選択制の","note":"`Joining is optional.`。反意語 mandatory / required。","tier":"A","ref":"TSL 319","note_html":"<code>Joining is optional.</code>。反意語 mandatory / required。"},{"w":"appreciation","jp":"感謝、正しい評価","note":"`a note of appreciation`、`in appreciation of your service`。動詞 appreciate。","tier":"A","ref":"TSL 412","note_html":"<code>a note of appreciation</code>、<code>in appreciation of your service</code>。動詞 appreciate。"}],"translation":"あなたの給与には、年に1度支給される賞与が含まれるようになりました。また、人事考課は毎年3月に行われます。年金制度への加入は任意で、勤続10年に達した職員には感謝状をお送りしています。","html":"Your <b class=\"tg\">paycheck</b> now includes the bonus that is paid <b class=\"tg\">annually</b>, and the performance review is held <b class=\"tg\">yearly</b> in March. Joining the pension plan is <b class=\"tg\">optional</b>, and we send a note of <b class=\"tg\">appreciation</b> to staff who complete ten years."},{"id":88,"vol":5,"theme":"インターンシップ","sentence":"Applicants for the **internship** must **enroll** by June and demonstrate **proficiency** in Spanish. A **knowledgeable** mentor will **instruct** each new member during the first week.","words":[{"w":"internship","jp":"インターンシップ、実習期間","note":"`apply for an internship`、`complete an internship`。名詞 intern。","tier":"A","ref":"TSL 345","note_html":"<code>apply for an internship</code>、<code>complete an internship</code>。名詞 intern。"},{"w":"enroll","jp":"登録する、入学する","note":"`enroll in a course / by June`。in が必須。名詞 enrollment。","tier":"A","ref":"TSL 353","note_html":"<code>enroll in a course / by June</code>。in が必須。名詞 enrollment。"},{"w":"proficiency","jp":"熟達、能力","note":"`proficiency in Spanish`。in が必須。形容詞 proficient。語学試験の説明で頻出。","tier":"A","ref":"TSL 294","note_html":"<code>proficiency in Spanish</code>。in が必須。形容詞 proficient。語学試験の説明で頻出。"},{"w":"knowledgeable","jp":"知識豊富な","note":"`a knowledgeable mentor / guide`、`knowledgeable about ~`。","tier":"A","ref":"TSL 346","note_html":"<code>a knowledgeable mentor / guide</code>、<code>knowledgeable about ~</code>。"},{"w":"instruct","jp":"指導する、指示する","note":"`instruct new members`、`instruct someone to do ~`。名詞 instruction、instructor。","tier":"A","ref":"TSL 392","note_html":"<code>instruct new members</code>、<code>instruct someone to do ~</code>。名詞 instruction、instructor。"}],"translation":"インターンシップの応募者は6月までに登録し、スペイン語の熟達度を示さなければなりません。最初の1週間は、知識豊富な指導役が新メンバーそれぞれを指導します。","html":"Applicants for the <b class=\"tg\">internship</b> must <b class=\"tg\">enroll</b> by June and demonstrate <b class=\"tg\">proficiency</b> in Spanish. A <b class=\"tg\">knowledgeable</b> mentor will <b class=\"tg\">instruct</b> each new member during the first week."},{"id":89,"vol":5,"theme":"業績・収益性","sentence":"The redesign had a clear **impact** on **profitability**, and the team has been unusually **productive** this quarter. Although we **incur** higher shipping costs, customer service remains **outstanding**.","words":[{"w":"impact","jp":"影響","note":"`have an impact on ~`。on が必須。動詞用法もある。","tier":"S","ref":"TSL 171","note_html":"<code>have an impact on ~</code>。on が必須。動詞用法もある。"},{"w":"profitability","jp":"収益性","note":"`improve profitability`。形容詞 profitable、名詞 profit。","tier":"A","ref":"TSL 373","note_html":"<code>improve profitability</code>。形容詞 profitable、名詞 profit。"},{"w":"productive","jp":"生産的な、実り多い","note":"`a productive quarter / meeting`。名詞 productivity、動詞 produce。","tier":"A","ref":"TSL 271","note_html":"<code>a productive quarter / meeting</code>。名詞 productivity、動詞 produce。"},{"w":"incur","jp":"費用などを被る、招く","note":"`incur costs / a fee / a penalty`。「自ら招いて負担する」の意。過去形は incurred。","tier":"A","ref":"TSL 391","note_html":"<code>incur costs / a fee / a penalty</code>。「自ら招いて負担する」の意。過去形は incurred。"},{"w":"outstanding","jp":"優れた／未払いの","note":"`outstanding service` と `an outstanding balance`（未払い残高）。TOEICでは後者も出る。","tier":"S","ref":"TSL 167","note_html":"<code>outstanding service</code> と <code>an outstanding balance</code>（未払い残高）。TOEICでは後者も出る。"}],"translation":"デザイン刷新は収益性に明確な影響を与え、チームは今四半期、異例なほど生産的でした。より高い配送費を負担してはいるものの、顧客サービスは優れたままです。","html":"The redesign had a clear <b class=\"tg\">impact</b> on <b class=\"tg\">profitability</b>, and the team has been unusually <b class=\"tg\">productive</b> this quarter. Although we <b class=\"tg\">incur</b> higher shipping costs, customer service remains <b class=\"tg\">outstanding</b>."},{"id":90,"vol":5,"theme":"顧客の愛顧","sentence":"We thank our customers for their continued **patronage**, and those who **patronize** the shop weekly earn double points. The owner gives **generously** to local causes, which has raised the restaurant's **popularity** among **loyal** diners.","words":[{"w":"patronage","jp":"愛顧、ひいき","note":"`Thank you for your continued patronage.`（毎度ご利用ありがとうございます）が定型。","tier":"A","ref":"TSL 269","note_html":"<code>Thank you for your continued patronage.</code>（毎度ご利用ありがとうございます）が定型。"},{"w":"patronize","jp":"ひいきにする、常連になる","note":"`patronize a shop`。名詞 patron（常連客）。","tier":"A","ref":"TSL 269","note_html":"<code>patronize a shop</code>。名詞 patron（常連客）。"},{"w":"generously","jp":"気前よく","note":"`give generously`、`generously donated by ~`。形容詞 generous。","tier":"A","ref":"TSL 369","note_html":"<code>give generously</code>、<code>generously donated by ~</code>。形容詞 generous。"},{"w":"popularity","jp":"人気","note":"`raise / gain popularity`、`popularity among ~`。形容詞 popular。","tier":"A","ref":"TSL 335","note_html":"<code>raise / gain popularity</code>、<code>popularity among ~</code>。形容詞 popular。"},{"w":"loyal","jp":"忠実な、常連の","note":"`loyal customers / diners`。名詞 loyalty、`loyalty program`。","tier":"A","ref":"TSL 393","note_html":"<code>loyal customers / diners</code>。名詞 loyalty、<code>loyalty program</code>。"}],"translation":"日頃のご愛顧に感謝申し上げます。毎週ご利用くださるお客様にはポイントが2倍付与されます。オーナーが地域の活動に気前よく寄付していることも、常連の来店客の間で当店の人気を高めています。","html":"We thank our customers for their continued <b class=\"tg\">patronage</b>, and those who <b class=\"tg\">patronize</b> the shop weekly earn double points. The owner gives <b class=\"tg\">generously</b> to local causes, which has raised the restaurant&#x27;s <b class=\"tg\">popularity</b> among <b class=\"tg\">loyal</b> diners."},{"id":91,"vol":5,"theme":"配布資料","sentence":"Each participant receives an **information packet** containing a **booklet** with an **overview** of the program. The technical **specification** is in a second **packet**, which is handed out at the door.","words":[{"w":"information packet","jp":"資料一式","note":"`receive an information packet`。説明会で配られる封筒入りの資料を指す。","tier":"A","ref":"TSL 358","note_html":"<code>receive an information packet</code>。説明会で配られる封筒入りの資料を指す。"},{"w":"booklet","jp":"小冊子","note":"`a booklet with an overview`。pamphlet、brochure と近い語。","tier":"A","ref":"TSL 351","note_html":"<code>a booklet with an overview</code>。pamphlet、brochure と近い語。"},{"w":"overview","jp":"概要","note":"`an overview of the program`、`give a brief overview`。summary の言い換え。","tier":"A","ref":"TSL 396","note_html":"<code>an overview of the program</code>、<code>give a brief overview</code>。summary の言い換え。"},{"w":"specification","jp":"仕様、仕様書","note":"通常は複数形 specs。`technical specifications`。動詞 specify。","tier":"A","ref":"TSL 360","note_html":"通常は複数形 specs。<code>technical specifications</code>。動詞 specify。"},{"w":"packet","jp":"包み、一式","note":"`a second packet`、`a packet of documents`。package より小さいまとまり。","tier":"A","ref":"TSL 358","note_html":"<code>a second packet</code>、<code>a packet of documents</code>。package より小さいまとまり。"}],"translation":"参加者はそれぞれ、プログラムの概要を記した小冊子が入った資料一式を受け取ります。技術仕様は2つ目の包みに入っており、入口で配布されます。","html":"Each participant receives an <b class=\"tg\">information packet</b> containing a <b class=\"tg\">booklet</b> with an <b class=\"tg\">overview</b> of the program. The technical <b class=\"tg\">specification</b> is in a second <b class=\"tg\">packet</b>, which is handed out at the door."},{"id":92,"vol":5,"theme":"客室・宿泊","sentence":"The corner **suite** comes fully **furnished**, with a leather **sofa** and a newly installed **air conditioner**. **Occupancy** is limited to four guests per room.","words":[{"w":"suite","jp":"スイートルーム、続き部屋","note":"`the corner suite`、`a two-room suite`。発音は /swiːt/ で sweet と同じ。","tier":"A","ref":"TSL 261","note_html":"<code>the corner suite</code>、<code>a two-room suite</code>。発音は /swiːt/ で sweet と同じ。"},{"w":"furnished","jp":"家具付きの","note":"`come fully furnished`、`a furnished apartment`。名詞 furniture、furnishings。","tier":"A","ref":"TSL 418","note_html":"<code>come fully furnished</code>、<code>a furnished apartment</code>。名詞 furniture、furnishings。"},{"w":"sofa","jp":"ソファ","note":"`a leather sofa`。couch と同義でPart 1に出る。","tier":"S","ref":"TSL 216","note_html":"<code>a leather sofa</code>。couch と同義でPart 1に出る。"},{"w":"air conditioner","jp":"エアコン","note":"`install a new air conditioner`。動詞句は air-condition。","tier":"A","ref":"TSL 352","note_html":"<code>install a new air conditioner</code>。動詞句は air-condition。"},{"w":"occupancy","jp":"入居、収容人数","note":"`Occupancy is limited to four.`、`maximum occupancy`（最大収容人数）。形容詞 occupied。","tier":"A","ref":"TSL 293","note_html":"<code>Occupancy is limited to four.</code>、<code>maximum occupancy</code>（最大収容人数）。形容詞 occupied。"}],"translation":"角のスイートルームは家具が完備されており、革張りのソファと新しく設置されたエアコンがあります。収容人数は1室あたり4名までです。","html":"The corner <b class=\"tg\">suite</b> comes fully <b class=\"tg\">furnished</b>, with a leather <b class=\"tg\">sofa</b> and a newly installed <b class=\"tg\">air conditioner</b>. <b class=\"tg\">Occupancy</b> is limited to four guests per room."},{"id":93,"vol":5,"theme":"衣類・洗濯","sentence":"Send the stained **garment** to the **dry cleaner**, and put everything else in the **laundry** basket. A soft **cloth** works better on the screen, and the **laundry equipment** on the third floor is free for residents.","words":[{"w":"garment","jp":"衣類、衣服1点","note":"`a stained garment`、`the garment industry`（アパレル産業）。clothes より個別の1点を指す。","tier":"A","ref":"TSL 355","note_html":"<code>a stained garment</code>、<code>the garment industry</code>（アパレル産業）。clothes より個別の1点を指す。"},{"w":"dry cleaner","jp":"クリーニング店","note":"`send it to the dry cleaner`、`pick up from the dry cleaner's`。","tier":"S","ref":"TSL 201","note_html":"<code>send it to the dry cleaner</code>、<code>pick up from the dry cleaner&#x27;s</code>。"},{"w":"laundry","jp":"洗濯物、洗濯","note":"`do the laundry`、`a laundry basket`。不可算名詞。","tier":"A","ref":"TSL 420","note_html":"<code>do the laundry</code>、<code>a laundry basket</code>。不可算名詞。"},{"w":"cloth","jp":"布、ふきん","note":"`a soft cloth`。cloth（布）／ clothes（衣服）／ clothing（衣類全般）の3語の区別が狙われる。","tier":"S","ref":"TSL 31","note_html":"<code>a soft cloth</code>。cloth（布）／ clothes（衣服）／ clothing（衣類全般）の3語の区別が狙われる。"},{"w":"laundry equipment","jp":"洗濯設備","note":"`laundry equipment is free for residents`。集合住宅の設備説明で出る。","tier":"A","ref":"TSL 420","note_html":"<code>laundry equipment is free for residents</code>。集合住宅の設備説明で出る。"}],"translation":"しみのついた衣類はクリーニング店に出し、それ以外は洗濯かごに入れてください。画面には柔らかい布のほうが適しています。また、3階の洗濯設備は入居者は無料でご利用いただけます。","html":"Send the stained <b class=\"tg\">garment</b> to the <b class=\"tg\">dry cleaner</b>, and put everything else in the <b class=\"tg\">laundry</b> basket. A soft <b class=\"tg\">cloth</b> works better on the screen, and the <b class=\"tg\">laundry equipment</b> on the third floor is free for residents."},{"id":94,"vol":5,"theme":"家電・電源","sentence":"Do not plug the **refrigerator** and the **vacuum cleaner** into the same **power outlet**. There is another **outlet** behind the desk, and a spare **rechargeable battery** is kept in the drawer.","words":[{"w":"refrigerator","jp":"冷蔵庫","note":"短縮形 fridge。`plug in the refrigerator`。","tier":"A","ref":"TSL 374","note_html":"短縮形 fridge。<code>plug in the refrigerator</code>。"},{"w":"vacuum (cleaner)","jp":"掃除機","note":"`run / use a vacuum cleaner`。動詞 vacuum（掃除機をかける）。","tier":"A","ref":"TSL 409","note_html":"<code>run / use a vacuum cleaner</code>。動詞 vacuum（掃除機をかける）。"},{"w":"power outlet","jp":"コンセント","note":"`plug into the power outlet`。日本語の「コンセント」は英語では通じない。","tier":"A","ref":"TSL 357","note_html":"<code>plug into the power outlet</code>。日本語の「コンセント」は英語では通じない。"},{"w":"outlet","jp":"コンセント、直販店、出口","note":"`another outlet behind the desk`、`an outlet mall`。多義語として狙われる。","tier":"A","ref":"TSL 357","note_html":"<code>another outlet behind the desk</code>、<code>an outlet mall</code>。多義語として狙われる。"},{"w":"rechargeable battery","jp":"充電池","note":"`a spare rechargeable battery`。動詞 recharge、形容詞 rechargeable。","tier":"S","ref":"TSL 165","note_html":"<code>a spare rechargeable battery</code>。動詞 recharge、形容詞 rechargeable。"}],"translation":"冷蔵庫と掃除機を同じコンセントに差し込まないでください。机の後ろにもう1つコンセントがあり、予備の充電池は引き出しに保管しています。","html":"Do not plug the <b class=\"tg\">refrigerator</b> and the <b class=\"tg\">vacuum cleaner</b> into the same <b class=\"tg\">power outlet</b>. There is another <b class=\"tg\">outlet</b> behind the desk, and a spare <b class=\"tg\">rechargeable battery</b> is kept in the drawer."},{"id":95,"vol":5,"theme":"工具・安全","sentence":"Borrow a **drill** from the **hardware store** on the corner, and wear a **glove** while cutting the pipe. **Protective** eyewear is required, and all **hardware** must be returned by Friday.","words":[{"w":"drill","jp":"ドリル／訓練","note":"`borrow a drill`、`a fire drill`（避難訓練）。工具と訓練の2義がある。","tier":"A","ref":"TSL 331","note_html":"<code>borrow a drill</code>、<code>a fire drill</code>（避難訓練）。工具と訓練の2義がある。"},{"w":"hardware store","jp":"金物店、ホームセンター","note":"`buy tools at the hardware store`。","tier":"A","ref":"TSL 444","note_html":"<code>buy tools at the hardware store</code>。"},{"w":"glove","jp":"手袋","note":"通常は複数形 gloves。`wear gloves`、`rubber gloves`。","tier":"A","ref":"TSL 443","note_html":"通常は複数形 gloves。<code>wear gloves</code>、<code>rubber gloves</code>。"},{"w":"protective","jp":"保護用の","note":"`protective eyewear / clothing / gear`。動詞 protect、名詞 protection。","tier":"A","ref":"TSL 322","note_html":"<code>protective eyewear / clothing / gear</code>。動詞 protect、名詞 protection。"},{"w":"hardware","jp":"金物、工具類、ハードウェア","note":"不可算名詞。`return all hardware`。IT文脈では機器を指す。","tier":"A","ref":"TSL 444","note_html":"不可算名詞。<code>return all hardware</code>。IT文脈では機器を指す。"}],"translation":"角の金物店でドリルを借り、配管を切断する際は手袋を着用してください。保護用の眼鏡が必須で、工具類はすべて金曜日までに返却する必要があります。","html":"Borrow a <b class=\"tg\">drill</b> from the <b class=\"tg\">hardware store</b> on the corner, and wear a <b class=\"tg\">glove</b> while cutting the pipe. <b class=\"tg\">Protective</b> eyewear is required, and all <b class=\"tg\">hardware</b> must be returned by Friday."},{"id":96,"vol":5,"theme":"美術・展示","sentence":"The exhibition of landscape **photography** opens beside the **oval** garden, where a bronze **sculpture** stands near the **fountain**. The event **organizer** expects two hundred visitors on the first day.","words":[{"w":"photography","jp":"写真撮影、写真術","note":"`landscape photography`、`an exhibition of photography`。photograph（写真1枚）と区別する。","tier":"A","ref":"TSL 286","note_html":"<code>landscape photography</code>、<code>an exhibition of photography</code>。photograph（写真1枚）と区別する。"},{"w":"oval","jp":"楕円形の","note":"`an oval garden / table / mirror`。round、rectangular、square と並ぶ形状語。","tier":"S","ref":"TSL 59","note_html":"<code>an oval garden / table / mirror</code>。round、rectangular、square と並ぶ形状語。"},{"w":"sculpture","jp":"彫刻","note":"`a bronze sculpture`、`a sculpture garden`。名詞 sculptor（彫刻家）。","tier":"A","ref":"TSL 287","note_html":"<code>a bronze sculpture</code>、<code>a sculpture garden</code>。名詞 sculptor（彫刻家）。"},{"w":"fountain","jp":"噴水","note":"`stand near the fountain`、`a water fountain`（水飲み場）。Part 1に頻出。","tier":"A","ref":"TSL 332","note_html":"<code>stand near the fountain</code>、<code>a water fountain</code>（水飲み場）。Part 1に頻出。"},{"w":"organizer","jp":"主催者、まとめ役","note":"`the event organizer`。動詞 organize、名詞 organization。","tier":"A","ref":"TSL 347","note_html":"<code>the event organizer</code>。動詞 organize、名詞 organization。"}],"translation":"風景写真の展覧会が楕円形の庭園のそばで開幕します。そこでは噴水の近くに青銅の彫刻が立っています。イベント主催者は初日に200名の来場を見込んでいます。","html":"The exhibition of landscape <b class=\"tg\">photography</b> opens beside the <b class=\"tg\">oval</b> garden, where a bronze <b class=\"tg\">sculpture</b> stands near the <b class=\"tg\">fountain</b>. The event <b class=\"tg\">organizer</b> expects two hundred visitors on the first day."},{"id":97,"vol":5,"theme":"昼食会","sentence":"The **luncheon** will be served **buffet** style in the **designated** dining room, and **casual** dress is acceptable. Please leave valuable **jewelry** at home.","words":[{"w":"luncheon","jp":"昼食会","note":"`an awards luncheon`、`host a luncheon`。lunch の格式ばった語で、行事を指す。","tier":"A","ref":"TSL 394","note_html":"<code>an awards luncheon</code>、<code>host a luncheon</code>。lunch の格式ばった語で、行事を指す。"},{"w":"buffet","jp":"ビュッフェ、立食","note":"`served buffet style`、`a breakfast buffet`。発音は /bəˈfeɪ/。","tier":"A","ref":"TSL 289","note_html":"<code>served buffet style</code>、<code>a breakfast buffet</code>。発音は /bəˈfeɪ/。"},{"w":"designated","jp":"指定された","note":"`the designated dining room / area / driver`。動詞 designate。","tier":"A","ref":"TSL 255","note_html":"<code>the designated dining room / area / driver</code>。動詞 designate。"},{"w":"casual","jp":"普段着の、略式の","note":"`casual dress / attire is acceptable`。formal と対で。","tier":"A","ref":"TSL 330","note_html":"<code>casual dress / attire is acceptable</code>。formal と対で。"},{"w":"jewelry","jp":"宝飾品","note":"不可算名詞。`valuable jewelry`、`a piece of jewelry`。英国式は jewellery。","tier":"S","ref":"TSL 163","note_html":"不可算名詞。<code>valuable jewelry</code>、<code>a piece of jewelry</code>。英国式は jewellery。"}],"translation":"昼食会は指定された食堂でビュッフェ形式で提供され、普段着でも差し支えありません。高価な宝飾品はご自宅に置いてきてください。","html":"The <b class=\"tg\">luncheon</b> will be served <b class=\"tg\">buffet</b> style in the <b class=\"tg\">designated</b> dining room, and <b class=\"tg\">casual</b> dress is acceptable. Please leave valuable <b class=\"tg\">jewelry</b> at home."},{"id":98,"vol":5,"theme":"数値・計算","sentence":"Bring a **calculator** so that every **calculation** can be checked **accurately**. If the figures are entered **correctly**, the **prediction** for next quarter should be reliable.","words":[{"w":"calculator","jp":"計算機、電卓","note":"`bring a calculator`。動詞 calculate。","tier":"A","ref":"TSL 276","note_html":"<code>bring a calculator</code>。動詞 calculate。"},{"w":"calculation","jp":"計算、算定","note":"`check the calculation`、`according to our calculations`。","tier":"A","ref":"TSL 459","note_html":"<code>check the calculation</code>、<code>according to our calculations</code>。"},{"w":"accurately","jp":"正確に","note":"`check accurately`、`accurately reflect ~`。形容詞 accurate、名詞 accuracy。","tier":"A","ref":"TSL 303","note_html":"<code>check accurately</code>、<code>accurately reflect ~</code>。形容詞 accurate、名詞 accuracy。"},{"w":"correctly","jp":"正しく","note":"`entered correctly`、`spelled correctly`。形容詞 correct、名詞 correction。","tier":"S","ref":"TSL 47","note_html":"<code>entered correctly</code>、<code>spelled correctly</code>。形容詞 correct、名詞 correction。"},{"w":"prediction","jp":"予測","note":"`make a prediction`、`the prediction for next quarter`。動詞 predict、形容詞 predictable。","tier":"A","ref":"TSL 349","note_html":"<code>make a prediction</code>、<code>the prediction for next quarter</code>。動詞 predict、形容詞 predictable。"}],"translation":"すべての計算を正確に確認できるよう、電卓を持参してください。数値が正しく入力されていれば、次四半期の予測は信頼できるはずです。","html":"Bring a <b class=\"tg\">calculator</b> so that every <b class=\"tg\">calculation</b> can be checked <b class=\"tg\">accurately</b>. If the figures are entered <b class=\"tg\">correctly</b>, the <b class=\"tg\">prediction</b> for next quarter should be reliable."},{"id":99,"vol":5,"theme":"データ管理","sentence":"**Delete** the old file once the **definitive** version has been uploaded, although a **definite** date has not been set. Data **usage** is monitored, and the archive is **exclusive** to registered members.","words":[{"w":"delete","jp":"削除する","note":"`delete the old file`。名詞 deletion。反意語 add。","tier":"A","ref":"TSL 299","note_html":"<code>delete the old file</code>。名詞 deletion。反意語 add。"},{"w":"definitive","jp":"決定版の、最終的な","note":"`the definitive version / edition`。「これ以上変更しない完成形」の意。","tier":"A","ref":"TSL 364","note_html":"<code>the definitive version / edition</code>。「これ以上変更しない完成形」の意。"},{"w":"definite","jp":"明確な、確定した","note":"`a definite date / answer`。副詞 definitely。definitive との意味差が狙われる。","tier":"A","ref":"TSL 364","note_html":"<code>a definite date / answer</code>。副詞 definitely。definitive との意味差が狙われる。"},{"w":"usage","jp":"使用量、語法","note":"`data usage is monitored`、`water usage`。use の名詞形だが「使用量」の含意が強い。","tier":"A","ref":"TSL 386","note_html":"<code>data usage is monitored</code>、<code>water usage</code>。use の名詞形だが「使用量」の含意が強い。"},{"w":"exclusive","jp":"限定の、独占的な","note":"`exclusive to members`、`an exclusive offer`。副詞 exclusively。","tier":"A","ref":"TSL 256","note_html":"<code>exclusive to members</code>、<code>an exclusive offer</code>。副詞 exclusively。"}],"translation":"決定版がアップロードされ次第、古いファイルを削除してください。ただし、確定した日付はまだ決まっていません。データ使用量は監視されており、その保存記録は登録会員限定です。","html":"<b class=\"tg\">Delete</b> the old file once the <b class=\"tg\">definitive</b> version has been uploaded, although a <b class=\"tg\">definite</b> date has not been set. Data <b class=\"tg\">usage</b> is monitored, and the archive is <b class=\"tg\">exclusive</b> to registered members."},{"id":100,"vol":5,"theme":"協力・謝辞","sentence":"**On behalf of** the department, thank you all for being so **cooperative**. **In spite of** the short notice, the hotel staff were extremely **accommodating**, and we hope the two teams will continue to **cooperate**.","words":[{"w":"on behalf of","jp":"〜を代表して、〜に代わって","note":"`On behalf of the department, thank you ~`。スピーチ・書簡の冒頭定型。","tier":"A","ref":"TSL 317","note_html":"<code>On behalf of the department, thank you ~</code>。スピーチ・書簡の冒頭定型。"},{"w":"cooperative","jp":"協力的な","note":"`Thank you for being so cooperative.`、`a cooperative effort`。","tier":"A","ref":"TSL 414","note_html":"<code>Thank you for being so cooperative.</code>、<code>a cooperative effort</code>。"},{"w":"in spite of","jp":"〜にもかかわらず","note":"`In spite of the short notice, ~`。despite と同義だが of が必要。後ろは名詞句。","tier":"A","ref":"TSL 281","note_html":"<code>In spite of the short notice, ~</code>。despite と同義だが of が必要。後ろは名詞句。"},{"w":"accommodating","jp":"親切な、便宜を図ってくれる","note":"`The staff were extremely accommodating.`。動詞 accommodate から。","tier":"S","ref":"TSL 217","note_html":"<code>The staff were extremely accommodating.</code>。動詞 accommodate から。"},{"w":"cooperate","jp":"協力する","note":"`cooperate with ~`。名詞 cooperation、形容詞 cooperative。","tier":"A","ref":"TSL 414","note_html":"<code>cooperate with ~</code>。名詞 cooperation、形容詞 cooperative。"}],"translation":"部門を代表して、皆さまのご協力に感謝申し上げます。急なお願いにもかかわらず、ホテルの職員はきわめて親切に対応してくださいました。今後も両チームが協力し続けることを願っています。","html":"<b class=\"tg\">On behalf of</b> the department, thank you all for being so <b class=\"tg\">cooperative</b>. <b class=\"tg\">In spite of</b> the short notice, the hotel staff were extremely <b class=\"tg\">accommodating</b>, and we hope the two teams will continue to <b class=\"tg\">cooperate</b>."},{"id":101,"vol":6,"theme":"人材・組織","sentence":"Two **resignations** last month reduced our **workforce** by nearly ten percent. The remaining staff are **inexperienced**, so the company has hired an **apprentice** and is looking for someone with **managerial** skills.","words":[{"w":"resignation","jp":"辞職、辞表","note":"`submit / accept a resignation`、`two resignations last month`。動詞 resign（`resign from a post`）。","tier":"A","ref":"TSL 473","note_html":"<code>submit / accept a resignation</code>、<code>two resignations last month</code>。動詞 resign（<code>resign from a post</code>）。"},{"w":"workforce","jp":"従業員全体、労働力","note":"`reduce / expand the workforce`。集合名詞で、企業の人員全体を指す。","tier":"A","ref":"TSL 561","note_html":"<code>reduce / expand the workforce</code>。集合名詞で、企業の人員全体を指す。"},{"w":"inexperienced","jp":"経験の浅い","note":"`inexperienced staff`。反意語 experienced。in- が否定の接頭辞。","tier":"A","ref":"TSL 465","note_html":"<code>inexperienced staff</code>。反意語 experienced。in- が否定の接頭辞。"},{"w":"apprentice","jp":"見習い、実習生","note":"`hire an apprentice`。名詞 apprenticeship（見習い期間）。","tier":"A","ref":"TSL 565","note_html":"<code>hire an apprentice</code>。名詞 apprenticeship（見習い期間）。"},{"w":"managerial","jp":"管理職の、経営の","note":"`managerial skills / experience / position`。名詞 manager、management。","tier":"A","ref":"TSL 526","note_html":"<code>managerial skills / experience / position</code>。名詞 manager、management。"}],"translation":"先月の2名の辞職により、当社の従業員数は10%近く減りました。残った職員は経験が浅いため、会社は見習いを1名採用し、管理職としての技能を持つ人材を探しています。","html":"Two <b class=\"tg\">resignations</b> last month reduced our <b class=\"tg\">workforce</b> by nearly ten percent. The remaining staff are <b class=\"tg\">inexperienced</b>, so the company has hired an <b class=\"tg\">apprentice</b> and is looking for someone with <b class=\"tg\">managerial</b> skills."},{"id":102,"vol":6,"theme":"中断・妨げ","sentence":"Construction noise will **interrupt** the seminar, and the **disruption** may last all morning. Anyone who finds the sound **distracting** should move to Room B, because the drilling will **distract** speakers only **temporarily**.","words":[{"w":"interrupt","jp":"中断する、邪魔をする","note":"`interrupt the seminar / a speaker`。名詞 interruption。","tier":"A","ref":"TSL 370","note_html":"<code>interrupt the seminar / a speaker</code>。名詞 interruption。"},{"w":"disruption","jp":"混乱、中断","note":"`cause a disruption`、`service disruption`。動詞 disrupt、形容詞 disruptive。","tier":"A","ref":"TSL 519","note_html":"<code>cause a disruption</code>、<code>service disruption</code>。動詞 disrupt、形容詞 disruptive。"},{"w":"distracting","jp":"気を散らす、注意をそらすような","note":"`find the sound distracting`。**物・事**を主語にする -ing 形。","tier":"A","ref":"TSL 415","note_html":"<code>find the sound distracting</code>。**物・事**を主語にする -ing 形。"},{"w":"distract","jp":"注意をそらす","note":"`distract the speaker`、`be distracted by noise`。人が主語なら distracted。","tier":"A","ref":"TSL 415","note_html":"<code>distract the speaker</code>、<code>be distracted by noise</code>。人が主語なら distracted。"},{"w":"temporarily","jp":"一時的に","note":"`temporarily closed / unavailable`。形容詞 temporary、反意語 permanently。","tier":"A","ref":"TSL 429","note_html":"<code>temporarily closed / unavailable</code>。形容詞 temporary、反意語 permanently。"}],"translation":"工事の騒音がセミナーを中断させ、その混乱は午前中いっぱい続くかもしれません。音が気になる方はB室へ移動してください。掘削作業が登壇者の妨げになるのは一時的なものです。","html":"Construction noise will <b class=\"tg\">interrupt</b> the seminar, and the <b class=\"tg\">disruption</b> may last all morning. Anyone who finds the sound <b class=\"tg\">distracting</b> should move to Room B, because the drilling will <b class=\"tg\">distract</b> speakers only <b class=\"tg\">temporarily</b>."},{"id":103,"vol":6,"theme":"物流・荷役","sentence":"The **cargo** ship reached the **dock** at dawn, but a **shortage** of forklifts slowed the work. Please **stack** the crates by size and store the **remainder** in the side warehouse.","words":[{"w":"cargo","jp":"積荷、貨物","note":"`a cargo ship`、`load cargo`。freight とほぼ同義。","tier":"A","ref":"TSL 413","note_html":"<code>a cargo ship</code>、<code>load cargo</code>。freight とほぼ同義。"},{"w":"dock","jp":"波止場、荷積み場／接岸する","note":"`reach the dock`、`the loading dock`。名詞・動詞の両用法。","tier":"S","ref":"TSL 246","note_html":"<code>reach the dock</code>、<code>the loading dock</code>。名詞・動詞の両用法。"},{"w":"shortage","jp":"不足","note":"`a shortage of forklifts / staff / supplies`。of が続く。動詞 shorten とは別語。","tier":"A","ref":"TSL 398","note_html":"<code>a shortage of forklifts / staff / supplies</code>。of が続く。動詞 shorten とは別語。"},{"w":"stack","jp":"積み重ねる／山","note":"`stack the crates`、`a stack of papers`。Part 1の写真描写に頻出。","tier":"A","ref":"TSL 273","note_html":"<code>stack the crates</code>、<code>a stack of papers</code>。Part 1の写真描写に頻出。"},{"w":"remainder","jp":"残り、残余","note":"`store the remainder`、`the remainder of the year`。動詞 remain、形容詞 remaining。","tier":"A","ref":"TSL 534","note_html":"<code>store the remainder</code>、<code>the remainder of the year</code>。動詞 remain、形容詞 remaining。"}],"translation":"貨物船は夜明けに波止場に到着しましたが、フォークリフトの不足で作業が滞りました。木箱は大きさごとに積み重ね、残りは側面の倉庫に保管してください。","html":"The <b class=\"tg\">cargo</b> ship reached the <b class=\"tg\">dock</b> at dawn, but a <b class=\"tg\">shortage</b> of forklifts slowed the work. Please <b class=\"tg\">stack</b> the crates by size and store the <b class=\"tg\">remainder</b> in the side warehouse."},{"id":104,"vol":6,"theme":"費用の比較","sentence":"Air freight is **costly**, so shipping by sea is far more **economical**. The **inexpensive** model uses **considerably** less power, although the **premium** version comes with a longer warranty.","words":[{"w":"costly","jp":"費用のかかる、高くつく","note":"`Air freight is costly.`。-ly で終わるが**形容詞**である点が狙われる。","tier":"A","ref":"TSL 461","note_html":"<code>Air freight is costly.</code>。-ly で終わるが**形容詞**である点が狙われる。"},{"w":"economical","jp":"経済的な、割安な","note":"`an economical option`。economic（経済の）との意味差が最頻出の出題ポイント。","tier":"A","ref":"TSL 365","note_html":"<code>an economical option</code>。economic（経済の）との意味差が最頻出の出題ポイント。"},{"w":"inexpensive","jp":"安価な","note":"`the inexpensive model`。cheap の婉曲表現で、書き言葉ではこちらを使う。","tier":"A","ref":"TSL 483","note_html":"<code>the inexpensive model</code>。cheap の婉曲表現で、書き言葉ではこちらを使う。"},{"w":"considerably","jp":"かなり、相当に","note":"`considerably less power`、`considerably higher`。比較級を強める副詞。","tier":"A","ref":"TSL 496","note_html":"<code>considerably less power</code>、<code>considerably higher</code>。比較級を強める副詞。"},{"w":"premium","jp":"高級な、割増の／割増金","note":"`the premium version`、`a premium price`。形容詞・名詞の両用法。","tier":"A","ref":"TSL 584","note_html":"<code>the premium version</code>、<code>a premium price</code>。形容詞・名詞の両用法。"}],"translation":"航空貨物は費用がかかるため、船便のほうがはるかに経済的です。安価なモデルは消費電力がかなり少なくて済みますが、高級版には長い保証が付いています。","html":"Air freight is <b class=\"tg\">costly</b>, so shipping by sea is far more <b class=\"tg\">economical</b>. The <b class=\"tg\">inexpensive</b> model uses <b class=\"tg\">considerably</b> less power, although the <b class=\"tg\">premium</b> version comes with a longer warranty."},{"id":105,"vol":6,"theme":"組立・機械","sentence":"Workers will **assemble** the frames by hand before the **automatic** welding stage. A **mechanical engineer** inspects each **mechanical** part, and the whole **assembly** takes about forty minutes.","words":[{"w":"assemble","jp":"組み立てる、集まる","note":"`assemble the frames`、`Staff assembled in the lobby.`。他動詞・自動詞の両用法。","tier":"A","ref":"TSL 435","note_html":"<code>assemble the frames</code>、<code>Staff assembled in the lobby.</code>。他動詞・自動詞の両用法。"},{"w":"automatic","jp":"自動の","note":"`the automatic welding stage`、`an automatic door`。副詞 automatically、動詞 automate。","tier":"A","ref":"TSL 436","note_html":"<code>the automatic welding stage</code>、<code>an automatic door</code>。副詞 automatically、動詞 automate。"},{"w":"mechanical engineer","jp":"機械技師","note":"`a mechanical engineer inspects ~`。職種名としてPart 7の求人に出る。","tier":"A","ref":"TSL 422","note_html":"<code>a mechanical engineer inspects ~</code>。職種名としてPart 7の求人に出る。"},{"w":"mechanical","jp":"機械の、機械的な","note":"`a mechanical part / failure`。名詞 mechanic（整備士）、mechanism。","tier":"A","ref":"TSL 422","note_html":"<code>a mechanical part / failure</code>。名詞 mechanic（整備士）、mechanism。"},{"w":"assembly","jp":"組立、組立品、集会","note":"`the whole assembly takes ~`、`an assembly line`。動詞 assemble の名詞形。","tier":"A","ref":"TSL 540","note_html":"<code>the whole assembly takes ~</code>、<code>an assembly line</code>。動詞 assemble の名詞形。"}],"translation":"作業員は自動溶接の工程の前に、手作業で枠を組み立てます。機械技師が各機械部品を点検し、組立全体には約40分かかります。","html":"Workers will <b class=\"tg\">assemble</b> the frames by hand before the <b class=\"tg\">automatic</b> welding stage. A <b class=\"tg\">mechanical engineer</b> inspects each <b class=\"tg\">mechanical</b> part, and the whole <b class=\"tg\">assembly</b> takes about forty minutes."},{"id":106,"vol":6,"theme":"品質・相談","sentence":"To **obtain** a longer service life, engineers will **reinforce** the joints and test the **durability** of the coating. The **superior** grade costs more, so please book a **consultation** before ordering.","words":[{"w":"obtain","jp":"得る、入手する","note":"`obtain a longer service life / permission / a license`。get の格式ばった語。","tier":"S","ref":"TSL 58","note_html":"<code>obtain a longer service life / permission / a license</code>。get の格式ばった語。"},{"w":"reinforce","jp":"補強する、強化する","note":"`reinforce the joints`、`reinforce a message`。物理的にも比喩的にも使う。","tier":"A","ref":"TSL 407","note_html":"<code>reinforce the joints</code>、<code>reinforce a message</code>。物理的にも比喩的にも使う。"},{"w":"durability","jp":"耐久性","note":"`test the durability`。形容詞 durable。","tier":"A","ref":"TSL 442","note_html":"<code>test the durability</code>。形容詞 durable。"},{"w":"superior","jp":"優れた、上位の","note":"`the superior grade`、`superior to ~`（〜より優れている）。than ではなく to をとる。","tier":"A","ref":"TSL 492","note_html":"<code>the superior grade</code>、<code>superior to ~</code>（〜より優れている）。than ではなく to をとる。"},{"w":"consultation","jp":"相談、診察","note":"`book a consultation`、`in consultation with ~`。動詞 consult、名詞 consultant。","tier":"A","ref":"TSL 441","note_html":"<code>book a consultation</code>、<code>in consultation with ~</code>。動詞 consult、名詞 consultant。"}],"translation":"より長い耐用年数を得るため、技術者は接合部を補強し、塗装の耐久性を試験します。上位グレードは価格が高いため、ご注文の前に相談のご予約をお願いします。","html":"To <b class=\"tg\">obtain</b> a longer service life, engineers will <b class=\"tg\">reinforce</b> the joints and test the <b class=\"tg\">durability</b> of the coating. The <b class=\"tg\">superior</b> grade costs more, so please book a <b class=\"tg\">consultation</b> before ordering."},{"id":107,"vol":6,"theme":"職業","sentence":"The **carpenter** finished the shelves, and an **electrician** rewired the reading room. The **librarian** thanked them both, while a local **banker** and a train **conductor** attended the reopening.","words":[{"w":"carpenter","jp":"大工","note":"`The carpenter finished the shelves.`。名詞 carpentry（大工仕事）。","tier":"A","ref":"TSL 438","note_html":"<code>The carpenter finished the shelves.</code>。名詞 carpentry（大工仕事）。"},{"w":"electrician","jp":"電気技師","note":"`an electrician rewired ~`。形容詞 electrical、名詞 electricity。","tier":"A","ref":"TSL 520","note_html":"<code>an electrician rewired ~</code>。形容詞 electrical、名詞 electricity。"},{"w":"librarian","jp":"司書","note":"`ask the librarian`。library（図書館）から。Part 3の図書館場面で登場。","tier":"A","ref":"TSL 467","note_html":"<code>ask the librarian</code>。library（図書館）から。Part 3の図書館場面で登場。"},{"w":"banker","jp":"銀行員","note":"`a local banker`。bank（銀行）＋-er。","tier":"A","ref":"TSL 316","note_html":"<code>a local banker</code>。bank（銀行）＋-er。"},{"w":"conductor","jp":"車掌、指揮者","note":"`a train conductor` と `an orchestra conductor` の2義。動詞 conduct（実施する）と併せて。","tier":"A","ref":"TSL 305","note_html":"<code>a train conductor</code> と <code>an orchestra conductor</code> の2義。動詞 conduct（実施する）と併せて。"}],"translation":"大工が棚を仕上げ、電気技師が読書室の配線をやり直しました。司書は両者に感謝を述べ、地元の銀行員と列車の車掌も再開式に出席しました。","html":"The <b class=\"tg\">carpenter</b> finished the shelves, and an <b class=\"tg\">electrician</b> rewired the reading room. The <b class=\"tg\">librarian</b> thanked them both, while a local <b class=\"tg\">banker</b> and a train <b class=\"tg\">conductor</b> attended the reopening."},{"id":108,"vol":6,"theme":"SNS・宣伝","sentence":"Our **social media** posts reach far more people than print advertising, and a **celebrity** has agreed to promote the line. The designer's **portfolio** shows an **innovative** use of recycled fabric, and no two pieces look **alike**.","words":[{"w":"social media","jp":"ソーシャルメディア、SNS","note":"`social media posts / campaign`。不可算扱いが一般的。","tier":"S","ref":"TSL 92","note_html":"<code>social media posts / campaign</code>。不可算扱いが一般的。"},{"w":"celebrity","jp":"著名人","note":"`a celebrity has agreed to ~`、`celebrity endorsement`（有名人の推薦）。","tier":"A","ref":"TSL 517","note_html":"<code>a celebrity has agreed to ~</code>、<code>celebrity endorsement</code>（有名人の推薦）。"},{"w":"portfolio","jp":"作品集、資産の組み合わせ","note":"`a designer's portfolio`、`an investment portfolio`。2分野で出る。","tier":"A","ref":"TSL 507","note_html":"<code>a designer&#x27;s portfolio</code>、<code>an investment portfolio</code>。2分野で出る。"},{"w":"innovative","jp":"革新的な","note":"`an innovative use / design / approach`。名詞 innovation、動詞 innovate。","tier":"S","ref":"TSL 172","note_html":"<code>an innovative use / design / approach</code>。名詞 innovation、動詞 innovate。"},{"w":"alike","jp":"似ている、同様に","note":"`No two pieces look alike.`。**名詞の前には置けない**叙述用法専用の語。","tier":"S","ref":"TSL 207","note_html":"<code>No two pieces look alike.</code>。**名詞の前には置けない**叙述用法専用の語。"}],"translation":"当社のSNS投稿は紙媒体の広告よりはるかに多くの人に届いており、ある著名人がこのシリーズの宣伝を引き受けました。そのデザイナーの作品集には再生繊維の革新的な使い方が示されており、同じ形の作品は2つとありません。","html":"Our <b class=\"tg\">social media</b> posts reach far more people than print advertising, and a <b class=\"tg\">celebrity</b> has agreed to promote the line. The designer&#x27;s <b class=\"tg\">portfolio</b> shows an <b class=\"tg\">innovative</b> use of recycled fabric, and no two pieces look <b class=\"tg\">alike</b>."},{"id":109,"vol":6,"theme":"統計・予測","sentence":"The **statistics** show that sales have risen **steadily** since March, and the **projection** for December is optimistic. A single chart can be **misleading**, so please review the figures **thoroughly**.","words":[{"w":"statistics","jp":"統計、統計数値","note":"`The statistics show that ~`。複数扱い。学問名としては単数扱い。形容詞 statistical。","tier":"A","ref":"TSL 510","note_html":"<code>The statistics show that ~</code>。複数扱い。学問名としては単数扱い。形容詞 statistical。"},{"w":"steadily","jp":"着実に、絶え間なく","note":"`rise / grow steadily`。形容詞 steady。","tier":"A","ref":"TSL 536","note_html":"<code>rise / grow steadily</code>。形容詞 steady。"},{"w":"projection","jp":"予測、投影","note":"`the projection for December`、`sales projections`。動詞 project（予測する）。","tier":"A","ref":"TSL 552","note_html":"<code>the projection for December</code>、<code>sales projections</code>。動詞 project（予測する）。"},{"w":"misleading","jp":"誤解を招く","note":"`a misleading chart / advertisement`。動詞 mislead（mislead–misled–misled）。","tier":"A","ref":"TSL 503","note_html":"<code>a misleading chart / advertisement</code>。動詞 mislead（mislead–misled–misled）。"},{"w":"thoroughly","jp":"徹底的に、入念に","note":"`review the figures thoroughly`。形容詞 thorough。through（〜を通って）と混同しない。","tier":"A","ref":"TSL 384","note_html":"<code>review the figures thoroughly</code>。形容詞 thorough。through（〜を通って）と混同しない。"}],"translation":"統計は、3月以降売上が着実に伸びていることを示しており、12月の予測も明るいものです。1つのグラフだけでは誤解を招く恐れがあるため、数値は入念に確認してください。","html":"The <b class=\"tg\">statistics</b> show that sales have risen <b class=\"tg\">steadily</b> since March, and the <b class=\"tg\">projection</b> for December is optimistic. A single chart can be <b class=\"tg\">misleading</b>, so please review the figures <b class=\"tg\">thoroughly</b>."},{"id":110,"vol":6,"theme":"校正・改訂","sentence":"The **proofreader** returned the manuscript with a **lengthy** list of corrections, so a third **revision** is needed. Completing the index was a real **accomplishment**, and we appreciate your **patience**.","words":[{"w":"proofreader","jp":"校正者","note":"`The proofreader returned the manuscript.`。動詞 proofread。","tier":"A","ref":"TSL 532","note_html":"<code>The proofreader returned the manuscript.</code>。動詞 proofread。"},{"w":"lengthy","jp":"長々とした","note":"`a lengthy list / discussion / delay`。long より「長すぎる」という否定的含意がある。","tier":"A","ref":"TSL 466","note_html":"<code>a lengthy list / discussion / delay</code>。long より「長すぎる」という否定的含意がある。"},{"w":"revision","jp":"改訂、修正版","note":"`a third revision`、`make revisions to ~`。動詞 revise。","tier":"A","ref":"TSL 450","note_html":"<code>a third revision</code>、<code>make revisions to ~</code>。動詞 revise。"},{"w":"accomplishment","jp":"成果、業績","note":"`a real accomplishment`。動詞 accomplish、形容詞 accomplished（熟練した）。","tier":"A","ref":"TSL 400","note_html":"<code>a real accomplishment</code>。動詞 accomplish、形容詞 accomplished（熟練した）。"},{"w":"patience","jp":"忍耐、辛抱","note":"`Thank you for your patience.`（お待ちいただきありがとうございます）が定型。形容詞 patient。","tier":"A","ref":"TSL 447","note_html":"<code>Thank you for your patience.</code>（お待ちいただきありがとうございます）が定型。形容詞 patient。"}],"translation":"校正者が長々とした修正一覧とともに原稿を返してきたため、3度目の改訂が必要です。索引を完成させたことは大きな成果であり、お待ちいただいたことに感謝します。","html":"The <b class=\"tg\">proofreader</b> returned the manuscript with a <b class=\"tg\">lengthy</b> list of corrections, so a third <b class=\"tg\">revision</b> is needed. Completing the index was a real <b class=\"tg\">accomplishment</b>, and we appreciate your <b class=\"tg\">patience</b>."},{"id":111,"vol":6,"theme":"有効期限・資格","sentence":"Check the **expiration date** on the label before use. Your **certification** must be renewed before its **expiration**, and members with an **unlimited** plan receive an **alert** by e-mail one month in advance.","words":[{"w":"expiration date","jp":"有効期限、賞味期限","note":"`check the expiration date`。英国式は expiry date。","tier":"A","ref":"TSL 546","note_html":"<code>check the expiration date</code>。英国式は expiry date。"},{"w":"certification","jp":"認証、資格認定","note":"`renew your certification`。動詞 certify、名詞 certificate（証明書そのもの）。","tier":"A","ref":"TSL 542","note_html":"<code>renew your certification</code>。動詞 certify、名詞 certificate（証明書そのもの）。"},{"w":"expiration","jp":"満了、失効","note":"`before its expiration`。動詞 expire。","tier":"A","ref":"TSL 546","note_html":"<code>before its expiration</code>。動詞 expire。"},{"w":"unlimited","jp":"無制限の","note":"`an unlimited plan / access`。反意語 limited。","tier":"A","ref":"TSL 512","note_html":"<code>an unlimited plan / access</code>。反意語 limited。"},{"w":"alert","jp":"通知、警報／警戒した","note":"`receive an alert`、`stay alert`。名詞・形容詞・動詞の3用法がある。","tier":"A","ref":"TSL 515","note_html":"<code>receive an alert</code>、<code>stay alert</code>。名詞・形容詞・動詞の3用法がある。"}],"translation":"ご使用の前にラベルの有効期限をご確認ください。資格認定は失効前に更新する必要があり、無制限プランの会員には1か月前にメールで通知が届きます。","html":"Check the <b class=\"tg\">expiration date</b> on the label before use. Your <b class=\"tg\">certification</b> must be renewed before its <b class=\"tg\">expiration</b>, and members with an <b class=\"tg\">unlimited</b> plan receive an <b class=\"tg\">alert</b> by e-mail one month in advance."},{"id":112,"vol":6,"theme":"不動産・周辺環境","sentence":"The **vacant** office in the **suburb** has a high **ceiling** and a well-kept **lawn** at the rear. A **pedestrian** path connects the building to the station.","words":[{"w":"vacant","jp":"空いている、空室の","note":"`a vacant office / position`。名詞 vacancy、動詞 vacate。","tier":"A","ref":"TSL 538","note_html":"<code>a vacant office / position</code>。名詞 vacancy、動詞 vacate。"},{"w":"suburb","jp":"郊外","note":"`in the suburb(s) of ~`。形容詞 suburban。downtown と対で。","tier":"A","ref":"TSL 554","note_html":"<code>in the suburb(s) of ~</code>。形容詞 suburban。downtown と対で。"},{"w":"ceiling","jp":"天井","note":"`a high ceiling`。floor と対で。Part 1の室内描写に出る。","tier":"A","ref":"TSL 567","note_html":"<code>a high ceiling</code>。floor と対で。Part 1の室内描写に出る。"},{"w":"lawn","jp":"芝生","note":"`a well-kept lawn`、`mow the lawn`（芝を刈る）。名詞 lawn mower。","tier":"A","ref":"TSL 501","note_html":"<code>a well-kept lawn</code>、<code>mow the lawn</code>（芝を刈る）。名詞 lawn mower。"},{"w":"pedestrian","jp":"歩行者、歩行者用の","note":"`a pedestrian path / crossing`。名詞・形容詞の両用法。","tier":"A","ref":"TSL 551","note_html":"<code>a pedestrian path / crossing</code>。名詞・形容詞の両用法。"}],"translation":"郊外にあるその空きオフィスは天井が高く、裏手には手入れの行き届いた芝生があります。歩行者用の小道が建物と駅をつないでいます。","html":"The <b class=\"tg\">vacant</b> office in the <b class=\"tg\">suburb</b> has a high <b class=\"tg\">ceiling</b> and a well-kept <b class=\"tg\">lawn</b> at the rear. A <b class=\"tg\">pedestrian</b> path connects the building to the station."},{"id":113,"vol":6,"theme":"衣類・持ち物","sentence":"A guest reported that she had **misplaced** her **purse** and a small **accessory** in the fitness room. A long-**sleeved** jacket was also left beside the **laundry basket** on the second floor.","words":[{"w":"misplace","jp":"置き忘れる、置き場所を間違える","note":"`misplace a purse / file`。lose と違い「どこかにあるが見つからない」の意。","tier":"A","ref":"TSL 504","note_html":"<code>misplace a purse / file</code>。lose と違い「どこかにあるが見つからない」の意。"},{"w":"purse","jp":"ハンドバッグ、財布","note":"米国では女性用バッグ、英国では小銭入れ。`leave a purse behind`。","tier":"A","ref":"TSL 486","note_html":"米国では女性用バッグ、英国では小銭入れ。<code>leave a purse behind</code>。"},{"w":"accessory","jp":"装身具、付属品","note":"`a small accessory`、`car accessories`。2分野で使う。","tier":"A","ref":"TSL 539","note_html":"<code>a small accessory</code>、<code>car accessories</code>。2分野で使う。"},{"w":"sleeved","jp":"袖のある","note":"`a long-sleeved jacket`、`short-sleeved shirt`。複合語でのみ使う形。Part 1の服装描写。","tier":"A","ref":"TSL 553","note_html":"<code>a long-sleeved jacket</code>、<code>short-sleeved shirt</code>。複合語でのみ使う形。Part 1の服装描写。"},{"w":"laundry basket","jp":"洗濯かご","note":"`beside the laundry basket`。laundry（洗濯物）から。","tier":"A","ref":"TSL 541","note_html":"<code>beside the laundry basket</code>。laundry（洗濯物）から。"}],"translation":"ある宿泊客が、フィットネスルームにハンドバッグと小さな装身具を置き忘れたと申し出ました。また、2階の洗濯かごの脇には長袖の上着も残されていました。","html":"A guest reported that she had <b class=\"tg\">misplaced</b> her <b class=\"tg\">purse</b> and a small <b class=\"tg\">accessory</b> in the fitness room. A long-<b class=\"tg\">sleeved</b> jacket was also left beside the <b class=\"tg\">laundry basket</b> on the second floor."},{"id":114,"vol":6,"theme":"工事による不便","sentence":"The road closure has been **inconvenient** for residents, and many are **frustrated** by the delay. Repairing the older bridge would be **prohibitive**, and waiting for parts is **frustrating**, but the lane will **reopen** in June.","words":[{"w":"inconvenient","jp":"不便な、都合の悪い","note":"`an inconvenient location / time`。名詞 inconvenience。","tier":"S","ref":"TSL 54","note_html":"<code>an inconvenient location / time</code>。名詞 inconvenience。"},{"w":"frustrated","jp":"いらだった","note":"`Many are frustrated by the delay.`。**人**が主語の -ed 形。","tier":"A","ref":"TSL 354","note_html":"<code>Many are frustrated by the delay.</code>。**人**が主語の -ed 形。"},{"w":"prohibitive","jp":"法外に高い、禁止的な","note":"`prohibitive costs`。prohibit（禁止する）から派生し、「高すぎて事実上不可能」の意。","tier":"S","ref":"TSL 191","note_html":"<code>prohibitive costs</code>。prohibit（禁止する）から派生し、「高すぎて事実上不可能」の意。"},{"w":"frustrating","jp":"いらだたしい","note":"`Waiting is frustrating.`。**物・事**が主語の -ing 形。frustrated との使い分けが頻出。","tier":"A","ref":"TSL 354","note_html":"<code>Waiting is frustrating.</code>。**物・事**が主語の -ing 形。frustrated との使い分けが頻出。"},{"w":"reopen","jp":"再開する、再び開く","note":"`The lane will reopen in June.`。re-＋open。","tier":"A","ref":"TSL 489","note_html":"<code>The lane will reopen in June.</code>。re-＋open。"}],"translation":"道路の閉鎖は住民にとって不便で、多くの人が遅れにいらだっています。古いほうの橋を修復するのは費用が法外にかかり、部品を待つのはいらだたしいことですが、その車線は6月に再開通します。","html":"The road closure has been <b class=\"tg\">inconvenient</b> for residents, and many are <b class=\"tg\">frustrated</b> by the delay. Repairing the older bridge would be <b class=\"tg\">prohibitive</b>, and waiting for parts is <b class=\"tg\">frustrating</b>, but the lane will <b class=\"tg\">reopen</b> in June."},{"id":115,"vol":6,"theme":"頻度・期間","sentence":"Our supplier **seldom** raises prices, and delays are not **commonly** reported. The **duration** of the trial is six weeks; **in the meantime**, use the old form, and we will send the new one **afterwards**.","words":[{"w":"seldom","jp":"めったに〜ない","note":"`Our supplier seldom raises prices.`。否定語なので not は不要。rarely と同義。","tier":"A","ref":"TSL 251","note_html":"<code>Our supplier seldom raises prices.</code>。否定語なので not は不要。rarely と同義。"},{"w":"commonly","jp":"一般に、よく","note":"`not commonly reported`、`commonly used`。形容詞 common。","tier":"S","ref":"TSL 214","note_html":"<code>not commonly reported</code>、<code>commonly used</code>。形容詞 common。"},{"w":"duration","jp":"期間、継続時間","note":"`the duration of the trial`、`for the duration of ~`。during と語源が同じ。","tier":"A","ref":"TSL 266","note_html":"<code>the duration of the trial</code>、<code>for the duration of ~</code>。during と語源が同じ。"},{"w":"in the meantime","jp":"その間に、それまでは","note":"`In the meantime, use the old form.`。文頭で用いる定型句。","tier":"A","ref":"TSL 468","note_html":"<code>In the meantime, use the old form.</code>。文頭で用いる定型句。"},{"w":"afterwards","jp":"その後で","note":"`We will send it afterwards.`。米国式は afterward。after は前置詞・接続詞なので単独では使えない。","tier":"A","ref":"TSL 433","note_html":"<code>We will send it afterwards.</code>。米国式は afterward。after は前置詞・接続詞なので単独では使えない。"}],"translation":"当社の仕入先はめったに値上げをせず、遅延も一般には報告されていません。試用期間は6週間です。それまでは旧様式をお使いください。新しい様式はその後にお送りします。","html":"Our supplier <b class=\"tg\">seldom</b> raises prices, and delays are not <b class=\"tg\">commonly</b> reported. The <b class=\"tg\">duration</b> of the trial is six weeks; <b class=\"tg\">in the meantime</b>, use the old form, and we will send the new one <b class=\"tg\">afterwards</b>."},{"id":116,"vol":6,"theme":"慣れ・不案内","sentence":"New staff who are **unfamiliar** with the software may find the older menu better **suited** to their needs. Once you **are accustomed to** the layout, the archive is easily **accessible**, and you may ask questions **informally** at any time.","words":[{"w":"unfamiliar","jp":"不案内な、なじみのない","note":"`be unfamiliar with the software`。with が必須。反意語 familiar。","tier":"A","ref":"TSL 477","note_html":"<code>be unfamiliar with the software</code>。with が必須。反意語 familiar。"},{"w":"suited","jp":"適した","note":"`better suited to their needs`、`be suited for the job`。動詞 suit（似合う、適する）から。","tier":"A","ref":"TSL 261","note_html":"<code>better suited to their needs</code>、<code>be suited for the job</code>。動詞 suit（似合う、適する）から。"},{"w":"be accustomed to","jp":"〜に慣れている","note":"`Once you are accustomed to the layout`。**to は前置詞**なので後ろは名詞か動名詞。","tier":"A","ref":"TSL 401","note_html":"<code>Once you are accustomed to the layout</code>。**to は前置詞**なので後ろは名詞か動名詞。"},{"w":"accessible","jp":"利用しやすい、行きやすい","note":"`easily accessible`、`accessible to the public`。名詞 access、accessibility。","tier":"A","ref":"TSL 432","note_html":"<code>easily accessible</code>、<code>accessible to the public</code>。名詞 access、accessibility。"},{"w":"informally","jp":"略式に、非公式に","note":"`ask questions informally`。形容詞 informal、反意語 formally。","tier":"A","ref":"TSL 499","note_html":"<code>ask questions informally</code>。形容詞 informal、反意語 formally。"}],"translation":"ソフトウェアに不案内な新入社員には、旧来のメニューのほうが必要に適していると感じられるかもしれません。画面配置に慣れれば保存記録も簡単に利用でき、いつでも気軽に質問していただけます。","html":"New staff who are <b class=\"tg\">unfamiliar</b> with the software may find the older menu better <b class=\"tg\">suited</b> to their needs. Once you <b class=\"tg\">are accustomed to</b> the layout, the archive is easily <b class=\"tg\">accessible</b>, and you may ask questions <b class=\"tg\">informally</b> at any time."},{"id":117,"vol":6,"theme":"科学館・行事","sentence":"The nature center's **wildlife** exhibit reopens on Saturday, and a bronze **statue** of the founder now stands at the entrance. A hands-on **microscope** station has been added, and the event **coordinator** has invited this year's **graduation** class.","words":[{"w":"wildlife","jp":"野生生物","note":"不可算名詞。`a wildlife exhibit / sanctuary`。","tier":"A","ref":"TSL 560","note_html":"不可算名詞。<code>a wildlife exhibit / sanctuary</code>。"},{"w":"statue","jp":"像、彫像","note":"`a bronze statue of the founder`。status（地位）と綴りが紛らわしい。","tier":"A","ref":"TSL 535","note_html":"<code>a bronze statue of the founder</code>。status（地位）と綴りが紛らわしい。"},{"w":"microscope","jp":"顕微鏡","note":"`a microscope station`、`under a microscope`。研究室設定のPart 1にも出る。","tier":"A","ref":"TSL 502","note_html":"<code>a microscope station</code>、<code>under a microscope</code>。研究室設定のPart 1にも出る。"},{"w":"coordinator","jp":"まとめ役、担当責任者","note":"`the event coordinator`。動詞 coordinate、名詞 coordination。","tier":"A","ref":"TSL 460","note_html":"<code>the event coordinator</code>。動詞 coordinate、名詞 coordination。"},{"w":"graduation","jp":"卒業、卒業式","note":"`this year's graduation class`、`a graduation ceremony`。動詞 graduate。","tier":"A","ref":"TSL 522","note_html":"<code>this year&#x27;s graduation class</code>、<code>a graduation ceremony</code>。動詞 graduate。"}],"translation":"自然センターの野生生物展示が土曜日に再開され、入口には創設者の青銅像が新たに設置されました。実際に触れられる顕微鏡コーナーも増設され、イベント担当者は今年の卒業生を招待しています。","html":"The nature center&#x27;s <b class=\"tg\">wildlife</b> exhibit reopens on Saturday, and a bronze <b class=\"tg\">statue</b> of the founder now stands at the entrance. A hands-on <b class=\"tg\">microscope</b> station has been added, and the event <b class=\"tg\">coordinator</b> has invited this year&#x27;s <b class=\"tg\">graduation</b> class."},{"id":118,"vol":6,"theme":"健康施策","sentence":"The **payroll department** will add a wellness allowance, and every employee receives a **fitness tracker** and a month of **vitamin** supplements. Managers are **optimistic** about the plan, though the **effectiveness** of such programs is hard to measure.","words":[{"w":"payroll department","jp":"給与課","note":"`The payroll department will add ~`。部署名の語彙として押さえる。","tier":"A","ref":"TSL 581","note_html":"<code>The payroll department will add ~</code>。部署名の語彙として押さえる。"},{"w":"fitness tracker","jp":"活動量計","note":"`receive a fitness tracker`。健康増進プログラムの記事で登場する。","tier":"S","ref":"TSL 115","note_html":"<code>receive a fitness tracker</code>。健康増進プログラムの記事で登場する。"},{"w":"vitamin","jp":"ビタミン、栄養補助剤","note":"`vitamin supplements`。発音は米 /ˈvaɪtəmɪn/。","tier":"A","ref":"TSL 513","note_html":"<code>vitamin supplements</code>。発音は米 /ˈvaɪtəmɪn/。"},{"w":"optimistic","jp":"楽観的な","note":"`be optimistic about the plan`。about が続く。名詞 optimism、反意語 pessimistic。","tier":"A","ref":"TSL 550","note_html":"<code>be optimistic about the plan</code>。about が続く。名詞 optimism、反意語 pessimistic。"},{"w":"effectiveness","jp":"有効性、効果","note":"`measure the effectiveness of ~`。形容詞 effective、efficiency（効率）と区別する。","tier":"A","ref":"TSL 572","note_html":"<code>measure the effectiveness of ~</code>。形容詞 effective、efficiency（効率）と区別する。"}],"translation":"給与課が健康手当を新設し、全従業員に活動量計と1か月分のビタミン剤が支給されます。管理職はこの計画に楽観的ですが、こうしたプログラムの有効性を測るのは難しいことです。","html":"The <b class=\"tg\">payroll department</b> will add a wellness allowance, and every employee receives a <b class=\"tg\">fitness tracker</b> and a month of <b class=\"tg\">vitamin</b> supplements. Managers are <b class=\"tg\">optimistic</b> about the plan, though the <b class=\"tg\">effectiveness</b> of such programs is hard to measure."},{"id":119,"vol":6,"theme":"経営・株主","sentence":"To **simplify** reporting, the board will **facilitate** direct contact between analysts and **stockholders**. The new **tactics** were explained at the annual meeting, and the chair praised the **facilitation** of the discussion.","words":[{"w":"simplify","jp":"簡素化する","note":"`simplify reporting / the process`。形容詞 simple、名詞 simplification。","tier":"A","ref":"TSL 586","note_html":"<code>simplify reporting / the process</code>。形容詞 simple、名詞 simplification。"},{"w":"facilitate","jp":"促進する、容易にする","note":"`facilitate contact / discussion`。「円滑に進むよう手助けする」の意。","tier":"A","ref":"TSL 573","note_html":"<code>facilitate contact / discussion</code>。「円滑に進むよう手助けする」の意。"},{"w":"stockholder","jp":"株主","note":"`analysts and stockholders`。shareholder と同義で、米国式。","tier":"A","ref":"TSL 537","note_html":"<code>analysts and stockholders</code>。shareholder と同義で、米国式。"},{"w":"tactics","jp":"戦術、方策","note":"通常は複数形。`new tactics were explained`。strategy（戦略）より個別・短期の手段を指す。","tier":"S","ref":"TSL 78","note_html":"通常は複数形。<code>new tactics were explained</code>。strategy（戦略）より個別・短期の手段を指す。"},{"w":"facilitation","jp":"進行支援、円滑化","note":"`praise the facilitation of the discussion`。動詞 facilitate、名詞 facilitator。","tier":"A","ref":"TSL 573","note_html":"<code>praise the facilitation of the discussion</code>。動詞 facilitate、名詞 facilitator。"}],"translation":"報告手続きを簡素化するため、取締役会はアナリストと株主の直接的な接触を促進します。新しい方策は年次総会で説明され、議長は議事進行の運びを称賛しました。","html":"To <b class=\"tg\">simplify</b> reporting, the board will <b class=\"tg\">facilitate</b> direct contact between analysts and <b class=\"tg\">stockholders</b>. The new <b class=\"tg\">tactics</b> were explained at the annual meeting, and the chair praised the <b class=\"tg\">facilitation</b> of the discussion."},{"id":120,"vol":6,"theme":"雑誌・書評","sentence":"An **enthusiastic** **reviewer** praised the new **motorcycle** in last week's issue. The piece appeared as an **editorial** rather than a formal test report, so the tone is deliberately **informal**.","words":[{"w":"enthusiastic","jp":"熱狂的な、乗り気の","note":"`an enthusiastic reviewer`、`be enthusiastic about ~`。名詞 enthusiasm、副詞 enthusiastically。","tier":"A","ref":"TSL 521","note_html":"<code>an enthusiastic reviewer</code>、<code>be enthusiastic about ~</code>。名詞 enthusiasm、副詞 enthusiastically。"},{"w":"reviewer","jp":"評論家、審査員","note":"`a reviewer praised ~`。動詞・名詞 review（批評、見直し）。","tier":"A","ref":"TSL 474","note_html":"<code>a reviewer praised ~</code>。動詞・名詞 review（批評、見直し）。"},{"w":"motorcycle","jp":"オートバイ","note":"`test a new motorcycle`。Part 1の写真描写にも出る。","tier":"A","ref":"TSL 528","note_html":"<code>test a new motorcycle</code>。Part 1の写真描写にも出る。"},{"w":"editorial","jp":"社説、論説／編集の","note":"`appear as an editorial`、`the editorial staff`。名詞・形容詞の両用法。","tier":"A","ref":"TSL 571","note_html":"<code>appear as an editorial</code>、<code>the editorial staff</code>。名詞・形容詞の両用法。"},{"w":"informal","jp":"略式の、くだけた","note":"`a deliberately informal tone`。反意語 formal、副詞 informally。","tier":"A","ref":"TSL 499","note_html":"<code>a deliberately informal tone</code>。反意語 formal、副詞 informally。"}],"translation":"熱のこもった評論家が、先週号で新型オートバイを称賛しました。その記事は正式な試乗レポートではなく社説として掲載されたため、文体は意図的にくだけたものになっています。","html":"An <b class=\"tg\">enthusiastic</b> <b class=\"tg\">reviewer</b> praised the new <b class=\"tg\">motorcycle</b> in last week&#x27;s issue. The piece appeared as an <b class=\"tg\">editorial</b> rather than a formal test report, so the tone is deliberately <b class=\"tg\">informal</b>."},{"id":121,"vol":7,"theme":"推薦・採用","sentence":"Two supervisors will **nominate** candidates for the award, and one **referral** came from a former client. The **placement** office reports that **acceptance** rates have risen, and graduates are **eager** to begin work.","words":[{"w":"nominate","jp":"推薦する、指名する","note":"`nominate someone for an award`。for が続く。名詞 nomination。","tier":"A","ref":"TSL 608","note_html":"<code>nominate someone for an award</code>。for が続く。名詞 nomination。"},{"w":"referral","jp":"紹介、照会","note":"`a referral from a former client`、`a referral program`。動詞 refer（`refer someone to ~`）。","tier":"A","ref":"TSL 647","note_html":"<code>a referral from a former client</code>、<code>a referral program</code>。動詞 refer（<code>refer someone to ~</code>）。"},{"w":"placement","jp":"就職斡旋、配置","note":"`the placement office`（就職課）、`job placement`。動詞 place。","tier":"A","ref":"TSL 782","note_html":"<code>the placement office</code>（就職課）、<code>job placement</code>。動詞 place。"},{"w":"acceptance","jp":"受け入れ、承諾","note":"`acceptance rates`、`an acceptance letter`（採用通知）。動詞 accept。","tier":"A","ref":"TSL 698","note_html":"<code>acceptance rates</code>、<code>an acceptance letter</code>（採用通知）。動詞 accept。"},{"w":"eager","jp":"熱望している","note":"`be eager to begin work`。後ろは to 不定詞。副詞 eagerly、名詞 eagerness。","tier":"A","ref":"TSL 598","note_html":"<code>be eager to begin work</code>。後ろは to 不定詞。副詞 eagerly、名詞 eagerness。"}],"translation":"2名の上司が表彰の候補者を推薦する予定で、1件は元顧客からの紹介でした。就職課の報告によれば内定率は上昇しており、卒業生は働き始めることを心待ちにしています。","html":"Two supervisors will <b class=\"tg\">nominate</b> candidates for the award, and one <b class=\"tg\">referral</b> came from a former client. The <b class=\"tg\">placement</b> office reports that <b class=\"tg\">acceptance</b> rates have risen, and graduates are <b class=\"tg\">eager</b> to begin work."},{"id":122,"vol":7,"theme":"図書館","sentence":"Return borrowed books to the **circulation desk**, where a **circulation clerk** will scan them. Our **circulation** figures show that each **periodical** is read twice a month, and a **translator** has been hired for the foreign-language section.","words":[{"w":"circulation desk","jp":"貸出カウンター","note":"`return books to the circulation desk`。図書館設定のPart 3で頻出。","tier":"A","ref":"TSL 667","note_html":"<code>return books to the circulation desk</code>。図書館設定のPart 3で頻出。"},{"w":"circulation clerk","jp":"貸出係","note":"`a circulation clerk will scan them`。職名として出る。","tier":"A","ref":"TSL 667","note_html":"<code>a circulation clerk will scan them</code>。職名として出る。"},{"w":"circulation","jp":"発行部数、貸出、循環","note":"`circulation figures`（発行部数）、`air circulation`（空気循環）。多義語。","tier":"A","ref":"TSL 667","note_html":"<code>circulation figures</code>（発行部数）、<code>air circulation</code>（空気循環）。多義語。"},{"w":"periodical","jp":"定期刊行物","note":"`each periodical is read twice a month`。雑誌・学術誌の総称。形容詞 periodic。","tier":"A","ref":"TSL 731","note_html":"<code>each periodical is read twice a month</code>。雑誌・学術誌の総称。形容詞 periodic。"},{"w":"translator","jp":"翻訳者","note":"`hire a translator`。動詞 translate、名詞 translation。通訳は interpreter。","tier":"A","ref":"TSL 693","note_html":"<code>hire a translator</code>。動詞 translate、名詞 translation。通訳は interpreter。"}],"translation":"借りた本は貸出カウンターにご返却ください。そこで貸出係が読み取り処理をします。当館の貸出数によれば各定期刊行物は月2回読まれており、外国語コーナーには翻訳者が採用されました。","html":"Return borrowed books to the <b class=\"tg\">circulation desk</b>, where a <b class=\"tg\">circulation clerk</b> will scan them. Our <b class=\"tg\">circulation</b> figures show that each <b class=\"tg\">periodical</b> is read twice a month, and a <b class=\"tg\">translator</b> has been hired for the foreign-language section."},{"id":123,"vol":7,"theme":"会議・説明","sentence":"Please **clarify** which figures need a **correction** before Friday. The presentation was **informative**, and the online **forum** was **likewise** useful for gathering questions.","words":[{"w":"clarify","jp":"明確にする","note":"`clarify which figures ~`、`clarify a point`。名詞 clarification、clarity。","tier":"A","ref":"TSL 703","note_html":"<code>clarify which figures ~</code>、<code>clarify a point</code>。名詞 clarification、clarity。"},{"w":"correction","jp":"訂正、修正","note":"`need a correction`、`make corrections`。動詞 correct、副詞 correctly。","tier":"A","ref":"TSL 706","note_html":"<code>need a correction</code>、<code>make corrections</code>。動詞 correct、副詞 correctly。"},{"w":"informative","jp":"有益な、参考になる","note":"`an informative presentation / brochure`。「情報量が多く役立つ」の意。","tier":"A","ref":"TSL 603","note_html":"<code>an informative presentation / brochure</code>。「情報量が多く役立つ」の意。"},{"w":"forum","jp":"討論の場、掲示板","note":"`an online forum`、`a public forum`。会議形式にもウェブ掲示板にも使う。","tier":"A","ref":"TSL 770","note_html":"<code>an online forum</code>、<code>a public forum</code>。会議形式にもウェブ掲示板にも使う。"},{"w":"likewise","jp":"同様に","note":"`The forum was likewise useful.`、`Likewise, ~`。similarly と同義の接続副詞。","tier":"A","ref":"TSL 830","note_html":"<code>The forum was likewise useful.</code>、<code>Likewise, ~</code>。similarly と同義の接続副詞。"}],"translation":"金曜日までに、どの数値に訂正が必要かを明確にしてください。プレゼンテーションは有益で、オンラインの討論の場も同様に、質問を集めるうえで役立ちました。","html":"Please <b class=\"tg\">clarify</b> which figures need a <b class=\"tg\">correction</b> before Friday. The presentation was <b class=\"tg\">informative</b>, and the online <b class=\"tg\">forum</b> was <b class=\"tg\">likewise</b> useful for gathering questions."},{"id":124,"vol":7,"theme":"規則の順守","sentence":"All contractors must **comply** with the safety code and **conform to** the building standards. The rule is **applicable** to subcontractors as well, so proceed with **caution** and plan your schedule **accordingly**.","words":[{"w":"comply","jp":"従う","note":"`comply with the safety code`。**with が必須**。名詞 compliance、形容詞 compliant。","tier":"A","ref":"TSL 595","note_html":"<code>comply with the safety code</code>。**with が必須**。名詞 compliance、形容詞 compliant。"},{"w":"conform to","jp":"〜に適合する、従う","note":"`conform to the building standards`。to が必須で、comply with と対で問われる。","tier":"A","ref":"TSL 810","note_html":"<code>conform to the building standards</code>。to が必須で、comply with と対で問われる。"},{"w":"applicable","jp":"適用される、当てはまる","note":"`applicable to subcontractors`、`if applicable`（該当する場合）。","tier":"A","ref":"TSL 624","note_html":"<code>applicable to subcontractors</code>、<code>if applicable</code>（該当する場合）。"},{"w":"caution","jp":"注意、用心","note":"`proceed with caution`、`a word of caution`。形容詞 cautious、副詞 cautiously。","tier":"A","ref":"TSL 593","note_html":"<code>proceed with caution</code>、<code>a word of caution</code>。形容詞 cautious、副詞 cautiously。"},{"w":"accordingly","jp":"それに応じて、したがって","note":"`plan your schedule accordingly`。「前述の内容に合わせて」の意。","tier":"A","ref":"TSL 622","note_html":"<code>plan your schedule accordingly</code>。「前述の内容に合わせて」の意。"}],"translation":"請負業者は全員、安全規定に従い、建築基準に適合しなければなりません。この規則は下請業者にも適用されるため、注意して作業を進め、それに応じて日程を組んでください。","html":"All contractors must <b class=\"tg\">comply</b> with the safety code and <b class=\"tg\">conform to</b> the building standards. The rule is <b class=\"tg\">applicable</b> to subcontractors as well, so proceed with <b class=\"tg\">caution</b> and plan your schedule <b class=\"tg\">accordingly</b>."},{"id":125,"vol":7,"theme":"進行管理","sentence":"Renovation of the west wing is **ongoing**, and inspections are carried out **periodically**. Notify the desk **beforehand** if you need access, and the work should proceed **smoothly** and finish **in a timely manner**.","words":[{"w":"ongoing","jp":"進行中の、継続中の","note":"`Renovation is ongoing.`、`an ongoing project`。underway の言い換え。","tier":"A","ref":"TSL 641","note_html":"<code>Renovation is ongoing.</code>、<code>an ongoing project</code>。underway の言い換え。"},{"w":"periodically","jp":"定期的に","note":"`inspections are carried out periodically`。形容詞 periodic、名詞 period。","tier":"A","ref":"TSL 642","note_html":"<code>inspections are carried out periodically</code>。形容詞 periodic、名詞 period。"},{"w":"beforehand","jp":"前もって、事前に","note":"`Notify the desk beforehand.`。in advance と同義。副詞なので前置詞は不要。","tier":"A","ref":"TSL 628","note_html":"<code>Notify the desk beforehand.</code>。in advance と同義。副詞なので前置詞は不要。"},{"w":"smoothly","jp":"順調に、円滑に","note":"`proceed / run smoothly`、`go smoothly`。形容詞 smooth。","tier":"A","ref":"TSL 690","note_html":"<code>proceed / run smoothly</code>、<code>go smoothly</code>。形容詞 smooth。"},{"w":"in a timely manner","jp":"適時に、遅滞なく","note":"`finish in a timely manner`。ビジネス文書の定型句。形容詞 timely。","tier":"A","ref":"TSL 843","note_html":"<code>finish in a timely manner</code>。ビジネス文書の定型句。形容詞 timely。"}],"translation":"西棟の改装は進行中で、検査は定期的に実施されています。立ち入りが必要な場合は事前に受付までご連絡ください。作業は順調に進み、遅滞なく完了する見込みです。","html":"Renovation of the west wing is <b class=\"tg\">ongoing</b>, and inspections are carried out <b class=\"tg\">periodically</b>. Notify the desk <b class=\"tg\">beforehand</b> if you need access, and the work should proceed <b class=\"tg\">smoothly</b> and finish <b class=\"tg\">in a timely manner</b>."},{"id":126,"vol":7,"theme":"販売中止・撤去","sentence":"The manufacturer will **discontinue** the older model, so replacement parts may be **unavailable** after March. **Alternatively**, you may request the **removal** of the unit at no cost, which should limit any **disappointment**.","words":[{"w":"discontinue","jp":"生産・提供を中止する","note":"`discontinue the older model / a service`。「打ち切る」の意で、stop より正式。","tier":"A","ref":"TSL 710","note_html":"<code>discontinue the older model / a service</code>。「打ち切る」の意で、stop より正式。"},{"w":"unavailable","jp":"入手できない、対応できない","note":"`parts may be unavailable`、`He is unavailable today.`。反意語 available。","tier":"A","ref":"TSL 695","note_html":"<code>parts may be unavailable</code>、<code>He is unavailable today.</code>。反意語 available。"},{"w":"alternatively","jp":"あるいは、代わりに","note":"`Alternatively, you may request ~`。文頭で別案を示す接続副詞。","tier":"A","ref":"TSL 658","note_html":"<code>Alternatively, you may request ~</code>。文頭で別案を示す接続副詞。"},{"w":"removal","jp":"撤去、除去","note":"`request the removal of the unit`、`snow removal`。動詞 remove。","tier":"A","ref":"TSL 616","note_html":"<code>request the removal of the unit</code>、<code>snow removal</code>。動詞 remove。"},{"w":"disappointment","jp":"失望","note":"`limit any disappointment`、`to my disappointment`。動詞 disappoint、形容詞 disappointed / disappointing。","tier":"A","ref":"TSL 764","note_html":"<code>limit any disappointment</code>、<code>to my disappointment</code>。動詞 disappoint、形容詞 disappointed / disappointing。"}],"translation":"メーカーは旧型の生産を中止するため、3月以降は交換部品が入手できなくなる可能性があります。あるいは、無償で装置の撤去をご依頼いただくこともでき、それにより失望を最小限に抑えられます。","html":"The manufacturer will <b class=\"tg\">discontinue</b> the older model, so replacement parts may be <b class=\"tg\">unavailable</b> after March. <b class=\"tg\">Alternatively</b>, you may request the <b class=\"tg\">removal</b> of the unit at no cost, which should limit any <b class=\"tg\">disappointment</b>."},{"id":127,"vol":7,"theme":"資格・研究機関","sentence":"The **institute** will **certify** laboratories that meet the new standard. Only **certified** staff may handle the samples, so please **familiarize** yourself with the **chemistry** section of the manual.","words":[{"w":"institute","jp":"研究所、協会／設ける","note":"`a research institute`、`institute a policy`（制度を設ける）。名詞・動詞の両用法。","tier":"A","ref":"TSL 604","note_html":"<code>a research institute</code>、<code>institute a policy</code>（制度を設ける）。名詞・動詞の両用法。"},{"w":"certify","jp":"認定する、証明する","note":"`certify laboratories`、`certified public accountant`。名詞 certification、certificate。","tier":"A","ref":"TSL 664","note_html":"<code>certify laboratories</code>、<code>certified public accountant</code>。名詞 certification、certificate。"},{"w":"certified","jp":"公認の、資格を持つ","note":"`only certified staff`、`a certified technician`。求人広告で頻出。","tier":"A","ref":"TSL 664","note_html":"<code>only certified staff</code>、<code>a certified technician</code>。求人広告で頻出。"},{"w":"familiarize","jp":"慣れさせる","note":"`familiarize yourself with ~`。再帰代名詞＋with の形で覚える。形容詞 familiar。","tier":"A","ref":"TSL 678","note_html":"<code>familiarize yourself with ~</code>。再帰代名詞＋with の形で覚える。形容詞 familiar。"},{"w":"chemistry","jp":"化学","note":"`the chemistry section`。名詞 chemist（化学者、英国では薬剤師）。","tier":"A","ref":"TSL 666","note_html":"<code>the chemistry section</code>。名詞 chemist（化学者、英国では薬剤師）。"}],"translation":"その研究所は、新基準を満たす検査室を認定します。試料を扱えるのは資格を持つ職員のみですので、マニュアルの化学の章に目を通して慣れておいてください。","html":"The <b class=\"tg\">institute</b> will <b class=\"tg\">certify</b> laboratories that meet the new standard. Only <b class=\"tg\">certified</b> staff may handle the samples, so please <b class=\"tg\">familiarize</b> yourself with the <b class=\"tg\">chemistry</b> section of the manual."},{"id":128,"vol":7,"theme":"データ集計","sentence":"Our analyst will **compile** the survey results and check each response **individually**. The **compilation** will be released **separately** from the annual report, and an **approximate** total is already available.","words":[{"w":"compile","jp":"まとめる、編集する","note":"`compile the survey results / a list`。散在するものを集めて整理する意。","tier":"A","ref":"TSL 705","note_html":"<code>compile the survey results / a list</code>。散在するものを集めて整理する意。"},{"w":"individually","jp":"個別に、1つずつ","note":"`check each response individually`。形容詞 individual。","tier":"A","ref":"TSL 827","note_html":"<code>check each response individually</code>。形容詞 individual。"},{"w":"compilation","jp":"編集物、集大成","note":"`The compilation will be released ~`。動詞 compile の名詞形。","tier":"A","ref":"TSL 705","note_html":"<code>The compilation will be released ~</code>。動詞 compile の名詞形。"},{"w":"separately","jp":"別々に、個別に","note":"`released separately from ~`。形容詞 separate（動詞は /-eɪt/、形容詞は /-ət/）。","tier":"A","ref":"TSL 619","note_html":"<code>released separately from ~</code>。形容詞 separate（動詞は /-eɪt/、形容詞は /-ət/）。"},{"w":"approximate","jp":"おおよその","note":"`an approximate total`。副詞 approximately（約〜）はPart 5で頻出。","tier":"A","ref":"TSL 846","note_html":"<code>an approximate total</code>。副詞 approximately（約〜）はPart 5で頻出。"}],"translation":"当社の分析担当が調査結果をまとめ、各回答を個別に確認します。その編集物は年次報告書とは別に公表されますが、おおよその合計はすでに入手可能です。","html":"Our analyst will <b class=\"tg\">compile</b> the survey results and check each response <b class=\"tg\">individually</b>. The <b class=\"tg\">compilation</b> will be released <b class=\"tg\">separately</b> from the annual report, and an <b class=\"tg\">approximate</b> total is already available."},{"id":129,"vol":7,"theme":"経済・見通し","sentence":"An **economist** described the **outlook** for the region as **favorable**, noting that exports have grown **substantially**. Improved conditions have also raised employee **morale**.","words":[{"w":"economist","jp":"経済学者、エコノミスト","note":"`An economist described ~`。economics（経済学）、economy（経済）と区別する。","tier":"A","ref":"TSL 599","note_html":"<code>An economist described ~</code>。economics（経済学）、economy（経済）と区別する。"},{"w":"outlook","jp":"見通し、展望","note":"`the outlook for the region`、`the economic outlook`。forecast に近い。","tier":"A","ref":"TSL 834","note_html":"<code>the outlook for the region</code>、<code>the economic outlook</code>。forecast に近い。"},{"w":"favorable","jp":"好ましい、有利な","note":"`a favorable outlook / review / response`。反意語 unfavorable。","tier":"A","ref":"TSL 768","note_html":"<code>a favorable outlook / review / response</code>。反意語 unfavorable。"},{"w":"substantially","jp":"大幅に、実質的に","note":"`grow substantially`。形容詞 substantial（`a substantial increase`）。","tier":"A","ref":"TSL 794","note_html":"<code>grow substantially</code>。形容詞 substantial（<code>a substantial increase</code>）。"},{"w":"morale","jp":"士気","note":"不可算名詞。`raise / boost employee morale`。moral（道徳）と綴り・発音が異なる点に注意。","tier":"A","ref":"TSL 831","note_html":"不可算名詞。<code>raise / boost employee morale</code>。moral（道徳）と綴り・発音が異なる点に注意。"}],"translation":"あるエコノミストは、輸出が大幅に伸びたことを指摘し、その地域の見通しは良好だと述べました。状況の改善は従業員の士気も高めています。","html":"An <b class=\"tg\">economist</b> described the <b class=\"tg\">outlook</b> for the region as <b class=\"tg\">favorable</b>, noting that exports have grown <b class=\"tg\">substantially</b>. Improved conditions have also raised employee <b class=\"tg\">morale</b>."},{"id":130,"vol":7,"theme":"店舗・買い物","sentence":"There is **ample** space near the **checkout** counter for a new display. The **vending machine** by the door now sells a **cookie** and a drink together, and the **cosmetics** aisle has been widened.","words":[{"w":"ample","jp":"十分な、広々とした","note":"`ample space / time / parking`。plenty of と同義の形容詞。","tier":"A","ref":"TSL 803","note_html":"<code>ample space / time / parking</code>。plenty of と同義の形容詞。"},{"w":"checkout","jp":"レジ、精算","note":"`the checkout counter`、`checkout time`（ホテルの退室時刻）。2義がある。","tier":"A","ref":"TSL 665","note_html":"<code>the checkout counter</code>、<code>checkout time</code>（ホテルの退室時刻）。2義がある。"},{"w":"vending machine","jp":"自動販売機","note":"`the vending machine by the door`。Part 1・社内案内で登場する。","tier":"A","ref":"TSL 748","note_html":"<code>the vending machine by the door</code>。Part 1・社内案内で登場する。"},{"w":"cookie","jp":"クッキー","note":"`sells a cookie and a drink`。英国式は biscuit。","tier":"A","ref":"TSL 671","note_html":"<code>sells a cookie and a drink</code>。英国式は biscuit。"},{"w":"cosmetics","jp":"化粧品","note":"通常は複数形。`the cosmetics aisle / department`。","tier":"A","ref":"TSL 760","note_html":"通常は複数形。<code>the cosmetics aisle / department</code>。"}],"translation":"レジカウンターの近くには、新しい陳列棚を置くのに十分な広さがあります。入口脇の自動販売機ではクッキーと飲み物のセット販売を始め、化粧品売り場の通路は拡張されました。","html":"There is <b class=\"tg\">ample</b> space near the <b class=\"tg\">checkout</b> counter for a new display. The <b class=\"tg\">vending machine</b> by the door now sells a <b class=\"tg\">cookie</b> and a drink together, and the <b class=\"tg\">cosmetics</b> aisle has been widened."},{"id":131,"vol":7,"theme":"レストラン","sentence":"The chef recommends the seafood **entrée**, which uses an **authentic** regional sauce. If you **spill** anything, tell a server, and note that the **pots
