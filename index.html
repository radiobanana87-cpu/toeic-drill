m"],"body":["We photograph staff portraits at your office, so nobody loses half a day travelling to a studio. Our team arrives with lighting and a background and needs a room of at least four by four metres.","Pricing is per person: €38 for up to twenty people, €31 for twenty-one to fifty, and €26 above fifty. The figure covers one retouched image per person, delivered within five working days.","Additional images from the same session are €9 each and may be ordered for six months afterwards, after which the files are deleted.","We can also photograph your premises on the same visit. This is quoted separately, as it usually needs a different time of day for the light."],"questions":[{"q":"What must the client provide?","o":["A background","Lighting equipment","Transport to the studio","A room of a certain size"],"a":3,"e":"照明と背景はスタジオ側が持参する。依頼側は4メートル四方以上の部屋を用意する。"},{"q":"How much would each portrait cost for a group of thirty?","o":["€38","€26","€9","€31"],"a":3,"e":"21〜50名の区分に該当するため1人31ユーロ。"},{"q":"What is stated about additional images?","o":["They must be ordered on the day","They are included in the price","They can be ordered for six months","They are delivered within five working days"],"a":2,"e":"同じ撮影分から6か月間は追加注文でき、その後ファイルは削除される。"}],"ja":["ノースライト・スタジオ ― 社員のポートレート撮影","社員のポートレートは貴社のオフィスで撮影しますので、スタジオまで移動して半日を失う方は誰も出ません。当スタジオが照明と背景を持参します。4メートル四方以上のお部屋をご用意ください。","料金は1名あたりで、20名までが38ユーロ、21〜50名が31ユーロ、51名以上が26ユーロです。この料金には1名につき1点のレタッチ済み画像が含まれ、5営業日以内に納品します。","同じ撮影分からの追加画像は1点9ユーロで、撮影後6か月間ご注文いただけます。その期間を過ぎるとファイルは削除されます。","同じ訪問時に貴社の施設の撮影も承ります。光の条件から別の時間帯が必要になることが多いため、こちらは別途お見積いたします。"]},{"id":84,"part":5,"cat":"求人広告","theme":"求人広告：博物館の受付係","header":["Visitor Services Assistant — Halgrave Maritime Museum"],"body":["Halgrave Maritime Museum is recruiting two Visitor Services Assistants for the summer season, from 1 May to 30 September.","You will sell tickets, answer questions about the collection, and lead a fifteen-minute talk in the boat hall three times a day. The talk is scripted, and we rehearse it with you during your first week; you are not expected to research it yourself.","The museum is open Wednesday to Sunday, and the post covers four of those five days on a rota agreed each month. We cannot offer a fixed pattern, as the rota depends on the schools&#x27; booking calendar.","Pay is £12.60 an hour. Applications close on 21 March. We will hold a group session on 4 April for shortlisted candidates before individual interviews the same afternoon."],"questions":[{"q":"What is stated about the talk in the boat hall?","o":["It is given once a day","Assistants write it themselves","A script is provided and rehearsed","It lasts thirty minutes"],"a":2,"e":"台本があり、最初の週にリハーサルを行う。自分で調べる必要はない。"},{"q":"Why can the museum not offer a fixed weekly pattern?","o":["The museum closes on different days each week","The season is too short","Two assistants share the same hours","The rota depends on school bookings"],"a":3,"e":"学校団体の予約状況によって勤務表が変わるため。"},{"q":"What will happen on 4 April?","o":["Applications will close","The summer season will begin","A group session and interviews will be held","The rota will be published"],"a":2,"e":"書類選考通過者向けの集団セッションと、同日午後の個人面接が行われる。"}],"ja":["来館者サービス係募集 ― ハルグレイブ海事博物館","ハルグレイブ海事博物館では、5月1日から9月30日までの夏季シーズンに向けて、来館者サービス係を2名募集します。","入場券の販売、収蔵品に関するご質問への対応、ボートホールでの15分間の解説を1日3回担当していただきます。解説には台本があり、勤務初週に一緒にリハーサルを行います。ご自身で調べる必要はありません。","当館は水曜から日曜まで開館しており、本職はその5日のうち4日を担当します。勤務表は毎月調整します。学校団体の予約状況によって変わるため、固定の勤務パターンはご提示できません。","時給は12.60ポンドです。応募は3月21日に締め切ります。4月4日に書類選考通過者向けの集団セッションを行い、同日午後に個人面接を実施します。"]},{"id":85,"part":5,"cat":"社内文書","theme":"社内文書：印刷物の発注手続き","header":["MEMORANDUM","宛先: All departments","差出人: Brand and Communications","日付: 15 January"],"body":["From 1 February, business cards, letterhead, and folders must be ordered through the single supplier, Cardell Print, using the template on the intranet. Orders placed with other printers will not be reimbursed.","The template locks the logo, typeface, and margins. Everything else — name, role, and contact details — remains editable, so no design approval is needed before you order.","Business cards are produced in boxes of 250 and take seven working days. Rush orders of three days cost 60 percent more and should be used only when a member of staff joins at short notice.","Existing stock does not have to be discarded. Use what you hold, and order from the new template when it runs out; the two designs differ only in the position of the logo."],"questions":[{"q":"What must be used to place an order from 1 February?","o":["A written request to Cardell Print","A form from the Brand team","The intranet template","The department budget code"],"a":2,"e":"イントラネット上のテンプレートを使い、指定業者に発注する。"},{"q":"Why is design approval unnecessary?","o":["The template fixes the design elements","Approval is given by the supplier","The Brand team checks each order later","Business cards are exempt from the rules"],"a":0,"e":"ロゴ・書体・余白がテンプレートで固定されており、編集できるのは名前や連絡先のみだから。"},{"q":"What are staff told to do with cards they already hold?","o":["Continue using them until they run out","Return them to Brand and Communications","Exchange them for the new design","Discard them before 1 February"],"a":0,"e":"手持ちは廃棄せず使い切り、なくなってから新テンプレートで発注する。"}],"ja":["社内連絡　宛先：全部門　差出人：ブランド・広報部　日付：1月15日","2月1日より、名刺、レターヘッド、フォルダーは、イントラネット上のテンプレートを用いて指定業者のカーデル印刷に発注してください。他の印刷業者への発注は精算されません。","テンプレートではロゴ、書体、余白が固定されています。編集できるのは氏名、役職、連絡先のみですので、発注前のデザイン承認は不要です。","名刺は250枚入りの箱単位で製作し、7営業日かかります。3営業日の特急は60パーセント増しとなりますので、急な入社があった場合に限りご利用ください。","現在お持ちの在庫を廃棄する必要はありません。使い切ってから新しいテンプレートで発注してください。2つのデザインの違いはロゴの位置だけです。"]},{"id":86,"part":5,"cat":"記事","theme":"記事：醸造所の生産拡大","header":["Tarnwick Business Review — 7 February"],"body":["Fenn Brewery will double its output this year after installing four new fermentation tanks at its site on Quarry Lane. The tanks were delivered in December and are expected to be in use by the end of March.","Founder Aisling Fenn started the business in a converted garage in 2014 and now employs nineteen people. She said the expansion was driven by supply agreements with two supermarket chains rather than by demand at the brewery&#x27;s own taproom, which will keep its current opening hours.","The taproom accounts for roughly fifteen percent of sales. Ms. Fenn said she has no plans to open a second one, describing it as &quot;a shop window, not the business.&quot;","Three production jobs will be advertised in March."],"questions":[{"q":"What prompted the expansion?","o":["A shortage of storage space","Growing demand at the taproom","Agreements with supermarket chains","The purchase of a second site"],"a":2,"e":"自社タップルームの需要ではなく、スーパー2社との供給契約が理由。"},{"q":"What does Ms. Fenn mean by describing the taproom as &quot;a shop window&quot;?","o":["It is open longer than the brewery","It attracts attention rather than driving sales","It sells products from other brewers","It will be redesigned this year"],"a":1,"e":"売上の15%程度で、事業の中心ではなく見せる場だという趣旨。2店舗目の予定もない。"},{"q":"What is expected to happen in March?","o":["Production jobs will be advertised","The taproom will extend its hours","The tanks will be delivered","A second taproom will open"],"a":0,"e":"3月に生産職3名の募集が出される。タンクの納入は12月で、稼働が3月末の見込み。"}],"ja":["ターンウィック・ビジネス・レビュー 2月7日","フェン醸造所は、クオリー通りの拠点に発酵タンク4基を新設し、今年生産量を倍増させる。タンクは12月に納入されており、3月末までに稼働する見込みである。","創業者のアシュリング・フェン氏は2014年に改装したガレージで事業を始め、現在は19名を雇用する。同氏は、拡大の要因は自社タップルームの需要ではなく、スーパーマーケット2社との供給契約であると述べた。タップルームの営業時間は現行のまま維持される。","タップルームは売上の約15パーセントを占める。フェン氏は2店舗目を開く予定はないとし、タップルームを「事業そのものではなく、見せるための窓口」と表現した。","3月には生産職3名の募集が出される。"]},{"id":87,"part":5,"cat":"手紙","theme":"手紙：会員規約の改定","header":["Westmoor Tennis Club","宛先: Mr. Julien Roche","日付: 3 December"],"body":["Dear Mr. Roche,","The committee has agreed two changes to the membership rules, which take effect on 1 February.","First, court bookings may now be made fourteen days ahead instead of seven. Members told us that a week was too short to arrange a game with guests, and the longer window addresses that.","Second, a member may hold no more than three future bookings at any one time. Without this limit, the longer window would allow a small number of members to reserve most of the peak evening slots.","Your subscription is unaffected and remains £245 for the year beginning 1 April.","If you wish to raise either change at the annual meeting on 22 January, please send your point to the secretary by 15 January so that it can be listed.","Yours sincerely,","Frances Udall, Club Secretary"],"questions":[{"q":"Why was the booking window extended?","o":["To match the rules of other clubs","Because the courts are being resurfaced","To reduce the number of empty courts","Because members needed more time to arrange games"],"a":3,"e":"来客を交えた試合の調整に1週間では短いという会員の声を受けたもの。"},{"q":"Why has a limit on bookings been introduced?","o":["To allow guests to book directly","To encourage members to play in the morning","To prevent a few members taking most peak slots","To reduce administration for the secretary"],"a":2,"e":"予約可能期間を延ばすと、一部の会員が夕方の人気枠を押さえてしまうため。"},{"q":"What must Mr. Roche do to raise a point at the annual meeting?","o":["Pay his subscription before 1 February","Give notice at the meeting itself","Attend the committee meeting in December","Write to the secretary by 15 January"],"a":3,"e":"議題に載せるため、1月15日までに事務局へ論点を送る必要がある。"}],"ja":["ウェストムーア・テニスクラブ　宛先：ジュリアン・ロシュ様　日付：12月3日","ロシュ様","運営委員会は会員規約について2点の変更を決定しました。いずれも2月1日から適用されます。","第一に、コートの予約が従来の7日前から14日前まで可能になります。来客を交えた試合を組むには1週間では短いというご意見が会員から寄せられており、期間の延長はこれに対応するものです。","第二に、1人の会員が同時に保持できる先の予約は3件までとなります。この上限がなければ、期間の延長により一部の会員が夕方の人気枠の大半を押さえてしまうことになるためです。","会費に変更はなく、4月1日から始まる年度も245ポンドのままです。","いずれかの変更について1月22日の年次総会で発言をご希望の場合は、議題に記載できるよう1月15日までに事務局へ論点をお送りください。","フランセス・ユードール（クラブ事務局）"]},{"id":88,"part":5,"cat":"チャット","theme":"チャット：音響トラブルへの対応","header":["Event team chat — Saturday, 8:50 A.M."],"body":["<b>Ines Bauer (8:50 A.M.)</b> The two microphones on the main stage are cutting out. The technician says it's interference from the market radios next door.","<b>Tomas Weir (8:52 A.M.)</b> Can he change the frequency? Doors open at ten.","<b>Ines Bauer (8:54 A.M.)</b> He's tried both spare channels and they're worse. He has wired microphones in the van, but the cable would cross where the audience walks in.","<b>Tomas Weir (8:56 A.M.)</b> Then we tape the cable down and put a marshal at that point. A trip hazard we can control beats a speaker nobody can hear.","<b>Ines Bauer (8:58 A.M.)</b> Agreed. I'll ask the technician to run the cable along the left wall instead — it's a longer route but it stays clear of the entrance."],"questions":[{"q":"What is causing the problem?","o":["A fault in the microphones","A power failure on the stage","Signals from nearby radios","Damage to a cable"],"a":2,"e":"隣の市場で使われている無線からの電波干渉が原因だと技術者が述べている。"},{"q":"What is the drawback of the wired microphones?","o":["They are of poorer quality","There are not enough of them","The cable would cross the entrance","They cannot be used on the main stage"],"a":2,"e":"ケーブルが観客の入場経路を横切ってしまう点。"},{"q":"What does Ms. Bauer decide at 8:58 A.M.?","o":["To route the cable along a wall","To use a single microphone","To move the stage","To delay the opening of the doors"],"a":0,"e":"遠回りになるが入口を避けられるよう、左の壁沿いにケーブルを通すよう技術者に依頼する。"}],"ja":["イベントチーム チャット 土曜日 午前8時50分","イネス・バウアー（8:50）メインステージのマイク2本が途切れています。技術者によると、隣の市場の無線からの干渉だそうです。","トマス・ウィア（8:52）周波数を変えられませんか。開場は10時です。","イネス・バウアー（8:54）予備のチャンネルを2つとも試しましたが、かえって悪化しました。有線マイクが車に積んでありますが、ケーブルが観客の入場経路を横切ってしまいます。","トマス・ウィア（8:56）ではケーブルをテープで固定し、その地点に誘導係を置きましょう。管理できるつまずきの危険のほうが、声が誰にも届かない登壇者よりましです。","イネス・バウアー（8:58）賛成です。技術者に頼んで、代わりに左の壁沿いに通してもらいます。遠回りにはなりますが、入口を避けられます。"]},{"id":89,"part":5,"cat":"案内","theme":"案内：ボランティア説明会","header":["Kelsall Community Garden — Volunteer Information Session"],"body":["An information session for new volunteers will be held on Saturday 12 April at 10:00 A.M. in the garden&#x27;s meeting hut. It lasts about an hour and there is no need to book.","The garden runs two kinds of session. Wednesday mornings are for general upkeep — weeding, watering, and path repair — and suit people who can come regularly. Saturday afternoons are project days, announced a month ahead, and are better if your availability changes week to week.","Tools are provided; bring gloves if you have a pair you prefer. Under-sixteens are welcome with an adult.","We ask new volunteers to come to the session before their first working visit, because the safety points about the pond and the tool store are covered only there."],"questions":[{"q":"What is stated about the information session?","o":["It requires advance booking","It lasts about an hour","It is held every Saturday","It is for experienced volunteers"],"a":1,"e":"所要は約1時間で、予約は不要。"},{"q":"Which sessions suit someone whose free time varies?","o":["Saturday afternoons","Wednesday mornings","Both equally","Neither"],"a":0,"e":"土曜午後の企画日は1か月前に告知され、都合が週ごとに変わる人に向く。"},{"q":"Why must new volunteers attend the session first?","o":["To register for insurance","Because safety points are explained only there","Because places on work days are limited","To collect a set of tools"],"a":1,"e":"池と道具庫に関する安全上の注意はこの説明会でしか扱われないため。"}],"ja":["ケルソール共同菜園 ― ボランティア説明会","新しいボランティアの方向けの説明会を、4月12日（土）午前10時より菜園の集会小屋で開催します。所要は約1時間で、予約は不要です。","当菜園には2種類の活動日があります。水曜の午前は除草、水やり、通路の補修といった日常の手入れで、定期的に来られる方に向いています。土曜の午後は企画の日で、1か月前に内容を告知します。都合が週ごとに変わる方にはこちらが適しています。","道具はこちらで用意します。使い慣れた手袋がある方はご持参ください。16歳未満の方も、大人の同伴があれば参加できます。","新しいボランティアの方には、最初の作業参加の前にこの説明会へお越しいただいています。池と道具庫に関する安全上の注意は、この場でしかご説明していないためです。"]},{"id":90,"part":5,"cat":"見積書","theme":"見積書：家電修理の見積","header":["REPAIR ESTIMATE — Marchmont Appliance Care","受付番号: RA-3160","機種: Sable 700 washing machine","日付: 9 August"],"body":["Fault reported: machine stops during the spin cycle. Diagnosis: worn drum bearing.","Call-out and diagnosis: £55. Parts (bearing set and seal): £128. Labour (two hours): £90. Estimate total: £273.","If you go ahead with the repair, the call-out charge is deducted, bringing the amount payable to £218. If you decide not to proceed, the £55 stands and nothing further is charged.","The machine is nine years old. A bearing repair typically adds three to five years of use, but we would not recommend a second major repair on a machine of this age. Please take that into account when comparing the estimate with the cost of replacement.","This estimate holds for thirty days. Parts are guaranteed for twelve months, labour for six."],"questions":[{"q":"What will the customer pay if the repair goes ahead?","o":["£273","£55","£218","£128"],"a":2,"e":"修理に進む場合は出張診断料55ポンドが差し引かれ、273−55＝218ポンド。"},{"q":"What advice does the company give?","o":["To weigh the repair against buying a new machine","To extend the guarantee","To repair the machine every three years","To replace the machine immediately"],"a":0,"e":"9年経過した機械なので、買い替え費用と比較して判断するよう促している。"},{"q":"What is stated about the guarantee?","o":["It lasts thirty days","It covers parts for longer than labour","It applies only if the call-out is paid","It covers the whole machine"],"a":1,"e":"部品は12か月、作業は6か月の保証。"}],"ja":["修理見積 ― マーチモント家電サービス　受付番号：RA-3160　機種：セーブル700 洗濯機　日付：8月9日","申告された不具合：脱水行程の途中で停止する。診断結果：ドラム軸受の摩耗。","出張料および診断：55ポンド。部品（軸受一式およびシール）：128ポンド。作業（2時間）：90ポンド。見積合計：273ポンド。","修理をご依頼いただく場合は出張料が差し引かれ、お支払額は218ポンドとなります。修理を見送られる場合は55ポンドのみで、それ以上の請求はありません。","本機は製造から9年が経過しています。軸受の修理により通常3〜5年の使用が見込めますが、この年数の機械に2度目の大きな修理をお勧めすることはいたしません。買い替え費用と本見積を比較される際に、この点をご考慮ください。","本見積の有効期間は30日です。部品は12か月、作業は6か月の保証付きです。"]},{"id":91,"part":5,"cat":"レビュー","theme":"レビュー：オンライン講座の評価","header":["Course review — Data Visualisation Foundations | by R. Adeyinka"],"body":["I took this six-week course while working full time, spending about four hours a week on it. That was enough to keep up, which is more than I can say for two other courses I have tried.","The strength is the exercises. Each week you are given a messy dataset and a specific question, and you build one chart to answer it. Feedback comes from two other learners, not from the instructor, which I expected to be a weakness but was not: having to explain why someone else&#x27;s chart failed taught me more than being corrected would have.","The recorded lectures are the weaker part — slow, and largely repeated in the notes. I skipped most of them after week two and my marks did not suffer."],"questions":[{"q":"What does the reviewer say about the workload?","o":["It was lighter than expected","It required more than ten hours a week","It increased in the final weeks","It was manageable alongside a job"],"a":3,"e":"週4時間程度で、フルタイム勤務と両立してついていけたと述べている。"},{"q":"What surprised the reviewer?","o":["That the course lasted six weeks","That peer feedback was valuable","The difficulty of the datasets","That the instructor replied quickly"],"a":1,"e":"講師ではなく受講生同士の相互講評であることを弱点だと予想したが、そうではなかった。"},{"q":"What does the reviewer say about the lectures?","o":["They are essential to passing","They largely repeat the written notes","They are shorter than the exercises","They are given live each week"],"a":1,"e":"講義は進行が遅く内容の大半が配布資料と重複しており、2週目以降はほとんど飛ばした。"}],"ja":["講座レビュー ― データ可視化の基礎　投稿者 R・アデインカ","フルタイムで働きながらこの6週間の講座を受け、週に4時間ほどを充てた。それでついていくには十分だった。以前に試した他の2つの講座については、そうは言えない。","長所は演習だ。毎週、整理されていないデータと具体的な問いが与えられ、それに答える図を1つ作る。講評は講師ではなく他の受講生2名から届く。これは弱点になると予想していたが、そうではなかった。他人の図がなぜ機能していないのかを説明する必要があったことは、自分が直されるよりも多くを教えてくれた。","録画講義のほうが弱い。進行が遅く、内容の大半が配布資料と重複している。2週目以降はほとんど飛ばしたが、成績に響くことはなかった。"]},{"id":92,"part":5,"cat":"プレスリリース","theme":"プレスリリース：物流拠点の新設","header":["PRESS RELEASE — Ardley Distribution"],"body":["Ardley Distribution will open a 22,000-square-metre depot at Rothwell Park in the spring. The site will serve customers in the north of the region, who are currently supplied from the Carlton depot ninety kilometres away.","The company expects delivery distances for those customers to fall by about a third. Carlton will continue to operate and will take on the southern routes released by the change; no roles there will be lost.","The new depot will employ 130 people. Half of these will transfer from Carlton at their own request, and the rest will be recruited locally from February.","Ardley has said the depot is designed so that a second floor can be added to the office block later, though no decision has been taken."],"questions":[{"q":"Why is the new depot being opened?","o":["To reduce the number of employees","To store goods for a new product line","To replace the Carlton depot","To shorten deliveries to northern customers"],"a":3,"e":"90キロ離れたカールトンから供給している北部の顧客への配送距離を約3分の1減らすため。"},{"q":"What is stated about the Carlton depot?","o":["It will keep operating with southern routes","It will lose half of its staff","It will close in the spring","It will be rebuilt"],"a":0,"e":"稼働を続け、変更で空いた南部の路線を引き受ける。人員削減はない。"},{"q":"How will the new depot be staffed?","o":["Entirely by local recruitment","Half by transfer and half by local hiring","By staff from several depots","By transfers only"],"a":1,"e":"130名のうち半数が本人の希望によるカールトンからの異動、残りは2月からの地元採用。"}],"ja":["報道発表 ― アードリー配送","アードリー配送は今春、ロズウェル・パークに22,000平方メートルの集配拠点を開設する。同拠点は地域北部の顧客に対応する。これらの顧客には現在、90キロ離れたカールトン拠点から供給している。","同社は、これらの顧客への配送距離が約3分の1減ると見込んでいる。カールトン拠点は稼働を続け、今回の変更で空いた南部の路線を引き受ける。同拠点での人員削減はない。","新拠点では130名を雇用する。うち半数は本人の希望によりカールトンから異動し、残りは2月から地元で採用する。","アードリー社は、事務棟に後から2階部分を増築できる設計にしていると述べたが、実施は決定していない。"]},{"id":93,"part":5,"cat":"日程表","theme":"日程表：分科会の日程","header":["Regional Conference — Afternoon Sessions, 5 June"],"body":["13:30–14:20  Stream A: Reducing packaging waste (Hall 1)<br>13:30–14:20  Stream B: Supplier audits in practice (Room 12)<br>14:30–15:20  Stream A: Energy contracts explained (Hall 1)<br>14:30–15:20  Stream B: Recruiting for warehouses (Room 12)<br>15:30–16:15  Closing panel, all delegates (Hall 1)","Delegates may move between streams; there is no need to register for a particular one. Hall 1 seats 200 and Room 12 seats 60, so arrive early for the sessions in Room 12.","The two Stream B sessions will be recorded and posted for delegates within a week. Stream A is not recorded, at the request of the speakers, who will take questions instead.","Refreshments are served in the foyer from 15:20. Please take drinks into Hall 1 only in the lidded cups provided."],"questions":[{"q":"What is stated about choosing sessions?","o":["Only one session may be attended","Delegates may move between streams","Delegates must register for one stream","Stream B is for warehouse staff only"],"a":1,"e":"事前登録は不要で、分科会間の移動は自由。"},{"q":"Why should delegates arrive early for Room 12?","o":["It has fewer seats than Hall 1","Refreshments are served there","Recording begins before the session","The sessions start earlier there"],"a":0,"e":"ホール1は200席だが12号室は60席のため。"},{"q":"Which sessions will be available afterwards?","o":["All afternoon sessions","The Stream A sessions","The closing panel","The Stream B sessions"],"a":3,"e":"講演者の希望によりストリームAは録画されず、録画されるのはストリームBの2つ。"}],"ja":["地域会議 ― 6月5日 午後の分科会","13:30–14:20 ストリームA：包装廃棄物の削減（ホール1）<br>13:30–14:20 ストリームB：仕入先監査の実務（12号室）<br>14:30–15:20 ストリームA：電力契約の読み解き方（ホール1）<br>14:30–15:20 ストリームB：倉庫人材の採用（12号室）<br>15:30–16:15 閉会討論（全参加者・ホール1）","分科会間の移動は自由です。特定のストリームへの事前登録は必要ありません。ホール1は200席、12号室は60席ですので、12号室の分科会には早めにお越しください。","ストリームBの2つの分科会は録画し、1週間以内に参加者向けに公開します。ストリームAは講演者の希望により録画せず、代わりに質疑応答の時間を取ります。","軽食は15時20分よりホワイエで提供します。ホール1へお飲み物をお持ち込みの際は、ご用意した蓋付きのカップのみとしてください。"]},{"id":94,"part":5,"cat":"取扱説明","theme":"取扱説明：断裁機の使い方","header":["Guillotine trimmer — before you use it"],"body":["This machine cuts up to forty sheets at once. Attempting more will not cut cleanly and is the usual reason the blade needs sharpening early.","Slide the paper against the back guide and lower the clamp before you bring the blade down. The clamp holds the stack still; without it the lower sheets shift and the edge comes out uneven.","The blade guard must be in place. If the guard has been removed for sharpening and not refitted, do not use the machine — report it to the office manager instead of refitting it yourself, as the guard has to be aligned with a gauge.","Return the blade to the upright position and engage the catch when you finish. The machine is stored in the copy room and is used by everyone on the floor."],"questions":[{"q":"What happens if too many sheets are cut at once?","o":["The guard will detach","The clamp will not close","The cut is poor and the blade dulls sooner","The machine stops automatically"],"a":2,"e":"40枚を超えるときれいに切れず、刃が早く研磨を要する原因になる。"},{"q":"What is the purpose of the clamp?","o":["To hold the stack so the edge is even","To protect the user&#x27;s hands","To measure the width of the cut","To lock the blade when not in use"],"a":0,"e":"押さえがないと下の紙がずれ、断面が不揃いになる。"},{"q":"What should a user do if the blade guard is missing?","o":["Move the machine to the office","Refit it before using the machine","Use the machine carefully without it","Tell the office manager"],"a":3,"e":"ゲージで位置を合わせる必要があるため、自分で取り付けず総務課長に報告する。"}],"ja":["断裁機 ― ご使用の前に","本機は一度に40枚まで断裁できます。それを超えるときれいに切れず、刃の研磨が早く必要になる主な原因となります。","紙を奥のガイドに沿わせ、刃を下ろす前に押さえを下げてください。押さえが紙の束を固定します。押さえがないと下側の紙がずれ、断面が不揃いになります。","刃の安全カバーは必ず取り付けられている状態にしてください。研磨のために外されたまま戻されていない場合は、本機を使用しないでください。カバーはゲージで位置を合わせる必要があるため、ご自身で取り付けず総務課長にご報告ください。","使用後は刃を上げた位置に戻し、留め具をかけてください。本機はコピー室に置かれ、このフロアの全員が使用します。"]},{"id":95,"part":5,"cat":"Eメール","theme":"Eメール：納期前倒しの相談","header":["宛先: Production, Verrall Cases","差出人: Noor Siddiqui, Client Services","件名: Order 7742 — can we bring the date forward?"],"body":["Hi all,","The client for order 7742 has asked whether the 600 cases due on 9 October could reach them by 2 October. Their own launch has moved forward and they say they will take a partial delivery if the full quantity is not possible.","Before I answer them, I need two things from you. First, whether the moulding line has capacity in week 39. Second, if only part of the order can be ready, how many cases that would be — the client needs at least 400 for the launch itself and can take the rest later.","I have not promised anything. If the answer is no, that is a perfectly good answer and I will tell them today rather than leave it open.","Noor"],"questions":[{"q":"What has the client requested?","o":["A reduction in price","A larger quantity of cases","An earlier delivery date","A change to the case design"],"a":2,"e":"10月9日納期の600個を10月2日までに届けられないかという相談。"},{"q":"What does Ms. Siddiqui ask the production team to tell her?","o":["The date the moulds were made","The cost of working overtime","Which courier will be used","How many cases could be ready early"],"a":3,"e":"第39週の生産能力と、一部しか間に合わない場合の数量の2点を求めている。"},{"q":"What does Ms. Siddiqui say about a negative answer?","o":["She would accept it and reply the same day","She would ask the client to wait a week","She would raise it with the director","She would place the order elsewhere"],"a":0,"e":"「無理なら無理でよい」とし、保留にせず当日中に顧客へ伝えると述べている。"}],"ja":["宛先：ヴェラル・ケース 製造部　差出人：ヌール・シディキ（顧客対応）　件名：注文7742 ― 納期を前倒しできますか","皆さん","注文7742の顧客から、10月9日納期の600個を10月2日までに届けられないかという相談がありました。先方の発売時期が前倒しになったためで、全数が無理であれば分納でも構わないとのことです。","回答の前に2点を確認させてください。第一に、成形ラインに第39週の生産能力があるかどうか。第二に、一部しか用意できない場合は何個になるか。顧客は発売そのものには最低400個が必要で、残りは後日で構わないと言っています。","こちらからは何も約束していません。難しいという答えであればそれで結構ですので、保留にせず本日中に先方へお伝えします。","ヌール"]},{"id":96,"part":5,"cat":"お知らせ","theme":"お知らせ：駐輪場の利用","header":["NOTICE — Bicycle Store, Level B1"],"body":["The bicycle store has forty spaces and is reached by the ramp at the rear of the building. Access is by staff card between 6:00 A.M. and 10:00 P.M.","Register your bicycle on the facilities page before first use. Registration records the frame number, which is what allows Security to release a bicycle to its owner if a lock has to be cut.","Bicycles left for more than fourteen consecutive days will be tagged. If a tagged bicycle has not moved after a further fourteen days, it will be taken to the store room on Level B2 and held for three months.","Two spaces near the door are reserved for cargo bicycles and cannot be used by standard frames, as the neighbouring spaces are too narrow to pass otherwise."],"questions":[{"q":"What is the purpose of registration?","o":["To record the frame number","To arrange insurance","To allocate a numbered space","To obtain a staff card"],"a":0,"e":"フレーム番号を記録することで、施錠を切った場合に持ち主へ返却できる。"},{"q":"What happens to a bicycle that has not moved for a month?","o":["Its registration is canceled","It is returned to the owner","It is tagged for the first time","It is removed to a store room"],"a":3,"e":"14日で札を付け、さらに14日動かなければB2の保管室へ移し3か月保管する。"},{"q":"Why are two spaces reserved?","o":["They have charging points","Standard bicycles would block the neighbouring spaces","They are used by Security","They are closest to the ramp"],"a":1,"e":"隣の区画が狭く、通り抜けができなくなるため、荷物用自転車専用としている。"}],"ja":["お知らせ ― 駐輪場（地下1階）","駐輪場は40台分で、建物裏手のスロープからお入りください。午前6時から午後10時まで、社員証で入場できます。","初回のご利用前に、施設ページで自転車を登録してください。登録によりフレーム番号が記録されます。施錠を切る必要が生じた際に、警備部が持ち主へ自転車をお返しできるのはこの番号があるためです。","14日以上続けて置かれた自転車には札を付けます。札を付けてからさらに14日動かない場合は、地下2階の保管室へ移し、3か月間保管します。","扉の近くの2区画は荷物用自転車の専用です。通常の自転車が使うと隣の区画を通り抜けられなくなるため、ご利用いただけません。"]},{"id":97,"part":5,"cat":"社内報","theme":"社内報：無事故記録の達成","header":["Plant Bulletin — Safety"],"body":["The Redmoor plant reached 500 days without a lost-time injury on 2 June. The previous best, set in 2019, was 372 days.","The safety team attributes the change less to new equipment than to the near-miss reporting introduced two years ago. Reports rose from about thirty a year to more than four hundred, and the great majority describe situations where nothing was damaged and nobody was hurt.","That volume is the point. Each report is reviewed at the Monday meeting, and roughly one in ten leads to a physical change — a guard moved, a walkway repainted, a step replaced.","A small event to mark the milestone will be held in the canteen on 20 June. Reporting continues as normal; the counter resets only if an injury occurs, not at the event."],"questions":[{"q":"What does the safety team credit for the improvement?","o":["New machinery","Additional training courses","The near-miss reporting system","A change in shift patterns"],"a":2,"e":"新しい設備よりも、2年前に導入したヒヤリハット報告の効果が大きいとしている。"},{"q":"What is stated about the reports?","o":["Most describe situations where no harm occurred","About half lead to a physical change","Most describe incidents causing damage","They are reviewed once a month"],"a":0,"e":"大半は損害も負傷もなかった状況の報告。約10件に1件が現場の改修につながる。"},{"q":"What will happen to the day counter after 20 June?","o":["It will be replaced by a monthly figure","It will stop at 500","It continues unless an injury occurs","It will restart at the event"],"a":2,"e":"記録は行事では区切られず、負傷が発生した場合にのみ振り出しに戻る。"}],"ja":["工場だより ― 安全","レッドムーア工場は6月2日、休業災害なしの記録が500日に達しました。これまでの最長は2019年に記録した372日でした。","安全チームは、この変化の要因を新しい設備よりも、2年前に導入したヒヤリハット報告に見ています。報告件数は年間約30件から400件超に増え、その大半は何も壊れず誰も負傷しなかった状況を記したものです。","その件数の多さこそが要点です。各報告は月曜の会議で検討され、おおよそ10件に1件が現場の改修につながっています。安全カバーの移設、通路の塗り直し、踏み板の交換などです。","節目を記念した小さな催しを6月20日に食堂で行います。報告は通常どおり続けてください。記録の日数は行事で区切られることはなく、負傷が発生した場合にのみ振り出しに戻ります。"]},{"id":98,"part":5,"cat":"報告書","theme":"報告書：研修効果の追跡","header":["Training Evaluation — Presentation Skills Course"],"body":["Sixty-two staff completed the two-day course between January and June. Ninety percent rated it good or excellent immediately afterwards, which is in line with previous years.","Satisfaction on the day, however, tells us little. We therefore surveyed the same group three months later and asked what they had actually changed. Forty-one replied. Of these, thirty said they now rehearse aloud before a presentation, a technique taught on day one, while only nine said they use the structured opening taught on day two.","The gap is worth examining. The rehearsal technique requires no preparation of materials; the structured opening asks people to rewrite slides they have often inherited from someone else.","We propose keeping day one unchanged and rebuilding day two around adapting existing slides rather than writing new ones."],"questions":[{"q":"Why did the team survey participants a second time?","o":["Because immediate /* ---- 保存領域 ---- */
const Store = (() => {
  const mem = {};
  const hasW = typeof window.storage !== 'undefined' && window.storage;
  return {
    async load(key, fallback){
      try{
        if(hasW){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
        const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback;
      }catch(e){ return (key in mem) ? mem[key] : fallback; }
    },
    async save(key, obj){
      mem[key] = obj;
      try{
        if(hasW){ await window.storage.set(key, JSON.stringify(obj)); return; }
        localStorage.setItem(key, JSON.stringify(obj));
      }catch(e){}
    }
  };
})();

let mode = 'read';

for(const k of Object.keys(MODES)){

let cursor = 0, revealed = false, view = 'start';
let examDate = null;             // 'YYYY-MM-DD'

function daysUntil(iso){
  const [y, m, dd] = iso.split('-').map(Number);
  const target = new Date(y, m - 1, dd);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}
function fmtDate(iso){
  const [y, m, dd] = iso.split('-').map(Number);
  return y + '年' + m + '月' + dd + '日';
}
function countdownHtml(){
  if(!examDate){
    return '<div class="cd"><button id="cdEdit">受験日を設定する</button>'
         + '<input type="date" id="cdInput" hidden></div>';
  }
  const n = daysUntil(examDate);
  const label = n > 0  ? '次の受験まで <b>' + n + '</b> 日'
              : n === 0 ? '<b>今日</b>が受験日です'
              : '<span class="past">受験日から ' + (-n) + ' 日経過</span>';
  return '<div class="cd"><span>' + label + '</span>'
       + '<span class="d">' + fmtDate(examDate) + '</span>'
       + '<button id="cdEdit">変更</button><button id="cdClear">削除</button>'
       + '<input type="date" id="cdInput" value="' + examDate + '" hidden></div>';
}
function bindCountdown(){
  const inp = document.getElementById('cdInput');
  const ed  = document.getElementById('cdEdit');
  const cl  = document.getElementById('cdClear');
  if(ed) ed.onclick = () => {
    inp.hidden = false; ed.hidden = true;
    if(inp.showPicker) { try{ inp.showPicker(); }catch(e){ inp.focus(); } } else inp.focus();
  };
  if(inp) inp.onchange = async () => {

    render();
  };
  if(cl) cl.onclick = async () => {
    examDate = null; await Store.save(KEY_EXAM, null); render();
  };
}
let sel = [];                    // 現在の問題で選んだ選択肢（添字）
let query = '';                  // 直近の検索語
let highlight = '';              // カード内で強調する語
let INDEX = null;                // 検索用の全文インデックス

const stripTags = s => String(s).replace(/<[^>]+>/g, '');
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

function buildIndex(){
  if(INDEX) return INDEX;
  INDEX = [];
  for(const m of Object.keys(MODES)){
    for(const q of MODES[m].data){
      let t = '';
      if(m === 'read'){
        t = stripTags(q.html) + ' ' + q.words.map(w => w.w + ' ' + w.jp + ' ' + stripTags(w.note_html)).join(' ');
      }else if(m === 'gram'){
        t = q.items.map(i => stripTags(i.en) + ' ' + stripTags(i.note)).join(' ');
      }else if(m === 'focus'){
        t = stripTags(q.q) + ' ' + q.o.join(' ') + ' ' + stripTags(q.e);
      }else{
        t = q.header.join(' ') + ' ' + q.body.map(stripTags).join(' ') + ' '
          + q.questions.map(qq => stripTags(qq.q) + ' ' + qq.o.join(' ')).join(' ');
      }
      INDEX.push({ mode: m, id: q.id, part: q.part, theme: q.theme, text: t.replace(/\s+/g, ' ') });
    }
  }
  return INDEX;
}

function search(term){
  const t = term.trim();
  if(!t) return [];
  const re = new RegExp(reEsc(t), 'i');
  const word = new RegExp('(^|[^A-Za-z])' + reEsc(t) + '($|[^A-Za-z])', 'i');
  const out = [];
  for(const row of buildIndex()){
    const pos = row.text.search(re);
    if(pos < 0) continue;
    const start = Math.max(0, pos - 55);
    let snip = row.text.slice(start, pos + t.length + 75);
    if(start > 0) snip = '… ' + snip;
    out.push({ ...row, snip, exact: word.test(row.text) });
  }
  out.sort((a, b) => (b.exact - a.exact) || (a.mode.localeCompare(b.mode)) || (a.id - b.id));
  return out;
}

function hl(html){
  if(!highlight) return html;
  const re = new RegExp('(' + reEsc(highlight) + ')', 'gi');
  return String(html).split(/(<[^>]+>)/)
    .map(seg => seg.startsWith('<') ? seg : seg.replace(re, '<mark>$1</mark>'))
    .join('');
}

const $ = s => document.querySelector(s);
const cur = () => MODES[mode];
const byId = id => cur().data.find(q => q.id === id);
const mk = (m, id) => m + ':' + id;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function visible(){
  const f = filterOf[mode];
  return order[mode].filter(id => {
    const q = byId(id);
    if(f === 'all') return true;
    if(f === 'again') return marks[mk(mode, id)] === 'again';
    return String(q.part) === f;
  });
}
function counts(m){
  const total = MODES[m].data.length;
  let done = 0, again = 0;
  for(const id of NATURAL[m]){
    const v = marks[mk(m, id)];
    if(v === 'done') done++; else if(v === 'again') again++;
  }
  return { total, done, again, todo: total - done - again };
}
async function savePos(){
  const vis = visible();
  await Store.save(KEY_POS, { mode, filter: filterOf[mode], id: vis[cursor] || null });
}

  bar.hidden = false;
  if(view === 'search'){
    bar.innerHTML = '<button class="barbtn" id="back">← 戻る</button>'
                  + '<button class="barbtn" id="clearHl">強調を消す</button>'
                  + '<span class="barttl">語句検索</span>';
    $('#back').onclick = () => { view = 'start'; render(); };
    $('#clearHl').onclick = () => { highlight = ''; query = ''; render(); };
  }else if(view === 'menu'){
    bar.innerHTML = '<button class="barbtn" id="back">← 問題に戻る</button>'
                  + '<button class="barbtn" id="toSearch">検索</button>'
                  + '<span class="barttl">' + cur().label + '　メニュー</span>';
    $('#back').onclick = () => { view = 'drill'; render(); };
    $('#toSearch').onclick = () => { view = 'search'; render(); };
  }else{
    const vis = visible();
    bar.innerHTML = '<button class="barbtn" id="toStart">← ホーム</button>'
                  + '<button class="barbtn" id="toMenu">≡ 一覧</button>'
                  + '<button class="barbtn" id="toSearch">検索</button>'
                  + '<span class="barttl">' + cur().label + '　'
                  + (vis.length ? (cursor + 1) + ' / ' + vis.length : '0 / 0') + '</span>';
    $('#toStart').onclick = () => { view = 'start'; render(); };
    $('#toMenu').onclick  = () => { view = 'menu'; render(); };
    $('#toSearch').onclick = () => { view = 'search'; render(); };
  }
}

/* ================= スタート画面 ================= */

  $('#main').innerHTML = `

      <button class="big alt" id="fromTop">最初から解く</button>
      <button class="big alt" id="openMenu">問題一覧・設定</button>
      <button class="big alt" id="openSearch">語句で検索する</button>

    <p class="startnote">

    examDate = await Store.load(KEY_EXAM, null);
  const pos = await Store.load(KEY_POS, null);

/* ================= 検索画面 ================= */
function renderSearch(){
  const hits = query ? search(query) : [];
  const shown = hits.slice(0, 60);
  const byMode = {};
  for(const h of shown) (byMode[h.mode] = byMode[h.mode] || []).push(h);

  let list = '';
  for(const m of Object.keys(MODES)){
    const rows = byMode[m];
    if(!rows || !rows.length) continue;
    list += '<div class="groupttl">' + MODES[m].label + '　' + rows.length + '件</div><ul class="hits">';
    for(const h of rows){
      const re = new RegExp('(' + reEsc(query) + ')', 'gi');
      const snip = esc(h.snip).replace(re, '<mark>$1</mark>');
      list += '<li><button data-m="' + h.mode + '" data-id="' + h.id + '">'
            + '<div class="hitmeta"><span>Q' + h.id + '</span><span>Part ' + h.part + '</span>'
            + '<span class="th">' + esc(h.theme) + '</span></div>'
            + '<p class="hitsnip">' + snip + '</p></button></li>';
    }
    list += '</ul>';
  }

  let note = '語や熟語を入力すると、それを含む問題を全モードから探します。';
  if(query){
    note = hits.length
      ? hits.length + ' 件見つかりました' + (hits.length > 60 ? '（上位60件を表示）' : '')
      : '「' + esc(query) + '」を含む問題は見つかりませんでした。';
  }

  $('#main').innerHTML = `
  <div class="srchbar">
    <input type="search" id="q" placeholder="例: invoice / be subject to / 締切"
           value="${esc(query)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="go">検索</button>
  </div>
  <p class="srchnote">${note}</p>
  ${list}`;

  const inp = $('#q');
  const run = () => { query = inp.value; highlight = query.trim(); render(); };
  $('#go').onclick = run;
  inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); run(); } };
  if(!query) inp.focus();

  document.querySelectorAll('.hits button').forEach(btn => {
    btn.onclick = () => {
      mode = btn.dataset.m;
      filterOf[mode] = 'all';
      const id = Number(btn.dataset.id);
      const i = visible().indexOf(id);
      cursor = i >= 0 ? i : 0;
      revealed = false; sel = []; view = 'drill';
      render(); savePos();
      window.scrollTo({top:0});
    };
  });
}

/* ================= 問題カード ================= */
function cardRead(q){
  const words = q.words.map(w => `
    <li>
      <div class="whead">
        <span class="wen">${hl(w.w)}</span>
        <span class="wjp">${w.jp}</span>
        <span class="chip ${w.tier}">${w.tier} · ${w.ref}</span>
      </div>
      <p class="wnote">${w.note_html}</p>
    </li>`).join('');
  return {
    body: `<p class="sentence">${hl(q.html)}</p>
           <p class="hint">太字の語の意味と使い方を言えるか確認してから、解答を開いてください。</p>`,
    reveal: `<ul class="wlist">${words}</ul>
             <p class="trans"><b>全文訳</b>${q.translation}</p>`
  };
}

function cardGram(q){
  const LTR = ['A','B','C','D'];
  const nOK = q.items.filter(i => i.ok).length;
  const hit = sel.length === nOK && sel.every(i => q.items[i].ok);
  const list = q.items.map((it, i) => `
    <li class="gitem ${it.ok ? 'y' : 'n'}${sel.includes(i) ? ' sel' : ''}"
        data-i="${i}" ${revealed ? '' : 'role="button" tabindex="0"'}>
      <div class="ghead">
        <span class="gltr">${LTR[i]}</span>
        <p class="gen">${hl(it.en)}</p>
        <span class="badge ${it.ok ? 'y' : 'n'}">${it.ok ? '正しい' : '誤り'}</span>
        ${sel.includes(i) ? '<span class="badge pick">選んだ</span>' : ''}
      </div>
      <div class="gfb">
        <p class="gja">${it.ja}</p>
        <p class="gnote">${it.note}</p>
      </div>
    </li>`).join('');
  return {
    body: `<p class="split">正しい記述：${nOK} ／ 誤った記述：${q.items.length - nOK}</p>
           <p class="verdict ${hit ? 'hit' : 'miss'}">${sel.length ? (hit ? '正解' : '不正解') : '選択なしで解答を表示'}</p>
           <ul class="glist">${list}</ul>
           <p class="hint">正しい記述を${nOK}つ選ぶと解答が開きます。</p>`,
    reveal: ''
  };
}

function cardFocus(q){
  const LTR = ['A','B','C','D'];
  const picked = sel.length ? sel[0] : -1;
  const hit = picked === q.a;
  const list = q.o.map((o, i) => `
    <li class="gitem ${i === q.a ? 'y' : 'n'}${i === picked ? ' sel' : ''}"
        data-i="${i}" ${revealed ? '' : 'role="button" tabindex="0"'}>
      <div class="ghead">
        <span class="gltr">${LTR[i]}</span>
        <p class="gen">${hl(o)}</p>
        <span class="badge ${i === q.a ? 'y' : 'n'}">${i === q.a ? '正解' : '誤り'}</span>
        ${i === picked ? '<span class="badge pick">選んだ</span>' : ''}
      </div>
    </li>`).join('');
  return {
    body: `<p class="qsent">${hl(q.q)}</p>
           <p class="verdict ${hit ? 'hit' : 'miss'}">${picked >= 0 ? (hit ? '正解' : '不正解') : '選択なしで解答を表示'}</p>
           <ul class="glist">${list}</ul>
           <p class="hint">選択肢をタップすると解答が開きます。</p>`,
    reveal: `<p class="exp"><span>解説</span>${q.e}</p>`
  };
}

function cardPart7(q){
  const LTR = ['A','B','C','D'];
  const n = q.questions.length;
  if(sel.length !== n) sel = new Array(n).fill(-1);
  const answered = sel.every(v => v >= 0);
  const hits = q.questions.reduce((s, qq, i) => s + (sel[i] === qq.a ? 1 : 0), 0);

  const head = q.header.length
    ? '<div class="p7head">' + q.header.join('<br>') + '</div>' : '';
  const body = q.body.map(p => '<p class="p7body">' + hl(p) + '</p>').join('');

  const blocks = q.questions.map((qq, qi) => {
    const opts = qq.o.map((o, i) => `
      <li class="gitem ${i === qq.a ? 'y' : 'n'}${sel[qi] === i ? ' sel' : ''}"
          data-q="${qi}" data-i="${i}" ${revealed ? '' : 'role="button" tabindex="0"'}>
        <div class="ghead">
          <span class="gltr">${LTR[i]}</span>
          <p class="gen">${hl(o)}</p>
          <span class="badge ${i === qq.a ? 'y' : 'n'}">${i === qq.a ? '正解' : '誤り'}</span>
          ${sel[qi] === i ? '<span class="badge pick">選んだ</span>' : ''}
        </div>
      </li>`).join('');
    return `<div class="qblock">
      <p class="qtext"><span class="qnum">${qi + 1}.</span><span>${hl(qq.q)}</span></p>
      <ul class="glist">${opts}</ul>
      <p class="qexp">${qq.e}</p>
    </div>`;
  }).join('');

  return {
    body: head + body
        + `<p class="verdict ${hits === n ? 'hit' : 'miss'}">${answered ? n + '問中 ' + hits + '問正解' : '未解答のまま解答を表示'}</p>`
        + blocks
        + `<p class="hint">${n}問すべてに答えると解答が開きます。</p>`,
    reveal: '<p class="ja"><span>全文訳</span>' + q.ja.map(j => '<p>' + j + '</p>').join('') + '</p>'
  };
}

function renderDrill(){
  const vis = visible();
  const main = $('#main');
  if(!vis.length){
    main.innerHTML = '<div class="empty">該当する問題がありません。<br>「要復習」に印を付けた問題がここに集まります。</div>';
    return;
  }
  if(cursor >= vis.length) cursor = vis.length - 1;
  const q = byId(vis[cursor]);
  const c = mode === 'read'  ? cardRead(q)
          : mode === 'gram'  ? cardGram(q)
          : mode === 'part7' ? cardPart7(q)
          : cardFocus(q);
  const noBorder = mode === 'gram';

  main.innerHTML = `
  <article class="card${revealed ? ' open' : ''}" id="card">
    <div class="eyebrow">
      <span>Q${q.id}</span><span>Part ${q.part}</span><span class="theme">${esc(q.theme)}</span>
    </div>
    ${c.body}

    <div class="actions">
      <button class="btn${revealed ? ' shut' : ''}" id="toggle">${revealed ? '解答を閉じる' : '解答を見る'}</button>
    </div>

    <div class="reveal" id="rev" ${revealed ? '' : 'hidden'} ${noBorder ? 'style="border:0;margin:0;padding:0"' : ''}>
      ${c.reveal}
      <div class="actions">
        <button class="btn ok" id="mDone">できた</button>
        <button class="btn again" id="mAgain">要復習</button>
      </div>
    </div>

    <div class="nav">
      <button id="prev" ${cursor === 0 ? 'disabled' : ''}>← 前の問題</button>
      <button id="next" ${cursor === vis.length - 1 ? 'disabled' : ''}>次の問題 →</button>
    </div>
  </article>
  <p class="swipehint">左右にスワイプしても移動できます</p>`;

  $('#toggle').onclick = () => {
    revealed = !revealed;
    const t = $('#toggle');
    $('#rev').hidden = !revealed;
    $('#card').classList.toggle('open', revealed);
    t.textContent = revealed ? '解答を閉じる' : '解答を見る';
    t.classList.toggle('shut', revealed);
    if(!revealed) $('#card').scrollIntoView({block:'start', behavior:'smooth'});
  };
  $('#prev').onclick  = () => go(-1);
  $('#next').onclick  = () => go(1);
  $('#mDone').onclick = () => mark(q.id, 'done');
  $('#mAgain').onclick= () => mark(q.id, 'again');

  if(!revealed && mode !== 'read'){
    const nOK = mode === 'gram' ? q.items.filter(i => i.ok).length : 1;
    document.querySelectorAll('.gitem[role="button"]').forEach(li => {
      const pick = () => {
        const i = Number(li.dataset.i);
        if(mode === 'part7'){
          sel[Number(li.dataset.q)] = i;
          if(sel.every(v => v >= 0)) revealed = true;   // 全問に答えたら開く
        }else if(mode === 'focus'){
          sel = [i];
          revealed = true;
        }else{
          const s = new Set(sel);
          s.has(i) ? s.delete(i) : s.add(i);
          sel = [...s].sort((a, b) => a - b);
          if(sel.length >= nOK) revealed = true;        // 必要数を選んだ時点で開く
        }
        const y = window.scrollY;
        render();
        window.scrollTo({top:y});
      };
      li.onclick = pick;
      li.onkeydown = ev => { if(ev.key === ' ' || ev.key === 'Enter'){ ev.preventDefault(); pick(); } };
    });
  }
}

function go(delta){
  const vis = visible();
  const n = cursor + delta;
  if(n < 0 || n >= vis.length) return;
  cursor = n; revealed = false; sel = []; render(); savePos();
  window.scrollTo({top:0});
}

async function mark(id, v){
  marks[mk(mode, id)] = v;
  await Store.save(KEY_MARKS, marks);
  const vis = visible();
  const i = vis.indexOf(id);
  if(i >= 0 && i < vis.length - 1) cursor = i + 1;
  else if(filterOf[mode] === 'again') cursor = 0;
  revealed = false; sel = []; render(); savePos();
  window.scrollTo({top:0});
}

function render(){
  renderBar();
  if(view === 'start') renderStart();
  else if(view === 'menu') renderMenu();
  else if(view === 'search') renderSearch();
  else renderDrill();
}

/* ================= スワイプ ================= */
(function(){
  let x0 = null, y0 = null, dx = 0, locked = null;
  const main = document.getElementById('main');
  main.addEventListener('touchstart', e => {
    if(view !== 'drill' || e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; locked = null;
  }, {passive:true});
  main.addEventListener('touchmove', e => {
    if(x0 === null) return;
    const t = e.touches[0], ax = t.clientX - x0, ay = t.clientY - y0;
    if(locked === null && (Math.abs(ax) > 8 || Math.abs(ay) > 8)) locked = Math.abs(ax) > Math.abs(ay) ? 'x' : 'y';
    if(locked !== 'x') return;
    dx = ax;
    const card = document.getElementById('card');
    if(card){ card.classList.add('swiping'); card.style.transform = 'translateX(' + (dx * .3) + 'px)'; }
  }, {passive:true});
  main.addEventListener('touchend', () => {
    const card = document.getElementById('card');
    if(card){ card.classList.remove('swiping'); card.style.transform = ''; }
    if(locked === 'x' && Math.abs(dx) > 60) go(dx < 0 ? 1 : -1);
    x0 = y0 = null; dx = 0; locked = null;
  }, {passive:true});
})();

/* ================= 記録の読み込み ================= */
document.getElementById('importFile').onchange = async e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  try{
    const obj = JSON.parse(await f.text());
    const incoming = obj && obj.marks ? obj.marks : obj;
    if(typeof incoming !== 'object' || incoming === null) throw new Error('形式が不正です');
    const valid = {};
    for(const [k, v] of Object.entries(incoming)){
      if(v !== 'done' && v !== 'again') continue;
      const key = /^\d+$/.test(k) ? mk('read', k) : k;       // 旧形式（数値キー）は読解として扱う
      const [m, idStr] = key.split(':');
      if(MODES[m] && MODES[m].data.some(q => String(q.id) === idStr)) valid[key] = v;
    }
    marks = valid;
    await Store.save(KEY_MARKS, marks);
    cursor = 0; revealed = false; render();
    alert('学習記録を読み込みました（' + Object.keys(valid).length + '問）。');
  }catch(err){
    alert('読み込めませんでした：' + err.message);
  }finally{ e.target.value = ''; }
};

/* ================= キーボード ================= */
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(view !== 'drill') return;
  if(e.key === 'ArrowLeft')  go(-1);
  if(e.key === 'ArrowRight') go(1);
  if(e.key === ' '){ e.preventDefault(); const t = $('#toggle'); if(t) t.click(); }
  if(e.key === 'Escape'){ view = 'menu'; render(); }
  if(e.key === '/'){ e.preventDefault(); view = 'search'; render(); }
});

if('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

(async () => {
  const raw = await Store.load(KEY_MARKS, {}) || {};
  // 旧形式（数値キー＝読解モード）を新形式へ移行
  let migrated = false;
  for(const [k, v] of Object.entries(raw)){
    if(/^\d+$/.test(k)){ raw[mk('read', k)] = v; delete raw[k]; migrated = true; }
  }
  marks = raw;
  if(migrated) await Store.save(KEY_MARKS, marks);
  examDate = await Store.load(KEY_EXAM, null);
  const pos = await Store.load(KEY_POS, null);
  if(pos && MODES[pos.mode]) mode = pos.mode;
  view = 'start';
  render();
})();
</script>
</body>
</html>
