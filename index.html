","items":[{"en":"Each of the departments has its own budget.","ok":true,"note":"正：each of ... は単数扱い。","ja":"各部門はそれぞれ独自の予算を持っている。"},{"en":"One of the machines are out of order.","ok":false,"note":"are -&gt; is：one of ... は単数扱い。","ja":"機械のうち1台が故障している。"},{"en":"The number of complaints have decreased.","ok":false,"note":"have -&gt; has：the number of ... は単数扱い。","ja":"苦情の件数が減少した。"},{"en":"The list of participants was sent yesterday.","ok":true,"note":"正：主語の中心は list（単数）。","ja":"参加者の名簿は昨日送付された。"}]},{"id":32,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Ms. Reed has worked here since 2015.","ok":true,"note":"正：since + 過去の一点は現在完了と結びつく。","ja":"リードさんは2015年からここで働いている。"},{"en":"The factory has opened last March.","ok":false,"note":"has opened -&gt; opened：last March という過去の一点があるので過去形。","ja":"その工場は昨年3月に開設された。"},{"en":"We have used this supplier for six years.","ok":true,"note":"正：継続を表す現在完了。","ja":"当社は6年間この供給業者を利用している。"},{"en":"Sales are increasing steadily since January.","ok":false,"note":"are increasing -&gt; have been increasing：since があるので現在完了進行形。","ja":"1月以降、売上は着実に伸び続けている。"}]},{"id":33,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The contract will be reviewed by the legal team.","ok":true,"note":"正：助動詞 + be + 過去分詞。","ja":"契約書は法務チームによって検討される。"},{"en":"The equipment was arrived on Monday.","ok":false,"note":"was arrived -&gt; arrived：arrive は自動詞なので受動態にできない。","ja":"その機器は月曜日に到着した。"},{"en":"A new policy has announced this morning.","ok":false,"note":"has announced -&gt; has been announced：policy は発表される側。","ja":"新しい方針が今朝発表された。"},{"en":"The invoices were sent to the client yesterday.","ok":true,"note":"正：送られる側が主語なので受動態。","ja":"請求書は昨日、顧客に送付された。"}]},{"id":34,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"We will let you know as soon as we will receive the parts.","ok":false,"note":"will receive -&gt; receive：as soon as 節は現在形。","ja":"部品を受け取り次第、お知らせします。"},{"en":"Please wait here until the manager will return.","ok":false,"note":"will return -&gt; returns：時を表す副詞節では will を使わない。","ja":"部長が戻るまでここでお待ちください。"},{"en":"If it rains tomorrow, the event will be postponed.","ok":true,"note":"正：条件の副詞節は現在形。","ja":"明日雨が降れば、そのイベントは延期される。"},{"en":"We will call you when the order arrives.","ok":true,"note":"正：時を表す副詞節では未来を現在形で表す。","ja":"注文品が届いたらお電話します。"}]},{"id":35,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Employees can requests additional leave.","ok":false,"note":"requests -&gt; request：助動詞の後ろは原形。","ja":"従業員は追加の休暇を申請できる。"},{"en":"The shipment should arrive by Thursday.","ok":true,"note":"正：助動詞 should + 原形。","ja":"出荷は木曜日までに到着するはずだ。"},{"en":"All staff must attend the safety briefing.","ok":true,"note":"正：助動詞 + 動詞の原形。","ja":"全職員は安全説明会に出席しなければならない。"},{"en":"The report must be submits by noon.","ok":false,"note":"submits -&gt; submitted：must be の後ろは過去分詞。","ja":"報告書は正午までに提出されなければならない。"}]},{"id":36,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She had already left when the call came in.","ok":true,"note":"正：過去完了 + 過去。","ja":"電話がかかってきたとき、彼女はすでに退社していた。"},{"en":"The train had left before we will get there.","ok":false,"note":"will get -&gt; got：過去の話なので過去形。","ja":"私たちが着く前に電車は出発していた。"},{"en":"We have finished the audit before the deadline passed.","ok":false,"note":"have finished -&gt; had finished：過去の基準時より前なので過去完了。","ja":"締め切りが過ぎる前に監査を終えていた。"},{"en":"By the time we arrived, the meeting had ended.","ok":true,"note":"正：過去のある時点より前の完了は過去完了。","ja":"我々が到着したときには、会議は終わっていた。"}]},{"id":37,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Every employee have received a new ID card.","ok":false,"note":"have -&gt; has：every + 単数名詞は単数扱い。","ja":"全従業員が新しいIDカードを受け取った。"},{"en":"A number of employees were transferred.","ok":true,"note":"正：a number of ... は複数扱い。","ja":"多くの従業員が異動になった。"},{"en":"Ten percent of the budget is reserved for training.","ok":true,"note":"正：of の後ろが不可算名詞なので単数扱い。","ja":"予算の10パーセントが研修用に確保されている。"},{"en":"Neither of the proposals were accepted.","ok":false,"note":"were -&gt; was：neither of ... は単数扱いが原則。","ja":"どちらの提案も採用されなかった。"}]},{"id":38,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She told us that she will attend the conference.","ok":false,"note":"will -&gt; would：主節が過去なので時制を一致させる。","ja":"彼女は会議に出席すると私たちに言った。"},{"en":"The manager said that the deadline had been extended.","ok":true,"note":"正：主節が過去なので従属節も過去完了。","ja":"部長は締め切りが延長されたと言った。"},{"en":"They announced that the office is closed last Friday.","ok":false,"note":"is -&gt; was：last Friday という過去の時点に合わせる。","ja":"先週の金曜日は休業だと彼らは告知した。"},{"en":"He explained that the system was under maintenance.","ok":true,"note":"正：時制の一致で過去形。","ja":"彼はシステムが保守中だと説明した。"}]},{"id":39,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The documents are needing to be signed today.","ok":false,"note":"are needing -&gt; need：状態を表す need は進行形にしない。","ja":"その書類は本日署名が必要だ。"},{"en":"The office was belonged to a bank before.","ok":false,"note":"was belonged -&gt; belonged：belong は受動態にできない自動詞。","ja":"そのオフィスは以前、銀行の所有だった。"},{"en":"The results will be announced next week.","ok":true,"note":"正：未来の受動態。","ja":"結果は来週発表される。"},{"en":"The proposal is being reviewed at the moment.","ok":true,"note":"正：進行形の受動態。","ja":"その提案は現在検討中である。"}]},{"id":40,"part":2,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"I have submitted the form two days ago.","ok":false,"note":"have submitted -&gt; submitted：ago は現在完了と併用できない。","ja":"私は2日前にその用紙を提出した。"},{"en":"The company has expanded into three new markets.","ok":true,"note":"正：現在までの結果を表す現在完了。","ja":"同社は3つの新市場に進出した。"},{"en":"We finished the renovation last month.","ok":true,"note":"正：過去の一点を示す語句があるので過去形。","ja":"私たちは先月、改装を終えた。"},{"en":"The CEO has resigned in 2019.","ok":false,"note":"has resigned -&gt; resigned：in 2019 は過去の一点。","ja":"そのCEOは2019年に辞任した。"}]},{"id":41,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She always check the inventory before closing.","ok":false,"note":"check -&gt; checks：三単現の -s が必要。","ja":"彼女は閉店前に必ず在庫を確認する。"},{"en":"The delivery truck arrive at noon each day.","ok":false,"note":"arrive -&gt; arrives：主語が三人称単数。","ja":"配送トラックは毎日正午に到着する。"},{"en":"Mr. Cho reviews the invoices on Mondays.","ok":true,"note":"正：三人称単数現在の -s。","ja":"チョウ氏は毎週月曜日に請求書を確認する。"},{"en":"The office opens at eight thirty every weekday.","ok":true,"note":"正：習慣を表す現在形の三単現。","ja":"そのオフィスは平日は8時半に開く。"}]},{"id":42,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"He is knowing the answer to that question.","ok":false,"note":"is knowing -&gt; knows：know は状態動詞で進行形にしない。","ja":"彼はその質問の答えを知っている。"},{"en":"The technicians are installing the new servers now.","ok":true,"note":"正：現在進行形。","ja":"技術者たちは今、新しいサーバーを設置している。"},{"en":"We are currently updating the customer database.","ok":true,"note":"正：currently と現在進行形の組み合わせ。","ja":"当社は現在、顧客データベースを更新している。"},{"en":"The auditors is reviewing the accounts this week.","ok":false,"note":"is -&gt; are：主語 auditors は複数。","ja":"監査人たちは今週、会計を精査している。"}]},{"id":43,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The machine is looked after by the maintenance team.","ok":true,"note":"正：look after の受動態は after を残す。","ja":"その機械は保守チームによって管理されている。"},{"en":"The old files were disposed by the staff.","ok":false,"note":"disposed -&gt; disposed of：dispose of の of を残す。","ja":"古いファイルはスタッフによって処分された。"},{"en":"The proposal was turned down by the committee.","ok":true,"note":"正：群動詞 turn down の受動態。","ja":"その提案は委員会によって却下された。"},{"en":"The issue was dealt by the supervisor.","ok":false,"note":"dealt -&gt; dealt with：deal with の with を省略できない。","ja":"その問題は監督者によって処理された。"}]},{"id":44,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She let the intern to leave early.","ok":false,"note":"to leave -&gt; leave：let は原形不定詞をとる。","ja":"彼女はインターンを早退させた。"},{"en":"They had the technician to check the wiring.","ok":false,"note":"to check -&gt; check：使役の have は原形不定詞。","ja":"彼らは技術者に配線を点検してもらった。"},{"en":"We made the employees stay late.","ok":true,"note":"正：make + 目的語 + 原形不定詞。","ja":"私たちは従業員を残業させた。"},{"en":"The manager had the report revised before noon.","ok":true,"note":"正：have + 目的語 + 過去分詞。","ja":"部長は正午前に報告書を修正させた。"}]},{"id":45,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The printer has been making a strange noise.","ok":true,"note":"正：継続する動作を表す現在完了進行形。","ja":"そのプリンターは変な音を出し続けている。"},{"en":"She has been worked here for a decade.","ok":false,"note":"has been worked -&gt; has been working：能動の意味なので進行形。","ja":"彼女は10年間ここで働いている。"},{"en":"They have been waiting for the shipment since Monday.","ok":true,"note":"正：現在完了進行形で継続中の動作。","ja":"彼らは月曜日から出荷を待ち続けている。"},{"en":"We have been knowing each other for years.","ok":false,"note":"have been knowing -&gt; have known：状態動詞は完了進行形にしない。","ja":"私たちは何年も前から知り合いだ。"}]},{"id":46,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"There are several options available.","ok":true,"note":"正：後ろの名詞が複数なので are。","ja":"いくつかの選択肢が利用できる。"},{"en":"There has been many complaints this month.","ok":false,"note":"has -&gt; have：complaints は複数。","ja":"今月は多くの苦情が寄せられている。"},{"en":"There were a delay in the delivery.","ok":false,"note":"were -&gt; was：a delay は単数。","ja":"配送に遅れが生じた。"},{"en":"There is a meeting scheduled for Friday.","ok":true,"note":"正：後ろの名詞が単数なので is。","ja":"金曜日に予定されている会議がある。"}]},{"id":47,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"By 2020, the plant had produce one million units.","ok":false,"note":"had produce -&gt; had produced：完了形は過去分詞。","ja":"2020年までに、その工場は100万台を生産していた。"},{"en":"By the end of May, we will completed the survey.","ok":false,"note":"will completed -&gt; will have completed：未来完了の形。","ja":"5月末までに、私たちは調査を終えているだろう。"},{"en":"The renovation will have finished by the time you return.","ok":true,"note":"正：未来完了 + 時の副詞節（現在形）。","ja":"あなたが戻るころには改装は終わっているだろう。"},{"en":"By next June, the team will have completed the audit.","ok":true,"note":"正：未来のある時点までの完了は未来完了。","ja":"来年の6月までに、チームは監査を完了しているだろう。"}]},{"id":48,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The equipment has been inspected twice this year.","ok":true,"note":"正：現在完了の受動態。","ja":"その機器は今年2回点検されている。"},{"en":"The building has been renovate recently.","ok":false,"note":"renovate -&gt; renovated：been の後ろは過去分詞。","ja":"その建物は最近改装された。"},{"en":"The documents had been filed before the audit began.","ok":true,"note":"正：過去完了の受動態。","ja":"監査が始まる前に書類は整理されていた。"},{"en":"The keys had been leave on the desk.","ok":false,"note":"leave -&gt; left：受動態は過去分詞。","ja":"鍵は机の上に置かれていた。"}]},{"id":49,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Both the CEO and the CFO was present.","ok":false,"note":"was -&gt; were：both A and B は複数扱い。","ja":"CEOとCFOの両方が出席していた。"},{"en":"Either the director or the supervisor is attending.","ok":true,"note":"正：近い方の主語 supervisor は単数。","ja":"部長か監督者のどちらかが出席する。"},{"en":"Not only the staff but also the manager were informed.","ok":false,"note":"were -&gt; was：動詞に近い manager が単数。","ja":"スタッフだけでなく部長にも知らされていた。"},{"en":"Neither the manager nor the assistants are available.","ok":true,"note":"正：nor の場合、動詞は近い方の主語に一致。","ja":"部長も助手たちも手が空いていない。"}]},{"id":50,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Sales have raised by five percent.","ok":false,"note":"have raised -&gt; have risen：目的語がないので自動詞 rise。","ja":"売上は5パーセント伸びた。"},{"en":"The manager rose the issue at the meeting.","ok":false,"note":"rose -&gt; raised：目的語があるので他動詞 raise。","ja":"部長は会議でその問題を提起した。"},{"en":"The company raised its prices last month.","ok":true,"note":"正：raise は他動詞で目的語をとる。","ja":"同社は先月、価格を引き上げた。"},{"en":"The prices have risen sharply this quarter.","ok":true,"note":"正：rise は自動詞（rise-rose-risen）。","ja":"今四半期、価格は急激に上昇した。"}]},{"id":51,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Please explain the procedure to the new staff.","ok":true,"note":"正：explain は explain A to B の型。","ja":"新入社員にその手順を説明してください。"},{"en":"She explained me the new system.","ok":false,"note":"explained me -&gt; explained to me：explain は二重目的語をとらない。","ja":"彼女は私に新しいシステムを説明した。"},{"en":"They discussed about the budget for an hour.","ok":false,"note":"discussed about -&gt; discussed：discuss は他動詞なので前置詞不要。","ja":"彼らは1時間その予算について議論した。"},{"en":"The company provided employees with new laptops.","ok":true,"note":"正：provide A with B の型。","ja":"会社は従業員に新しいノートパソコンを支給した。"}]},{"id":52,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The conference is going to be held in Osaka.","ok":true,"note":"正：be going to + 受動態。","ja":"その会議は大阪で開催される予定だ。"},{"en":"The seminar is take place next Tuesday.","ok":false,"note":"is take -&gt; takes：be 動詞と原形は並べられない。","ja":"そのセミナーは来週の火曜日に開かれる。"},{"en":"I will be send you the file this afternoon.","ok":false,"note":"will be send -&gt; will send：will の後ろは原形。","ja":"今日の午後、ファイルをお送りします。"},{"en":"The flight leaves at seven tomorrow morning.","ok":true,"note":"正：確定した予定は現在形で表せる。","ja":"その便は明日の朝7時に出発する。"}]},{"id":53,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"He must have forgotten the appointment.","ok":true,"note":"正：過去の推量は must have + 過去分詞。","ja":"彼は約束を忘れていたに違いない。"},{"en":"She could have went to the wrong office.","ok":false,"note":"went -&gt; gone：助動詞 + have の後ろは過去分詞。","ja":"彼女は間違ったオフィスに行ってしまったのかもしれない。"},{"en":"They might have been finish the work already.","ok":false,"note":"been finish -&gt; finished：might have finished とする。","ja":"彼らはすでに作業を終えているかもしれない。"},{"en":"The shipment should have arrived by now.","ok":true,"note":"正：should have + 過去分詞。","ja":"出荷は今ごろ到着しているはずだ。"}]},{"id":54,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The manager insisted that the report is completed today.","ok":false,"note":"is -&gt; be：insist の that 節は原形。","ja":"部長は報告書を今日中に仕上げるよう強く求めた。"},{"en":"The board recommended that the policy be revised.","ok":true,"note":"正：提案を表す動詞の that 節は原形（仮定法現在）。","ja":"取締役会はその方針を改訂するよう勧告した。"},{"en":"It is essential that every employee submit the form.","ok":true,"note":"正：essential の that 節は原形。","ja":"全従業員がその用紙を提出することが不可欠だ。"},{"en":"We suggest that he attends the training.","ok":false,"note":"attends -&gt; attend：suggest の that 節は原形。","ja":"彼が研修に参加することを提案します。"}]},{"id":55,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Reviewing the contracts take several hours.","ok":false,"note":"take -&gt; takes：動名詞主語は単数扱い。","ja":"契約書の確認には数時間かかる。"},{"en":"Whether the plan works depend on funding.","ok":false,"note":"depend -&gt; depends：名詞節主語は単数扱い。","ja":"その計画がうまくいくかどうかは資金次第だ。"},{"en":"Managing multiple projects requires strong planning.","ok":true,"note":"正：動名詞主語は単数扱い。","ja":"複数のプロジェクトを管理するには強い計画性が必要だ。"},{"en":"What the clients want is faster delivery.","ok":true,"note":"正：名詞節主語は単数扱い。","ja":"顧客が求めているのはより速い配送だ。"}]},{"id":56,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The committee has chosen a new chairperson.","ok":true,"note":"正：choose-chose-chosen。","ja":"委員会は新しい委員長を選出した。"},{"en":"The files were kept in the archive room.","ok":true,"note":"正：keep-kept-kept の受動態。","ja":"そのファイルは書庫に保管されていた。"},{"en":"The report was wrote by two analysts.","ok":false,"note":"wrote -&gt; written：受動態は過去分詞。","ja":"その報告書は2人の分析担当者によって書かれた。"},{"en":"The invoice has already been sended.","ok":false,"note":"sended -&gt; sent：send は不規則変化。","ja":"請求書はすでに送付済みだ。"}]},{"id":57,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"The accident occurred near the loading dock.","ok":true,"note":"正：occur は自動詞で能動のまま。","ja":"その事故は搬入口の近くで起きた。"},{"en":"The meeting was consisted of five members.","ok":false,"note":"was consisted -&gt; consisted：consist of は受動態にしない。","ja":"その会議は5名で構成されていた。"},{"en":"The prices have remained stable this year.","ok":true,"note":"正：remain は自動詞。","ja":"今年、価格は安定したままだ。"},{"en":"The problem was happened during the test.","ok":false,"note":"was happened -&gt; happened：happen は受動態にできない。","ja":"その問題は試験中に発生した。"}]},{"id":58,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"When the manager will arrive, we will begin.","ok":false,"note":"will arrive -&gt; arrives：時の副詞節では未来を現在形で表す。","ja":"部長が到着したら始めます。"},{"en":"While we waited, the technician was fix the printer.","ok":false,"note":"was fix -&gt; was fixing：進行形は be + 現在分詞。","ja":"私たちが待っている間、技術者はプリンターを修理していた。"},{"en":"While she was reviewing the data, the power went out.","ok":true,"note":"正：進行中の動作は過去進行形。","ja":"彼女がデータを確認している間に停電した。"},{"en":"When the alarm sounded, everyone left the building.","ok":true,"note":"正：過去の出来事の連続。","ja":"警報が鳴ったとき、全員が建物から出た。"}]},{"id":59,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"She works here since last April.","ok":false,"note":"works -&gt; has worked：since があるので現在完了。","ja":"彼女は昨年4月からここで働いている。"},{"en":"It has been three months since the launch.","ok":true,"note":"正：It has been ... since の定型。","ja":"発売から3か月が経つ。"},{"en":"They have joined the company for five years.","ok":false,"note":"have joined -&gt; have worked at：join は瞬間的動作なので継続期間と合わない。","ja":"彼らは5年間その会社に勤めている。"},{"en":"The branch has been closed for two weeks.","ok":true,"note":"正：状態の継続を表す現在完了。","ja":"その支店は2週間閉鎖されている。"}]},{"id":60,"part":3,"cat":"動詞","theme":"動詞の形・時制・態・主述一致","items":[{"en":"Most of the equipment is stored in the warehouse.","ok":true,"note":"正：equipment は不可算なので単数扱い。","ja":"機器の大半は倉庫に保管されている。"},{"en":"Two thirds of the budget have been spent.","ok":false,"note":"have -&gt; has：budget は単数。","ja":"予算の3分の2がすでに使われた。"},{"en":"All of the information were confidential.","ok":false,"note":"were -&gt; was：information は不可算名詞。","ja":"その情報はすべて機密だった。"},{"en":"Half of the participants were from overseas.","ok":true,"note":"正：of の後ろが複数なので複数扱い。","ja":"参加者の半数は海外からだった。"}]},{"id":61,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Despite the flight was delayed, we arrived on time.","ok":false,"note":"Despite -&gt; Although：後ろが節なので接続詞。","ja":"便が遅れたにもかかわらず、私たちは時間どおり到着した。"},{"en":"Despite the heavy rain, the ceremony took place.","ok":true,"note":"正：Despite は前置詞で後ろに名詞句。","ja":"大雨にもかかわらず、式典は行われた。"},{"en":"Although the traffic, we reached the venue early.","ok":false,"note":"Although -&gt; Despite：後ろが名詞句なので前置詞。","ja":"渋滞にもかかわらず、私たちは早めに会場に着いた。"},{"en":"Although the weather was poor, the event continued.","ok":true,"note":"正：Although は接続詞で後ろに節。","ja":"天候は悪かったが、そのイベントは続行された。"}]},{"id":62,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"We left early because the road was closed.","ok":true,"note":"正：because + 節。","ja":"道路が閉鎖されていたので、私たちは早めに出た。"},{"en":"The delay occurred because of the machine broke down.","ok":false,"note":"because of -&gt; because：後ろが節。","ja":"機械が故障したため、遅延が生じた。"},{"en":"The event was canceled because of the storm.","ok":true,"note":"正：because of + 名詞句。","ja":"嵐のため、そのイベントは中止された。"},{"en":"Sales fell because the economic downturn.","ok":false,"note":"because -&gt; because of：後ろが名詞句。","ja":"景気後退のため、売上が落ちた。"}]},{"id":63,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"While the manager was speaking, the phone rang.","ok":true,"note":"正：While は接続詞。","ja":"部長が話している間、電話が鳴った。"},{"en":"During the presentation, the projector failed.","ok":true,"note":"正：During は前置詞。","ja":"プレゼンテーションの最中、プロジェクターが故障した。"},{"en":"During the manager was speaking, no one interrupted.","ok":false,"note":"During -&gt; While：後ろが節なので接続詞。","ja":"部長が話している間、誰も口を挟まなかった。"},{"en":"While the renovation, the office will be closed.","ok":false,"note":"While -&gt; During：後ろが名詞句なので前置詞。","ja":"改装期間中、そのオフィスは閉鎖される。"}]},{"id":64,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The company which employees are highly trained is hiring.","ok":false,"note":"which -&gt; whose：所有関係を表すので所有格。","ja":"従業員が高度に訓練されているその会社は人材を募集している。"},{"en":"The employee who submitted the form was promoted.","ok":true,"note":"正：人が先行詞の主格 who。","ja":"その用紙を提出した従業員が昇進した。"},{"en":"The client whose is waiting in the lobby called.","ok":false,"note":"whose -&gt; who：直後が動詞なので主格。","ja":"ロビーで待っている顧客から電話があった。"},{"en":"The report which arrived yesterday needs revision.","ok":true,"note":"正：物が先行詞の主格 which。","ja":"昨日届いた報告書は修正が必要だ。"}]},{"id":65,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"That is the reason why we changed suppliers.","ok":true,"note":"正：理由を表す関係副詞 why。","ja":"それが供給業者を変更した理由だ。"},{"en":"This is the office where the meeting will be held.","ok":true,"note":"正：場所を表す関係副詞 where。","ja":"ここが会議が開かれるオフィスだ。"},{"en":"This is the room which the equipment is stored.","ok":false,"note":"which -&gt; where：後ろが完全な文なので関係副詞。","ja":"ここが機器を保管している部屋だ。"},{"en":"I remember the day when the branch opened.","ok":true,"note":"正：時を表す関係副詞 when。","ja":"その支店が開店した日を覚えている。"}]},{"id":66,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Even though the budget was small, the project succeeded.","ok":true,"note":"正：even though + 節。","ja":"予算は少なかったが、そのプロジェクトは成功した。"},{"en":"Even though the delay, the goods arrived intact.","ok":false,"note":"Even though -&gt; In spite of：後ろが名詞句。","ja":"遅延にもかかわらず、商品は無傷で到着した。"},{"en":"In spite of the budget was small, we succeeded.","ok":false,"note":"In spite of -&gt; Even though：後ろが節。","ja":"予算は少なかったが、私たちは成功した。"},{"en":"In spite of the delay, the goods arrived intact.","ok":true,"note":"正：in spite of + 名詞句。","ja":"遅延にもかかわらず、商品は無傷で到着した。"}]},{"id":67,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The box was such heavy that two people carried it.","ok":false,"note":"such -&gt; so：後ろが形容詞単独なので so。","ja":"その箱はとても重かったので、2人で運んだ。"},{"en":"It was so long meeting that we skipped lunch.","ok":false,"note":"so -&gt; such：後ろに名詞があるので such。","ja":"とても長い会議だったので、私たちは昼食を抜いた。"},{"en":"It was such a long meeting that we skipped lunch.","ok":true,"note":"正：such + a + 形容詞 + 名詞 + that。","ja":"とても長い会議だったので、私たちは昼食を抜いた。"},{"en":"The instructions were clear so that everyone understood.","ok":true,"note":"正：so that + 節で結果や目的。","ja":"指示は明確だったので、全員が理解した。"}]},{"id":68,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Whether or not the plan works, we will continue.","ok":true,"note":"正：whether or not は譲歩の副詞節を作れる。","ja":"その計画がうまくいくかどうかにかかわらず、私たちは続ける。"},{"en":"The question is if we should expand.","ok":false,"note":"if -&gt; whether：be 動詞の補語になる名詞節に if は使えない。","ja":"問題は事業を拡大すべきかどうかだ。"},{"en":"We are not sure whether the parts will arrive today.","ok":true,"note":"正：不確実さを表す whether 節。","ja":"部品が今日届くかどうかは分からない。"},{"en":"Please let us know whether you can attend.","ok":true,"note":"正：「～かどうか」の名詞節。","ja":"出席できるかどうかをお知らせください。"}]},{"id":69,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The building, which was built in 1990, is being renovated.","ok":true,"note":"正：非制限用法は which。","ja":"その建物は1990年に建てられたが、現在改装中だ。"},{"en":"The proposal that the committee approved is final.","ok":true,"note":"正：制限用法の目的格 that。","ja":"委員会が承認したその提案が最終案だ。"},{"en":"The building, that was built in 1990, is closed.","ok":false,"note":"that -&gt; which：コンマ付きの非制限用法に that は使えない。","ja":"その建物は1990年に建てられたが、現在は閉鎖されている。"},{"en":"The manager who&#x27;s office is upstairs is out.","ok":false,"note":"who&#x27;s -&gt; whose：所有格は whose。","ja":"執務室が上の階にある部長は外出中だ。"}]},{"id":70,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The office will be closed until Monday.","ok":true,"note":"正：until は継続の終点（～まで）。","ja":"そのオフィスは月曜日まで閉まっている。"},{"en":"The store stays open by nine o&#x27;clock.","ok":false,"note":"by -&gt; until：状態の継続なので until。","ja":"その店は9時まで開いている。"},{"en":"Please submit the form by Friday.","ok":true,"note":"正：by は期限（～までに）。","ja":"金曜日までにその用紙を提出してください。"},{"en":"We must finish the report until noon.","ok":false,"note":"until -&gt; by：完了の期限なので by。","ja":"正午までに報告書を仕上げなければならない。"}]},{"id":71,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The costs increased, but profits remained stable.","ok":true,"note":"正：等位接続詞 but。","ja":"費用は増加したが、利益は安定していた。"},{"en":"Therefore the sales rose, the team celebrated.","ok":false,"note":"Therefore -&gt; Because：節をつなぐには接続詞が必要。","ja":"売上が伸びたので、チームは祝った。"},{"en":"The costs increased; however, profits remained stable.","ok":true,"note":"正：セミコロン + 接続副詞。","ja":"費用は増加したが、利益は安定していた。"},{"en":"The costs increased, however profits remained stable.","ok":false,"note":"however -&gt; but：however は副詞なので節同士を接続できない。","ja":"費用は増加したが、利益は安定していた。"}]},{"id":72,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The device works like it was designed to.","ok":false,"note":"like -&gt; as：後ろが節なので接続詞 as。","ja":"その装置は設計どおりに動く。"},{"en":"He works as an engineer.","ok":true,"note":"正：as は「～として」の前置詞。","ja":"彼は技術者として働いている。"},{"en":"The new model looks like the previous one.","ok":true,"note":"正：like + 名詞句。","ja":"その新型モデルは前のモデルに似ている。"},{"en":"Please complete the form as instructed.","ok":true,"note":"正：as は接続詞として節や分詞句を導ける。","ja":"指示どおりに用紙を記入してください。"}]},{"id":73,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Unless you don&#x27;t register, you cannot attend.","ok":false,"note":"don&#x27;t register -&gt; register：unless 自体が否定を含むので二重否定になる。","ja":"登録しない限り、参加できません。"},{"en":"The event will proceed unless it will rain.","ok":false,"note":"will rain -&gt; rains：条件の副詞節は現在形。","ja":"雨が降らない限り、そのイベントは実施される。"},{"en":"Unless you register today, you cannot attend.","ok":true,"note":"正：unless は「～でない限り」。","ja":"今日登録しない限り、参加できません。"},{"en":"You cannot enter unless you have a badge.","ok":true,"note":"正：unless 節は肯定形。","ja":"バッジがなければ入場できません。"}]},{"id":74,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The supplier with who we work is reliable.","ok":false,"note":"who -&gt; whom：前置詞の直後は目的格。","ja":"私たちが取引しているその供給業者は信頼できる。"},{"en":"The supplier with whom we signed a contract is reliable.","ok":true,"note":"正：前置詞 + whom。","ja":"私たちが契約を結んだその供給業者は信頼できる。"},{"en":"The topic about which she spoke was complex.","ok":true,"note":"正：前置詞 + which。","ja":"彼女が話した話題は複雑だった。"},{"en":"The colleague that I rely is on leave.","ok":false,"note":"rely -&gt; rely on：rely on の on が欠けている。","ja":"私が頼りにしている同僚は休暇中だ。"}]},{"id":75,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"You can pay either by card or in cash.","ok":true,"note":"正：either A or B。","ja":"カードか現金のどちらかで支払えます。"},{"en":"The plan is both efficient as well as affordable.","ok":false,"note":"as well as -&gt; and：both と対応するのは and。","ja":"その計画は効率的でありながら手ごろでもある。"},{"en":"The seminar covers both marketing and finance.","ok":true,"note":"正：both A and B。","ja":"そのセミナーはマーケティングと財務の両方を扱う。"},{"en":"Neither the copier or the printer is working.","ok":false,"note":"or -&gt; nor：neither と対応するのは nor。","ja":"コピー機もプリンターも動いていない。"}]},{"id":76,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The survey was popular among younger customers.","ok":true,"note":"正：3 者以上の集団には among。","ja":"その調査は若い顧客の間で人気があった。"},{"en":"Cooperation between all the members is essential.","ok":false,"note":"between -&gt; among：不特定多数の集団には among。","ja":"メンバー全員の協力が不可欠だ。"},{"en":"The prize was shared among the two winners.","ok":false,"note":"among -&gt; between：2 者間なので between。","ja":"賞金は2人の受賞者で分けられた。"},{"en":"The budget was divided between the two departments.","ok":true,"note":"正：2 者間は between。","ja":"予算は2つの部署の間で分けられた。"}]},{"id":77,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"What the manager suggested was reasonable.","ok":true,"note":"正：先行詞を含む関係代名詞 what。","ja":"部長が提案したことは妥当だった。"},{"en":"We believe what the deadline is realistic.","ok":false,"note":"what -&gt; that：後ろが完全な文なので that。","ja":"締め切りは現実的だと私たちは考えている。"},{"en":"We believe that the deadline is realistic.","ok":true,"note":"正：完全な文を導く接続詞 that。","ja":"締め切りは現実的だと私たちは考えている。"},{"en":"That the manager suggested was reasonable.","ok":false,"note":"That -&gt; What：後ろが目的語の欠けた不完全文なので what。","ja":"部長が提案したことは妥当だった。"}]},{"id":78,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Owing to the workers went on strike, deliveries stopped.","ok":false,"note":"Owing to -&gt; Because：後ろが節。","ja":"労働者がストライキをしたため、配送が止まった。"},{"en":"Thanks to your support, the campaign succeeded.","ok":true,"note":"正：thanks to + 名詞句。","ja":"ご支援のおかげで、そのキャンペーンは成功した。"},{"en":"Owing to the strike, deliveries were delayed.","ok":true,"note":"正：owing to + 名詞句。","ja":"ストライキのため、配送が遅れた。"},{"en":"Thanks to the team worked overtime, we met the deadline.","ok":false,"note":"Thanks to -&gt; Because：後ろが節なので接続詞。","ja":"チームが残業したおかげで、締め切りに間に合った。"}]},{"id":79,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"She is one of the employees who work in Osaka.","ok":true,"note":"正：先行詞は複数の employees。","ja":"彼女は大阪で働く従業員の一人だ。"},{"en":"The candidates, who they applied online, were shortlisted.","ok":false,"note":"who they -&gt; who：関係代名詞が主語なので they は不要。","ja":"オンラインで応募した候補者たちが選考を通過した。"},{"en":"Mr. Sato, who joined last year, leads the team.","ok":true,"note":"正：人を補足説明する非制限用法。","ja":"昨年入社した佐藤氏がそのチームを率いている。"},{"en":"The files which is on the desk belong to Ms. Kim.","ok":false,"note":"is -&gt; are：先行詞 files は複数。","ja":"机の上にあるファイルはキムさんのものだ。"}]},{"id":80,"part":4,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Whereas the delay, the project finished on time.","ok":false,"note":"Whereas -&gt; Despite：後ろが名詞句なので前置詞。","ja":"遅延があったにもかかわらず、プロジェクトは予定どおり終わった。"},{"en":"In contrast the previous model, this one is lighter.","ok":false,"note":"In contrast -&gt; Unlike：名詞句を導くには前置詞が必要。","ja":"前のモデルと違って、こちらの方が軽い。"},{"en":"While the design is simple, the mechanism is complex.","ok":true,"note":"正：while は対比も表す。","ja":"デザインは単純だが、仕組みは複雑だ。"},{"en":"Sales rose in Asia, whereas they fell in Europe.","ok":true,"note":"正：対比を表す接続詞 whereas。","ja":"アジアでは売上が伸びたが、欧州では落ち込んだ。"}]},{"id":81,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"In the event of a power failure, use the stairs.","ok":true,"note":"正：in the event of + 名詞句。","ja":"停電の際は階段をご利用ください。"},{"en":"Take an umbrella in case it rains.","ok":true,"note":"正：in case + 節。","ja":"雨が降るといけないので傘を持って行きなさい。"},{"en":"In the event that the system fails, call support.","ok":true,"note":"正：in the event that + 節。","ja":"システムに障害が起きた場合はサポートへご連絡ください。"},{"en":"In case of the alarm sounds, leave the building.","ok":false,"note":"In case of -&gt; In case：後ろが節なので of は不要。","ja":"警報が鳴った場合は建物から出てください。"}]},{"id":82,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"We have known each other during ten years.","ok":false,"note":"during -&gt; for：期間の長さには for。","ja":"私たちは10年来の知り合いだ。"},{"en":"The office has been closed for three days.","ok":true,"note":"正：for + 期間の長さ。","ja":"そのオフィスは3日間閉まっている。"},{"en":"The manager has been away since Tuesday.","ok":true,"note":"正：since + 起点。","ja":"部長は火曜日から不在だ。"},{"en":"The training lasted since two hours.","ok":false,"note":"since -&gt; for：長さを表すので for。","ja":"その研修は2時間続いた。"}]},{"id":83,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The person standing near the entrance is our client.","ok":true,"note":"正：現在分詞の後置修飾。","ja":"入口付近に立っている人が当社の顧客だ。"},{"en":"The employee works in Osaka is retiring.","ok":false,"note":"works -&gt; who works：主格の関係代名詞は省略できない。","ja":"大阪で働いているその従業員は退職する。"},{"en":"The book I ordered arrived this morning.","ok":true,"note":"正：目的格の関係代名詞は省略できる。","ja":"私が注文した本が今朝届いた。"},{"en":"The report was submitted late needs revision.","ok":false,"note":"was submitted -&gt; submitted：関係代名詞と be を省略した分詞形にする。","ja":"遅れて提出された報告書は修正が必要だ。"}]},{"id":84,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"You may use the room as long as you clean it.","ok":true,"note":"正：as long as は条件。","ja":"掃除をしてくれるなら、その部屋を使ってよい。"},{"en":"As far as I know, the deadline has not changed.","ok":true,"note":"正：as far as は範囲・程度。","ja":"私の知る限り、締め切りは変わっていない。"},{"en":"As long as I know, the office is closed.","ok":false,"note":"As long as -&gt; As far as：知識の範囲を表すので as far as。","ja":"私の知る限り、そのオフィスは閉まっている。"},{"en":"As far as you submit the form, you can join.","ok":false,"note":"As far as -&gt; As long as：条件を表すので as long as。","ja":"用紙を提出しさえすれば、参加できる。"}]},{"id":85,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Without your help, we could not have finished.","ok":true,"note":"正：without + 名詞句。","ja":"あなたの助けがなければ、私たちは終えられなかっただろう。"},{"en":"Without the manager approves it, we cannot proceed.","ok":false,"note":"Without -&gt; Unless：後ろが節なので接続詞。","ja":"部長が承認しない限り、進められない。"},{"en":"With the system was upgraded, errors decreased.","ok":false,"note":"With -&gt; After：後ろが節なので接続詞が必要。","ja":"システムが更新された後、エラーが減少した。"},{"en":"With the new software, processing became faster.","ok":true,"note":"正：with + 名詞句。","ja":"新しいソフトウェアによって、処理が速くなった。"}]},{"id":86,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Whomever submits the form first gets a prize.","ok":false,"note":"Whomever -&gt; Whoever：節内で主語の働きをする。","ja":"最初に用紙を提出した人が賞をもらえる。"},{"en":"Whoever submits the form first will receive a discount.","ok":true,"note":"正：節内で主語なので Whoever。","ja":"最初に用紙を提出した人が割引を受けられる。"},{"en":"Whatever you decide, we will support it.","ok":true,"note":"正：複合関係代名詞 Whatever。","ja":"あなたが何を決めても、私たちは支持します。"},{"en":"However you try hard, the deadline is fixed.","ok":false,"note":"However you try hard -&gt; However hard you try：however の直後に形容詞や副詞を置く。","ja":"どんなに努力しても、締め切りは変わらない。"}]},{"id":87,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The role involves planning, to organize, and reporting.","ok":false,"note":"to organize -&gt; organizing：並列は同じ形に揃える。","ja":"その職務には計画、組織化、報告が含まれる。"},{"en":"She is responsible for hiring and training new staff.","ok":true,"note":"正：動名詞同士の並列。","ja":"彼女は新入社員の採用と研修を担当している。"},{"en":"He is both efficient and works quickly.","ok":false,"note":"works quickly -&gt; quick：both A and B は同じ品詞を並べる。","ja":"彼は効率的で仕事が速い。"},{"en":"The job requires patience, accuracy, and creativity.","ok":true,"note":"正：名詞が三つ並列。","ja":"その仕事には忍耐力、正確さ、創造性が必要だ。"}]},{"id":88,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"Please arrive to the airport two hours early.","ok":false,"note":"to -&gt; at：arrive at [in] が正しい。","ja":"2時間前には空港に到着してください。"},{"en":"Our office is on the fifth floor.","ok":true,"note":"正：階数には on。","ja":"当社のオフィスは5階にある。"},{"en":"The conference will be held at the Hilton Hotel.","ok":true,"note":"正：地点を表す at。","ja":"その会議はヒルトンホテルで開催される。"},{"en":"The documents are in the top shelf.","ok":false,"note":"in -&gt; on：棚の上面には on。","ja":"その書類は一番上の棚にある。"}]},{"id":89,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"The city where the plant is located is growing.","ok":true,"note":"正：後ろが完全文なので関係副詞。","ja":"その工場がある都市は成長している。"},{"en":"The factory which the products are made is in Osaka.","ok":false,"note":"which -&gt; where：後ろが完全文なので関係副詞。","ja":"製品が作られているその工場は大阪にある。"},{"en":"The situation where we cannot control is difficult.","ok":false,"note":"where -&gt; which：control の目的語が欠けているので関係代名詞。","ja":"私たちが制御できないその状況は厄介だ。"},{"en":"The city which we visited last year is growing.","ok":true,"note":"正：visited の目的語が欠けているので関係代名詞。","ja":"私たちが昨年訪れたその都市は成長している。"}]},{"id":90,"part":5,"cat":"接続/関係","theme":"接続詞 vs 前置詞・関係詞","items":[{"en":"By the time you arrive, we will have started.","ok":true,"note":"正：by the time + 節。","ja":"あなたが到着するころには、私たちは始めているだろう。"},{"en":"Once the contract is signed, work will begin.","ok":true,"note":"正：once + 節。","ja":"契約が締結され次第、作業が始まる。"},{"en":"Once the signature, the work will begin.","ok":false,"note":"Once -&gt; Upon：後ろが名詞句なので前置詞。","ja":"署名され次第、作業が始まる。"},{"en":"As soon as the confirmation, we will ship the goods.","ok":false,"note":"As soon as -&gt; Upon：後ろが名詞句なので前置詞。","ja":"確認が取れ次第、商品を発送します。"}]},{"id":91,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"She agreed postponing the meeting.","ok":false,"note":"postponing -&gt; to postpone：agree は to 不定詞をとる。","ja":"彼女は会議を延期することに同意した。"},{"en":"The company avoided to make a comment.","ok":false,"note":"to make -&gt; making：avoid は動名詞をとる。","ja":"その会社はコメントを避けた。"},{"en":"We decided to postpone the launch.","ok":true,"note":"正：decide は to 不定詞を目的語にとる。","ja":"私たちは発売を延期することに決めた。"},{"en":"They finished reviewing the contract.","ok":true,"note":"正：finish は動名詞を目的語にとる。","ja":"彼らは契約書の確認を終えた。"}]},{"id":92,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"Remember to lock the door before leaving.","ok":true,"note":"正：これからすることは remember to do。","ja":"出かける前にドアの施錠を忘れないでください。"},{"en":"I regret to inform you that the position is filled.","ok":true,"note":"正：これから伝えることは regret to do。","ja":"残念ながらその職は埋まったことをお伝えします。"},{"en":"Please remember locking the door tomorrow.","ok":false,"note":"locking -&gt; to lock：未来の行為なので to 不定詞。","ja":"明日はドアの施錠を忘れないでください。"},{"en":"We regret informing you that the event is canceled.","ok":false,"note":"informing -&gt; to inform：これから知らせる内容なので to 不定詞。","ja":"残念ながらそのイベントは中止となったことをお伝えします。"}]},{"id":93,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"Having completed the audit, the team submitted the report.","ok":true,"note":"正：完了分詞構文で主語が一致。","ja":"監査を終えて、チームは報告書を提出した。"},{"en":"Located near the station, the hotel is convenient.","ok":true,"note":"正：受動の分詞構文。","ja":"駅の近くに位置しているので、そのホテルは便利だ。"},{"en":"Written in simple English, everyone can read the manual.","ok":false,"note":"Written -&gt; Because it is written：分詞の意味上の主語が主節主語と一致していない。","ja":"平易な英語で書かれているので、誰でもそのマニュアルを読める。"},{"en":"Comparing to last year, sales have doubled.","ok":false,"note":"Comparing -&gt; Compared：比較される側なので過去分詞。","ja":"昨年と比べて、売上は倍増した。"}]},{"id":94,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"If I would have more time, I would revise it.","ok":false,"note":"would have -&gt; had：if 節に would は置かない。","ja":"もっと時間があれば、書き直すのに。"},{"en":"If I had more time, I would revise the proposal.","ok":true,"note":"正：仮定法過去は if 節が過去形。","ja":"もっと時間があれば、その提案書を書き直すのに。"},{"en":"If the machine was faster, we will finish sooner.","ok":false,"note":"will -&gt; would：仮定法過去の主節は would + 原形。","ja":"その機械がもっと速ければ、早く終わるのに。"},{"en":"If the budget were larger, we could hire more staff.","ok":true,"note":"正：仮定法の be 動詞は were。","ja":"予算がもっと多ければ、人員を増やせるのに。"}]},{"id":95,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"If we had left earlier, we would have caught the train.","ok":true,"note":"正：仮定法過去完了。","ja":"もっと早く出ていれば、電車に間に合っただろう。"},{"en":"If we would have left earlier, we would have caught it.","ok":false,"note":"would have left -&gt; had left：if 節は過去完了形。","ja":"もっと早く出ていれば、間に合っただろう。"},{"en":"If she had known, she would intervene at that time.","ok":false,"note":"would intervene -&gt; would have intervened：過去の反実仮想なので完了形。","ja":"彼女が知っていたら、そのとき介入していただろう。"},{"en":"Had the manager known, she would have intervened.","ok":true,"note":"正：if の省略による倒置。","ja":"部長が知っていたら、介入していただろう。"}]},{"id":96,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"The report is more longer than expected.","ok":false,"note":"more longer -&gt; longer：比較級を二重にしない。","ja":"その報告書は予想より長い。"},{"en":"Sales are higher this year as last year.","ok":false,"note":"as -&gt; than：比較級と対応するのは than。","ja":"今年の売上は昨年より高い。"},{"en":"The new office is much larger than the old one.","ok":true,"note":"正：比較級の強調は much。","ja":"新しいオフィスは以前のものよりずっと広い。"},{"en":"This model is more efficient than the previous one.","ok":true,"note":"正：三音節以上は more をつける。","ja":"このモデルは前のモデルより効率的だ。"}]},{"id":97,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"This is the most reliable supplier we have used.","ok":true,"note":"正：最上級 the most + 形容詞。","ja":"これは当社が使った中で最も信頼できる供給業者だ。"},{"en":"She is the best qualified candidate on the list.","ok":true,"note":"正：best が qualified を修飾する最上級。","ja":"彼女は名簿の中で最も適格な候補者だ。"},{"en":"This is the most cheapest option available.","ok":false,"note":"most cheapest -&gt; cheapest：最上級を二重にしない。","ja":"これは入手できる中で最も安い選択肢だ。"},{"en":"Of the three plans, this one is the better.","ok":false,"note":"better -&gt; best：三つ以上の比較は最上級。","ja":"3つの案のうち、これが最良だ。"}]},{"id":98,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"He works as harder as his colleagues.","ok":false,"note":"as harder as -&gt; as hard as：原級で挟む。","ja":"彼は同僚と同じくらい熱心に働く。"},{"en":"The device is as more efficient as the previous model.","ok":false,"note":"as more efficient as -&gt; as efficient as：as ... as の間は原級。","ja":"その装置は前のモデルと同じくらい効率的だ。"},{"en":"The new printer is as fast as the old one.","ok":true,"note":"正：as + 原級 + as。","ja":"新しいプリンターは古いものと同じくらい速い。"},{"en":"Please respond as soon as possible.","ok":true,"note":"正：as ... as possible の定型。","ja":"できるだけ早くご返信ください。"}]},{"id":99,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"She went to the warehouse to check the inventory.","ok":true,"note":"正：目的を表す副詞用法。","ja":"彼女は在庫を確認しに倉庫へ行った。"},{"en":"We have a lot of work to do this week.","ok":true,"note":"正：不定詞の形容詞用法。","ja":"今週はやるべき仕事がたくさんある。"},{"en":"The manager is too busy to attending the meeting.","ok":false,"note":"attending -&gt; attend：too ... to do は原形。","ja":"部長は忙しすぎて会議に出られない。"},{"en":"The instructions are enough clear to follow.","ok":false,"note":"enough clear -&gt; clear enough：enough は形容詞の後ろ。","ja":"その指示は理解できるほど十分に明確だ。"}]},{"id":100,"part":5,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"This model is very cheaper than that one.","ok":false,"note":"very -&gt; much：比較級の強調に very は使えない。","ja":"このモデルはあちらよりずっと安い。"},{"en":"The new plant produces twice as many units as the old one.","ok":true,"note":"正：倍数 + as ... as。","ja":"新しい工場は旧工場の2倍の台数を生産する。"},{"en":"Revenue is three times higher than last year.","ok":true,"note":"正：倍数 + 比較級 + than。","ja":"収益は昨年の3倍だ。"},{"en":"The room is twice as larger as the other.","ok":false,"note":"as larger as -&gt; as large as：as ... as の間は原級。","ja":"その部屋はもう一方の2倍の広さだ。"}]},{"id":101,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"We appreciate your attending the ceremony.","ok":true,"note":"正：動名詞の意味上の主語は所有格。","ja":"式典へのご出席に感謝いたします。"},{"en":"We appreciate you to attend the ceremony.","ok":false,"note":"to attend -&gt; attending：appreciate は動名詞をとる。","ja":"式典へのご出席に感謝いたします。"},{"en":"He admitted to make an error.","ok":false,"note":"to make -&gt; making：admit は動名詞をとる。","ja":"彼はミスをしたことを認めた。"},{"en":"She denied having seen the document.","ok":true,"note":"正：完了動名詞で主節より前の内容。","ja":"彼女はその書類を見たことを否定した。"}]},{"id":102,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"It is important to submit the form on time.","ok":true,"note":"正：形式主語 It + to 不定詞。","ja":"期限どおりに用紙を提出することが重要だ。"},{"en":"It was kind of you to help us.","ok":true,"note":"正：人の性質を表す形容詞は of + 人。","ja":"手伝ってくださって親切でした。"},{"en":"It is important of the manager to be informed.","ok":false,"note":"of -&gt; for：性質を表さない形容詞では for + 人。","ja":"部長に知らせておくことが重要だ。"},{"en":"To submitting the form early is recommended.","ok":false,"note":"To submitting -&gt; Submitting：to の後ろは原形。","ja":"早めに用紙を提出することが推奨される。"}]},{"id":103,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"She was heard to complaining about the noise.","ok":false,"note":"to complaining -&gt; complain：to 不定詞なら原形にする。","ja":"彼女が騒音について不平を言うのが聞こえた。"},{"en":"The staff were made to work overtime.","ok":true,"note":"正：使役の受動態では to 不定詞が現れる。","ja":"スタッフは残業させられた。"},{"en":"The staff were made work overtime.","ok":false,"note":"work -&gt; to work：受動態では to が必要。","ja":"スタッフは残業させられた。"},{"en":"He was seen entering the building.","ok":true,"note":"正：知覚動詞の受動態 + 現在分詞。","ja":"彼が建物に入るのが目撃された。"}]},{"id":104,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"The employees attending the seminar must register.","ok":true,"note":"正：能動関係の現在分詞。","ja":"そのセミナーに出席する従業員は登録が必要だ。"},{"en":"The documents attached to the email are confidential.","ok":true,"note":"正：受動の意味なので過去分詞。","ja":"メールに添付された書類は機密です。"},{"en":"The man interviewing the candidates is our director.","ok":true,"note":"正：能動の意味なので現在分詞。","ja":"候補者の面接をしている男性が当社の役員だ。"},{"en":"The results announcing yesterday were positive.","ok":false,"note":"announcing -&gt; announced：results は発表される側。","ja":"昨日発表された結果は良好だった。"}]},{"id":105,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"I wish I have more time yesterday.","ok":false,"note":"have -&gt; had had：過去についての願望は過去完了。","ja":"昨日もっと時間があればよかったのに。"},{"en":"I wish I had more experience in marketing.","ok":true,"note":"正：現在の願望は wish + 過去形。","ja":"マーケティングの経験がもっとあればよいのに。"},{"en":"He talks as if he were the manager.","ok":true,"note":"正：as if + 仮定法過去。","ja":"彼はまるで自分が部長であるかのように話す。"},{"en":"He speaks as if he was knowing the answer.","ok":false,"note":"was knowing -&gt; knew：状態動詞は進行形にしない。","ja":"彼はまるで答えを知っているかのように話す。"}]},{"id":106,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"More we practice, the better we become.","ok":false,"note":"More -&gt; The more：前半にも the が必要。","ja":"練習すればするほど、上達する。"},{"en":"The sooner we start, the earlier we finish.","ok":true,"note":"正：the + 比較級, the + 比較級。","ja":"早く始めるほど、早く終わる。"},{"en":"The more sooner we start, the better.","ok":false,"note":"more sooner -&gt; sooner：比較級を重ねない。","ja":"早く始めるほどよい。"},{"en":"The more you practice, the better you become.","ok":true,"note":"正：比例を表す構文。","ja":"練習すればするほど、上達する。"}]},{"id":107,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"He seems to have forgotten the appointment.","ok":true,"note":"正：主節より前の内容は完了不定詞。","ja":"彼は約束を忘れてしまったようだ。"},{"en":"He seems to forget the appointment yesterday.","ok":false,"note":"to forget -&gt; to have forgotten：yesterday なので完了不定詞。","ja":"彼は昨日の約束を忘れていたようだ。"},{"en":"She decided not to renew the contract.","ok":true,"note":"正：不定詞の否定は not + to do。","ja":"彼女は契約を更新しないことに決めた。"},{"en":"She decided to not renewing the contract.","ok":false,"note":"to not renewing -&gt; not to renew：否定語は to の前、後ろは原形。","ja":"彼女は契約を更新しないことに決めた。"}]},{"id":108,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"He suggested to change the schedule.","ok":false,"note":"to change -&gt; changing：suggest は動名詞をとる。","ja":"彼は予定の変更を提案した。"},{"en":"We recommend to book the room in advance.","ok":false,"note":"to book -&gt; booking：recommend は動名詞をとる。","ja":"事前に部屋を予約されることをお勧めします。"},{"en":"The company considered relocating its headquarters.","ok":true,"note":"正：consider は動名詞をとる。","ja":"同社は本社の移転を検討した。"},{"en":"They postponed announcing the results.","ok":true,"note":"正：postpone は動名詞をとる。","ja":"彼らは結果の発表を延期した。"}]},{"id":109,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"This branch is larger than any other branch in the region.","ok":true,"note":"正：自分以外と比べるので any other。","ja":"この支店は地域内の他のどの支店よりも大きい。"},{"en":"No other model sells better than this one.","ok":true,"note":"正：no other + 単数名詞。","ja":"このモデルより売れているモデルはない。"},{"en":"This branch is larger than any branch in the region.","ok":false,"note":"any -&gt; any other：自分自身を比較対象に含めてしまう。","ja":"この支店は地域内の他のどの支店よりも大きい。"},{"en":"The population of Tokyo is larger than Osaka.","ok":false,"note":"Osaka -&gt; that of Osaka：人口同士を比較する。","ja":"東京の人口は大阪の人口より多い。"}]},{"id":110,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"Without you had helped, we would have failed.","ok":false,"note":"Without -&gt; If：後ろが節なので接続詞。","ja":"あなたが助けてくれなかったら、失敗していただろう。"},{"en":"But for you did not help, we would have failed.","ok":false,"note":"But for -&gt; If：後ろが節なので接続詞。","ja":"あなたが助けてくれなかったら、失敗していただろう。"},{"en":"Otherwise, the deal would have collapsed.","ok":true,"note":"正：otherwise は仮定の意味を含む副詞。","ja":"さもなければ、その取引は破談になっていただろう。"},{"en":"But for your advice, we would have failed.","ok":true,"note":"正：but for + 名詞句。","ja":"あなたの助言がなかったら、私たちは失敗していただろう。"}]},{"id":111,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"The manager was reluctant to approve the request.","ok":true,"note":"正：be reluctant to do。","ja":"部長はその要請の承認に気が進まなかった。"},{"en":"She is capable to handle multiple projects.","ok":false,"note":"to handle -&gt; of handling：be capable of doing。","ja":"彼女は複数のプロジェクトを扱う能力がある。"},{"en":"We are eager to expand into new markets.","ok":true,"note":"正：be eager to do。","ja":"私たちは新市場への進出を熱望している。"},{"en":"They are used to work long hours.","ok":false,"note":"to work -&gt; to working：be used to の to は前置詞。","ja":"彼らは長時間労働に慣れている。"}]},{"id":112,"part":6,"cat":"準動詞/仮定/比較","theme":"準動詞・仮定法・比較","items":[{"en":"Feeling unwell, he left the office early.","ok":true,"note":"正：理由を表す分詞構文。","ja":"気分が悪かったので、彼は早退した。"},{"en":"Not having received a reply, we sent another email.","ok":true,"note":"正：分詞構文の否定は Not を前に置く。","ja":"返信がなかったので、私たちはもう一度メールを送った。"},{"en":"Don&#x27;t having a car, he takes the train.","ok":false,"note":"Don&#x27;t having -&gt; Not having：分詞構文の否定は not。","ja":"車を持っていないので、彼は電車を使う。"},{"en":"Being finished the report, she went home.","ok":false,"note":"Being finished -&gt; Hav "},{"en":"Please answer to my question.","ok":false,"note":"answer to -&gt; answer：answer は他動詞。","ja":"私の質問に答えてください。"},{"en":"She entered the conference room quietly.","ok":true,"note":"正：enter は他動詞。","ja":"彼女は静かに会議室へ入った。"}]},{"id":192,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"She was aware of the policy had changed.","ok":false,"note":"of -&gt; that：節を導くには that が必要。","ja":"彼女は方針が変更されたことを知っていた。"},{"en":"She was aware that the policy had changed.","ok":true,"note":"正：aware + that 節。","ja":"彼女は方針が変更されたことを知っていた。"},{"en":"We are confident of the project will succeed.","ok":false,"note":"of -&gt; that：後ろが節なので that。","ja":"私たちはそのプロジェクトが成功すると確信している。"},{"en":"We are confident that the project will succeed.","ok":true,"note":"正：形容詞 + that 節。","ja":"私たちはそのプロジェクトが成功すると確信している。"}]},{"id":193,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"The manager as well as the assistants were informed.","ok":false,"note":"were -&gt; was：主語は The manager（単数）。","ja":"助手たちだけでなく部長にも知らされていた。"},{"en":"The role requires not only accuracy but also to work fast.","ok":false,"note":"to work fast -&gt; speed：並列は同じ品詞に揃える。","ja":"その職務には正確さだけでなく速さも求められる。"},{"en":"The manager as well as the assistants was informed.","ok":true,"note":"正：A as well as B では A に動詞を合わせる。","ja":"助手たちだけでなく部長にも知らされていた。"},{"en":"The role requires not only accuracy but also speed.","ok":true,"note":"正：not only A but also B は同じ品詞。","ja":"その職務には正確さだけでなく速さも求められる。"}]},{"id":194,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"We got the technician repair the printer.","ok":false,"note":"repair -&gt; to repair：get は to 不定詞をとる。","ja":"私たちは技術者にプリンターを修理してもらった。"},{"en":"She helped to us prepare the presentation.","ok":false,"note":"helped to us -&gt; helped us：help の目的語に to は不要。","ja":"彼女は私たちがプレゼンの準備をするのを手伝ってくれた。"},{"en":"She helped us prepare the presentation.","ok":true,"note":"正：help + 目的語 + 原形不定詞。","ja":"彼女は私たちがプレゼンの準備をするのを手伝ってくれた。"},{"en":"We got the technician to repair the printer.","ok":true,"note":"正：get + 目的語 + to 不定詞。","ja":"私たちは技術者にプリンターを修理してもらった。"}]},{"id":195,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"No matter how carefully we plan, delays occur.","ok":true,"note":"正：how + 副詞 + 主語 + 動詞。","ja":"どんなに入念に計画しても、遅延は起こる。"},{"en":"Whatever the reason may be, we must respond.","ok":true,"note":"正：複合関係詞の譲歩節は平叙語順。","ja":"理由が何であれ、対応しなければならない。"},{"en":"Whatever may the reason be, we must respond.","ok":false,"note":"may the reason be -&gt; the reason may be：譲歩節では倒置しない。","ja":"理由が何であれ、対応しなければならない。"},{"en":"No matter how careful we plan, delays occur.","ok":false,"note":"careful -&gt; carefully：動詞 plan を修飾するので副詞。","ja":"どんなに入念に計画しても、遅延は起こる。"}]},{"id":196,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"She prefers working from home to commuting.","ok":true,"note":"正：prefer A to B。","ja":"彼女は通勤より在宅勤務を好む。"},{"en":"She prefers working from home than commuting.","ok":false,"note":"than -&gt; to：prefer は to をとる。","ja":"彼女は通勤より在宅勤務を好む。"},{"en":"I would rather to stay late than coming early.","ok":false,"note":"to stay ... coming -&gt; stay ... come：would rather の後ろは原形。","ja":"早出するより残業する方がましだ。"},{"en":"I would rather stay late than come in early.","ok":true,"note":"正：would rather A than B は原形同士。","ja":"早出するより残業する方がましだ。"}]},{"id":197,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"She did not attend, and he did not too.","ok":false,"note":"too -&gt; either：否定文では either。","ja":"彼女は出席せず、彼も出席しなかった。"},{"en":"The first plan failed, and the second one did neither.","ok":false,"note":"did neither -&gt; did too：肯定文の同意なので too。","ja":"最初の案は失敗し、2つ目の案も失敗した。"},{"en":"The first plan failed, and the second one did too.","ok":true,"note":"正：肯定文の同意には too。","ja":"最初の案は失敗し、2つ目の案も失敗した。"},{"en":"She did not attend, and he did not either.","ok":true,"note":"正：否定文の同意には either。","ja":"彼女は出席せず、彼も出席しなかった。"}]},{"id":198,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"We are about starting the presentation.","ok":false,"note":"about starting -&gt; about to start：be about to + 原形。","ja":"私たちはこれからプレゼンを始めるところだ。"},{"en":"We are about to start the presentation.","ok":true,"note":"正：be about to + 原形。","ja":"私たちはこれからプレゼンを始めるところだ。"},{"en":"The delivery is supposed to arrive by noon.","ok":true,"note":"正：be supposed to + 原形。","ja":"配達は正午までに到着することになっている。"},{"en":"The delivery is supposed arrive by noon.","ok":false,"note":"supposed arrive -&gt; supposed to arrive：to が必要。","ja":"配達は正午までに到着することになっている。"}]},{"id":199,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"Leave now, and you will catch the train.","ok":true,"note":"正：命令文 + and は「そうすれば」。","ja":"今出発しなさい、そうすれば電車に間に合う。"},{"en":"Submit the form today, or you will miss the deadline.","ok":true,"note":"正：命令文 + or は「さもないと」。","ja":"今日その用紙を提出しなさい、さもないと締め切りに間に合わない。"},{"en":"To leave now, and you will catch the train.","ok":false,"note":"To leave -&gt; Leave：命令文は動詞の原形で始める。","ja":"今出発しなさい、そうすれば電車に間に合う。"},{"en":"Submit the form today, and you will miss the deadline.","ok":false,"note":"and -&gt; or：否定的な結果が続くので or。","ja":"今日その用紙を提出しなさい、さもないと締め切りに間に合わない。"}]},{"id":200,"part":10,"cat":"構文/語法","theme":"構文・語法","items":[{"en":"Having been notified in advance, the staff were prepared.","ok":true,"note":"正：完了受動の分詞構文。","ja":"事前に通知されていたので、スタッフは備えができていた。"},{"en":"Despite of the short notice, everyone attended.","ok":false,"note":"Despite of -&gt; Despite：despite に of は付かない。","ja":"急な連絡だったにもかかわらず、全員が出席した。"},{"en":"The manager asked that the report is submitted by noon.","ok":false,"note":"is -&gt; be：要求を表す ask の that 節は原形。","ja":"部長は報告書を正午までに提出するよう求めた。"},{"en":"Neither of the two candidates has accepted the offer.","ok":true,"note":"正：neither of は単数扱い。","ja":"2人の候補者のどちらも内定を承諾していない。"}]},{"id":201,"part":11,"cat":"関係詞（前置詞＋関係代名詞）","theme":"関係詞（前置詞＋関係代名詞）","items":[{"en":"The conference room in which we met has been renovated.","ok":true,"note":"正：meet は自動詞で場所を表すには前置詞が要る。in which = where。","ja":"私たちが会合した会議室は改装された。"},{"en":"The conference room which we met has been renovated.","ok":false,"note":"which -&gt; in which（または where）：関係詞節内で met の後に場所を示す前置詞が欠けている。","ja":"私たちが会合した会議室は改装された。"},{"en":"The supplier we relied on has closed its factory.","ok":true,"note":"正：目的格の関係代名詞が省略され、前置詞 on は節末に残る形。","ja":"当社が頼っていた仕入先は工場を閉鎖した。"},{"en":"The supplier on whom we relied on has closed its factory.","ok":false,"note":"on を1つ削除：前置詞＋関係代名詞にした場合、節末に前置詞を重ねてはいけない。","ja":"当社が頼っていた仕入先は工場を閉鎖した。"}],"group":"関係詞"},{"id":202,"part":11,"cat":"関係詞（前置詞＋関係代名詞・whose）","theme":"関係詞（前置詞＋関係代名詞・whose）","items":[{"en":"This is the report for which you asked last week.","ok":true,"note":"正：ask for の for を関係代名詞の前に出した形。","ja":"こちらが先週ご依頼いただいた報告書です。"},{"en":"This is the report which you asked last week.","ok":false,"note":"which -&gt; for which：ask は「〜を求める」の意味では for が必要。","ja":"こちらが先週ご依頼いただいた報告書です。"},{"en":"The building whose roof was damaged is closed to the public.","ok":true,"note":"正：所有関係を示すので whose。物にも使える。","ja":"屋根が損傷した建物は一般公開されていない。"},{"en":"The building which roof was damaged is closed to the public.","ok":false,"note":"which -&gt; whose：後ろに名詞 roof が続くので所有格の関係代名詞にする。","ja":"屋根が損傷した建物は一般公開されていない。"}],"group":"関係詞"},{"id":203,"part":11,"cat":"使役動詞（have / let / make）","theme":"使役動詞（have / let / make）","items":[{"en":"The manager had the technician repair the copier.","ok":true,"note":"正：have + 人 + 動詞の原形。to は付けない。","ja":"部長は技術者にコピー機を修理させた。"},{"en":"The manager had the technician to repair the copier.","ok":false,"note":"to repair -&gt; repair：have を使役で使うとき目的語の後ろは原形。","ja":"部長は技術者にコピー機を修理させた。"},{"en":"We let the visitors use the north parking lot.","ok":true,"note":"正：let + 人 + 原形。allow なら allow ... to use となる。","ja":"私たちは来訪者に北側の駐車場を使わせた。"},{"en":"We let the visitors to use the north parking lot.","ok":false,"note":"to use -&gt; use：let の後ろは原形。to 不定詞を取るのは allow / permit。","ja":"私たちは来訪者に北側の駐車場を使わせた。"}],"group":"使役・知覚動詞"},{"id":204,"part":11,"cat":"使役動詞（受動態・have O 過去分詞）","theme":"使役動詞（受動態・have O 過去分詞）","items":[{"en":"She made her team work overtime on Friday.","ok":true,"note":"正：make + 人 + 原形。","ja":"彼女は金曜日にチームに残業させた。"},{"en":"Her team was made work overtime on Friday.","ok":false,"note":"was made work -&gt; was made to work：make を受動態にすると原形ではなく to 不定詞になる。","ja":"彼女のチームは金曜日に残業させられた。"},{"en":"I had my laptop repaired at the shop yesterday.","ok":true,"note":"正：have + 物 + 過去分詞で「〜してもらう」。","ja":"私は昨日、店でノートパソコンを修理してもらった。"},{"en":"I had repaired my laptop at the shop yesterday.","ok":false,"note":"語順を had my laptop repaired に：この形では「自分で修理し終えていた」の意になり文意に合わない。","ja":"私は昨日、店でノートパソコンを修理してもらった。"}],"group":"使役・知覚動詞"},{"id":205,"part":11,"cat":"知覚動詞（see / hear O do・doing）","theme":"知覚動詞（see / hear O do・doing）","items":[{"en":"We saw the delivery truck arrive at the loading dock.","ok":true,"note":"正：see + 目的語 + 原形で、動作の一部始終を見たことを表す。","ja":"私たちは配送トラックが荷積み場に到着するのを見た。"},{"en":"We saw the delivery truck to arrive at the loading dock.","ok":false,"note":"to arrive -&gt; arrive：知覚動詞の後ろに to 不定詞は置けない。","ja":"私たちは配送トラックが荷積み場に到着するのを見た。"},{"en":"I heard someone knocking on the door.","ok":true,"note":"正：現在分詞にすると進行中の動作の一部を聞いたことを表す。","ja":"私は誰かがドアをノックしているのを聞いた。"},{"en":"The applicant was seen enter the building.","ok":false,"note":"enter -&gt; to enter：知覚動詞を受動態にすると to 不定詞になる。","ja":"その応募者は建物に入るところを目撃された。"}],"group":"使役・知覚動詞"},{"id":206,"part":11,"cat":"同格の that","theme":"同格の that","items":[{"en":"We received the news that the merger had been approved.","ok":true,"note":"正：news の内容を説明する同格の that 節。that の後ろは完全な文。","ja":"私たちは合併が承認されたという知らせを受け取った。"},{"en":"The fact which she resigned surprised everyone.","ok":false,"note":"which -&gt; that：後ろが完全な文なので関係代名詞ではなく同格の that。","ja":"彼女が辞職したという事実は皆を驚かせた。"},{"en":"There is a possibility that the flight will be canceled.","ok":true,"note":"正：possibility / fact / news / idea などは同格の that 節を取る。","ja":"その便が欠航になる可能性がある。"},{"en":"The rumor of the office will move is false.","ok":false,"note":"of -&gt; that：節を続けるには同格の that が必要。of なら後ろは名詞句にする。","ja":"オフィスが移転するという噂は事実ではない。"}],"group":"同格・強調"},{"id":207,"part":11,"cat":"強調構文（It is ~ that）","theme":"強調構文（It is ~ that）","items":[{"en":"It was the marketing team that proposed the new logo.","ok":true,"note":"正：強調される語が人・組織でも that が使える。","ja":"新しいロゴを提案したのはマーケティング部だった。"},{"en":"It was the marketing team what proposed the new logo.","ok":false,"note":"what -&gt; that（または who）：強調構文で what は使えない。","ja":"新しいロゴを提案したのはマーケティング部だった。"},{"en":"It is on Friday that the results will be announced.","ok":true,"note":"正：副詞句を強調する場合も that で受ける。","ja":"結果が発表されるのは金曜日だ。"},{"en":"It is on Friday when the results will be announced.","ok":false,"note":"when -&gt; that：前置詞句 on Friday を強調しているので when は使えない。","ja":"結果が発表されるのは金曜日だ。"}],"group":"同格・強調"},{"id":208,"part":11,"cat":"強調構文（not until / what）","theme":"強調構文（not until / what）","items":[{"en":"It was not until 2020 that the company entered the Asian market.","ok":true,"note":"正：It is not until ~ that ...（〜して初めて…する）の定型。","ja":"その会社がアジア市場に参入したのは2020年になってからだった。"},{"en":"It was not until 2020 when the company entered the Asian market.","ok":false,"note":"when -&gt; that：この構文では必ず that を用いる。","ja":"その会社がアジア市場に参入したのは2020年になってからだった。"},{"en":"What the client wants is a faster response.","ok":true,"note":"正：関係代名詞 what が主語となる名詞節を作る。","ja":"その顧客が求めているのは、より迅速な対応だ。"},{"en":"That the client wants is a faster response.","ok":false,"note":"That -&gt; What：wants の目的語が欠けているので、先行詞を含む what を使う。","ja":"その顧客が求めているのは、より迅速な対応だ。"}],"group":"同格・強調"},{"id":209,"part":11,"cat":"時・条件の副詞節での現在形","theme":"時・条件の副詞節での現在形","items":[{"en":"We will call you as soon as the shipment arrives.","ok":true,"note":"正：時を表す副詞節の中では、未来のことでも現在形にする。","ja":"荷物が到着し次第、お電話します。"},{"en":"We will call you as soon as the shipment will arrive.","ok":false,"note":"will arrive -&gt; arrives：as soon as が導く副詞節では will を使わない。","ja":"荷物が到着し次第、お電話します。"},{"en":"If it rains tomorrow, the outdoor event will be canceled.","ok":true,"note":"正：条件を表す副詞節でも現在形。主節側は will を使う。","ja":"明日雨が降れば、屋外行事は中止になる。"},{"en":"If it will rain tomorrow, the outdoor event will be canceled.","ok":false,"note":"will rain -&gt; rains：条件の副詞節では未来の内容も現在形で表す。","ja":"明日雨が降れば、屋外行事は中止になる。"}],"group":"時・条件の副詞節"},{"id":210,"part":11,"cat":"時の副詞節（before / after・完了形）","theme":"時の副詞節（before / after・完了形）","items":[{"en":"Before you leave the office, please turn off the lights.","ok":true,"note":"正：before が導く副詞節では現在形を使う。","ja":"退社する前に、照明を消してください。"},{"en":"Before you will leave the office, please turn off the lights.","ok":false,"note":"will leave -&gt; leave：時の副詞節に will は入れない。","ja":"退社する前に、照明を消してください。"},{"en":"We will start the meeting after everyone has arrived.","ok":true,"note":"正：完了を強調する場合は現在完了。will have は使わない。","ja":"全員が到着してから会議を始めます。"},{"en":"We will start the meeting after everyone will have arrived.","ok":false,"note":"will have arrived -&gt; has arrived：時の副詞節では未来完了も現在完了に置き換える。","ja":"全員が到着してから会議を始めます。"}],"group":"時・条件の副詞節"},{"id":211,"part":11,"cat":"状態動詞の進行形","theme":"状態動詞の進行形","items":[{"en":"This package belongs to Ms. Kim in Accounting.","ok":true,"note":"正：belong は状態を表すため進行形にしない。","ja":"この小包は経理部のキムさんのものだ。"},{"en":"This package is belonging to Ms. Kim in Accounting.","ok":false,"note":"is belonging -&gt; belongs：所属・所有を表す動詞は進行形不可。","ja":"この小包は経理部のキムさんのものだ。"},{"en":"We are considering three options for the venue.","ok":true,"note":"正：consider は「検討する」という動作なので進行形にできる。","ja":"私たちは会場について3つの選択肢を検討している。"},{"en":"I am knowing the answer to your question.","ok":false,"note":"am knowing -&gt; know：know は状態動詞で進行形にしない。","ja":"私はあなたの質問の答えを知っている。"}],"group":"時制・態"},{"id":212,"part":11,"cat":"主述の一致（a number of / the number of）","theme":"主述の一致（a number of / the number of）","items":[{"en":"A number of employees have requested parking passes.","ok":true,"note":"正：a number of ~（多数の〜）は複数扱い。","ja":"多数の従業員が駐車許可証を申請している。"},{"en":"A number of employees has requested parking passes.","ok":false,"note":"has -&gt; have：a number of + 複数名詞は複数扱いになる。","ja":"多数の従業員が駐車許可証を申請している。"},{"en":"The number of applicants has increased sharply.","ok":true,"note":"正：the number of ~（〜の数）は単数扱い。","ja":"応募者の数が急増した。"},{"en":"The number of applicants have increased sharply.","ok":false,"note":"have -&gt; has：主語の中心は number なので単数扱い。","ja":"応募者の数が急増した。"}],"group":"主述の一致"},{"id":213,"part":11,"cat":"主述の一致（each / every）","theme":"主述の一致（each / every）","items":[{"en":"Each of the departments submits a monthly report.","ok":true,"note":"正：each of + 複数名詞は単数扱い。","ja":"各部署が月次報告書を提出する。"},{"en":"Each of the departments submit a monthly report.","ok":false,"note":"submit -&gt; submits：主語は each なので三人称単数。","ja":"各部署が月次報告書を提出する。"},{"en":"Every employee is required to attend the safety session.","ok":true,"note":"正：every + 単数名詞 + 単数動詞。","ja":"全従業員が安全講習に出席することが求められている。"},{"en":"Every employees are required to attend the safety session.","ok":false,"note":"Every employees -&gt; Every employee：every の後ろは単数名詞。","ja":"全従業員が安全講習に出席することが求められている。"}],"group":"主述の一致"},{"id":214,"part":11,"cat":"間接疑問（語順）","theme":"間接疑問（語順）","items":[{"en":"Could you tell me where the conference room is?","ok":true,"note":"正：間接疑問では〈疑問詞＋主語＋動詞〉の平叙文の語順にする。","ja":"会議室がどこにあるか教えていただけますか。"},{"en":"Could you tell me where is the conference room?","ok":false,"note":"where is -&gt; where the conference room is：文中に埋め込まれた疑問は倒置しない。","ja":"会議室がどこにあるか教えていただけますか。"},{"en":"I wonder why the shipment was delayed.","ok":true,"note":"正：wonder の後ろも平叙文の語順。","ja":"なぜ出荷が遅れたのだろうか。"},{"en":"I wonder why was the shipment delayed.","ok":false,"note":"why was the shipment -&gt; why the shipment was：間接疑問に疑問文の語順は使わない。","ja":"なぜ出荷が遅れたのだろうか。"}],"group":"疑問文の形"},{"id":215,"part":11,"cat":"付加疑問","theme":"付加疑問","items":[{"en":"You submitted the expense form, didn&#x27;t you?","ok":true,"note":"正：肯定文には否定の付加疑問を付ける。","ja":"経費精算書を提出しましたよね。"},{"en":"You submitted the expense form, did you?","ok":false,"note":"did you -&gt; didn&#x27;t you：肯定文の後ろは否定形で受ける。","ja":"経費精算書を提出しましたよね。"},{"en":"Let&#x27;s begin the meeting, shall we?","ok":true,"note":"正：Let&#x27;s ~ の付加疑問は shall we?。","ja":"会議を始めましょうか。"},{"en":"She isn&#x27;t coming to the reception, isn&#x27;t she?","ok":false,"note":"isn&#x27;t she -&gt; is she：否定文には肯定の付加疑問を付ける。","ja":"彼女は歓迎会に来ないのですよね。"}],"group":"疑問文の形"},{"id":216,"part":11,"cat":"so ~ that / such ~ that","theme":"so ~ that / such ~ that","items":[{"en":"It was such a busy day that we skipped lunch.","ok":true,"note":"正：such + a + 形容詞 + 名詞 の語順。","ja":"とても忙しい一日だったので、私たちは昼食を抜いた。"},{"en":"It was so a busy day that we skipped lunch.","ok":false,"note":"so a busy day -&gt; such a busy day（または so busy a day）：so の直後に冠詞は置けない。","ja":"とても忙しい一日だったので、私たちは昼食を抜いた。"},{"en":"The instructions were so complicated that no one understood them.","ok":true,"note":"正：形容詞だけを強めるときは so を使う。","ja":"その説明書はとても複雑だったので、誰も理解できなかった。"},{"en":"The instructions were such complicated that no one understood them.","ok":false,"note":"such -&gt; so：後ろが形容詞単独なので such は使えない。","ja":"その説明書はとても複雑だったので、誰も理解できなかった。"}],"group":"構文（so/such）"},{"id":217,"part":11,"cat":"比較の慣用（倍数・最上級の強調）","theme":"比較の慣用（倍数・最上級の強調）","items":[{"en":"The new model is twice as expensive as the old one.","ok":true,"note":"正：倍数表現は〈倍数 + as 原級 as〉で表す。","ja":"新型は旧型の2倍の価格だ。"},{"en":"The new model is twice more expensive than the old one.","ok":false,"note":"twice more expensive than -&gt; twice as expensive as：倍数は比較級ではなく原級で表す。","ja":"新型は旧型の2倍の価格だ。"},{"en":"This is by far the best proposal we have received.","ok":true,"note":"正：by far は最上級を強める。the を落とさないこと。","ja":"これは我々が受け取った中で群を抜いて最良の提案だ。"},{"en":"This is by far better proposal than we have received.","ok":false,"note":"by far better proposal -&gt; by far the best proposal：by far は最上級を強め、冠詞 the が必要。","ja":"これは我々が受け取った中で群を抜いて最良の提案だ。"}],"group":"比較の慣用"},{"id":218,"part":11,"cat":"比較の慣用（the 比較級・no less than）","theme":"比較の慣用（the 比較級・no less than）","items":[{"en":"The sooner we decide, the lower the cost will be.","ok":true,"note":"正：〈The + 比較級 ~, the + 比較級 ...〉。両方に the が要る。","ja":"決定が早ければ早いほど、費用は低くなる。"},{"en":"Sooner we decide, lower the cost will be.","ok":false,"note":"the を補う：この構文では両方の比較級に the を付ける。","ja":"決定が早ければ早いほど、費用は低くなる。"},{"en":"He is no less capable than his predecessor.","ok":true,"note":"正：no less ~ than は「〜に劣らず…だ」。","ja":"彼は前任者に劣らず有能だ。"},{"en":"He is not more capable as his predecessor.","ok":false,"note":"as -&gt; than：比較級 more の後ろは than で受ける。","ja":"彼は前任者ほど有能ではない。"}],"group":"比較の慣用"},{"id":219,"part":11,"cat":"提案・要求の that 節（仮定法現在）","theme":"提案・要求の that 節（仮定法現在）","items":[{"en":"The board recommended that the policy be revised.","ok":true,"note":"正：recommend / suggest / insist などの後ろの that 節は動詞の原形。should の省略形。","ja":"取締役会はその方針を改訂するよう勧告した。"},{"en":"The board recommended that the policy is revised.","ok":false,"note":"is -&gt; be：提案・要求・命令を表す動詞の that 節では原形を使う。","ja":"取締役会はその方針を改訂するよう勧告した。"},{"en":"It is essential that every visitor sign in at the desk.","ok":true,"note":"正：essential / necessary / important などの後ろも原形。","ja":"全来訪者が受付で記帳することが不可欠だ。"},{"en":"It is essential that every visitor signs in at the desk.","ok":false,"note":"signs -&gt; sign：米国式では原形を用いる。TOEICもこの用法で出題される（英国式では signs も許容）。","ja":"全来訪者が受付で記帳することが不可欠だ。"}],"group":"仮定法現在"},{"id":220,"part":11,"cat":"無生物主語の構文","theme":"無生物主語の構文","items":[{"en":"The heavy rain prevented us from leaving on time.","ok":true,"note":"正：prevent + 目的語 + from doing。無生物を主語に取る典型。","ja":"大雨のせいで私たちは時間どおりに出発できなかった。"},{"en":"The heavy rain prevented us to leave on time.","ok":false,"note":"to leave -&gt; from leaving：prevent は from + 動名詞を取る。","ja":"大雨のせいで私たちは時間どおりに出発できなかった。"},{"en":"This road will take you to the station in ten minutes.","ok":true,"note":"正：〈物 + take + 人 + to 場所〉で「この道を行けば〜に着く」。","ja":"この道を行けば10分で駅に着きます。"},{"en":"This road will bring you to arrive at the station.","ok":false,"note":"to arrive を削除：bring you to the station で足りる。to 不定詞は不要。","ja":"この道を行けば駅に着きます。"}],"group":"無生物主語"}];
const FOCUS = [{"id":1,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"Ms. Tanaka provided <u class=\"blank\">＿＿＿</u> information about the new safety regulations at yesterday&#x27;s briefing.","o":["many","a great deal of","several","a few"],"a":1,"e":"<b>information</b> は不可算。many / several / a few はすべて可算複数専用なので即消去できる。a great deal of は不可算専用の数量詞。"},{"id":2,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"Because of the merger, the accounting department now handles <u class=\"blank\">＿＿＿</u> paperwork than before.","o":["fewer","less","few","many"],"a":1,"e":"<b>paperwork</b> は不可算なので比較級は <code>less</code>。fewer は可算複数（fewer documents）に対応する。この fewer/less の対比は Part 5 頻出。"},{"id":3,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"<u class=\"blank\">＿＿＿</u> employees have requested a transfer to the Singapore office this quarter.","o":["Much","A great deal of","Fewer","A large amount of"],"a":2,"e":"<b>employees</b> は可算複数。much / a great deal of / a large amount of はいずれも不可算専用。可算複数に使えるのは fewer。"},{"id":4,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"The technician said there was <u class=\"blank\">＿＿＿</u> equipment left in the storage room.","o":["a few","many","little","several"],"a":2,"e":"<b>equipment</b> は不可算。「ほとんど残っていない」は <code>little</code>。a few / several / many は可算複数専用。"},{"id":5,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"We have received <u class=\"blank\">＿＿＿</u> feedback from customers since the redesign of our website.","o":["numerous","a number of","a great deal of","several"],"a":2,"e":"<b>feedback</b> は不可算。a number of / numerous / several は可算複数を取る。"},{"id":6,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"<u class=\"blank\">＿＿＿</u> of the furniture in the lobby was damaged during the renovation.","o":["Many","Few","Much","Several"],"a":2,"e":"<b>furniture</b> は不可算。動詞が <code>was</code>（単数）である点も手がかりになる。"},{"id":7,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"The consultant offered <u class=\"blank\">＿＿＿</u> suggestions for improving warehouse efficiency.","o":["much","a great deal of","a large amount of","several"],"a":3,"e":"逆パターン。<b>suggestion</b> は可算名詞（不可算の advice との対で覚える）。したがって不可算専用の much などは不可。"},{"id":8,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"Only <u class=\"blank\">＿＿＿</u> progress has been made on the clinical trial protocol so far.","o":["a few","little","many","fewer"],"a":1,"e":"<b>progress</b> は不可算。「ほとんど進んでいない」は little。動詞 <code>has been</code> も単数扱いの証拠。"},{"id":9,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"There is <u class=\"blank\">＿＿＿</u> luggage in the overhead compartment than usual on this flight.","o":["fewer","many","less","few"],"a":2,"e":"<b>luggage</b> は不可算なので less。個数を数えるなら two pieces of luggage と単位表現を使う。"},{"id":10,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"<u class=\"blank\">＿＿＿</u> applicants for the position have prior experience in regulatory affairs.","o":["Much","A great deal of","A number of","A large amount of"],"a":2,"e":"<b>applicants</b> は可算複数なので a number of。amount は不可算、number は可算複数、と対で覚える。"},{"id":11,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"The revised policy requires <u class=\"blank\">＿＿＿</u> documentation from overseas suppliers.","o":["fewer","several","more","many"],"a":2,"e":"<b>documentation</b> は不可算。<code>more</code> は可算・不可算どちらにも使える万能型。fewer / several / many は可算複数専用。"},{"id":12,"part":1,"cat":"数量詞の選択","sub":"不可算名詞","theme":"不可算名詞：数量詞の選択","q":"The auditor found <u class=\"blank\">＿＿＿</u> evidence of accounting irregularities during the review.","o":["a few","numerous","no","several"],"a":2,"e":"<b>evidence</b> は不可算。<code>no</code> は両方に使える。「証拠が複数」と言いたい場合は two pieces of evidence とする。"},{"id":13,"part":1,"cat":"意味が変わる語","sub":"不可算名詞","theme":"不可算名詞：意味が変わる語","q":"The gallery is currently displaying several <u class=\"blank\">＿＿＿</u> by contemporary Japanese s  は比較級には付かないが最上級には付く。"},{"id":98,"part":5,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"That was <u class=\"blank\">＿＿＿</u> the worst quarter the company has recorded in a decade.","o":["too","easily","very","so"],"a":1,"e":"<b>easily + the + 最上級</b>＝断然。by far / definitely と同グループ。"},{"id":99,"part":5,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"The Kyoto branch is <u class=\"blank\">＿＿＿</u> the most profitable of our twelve domestic locations.","o":["so","definitely","too","very"],"a":1,"e":"<b>definitely</b> も最上級を強める。British Council は much the ~ より by far / definitely が一般的だとしている。"},{"id":100,"part":5,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"The Nagoya plant is the <u class=\"blank\">＿＿＿</u> largest facility the company operates worldwide.","o":["two","second","twice","double"],"a":1,"e":"<b>序数 + 最上級</b>＝「〜番目に最も」。the second largest / the third most popular。"},{"id":101,"part":6,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"This is <u class=\"blank\">＿＿＿</u> the most efficient laboratory I have visited in the last five years.","o":["very","possibly","too","so"],"a":1,"e":"<b>possibly / almost / nearly / practically</b> も最上級を修飾できる。断定を弱める方向の修飾。"},{"id":102,"part":6,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"The 2019 model remains the best-selling product the company has <u class=\"blank\">＿＿＿</u> released.","o":["ever","never","always","yet"],"a":0,"e":"最上級 + 関係詞節の中では <code>ever</code>。「これまでに〜した中で最も」。"},{"id":103,"part":6,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"Our Sendai facility handles <u class=\"blank\">＿＿＿</u> the largest volume of shipments in the network.","o":["very","by far","too","so"],"a":1,"e":"by far が最上級を強める標準形。very は the の直後（the very largest）でなければ使えない。"},{"id":104,"part":6,"cat":"最上級の強調","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：最上級の強調","q":"The proposal from the Osaka team was <u class=\"blank\">＿＿＿</u> the most thoroughly researched of the five.","o":["so","much","too","very"],"a":1,"e":"<b>much + the + 最上級</b>は正しいが硬い言い方。空所が the の<b>前</b>にあるため very は使えず、much が残る。"},{"id":105,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"The shipping delay made the negotiation all <u class=\"blank\">＿＿＿</u> difficult for both parties.","o":["the more","the most","more the","most the"],"a":0,"e":"<b>all the + 比較級</b>＝いっそう〜。the more difficult の語順に注意。"},{"id":106,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"Our plant produces more units per hour than any other <u class=\"blank\">＿＿＿</u> in the region.","o":["facility","facilities","of facility","facility&#x27;s"],"a":0,"e":"<b>than any other + 単数名詞</b>。事実上の最上級を比較級で表す構文。× than any other facilities。"},{"id":107,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"<u class=\"blank\">＿＿＿</u> we finalize the budget, the lower the overall project cost will be.","o":["The sooner","Sooner","Soonest","The soonest"],"a":0,"e":"<b>the + 比較級 ~, the + 比較級 ~</b>＝「〜すればするほど…」。前半にも the が必要。"},{"id":108,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"No <u class=\"blank\">＿＿＿</u> than 300 people registered for the trade fair in Yokohama.","o":["less","fewer","lesser","little"],"a":1,"e":"<b>people</b> は可算なので <code>no fewer than</code>。金額など不可算には no less than を使う。可算/不可算の知識が直結する。"},{"id":109,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"The new office is nowhere near <u class=\"blank\">＿＿＿</u> accessible as the previous location.","o":["than","as","so","more"],"a":1,"e":"<b>nowhere near as ~ as</b>＝到底〜ほどではない。as ... as の枠を崩さない。"},{"id":110,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"Their pricing model is every <u class=\"blank\">＿＿＿</u> as aggressive as our own strategy.","o":["much","bit","far","lot"],"a":1,"e":"<b>every bit as ~ as</b>＝まったく同程度に。同等を強調する定型。"},{"id":111,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"The logistics market is becoming <u class=\"blank\">＿＿＿</u> competitive with each passing year.","o":["more and more","most and most","the more","many and many"],"a":0,"e":"<b>比較級 and 比較級</b>＝ますます〜。increasingly competitive と言い換えられる。"},{"id":112,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"The final renovation costs were no <u class=\"blank\">＿＿＿</u> than the original estimate submitted in April.","o":["higher","highest","high","more high"],"a":0,"e":"<b>no + 比較級 + than</b>。no higher than ~＝〜を上回らない。最上級や原級は入らない。"},{"id":113,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"Our Fukuoka facility handles <u class=\"blank\">＿＿＿</u> as many shipments as the Nagoya branch does.","o":["twice","two times more","double","twofold"],"a":0,"e":"<b>倍数 + as ~ as</b>＝twice as many ~ as。× double as many。three times as many なら数詞 + times。"},{"id":114,"part":6,"cat":"派生構文","sub":"比較級・最上級の強調","theme":"比較級・最上級の強調：派生構文","q":"He was none <u class=\"blank\">＿＿＿</u> wiser after reading the entire technical specification.","o":["the","a","so","very"],"a":0,"e":"<b>none the + 比較級</b>＝それでも相変わらず〜でない。all the 比較級と対で覚える。"}];
const PART7 = [{"id":1,"part":1,"cat":"Eメール","theme":"Eメール：会議室の変更依頼","header":["宛先: Daniel Ruiz &lt;d.ruiz@brightonlogistics.com&gt;","差出人: Amelia Park &lt;a.park@brightonlogistics.com&gt;","日付: 3月4日","件名: Thursday briefing"],"body":["Daniel,","I have just been told that the Oakwood Room will be unavailable on Thursday because the flooring is being replaced. Our quarterly briefing is scheduled there for 2:00 P.M. Twenty-two people have registered and a few usually join on the day, so we need a space that seats at least twenty-five. The Harborview Room on the fifth floor is large enough, but it is booked from 1:00 P.M.","Would you mind moving our session forward to 10:00 A.M.? If that is difficult for the sales team, I can ask Facilities whether the cafeteria can be partitioned instead, though the cafeteria is noisy at midday and I would rather avoid it.","Please let me know by tomorrow afternoon so that I can send a revised notice to the participants.","Amelia"],"questions":[{"q":"Why is Ms. Park writing to Mr. Ruiz?","o":["To cancel a quarterly briefing","To report a problem with the flooring","To request a change to a meeting time","To register participants for a session"],"a":2,"e":"第2段落で「10時に移せないか」と依頼している。会議そのものの中止ではなく、時間変更の相談。"},{"q":"What is indicated about the Harborview Room?","o":["It is located on the same floor as the Oakwood Room","It is being renovated on Thursday","It seats fewer than twenty people","It is already reserved for part of the day"],"a":3,"e":"第1段落末尾に「午後1時から予約が入っている」とある。改装中なのは Oakwood Room。"},{"q":"What does Ms. Park suggest she would prefer not to do?","o":["Use the cafeteria as a meeting space","Contact the Facilities department","Send a revised notice to participants","Reduce the number of participants"],"a":0,"e":"「食堂を仕切る案もあるが騒音は避けたい」とあるので、食堂の使用に消極的。"}],"ja":["ダニエルさん","オークウッド・ルームが床の張り替えのため木曜日に使用できないと今しがた聞きました。四半期説明会には22名が登録しているので、少なくとも25名が座れる場所が必要です。5階のハーバービュー・ルームなら使えますが、午後1時から予約が入っています。","オークウッド・ルームが床の張り替えのため木曜日に使用できないと今しがた聞きました。四半期説明会
