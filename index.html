は同室で午後2時に予定されています。22名が登録しており、当日に数名が加わるのが常なので、少なくとも25名が座れる場所が必要です。5階のハーバービュー・ルームは十分な広さがありますが、午後1時から予約が入っています。","私たちの会を午前10時に繰り上げていただけないでしょうか。営業チームにとって難しいようなら、食堂を仕切れるか施設管理部に尋ねることもできますが、食堂は昼どきに騒がしいので避けたいところです。","アメリア"]},{"id":2,"part":1,"cat":"お知らせ","theme":"お知らせ：エレベーター点検","header":["NOTICE TO ALL TENANTS — Kirkland Tower"],"body":["Beginning Monday, June 3, the two passenger elevators in the north lobby will undergo their annual safety inspection. Elevator A will be out of service from June 3 to June 5, and Elevator B from June 6 to June 8. Only one of the two passenger elevators will be out of service at any time.","The service elevator is a separate matter: it will be reserved for inspection equipment for the whole six days and cannot be used for deliveries. Tenants moving large items should therefore schedule deliveries outside these dates. The stairwell between floors 2 and 9 will remain open throughout.","We expect longer wait times during the morning rush. Tenants on the lower floors are encouraged to use the stairs where possible. Questions may be directed to the building office at extension 400."],"questions":[{"q":"What is the purpose of the notice?","o":["To request payment for building maintenance","To inform tenants of a temporary service reduction","To advertise newly renovated elevators","To announce a change in building management"],"a":1,"e":"点検に伴いエレベーターが一時的に使えなくなることの周知が目的。"},{"q":"What is suggested about June 7?","o":["The building office will be closed","Elevator B will be under inspection","Both elevators will be unavailable","Elevator A will be out of service"],"a":1,"e":"Elevator B は6月6日〜8日が点検期間なので、7日はBが停止中。Aは3〜5日。"},{"q":"What are tenants advised to do?","o":["Use the service elevator instead","Report delays to the building owner","Avoid scheduling large deliveries during the inspection","Move to a lower floor temporarily"],"a":2,"e":"第2段落で「大きな荷物の搬入はこの期間を外して予定するように」と述べている。"}],"ja":["入居各位へのお知らせ ― カークランド・タワー","6月3日（月）より、北ロビーの旅客用エレベーター2基が年次安全点検を受けます。A号機は6月3日から5日まで、B号機は6月6日から8日まで運行を停止します。旅客用2基のうち、同時に停止するのは常に1基のみです。","業務用エレベーターは別扱いです。6日間を通じて点検機材のために確保され、搬入には使用できません。そのため、大型の荷物を搬入される入居者は、この期間外に配送を予定してください。2階から9階の階段は期間中も通行できます。","朝の混雑時には待ち時間が長くなる見込みです。低層階の入居者はできる限り階段をご利用ください。ご質問は内線400の管理事務所までお願いします。"]},{"id":3,"part":1,"cat":"広告","theme":"広告：家具店のセール","header":["MERIDIAN HOME — Spring Clearance"],"body":["The sale runs from 15 to 28 March. During those two weeks every floor model in our Riverside showroom is reduced by 30 to 60 percent. Dining sets, bookcases, and office chairs are included; mattresses and custom orders are not.","All clearance items are sold as displayed and cannot be returned. Delivery within the city is free on purchases over $500; outside the city limits, a flat fee of $45 applies. Ask a sales associate about our assembly service, available for an additional charge.","Members of our rewards program receive an extra 5 percent off and may shop on 14 March, the day before the sale opens to the public. Not yet a member? Sign up at the front desk in under five minutes."],"questions":[{"q":"What is NOT included in the sale?","o":["Mattresses","Office chairs","Bookcases","Dining sets"],"a":0,"e":"第1段落末尾に「特注品とマットレスは対象外」と明記されている。"},{"q":"What is stated about clearance items?","o":["They include free assembly","They can be returned within two weeks","They cannot be exchanged or returned","They are available only to members"],"a":2,"e":"「展示された状態での販売で、返品不可」とある。組み立ては追加料金。"},{"q":"What benefit do rewards program members receive?","o":["A free five-minute consultation","Free delivery outside the city","The ability to shop before the general public","A discount on custom orders"],"a":2,"e":"第3段落に「一般公開の前日3月14日に先行入店できる」とある。"}],"ja":["メリディアン・ホーム ― 春の在庫一掃セール","セール期間は3月15日から28日までです。この2週間、リバーサイド展示場の展示品すべてを30〜60パーセント値引きします。ダイニングセット、本棚、オフィスチェアが対象です。マットレスと特注品は対象外です。","一掃セール品はすべて展示された状態での販売で、返品はできません。市内への配送は500ドル以上のお買い上げで無料、市外は一律45ドルです。組み立てサービスは追加料金で承りますので、販売担当にお尋ねください。","ポイント制度の会員は追加で5パーセント割引となり、一般公開の前日である3月14日にお買い物いただけます。まだ会員でない方は、受付にて5分以内でご登録いただけます。"]},{"id":4,"part":1,"cat":"求人広告","theme":"求人広告：物流担当者の募集","header":["Logistics Coordinator — Halversen Foods"],"body":["Halversen Foods is seeking a Logistics Coordinator for our Fairfield distribution center. The successful candidate will track incoming shipments, resolve discrepancies with suppliers, and prepare weekly inventory reports for the operations manager.","Requirements: a bachelor&#x27;s degree in business or a related field, at least three years of experience in a warehouse setting, and proficiency with spreadsheet software. Familiarity with customs documentation is preferred but not required.","This is a full-time position with a starting salary of $52,000 and a comprehensive benefits package. Occasional Saturday shifts are required during peak season.","Send a résumé and a brief cover letter to careers@halversenfoods.com by April 30. Only candidates selected for an interview will be contacted."],"questions":[{"q":"What is one of the duties of the position?","o":["Training new warehouse staff","Managing the company Web site","Negotiating supplier contracts","Preparing inventory reports"],"a":3,"e":"第1段落に「週次の在庫報告書を作成する」とある。"},{"q":"What qualification is desirable but not mandatory?","o":["A bachelor&#x27;s degree","Spreadsheet skills","Knowledge of customs documentation","Three years of warehouse experience"],"a":2,"e":"preferred but not required（望ましいが必須ではない）と書かれているのは通関書類の知識。"},{"q":"What is indicated about the job?","o":["It occasionally requires weekend work","It is based at the head office","It does not include benefits","It is a temporary position"],"a":0,"e":"第3段落に「繁忙期には土曜勤務が時折必要」とある。"}],"ja":["物流コーディネーター募集 ― ハルバーセン・フーズ","当社フェアフィールド配送センターにて物流コーディネーターを募集します。採用された方には、入荷の追跡、仕入先との不一致の解消、業務部長向けの週次在庫報告書の作成をご担当いただきます。","応募要件：経営学または関連分野の学士号、倉庫での3年以上の実務経験、表計算ソフトの習熟。通関書類に関する知識は望ましいですが必須ではありません。","正社員採用で、初任給は52,000ドル、充実した福利厚生が付きます。繁忙期には土曜勤務が時折発生します。","4月30日までに履歴書と簡単な添え状を careers@halversenfoods.com までお送りください。面接に進まれる方にのみご連絡します。"]},{"id":5,"part":1,"cat":"社内文書","theme":"社内文書：経費精算の新方針","header":["MEMORANDUM","宛先: All staff","差出人: Naomi Fletcher, Finance Director","日付: 8 September"],"body":["Starting 1 October, all travel expenses must be submitted through the new online portal rather than on paper forms. Receipts should be photographed and uploaded within ten business days of returning from a trip. That is a guideline; the strict limit is thirty days, and a claim submitted after it cannot be reimbursed.","The portal automatically calculates mileage at the current rate, so employees no longer need to look it up. Meals remain capped at £40 per day, and hotel bookings above £150 per night still require written approval from a department head in advance.","Training sessions will be held on 18 and 19 September in Room 3B. Attendance is optional, but a recorded walkthrough will be posted on the intranet for those who cannot attend."],"questions":[{"q":"What is the main purpose of the memo?","o":["To announce a change in reimbursement rates","To schedule a department meeting","To introduce a new expense submission process","To restrict business travel"],"a":2,"e":"紙の様式からオンライン提出への切り替えを知らせる文書。"},{"q":"What must employees still obtain in advance?","o":["A printed copy of each receipt","The current mileage rate","Approval for expensive hotel rooms","A manager&#x27;s signature on every claim"],"a":2,"e":"1泊150ポンドを超える宿泊は事前に部門長の書面承認が必要、と第2段落にある。"},{"q":"What is suggested about the training sessions?","o":["They will be held online only","Staff who miss them can view a recording","They take place after the new system starts","They are required for all staff"],"a":1,"e":"出席は任意で、参加できない人向けに録画がイントラネットに掲載される。"}],"ja":["社内連絡","10月1日より、出張費はすべて紙の様式ではなく新しいオンライン窓口を通じて提出していただきます。領収書は撮影し、帰着後10営業日以内にアップロードしてください。これは目安であり、厳格な期限は30日です。これを過ぎた申請は精算できません。","窓口では現行のレートで走行距離手当が自動計算されるため、社員が自分で調べる必要はなくなります。食費は1日40ポンドが上限のままで、1泊150ポンドを超える宿泊予約には引き続き、事前に部門長の書面による承認が必要です。","説明会は9月18日と19日に3B室で開催します。出席は任意ですが、参加できない方のために操作手順の録画をイントラネットに掲載します。"]},{"id":6,"part":1,"cat":"記事","theme":"記事：地元企業の工場開設","header":["Pineboro Business Journal — 12 May"],"body":["Cedarline Manufacturing will open a second plant on the eastern edge of Pineboro this autumn, the company confirmed on Tuesday. The facility will produce components for wind turbines and is expected to employ about 140 workers, roughly a third of whom will be hired locally.","Company president Marta Delgado said the site was chosen for its proximity to the rail line. The town council had declined to extend the tax incentives granted for the company&#x27;s first plant, but Ms. Delgado said these had not affected the choice. &quot;Shipping costs drove the decision,&quot; she said at a press conference.","Construction began in February and is running two weeks ahead of schedule. Local officials estimate the plant will add roughly $3 million annually to the regional economy, though some residents have raised concerns about increased truck traffic on Route 9."],"questions":[{"q":"According to the article, why was the site selected?","o":["Because land prices were low","Because of its closeness to rail transportation","Because skilled workers were available","Because the town offered tax incentives"],"a":1,"e":"社長の発言で「税制優遇ではなく鉄道路線に近いこと、輸送費が決め手」と述べられている。"},{"q":"What is indicated about the construction?","o":["It is progressing faster than planned","It has been delayed by two weeks","It was halted by the town council","It will begin in the autumn"],"a":0,"e":"running two weeks ahead of schedule（予定より2週間早い）。"},{"q":"What concern is mentioned?","o":["An increase in truck traffic","The cost of wind turbine components","A shortage of local workers","Damage to the rail line"],"a":0,"e":"最終文に「9号線のトラック交通量増加への懸念」とある。"}],"ja":["パインボロ・ビジネス・ジャーナル 5月12日","シーダーライン製造社は今秋、パインボロ東端に第2工場を開設すると火曜日に認めた。同施設は風力タービン用の部品を生産し、およそ140名を雇用する見込みで、そのうち約3分の1は地元で採用される。","マルタ・デルガド社長は、用地は鉄道路線に近いことを理由に選定したと述べた。町議会は同社の第1工場に与えられていた税制優遇の延長を拒否していたが、デルガド社長はそれが選定に影響したわけではないとした。「輸送費が決め手でした」と記者会見で語った。","建設は2月に始まり、予定より2週間早く進んでいる。地元当局は同工場が地域経済に年間およそ300万ドルを加えると試算しているが、一部の住民は9号線のトラック交通量の増加に懸念を示している。"]},{"id":7,"part":1,"cat":"手紙","theme":"手紙：顧客への謝罪","header":["Aster &amp; Vine Kitchenware","18 Corby Lane, Ashford","2 November"],"body":["Dear Ms. Okonjo,","Thank you for contacting us about order #48120. You are right that the ceramic bowls you received were not the pattern shown on our Web site. Our warehouse recently reorganized its shelving, and two similar product codes were placed side by side. We have corrected the labeling.","Thank you for contacting us about order #48120. You are right that the ceramic bowls you received were not the pattern shown on our Web site. Our warehouse recently reorganized its shelving, two similar product codes ended up side by side, and the wrong set was picked for your order. We have corrected the labeling.","As an apology, we have added a £20 credit to your account, which will be applied automatically to your next purchase. It does not expire.","Sincerely,","Owen Bradley, Customer Care"],"questions":[{"q":"What problem is the letter addressing?","o":["The wrong product design was sent","An item was damaged during shipping","An order arrived later than promised","A customer was charged twice"],"a":0,"e":"サイトに表示された柄と違う陶器が届いたという問題。"},{"q":"What is Ms. Okonjo asked to do with the original bowls?","o":["Keep them or give them away","Return them within three days","Send a photograph of them","Exchange them at a local store"],"a":0,"e":"「返送不要。手元に置くか友人に譲ってほしい」とある。"},{"q":"What is mentioned about the credit?","o":["It applies only to ceramic items","It must be used within a month","It has no expiration date","It can be exchanged for cash"],"a":2,"e":"It does not expire.（有効期限なし）と明記されている。"}],"ja":["アスター・アンド・ヴァイン キッチンウェア 11月2日","オコンジョ様","ご注文番号48120についてご連絡いただきありがとうございます。お受け取りになった陶器のボウルが当社サイト掲載の柄と異なっていたとのこと、ご指摘のとおりです。当社倉庫が最近棚を再編成した際に、似た商品コードが隣り合わせに置かれてしまい、ご注文に対して誤った品が取り出されました。表示は訂正済みです。","正しい柄の交換品を本日午前に発送しました。3営業日以内にお手元に届く見込みです。元のボウルは返送不要ですので、そのままお使いいただくか、ご友人にお譲りください。","お詫びとして、20ポンド分をお客様の口座に加算しました。次回のご購入時に自動的に適用され、有効期限はございません。","敬具　オーウェン・ブラッドリー（お客様相談係）"]},{"id":8,"part":1,"cat":"チャット","theme":"チャット：配送トラブルの対応","header":["Online chat — 9:12 A.M."],"body":["<b>Priya Raman (9:12 A.M.)</b> The pallets for the Westbrook order are still sitting on dock 3. The driver says he was told to wait for a revised invoice.","<b>Tom Iverson (9:14 A.M.)</b> That's my fault. Accounting flagged a pricing error yesterday and I asked them to hold the shipment until a corrected invoice was ready. Has the customer been told?","<b>Priya Raman (9:15 A.M.)</b> Not yet. Their receiving window closes at noon, so if we miss it the delivery slips to Thursday.","<b>Tom Iverson (9:17 A.M.)</b> Let me call Accounting now. If they can issue the corrected invoice in the next twenty minutes, the driver can still make it.","<b>Priya Raman (9:18 A.M.)</b> I'll warn the driver to stay close. And I'd rather we tell Westbrook ourselves than have them call us."],"questions":[{"q":"Why has the shipment not left?","o":["The customer canceled the order","The driver arrived late","A corrected invoice has not been issued","The pallets were damaged"],"a":2,"e":"価格の誤りで出荷を保留し、修正請求書を待っている状態。"},{"q":"At 9:18 A.M., what does Ms. Raman most likely mean when she writes, &quot;I&#x27;d rather we tell Westbrook ourselves&quot;?","o":["She thinks the driver should call the customer","She prefers to speak with Accounting directly","She wants to contact the customer before they notice the delay","She believes the customer already knows"],"a":2,"e":"先方から問い合わせを受ける前に、こちらから遅れを伝えたいという意図。"},{"q":"What will Mr. Iverson do next?","o":["Reschedule the delivery for Thursday","Load the pallets himself","Meet with the driver at dock 3","Contact the Accounting department"],"a":3,"e":"9:17に「今から経理に電話する」と述べている。"}],"ja":["オンラインチャット 午前9時12分","プリヤ・ラマン（9:12）ウェストブルック向け注文のパレットがまだ3番ドックに置かれたままです。運転手は修正済みの請求書を待つように言われたとのことです。","トム・アイバーソン（9:14）私の責任です。昨日、経理が価格の誤りを指摘したので、修正した請求書が用意できるまで出荷を止めるよう頼みました。お客様には伝えてありますか。","プリヤ・ラマン（9:15）まだです。先方の受け入れ時間は正午までなので、間に合わなければ納品は木曜にずれ込みます。","トム・アイバーソン（9:17）今すぐ経理に電話します。20分以内に修正請求書を出してもらえれば、運転手はまだ間に合います。","プリヤ・ラマン（9:18）運転手には近くで待機するよう伝えます。それと、先方から連絡が来るより、こちらからウェストブルックに伝えたいです。"]},{"id":9,"part":1,"cat":"案内","theme":"案内：社内研修の申し込み","header":["Professional Development Series — Autumn Term"],"body":["The Human Resources department is pleased to announce four workshops for the autumn term. Each runs from 2:00 to 4:30 P.M. in the Lakeside Training Room.","· 4 October — Negotiating with Vendors (Ravi Menon)<br>· 11 October — Data Visualization Basics (Sofia Lindqvist)<br>· 25 October — Writing Clear Reports (Ravi Menon)<br>· 8 November — Leading Remote Teams (Grace Amadi)","Enrollment is limited to eighteen participants per session and is granted on a first-come, first-served basis. Employees who register and then fail to attend without informing Human Resources will be placed at the bottom of the waiting list for the following term.","To reserve a place, complete the form on the HR page of the intranet at least five days before the session. Managers must approve requests for the November workshop only."],"questions":[{"q":"Who will lead more than one workshop?","o":["Sofia Lindqvist","No one","Grace Amadi","Ravi Menon"],"a":3,"e":"Ravi Menon が10月4日と10月25日の2回を担当している。"},{"q":"What happens to employees who miss a session without informing HR?","o":["They are charged a fee","They lose priority for the next term","Their manager is notified","They must repeat the workshop"],"a":1,"e":"無断欠席者は翌期の待機リストの最後尾に回される。"},{"q":"Which workshop requires a manager&#x27;s approval?","o":["Negotiating with Vendors","Writing Clear Reports","Leading Remote Teams","Data Visualization Basics"],"a":2,"e":"「11月の研修についてのみ管理職の承認が必要」とあり、該当は11月8日の Leading Remote Teams。"}],"ja":["能力開発シリーズ ― 秋学期","人事部より、秋学期の研修4件をご案内します。いずれもレイクサイド研修室にて午後2時から4時30分まで行います。","・10月4日 仕入先との交渉（ラヴィ・メノン）<br>・10月11日 データ可視化の基礎（ソフィア・リンドクヴィスト）<br>・10月25日 明快な報告書の書き方（ラヴィ・メノン）<br>・11月8日 遠隔チームの統率（グレース・アマディ）","各回の定員は18名で、先着順です。登録したうえで人事部に連絡せず欠席した社員は、翌期の待機リストの最後尾に回されます。","受講をご希望の方は、開催の5日前までにイントラネットの人事ページにある様式にご記入ください。管理職の承認が必要なのは11月の研修のみです。"]},{"id":10,"part":1,"cat":"請求書","theme":"請求書：支払い条件の案内","header":["NORTHGATE SUPPLY CO. — Invoice 7734","請求先: Ellery Design Studio","発行日: 15 July"],"body":["Item summary: 12 drafting tables ($325 each), 40 task lamps ($38 each), delivery and setup ($290). Subtotal: $5,710. Sales tax: $457. Total due: $6,167.","Payment is due within thirty days of the invoice date. Accounts settled within ten days qualify for a 2 percent early-payment discount, which will be deducted from your next invoice rather than this one.","Please note that the task lamps were shipped from our Denver facility and arrived separately; both deliveries are covered by this single invoice. A late fee of 1.5 percent per month applies to balances outstanding after 14 August.","Questions about this invoice should be directed to billing@northgatesupply.com, not to your sales representative."],"questions":[{"q":"When is the full payment due?","o":["July 25","September 15","August 14","August 30"],"a":2,"e":"発行日7月15日から30日以内なので8月14日。延滞料も「8月14日以降の残高」に発生する。"},{"q":"How is the early-payment discount applied?","o":["It is refunded by check","It is subtracted from the current total","It is added to the delivery charge","It is credited to a future invoice"],"a":3,"e":"「今回ではなく次回の請求書から差し引かれる」と明記されている。"},{"q":"What is indicated about the task lamps?","o":["They were installed by the studio","They were sent from a different location","They are subject to a late fee","They were billed separately"],"a":1,"e":"デンバーの施設から出荷され別便で到着したが、請求書は1通にまとめられている。"}],"ja":["ノースゲート・サプライ社 ― 請求書7734　請求先：エラリー・デザイン・スタジオ　発行日：7月15日","内訳：製図台12台（各325ドル）、作業用ランプ40個（各38ドル）、配送および設置（290ドル）。小計5,710ドル、消費税457ドル、請求総額6,167ドル。","お支払いは請求日から30日以内にお願いします。10日以内に決済された場合は2パーセントの早期支払割引の対象となりますが、割引は今回ではなく次回の請求書から差し引かれます。","なお、作業用ランプは当社デンバー施設から出荷され、別便で到着しました。両方の配送がこの1通の請求書に含まれています。8月14日以降の未払い残高には月1.5パーセントの延滞料が発生します。","本請求書に関するお問い合わせは、営業担当ではなく billing@northgatesupply.com までお願いします。"]},{"id":11,"part":1,"cat":"レビュー","theme":"レビュー：レストランの評価","header":["Posted by K. Halvorsen — ★★★★☆"],"body":["I had heard about Tamarind Row for months and finally booked a table for a colleague&#x27;s farewell dinner. The room is small — about a dozen tables — so reserve well ahead; we were told that Fridays fill up two weeks in advance.","The food deserves its reputation. The grilled sea bass was cooked precisely, and the vegetarian in our group said the eggplant dish was the best she had eaten in the city. Portions are modest, which suited us, though one of my colleagues ordered a second appetizer.","My only complaint concerns the noise. With hard floors and no curtains, conversation across the table was difficult once the room filled. The two window tables sit slightly apart from the rest, so I would return for the food but would ask for one of those."],"questions":[{"q":"What does the reviewer suggest readers do?","o":["Visit on a Friday evening","Avoid the vegetarian dishes","Book a table far in advance","Order two appetizers"],"a":2,"e":"席数が少なく、金曜は2週間前に埋まると聞いたので「早めの予約を」と勧めている。"},{"q":"What is the reviewer&#x27;s criticism of the restaurant?","o":["The dining room was loud","The portions were too large","The service was slow","The prices were too high"],"a":0,"e":"硬い床とカーテンのなさで騒がしく、会話が難しかったと述べている。"}],"ja":["投稿者 K・ハルヴォルセン ★★★★☆","タマリンド・ロウの評判は何か月も前から耳にしていて、同僚の送別会でようやく席を予約した。店内は12卓ほどと狭いので、かなり前もって予約したほうがよい。金曜は2週間前には埋まると言われた。","料理は評判どおりだ。スズキのグリルは火の通りが正確で、同席した菜食主義者はナスの料理をこの街で食べた中で最高だと言っていた。量は控えめで私たちには合っていたが、同僚の一人は前菜を追加注文していた。","不満は騒音だけだ。硬い床でカーテンもないため、店内が埋まると向かいの席との会話が難しかった。窓際の2卓だけは他の席から少し離れているので、料理のために再訪はするが、そのどちらかを希望するだろう。"]},{"id":12,"part":1,"cat":"プレスリリース","theme":"プレスリリース：新製品の発表","header":["FOR IMMEDIATE RELEASE — Vantage Instruments"],"body":["Vantage Instruments today introduced the QR-7, a portable water-testing device aimed at small municipal utilities. Weighing under two kilograms, the unit measures eleven common contaminants and transmits results directly to a supervisor&#x27;s phone.","Field trials were conducted with three utilities in rural districts, where samples previously had to be driven to a regional laboratory. Participants reported that results that once took two days were available in under an hour.","The QR-7 will ship in September at a list price of $4,200. Utilities serving fewer than 5,000 households qualify for a reduced rate through a program funded by the company&#x27;s foundation.","Vantage Instruments has manufactured laboratory equipment since 1978 and employs 620 people across four countries."],"questions":[{"q":"What is the QR-7 designed to do?","o":["Purify drinking water","Test water quality on site","Monitor household water use","Replace regional laboratories"],"a":1,"e":"携帯型の水質検査装置で、現場で汚染物質を測定する。浄化装置ではない。"},{"q":"What advantage did trial participants report?","o":["Much faster results","Easier staff training","Lower equipment costs","Fewer required samples"],"a":0,"e":"以前は2日かかった結果が1時間以内に得られるようになった。"},{"q":"Who can obtain the device at a lower price?","o":["Small utilities serving few households","Utilities in urban areas","Laboratories founded before 1978","Customers who order before September"],"a":0,"e":"5,000世帯未満に給水する事業体が割引の対象。"}],"ja":["即時発表用 ― ヴァンテージ・インスツルメンツ","ヴァンテージ・インスツルメンツは本日、小規模な自治体の水道事業者向けの携帯型水質検査装置QR-7を発表した。重量2キログラム未満で、一般的な汚染物質11種を測定し、結果を管理者の携帯電話に直接送信する。","実地試験は農村部の3事業者と実施された。これらの地域では以前、検体を地域の検査機関まで車で運ぶ必要があった。参加者からは、かつて2日を要した結果が1時間以内に得られたと報告があった。","QR-7は9月に出荷開始、希望小売価格は4,200ドル。5,000世帯未満に給水する事業者は、同社財団が資金を提供する制度を通じて割引価格の対象となる。","ヴァンテージ・インスツルメンツは1978年から実験機器を製造しており、4か国で620名を雇用している。"]},{"id":13,"part":1,"cat":"日程表","theme":"日程表：出張スケジュール","header":["Itinerary — H. Ozawa | Client visit, Bristol"],"body":["Tuesday 6 June<br>07:40  Depart Paddington (train, seat 24A)<br>09:25  Arrive Bristol Temple Meads<br>10:30  Site tour, Calderwood Packaging (meet J. Obi at reception)<br>13:00  Lunch with procurement team, The Old Mill<br>15:00  Presentation, Calderwood boardroom<br>18:20  Return train<br><br>Wednesday 7 June<br>09:00  Follow-up call with J. Obi (from office)","Notes: The site tour requires safety footwear; a pair will be provided at reception if you do not bring your own. The presentation slides must be sent to Calderwood&#x27;s IT contact by noon on Monday 5 June — their system does not accept external drives.","If the morning train is delayed by more than thirty minutes, contact Ms. Obi directly; she has offered to move the tour to the afternoon and hold the presentation first."],"questions":[{"q":"What must Mr. Ozawa do before Tuesday?","o":["Confirm the lunch reservation","Purchase safety footwear","Send his presentation file in advance","Reserve a seat on the return train"],"a":2,"e":"「月曜正午までにスライドをIT担当に送ること」と指示がある。外部ドライブは使えない。"},{"q":"What will happen if the train is significantly delayed?","o":["The lunch will be canceled","Ms. Obi will meet him at the station","The visit will be postponed to Wednesday","The presentation may be held before the tour"],"a":3,"e":"30分超の遅延時は見学を午後に回し、先に発表を行うと申し出ている。"}],"ja":["旅程表 ― 小沢H.　顧客訪問（ブリストル）","6月6日（火）<br>07:40 パディントン発（列車、24A席）<br>09:25 ブリストル・テンプルミーズ着<br>10:30 カルダーウッド・パッケージング社の施設見学（受付でJ・オビ氏と合流）<br>13:00 調達チームと昼食（ジ・オールド・ミル）<br>15:00 プレゼンテーション（カルダーウッド社役員室）<br>18:20 帰りの列車<br><br>6月7日（水）<br>09:00 J・オビ氏とのフォローアップ通話（社内から）","注記：施設見学には安全靴が必要です。ご持参がない場合は受付で貸与されます。プレゼン資料は6月5日（月）正午までにカルダーウッド社のIT担当に送付してください。先方のシステムは外部ドライブを受け付けません。","朝の列車が30分以上遅延する場合は、オビ氏に直接ご連絡ください。見学を午後に移し、先にプレゼンテーションを行うと申し出ています。"]},{"id":14,"part":1,"cat":"取扱説明","theme":"取扱説明：コーヒーマシンの使い方","header":["Break Room Notice — Model CB-200"],"body":["Please read before using the new machine.","1. Fill the tank with cold water only; hot water damages the sensor. 2. Insert a pod and close the lid until it clicks. 3. Select cup size. The green light indicates the machine is ready; a blinking amber light means the tank is low.","The drip tray should be emptied whenever the float rises above the grille. Used pods go in the compost bin, not the recycling bin — the outer layer is plant-based.","If the machine stops mid-cycle, do not open the lid. Unplug it, wait sixty seconds, and plug it in again. Report persistent faults to Facilities, who will pass them to the building manager; under our service contract, only the building manager may call the vendor."],"questions":[{"q":"What does a blinking amber light indicate?","o":["The water tank needs refilling","The drip tray is full","The machine is ready","A pod is jammed"],"a":0,"e":"「点滅する黄色は水量が少ないことを示す」と書かれている。"},{"q":"What should be done with used pods?","o":["Place them in the compost bin","Place them in the recycling bin","Return them to the vendor","Rinse them before disposal"],"a":0,"e":"外装が植物由来のため、リサイクル箱ではなく堆肥用の箱へ。"},{"q":"Who should contact the vendor about repeated problems?","o":["The building manager","Any employee","The Facilities team","The pod supplier"],"a":0,"e":"保守契約により、連絡はすべて建物管理者から行う必要がある。社員はまずFacilitiesに報告する。"}],"ja":["休憩室のお知らせ ― CB-200型","ご使用の前にお読みください。","1. タンクには冷水のみを入れてください。熱湯はセンサーを損傷します。2. ポッドを入れ、カチッと音がするまで蓋を閉めます。3. カップサイズを選びます。緑のランプは使用可能を示し、黄色の点滅はタンクの水量が少ないことを示します。","受け皿は、フロートが格子より上に浮いたら必ず空にしてください。使用済みポッドはリサイクル箱ではなく堆肥用の箱へ。外装が植物由来のためです。","動作の途中で停止した場合は蓋を開けないでください。電源を抜き、60秒待ってから差し直してください。繰り返し不具合が起きる場合は施設管理部に報告してください。同部から建物管理者に伝えられます。保守契約により、販売業者に連絡できるのは建物管理者のみです。"]},{"id":15,"part":1,"cat":"Eメール","theme":"Eメール：面接日程の連絡","header":["宛先: Lucia Ferrante","差出人: Recruitment, Bellwether Analytics","件名: Next steps"],"body":["Dear Ms. Ferrante,","Thank you for your application for the Junior Data Analyst position. We were impressed by the sample dashboard you submitted and would like to invite you to a first-round interview.","The interview will last about forty-five minutes and will be conducted by video. You will be asked to walk through one project from your portfolio and to answer a short set of technical questions; no live coding is involved.","Please choose one of the following slots and reply to this message: Tuesday 14 May at 10:00, Wednesday 15 May at 14:00, or Friday 17 May at 09:30. If none of these suit you, let us know your availability for the following week.","A link will be sent the day before. Please test your microphone in advance, as we cannot extend the session if there are technical difficulties.","Best regards,","Recruitment Team"],"questions":[{"q":"What impressed the company about Ms. Ferrante&#x27;s application?","o":["Her previous employer","Her academic record","A dashboard she created","A recommendation letter"],"a":2,"e":"提出されたサンプルのダッシュボードに感銘を受けたと述べている。"},{"q":"What is stated about the interview?","o":["It will take place in person","It cannot be extended","It will include a coding test","It will last ninety minutes"],"a":1,"e":"技術的な問題があっても時間を延長できないと明記されている。ライブコーディングはない。"},{"q":"What is Ms. Ferrante asked to do?","o":["Prepare a new dashboard","Call the recruitment team","Select an interview time","Send an updated résumé"],"a":2,"e":"3つの候補から1つを選んで返信するよう求めている。"}],"ja":["宛先：ルシア・フェランテ　差出人：ベルウェザー・アナリティクス採用担当　件名：次の段階について","フェランテ様","ジュニア・データアナリスト職へのご応募ありがとうございます。ご提出いただいたサンプルのダッシュボードに感銘を受けましたので、一次面接にご案内したく存じます。","面接は約45分間、ビデオ形式で行います。ポートフォリオから1つの案件について説明していただき、技術的な質問にいくつかお答えいただきます。その場でのコーディングはありません。","以下のいずれかの枠をお選びのうえ、本メールにご返信ください。5月14日（火）10時、5月15日（水）14時、5月17日（金）9時30分。ご都合が合わない場合は、翌週のご都合をお知らせください。","リンクは前日にお送りします。技術的な問題が生じても時間を延長できませんので、あらかじめマイクの動作をご確認ください。","採用チーム"]},{"id":16,"part":1,"cat":"お知らせ","theme":"お知らせ：駐車場の工事","header":["ATTENTION — Employee Parking"],"body":["Resurfacing of the main employee lot will take place over three weekends beginning Saturday, 12 August. The lot will be closed from 6:00 A.M. Saturday until 6:00 A.M. Monday on each of those weekends.","Employees scheduled for weekend shifts may use the visitor lot on Sherman Street at no charge; display the temporary pass that will be distributed by your supervisor this week. The pass is valid only on the three affected weekends.","Weekday parking is unaffected. However, the twelve spaces nearest the loading dock will be permanently reassigned to delivery vehicles once the work is finished. Employees who currently park there will be issued new space numbers in September.","We regret any inconvenience. Direct questions to the Facilities office, not to Security."],"questions":[{"q":"When will the main lot be unavailable?","o":["On three consecutive weekends","Only on Saturday mornings","For three full weeks","Every weekday in August"],"a":0,"e":"8月12日から3週にわたる週末、土曜午前6時から月曜午前6時まで閉鎖される。"},{"q":"What is required to park on Sherman Street?","o":["Approval from Security","A payment at the gate","A temporary pass","A reservation in advance"],"a":2,"e":"上司から配布される一時許可証を掲示する必要がある。"},{"q":"What permanent change is mentioned?","o":["Parking fees will be introduced","The visitor lot will be closed","Some spaces will be reserved for deliveries","Weekend shifts will be eliminated"],"a":2,"e":"荷積み場に最も近い12台分は工事後、配送車両用に恒久的に振り替えられる。"}],"ja":["お知らせ ― 従業員駐車場","従業員用の主要駐車場の舗装改修を、8月12日（土）から3週にわたる週末に実施します。各週末とも、土曜午前6時から月曜午前6時まで閉鎖されます。","週末勤務の従業員は、シャーマン通りの来客用駐車場を無料でご利用いただけます。今週上司から配布される一時許可証を掲示してください。この許可証は対象の3週末のみ有効です。","平日の駐車に影響はありません。ただし、荷積み場に最も近い12台分は、工事完了後に配送車両用へ恒久的に振り替えられます。現在そこに駐車している従業員には9月に新しい区画番号が発行されます。","ご不便をおかけしますことをお詫びします。ご質問は警備部ではなく施設管理事務所までお願いします。"]},{"id":17,"part":1,"cat":"社内報","theme":"社内報：表彰の告知","header":["Fairmont Group Staff Newsletter — Issue 112"],"body":["Congratulations to Yusuf Adeyemi of the Client Services team, who received this year&#x27;s Bridge Award. The award recognizes an employee who has improved cooperation between departments.","Yusuf was nominated by colleagues in both Client Services and Operations for redesigning the handover checklist used when an account moves from the Sales team to Client Services. Since the new checklist was adopted in February, the number of accounts requiring a second handover has fallen by roughly half.","The award was presented at the quarterly all-staff meeting by managing director Helena Sørensen, who noted that the change had been proposed twice before but never carried through. Yusuf will represent the group at the industry conference in Lisbon in October.","Nominations for the next cycle open in January."],"questions":[{"q":"What is the Bridge Award given for?","o":["Improving cooperation across departments","Attracting new clients","Increasing annual sales","Reducing operating costs"],"a":0,"e":"部門間の協働を改善した社員を表彰するものと説明されている。"},{"q":"What was the result of Mr. Adeyemi&#x27;s change?","o":["Client complaints doubled","A new department was created","Fewer accounts needed a second handover","The sales team was reorganized"],"a":2,"e":"2月の導入以来、引き継ぎのやり直しが必要な案件が約半減した。"},{"q":"What did Ms. Sørensen mention about the proposal?","o":["It had been suggested before without success","It will be reviewed in January","It came from the Operations team","It was tested in Lisbon first"],"a":0,"e":"過去に2度提案されたが実現しなかったと述べている。"}],"ja":["フェアモント・グループ社内報 第112号","クライアントサービス部のユスフ・アデイェミ氏が本年度のブリッジ賞を受賞しました。おめでとうございます。この賞は部門間の協働を改善した社員を表彰するものです。","ユスフ氏は、案件が営業チームからクライアントサービス部へ移る際に用いる引き継ぎ確認表を再設計したことで、クライアントサービス部と業務部双方の同僚から推薦されました。2月に新しい確認表が採用されて以来、引き継ぎのやり直しが必要な案件は約半分に減りました。","表彰は四半期の全社会議でヘレナ・セーレンセン専務から行われ、この変更は過去に2度提案されながら実現しなかったと述べられました。ユスフ氏は10月にリスボンで開かれる業界会議にグループ代表として出席します。","次回の推薦受付は1月に開始します。"]},{"id":18,"part":1,"cat":"報告書","theme":"報告書：顧客アンケートの結果","header":["Customer Survey Summary — Q2"],"body":["We received 1,840 responses, a 22 percent response rate, which is the highest since we began the survey three years ago.","Satisfaction with product quality remained steady at 4.4 out of 5. Delivery speed rose from 3.8 to 4.1 following the opening of the Leeds warehouse. The lowest-rated area was the returns process at 3.2, down slightly from 3.3 in Q1.","Written comments about returns most often mentioned the requirement to print a shipping label at home. Roughly one in four respondents who returned an item said they did not have access to a printer.","The Operations team is evaluating a system that would allow customers to show a code at a drop-off point instead. A pilot in two regions is planned for Q4."],"questions":[{"q":"What is indicated about the response rate?","o":["It has remained unchanged for three years","It was the highest recorded so far","It was based on 1,840 customers contacted","It declined from the previous quarter"],"a":1,"e":"調査開始から3年で最も高い回答率だったと述べられている。"},{"q":"Which area received the lowest rating?","o":["Product quality","Customer support","The returns process","Delivery speed"],"a":2,"e":"返品手続きが3.2で最低。前四半期の3.3からわずかに低下している。"},{"q":"What problem was most frequently reported about returns?","o":["High return shipping fees","Difficulty printing a label","Slow refunds","Confusing instructions"],"a":1,"e":"自宅でのラベル印刷が必要な点への言及が最多で、4人に1人がプリンターを持たないと回答した。"}],"ja":["顧客アンケート要約 ― 第2四半期","1,840件の回答を得ました。回答率は22パーセントで、3年前に調査を開始して以来最高です。","製品品質への満足度は5点満点中4.4で横ばいでした。配送速度はリーズ倉庫の開設を受けて3.8から4.1へ上昇しました。最も評価が低かったのは返品手続きで3.2、第1四半期の3.3からわずかに低下しました。","返品に関する自由記述で最も多く言及されたのは、自宅で配送ラベルを印刷する必要がある点でした。返品した回答者のおよそ4人に1人が、プリンターを利用できないと述べています。","業務チームは、代わりに持ち込み地点でコードを提示できる仕組みを検討しています。第4四半期に2地域での試験導入を予定しています。"]},{"id":19,"part":1,"cat":"Eメール","theme":"Eメール：契約更新の案内","header":["宛先: subscribers@list.orchardpress.com","差出人: Orchard Press Subscriptions","件名: Your subscription — action needed by 31 March"],"body":["Your annual subscription to Orchard Quarterly expires on 31 March. To continue receiving the journal without interruption, please renew before that date.","Rates for the coming year are unchanged for print-only and digital-only subscribers. The combined print-and-digital rate has increased by £6 to cover higher postage costs; subscribers who renew before 15 March will be charged the previous rate.","If you renew after 31 March, your access will be restored within one business day, but any issues published in the meantime will not be sent retroactively. Institutional subscribers should contact us directly rather than using the online form, as multi-user access must be configured manually.","You can update your delivery address at the same time. Please note that we cannot forward copies to a temporary address for periods shorter than three months."],"questions":[{"q":"Which subscribers face a price increase?","o":["Digital-only subscribers","Print-and-digital subscribers","Print-only subscribers","All subscribers"],"a":1,"e":"郵送費上昇のため、印刷＋デジタルの併用購読のみ6ポンド値上げ。"},{"q":"What happens if a subscriber renews late?","o":["Missed issues are not sent","The subscription is canceled permanently","Access takes one week to restore","A late fee is charged"],"a":0,"e":"空白期間に発行された号は遡って送られない。アクセス復旧は1営業日以内。"},{"q":"What are institutional subscribers instructed to do?","o":["Contact the publisher directly","Renew before 15 March","Provide a temporary address","Use the online renewal form"],"a":0,"e":"複数ユーザーの設定は手作業のため、オンライン様式ではなく直接連絡するよう求めている。"}],"ja":["宛先：購読者各位　差出人：オーチャード・プレス購読係　件名：ご購読について ― 3月31日までにお手続きを","オーチャード・クオータリーの年間購読は3月31日に満了します。中断なく受け取るには、その日までに更新をお願いします。","来年度の料金は、印刷版のみ・デジタル版のみの購読者については据え置きです。印刷＋デジタルの併用料金は郵送費の上昇分を賄うため6ポンド値上げとなりますが、3月15日までに更新された方には従来の料金を適用します。","3月31日以降に更新された場合、アクセスは1営業日以内に復旧しますが、その間に発行された号が遡って送付されることはありません。機関購読の方は、複数ユーザーのアクセス設定を手作業で行う必要があるため、オンライン様式ではなく直接ご連絡ください。","同時に配送先住所も変更できます。なお、3か月未満の期間について仮の住所へ転送することはできません。"]},{"id":20,"part":1,"cat":"お知らせ","theme":"お知らせ：図書館の時間変更","header":["Ridgeway Public Library — Notice of Revised Hours"],"body":["From 1 September the library will open at 9:00 A.M. on weekdays instead of 8:00 A.M. Closing time on Tuesdays and Thursdays will be extended from 6:00 P.M. to 8:00 P.M. Saturday hours are unchanged, and the library will remain closed on Sundays.","The change follows a six-month study of entry data showing that fewer than fifteen visitors typically arrived before nine, while evening use has grown steadily, particularly among students.","The self-service returns slot beside the main door remains accessible at all hours. Items placed there overnight are processed the following morning but are recorded as having been returned the day before, so borrowers will not incur late charges.","Meeting rooms may now be reserved until 7:30 P.M. on the two extended evenings. Reservations continue to be free for community groups but require a deposit for private events."],"questions":[{"q":"What change takes effect on 1 September?","o":["Weekday hours will be reduced overall","The library will close on Saturdays","Sunday service will begin","The library will open one hour later on weekdays"],"a":3,"e":"平日の開館が午前8時から9時に変更される。火・木は閉館が2時間延長される。"},{"q":"Why was the change made?","o":["Because early morning use was low","To reduce staffing costs","Because of building repairs","At the request of community groups"],"a":0,"e":"9時前の来館者が通常15人未満だったという調査結果に基づく。"},{"q":"What is stated about items returned after closing?","o":["They are dated as of the previous day","They must be handed to a staff member","They are subject to a small fee","They cannot be returned until morning"],"a":0,"e":"閉館後に返却口へ入れられた資料は前日返却として記録され、延滞料は発生しない。"}],"ja":["リッジウェイ公共図書館 ― 開館時間変更のお知らせ","9月1日より、平日の開館時刻を午前8時から午前9時に変更します。火曜日と木曜日の閉館時刻は午後6時から午後8時に延長します。土曜日の時間に変更はなく、日曜日は引き続き休館です。","この変更は、6か月間の入館データ調査に基づくものです。9時前の来館者は通常15人未満である一方、夕方の利用、とりわけ学生の利用が着実に増えていることが分かりました。","正面扉横の自動返却口は終日ご利用いただけます。夜間に投函された資料は翌朝に処理されますが、その前日に返却されたものとして記録されるため、延滞料は発生しません。","会議室は、延長される2つの夜間について午後7時30分まで予約できるようになります。地域団体の予約は引き続き無料ですが、私的な催しには保証金が必要です。"]},{"id":21,"part":2,"cat":"Eメール","theme":"Eメール：講演の依頼","header":["宛先: Dr. Ingrid Solberg","差出人: Marcus Yeo, Programme Chair","日付: 21 January","件名: Invitation — Regional Supply Chain Forum"],"body":["Dear Dr. Solberg,","On behalf of the organising committee, I am writing to invite you to give the opening address at this year&#x27;s forum, to be held in Rotterdam on 9 and 10 April. Your paper on port congestion was cited repeatedly at last year&#x27;s event, and several attendees asked whether you might speak in person.","The address would run thirty minutes, followed by fifteen minutes of questions. We can cover your travel and two nights&#x27; accommodation, though our budget does not allow for a speaking fee.","If April does not suit you, we also hold a smaller seminar each November and would gladly move the invitation to that event. Please reply by 5 February so that we can finalise the programme.","Kind regards,","Marcus Yeo"],"questions":[{"q":"Why does Mr. Yeo mention last year&#x27;s event?","o":["To announce the number of attendees","To apologize for a scheduling error","To describe a change in the programme","To explain why Dr. Solberg was chosen"],"a":3,"e":"前回の会合で論文が繰り返し引用され、本人の講演を望む声があったことが依頼の理由。"},{"q":"What is NOT offered to Dr. Solberg?","o":["Payment for travel","A question-and-answer session","A speaking fee","Two nights of lodging"],"a":2,"e":"「予算の都合で講演料は出せない」と明記されている。"},{"q":"What alternative does Mr. Yeo propose?","o":["Submitting a written paper instead","Presenting by video","Sharing the session with another speaker","Speaking at an event later in the year"],"a":3,"e":"4月が難しければ秋の小規模セミナーに招待を移すと述べている。"}],"ja":["宛先：イングリッド・ソルベリ博士　差出人：マーカス・ヨー（プログラム委員長）　件名：地域サプライチェーン・フォーラムへのご招待","ソルベリ博士","組織委員会を代表し、4月9日・10日にロッテルダムで開催する本年度のフォーラムにて開会講演をお願いしたく、ご連絡いたします。港湾の混雑に関する先生の論文は昨年の会合で繰り返し引用され、複数の参加者から直接お話を伺えないかとの声がありました。","講演は30分、その後15分の質疑応答を予定しています。交通費と2泊分の宿泊費は当方で負担できますが、予算の都合上、講演料はお支払いできません。","4月がご都合に合わない場合、11月にも小規模なセミナーを開催しておりますので、そちらへご招待を移すことも可能です。プログラムを確定したいため、2月5日までにご返信いただければ幸いです。","マーカス・ヨー"]},{"id":22,"part":2,"cat":"お知らせ","theme":"お知らせ：システム停止の予告","header":["IT SERVICE NOTICE — Planned Downtime"],"body":["The employee portal, including timesheets and expense claims, will be unavailable from 8:00 P.M. Friday, 22 March until 6:00 A.M. Monday, 25 March while the database is migrated to a new server.","Staff who normally submit timesheets on Sunday evening should do so by Friday afternoon instead. Late submissions caused by the outage will not affect payroll, but Finance has asked that entries be completed early wherever possible.","E-mail and the shared drive are hosted separately and will not be affected. The customer database, however, sits on the same server as the portal and will be read-only during the migration; sales staff can view records but cannot enter new ones.","If the portal is still unavailable after 6:00 A.M. Monday, do not submit a help ticket. Updates will be posted on the intranet home page every two hours until service is restored."],"questions":[{"q":"What will be unavailable during the weekend?","o":["The shared drive","The employee portal","The intranet home page","E-mail service"],"a":1,"e":"メールと共有ドライブは別サーバーで影響なし。停止するのは社員用ポータル。"},{"q":"What are sales staff able to do during the migration?","o":["Export the customer database","Edit customer contact details","Add new customer records","View existing customer records"],"a":3,"e":"顧客データベースは読み取り専用となり、閲覧はできるが新規入力はできない。"},{"q":"What should employees do if the outage continues past Monday morning?","o":["Check the intranet for updates","Wait two hours and try again","Contact the Finance department","Submit a help ticket"],"a":0,"e":"「問い合わせ票は出さず、2時間ごとにイントラネットで更新を確認」と指示している。"}],"ja":["ITサービスのお知らせ ― 計画停止","データベースを新サーバーへ移行するため、勤務表と経費申請を含む社員用ポータルを、3月22日（金）午後8時から3月25日（月）午前6時まで停止します。","通常日曜の夜に勤務表を提出している社員は、代わりに金曜の午後までに提出してください。停止による提出の遅れが給与に影響することはありませんが、可能な限り早めに入力を済ませるよう財務部から依頼が出ています。","メールと共有ドライブは別のサーバーで運用されており、影響を受けません。一方、顧客データベースはポータルと同じサーバー上にあるため、移行中は読み取り専用となります。営業担当は記録を閲覧できますが、新規入力はできません。","月曜午前6時を過ぎてもポータルが復旧しない場合、問い合わせ票は提出しないでください。復旧までイントラネットのトップページに2時間ごとに状況を掲載します。"]},{"id":23,"part":2,"cat":"広告","theme":"広告：フィットネスクラブの入会","header":["HARBOUR ATHLETIC CLUB — New Year Offer"],"body":["Join before 31 January and pay no registration fee, normally £45. Monthly membership starts at £29 for off-peak access (weekdays before 4:00 P.M.) and £46 for unlimited access.","All memberships include use of the pool, the weights room, and more than forty group classes each week. Personal training sessions are booked separately and are not covered by any membership tier.","New members receive one complimentary fitness assessment, which must be used within six weeks of joining. Assessments are offered on Tuesday and Thursday mornings and fill quickly, so book at the front desk on your first visit.","Members who refer a friend receive one free month once the friend has paid for three months. There is no limit to the number of referrals."],"questions":[{"q":"What is waived for those who join in January?","o":["The pool access fee","The monthly fee","The registration fee","The class booking fee"],"a":2,"e":"通常45ポンドの入会金が免除される。月会費は免除されない。"},{"q":"What is stated about personal training?","o":["It requires a separate booking and payment","It is included in unlimited memberships","It is free for the first six weeks","It is available only off-peak"],"a":0,"e":"個人指導は別途予約で、どの会員種別にも含まれないとある。"},{"q":"How can a member earn a free month?","o":["By attending forty classes","By upgrading to unlimited access","By booking a fitness assessment","By introducing a friend who pays for three months"],"a":3,"e":"紹介した友人が3か月分を支払った時点で1か月無料になる。"}],"ja":["ハーバー・アスレチック・クラブ ― 新年キャンペーン","1月31日までにご入会いただくと、通常45ポンドの入会金が無料になります。月会費はオフピーク利用（平日午後4時まで）が29ポンドから、時間制限なしの利用が46ポンドからです。","いずれの会員資格にも、プール、ウェイトルーム、週40以上のグループレッスンの利用が含まれます。個人指導は別途予約制で、どの会員区分にも含まれません。","新規会員の方には無料の体力測定を1回ご提供します。入会後6週間以内にご利用ください。測定は火曜と木曜の午前に実施しており、すぐに埋まりますので、初回来館時に受付でご予約ください。","ご友人を紹介された会員には、その友人が3か月分をお支払いになった時点で1か月分を無料進呈します。紹介回数に上限はありません。"]},{"id":24,"part":2,"cat":"求人広告","theme":"求人広告：ホテルの接客係","header":["Front Desk Associate — The Calder Hotel, Inverness"],"body":["The Calder Hotel is hiring two Front Desk Associates for its 96-room property in central Inverness. Duties include checking guests in and out, handling reservation changes, and coordinating with housekeeping when rooms are not ready.","We are looking for candidates who remain calm during busy periods and who can work a rotating schedule that includes evenings, weekends, and some public holidays. Previous hotel experience is welcome but not essential; we provide four weeks of paid training.","Conversational ability in a second language is an advantage, as roughly a third of our guests travel from overseas.","Applications should be submitted through our Web site and close on 14 March. Please do not telephone the hotel to check on your application; all applicants will receive a decision by e-mail within three weeks of that date."],"questions":[{"q":"What is one requirement of the position?","o":["Willingness to work varied shifts","Fluency in two languages","At least one year of hotel experience","A degree in hospitality management"],"a":0,"e":"夕方・週末・祝日を含む交代勤務ができることが求められている。ホテル経験は必須ではない。"},{"q":"What does the hotel provide to new employees?","o":["A signing bonus","A month of paid training","Language lessons","Accommodation near the property"],"a":1,"e":"4週間の有給研修を提供するとある。"},{"q":"What are applicants asked not to do?","o":["Send a paper application","Call the hotel about their application","Contact the housekeeping department","Apply more than once"],"a":1,"e":"「応募状況の確認で電話しないように」と明記されている。"}],"ja":["フロント係募集 ― カルダー・ホテル（インバネス）","カルダー・ホテルでは、インバネス中心部にある96室の当館にてフロント係を2名募集します。業務内容は、宿泊客のチェックイン・チェックアウト対応、予約変更の処理、客室が整っていない場合の客室清掃部門との調整です。","繁忙時にも落ち着いて対応でき、夕方・週末・一部の祝日を含む交代勤務が可能な方を求めています。ホテルでの経験があれば歓迎しますが必須ではありません。4週間の有給研修を用意しています。","当館の宿泊客のおよそ3分の1は海外からお越しになるため、第二言語での日常会話ができる方は有利です。","応募は当館ウェブサイトからお願いします。締切は3月14日です。応募状況の確認のためにホテルへお電話なさらないでください。応募者全員に、締切から3週間以内にメールで結果をお知らせします。"]},{"id":25,"part":2,"cat":"社内文書","theme":"社内文書：在宅勤務方針の見直し","header":["MEMORANDUM","宛先: All departments","差出人: People Operations","日付: 4 February"],"body":["Following the review completed in January, the remote work policy will change on 1 April. Employees may work remotely up to three days per week, an increase from two, provided that Tuesday is spent in the office.","Tuesday has been designated as the shared in-office day for every department so that cross-team meetings can be scheduled without checking individual calendars. Teams that cannot meet this requirement should submit an exception request to their director before 15 March.","Desk sharing will begin at the same time. Employees who work remotely three days a week will no longer have an assigned desk and should book a workspace through the room system. Those in the office three days or more retain their current desks.","The policy will be reviewed again in October."],"questions":[{"q":"What is changing on 1 April?","o":["The number of departments","The office opening hours","The number of remote days allowed","The review schedule"],"a":2,"e":"在宅勤務が週2日から3日に増える。"},{"q":"Why has Tuesday been selected?","o":["To allow cross-team meetings to be arranged easily","At the request of the directors","Because the office is cleaned on other days","It is the least busy day"],"a":0,"e":"全部門共通の出社日にすることで、個々の予定を確認せずに部門横断の会議を組めるようにするため。"},{"q":"Who will lose an assigned desk?","o":["Employees who work in the office four days","Employees who work remotely three days","All employees","Directors only"],"a":1,"e":"週3日在宅の社員は固定席がなくなり、予約制になる。"}],"ja":["社内連絡","1月に完了した見直しを受け、在宅勤務方針を4月1日に変更します。火曜日を出社日とすることを条件に、在宅勤務は従来の週2日から週3日まで認められます。","火曜日は全部門共通の出社日と定めました。これにより、各人の予定を確認せずとも部門横断の会議を設定できるようになります。この条件を満たせないチームは、3月15日までに部門長へ例外申請を提出してください。","同時に席の共用も開始します。週3日在宅勤務をする社員には固定席がなくなり、会議室システムから作業席を予約していただきます。週3日以上出社する社員は現在の席を維持します。","本方針は10月に再度見直します。"]},{"id":26,"part":2,"cat":"記事","theme":"記事：商店街の歩行者専用化","header":["Marlow Weekly — 3 June"],"body":["The town council voted on Monday to close Bridge Street to vehicles on Saturdays from July through September. The three-month trial follows a petition signed by 1,200 residents.","Shop owners are divided. Ana Kowalczyk, who runs a bakery on the street, expects more foot traffic and has ordered additional outdoor seating. Others worry about deliveries; the council has confirmed that delivery vehicles may enter before 10:00 A.M.","Parking normally available on Bridge Street will be redirected to the Sheldon Road lot, which the council will make free on Saturdays for the duration of the trial. A shuttle will run every twenty minutes between the lot and the town square.","Data on visitor numbers and shop takings will be collected throughout and presented at the October council meeting, when a decision on making the closure permanent will be made."],"questions":[{"q":"What prompted the council&#x27;s decision?","o":["A recommendation from the bakery","A study of parking demand","A request from shop owners","A petition from residents"],"a":3,"e":"住民1,200人が署名した請願を受けての決定。"},{"q":"What concession has been made for businesses?","o":["Shops may extend their opening hours","Deliveries are permitted early in the morning","Outdoor seating is provided free of charge","Parking fees will be refunded"],"a":1,"e":"配送車両は午前10時前なら進入できると議会が確認している。"},{"q":"What will happen in October?","o":["Parking charges will be introduced","The trial will be extended to Sundays","The shuttle service will begin","The council will decide whether to continue the closure"],"a":3,"e":"10月の議会で、恒久化するかどうかの判断が下される。"}],"ja":["マーロー・ウィークリー 6月3日","町議会は月曜、7月から9月までの土曜日にブリッジ通りを車両通行止めにすることを可決した。この3か月間の試験実施は、住民1,200人が署名した請願を受けたものである。","商店主の意見は分かれている。同通りでパン屋を営むアナ・コワルチクは歩行者の増加を見込み、屋外席を追加発注した。一方で配送を懸念する声もあり、議会は配送車両が午前10時前であれば進入できると確認している。","普段ブリッジ通りに停められる駐車はシェルドン通りの駐車場へ振り替えられ、試験期間中の土曜日は議会が同駐車場を無料とする。同駐車場と町の広場の間には20分間隔で送迎バスが運行される。","期間を通じて来訪者数と商店の売上のデータが収集され、10月の議会で報告される。その場で通行止めを恒久化するかどうかが判断される。"]},{"id":27,"part":2,"cat":"手紙","theme":"手紙：寄付への礼状","header":["Thornbury Community Trust","14 October"],"body":["Dear Mr. Achebe,","Thank you for your gift of £2,500 to the Riverside Path project. Your contribution brings the total raised to £41,000, which is within £4,000 of our target.","Because of donations like yours, resurfacing of the first section began last week and should be finished before the winter. The £4,000 still to be raised will pay for lighting along the stretch between the mill and the footbridge, an area residents have identified as the least safe after dark.","You indicated on your form that you would prefer not to be listed on the donor board. We have respected that request, and your name will not appear in the newsletter either.","You are warmly invited to the opening walk on 15 March. An invitation will follow in February.","With thanks,","Priya Nandakumar, Trust Secretary"],"questions":[{"q":"How much more is needed to reach the target?","o":["£41,000","£45,000","£4,000","£2,500"],"a":2,"e":"「目標まで4,000ポンド以内のところまで来た」とある。"},{"q":"What will the remaining money be used for?","o":["Resurfacing the first section","Printing the newsletter","Installing lighting","Repairing the footbridge"],"a":2,"e":"製粉所と歩道橋の間の区間に照明を設置する費用に充てられる。"},{"q":"What request did Mr. Achebe make?","o":["To donate in monthly instalments","To receive a receipt for tax purposes","To attend the opening walk","To remain anonymous"],"a":3,"e":"寄付者一覧に名前を載せないでほしいという要望で、会報にも掲載しないと伝えている。"}],"ja":["ソーンベリー地域基金 10月14日","アチェベ様","リバーサイド・パス事業へ2,500ポンドのご寄付をいただき、ありがとうございます。お寄せいただいたことで募金総額は41,000ポンドとなり、目標まで4,000ポンドを切りました。","皆様のご寄付のおかげで、第1区間の舗装改修が先週始まり、冬までに完了する見込みです。これから集める残り4,000ポンドは、製粉所と歩道橋の間の区間の照明に充てられます。この一帯は日没後に最も安全でない場所として住民から指摘されていました。","申込書にて、寄付者掲示板へのお名前掲載を希望されない旨をご記入いただきました。ご意向を尊重し、会報にもお名前は掲載いたしません。","3月15日の開通ウォークにぜひご参加ください。ご案内は2月にお送りします。","プリヤ・ナンダクマール（基金書記）"]},{"id":28,"part":2,"cat":"チャット","theme":"チャット：イベント設営の調整","header":["Team chat — Thursday, 4:40 P.M."],"body":["<b>Leah Fontaine (4:40 P.M.)</b> The riser for the stage arrived, but it's the six-metre version, not the four-metre one we ordered.","<b>Dev Anand (4:42 P.M.)</b> Will it fit? The back wall is about seven metres across.","<b>Leah Fontaine (4:43 P.M.)</b> It fits, but then the side door is blocked, and that's the accessible entrance. Fire safety won't sign off on that.","<b>Dev Anand (4:45 P.M.)</b> Then we send it back. Can the supplier swap it before Saturday?","<b>Leah Fontaine (4:47 P.M.)</b> Their driver is already on the way to another job. Earliest is Friday afternoon, which leaves us no margin.","<b>Dev Anand (4:49 P.M.)</b> Let's take Friday afternoon and move the rehearsal to Saturday morning. I'd rather rehearse late than block that door."],"questions":[{"q":"What is the problem?","o":["A component of the wrong size was delivered","The stage was delivered to the wrong address","The venue is smaller than expected","The supplier canceled the order"],"a":0,"e":"注文した4メートルではなく6メートルの舞台台が届いた。"},{"q":"Why can the riser not be used as delivered?","o":["It is too wide for the back wall","It requires additional assembly","It is damaged","It would obstruct the accessible entrance"],"a":3,"e":"設置すると側面の扉（バリアフリー用の入口）がふさがれ、防火安全上認められない。"},{"q":"At 4:49 P.M., what does Mr. Anand mean when he writes, &quot;I&#x27;d rather rehearse late than block that door&quot;?","o":["He wants to cancel the rehearsal","He prefers to rehearse on Friday evening","He thinks the door should be closed permanently","He accepts a delay in order to keep the entrance clear"],"a":3,"e":"リハーサルを土曜午前にずらしてでも、入口をふさがない方を選ぶという意思表示。"}],"ja":["チームチャット 木曜日 午後4時40分","リア・フォンテーヌ（4:40）舞台の台が届きましたが、注文した4メートル用ではなく6メートル用です。","デヴ・アナンド（4:42）収まりますか。奥の壁は幅7メートルほどですよね。","リア・フォンテーヌ（4:43）収まりはします。ただ側面の扉がふさがれてしまい、そこがバリアフリーの入口なんです。防火安全の担当は認めないでしょう。","デヴ・アナンド（4:45）では返送しましょう。業者は土曜日までに交換できますか。","リア・フォンテーヌ（4:47）先方の運転手はもう別の現場へ向かっています。最短で金曜の午後で、余裕はまったくありません。","デヴ・アナンド（4:49）金曜午後で受けて、リハーサルを土曜の午前に移しましょう。あの扉をふさぐくらいなら、リハーサルが遅くなるほうがましです。"]},{"id":29,"part":2,"cat":"案内","theme":"案内：展示会への出展案内","header":["Nordic Packaging Expo — Exhibitor Information"],"body":["The 2026 expo will take place at the Malmö Convention Centre from 12 to 14 May. Standard booths measure three by three metres and cost 18,000 SEK; corner booths, which have two open sides, cost 24,000 SEK and are limited to twelve.","The fee covers the booth frame, one table, two chairs, and a company listing in the printed guide. Electricity, carpeting, and internet access are ordered separately through the venue.","Exhibitors may set up on 11 May between 8:00 A.M. and 8:00 P.M. Setting up on the morning of 12 May is not permitted, as the aisles must be cleared for inspection.","Bookings made before 15 January receive a 10 percent reduction. Cancellations before 1 March are refunded in full; from 1 March the refund falls to 50 percent, and no refund is given after 1 April."],"questions":[{"q":"What distinguishes a corner booth?","o":["It is located near the entrance","It includes electricity","It has two sides open to the aisle","It is larger than a standard booth"],"a":2,"e":"角のブースは2面が開いている点が特徴で、12区画限定。"},{"q":"What is included in the booth fee?","o":["Internet access","Carpeting","A listing in the printed guide","Electricity"],"a":2,"e":"印刷版ガイドへの掲載は含まれる。電気・カーペット・通信は別途手配。"},{"q":"What is stated about setting up?","o":["It must be completed the day before the expo opens","It is arranged by the venue staff","It requires an additional fee","It may take place early on the opening morning"],"a":0,"e":"設営は5月11日のみで、12日朝の設営は通路点検のため認められない。"}],"ja":["北欧包装展 ― 出展者向け案内","2026年の展示会は5月12日から14日まで、マルメ・コンベンションセンターで開催します。標準ブースは3メートル×3メートルで18,000スウェーデンクローナ、2面が開いた角ブースは24,000クローナで12区画限定です。","出展料には、ブースの枠組み、テーブル1台、椅子2脚、印刷版ガイドへの社名掲載が含まれます。電気、カーペット、インターネット接続は会場を通じて別途お申し込みください。","設営は5月11日の午前8時から午後8時の間に行えます。通路を点検のために空ける必要があるため、5月12日の朝の設営は認められません。","1月15日までのお申し込みで10パーセント引きとなります。3月1日より前のキャンセルは全額返金、3月1日以降は返金が50パーセントに下がり、4月1日以降は返金いたしません。"]},{"id":30,"part":2,"cat":"見積書","theme":"見積書：修繕工事の見積","header":["ESTIMATE — Wexler Roofing &amp; Guttering","宛先: Bramble Court Residents&#x27; Association","見積番号: E-2291","日付: 8 April"],"body":["Scope of work: replace damaged tiles on the north slope (approx. 40 tiles), clear and re-seal all guttering, and repoint the chimney flashing.","Labour (three days, two workers): £1,680. Materials: £940. Scaffolding hire (one week minimum): £620. Total excluding VAT: £3,240.","This estimate is valid for sixty days. It assumes that the roof timbers are sound; if rot is found once the tiles are lifted, we will stop work and provide a revised figure before continuing. Checking the timbers at that point is not charged for separately.","We can begin within three weeks of acceptance. Scaffolding must remain in place for a minimum of one week regardless of how quickly the work is completed, as the hire company charges by the week."],"questions":[{"q":"What is the largest single cost in the estimate?","o":["The inspection","Labour","Materials","Scaffolding hire"],"a":1,"e":"人件費1,680ポンドが最大。材料940ポンド、足場620ポンド。"},{"q":"What will happen if the roof timbers are found to be damaged?","o":["The association will be charged for an inspection","A new estimate will be issued before work resumes","The work will continue at the same price","The scaffolding will be removed immediately"],"a":1,"e":"腐食が見つかれば作業を止め、改訂した金額を提示してから続行する。点検自体は無料。"},{"q":"Why must the scaffolding be hired for a full week?","o":["The work always takes seven days","Safety regulations require it","It cannot be removed in wet weather","The hire company bills by the week"],"a":3,"e":"足場業者が週単位で課金するため、作業が早く終わっても1週間は必要。"}],"ja":["見積書 ― ウェクスラー屋根・雨樋工事　宛先：ブランブル・コート住民組合　見積番号E-2291　日付：4月8日","工事内容：北側斜面の破損瓦の交換（約40枚）、雨樋全体の清掃と再シール、煙突の水切り部分の目地補修。","人件費（3日間・作業員2名）1,680ポンド、材料費940ポンド、足場のレンタル（最低1週間）620ポンド。税抜合計3,240ポンド。","本見積の有効期間は60日です。屋根の梁が健全であることを前提としています。瓦を外した際に腐食が見つかった場合は、作業を中止し、続行前に改訂した金額をご提示します。その時点での梁の確認について、別途料金はいただきません。","ご承諾から3週間以内に着工できます。足場のレンタル会社が週単位で課金するため、工事が早く終わっても足場は最低1週間設置したままとなります。"]},{"id":31,"part":2,"cat":"レビュー","theme":"レビュー：ノートパソコンの製品評価","header":["Product review — Lumen 14 Pro | Posted by T. Ngata"],"body":["I bought the Lumen 14 Pro to replace a five-year-old machine, mainly for spreadsheets and video calls. After two months I would recommend it with one reservation.","The screen is the strongest feature. It is bright enough to use beside a window, which my old laptop never managed. Battery life is around nine hours in my use, close to the ten hours advertised, and it charges from ten to eighty percent in about forty minutes.","My reservation concerns the keyboard. The arrow keys are half-height and I still hit the wrong one when working in spreadsheets. Users who mainly type prose may not notice this at all.","Support was better than expected. A key stopped responding in week three; the manufacturer collected the machine and returned it two days later at no cost."],"questions":[{"q":"What does the reviewer consider the best aspect?","o":["The keyboard","The charging speed","The battery life","The display"],"a":3,"e":"The screen is the strongest feature.（画面が最も優れた点）と明言している。"},{"q":"What criticism does the reviewer make?","o":["Customer support was slow","The arrow keys are difficult to use","The battery lasts less than advertised","The machine is too heavy"],"a":1,"e":"矢印キーが半分の高さで押し間違えると述べている。"},{"q":"What is suggested about the reviewer&#x27;s experience with support?","o":["It involved a repair fee","It took longer than promised","It exceeded expectations","It required several phone calls"],"a":2,"e":"better than expected とあり、2日で無償交換された。"}],"ja":["製品レビュー ― ルーメン14プロ　投稿者 T・ンガタ","5年使ったパソコンの買い替えとして、主に表計算とビデオ通話のためにルーメン14プロを購入した。2か月使った上で、一点の留保付きで勧めたい。","最も優れているのは画面だ。窓際でも使えるほど明るく、これは以前のノートでは到底無理だった。電池の持ちは私の使い方で9時間程度と、公称の10時間に近い。充電は10パーセントから80パーセントまで約40分だ。","留保はキーボードについてだ。矢印キーが半分の高さで、表計算をしていると今でも押し間違える。主に文章を打つ人はまったく気にならないかもしれない。","サポートは予想以上だった。3週目にキーが反応しなくなったが、メーカーが本体を引き取り、2日後に無償で返送してくれた。"]},{"id":32,"part":2,"cat":"プレスリリース","theme":"プレスリリース：2社の統合","header":["JOINT ANNOUNCEMENT — Halden Rail and Pentworth Freight"],"body":["Halden Rail and Pentworth Freight today announced an agreement to merge, creating the third-largest rail freight operator in the region. The combined company will retain the Halden name and will be headquartered in Gothenburg.","The two firms operate on different corridors, and neither expects route closures. Pentworth&#x27;s terminal in Aarhus, which Halden does not currently serve, is described in the announcement as the principal attraction of the deal.","Both companies stated that no redundancies are planned among train crews. Administrative functions, however, will be consolidated over eighteen months, and some head office roles in Pentworth&#x27;s Odense office will move to Gothenburg.","The merger is subject to approval by competition authorities in two countries and is expected to close in the first quarter of next year. Neither company disclosed the financial terms."],"questions":[{"q":"What is given as the main reason for the merger?","o":["Gaining access to a terminal","Moving the headquarters","Closing unprofitable routes","Reducing the number of employees"],"a":0,"e":"ハルデンが現在利用していないオーフスのターミナルが「取引の主たる魅力」とされている。"},{"q":"Which employees may be affected by the consolidation?","o":["Train crews","Staff in Gothenburg","Terminal staff","Head office staff in Odense"],"a":3,"e":"乗務員の人員削減はないが、オーデンセ本社の一部職務がヨーテボリへ移る。"},{"q":"What information was not made public?","o":["The location of the headquarters","The name of the combined company","The expected closing period","The financial terms"],"a":3,"e":"「両社とも取引条件は開示しなかった」と最終文にある。"}],"ja":["共同発表 ― ハルデン鉄道およびペントワース貨物","ハルデン鉄道とペントワース貨物は本日、合併の合意を発表した。これにより地域で3番目に大きい鉄道貨物事業者が誕生する。統合後の会社はハルデンの社名を維持し、本社はヨーテボリに置かれる。","両社は異なる路線帯で事業を行っており、いずれも路線の廃止は見込んでいない。ハルデンが現在乗り入れていないペントワースのオーフス・ターミナルが、この取引の主たる魅力として発表文で説明されている。","両社は、乗務員について人員削減の予定はないと述べた。ただし管理部門は18か月かけて統合され、ペントワースのオーデンセ本社にある一部の職務はヨーテボリへ移る。","本合併は2か国の競争当局の承認を要し、来年第1四半期の完了が見込まれている。両社とも財務条件は開示しなかった。"]},{"id":33,"part":2,"cat":"日程表","theme":"日程表：研修合宿の進行","header":["Leadership Retreat — Draft Programme (Ashcombe Lodge)"],"body":["Day 1 — Friday<br>14:00 Arrival and room allocation<br>15:00 Opening session: setting objectives (Main Hall)<br>16:30 Break<br>17:00 Group work: case studies in pairs<br>19:00 Dinner<br><br>Day 2 — Saturday<br>08:00 Breakfast<br>09:00 Workshop: giving difficult feedback<br>12:30 Lunch<br>14:00 Outdoor exercise (weather permitting; indoor alternative in the Barn)<br>17:00 Free time<br><br>Day 3 — Sunday<br>09:30 Action planning<br>11:30 Close and departure","Note: Saturday&#x27;s afternoon exercise involves walking on uneven ground, and the Barn is used instead if it rains. Participants who would prefer the indoor version regardless of the weather should tell the facilitator at the opening session rather than on the day, as separate materials must be prepared in advance.","Rooms are single occupancy. The lodge has no mobile signal; a landline is available at reception for urgent calls."],"questions":[{"q":"When should participants request the indoor option?","o":["During the opening session","At the time of booking","Before Saturday lunch","On arrival at the lodge"],"a":0,"e":"当日ではなく開会セッションで進行役に伝える必要がある。資料を事前に用意するため。"},{"q":"What is indicated about the lodge?","o":["Meals are not provided on Sunday","The Barn is used for meals","Participants share rooms","Mobile phones cannot be used"],"a":3,"e":"携帯電話の電波が入らず、緊急時は受付の固定電話を使う。部屋は1人1室。"}],"ja":["指導者研修合宿 ― 進行案（アシュコム・ロッジ）","1日目（金）<br>14:00 到着・部屋割り<br>15:00 開会セッション：目標設定（大ホール）<br>16:30 休憩<br>17:00 グループワーク：2人1組の事例研究<br>19:00 夕食<br><br>2日目（土）<br>08:00 朝食<br>09:00 研修：言いにくい指摘の伝え方<br>12:30 昼食<br>14:00 屋外活動（天候が許せば。雨天時は納屋で代替）<br>17:00 自由時間<br><br>3日目（日）<br>09:30 行動計画の作成<br>11:30 閉会・解散","注記：土曜午後の活動には不整地の歩行が含まれ、雨天の場合は納屋で行います。天候にかかわらず屋内の活動を希望される方は、当日ではなく開会セッションで進行役にお伝えください。別途の資料を事前に準備する必要があるためです。","部屋はすべて1人部屋です。当ロッジは携帯電話の電波が入りません。急ぎのご連絡には受付の固定電話をご利用いただけます。"]},{"id":34,"part":2,"cat":"取扱説明","theme":"取扱説明：プリンターのトナー交換","header":["Quick Guide — Replacing the toner cartridge (Model LJ-450)"],"body":["Replace the cartridge when the display shows &quot;Toner low.&quot; Printing will continue for approximately 200 more pages, so there is no need to stop work immediately.","Turn off the printer and wait five minutes before opening the front cover; the fuser unit inside becomes hot during printing. Pull the old cartridge straight out — do not tilt it, as loose toner may spill.","Shake the new cartridge gently from side to side five times before inserting it. Do not remove the orange strip until the cartridge is in position; removing it early is the most common cause of streaked pages.","Place the used cartridge in the bag the new one came in and leave it in the collection box beside the supply cabinet. Do not put cartridges in the general waste; the supplier collects them monthly."],"questions":[{"q":"What should be done when &quot;Toner low&quot; appears?","o":["Contact the supplier","Continue working and replace the cartridge soon","Restart the printer","Stop printing immediately"],"a":1,"e":"あと約200ページ印刷できるため、すぐに作業を止める必要はない。"},{"q":"Why should the printer be left for five minutes?","o":["To complete the current print job","To let a hot component cool","To allow the toner to settle","To reset the page counter"],"a":1,"e":"印刷中に高温になる定着ユニットが冷えるのを待つため。"},{"q":"What causes streaked pages, according to the guide?","o":["Tilting the old cartridge","Using the wrong model of cartridge","Shaking the cartridge too hard","Removing the orange strip too soon"],"a":3,"e":"オレンジ色のテープを装着前に外すことが、筋状の印刷汚れの最も多い原因とある。"}],"ja":["簡易手順 ― トナーカートリッジの交換（LJ-450型）","表示に「トナー残量わずか」と出たら交換してください。その後も約200ページは印刷できるため、直ちに作業を止める必要はありません。","電源を切り、5分待ってから前面カバーを開けてください。内部の定着ユニットは印刷中に高温になります。古いカートリッジはまっすぐ引き抜いてください。傾けると粉が漏れることがあります。","新しいカートリッジは、装着前に左右に5回ほど軽く振ってください。オレンジ色のテープは、カートリッジを所定の位置に収めるまで外さないでください。早く外すことが、筋状の印刷汚れの最も多い原因です。","使用済みカートリッジは新品が入っていた袋に入れ、備品棚の横の回収箱に置いてください。一般ごみには出さないでください。供給業者が毎月回収します。"]},{"id":35,"part":2,"cat":"Eメール","theme":"Eメール：配送遅延への回答","header":["宛先: Mr. Felipe Duarte","差出人: Customer Relations, Kestrel Outdoor","件名: RE: Order 55912 — delivery delay"],"body":["Dear Mr. Duarte,","I am sorry that your order has not arrived. Having checked with our warehouse, I can confirm that the tent and the two sleeping mats were dispatched on 3 July, but the carrier&#x27;s tracking shows the parcel was scanned into the wrong regional hub.","The carrier has located the parcel and expects to deliver it on 11 July. I realise this is after the date you needed it for, and I have refunded the delivery charge to your card; it should appear within five working days.","If the trip has already passed, you may return the order unopened within thirty days for a full refund, and we will arrange collection at no cost to you rather than asking you to visit a drop-off point.","Yours sincerely,","Hana Bergström"],"questions":[{"q":"What caused the delay?","o":["The items were out of stock","The parcel was sent to the wrong hub","The order was placed too late","The address was incorrect"],"a":1,"e":"荷物が誤った地域拠点に読み込まれたことが原因。発送自体は7月3日に済んでいる。"},{"q":"What has Ms. Bergström already done?","o":["Contacted the drop-off point","Refunded the cost of delivery","Sent a replacement order","Canceled the order"],"a":1,"e":"配送料をカードに返金済みで、5営業日以内に反映される。"},{"q":"What is offered if Mr. Duarte no longer needs the items?","o":["A credit valid for thirty days","An exchange for different items","A free collection and full refund","A discount on a future order"],"a":2,"e":"未開封であれば30日以内に全額返金、しかも無料で集荷すると申し出ている。"}],"ja":["宛先：フェリペ・ドゥアルテ様　差出人：ケストレル・アウトドア顧客対応係　件名：RE: ご注文55912 ― 配送の遅延について","ドゥアルテ様","ご注文の品が届いていないとのこと、お詫び申し上げます。当社倉庫に確認したところ、テントとスリーピングマット2枚は7月3日に発送されておりましたが、配送業者の追跡記録では、荷物が誤った地域拠点で読み取られていました。","配送業者が荷物の所在を特定し、7月11日にお届けできる見込みです。ご入用の日を過ぎてしまうことは承知しており、配送料はカードへ返金いたしました。5営業日以内に反映されます。","すでに旅行が終わってしまった場合は、未開封のまま30日以内にご返品いただければ全額返金いたします。持ち込み地点までお運びいただく必要はなく、無料で集荷を手配します。","ハナ・ベリストローム"]},{"id":36,"part":2,"cat":"お知らせ","theme":"お知らせ：社員食堂の変更","header":["STAFF CANTEEN — Changes from 1 May"],"body":["From 1 May the canteen will operate a single hot service from 11:45 A.M. to 1:30 P.M., replacing the current two sittings. The change follows feedback that the earlier sitting was rarely used.","A cold counter with sandwiches, salads, and fruit will remain open from 8:00 A.M. to 4:00 P.M. Coffee and tea will continue to be free of charge for staff and visitors throughout the day.","Hot dishes will now include two vegetarian options daily instead of one, and a dish suitable for those avoiding gluten will be available on Tuesdays and Fridays. Full allergen information will be displayed at the counter rather than printed on the weekly menu.","Staff wishing to reserve the private dining room for client lunches must book at least three working days ahead through the online form."],"questions":[{"q":"What is the main change taking place on 1 May?","o":["Prices will increase","The canteen will close earlier","The cold counter will be removed","Two lunch sittings will become one"],"a":3,"e":"2部制の温かい食事の提供を1回にまとめる。"},{"q":"What is stated about allergen information?","o":["It will be shown at the counter","It will be available on request only","It will be sent by e-mail","It will appear on the weekly menu"],"a":0,"e":"週間メニューへの印刷ではなくカウンターでの掲示に変わる。"},{"q":"What is required to use the private dining room?","o":["A minimum of four guests","Payment in advance","A booking three working days in advance","Approval from a manager"],"a":2,"e":"オンライン様式から3営業日前までに予約する必要がある。"}],"ja":["社員食堂 ― 5月1日からの変更","5月1日より、温かい食事の提供を午前11時45分から午後1時30分までの1回に集約し、現行の2部制を取りやめます。早い時間帯の利用がほとんどないとのご意見を受けた変更です。","サンドイッチ、サラダ、果物を扱う冷菜カウンターは、引き続き午前8時から午後4時まで営業します。コーヒーと紅茶は終日、社員・来訪者ともに無料のままです。","温かい料理には、菜食向けの選択肢が従来の1品から2品に増えます。またグルテンを避けている方向けの料理を火曜日と金曜日に提供します。アレルゲンの詳細は、週間メニューへの印刷ではなくカウンターでの掲示に変更します。","来客との昼食で個室をご利用になる場合は、オンライン様式より3営業日前までにご予約ください。"]},{"id":37,"part":2,"cat":"社内報","theme":"社内報：新支店長の紹介","header":["Meridian Bank — Internal Bulletin"],"body":["We are pleased to welcome Claudia Weiss as manager of the Bramford branch from 6 November. Claudia joins us from a competitor, where she led a team of eighteen at a branch of similar size.","She succeeds Owen Trask, who is retiring after twenty-six years, eleven of them at Bramford. A farewell gathering for Owen will be held in the branch after closing on 31 October; contributions to a leaving gift can be given to Sara Lund.","Claudia has said her first priority is to spend her opening weeks meeting customers rather than reorganising processes. She has asked that staff continue to raise issues directly with their team leaders during this period.","Claudia will work at the regional office in Ipswich on Wednesdays and will be at Bramford for the rest of the week."],"questions":[{"q":"What is indicated about Ms. Weiss?","o":["She has managed the Bramford branch before","She has been promoted from within the bank","She is returning from a leave of absence","She previously worked for another bank"],"a":3,"e":"joins us from a competitor（競合他社から加わる）とある。"},{"q":"What is mentioned about Mr. Trask?","o":["He is transferring to Ipswich","He has worked at Bramford for twenty-six years","He will train his successor","He is leaving the bank after a long career"],"a":3,"e":"26年の勤務を経て退職する。うちブラムフォード勤務は11年。"},{"q":"What does Ms. Weiss plan to do first?","o":["Review team leaders&#x27; performance","Meet with customers","Reorganise branch processes","Recruit additional staff"],"a":1,"e":"着任当初は業務の再編ではなく顧客との面会に時間を充てると述べている。"}],"ja":["メリディアン銀行 ― 社内報","11月6日より、クラウディア・ヴァイスがブラムフォード支店長として着任します。クラウディアは競合他社から加わり、前職では同規模の支店で18名のチームを率いていました。","前任は26年間勤務し、うち11年をブラムフォードで過ごしたオーウェン・トラスクで、このたび退職します。オーウェンの送別会は10月31日の閉店後に支店で行います。餞別へのご協力はサラ・ルンドまでお願いします。","クラウディアは、着任後の数週間は業務の再編よりも顧客との面会に充てることを最優先にしたいと述べています。またこの期間中、職員は引き続き課題をチームリーダーに直接伝えてほしいとのことです。","クラウディアは水曜日はイプスウィッチの地域本部で勤務し、週の残りはブラムフォードに在席する予定です。"]},{"id":38,"part":2,"cat":"報告書","theme":"報告書：省エネ施策の結果","header":["Energy Reduction Programme — Year One Summary"],"body":["Electricity use across our four sites fell by 14 percent compared with the previous year, against a target of 10 percent. Gas use fell by 6 percent, short of the 9 percent target.","Most of the electricity saving came from replacing lighting in the Dunmore warehouse, which alone accounted for more than half of the reduction. Occupancy sensors installed in meeting rooms produced smaller savings than modelled, largely because many rooms are booked but left empty.","The gas target was missed because of a colder-than-average winter and the delayed replacement of two boilers at the Kelsey site, now scheduled for August.","For year two we propose focusing on heating controls rather than lighting, as the remaining lighting opportunities are small. A revised target will be set once the Kelsey boilers are operating."],"questions":[{"q":"Which target was met?","o":["Both targets","Neither target","The gas reduction target","The electricity reduction target"],"a":3,"e":"電気は目標10%に対し14%削減で達成。ガスは目標9%に対し6%で未達。"},{"q":"Why did the occupancy sensors save less than expected?","o":["They were incorrectly configured","They were installed late","Rooms are often reserved but unused","Fewer sensors were installed than planned"],"a":2,"e":"予約されたまま使われない部屋が多いことが主因とされている。"},{"q":"What is proposed for the second year?","o":["Replacing more lighting","Closing the Kelsey site","Raising the electricity target","Concentrating on heating controls"],"a":3,"e":"照明の余地は小さいため、暖房制御に重点を移すことを提案している。"}],"ja":["省エネ計画 ― 初年度の総括","4拠点全体の電力使用量は前年比14パーセント減となり、目標の10パーセントを上回りました。ガス使用量は6パーセント減で、目標の9パーセントには届きませんでした。","電力削減の大半はダンモア倉庫の照明交換によるもので、これだけで削減分の半分以上を占めます。会議室に設置した在室センサーによる削減は想定を下回りました。予約されたまま使われない部屋が多いことが主な理由です。","ガスの目標未達は、平年より寒かった冬と、ケルシー拠点の2基のボイラー交換が遅れたことによります。交換は現在8月に予定されています。","2年目については、照明で残された余地が小さいため、照明よりも暖房制御に注力することを提案します。改訂目標はケルシーのボイラー稼働後に設定します。"]},{"id":39,"part":2,"cat":"Eメール","theme":"Eメール：議事録の送付とフォロー","header":["宛先: Project team","差出人: Ines Carvalho","件名: Notes from Tuesday and two open items"],"body":["Team,","Attached are the notes from Tuesday&#x27;s review. Two decisions were confirmed: the launch moves to 3 September, and the second language version is postponed to the following quarter.","Two items remain open. First, we still do not have a figure for the translation cost. Petra agreed to obtain two quotations, but only one has arrived; we contacted the second agency on 12 August and have had no reply. If nothing comes by Friday, we will proceed with the single quotation.","Second, we have not decided who will approve the final copy. Rashid suggested that this sit with Marketing rather than with the product team, and nobody objected, but no one was formally assigned. Please raise any concerns before Thursday, after which I will record it as Marketing&#x27;s responsibility.","Ines"],"questions":[{"q":"What was decided at Tuesday&#x27;s review?","o":["The launch date was changed","The translation agency was selected","The project budget was increased","Marketing was given approval authority"],"a":0,"e":"発売日が9月3日に移ることと、第2言語版の延期が確定事項。"},{"q":"What will happen if the second agency does not respond?","o":["Petra will visit the agency","The team will use the quotation it has","A third agency will be contacted","The translation will be canceled"],"a":1,"e":"金曜までに返答がなければ、届いている1社の見積で進める。"},{"q":"Why does Ms. Carvalho mention Thursday?","o":["It is when Marketing will meet","It is the date of the next review","It is the deadline for objections","It is when the notes will be published"],"a":2,"e":"木曜までに異論がなければ、承認権限をマーケティング部の責任として記録すると述べている。"}],"ja":["宛先：プロジェクトチーム　差出人：イネス・カルヴァーリョ　件名：火曜日の記録と2つの未決事項","チームの皆さん","火曜日の検討会の記録を添付します。決定事項は2点です。発売日を9月3日に移すこと、第2言語版を翌四半期に延期することです。","未決事項が2点あります。ひとつ目は翻訳費用の金額がまだ出ていないことです。ペトラが2社から見積を取ることになっていましたが、届いたのは1社分だけです。もう1社には8月12日に連絡しましたが、返答がありません。金曜日までに届かなければ、1社の見積で進めます。","ふたつ目は、最終原稿を誰が承認するかが決まっていないことです。ラシッドから製品チームではなくマーケティング部が担うべきとの提案があり、異論は出ませんでしたが、正式な割り当てはされていません。ご懸念があれば木曜日までにお知らせください。それ以降はマーケティング部の担当として記録します。","イネス"]},{"id":40,"part":2,"cat":"お知らせ","theme":"お知らせ：通勤バスのダイヤ改正","header":["Employee Shuttle — Revised Timetable from 2 October"],"body":["The morning shuttle from Weston station will depart at 7:35, 8:05, and 8:35 instead of the current 7:40, 8:10, and 8:40. The five-minute change allows the 8:05 service to reach the site before the production shift begins at 8:30.","The evening departure times are unchanged. The stops, however, are not: the last service will no longer call at Marchfield, so passengers for Marchfield should take the 17:20, which continues to stop there.","The shuttle is free for employees and for contractors with a site pass. Visitors may travel if seats are available but must sign in with the driver.","During the first two weeks, a member of the Facilities team will be at the station stop each morning to answer questions. Timetable cards will be handed out at reception from 25 September."],"questions":[{"q":"Why is the morning timetable changing?","o":["To reduce the number of services","To match a change in train times","To allow passengers to arrive before a shift starts","To add a stop at Marchfield"],"a":2,"e":"8時05分の便が8時30分の生産シフト開始前に到着できるようにするため。"},{"q":"What should passengers travelling to Marchfield do?","o":["Take the last evening service","Board at a different station","Sign in with the driver","Take the 17:20 service"],"a":3,"e":"最終便はマーチフィールドに停まらなくなるため、引き続き停車する17時20分の便を利用する。"},{"q":"What is available from 25 September?","o":["A new station stop","Free travel for visitors","Printed timetable cards","Additional evening services"],"a":2,"e":"9月25日から受付で時刻表カードが配布される。"}],"ja":["従業員送迎バス ― 10月2日からの改正時刻表","ウェストン駅発の朝の便は、現行の7時40分・8時10分・8時40分から、7時35分・8時05分・8時35分の発車に変更します。この5分の繰り上げにより、8時05分の便が8時30分の生産シフト開始前に事業所へ到着できます。","夕方の発車時刻に変更はありません。ただし停車駅は変わります。最終便はマーチフィールドに停車しなくなりますので、マーチフィールドへ向かう方は、引き続き停車する17時20分の便をご利用ください。","送迎バスは従業員および入構証をお持ちの請負業者の方は無料です。来訪者は座席に空きがあればご乗車いただけますが、運転手のもとで記帳が必要です。","最初の2週間は、毎朝、施設管理部の職員が駅の停留所でご質問にお答えします。時刻表カードは9月25日より受付で配布します。"]},{"id":41,"part":3,"cat":"Eメール","theme":"Eメール：備品発注の承認依頼","header":["宛先: Gordon Blake, Office Manager","差出人: Yuki Tanabe","日付: 12 February","件名: Approval needed — chair order"],"body":["Gordon,","Six of the chairs in the second-floor design studio have broken armrests and can no longer be adjusted. I have collected a quotation from Marlin Office Supply for six replacement chairs at £210 each, giving a total of £1,260.","Because the amount is above the £1,000 limit for departmental purchases, the order needs your signature before I can submit it.","One point worth noting: Marlin can deliver within a week, but only if we order the grey model. The black version, which matches the rest of the studio, would take four weeks. I would rather wait for the black, since the chairs are visible to visiting clients, but I will follow your preference.","Yuki"],"questions":[{"q":"Why does Ms. Tanabe need Mr. Blake&#x27;s approval?","o":["The purchase exceeds a spending limit","The budget for the year has been used","The supplier requires two signatures","The chairs are for another department"],"a":0,"e":"合計1,260ポンドが部門購入の上限1,000ポンドを超えるため署名が必要。"},{"q":"What is the disadvantage of ordering the black chairs?","o":["They take longer to arrive","They cannot be adjusted","They cost more than the grey ones","They are sold in sets of four"],"a":0,"e":"黒は4週間かかる。灰色なら1週間以内。価格差の記述はない。"},{"q":"What does Ms. Tanabe say she prefers?","o":["To repair the existing chairs","To order from a different supplier","To order fewer than six chairs","To wait for the matching colour"],"a":3,"e":"来客の目に触れるため、内装に合う黒を待ちたいと述べている。"}],"ja":["宛先：ゴードン・ブレイク（総務課長）　差出人：田辺ユキ　日付：2月12日　件名：承認のお願い ― 椅子の発注","ゴードンさん","2階のデザインスタジオにある椅子6脚の肘掛けが壊れ、高さ調整もできなくなっています。マーリン・オフィス・サプライから交換用の椅子6脚の見積を取りました。1脚210ポンドで合計1,260ポンドです。","金額が部門購入の上限である1,000ポンドを超えるため、発注前にあなたの署名が必要です。","一点補足します。マーリン社は1週間以内に納品できますが、それは灰色の型を注文した場合に限られます。スタジオの他の什器に合う黒の型は4週間かかります。椅子は来訪する顧客の目にも触れるので、私としては黒を待ちたいところですが、ご意向に従います。","ユキ"]},{"id":42,"part":3,"cat":"お知らせ","theme":"お知らせ：断水の予告","header":["BUILDING NOTICE — Water Supply Interruption"],"body":["The water supply to floors 1 through 6 will be shut off on Wednesday, 18 September, from 9:00 A.M. to approximately 3:00 P.M. while the main valve in the basement is replaced.","Restrooms on these floors will be closed for the whole period. The restrooms on floor 7 will remain in service and may be used by all staff; please allow extra time, as they will be busier than usual.","The canteen on floor 2 will not serve hot food that day but will sell
