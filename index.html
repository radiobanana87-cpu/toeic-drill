b class=\"tg\">resume</b> their training, and every page requires a <b class=\"tg\">signature</b>.","part":4},{"id":67,"theme":"社内業務","words":[{"w":"memorandum","jp":"社内連絡文書","tier":"A","ref":"TSL 259","note_html":"短縮形 memo。<code>post / circulate a memorandum</code>。"},{"w":"workplace","jp":"職場","tier":"S","ref":"TSL 147","note_html":"<code>in the workplace</code>、<code>workplace safety</code>。「勤務先の環境」を指す。"},{"w":"overtime","jp":"残業、残業手当","tier":"S","ref":"TSL 164","note_html":"<code>work overtime</code>、<code>approve overtime</code>。副詞的にも使う（前置詞不要）。"},{"w":"coworker","jp":"同僚","tier":"S","ref":"TSL 85","note_html":"<code>my coworker and I</code>。colleague と同義で、米国式の口語寄り。"},{"w":"assignment","jp":"任務、課題","tier":"S","ref":"TSL 100","note_html":"<code>be given an assignment</code>、<code>complete an assignment</code>。動詞 assign（<code>assign a task to someone</code>）。"}],"translation":"職場に掲示された社内連絡文書によれば、残業は事前に承認を得なければなりません。同僚と私は同じ任務を与えられているので、時間を分担する予定です。","html":"The <b class=\"tg\">memorandum</b> posted in the <b class=\"tg\">workplace</b> states that <b class=\"tg\">overtime</b> must be approved in advance. My <b class=\"tg\">coworker</b> and I have been given the same <b class=\"tg\">assignment</b>, so we will divide the hours.","part":4},{"id":68,"theme":"日程調整2","words":[{"w":"availability","jp":"都合、空き状況","tier":"S","ref":"TSL 229","note_html":"<code>check your availability</code>、<code>subject to availability</code>（空きがある場合に限る）。"},{"w":"coordinate","jp":"調整する、まとめる","tier":"S","ref":"TSL 221","note_html":"<code>coordinate the schedule / booking</code>。名詞 coordination、coordinator。"},{"w":"thorough","jp":"徹底的な、入念な","tier":"A","ref":"TSL 262","note_html":"<code>a thorough review / inspection</code>。発音は /ˈθɜːroʊ/。副詞 thoroughly。"},{"w":"urgent","jp":"緊急の","tier":"A","ref":"TSL 296","note_html":"<code>an urgent matter / request</code>。名詞 urgency、副詞 urgently。"},{"w":"shortly","jp":"まもなく","tier":"S","ref":"TSL 129","note_html":"<code>I will send it shortly.</code>、<code>shortly after ~</code>（〜の直後に）。soon の言い換え。"}],"translation":"水曜日のご都合をご確認ください。会議室の予約は私が調整します。契約書の入念な確認が急務ですので、修正稿をまもなくお送りします。","html":"Please check your <b class=\"tg\">availability</b> for Wednesday, and I will <b class=\"tg\">coordinate</b> the room booking. A <b class=\"tg\">thorough</b> review of the contract is <b class=\"tg\">urgent</b>, so I will send the revised draft <b class=\"tg\">shortly</b>.","part":4},{"id":69,"theme":"取引先対応","words":[{"w":"client","jp":"顧客、依頼人","tier":"S","ref":"TSL 3","note_html":"<code>a corporate client</code>、<code>meet with a client</code>。TSL3位。専門サービスの顧客を指す。"},{"w":"inquire","jp":"問い合わせる","tier":"S","ref":"TSL 173","note_html":"<code>inquire about / whether ~</code>。名詞 inquiry。英国式は enquire。"},{"w":"prohibit","jp":"禁止する","tier":"S","ref":"TSL 191","note_html":"<code>prohibit someone from doing ~</code>。from が必須で、Part 5の語法問題に直結。"},{"w":"provider","jp":"提供業者","tier":"S","ref":"TSL 133","note_html":"<code>a service / internet provider</code>。動詞 provide（<code>provide someone with ~</code>）。"},{"w":"recipient","jp":"受取人","tier":"S","ref":"TSL 137","note_html":"<code>the recipient of the notice / award</code>。動詞 receive の派生語。"}],"translation":"ある顧客から、新方針によって外部コンサルタントの出席が禁止されるのかという問い合わせがありました。当社のサービス提供業者は、通知の受取人は1名まで同伴できると回答しました。","html":"A <b class=\"tg\">client</b> wrote to <b class=\"tg\">inquire</b> whether the new policy would <b class=\"tg\">prohibit</b> outside consultants from attending. Our service <b class=\"tg\">provider</b> replied that the <b class=\"tg\">recipient</b> of the notice may bring one guest.","part":4},{"id":70,"theme":"社員食堂","words":[{"w":"dine","jp":"食事をする","tier":"S","ref":"TSL 83","note_html":"<code>dine in the cafeteria</code>、<code>dine out</code>（外食する）。eat の格式ばった語。名詞 diner。"},{"w":"cafeteria","jp":"社員食堂、カフェテリア","tier":"S","ref":"TSL 43","note_html":"<code>the company cafeteria</code>。セルフサービス式の食堂を指す。"},{"w":"dining area","jp":"食事スペース","tier":"S","ref":"TSL 83","note_html":"<code>the dining area on the second floor</code>。間取り説明で使われる。"},{"w":"snack","jp":"軽食、菓子","tier":"S","ref":"TSL 130","note_html":"<code>snacks and beverages</code>、<code>a snack bar</code>。"},{"w":"ingredient","jp":"材料、成分","tier":"S","ref":"TSL 144","note_html":"<code>check every ingredient</code>、<code>fresh ingredients</code>。レシピ・アレルギー表示の話題で頻出。"}],"translation":"従業員は11時から2時まで社員食堂で食事ができ、2階の食事スペースのほうが静かです。軽食にはすべて表示があるので、アレルギーのある方は各材料を確認できます。","html":"Employees may <b class=\"tg\">dine</b> in the <b class=\"tg\">cafeteria</b> from eleven to two, and the <b class=\"tg\">dining area</b> on the second floor is quieter. Each <b class=\"tg\">snack</b> is labeled, so anyone with an allergy can check every <b class=\"tg\">ingredient</b>.","part":4},{"id":71,"theme":"飲食・宴会","words":[{"w":"banquet","jp":"宴会、晩餐会","tier":"S","ref":"TSL 117","note_html":"<code>a banquet menu / hall</code>、<code>host a banquet</code>。"},{"w":"recipe","jp":"レシピ、調理法","tier":"S","ref":"TSL 210","note_html":"<code>a regional recipe</code>、<code>follow a recipe</code>。発音は /ˈresəpi/（3音節）。"},{"w":"flavor","jp":"風味、味","tier":"S","ref":"TSL 208","note_html":"<code>a mild / rich flavor</code>、<code>three flavors of ice cream</code>。英国式は flavour。"},{"w":"catering","jp":"仕出し、給食","tier":"A","ref":"TSL 264","note_html":"<code>a catering company</code>、<code>catering services</code>。動詞 cater、名詞 caterer。"},{"w":"café","jp":"カフェ、喫茶店","tier":"S","ref":"TSL 105","note_html":"<code>at the café beside the entrance</code>。coffee shop と同義。"}],"translation":"宴会のメニューには、まろやかな風味の郷土料理が含まれており、仕出し会社が5時に準備を始めます。その後、入口横のカフェでコーヒーが提供されます。","html":"The <b class=\"tg\">banquet</b> menu features a regional <b class=\"tg\">recipe</b> with a mild <b class=\"tg\">flavor</b>, and the <b class=\"tg\">catering</b> company will set up at five. Coffee will be served afterward at the <b class=\"tg\">café</b> beside the entrance.","part":4},{"id":72,"theme":"医療・検査","words":[{"w":"medication","jp":"薬、投薬","tier":"S","ref":"TSL 108","note_html":"<code>release / take medication</code>、<code>prescription medication</code>。medicine とほぼ同義。"},{"w":"prescription","jp":"処方箋","tier":"A","ref":"TSL 270","note_html":"<code>a valid prescription</code>、<code>fill a prescription</code>（処方薬を調剤する）。動詞 prescribe。"},{"w":"lab","jp":"研究室、検査室","tier":"S","ref":"TSL 156","note_html":"正式には laboratory。<code>the lab will verify ~</code>、<code>lab results</code>。"},{"w":"verify","jp":"確認する、検証する","tier":"S","ref":"TSL 240","note_html":"<code>verify the sample / the information</code>。名詞 verification。"},{"w":"dentist","jp":"歯科医","tier":"S","ref":"TSL 73","note_html":"<code>see / visit the dentist</code>、<code>a dentist&#x27;s appointment</code>。Part 2の予定変更で頻出。"}],"translation":"薬局は有効な処方箋がなければ薬を渡すことができません。検査室が今週その検体を確認する予定で、あなたの歯科医が結果の写しを求めています。","html":"The pharmacy cannot release the <b class=\"tg\">medication</b> without a valid <b class=\"tg\">prescription</b>. The <b class=\"tg\">lab</b> will <b class=\"tg\">verify</b> the sample this week, and your <b class=\"tg\">dentist</b> has asked for a copy of the results.","part":4},{"id":73,"theme":"寄付・式典","words":[{"w":"generous","jp":"気前のよい、寛大な","tier":"A","ref":"TSL 369","note_html":"<code>a generous donation / offer</code>。名詞 generosity、副詞 generously。"},{"w":"donation","jp":"寄付、寄付金","tier":"S","ref":"TSL 127","note_html":"<code>make / receive a donation</code>、<code>a donation from ~</code>。"},{"w":"admission","jp":"入場、入場料、入学","tier":"S","ref":"TSL 95","note_html":"<code>admission is free</code>、<code>admission fee</code>。動詞 admit（入場・入学を認める）。"},{"w":"reception","jp":"歓迎会、受付","tier":"S","ref":"TSL 46","note_html":"<code>a reception follows in ~</code>、<code>the reception desk</code>。「歓迎会」の意味が特に頻出。"},{"w":"donate","jp":"寄付する","tier":"S","ref":"TSL 166","note_html":"<code>donate to a charity</code>、<code>donate money / equipment</code>。名詞 donation、donor。"}],"translation":"卒業生からの気前のよい寄付のおかげで、式典への入場は無料です。その後、東ホールで歓迎会が開かれ、寄付をご希望の方は受付でお申し出いただけます。","html":"Thanks to a <b class=\"tg\">generous</b> <b class=\"tg\">donation</b> from a former student, <b class=\"tg\">admission</b> to the ceremony is free. A <b class=\"tg\">reception</b> follows in the east hall, and guests who wish to <b class=\"tg\">donate</b> may do so at the desk.","part":4},{"id":74,"theme":"環境・廃棄物2","words":[{"w":"recyclable","jp":"再生利用できる","tier":"S","ref":"TSL 109","note_html":"<code>recyclable materials / cups</code>。名詞複数 recyclables（資源ごみ）。"},{"w":"garbage","jp":"ごみ、生ごみ","tier":"A","ref":"TSL 279","note_html":"<code>put in the garbage</code>、<code>garbage collection</code>。米国式で、英国式は rubbish。"},{"w":"renewable","jp":"再生可能な","tier":"S","ref":"TSL 110","note_html":"<code>renewable energy / resources</code>。動詞 renew、名詞 renewal と語族で。"},{"w":"recycle","jp":"再生利用する","tier":"S","ref":"TSL 109","note_html":"<code>recycle bottles / paper</code>。名詞 recycling。"},{"w":"trash","jp":"ごみ、くず","tier":"A","ref":"TSL 385","note_html":"<code>the trash bin / can</code>、<code>take out the trash</code>。garbage とほぼ同義。"}],"translation":"紙コップは再生利用できるので、生ごみと一緒に捨てないでください。当社は現在、再生可能エネルギーを購入しており、従業員には瓶をごみ箱の脇に置くのではなくリサイクルするようお願いしています。","html":"Paper cups are <b class=\"tg\">recyclable</b>, so please do not put them in the <b class=\"tg\">garbage</b>. The company now buys <b class=\"tg\">renewable</b> energy, and staff are asked to <b class=\"tg\">recycle</b> bottles rather than leave them beside the <b class=\"tg\">trash</b> bin.","part":4},{"id":75,"theme":"建築・工事","words":[{"w":"architect","jp":"建築家","tier":"S","ref":"TSL 148","note_html":"<code>the architect who designed ~</code>。形容詞 architectural、名詞 architecture。"},{"w":"developer","jp":"開発業者、開発者","tier":"S","ref":"TSL 202","note_html":"<code>a property developer</code>（不動産開発業者）、<code>a software developer</code>。文脈で職種が変わる。"},{"w":"renovate","jp":"改装する","tier":"S","ref":"TSL 124","note_html":"<code>renovate the lobby / building</code>。名詞 renovation。remodel の言い換え。"},{"w":"general contractor","jp":"総合建設業者、元請業者","tier":"S","ref":"TSL 188","note_html":"<code>hire a general contractor</code>。下請は subcontractor。"},{"w":"completion","jp":"完成、完了","tier":"A","ref":"TSL 277","note_html":"<code>promise completion by ~</code>、<code>upon completion of the project</code>。動詞 complete。"}],"translation":"作業員がロビーの改装に取りかかる前に、建築家と不動産開発業者が計画を検討するために会合しました。総合建設業者は8月末までの完成を約束しました。","html":"The <b class=\"tg\">architect</b> and the property <b class=\"tg\">developer</b> met to review the plan before the crew began to <b class=\"tg\">renovate</b> the lobby. The <b class=\"tg\">general contractor</b> promised <b class=\"tg\">completion</b> by the end of August.","part":4},{"id":76,"theme":"修理・作業","words":[{"w":"plumber","jp":"配管工","tier":"A","ref":"TSL 359","note_html":"<code>call a plumber</code>。発音は /ˈplʌmər/ で b は無音。名詞 plumbing（配管）。"},{"w":"leak","jp":"漏れ、漏れる","tier":"A","ref":"TSL 292","note_html":"<code>a leak under the sink</code>、<code>The pipe is leaking.</code>。名詞・動詞の両用法。"},{"w":"mechanic","jp":"整備士","tier":"S","ref":"TSL 140","note_html":"<code>a mechanic is checking the van</code>。形容詞 mechanical、名詞 mechanism。"},{"w":"electrical","jp":"電気の","tier":"S","ref":"TSL 98","note_html":"<code>the electrical panel / wiring</code>。electric（電動の）、electrician（電気技師）と使い分ける。"},{"w":"ladder","jp":"はしご","tier":"A","ref":"TSL 285","note_html":"<code>bring / climb a ladder</code>。Part 1の写真描写に頻出。"}],"translation":"流しの下で水漏れが見つかったため配管工が呼ばれ、整備士が配送用バンを点検しています。電気の配電盤は階段を上ったところにあるので、倉庫からはしごを持ってきてください。","html":"A <b class=\"tg\">plumber</b> was called after a <b class=\"tg\">leak</b> appeared under the sink, and a <b class=\"tg\">mechanic</b> is checking the delivery van. The <b class=\"tg\">electrical</b> panel is at the top of the stairs, so bring the <b class=\"tg\">ladder</b> from the storeroom.","part":4},{"id":77,"theme":"事務用品3","words":[{"w":"photocopier","jp":"コピー機","tier":"A","ref":"TSL 260","note_html":"<code>The photocopier is out of paper.</code>。copy machine と同義。"},{"w":"stationery","jp":"文房具","tier":"S","ref":"TSL 205","note_html":"不可算名詞。<code>order stationery</code>。stationary（動かない）と同音異義なので綴りが狙われる。"},{"w":"drawer","jp":"引き出し","tier":"S","ref":"TSL 155","note_html":"<code>the bottom drawer</code>、<code>keep it in the drawer</code>。Part 1にも出る。"},{"w":"bulletin board","jp":"掲示板","tier":"S","ref":"TSL 158","note_html":"<code>post a notice on the bulletin board</code>。社内連絡の定番。"},{"w":"briefcase","jp":"書類かばん","tier":"S","ref":"TSL 169","note_html":"<code>leave a briefcase in the meeting room</code>。brief（要旨）＋case。"}],"translation":"コピー機の用紙が切れており、予備の文房具は一番下の引き出しに入っています。お知らせは掲示板に貼られており、会議室に誰かが書類かばんを置き忘れています。","html":"The <b class=\"tg\">photocopier</b> is out of paper, and extra <b class=\"tg\">stationery</b> is kept in the bottom <b class=\"tg\">drawer</b>. Notices are posted on the <b class=\"tg\">bulletin board</b>, and someone has left a <b class=\"tg\">briefcase</b> in the meeting room.","part":4},{"id":78,"theme":"企業・組織","words":[{"w":"merger","jp":"合併","tier":"S","ref":"TSL 141","note_html":"<code>announce a merger</code>、<code>a merger between A and B</code>。動詞 merge。"},{"w":"authority","jp":"権限、当局","tier":"S","ref":"TSL 224","note_html":"<code>grant authority to ~</code>、<code>local authorities</code>（地方自治体）。2義があり文脈で判別する。"},{"w":"authorized","jp":"許可された、公認の","tier":"S","ref":"TSL 213","note_html":"<code>authorized staff only</code>、<code>an authorized dealer</code>。動詞 authorize、名詞 authorization。"},{"w":"be headquartered in","jp":"〜に本社を置く","tier":"S","ref":"TSL 203","note_html":"<code>The firm is headquartered in Singapore.</code>。名詞 headquarters から派生した受動態の定型。"},{"w":"worldwide","jp":"世界中で、世界的な","tier":"A","ref":"TSL 253","note_html":"<code>sell products worldwide</code>、<code>a worldwide network</code>。副詞・形容詞の両用法で前置詞は不要。"}],"translation":"取締役会が交渉チームに権限を与えた後、合併が発表されました。同社は現在シンガポールに本社を置き、世界中で製品を販売しているため、報道機関に対応できるのは許可された職員のみです。","html":"The <b class=\"tg\">merger</b> was announced after the board granted <b class=\"tg\">authority</b> to the negotiating team. Only <b class=\"tg\">authorized</b> staff may speak to the press, since the firm is now <b class=\"tg\">headquartered in</b> Singapore and sells its products <b class=\"tg\">worldwide</b>.","part":4},{"id":79,"theme":"調査・分析","words":[{"w":"questionnaire","jp":"アンケート用紙","tier":"S","ref":"TSL 244","note_html":"<code>send / complete a questionnaire</code>。survey が「調査」全体、questionnaire は「用紙」。"},{"w":"respondent","jp":"回答者","tier":"S","ref":"TSL 162","note_html":"<code>each respondent commented on ~</code>。動詞 respond、名詞 response。"},{"w":"aspect","jp":"側面、面","tier":"S","ref":"TSL 186","note_html":"<code>one aspect of the service</code>、<code>in every aspect</code>。"},{"w":"feedback","jp":"意見、反応","tier":"S","ref":"TSL 128","note_html":"不可算名詞。<code>receive / provide feedback on ~</code>。"},{"w":"infer","jp":"推測する","tier":"S","ref":"TSL 39","note_html":"<code>infer that ~</code>、<code>What can be inferred about ~?</code>。**Part 7の設問文そのもの**なので必ず押さえる。"}],"translation":"私たちは2,000名の顧客にアンケート用紙を送り、各回答者がサービスの一側面について意見を述べました。その意見から、配達の速さが価格よりも重視されていると推測できます。","html":"We sent a <b class=\"tg\">questionnaire</b> to two thousand customers, and each <b class=\"tg\">respondent</b> commented on one <b class=\"tg\">aspect</b> of the service. From the <b class=\"tg\">feedback</b>, we can <b class=\"tg\">infer</b> that delivery speed matters more than price.","part":4},{"id":80,"theme":"業務効率化","words":[{"w":"productivity","jp":"生産性","tier":"S","ref":"TSL 234","note_html":"<code>raise / improve productivity</code>。形容詞 productive、動詞 produce。"},{"w":"delegate","jp":"委任する／代表者","tier":"A","ref":"TSL 274","note_html":"<code>delegate routine tasks to staff</code>。動詞と名詞で発音が変わる（動詞 /-eɪt/、名詞 /-ət/）。"},{"w":"designate","jp":"指定する、任命する","tier":"A","ref":"TSL 255","note_html":"<code>designate one person as the contact</code>、<code>a designated area</code>（指定区域）。"},{"w":"efficiently","jp":"効率的に","tier":"A","ref":"TSL 366","note_html":"<code>work more efficiently</code>。形容詞 efficient、名詞 efficiency。effectively（効果的に）と区別する。"},{"w":"minimize","jp":"最小限に抑える","tier":"A","ref":"TSL 318","note_html":"<code>minimize the need / cost / risk</code>。反意語 maximize。"}],"translation":"生産性を高めるため、部長は定型業務を委任し、各取引先の担当者を1名ずつ指定します。より効率的に働くことで、週末勤務の必要性を最小限に抑えられるはずです。","html":"To raise <b class=\"tg\">productivity</b>, the manager will <b class=\"tg\">delegate</b> routine tasks and <b class=\"tg\">designate</b> one person as the contact for each account. Working more <b class=\"tg\">efficiently</b> should <b class=\"tg\">minimize</b> the need for weekend shifts.","part":4},{"id":81,"theme":"レンタカー・車両","words":[{"w":"car rental agency","jp":"レンタカー会社","tier":"S","ref":"TSL 41","note_html":"<code>pick up a car at the rental agency</code>。Part 3の旅行場面で頻出。"},{"w":"rental","jp":"賃貸、レンタル料／賃貸の","tier":"S","ref":"TSL 41","note_html":"<code>a weekly rental rate</code>、<code>rental car / property</code>。動詞 rent、名詞 renter。"},{"w":"automobile","jp":"自動車","tier":"S","ref":"TSL 241","note_html":"<code>an automobile manufacturer</code>。car の格式ばった語で、記事や社名に使われる。"},{"w":"transit","jp":"交通機関、輸送","tier":"A","ref":"TSL 327","note_html":"<code>public transit</code>（公共交通機関）、<code>in transit</code>（輸送中で）。2用法とも出る。"},{"w":"auto","jp":"自動車の、自動車","tier":"A","ref":"TSL 361","note_html":"<code>an auto repair shop</code>、<code>the auto industry</code>。automobile の短縮形で複合語をつくる。"}],"translation":"駅近くのレンタカー会社は週単位の料金を設定しており、ご予約いただいた自動車はハイブリッド車です。公共交通機関をお使いになりたい場合は、隣の自動車修理店で車を一晩預かることができます。","html":"The <b class=\"tg\">car rental agency</b> near the station offers a weekly <b class=\"tg\">rental</b> rate, and the <b class=\"tg\">automobile</b> you reserved is a hybrid model. If you would rather use public <b class=\"tg\">transit</b>, the <b class=\"tg\">auto</b> repair shop next door can store the vehicle overnight.","part":5},{"id":82,"theme":"通勤","words":[{"w":"commute","jp":"通勤する／通勤","tier":"S","ref":"TSL 220","note_html":"<code>My commute takes forty minutes.</code>、<code>commute to work by train</code>。名詞 commuter。"},{"w":"weekday","jp":"平日","tier":"S","ref":"TSL 194","note_html":"<code>on a weekday</code>、<code>weekdays only</code>。weekend と対で。"},{"w":"convenient","jp":"便利な、都合のよい","tier":"S","ref":"TSL 54","note_html":"<code>a convenient location / time</code>、<code>if it is convenient for you</code>。人を主語にしない点に注意。"},{"w":"lately","jp":"最近","tier":"S","ref":"TSL 248","note_html":"現在完了とともに使う。<code>Lately I have been ~</code>。late（遅く）の副詞形ではない点が狙われる。"},{"w":"convenience","jp":"便利さ、好都合","tier":"S","ref":"TSL 149","note_html":"<code>for the convenience of ~</code>、<code>at your earliest convenience</code>。形容詞 convenient。"}],"translation":"私の通勤は普通の平日で40分かかりますが、新しい急行路線のほうがはるかに便利です。最近は、主に座席を確保する都合から、早めに家を出るようにしています。","html":"My <b class=\"tg\">commute</b> takes forty minutes on an ordinary <b class=\"tg\">weekday</b>, but the new express line is far more <b class=\"tg\">convenient</b>. <b class=\"tg\">Lately</b> I have been leaving earlier, mainly for the <b class=\"tg\">convenience</b> of finding a seat.","part":5},{"id":83,"theme":"買い物・商業施設","words":[{"w":"supermarket","jp":"スーパーマーケット","tier":"S","ref":"TSL 93","note_html":"<code>shop at the supermarket</code>。grocery store より大型の店を指す。"},{"w":"grocery store","jp":"食料品店","tier":"A","ref":"TSL 257","note_html":"<code>the old grocery store</code>。日常買い物の場面で最頻出。"},{"w":"grocery","jp":"食料雑貨","tier":"A","ref":"TSL 257","note_html":"通常は複数形 groceries（<code>buy groceries</code>）。<code>grocery items</code> のように形容詞的にも使う。"},{"w":"appliance store","jp":"家電量販店","tier":"S","ref":"TSL 88","note_html":"<code>an appliance store opened nearby</code>。appliance は家庭用電化製品。"},{"w":"stationery store","jp":"文房具店","tier":"S","ref":"TSL 205","note_html":"<code>order from the stationery store</code>。stationery（文房具）と stationary（動かない）の綴りに注意。"}],"translation":"エルム通りのスーパーマーケットは古い食料品店より大きく、現在は食料雑貨をまとめ買いできる形で販売しています。同じ複合施設内に家電量販店と文房具店も開店しました。","html":"The <b class=\"tg\">supermarket</b> on Elm Street is larger than the old <b class=\"tg\">grocery store</b>, and it now sells <b class=\"tg\">grocery</b> items in bulk. An <b class=\"tg\">appliance store</b> and a <b class=\"tg\">stationery store</b> have opened in the same complex.","part":5},{"id":84,"theme":"空港・観光","words":[{"w":"baggage claim (area)","jp":"手荷物受取所","tier":"S","ref":"TSL 152","note_html":"<code>collect your bags at the baggage claim area</code>。空港案内の定型。"},{"w":"attendant","jp":"係員、案内係","tier":"S","ref":"TSL 52","note_html":"<code>a parking / flight attendant</code>。「その場で世話をする係」の総称。"},{"w":"cabin","jp":"機内、船室、小屋","tier":"A","ref":"TSL 304","note_html":"<code>cabin bag</code>（機内持ち込み手荷物）、<code>a log cabin</code>。文脈で意味が変わる。"},{"w":"wallet","jp":"財布","tier":"A","ref":"TSL 328","note_html":"<code>keep your wallet ~</code>、<code>leave a wallet behind</code>。Part 1・落とし物の話題に出る。"},{"w":"sightseeing","jp":"観光","tier":"A","ref":"TSL 325","note_html":"<code>a sightseeing bus / tour</code>、<code>go sightseeing</code>。名詞で、前に go を伴う形が多い。"}],"translation":"手荷物受取所で荷物をお受け取りください。そこでは係員が大型の荷物を手伝います。財布は機内持ち込み用のかばんに入れておき、観光バスは3番出口から出発することにご留意ください。","html":"Collect your bags at the <b class=\"tg\">baggage claim area</b>, where an <b class=\"tg\">attendant</b> will help with oversized items. Keep your <b class=\"tg\">wallet</b> in your <b class=\"tg\">cabin</b> bag, and note that the <b class=\"tg\">sightseeing</b> bus departs from Door 3.","part":5},{"id":85,"theme":"監督・立ち入り検査","words":[{"w":"safety inspector","jp":"安全検査官","tier":"A","ref":"TSL 306","note_html":"<code>The safety inspector will visit ~</code>。工場・建設現場の場面で頻出。"},{"w":"inspect","jp":"検査する、点検する","tier":"S","ref":"TSL 139","note_html":"<code>inspect the equipment / dock</code>。名詞 inspection。"},{"w":"supervise","jp":"監督する","tier":"S","ref":"TSL 199","note_html":"<code>supervise the crew / a project</code>。oversee の言い換え。"},{"w":"supervision","jp":"監督、管理","tier":"S","ref":"TSL 199","note_html":"<code>under close supervision</code>、<code>direct supervision is required</code>。不可算名詞。"},{"w":"inspector","jp":"検査官、調査員","tier":"A","ref":"TSL 306","note_html":"<code>a second inspector will review ~</code>。動詞 inspect の行為者形。"}],"translation":"安全検査官が火曜日に荷積み場を検査します。訪問中は直接の監督が求められるため、ヴァンスさんが作業員を監督し、その後もう1名の検査官が報告書を確認します。","html":"The <b class=\"tg\">safety inspector</b> will <b class=\"tg\">inspect</b> the loading dock on Tuesday. Ms. Vance will <b class=\"tg\">supervise</b> the crew, because direct <b class=\"tg\">supervision</b> is required during the visit, and a second <b class=\"tg\">inspector</b> will review the report afterward.","part":5},{"id":86,"theme":"管理部門","words":[{"w":"administrative department","jp":"総務部、管理部門","tier":"S","ref":"TSL 212","note_html":"<code>a notice from the administrative department</code>。組織図の語彙として押さえる。"},{"w":"directory","jp":"名簿、住所録","tier":"A","ref":"TSL 342","note_html":"<code>a staff directory</code>、<code>a building directory</code>（館内案内板）。"},{"w":"administrator","jp":"管理者、事務職員","tier":"A","ref":"TSL 378","note_html":"<code>the new administrator starts Monday</code>。動詞 administer、名詞 administration。"},{"w":"coordination","jp":"調整、連携","tier":"S","ref":"TSL 221","note_html":"<code>careful coordination between departments</code>。動詞 coordinate、名詞 coordinator。"},{"w":"delegation","jp":"代表団、委任","tier":"A","ref":"TSL 274","note_html":"<code>a visiting delegation</code>（訪問団）と <code>delegation of authority</code>（権限委譲）の2義。"}],"translation":"総務部が職員名簿を更新し、新しい事務職員が月曜日から着任します。来週、訪問団が到着する際には入念な調整が必要になります。","html":"The <b class=\"tg\">administrative department</b> has updated the staff <b class=\"tg\">directory</b>, and the new <b class=\"tg\">administrator</b> starts on Monday. Careful <b class=\"tg\">coordination</b> will be needed when the visiting <b class=\"tg\">delegation</b> arrives next week.","part":5},{"id":87,"theme":"給与・福利厚生","words":[{"w":"paycheck","jp":"給料、給与小切手","tier":"A","ref":"TSL 320","note_html":"<code>Your paycheck includes ~</code>、<code>a weekly paycheck</code>。payroll（給与支払名簿）と区別する。"},{"w":"annually","jp":"年に1度、毎年","tier":"A","ref":"TSL 297","note_html":"<code>paid annually</code>、<code>held annually</code>。形容詞 annual。"},{"w":"yearly","jp":"年1回の、毎年","tier":"A","ref":"TSL 411","note_html":"<code>a yearly review</code>。annually とほぼ同義で、言い換え問題に出る。"},{"w":"optional","jp":"任意の、選択制の","tier":"A","ref":"TSL 319","note_html":"<code>Joining is optional.</code>。反意語 mandatory / required。"},{"w":"appreciation","jp":"感謝、正しい評価","tier":"A","ref":"TSL 412","note_html":"<code>a note of appreciation</code>、<code>in appreciation of your service</code>。動詞 appreciate。"}],"translation":"あなたの給与には、年に1度支給される賞与が含まれるようになりました。また、人事考課は毎年3月に行われます。年金制度への加入は任意で、勤続10年に達した職員には感謝状をお送りしています。","html":"Your <b class=\"tg\">paycheck</b> now includes the bonus that is paid <b class=\"tg\">annually</b>, and the performance review is held <b class=\"tg\">yearly</b> in March. Joining the pension plan is <b class=\"tg\">optional</b>, and we send a note of <b class=\"tg\">appreciation</b> to staff who complete ten years.","part":5},{"id":88,"theme":"インターンシップ","words":[{"w":"internship","jp":"インターンシップ、実習期間","tier":"A","ref":"TSL 345","note_html":"<code>apply for an internship</code>、<code>complete an internship</code>。名詞 intern。"},{"w":"enroll","jp":"登録する、入学する","tier":"A","ref":"TSL 353","note_html":"<code>enroll in a course / by June</code>。in が必須。名詞 enrollment。"},{"w":"proficiency","jp":"熟達、能力","tier":"A","ref":"TSL 294","note_html":"<code>proficiency in Spanish</code>。in が必須。形容詞 proficient。語学試験の説明で頻出。"},{"w":"knowledgeable","jp":"知識豊富な","tier":"A","ref":"TSL 346","note_html":"<code>a knowledgeable mentor / guide</code>、<code>knowledgeable about ~</code>。"},{"w":"instruct","jp":"指導する、指示する","tier":"A","ref":"TSL 392","note_html":"<code>instruct new members</code>、<code>instruct someone to do ~</code>。名詞 instruction、instructor。"}],"translation":"インターンシップの応募者は6月までに登録し、スペイン語の熟達度を示さなければなりません。最初の1週間は、知識豊富な指導役が新メンバーそれぞれを指導します。","html":"Applicants for the <b class=\"tg\">internship</b> must <b class=\"tg\">enroll</b> by June and demonstrate <b class=\"tg\">proficiency</b> in Spanish. A <b class=\"tg\">knowledgeable</b> mentor will <b class=\"tg\">instruct</b> each new member during the first week.","part":5},{"id":89,"theme":"業績・収益性","words":[{"w":"impact","jp":"影響","tier":"S","ref":"TSL 171","note_html":"<code>have an impact on ~</code>。on が必須。動詞用法もある。"},{"w":"profitability","jp":"収益性","tier":"A","ref":"TSL 373","note_html":"<code>improve profitability</code>。形容詞 profitable、名詞 profit。"},{"w":"productive","jp":"生産的な、実り多い","tier":"A","ref":"TSL 271","note_html":"<code>a productive quarter / meeting</code>。名詞 productivity、動詞 produce。"},{"w":"incur","jp":"費用などを被る、招く","tier":"A","ref":"TSL 391","note_html":"<code>incur costs / a fee / a penalty</code>。「自ら招いて負担する」の意。過去形は incurred。"},{"w":"outstanding","jp":"優れた／未払いの","tier":"S","ref":"TSL 167","note_html":"<code>outstanding service</code> と <code>an outstanding balance</code>（未払い残高）。TOEICでは後者も出る。"}],"translation":"デザイン刷新は収益性に明確な影響を与え、チームは今四半期、異例なほど生産的でした。より高い配送費を負担してはいるものの、顧客サービスは優れたままです。","html":"The redesign had a clear <b class=\"tg\">impact</b> on <b class=\"tg\">profitability</b>, and the team has been unusually <b class=\"tg\">productive</b> this quarter. Although we <b class=\"tg\">incur</b> higher shipping costs, customer service remains <b class=\"tg\">outstanding</b>.","part":5},{"id":90,"theme":"顧客の愛顧","words":[{"w":"patronage","jp":"愛顧、ひいき","tier":"A","ref":"TSL 269","note_html":"<code>Thank you for your continued patronage.</code>（毎度ご利用ありがとうございます）が定型。"},{"w":"patronize","jp":"ひいきにする、常連になる","tier":"A","ref":"TSL 269","note_html":"<code>patronize a shop</code>。名詞 patron（常連客）。"},{"w":"generously","jp":"気前よく","tier":"A","ref":"TSL 369","note_html":"<code>give generously</code>、<code>generously donated by ~</code>。形容詞 generous。"},{"w":"popularity","jp":"人気","tier":"A","ref":"TSL 335","note_html":"<code>raise / gain popularity</code>、<code>popularity among ~</code>。形容詞 popular。"},{"w":"loyal","jp":"忠実な、常連の","tier":"A","ref":"TSL 393","note_html":"<code>loyal customers / diners</code>。名詞 loyalty、<code>loyalty program</code>。"}],"translation":"日頃のご愛顧に感謝申し上げます。毎週ご利用くださるお客様にはポイントが2倍付与されます。オーナーが地域の活動に気前よく寄付していることも、常連の来店客の間で当店の人気を高めています。","html":"We thank our customers for their continued <b class=\"tg\">patronage</b>, and those who <b class=\"tg\">patronize</b> the shop weekly earn double points. The owner gives <b class=\"tg\">generously</b> to local causes, which has raised the restaurant&#x27;s <b class=\"tg\">popularity</b> among <b class=\"tg\">loyal</b> diners.","part":5},{"id":91,"theme":"配布資料","words":[{"w":"information packet","jp":"資料一式","tier":"A","ref":"TSL 358","note_html":"<code>receive an information packet</code>。説明会で配られる封筒入りの資料を指す。"},{"w":"booklet","jp":"小冊子","tier":"A","ref":"TSL 351","note_html":"<code>a booklet with an overview</code>。pamphlet、brochure と近い語。"},{"w":"overview","jp":"概要","tier":"A","ref":"TSL 396","note_html":"<code>an overview of the program</code>、<code>give a brief overview</code>。summary の言い換え。"},{"w":"specification","jp":"仕様、仕様書","tier":"A","ref":"TSL 360","note_html":"通常は複数形 specs。<code>technical specifications</code>。動詞 specify。"},{"w":"packet","jp":"包み、一式","tier":"A","ref":"TSL 358","note_html":"<code>a second packet</code>、<code>a packet of documents</code>。package より小さいまとまり。"}],"translation":"参加者はそれぞれ、プログラムの概要を記した小冊子が入った資料一式を受け取ります。技術仕様は2つ目の包みに入っており、入口で配布されます。","html":"Each participant receives an <b class=\"tg\">information packet</b> containing a <b class=\"tg\">booklet</b> with an <b class=\"tg\">overview</b> of the program. The technical <b class=\"tg\">specification</b> is in a second <b class=\"tg\">packet</b>, which is handed out at the door.","part":5},{"id":92,"theme":"客室・宿泊","words":[{"w":"suite","jp":"スイートルーム、続き部屋","tier":"A","ref":"TSL 261","note_html":"<code>the corner suite</code>、<code>a two-room suite</code>。発音は /swiːt/ で sweet と同じ。"},{"w":"furnished","jp":"家具付きの","tier":"A","ref":"TSL 418","note_html":"<code>come fully furnished</code>、<code>a furnished apartment</code>。名詞 furniture、furnishings。"},{"w":"sofa","jp":"ソファ","tier":"S","ref":"TSL 216","note_html":"<code>a leather sofa</code>。couch と同義でPart 1に出る。"},{"w":"air conditioner","jp":"エアコン","tier":"A","ref":"TSL 352","note_html":"<code>install a new air conditioner</code>。動詞句は air-condition。"},{"w":"occupancy","jp":"入居、収容人数","tier":"A","ref":"TSL 293","note_html":"<code>Occupancy is limited to four.</code>、<code>maximum occupancy</code>（最大収容人数）。形容詞 occupied。"}],"translation":"角のスイートルームは家具が完備されており、革張りのソファと新しく設置されたエアコンがあります。収容人数は1室あたり4名までです。","html":"The corner <b class=\"tg\">suite</b> comes fully <b class=\"tg\">furnished</b>, with a leather <b class=\"tg\">sofa</b> and a newly installed <b class=\"tg\">air conditioner</b>. <b class=\"tg\">Occupancy</b> is limited to four guests per room.","part":5},{"id":93,"theme":"衣類・洗濯","words":[{"w":"garment","jp":"衣類、衣服1点","tier":"A","ref":"TSL 355","note_html":"<code>a stained garment</code>、<code>the garment industry</code>（アパレル産業）。clothes より個別の1点を指す。"},{"w":"dry cleaner","jp":"クリーニング店","tier":"S","ref":"TSL 201","note_html":"<code>send it to the dry cleaner</code>、<code>pick up from the dry cleaner&#x27;s</code>。"},{"w":"laundry","jp":"洗濯物、洗濯","tier":"A","ref":"TSL 420","note_html":"<code>do the laundry</code>、<code>a laundry basket</code>。不可算名詞。"},{"w":"cloth","jp":"布、ふきん","tier":"S","ref":"TSL 31","note_html":"<code>a soft cloth</code>。cloth（布）／ clothes（衣服）／ clothing（衣類全般）の3語の区別が狙われる。"},{"w":"laundry equipment","jp":"洗濯設備","tier":"A","ref":"TSL 420","note_html":"<code>laundry equipment is free for residents</code>。集合住宅の設備説明で出る。"}],"translation":"しみのついた衣類はクリーニング店に出し、それ以外は洗濯かごに入れてください。画面には柔らかい布のほうが適しています。また、3階の洗濯設備は入居者は無料でご利用いただけます。","html":"Send the stained <b class=\"tg\">garment</b> to the <b class=\"tg\">dry cleaner</b>, and put everything else in the <b class=\"tg\">laundry</b> basket. A soft <b class=\"tg\">cloth</b> works better on the screen, and the <b class=\"tg\">laundry equipment</b> on the third floor is free for residents.","part":5},{"id":94,"theme":"家電・電源","words":[{"w":"refrigerator","jp":"冷蔵庫","tier":"A","ref":"TSL 374","note_html":"短縮形 fridge。<code>plug in the refrigerator</code>。"},{"w":"vacuum (cleaner)","jp":"掃除機","tier":"A","ref":"TSL 409","note_html":"<code>run / use a vacuum cleaner</code>。動詞 vacuum（掃除機をかける）。"},{"w":"power outlet","jp":"コンセント","tier":"A","ref":"TSL 357","note_html":"<code>plug into the power outlet</code>。日本語の「コンセント」は英語では通じない。"},{"w":"outlet","jp":"コンセント、直販店、出口","tier":"A","ref":"TSL 357","note_html":"<code>another outlet behind the desk</code>、<code>an outlet mall</code>。多義語として狙われる。"},{"w":"rechargeable battery","jp":"充電池","tier":"S","ref":"TSL 165","note_html":"<code>a spare rechargeable battery</code>。動詞 recharge、形容詞 rechargeable。"}],"translation":"冷蔵庫と掃除機を同じコンセントに差し込まないでください。机の後ろにもう1つコンセントがあり、予備の充電池は引き出しに保管しています。","html":"Do not plug the <b class=\"tg\">refrigerator</b> and the <b class=\"tg\">vacuum cleaner</b> into the same <b class=\"tg\">power outlet</b>. There is another <b class=\"tg\">outlet</b> behind the desk, and a spare <b class=\"tg\">rechargeable battery</b> is kept in the drawer.","part":5},{"id":95,"theme":"工具・安全","words":[{"w":"drill","jp":"ドリル／訓練","tier":"A","ref":"TSL 331","note_html":"<code>borrow a drill</code>、<code>a fire drill</code>（避難訓練）。工具と訓練の2義がある。"},{"w":"hardware store","jp":"金物店、ホームセンター","tier":"A","ref":"TSL 444","note_html":"<code>buy tools at the hardware store</code>。"},{"w":"glove","jp":"手袋","tier":"A","ref":"TSL 443","note_html":"通常は複数形 gloves。<code>wear gloves</code>、<code>rubber gloves</code>。"},{"w":"protective","jp":"保護用の","tier":"A","ref":"TSL 322","note_html":"<code>protective eyewear / clothing / gear</code>。動詞 protect、名詞 protection。"},{"w":"hardware","jp":"金物、工具類、ハードウェア","tier":"A","ref":"TSL 444","note_html":"不可算名詞。<code>return all hardware</code>。IT文脈では機器を指す。"}],"translation":"角の金物店でドリルを借り、配管を切断する際は手袋を着用してください。保護用の眼鏡が必須で、工具類はすべて金曜日までに返却する必要があります。","html":"Borrow a <b class=\"tg\">drill</b> from the <b class=\"tg\">hardware store</b> on the corner, and wear a <b class=\"tg\">glove</b> while cutting the pipe. <b class=\"tg\">Protective</b> eyewear is required, and all <b class=\"tg\">hardware</b> must be returned by Friday.","part":5},{"id":96,"theme":"美術・展示","words":[{"w":"photography","jp":"写真撮影、写真術","tier":"A","ref":"TSL 286","note_html":"<code>landscape photography</code>、<code>an exhibition of photography</code>。photograph（写真1枚）と区別する。"},{"w":"oval","jp":"楕円形の","tier":"S","ref":"TSL 59","note_html":"<code>an oval garden / table / mirror</code>。round、rectangular、square と並ぶ形状語。"},{"w":"sculpture","jp":"彫刻","tier":"A","ref":"TSL 287","note_html":"<code>a bronze sculpture</code>、<code>a sculpture garden</code>。名詞 sculptor（彫刻家）。"},{"w":"fountain","jp":"噴水","tier":"A","ref":"TSL 332","note_html":"<code>stand near the fountain</code>、<code>a water fountain</code>（水飲み場）。Part 1に頻出。"},{"w":"organizer","jp":"主催者、まとめ役","tier":"A","ref":"TSL 347","note_html":"<code>the event organizer</code>。動詞 organize、名詞 organization。"}],"translation":"風景写真の展覧会が楕円形の庭園のそばで開幕します。そこでは噴水の近くに青銅の彫刻が立っています。イベント主催者は初日に200名の来場を見込んでいます。","html":"The exhibition of landscape <b class=\"tg\">photography</b> opens beside the <b class=\"tg\">oval</b> garden, where a bronze <b class=\"tg\">sculpture</b> stands near the <b class=\"tg\">fountain</b>. The event <b class=\"tg\">organizer</b> expects two hundred visitors on the first day.","part":5},{"id":97,"theme":"昼食会","words":[{"w":"luncheon","jp":"昼食会","tier":"A","ref":"TSL 394","note_html":"<code>an awards luncheon</code>、<code>host a luncheon</code>。lunch の格式ばった語で、行事を指す。"},{"w":"buffet","jp":"ビュッフェ、立食","tier":"A","ref":"TSL 289","note_html":"<code>served buffet style</code>、<code>a breakfast buffet</code>。発音は /bəˈfeɪ/。"},{"w":"designated","jp":"指定された","tier":"A","ref":"TSL 255","note_html":"<code>the designated dining room / area / driver</code>。動詞 designate。"},{"w":"casual","jp":"普段着の、略式の","tier":"A","ref":"TSL 330","note_html":"<code>casual dress / attire is acceptable</code>。formal と対で。"},{"w":"jewelry","jp":"宝飾品","tier":"S","ref":"TSL 163","note_html":"不可算名詞。<code>valuable jewelry</code>、<code>a piece of jewelry</code>。英国式は jewellery。"}],"translation":"昼食会は指定された食堂でビュッフェ形式で提供され、普段着でも差し支えありません。高価な宝飾品はご自宅に置いてきてください。","html":"The <b class=\"tg\">luncheon</b> will be served <b class=\"tg\">buffet</b> style in the <b class=\"tg\">designated</b> dining room, and <b class=\"tg\">casual</b> dress is acceptable. Please leave valuable <b class=\"tg\">jewelry</b> at home.","part":5},{"id":98,"theme":"数値・計算","words":[{"w":"calculator","jp":"計算機、電卓","tier":"A","ref":"TSL 276","note_html":"<code>bring a calculator</code>。動詞 calculate。"},{"w":"calculation","jp":"計算、算定","tier":"A","ref":"TSL 459","note_html":"<code>check the calculation</code>、<code>according to our calculations</code>。"},{"w":"accurately","jp":"正確に","tier":"A","ref":"TSL 303","note_html":"<code>check accurately</code>、<code>accurately reflect ~</code>。形容詞 accurate、名詞 accuracy。"},{"w":"correctly","jp":"正しく","tier":"S","ref":"TSL 47","note_html":"<code>entered correctly</code>、<code>spelled correctly</code>。形容詞 correct、名詞 correction。"},{"w":"prediction","jp":"予測","tier":"A","ref":"TSL 349","note_html":"<code>make a prediction</code>、<code>the prediction for next quarter</code>。動詞 predict、形容詞 predictable。"}],"translation":"すべての計算を正確に確認できるよう、電卓を持参してください。数値が正しく入力されていれば、次四半期の予測は信頼できるはずです。","html":"Bring a <b class=\"tg\">calculator</b> so that every <b class=\"tg\">calculation</b> can be checked <b class=\"tg\">accurately</b>. If the figures are entered <b class=\"tg\">correctly</b>, the <b class=\"tg\">prediction</b> for next quarter should be reliable.","part":5},{"id":99,"theme":"データ管理","words":[{"w":"delete","jp":"削除する","tier":"A","ref":"TSL 299","note_html":"<code>delete the old file</code>。名詞 deletion。反意語 add。"},{"w":"definitive","jp":"決定版の、最終的な","tier":"A","ref":"TSL 364","note_html":"<code>the definitive version / edition</code>。「これ以上変更しない完成形」の意。"},{"w":"definite","jp":"明確な、確定した","tier":"A","ref":"TSL 364","note_html":"<code>a definite date / answer</code>。副詞 definitely。definitive との意味差が狙われる。"},{"w":"usage","jp":"使用量、語法","tier":"A","ref":"TSL 386","note_html":"<code>data usage is monitored</code>、<code>water usage</code>。use の名詞形だが「使用量」の含意が強い。"},{"w":"exclusive","jp":"限定の、独占的な","tier":"A","ref":"TSL 256","note_html":"<code>exclusive to members</code>、<code>an exclusive offer</code>。副詞 exclusively。"}],"translation":"決定版がアップロードされ次第、古いファイルを削除してください。ただし、確定した日付はまだ決まっていません。データ使用量は監視されており、その保存記録は登録会員限定です。","html":"<b class=\"tg\">Delete</b> the old file once the <b class=\"tg\">definitive</b> version has been uploaded, although a <b class=\"tg\">definite</b> date has not been set. Data <b class=\"tg\">usage</b> is monitored, and the archive is <b class=\"tg\">exclusive</b> to registered members.","part":5},{"id":100,"theme":"協力・謝辞","words":[{"w":"on behalf of","jp":"〜を代表して、〜に代わって","tier":"A","ref":"TSL 317","note_html":"<code>On behalf of the department, thank you ~</code>。スピーチ・書簡の冒頭定型。"},{"w":"cooperative","jp":"協力的な","tier":"A","ref":"TSL 414","note_html":"<code>Thank you for being so cooperative.</code>、<code>a cooperative effort</code>。"},{"w":"in spite of","jp":"〜にもかかわらず","tier":"A","ref":"TSL 281","note_html":"<code>In spite of the short notice, ~</code>。despite と同義だが of が必要。後ろは名詞句。"},{"w":"accommodating","jp":"親切な、便宜を図ってくれる","tier":"S","ref":"TSL 217","note_html":"<code>The staff were extremely accommodating.</code>。動詞 accommodate から。"},{"w":"cooperate","jp":"協力する","tier":"A","ref":"TSL 414","note_html":"<code>cooperate with ~</code>。名詞 cooperation、形容詞 cooperative。"}],"translation":"部門を代表して、皆さまのご協力に感謝申し上げます。急なお願いにもかかわらず、ホテルの職員はきわめて親切に対応してくださいました。今後も両チームが協力し続けることを願っています。","html":"<b class=\"tg\">On behalf of</b> the department, thank you all for being so <b class=\"tg\">cooperative</b>. <b class=\"tg\">In spite of</b> the short notice, the hotel staff were extremely <b class=\"tg\">accommodating</b>, and we hope the two teams will continue to <b class=\"tg\">cooperate</b>.","part":5},{"id":101,"theme":"人材・組織","words":[{"w":"resignation","jp":"辞職、辞表","tier":"A","ref":"TSL 473","note_html":"<code>submit / accept a resignation</code>、<code>two resignations last month</code>。動詞 resign（<code>resign from a post</code>）。"},{"w":"workforce","jp":"従業員全体、労働力","tier":"A","ref":"TSL 561","note_html":"<code>reduce / expand the workforce</code>。集合名詞で、企業の人員全体を指す。"},{"w":"inexperienced","jp":"経験の浅い","tier":"A","ref":"TSL 465","note_html":"<code>inexperienced staff</code>。反意語 experienced。in- が否定の接頭辞。"},{"w":"apprentice","jp":"見習い、実習生","tier":"A","ref":"TSL 565","note_html":"<code>hire an apprentice</code>。名詞 apprenticeship（見習い期間）。"},{"w":"managerial","jp":"管理職の、経営の","tier":"A","ref":"TSL 526","note_html":"<code>managerial skills / experience / position</code>。名詞 manager、management。"}],"translation":"先月の2名の辞職により、当社の従業員数は10%近く減りました。残った職員は経験が浅いため、会社は見習いを1名採用し、管理職としての技能を持つ人材を探しています。","html":"Two <b class=\"tg\">resignations</b> last month reduced our <b class=\"tg\">workforce</b> by nearly ten percent. The remaining staff are <b class=\"tg\">inexperienced</b>, so the company has hired an <b class=\"tg\">apprentice</b> and is looking for someone with <b class=\"tg\">managerial</b> skills.","part":6},{"id":102,"theme":"中断・妨げ","words":[{"w":"interrupt","jp":"中断する、邪魔をする","tier":"A","ref":"TSL 370","note_html":"<code>interrupt the seminar / a speaker</code>。名詞 interruption。"},{"w":"disruption","jp":"混乱、中断","tier":"A","ref":"TSL 519","note_html":"<code>cause a disruption</code>、<code>service disruption</code>。動詞 disrupt、形容詞 disruptive。"},{"w":"distracting","jp":"気を散らす、注意をそらすような","tier":"A","ref":"TSL 415","note_html":"<code>find the sound distracting</code>。**物・事**を主語にする -ing 形。"},{"w":"distract","jp":"注意をそらす","tier":"A","ref":"TSL 415","note_html":"<code>distract the speaker</code>、<code>be distracted by noise</code>。人が主語なら distracted。"},{"w":"temporarily","jp":"一時的に","tier":"A","ref":"TSL 429","note_html":"<code>temporarily closed / unavailable</code>。形容詞 temporary、反意語 permanently。"}],"translation":"工事の騒音がセミナーを中断させ、その混乱は午前中いっぱい続くかもしれません。音が気になる方はB室へ移動してください。掘削作業が登壇者の妨げになるのは一時的なものです。","html":"Construction noise will <b class=\"tg\">interrupt</b> the seminar, and the <b class=\"tg\">disruption</b> may last all morning. Anyone who finds the sound <b class=\"tg\">distracting</b> should move to Room B, because the drilling will <b class=\"tg\">distract</b> speakers only <b class=\"tg\">temporarily</b>.","part":6},{"id":103,"theme":"物流・荷役","words":[{"w":"cargo","jp":"積荷、貨物","tier":"A","ref":"TSL 413","note_html":"<code>a cargo ship</code>、<code>load cargo</code>。freight とほぼ同義。"},{"w":"dock","jp":"波止場、荷積み場／接岸する","tier":"S","ref":"TSL 246","note_html":"<code>reach the dock</code>、<code>the loading dock</code>。名詞・動詞の両用法。"},{"w":"shortage","jp":"不足","tier":"A","ref":"TSL 398","note_html":"<code>a shortage of forklifts / staff / supplies</code>。of が続く。動詞 shorten とは別語。"},{"w":"stack","jp":"積み重ねる／山","tier":"A","ref":"TSL 273","note_html":"<code>stack the crates</code>、<code>a stack of papers</code>。Part 1の写真描写に頻出。"},{"w":"remainder","jp":"残り、残余","tier":"A","ref":"TSL 534","note_html":"<code>store the remainder</code>、<code>the remainder of the year</code>。動詞 remain、形容詞 remaining。"}],"translation":"貨物船は夜明けに波止場に到着しましたが、フォークリフトの不足で作業が滞りました。木箱は大きさごとに積み重ね、残りは側面の倉庫に保管してください。","html":"The <b class=\"tg\">cargo</b> ship reached the <b class=\"tg\">dock</b> at dawn, but a <b class=\"tg\">shortage</b> of forklifts slowed the work. Please <b class=\"tg\">stack</b> the crates by size and store the <b class=\"tg\">remainder</b> in the side warehouse.","part":6},{"id":104,"theme":"費用の比較","words":[{"w":"costly","jp":"費用のかかる、高くつく","tier":"A","ref":"TSL 461","note_html":"<code>Air freight is costly.</code>。-ly で終わるが**形容詞**である点が狙われる。"},{"w":"economical","jp":"経済的な、割安な","tier":"A","ref":"TSL 365","note_html":"<code>an economical option</code>。economic（経済の）との意味差が最頻出の出題ポイント。"},{"w":"inexpensive","jp":"安価な","tier":"A","ref":"TSL 483","note_html":"<code>the inexpensive model</code>。cheap の婉曲表現で、書き言葉ではこちらを使う。"},{"w":"considerably","jp":"かなり、相当に","tier":"A","ref":"TSL 496","note_html":"<code>considerably less power</code>、<code>considerably higher</code>。比較級を強める副詞。"},{"w":"premium","jp":"高級な、割増の／割増金","tier":"A","ref":"TSL 584","note_html":"<code>the premium version</code>、<code>a premium price</code>。形容詞・名詞の両用法。"}],"translation":"航空貨物は費用がかかるため、船便のほうがはるかに経済的です。安価なモデルは消費電力がかなり少なくて済みますが、高級版には長い保証が付いています。","html":"Air freight is <b class=\"tg\">costly</b>, so shipping by sea is far more <b class=\"tg\">economical</b>. The <b class=\"tg\">inexpensive</b> model uses <b class=\"tg\">considerably</b> less power, although the <b class=\"tg\">premium</b> version comes with a longer warranty.","part":6},{"id":105,"theme":"組立・機械","words":[{"w":"assemble","jp":"組み立てる、集まる","tier":"A","ref":"TSL 435","note_html":"<code>assemble the frames</code>、<code>Staff assembled in the lobby.</code>。他動詞・自動詞の両用法。"},{"w":"automatic","jp":"自動の","tier":"A","ref":"TSL 436","note_html":"<code>the automatic welding stage</code>、<code>an automatic door</code>。副詞 automatically、動詞 automate。"},{"w":"mechanical engineer","jp":"機械技師","tier":"A","ref":"TSL 422","note_html":"<code>a mechanical engineer inspects ~</code>。職種名としてPart 7の求人に出る。"},{"w":"mechanical","jp":"機械の、機械的な","tier":"A","ref":"TSL 422","note_html":"<code>a mechanical part / failure</code>。名詞 mechanic（整備士）、mechanism。"},{"w":"assembly","jp":"組立、組立品、集会","tier":"A","ref":"TSL 540","note_html":"<code>the whole assembly takes ~</code>、<code>an assembly line</code>。動詞 assemble の名詞形。"}],"translation":"作業員は自動溶接の工程の前に、手作業で枠を組み立てます。機械技師が各機械部品を点検し、組立全体には約40分かかります。","html":"Workers will <b class=\"tg\">assemble</b> the frames by hand before the <b class=\"tg\">automatic</b> welding stage. A <b class=\"tg\">mechanical engineer</b> inspects each <b class=\"tg\">mechanical</b> part, and the whole <b class=\"tg\">assembly</b> takes about forty minutes.","part":6},{"id":106,"theme":"品質・相談","words":[{"w":"obtain","jp":"得る、入手する","tier":"S","ref":"TSL 58","note_html":"<code>obtain a longer service life / permission / a license</code>。get の格式ばった語。"},{"w":"reinforce","jp":"補強する、強化する","tier":"A","ref":"TSL 407","note_html":"<code>reinforce the joints</code>、<code>reinforce a message</code>。物理的にも比喩的にも使う。"},{"w":"durability","jp":"耐久性","tier":"A","ref":"TSL 442","note_html":"<code>test the durability</code>。形容詞 durable。"},{"w":"superior","jp":"優れた、上位の","tier":"A","ref":"TSL 492","note_html":"<code>the superior grade</code>、<code>superior to ~</code>（〜より優れている）。than ではなく to をとる。"},{"w":"consultation","jp":"相談、診察","tier":"A","ref":"TSL 441","note_html":"<code>book a consultation</code>、<code>in consultation with ~</code>。動詞 consult、名詞 consultant。"}],"translation":"より長い耐用年数を得るため、技術者は接合部を補強し、塗装の耐久性を試験します。上位グレードは価格が高いため、ご注文の前に相談のご予約をお願いします。","html":"To <b class=\"tg\">obtain</b> a longer service life, engineers will <b class=\"tg\">reinforce</b> the joints and test the <b class=\"tg\">durability</b> of the coating. The <b class=\"tg\">superior</b> grade costs more, so please book a <b class=\"tg\">consultation</b> before ordering.","part":6},{"id":107,"theme":"職業","words":[{"w":"carpenter","jp":"大工","tier":"A","ref":"TSL 438","note_html":"<code>The carpenter finished the shelves.</code>。名詞 carpentry（大工仕事）。"},{"w":"electrician","jp":"電気技師","tier":"A","ref":"TSL 520","note_html":"<code>an electrician rewired ~</code>。形容詞 electrical、名詞 electricity。"},{"w":"librarian","jp":"司書","tier":"A","ref":"TSL 467","note_html":"<code>ask the librarian</code>。library（図書館）から。Part 3の図書館場面で登場。"},{"w":"banker","jp":"銀行員","tier":"A","ref":"TSL 316","note_html":"<code>a local banker</code>。bank（銀行）＋-er。"},{"w":"conductor","jp":"車掌、指揮者","tier":"A","ref":"TSL 305","note_html":"<code>a train conductor</code> と <code>an orchestra conductor</code> の2義。動詞 conduct（実施する）と併せて。"}],"translation":"大工が棚を仕上げ、電気技師が読書室の配線をやり直しました。司書は両者に感謝を述べ、地元の銀行員と列車の車掌も再開式に出席しました。","html":"The <b class=\"tg\">carpenter</b> finished the shelves, and an <b class=\"tg\">electrician</b> rewired the reading room. The <b class=\"tg\">librarian</b> thanked them both, while a local <b class=\"tg\">banker</b> and a train <b class=\"tg\">conductor</b> attended the reopening.","part":6},{"id":108,"theme":"SNS・宣伝","words":[{"w":"social media","jp":"ソーシャルメディア、SNS","tier":"S","ref":"TSL 92","note_html":"<code>social media posts / campaign</code>。不可算扱いが一般的。"},{"w":"celebrity","jp":"著名人","tier":"A","ref":"TSL 517","note_html":"<code>a celebrity has agreed to ~</code>、<code>celebrity endorsement</code>（有名人の推薦）。"},{"w":"portfolio","jp":"作品集、資産の組み合わせ","tier":"A","ref":"TSL 507","note_html":"<code>a designer&#x27;s portfolio</code>、<code>an investment portfolio</code>。2分野で出る。"},{"w":"innovative","jp":"革新的な","tier":"S","ref":"TSL 172","note_html":"<code>an innovative use / design / approach</code>。名詞 innovation、動詞 innovate。"},{"w":"alike","jp":"似ている、同様に","tier":"S","ref":"TSL 207","note_html":"<code>No two pieces look alike.</code>。**名詞の前には置けない**叙述用法専用の語。"}],"translation":"当社のSNS投稿は紙媒体の広告よりはるかに多くの人に届いており、ある著名人がこのシリーズの宣伝を引き受けました。そのデザイナーの作品集には再生繊維の革新的な使い方が示されており、同じ形の作品は2つとありません。","html":"Our <b class=\"tg\">social media</b> posts reach far more people than print advertising, and a <b class=\"tg\">celebrity</b> has agreed to promote the line. The designer&#x27;s <b class=\"tg\">portfolio</b> shows an <b class=\"tg\">innovative</b> use of recycled fabric, and no two pieces look <b class=\"tg\">alike</b>.","part":6},{"id":109,"theme":"統計・予測","words":[{"w":"statistics","jp":"統計、統計数値","tier":"A","ref":"TSL 510","note_html":"<code>The statistics show that ~</code>。複数扱い。学問名としては単数扱い。形容詞 statistical。"},{"w":"steadily","jp":"着実に、絶え間なく","tier":"A","ref":"TSL 536","note_html":"<code>rise / grow steadily</code>。形容詞 steady。"},{"w":"projection","jp":"予測、投影","tier":"A","ref":"TSL 552","note_html":"<code>the projection for December</code>、<code>sales projections</code>。動詞 project（予測する）。"},{"w":"misleading","jp":"誤解を招く","tier":"A","ref":"TSL 503","note_html":"<code>a misleading chart / advertisement</code>。動詞 mislead（mislead–misled–misled）。"},{"w":"thoroughly","jp":"徹底的に、入念に","tier":"A","ref":"TSL 384","note_html":"<code>review the figures thoroughly</code>。形容詞 thorough。through（〜を通って）と混同しない。"}],"translation":"統計は、3月以降売上が着実に伸びていることを示しており、12月の予測も明るいものです。1つのグラフだけでは誤解を招く恐れがあるため、数値は入念に確認してください。","html":"The <b class=\"tg\">statistics</b> show that sales have risen <b class=\"tg\">steadily</b> since March, and the <b class=\"tg\">projection</b> for December is optimistic. A single chart can be <b class=\"tg\">misleading</b>, so please review the figures <b class=\"tg\">thoroughly</b>.","part":6},{"id":110,"theme":"校正・改訂","words":[{"w":"proofreader","jp":"校正者","tier":"A","ref":"TSL 532","note_html":"<code>The proofreader returned the manuscript.</code>。動詞 proofread。"},{"w":"lengthy","jp":"長々とした","tier":"A","ref":"TSL 466","note_html":"<code>a lengthy list / discussion / delay</code>。long より「長すぎる」という否定的含意がある。"},{"w":"revision","jp":"改訂、修正版","tier":"A","ref":"TSL 450","note_html":"<code>a third revision</code>、<code>make revisions to ~</code>。動詞 revise。"},{"w":"accomplishment","jp":"成果、業績","tier":"A","ref":"TSL 400","note_html":"<code>a real accomplishment</code>。動詞 accomplish、形容詞 accomplished（熟練した）。"},{"w":"patience","jp":"忍耐、辛抱","tier":"A","ref":"TSL 447","note_html":"<code>Thank you for your patience.</code>（お待ちいただきありがとうございます）が定型。形容詞 patient。"}],"translation":"校正者が長々とした修正一覧とともに原稿を返してきたため、3度目の改訂が必要です。索引を完成させたことは大きな成果であり、お待ちいただいたことに感謝します。","html":"The <b class=\"tg\">proofreader</b> returned the manuscript with a <b class=\"tg\">lengthy</b> list of corrections, so a third <b class=\"tg\">revision</b> is needed. Completing the index was a real <b class=\"tg\">accomplishment</b>, and we appreciate your <b class=\"tg\">patience</b>.","part":6},{"id":111,"theme":"有効期限・資格","words":[{"w":"expiration date","jp":"有効期限、賞味期限","tier":"A","ref":"TSL 546","note_html":"<code>check the expiration date</code>。英国式は expiry date。"},{"w":"certification","jp":"認証、資格認定","tier":"A","ref":"TSL 542","note_html":"<code>renew your certification</code>。動詞 certify、名詞 certificate（証明書そのもの）。"},{"w":"expiration","jp":"満了、失効","tier":"A","ref":"TSL 546","note_html":"<code>before its expiration</code>。動詞 expire。"},{"w":"unlimited","jp":"無制限の","tier":"A","ref":"TSL 512","note_html":"<code>an unlimited plan / access</code>。反意語 limited。"},{"w":"alert","jp":"通知、警報／警戒した","tier":"A","ref":"TSL 515","note_html":"<code>receive an alert</code>、<code>stay alert</code>。名詞・形容詞・動詞の3用法がある。"}],"translation":"ご使用の前にラベルの有効期限をご確認ください。資格認定は失効前に更新する必要があり、無制限プランの会員には1か月前にメールで通知が届きます。","html":"Check the <b class=\"tg\">expiration date</b> on the label before use. Your <b class=\"tg\">certification</b> must be renewed before its <b class=\"tg\">expiration</b>, and members with an <b class=\"tg\">unlimited</b> plan receive an <b class=\"tg\">alert</b> by e-mail one month in advance.","part":6},{"id":112,"theme":"不動産・周辺環境","words":[{"w":"vacant","jp":"空いている、空室の","tier":"A","ref":"TSL 538","note_html":"<code>a vacant office / position</code>。名詞 vacancy、動詞 vacate。"},{"w":"suburb","jp":"郊外","tier":"A","ref":"TSL 554","note_html":"<code>in the suburb(s) of ~</code>。形容詞 suburban。downtown と対で。"},{"w":"ceiling","jp":"天井","tier":"A","ref":"TSL 567","note_html":"<code>a high ceiling</code>。floor と対で。Part 1の室内描写に出る。"},{"w":"lawn","jp":"芝生","tier":"A","ref":"TSL 501","note_html":"<code>a well-kept lawn</code>、<code>mow the lawn</code>（芝を刈る）。名詞 lawn mower。"},{"w":"pedestrian","jp":"歩行者、歩行者用の","tier":"A","ref":"TSL 551","note_html":"<code>a pedestrian path / crossing</code>。名詞・形容詞の両用法。"}],"translation":"郊外にあるその空きオフィスは天井が高く、裏手には手入れの行き届いた芝生があります。歩行者用の小道が建物と駅をつないでいます。","html":"The <b class=\"tg\">vacant</b> office in the <b class=\"tg\">suburb</b> has a high <b class=\"tg\">ceiling</b> and a well-kept <b class=\"tg\">lawn</b> at the rear. A <b class=\"tg\">pedestrian</b> path connects the building to the station.","part":6},{"id":113,"theme":"衣類・持ち物","words":[{"w":"misplace","jp":"置き忘れる、置き場所を間違える","tier":"A","ref":"TSL 504","note_html":"<code>misplace a purse / file</code>。lose と違い「どこかにあるが見つからない」の意。"},{"w":"purse","jp":"ハンドバッグ、財布","tier":"A","ref":"TSL 486","note_html":"米国では女性用バッグ、英国では小銭入れ。<code>leave a purse behind</code>。"},{"w":"accessory","jp":"装身具、付属品","tier":"A","ref":"TSL 539","note_html":"<code>a small accessory</code>、<code>car accessories</code>。2分野で使う。"},{"w":"sleeved","jp":"袖のある","tier":"A","ref":"TSL 553","note_html":"<code>a long-sleeved jacket</code>、<code>short-sleeved shirt</code>。複合語でのみ使う形。Part 1の服装描写。"},{"w":"laundry basket","jp":"洗濯かご","tier":"A","ref":"TSL 541","note_html":"<code>beside the laundry basket</code>。laundry（洗濯物）から。"}],"translation":"ある宿泊客が、フィットネスルームにハンドバッグと小さな装身具を置き忘れたと申し出ました。また、2階の洗濯かごの脇には長袖の上着も残されていました。","html":"A guest reported that she had <b class=\"tg\">misplaced</b> her <b class=\"tg\">purse</b> and a small <b class=\"tg\">accessory</b> in the fitness room. A long-<b class=\"tg\">sleeved</b> jacket was also left beside the <b class=\"tg\">laundry basket</b> on the second floor.","part":6},{"id":114,"theme":"工事による不便","words":[{"w":"inconvenient","jp":"不便な、都合の悪い","tier":"S","ref":"TSL 54","note_html":"<code>an inconvenient location / time</code>。名詞 inconvenience。"},{"w":"frustrated","jp":"いらだった","tier":"A","ref":"TSL 354","note_html":"<code>Many are frustrated by the delay.</code>。**人**が主語の -ed 形。"},{"w":"prohibitive","jp":"法外に高い、禁止的な","tier":"S","ref":"TSL 191","note_html":"<code>prohibitive costs</code>。prohibit（禁止する）から派生し、「高すぎて事実上不可能」の意。"},{"w":"frustrating","jp":"いらだたしい","tier":"A","ref":"TSL 354","note_html":"<code>Waiting is frustrating.</code>。**物・事**が主語の -ing 形。frustrated との使い分けが頻出。"},{"w":"reopen","jp":"再開する、再び開く","tier":"A","ref":"TSL 489","note_html":"<code>The lane will reopen in June.</code>。re-＋open。"}],"translation":"道路の閉鎖は住民にとって不便で、多くの人が遅れにいらだっています。古いほうの橋を修復するのは費用が法外にかかり、部品を待つのはいらだたしいことですが、その車線は6月に再開通します。","html":"The road closure has been <b class=\"tg\">inconvenient</b> for residents, and many are <b class=\"tg\">frustrated</b> by the delay. Repairing the older bridge would be <b class=\"tg\">prohibitive</b>, and waiting for parts is <b class=\"tg\">frustrating</b>, but the lane will <b class=\"tg\">reopen</b> in June.","part":6},{"id":115,"theme":"頻度・期間","words":[{"w":"seldom","jp":"めったに〜ない","tier":"A","ref":"TSL 251","note_html":"<code>Our supplier seldom raises prices.</code>。否定語なので not は不要。rarely と同義。"},{"w":"commonly","jp":"一般に、よく","tier":"S","ref":"TSL 214","note_html":"<code>not commonly reported</code>、<code>commonly used</code>。形容詞 common。"},{"w":"duration","jp":"期間、継続時間","tier":"A","ref":"TSL 266","note_html":"<code>the duration of the trial</code>、<code>for the duration of ~</code>。during と語源が同じ。"},{"w":"in the meantime","jp":"その間に、それまでは","tier":"A","ref":"TSL 468","note_html":"<code>In the meantime, use the old form.</code>。文頭で用いる定型句。"},{"w":"afterwards","jp":"その後で","tier":"A","ref":"TSL 433","note_html":"<code>We will send it afterwards.</code>。米国式は afterward。after は前置詞・接続詞なので単独では使えない。"}],"translation":"当社の仕入先はめったに値上げをせず、遅延も一般には報告されていません。試用期間は6週間です。それまでは旧様式をお使いください。新しい様式はその後にお送りします。","html":"Our supplier <b class=\"tg\">seldom</b> raises prices, and delays are not <b class=\"tg\">commonly</b> reported. The <b class=\"tg\">duration</b> of the trial is six weeks; <b class=\"tg\">in the meantime</b>, use the old form, and we will send the new one <b class=\"tg\">afterwards</b>.","part":6},{"id":116,"theme":"慣れ・不案内","words":[{"w":"unfamiliar","jp":"不案内な、なじみのない","tier":"A","ref":"TSL 477","note_html":"<code>be unfamiliar with the software</code>。with が必須。反意語 familiar。"},{"w":"suited","jp":"適した","tier":"A","ref":"TSL 261","note_html":"<code>better suited to their needs</code>、<code>be suited for the job</code>。動詞 suit（似合う、適する）から。"},{"w":"be accustomed to","jp":"〜に慣れている","tier":"A","ref":"TSL 401","note_html":"<code>Once you are accustomed to the layout</code>。**to は前置詞**なので後ろは名詞か動名詞。"},{"w":"accessible","jp":"利用しやすい、行きやすい","tier":"A","ref":"TSL 432","note_html":"<code>easily accessible</code>、<code>accessible to the public</code>。名詞 access、accessibility。"},{"w":"informally","jp":"略式に、非公式に","tier":"A","ref":"TSL 499","note_html":"<code>ask questions informally</code>。形容詞 informal、反意語 formally。"}],"translation":"ソフトウェアに不案内な新入社員には、旧来のメニューのほうが必要に適していると感じられるかもしれません。画面配置に慣れれば保存記録も簡単に利用でき、いつでも気軽に質問していただけます。","html":"New staff who are <b class=\"tg\">unfamiliar</b> with the software may find the older menu better <b class=\"tg\">suited</b> to their needs. Once you <b class=\"tg\">are accustomed to</b> the layout, the archive is easily <b class=\"tg\">accessible</b>, and you may ask questions <b class=\"tg\">informally</b> at any time.","part":6},{"id":117,"theme":"科学館・行事","words":[{"w":"wildlife","jp":"野生生物","tier":"A","ref":"TSL 560","note_html":"不可算名詞。<code>a wildlife exhibit / sanctuary</code>。"},{"w":"statue","jp":"像、彫像","tier":"A","ref":"TSL 535","note_html":"<code>a bronze statue of the founder</code>。status（地位）と綴りが紛らわしい。"},{"w":"microscope","jp":"顕微鏡","tier":"A","ref":"TSL 502","note_html":"<code>a microscope station</code>、<code>under a microscope</code>。研究室設定のPart 1にも出る。"},{"w":"coordinator","jp":"まとめ役、担当責任者","tier":"A","ref":"TSL 460","note_html":"<code>the event coordinator</code>。動詞 coordinate、名詞 coordination。"},{"w":"graduation","jp":"卒業、卒業式","tier":"A","ref":"TSL 522","note_html":"<code>this year&#x27;s graduation class</code>、<code>a graduation ceremony</code>。動詞 graduate。"}],"translation":"自然センターの野生生物展示が土曜日に再開され、入口には創設者の青銅像が新たに設置されました。実際に触れられる顕微鏡コーナーも増設され、イベント担当者は今年の卒業生を招待しています。","html":"The nature center&#x27;s <b class=\"tg\">wildlife</b> exhibit reopens on Saturday, and a bronze <b class=\"tg\">statue</b> of the founder now stands at the entrance. A hands-on <b class=\"tg\">microscope</b> station has been added, and the event <b class=\"tg\">coordinator</b> has invited this year&#x27;s <b class=\"tg\">graduation</b> class.","part":6},{"id":118,"theme":"健康施策","words":[{"w":"payroll department","jp":"給与課","tier":"A","ref":"TSL 581","note_html":"<code>The payroll department will add ~</code>。部署名の語彙として押さえる。"},{"w":"fitness tracker","jp":"活動量計","tier":"S","ref":"TSL 115","note_html":"<code>receive a fitness tracker</code>。健康増進プログラムの記事で登場する。"},{"w":"vitamin","jp":"ビタミン、栄養補助剤","tier":"A","ref":"TSL 513","note_html":"<code>vitamin supplements</code>。発音は米 /ˈvaɪtəmɪn/。"},{"w":"optimistic","jp":"楽観的な","tier":"A","ref":"TSL 550","note_html":"<code>be optimistic about the plan</code>。about が続く。名詞 optimism、反意語 pessimistic。"},{"w":"effectiveness","jp":"有効性、効果","tier":"A","ref":"TSL 572","note_html":"<code>measure the effectiveness of ~</code>。形容詞 effective、efficiency（効率）と区別する。"}],"translation":"給与課が健康手当を新設し、全従業員に活動量計と1か月分のビタミン剤が支給されます。管理職はこの計画に楽観的ですが、こうしたプログラムの有効性を測るのは難しいことです。","html":"The <b class=\"tg\">payroll department</b> will add a wellness allowance, and every employee receives a <b class=\"tg\">fitness tracker</b> and a month of <b class=\"tg\">vitamin</b> supplements. Managers are <b class=\"tg\">optimistic</b> about the plan, though the <b class=\"tg\">effectiveness</b> of such programs is hard to measure.","part":6},{"id":119,"theme":"経営・株主","words":[{"w":"simplify","jp":"簡素化する","tier":"A","ref":"TSL 586","note_html":"<code>simplify reporting / the process</code>。形容詞 simple、名詞 simplification。"},{"w":"facilitate","jp":"促進する、容易にする","tier":"A","ref":"TSL 573","note_html":"<code>facilitate contact / discussion</code>。「円滑に進むよう手助けする」の意。"},{"w":"stockholder","jp":"株主","tier":"A","ref":"TSL 537","note_html":"<code>analysts and stockholders</code>。shareholder と同義で、米国式。"},{"w":"tactics","jp":"戦術、方策","tier":"S","ref":"TSL 78","note_html":"通常は複数形。<code>new tactics were explained</code>。strategy（戦略）より個別・短期の手段を指す。"},{"w":"facilitation","jp":"進行支援、円滑化","tier":"A","ref":"TSL 573","note_html":"<code>praise the facilitation of the discussion</code>。動詞 facilitate、名詞 facilitator。"}],"translation":"報告手続きを簡素化するため、取締役会はアナリストと株主の直接的な接触を促進します。新しい方策は年次総会で説明され、議長は議事進行の運びを称賛しました。","html":"To <b class=\"tg\">simplify</b> reporting, the board will <b class=\"tg\">facilitate</b> direct contact between analysts and <b class=\"tg\">stockholders</b>. The new <b class=\"tg\">tactics</b> were explained at the annual meeting, and the chair praised the <b class=\"tg\">facilitation</b> of the discussion.","part":6},{"id":120,"theme":"雑誌・書評","words":[{"w":"enthusiastic","jp":"熱狂的な、乗り気の","tier":"A","ref":"TSL 521","note_html":"<code>an enthusiastic reviewer</code>、<code>be enthusiastic about ~</code>。名詞 enthusiasm、副詞 enthusiastically。"},{"w":"reviewer","jp":"評論家、審査員","tier":"A","ref":"TSL 474","note_html":"<code>a reviewer praised ~</code>。動詞・名詞 review（批評、見直し）。"},{"w":"motorcycle","jp":"オートバイ","tier":"A","ref":"TSL 528","note_html":"<code>test a new motorcycle</code>。Part 1の写真描写にも出る。"},{"w":"editorial","jp":"社説、論説／編集の","tier":"A","ref":"TSL 571","note_html":"<code>appear as an editorial</code>、<code>the editorial staff</code>。名詞・形容詞の両用法。"},{"w":"informal","jp":"略式の、くだけた","tier":"A","ref":"TSL 499","note_html":"<code>a deliberately informal tone</code>。反意語 formal、副詞 informally。"}],"translation":"熱のこもった評論家が、先週号で新型オートバイを称賛しました。その記事は正式な試乗レポートではなく社説として掲載されたため、文体は意図的にくだけたものになっています。","html":"An <b class=\"tg\">enthusiastic</b> <b class=\"tg\">reviewer</b> praised the new <b class=\"tg\">motorcycle</b> in last week&#x27;s issue. The piece appeared as an <b class=\"tg\">editorial</b> rather than a formal test report, so the tone is deliberately <b class=\"tg\">informal</b>.","part":6},{"id":121,"theme":"推薦・採用","words":[{"w":"nominate","jp":"推薦する、指名する","tier":"A","ref":"TSL 608","note_html":"<code>nominate someone for an award</code>。for が続く。名詞 nomination。"},{"w":"referral","jp":"紹介、照会","tier":"A","ref":"TSL 647","note_html":"<code>a referral from a former client</code>、<code>a referral program</code>。動詞 refer（<code>refer someone to ~</code>）。"},{"w":"placement","jp":"就職斡旋、配置","tier":"A","ref":"TSL 782","note_html":"<code>the placement office</code>（就職課）、<code>job placement</code>。動詞 place。"},{"w":"acceptance","jp":"受け入れ、承諾","tier":"A","ref":"TSL 698","note_html":"<code>acceptance rates</code>、<code>an acceptance letter</code>（採用通知）。動詞 accept。"},{"w":"eager","jp":"熱望している","tier":"A","ref":"TSL 598","note_html":"<code>be eager to begin work</code>。後ろは to 不定詞。副詞 eagerly、名詞 eagerness。"}],"translation":"2名の上司が表彰の候補者を推薦する予定で、1件は元顧客からの紹介でした。就職課の報告によれば内定率は上昇しており、卒業生は働き始めることを心待ちにしています。","html":"Two supervisors will <b class=\"tg\">nominate</b> candidates for the award, and one <b class=\"tg\">referral</b> came from a former client. The <b class=\"tg\">placement</b> office reports that <b class=\"tg\">acceptance</b> rates have risen, and graduates are <b class=\"tg\">eager</b> to begin work.","part":7},{"id":122,"theme":"図書館","words":[{"w":"circulation desk","jp":"貸出カウンター","tier":"A","ref":"TSL 667","note_html":"<code>return books to the circulation desk</code>。図書館設定のPart 3で頻出。"},{"w":"circulation clerk","jp":"貸出係","tier":"A","ref":"TSL 667","note_html":"<code>a circulation clerk will scan them</code>。職名として出る。"},{"w":"circulation","jp":"発行部数、貸出、循環","tier":"A","ref":"TSL 667","note_html":"<code>circulation figures</code>（発行部数）、<code>air circulation</code>（空気循環）。多義語。"},{"w":"periodical","jp":"定期刊行物","tier":"A","ref":"TSL 731","note_html":"<code>each periodical is read twice a month</code>。雑誌・学術誌の総称。形容詞 periodic。"},{"w":"translator","jp":"翻訳者","tier":"A","ref":"TSL 693","note_html":"<code>hire a translator</code>。動詞 translate、名詞 translation。通訳は interpreter。"}],"translation":"借りた本は貸出カウンターにご返却ください。そこで貸出係が読み取り処理をします。当館の貸出数によれば各定期刊行物は月2回読まれており、外国語コーナーには翻訳者が採用されました。","html":"Return borrowed books to the <b class=\"tg\">circulation desk</b>, where a <b class=\"tg\">circulation clerk</b> will scan them. Our <b class=\"tg\">circulation</b> figures show that each <b class=\"tg\">periodical</b> is read twice a month, and a <b class=\"tg\">translator</b> has been hired for the foreign-language section.","part":7},{"id":123,"theme":"会議・説明","words":[{"w":"clarify","jp":"明確にする","tier":"A","ref":"TSL 703","note_html":"<code>clarify which figures ~</code>、<code>clarify a point</code>。名詞 clarification、clarity。"},{"w":"correction","jp":"訂正、修正","tier":"A","ref":"TSL 706","note_html":"<code>need a correction</code>、<code>make corrections</code>。動詞 correct、副詞 correctly。"},{"w":"informative","jp":"有益な、参考になる","tier":"A","ref":"TSL 603","note_html":"<code>an informative presentation / brochure</code>。「情報量が多く役立つ」の意。"},{"w":"forum","jp":"討論の場、掲示板","tier":"A","ref":"TSL 770","note_html":"<code>an online forum</code>、<code>a public forum</code>。会議形式にもウェブ掲示板にも使う。"},{"w":"likewise","jp":"同様に","tier":"A","ref":"TSL 830","note_html":"<code>The forum was likewise useful.</code>、<code>Likewise, ~</code>。similarly と同義の接続副詞。"}],"translation":"金曜日までに、どの数値に訂正が必要かを明確にしてください。プレゼンテーションは有益で、オンラインの討論の場も同様に、質問を集めるうえで役立ちました。","html":"Please <b class=\"tg\">clarify</b> which figures need a <b class=\"tg\">correction</b> before Friday. The presentation was <b class=\"tg\">informative</b>, and the online <b class=\"tg\">forum</b> was <b class=\"tg\">likewise</b> useful for gathering questions.","part":7},{"id":124,"theme":"規則の順守","words":[{"w":"comply","jp":"従う","tier":"A","ref":"TSL 595","note_html":"<code>comply with the safety code</code>。**with が必須**。名詞 compliance、形容詞 compliant。"},{"w":"conform to","jp":"〜に適合する、従う","tier":"A","ref":"TSL 810","note_html":"<code>conform to the building standards</code>。to が必須で、comply with と対で問われる。"},{"w":"applicable","jp":"適用される、当てはまる","tier":"A","ref":"TSL 624","note_html":"<code>applicable to subcontractors</code>、<code>if applicable</code>（該当する場合）。"},{"w":"caution","jp":"注意、用心","tier":"A","ref":"TSL 593","note_html":"<code>proceed with caution</code>、<code>a word of caution</code>。形容詞 cautious、副詞 cautiously。"},{"w":"accordingly","jp":"それに応じて、したがって","tier":"A","ref":"TSL 622","note_html":"<code>plan your schedule accordingly</code>。「前述の内容に合わせて」の意。"}],"translation":"請負業者は全員、安全規定に従い、建築基準に適合しなければなりません。この規則は下請業者にも適用されるため、注意して作業を進め、それに応じて日程を組んでください。","html":"All contractors must <b class=\"tg\">comply</b> with the safety code and <b class=\"tg\">conform to</b> the building standards. The rule is <b class=\"tg\">applicable</b> to subcontractors as well, so proceed with <b class=\"tg\">caution</b> and plan your schedule <b class=\"tg\">accordingly</b>.","part":7},{"id":125,"theme":"進行管理","words":[{"w":"ongoing","jp":"進行中の、継続中の","tier":"A","ref":"TSL 641","note_html":"<code>Renovation is ongoing.</code>、<code>an ongoing project</code>。underway の言い換え。"},{"w":"periodically","jp":"定期的に","tier":"A","ref":"TSL 642","note_html":"<code>inspections are carried out periodically</code>。形容詞 periodic、名詞 period。"},{"w":"beforehand","jp":"前もって、事前に","tier":"A","ref":"TSL 628","note_html":"<code>Notify the desk beforehand.</code>。in advance と同義。副詞なので前置詞は不要。"},{"w":"smoothly","jp":"順調に、円滑に","tier":"A","ref":"TSL 690","note_html":"<code>proceed / run smoothly</code>、<code>go smoothly</code>。形容詞 smooth。"},{"w":"in a timely manner","jp":"適時に、遅滞なく","tier":"A","ref":"TSL 843","note_html":"<code>finish in a timely manner</code>。ビジネス文書の定型句。形容詞 timely。"}],"translation":"西棟の改装は進行中で、検査は定期的に実施されています。立ち入りが必要な場合は事前に受付までご連絡ください。作業は順調に進み、遅滞なく完了する見込みです。","html":"Renovation of the west wing is <b class=\"tg\">ongoing</b>, and inspections are carried out <b class=\"tg\">periodically</b>. Notify the desk <b class=\"tg\">beforehand</b> if you need access, and the work should proceed <b class=\"tg\">smoothly</b> and finish <b class=\"tg\">in a timely manner</b>.","part":7},{"id":126,"theme":"販売中止・撤去","words":[{"w":"discontinue","jp":"生産・提供を中止する","tier":"A","ref":"TSL 710","note_html":"<code>discontinue the older model / a service</code>。「打ち切る」の意で、stop より正式。"},{"w":"unavailable","jp":"入手できない、対応できない","tier":"A","ref":"TSL 695","note_html":"<code>parts may be unavailable</code>、<code>He is unavailable today.</code>。反意語 available。"},{"w":"alternatively","jp":"あるいは、代わりに","tier":"A","ref":"TSL 658","note_html":"<code>Alternatively, you may request ~</code>。文頭で別案を示す接続副詞。"},{"w":"removal","jp":"撤去、除去","tier":"A","ref":"TSL 616","note_html":"<code>request the removal of the unit</code>、<code>snow removal</code>。動詞 remove。"},{"w":"disappointment","jp":"失望","tier":"A","ref":"TSL 764","note_html":"<code>limit any disappointment</code>、<code>to my disappointment</code>。動詞 disappoint、形容詞 disappointed / disappointing。"}],"translation":"メーカーは旧型の生産を中止するため、3月以降は交換部品が入手できなくなる可能性があります。あるいは、無償で装置の撤去をご依頼いただくこともでき、それにより失望を最小限に抑えられます。","html":"The manufacturer will <b class=\"tg\">discontinue</b> the older model, so replacement parts may be <b class=\"tg\">unavailable</b> after March. <b class=\"tg\">Alternatively</b>, you may request the <b class=\"tg\">removal</b> of the unit at no cost, which should limit any <b class=\"tg\">disappointment</b>.","part":7},{"id":127,"theme":"資格・研究機関","words":[{"w":"institute","jp":"研究所、協会／設ける","tier":"A","ref":"TSL 604","note_html":"<code>a research institute</code>、<code>institute a policy</code>（制度を設ける）。名詞・動詞の両用法。"},{"w":"certify","jp":"認定する、証明する","tier":"A","ref":"TSL 664","note_html":"<code>certify laboratories</code>、<code>certified public accountant</code>。名詞 certification、certificate。"},{"w":"certified","jp":"公認の、資格を持つ","tier":"A","ref":"TSL 664","note_html":"<code>only certified staff</code>、<code>a certified technician</code>。求人広告で頻出。"},{"w":"familiarize","jp":"慣れさせる","tier":"A","ref":"TSL 678","note_html":"<code>familiarize yourself with ~</code>。再帰代名詞＋with の形で覚える。形容詞 familiar。"},{"w":"chemistry","jp":"化学","tier":"A","ref":"TSL 666","note_html":"<code>the chemistry section</code>。名詞 chemist（化学者、英国では薬剤師）。"}],"translation":"その研究所は、新基準を満たす検査室を認定します。試料を扱えるのは資格を持つ職員のみですので、マニュアルの化学の章に目を通して慣れておいてください。","html":"The <b class=\"tg\">institute</b> will <b class=\"tg\">certify</b> laboratories that meet the new standard. Only <b class=\"tg\">certified</b> staff may handle the samples, so please <b class=\"tg\">familiarize</b> yourself with the <b class=\"tg\">chemistry</b> section of the manual.","part":7},{"id":128,"theme":"データ集計","words":[{"w":"compile","jp":"まとめる、編集する","tier":"A","ref":"TSL 705","note_html":"<code>compile the survey results / a list</code>。散在するものを集めて整理する意。"},{"w":"individually","jp":"個別に、1つずつ","tier":"A","ref":"TSL 827","note_html":"<code>check each response individually</code>。形容詞 individual。"},{"w":"compilation","jp":"編集物、集大成","tier":"A","ref":"TSL 705","note_html":"<code>The compilation will be released ~</code>。動詞 compile の名詞形。"},{"w":"separately","jp":"別々に、個別に","tier":"A","ref":"TSL 619","note_html":"<code>released separately from ~</code>。形容詞 separate（動詞は /-eɪt/、形容詞は /-ət/）。"},{"w":"approximate","jp":"おおよその","tier":"A","ref":"TSL 846","note_html":"<code>an approximate total</code>。副詞 approximately（約〜）はPart 5で頻出。"}],"translation":"当社の分析担当が調査結果をまとめ、各回答を個別に確認します。その編集物は年次報告書とは別に公表されますが、おおよその合計はすでに入手可能です。","html":"Our analyst will <b class=\"tg\">compile</b> the survey results and check each response <b class=\"tg\">individually</b>. The <b class=\"tg\">compilation</b> will be released <b class=\"tg\">separately</b> from the annual report, and an <b class=\"tg\">approximate</b> total is already available.","part":7},{"id":129,"theme":"経済・見通し","words":[{"w":"economist","jp":"経済学者、エコノミスト","tier":"A","ref":"TSL 599","note_html":"<code>An economist described ~</code>。economics（経済学）、economy（経済）と区別する。"},{"w":"outlook","jp":"見通し、展望","tier":"A","ref":"TSL 834","note_html":"<code>the outlook for the region</code>、<code>the economic outlook</code>。forecast に近い。"},{"w":"favorable","jp":"好ましい、有利な","tier":"A","ref":"TSL 768","note_html":"<code>a favorable outlook / review / response</code>。反意語 unfavorable。"},{"w":"substantially","jp":"大幅に、実質的に","tier":"A","ref":"TSL 794","note_html":"<code>grow substantially</code>。形容詞 substantial（<code>a substantial increase</code>）。"},{"w":"morale","jp":"士気","tier":"A","ref":"TSL 831","note_html":"不可算名詞。<code>raise / boost employee morale</code>。moral（道徳）と綴り・発音が異なる点に注意。"}],"translation":"あるエコノミストは、輸出が大幅に伸びたことを指摘し、その地域の見通しは良好だと述べました。状況の改善は従業員の士気も高めています。","html":"An <b class=\"tg\">economist</b> described the <b class=\"tg\">outlook</b> for the region as <b class=\"tg\">favorable</b>, noting that exports have grown <b class=\"tg\">substantially</b>. Improved conditions have also raised employee <b class=\"tg\">morale</b>.","part":7},{"id":130,"theme":"店舗・買い物","words":[{"w":"ample","jp":"十分な、広々とした","tier":"A","ref":"TSL 803","note_html":"<code>ample space / time / parking</code>。plenty of と同義の形容詞。"},{"w":"checkout","jp":"レジ、精算","tier":"A","ref":"TSL 665","note_html":"<code>the checkout counter</code>、<code>checkout time</code>（ホテルの退室時刻）。2義がある。"},{"w":"vending machine","jp":"自動販売機","tier":"A","ref":"TSL 748","note_html":"<code>the vending machine by the door</code>。Part 1・社内案内で登場する。"},{"w":"cookie","jp":"クッキー","tier":"A","ref":"TSL 671","note_html":"<code>sells a cookie and a drink</code>。英国式は biscuit。"},{"w":"cosmetics","jp":"化粧品","tier":"A","ref":"TSL 760","note_html":"通常は複数形。<code>the cosmetics aisle / department</code>。"}],"translation":"レジカウンターの近くには、新しい陳列棚を置くのに十分な広さがあります。入口脇の自動販売機ではクッキーと飲み物のセット販売を始め、化粧品売り場の通路は拡張されました。","html":"There is <b class=\"tg\">ample</b> space near the <b class=\"tg\">checkout</b> counter for a new display. The <b class=\"tg\">vending machine</b> by the door now sells a <b class=\"tg\">cookie</b> and a drink together, and the <b class=\"tg\">cosmetics</b> aisle has been widened.","part":7},{"id":131,"theme":"レストラン","words":[{"w":"entrée","jp":"主菜、メインディッシュ","tier":"A","ref":"TSL 714","note_html":"<code>recommend the seafood entrée</code>。米国では主菜、フランス語では前菜を指す。"},{"w":"authentic","jp":"本格的な、本物の","tier":"A","ref":"TSL 753","note_html":"<code>an authentic regional sauce</code>、<code>authentic cuisine</code>。名詞 authenticity。"},{"w":"spill","jp":"こぼす／こぼれ","tier":"A","ref":"TSL 743","note_html":"<code>If you spill anything ~</code>、<code>a spill on the floor</code>。名詞・動詞の両用法。"},{"w":"pots and pans","jp":"鍋類","tier":"A","ref":"TSL 728","note_html":"<code>wash the pots and pans by hand</code>。決まった組み合わせの表現。"},{"w":"dishwasher","jp":"食器洗い機、皿洗い係","tier":"A","ref":"TSL 711","note_html":"<code>in the dishwasher</code>。機械と人の両方を指す。"}],"translation":"シェフのおすすめは魚介の主菜で、本格的な郷土のソースを使っています。何かこぼした場合は給仕にお伝えください。なお、鍋類は食器洗い機ではなく手洗いする必要があります。","html":"The chef recommends the seafood <b class=\"tg\">entrée</b>, which uses an <b class=\"tg\">authentic</b> regional sauce. If you <b class=\"tg\">spill</b> anything, tell a server, and note that the <b class=\"tg\">pots and pans</b> must be washed by hand rather than in the <b class=\"tg\">dishwasher</b>.","part":7},{"id":132,"theme":"車両・道路","words":[{"w":"walkway","jp":"歩道、通路","tier":"A","ref":"TSL 800","note_html":"<code>block the walkway</code>、<code>a covered walkway</code>。屋内外の歩行用通路を指す。"},{"w":"tow","jp":"けん引する","tier":"A","ref":"TSL 692","note_html":"<code>The truck had to be towed.</code>、<code>a tow truck</code>（レッカー車）。発音は /toʊ/。"},{"w":"toll","jp":"通行料","tier":"A","ref":"TSL 797","note_html":"<code>charge a toll</code>、<code>a toll road / booth</code>。「犠牲・被害」の意味もある。"},{"w":"compartment","jp":"区画、収納棚","tier":"A","ref":"TSL 756","note_html":"<code>the overhead compartment</code>（頭上の物入れ）、<code>a luggage compartment</code>。"},{"w":"deck","jp":"甲板、階層","tier":"A","ref":"TSL 672","note_html":"<code>the upper deck</code>、<code>a sun deck</code>。船・バス・建物のいずれにも使う。"}],"translation":"歩道をふさいでいたトラックはレッカー移動され、運転手は橋の通行料を請求されました。小さな荷物は頭上の物入れに収納し、大型の荷物には上のデッキをご利用ください。","html":"A truck blocking the <b class=\"tg\">walkway</b> had to be <b class=\"tg\">towed</b>, and drivers were charged a <b class=\"tg\">toll</b> on the bridge. Store small items in the overhead <b class=\"tg\">compartment</b>, and use the upper <b class=\"tg\">deck</b> for oversized luggage.","part":7},{"id":133,"theme":"天候・環境","words":[{"w":"humidity","jp":"湿度、湿気","tier":"A","ref":"TSL 777","note_html":"<code>high humidity</code>、<code>temperature and humidity</code>。形容詞 humid、名詞 humidifier。"},{"w":"uncomfortable","jp":"不快な、居心地の悪い","tier":"A","ref":"TSL 844","note_html":"<code>makes the room uncomfortable</code>。反意語 comfortable。"},{"w":"excessive","jp":"過度の、行き過ぎた","tier":"A","ref":"TSL 634","note_html":"<code>excessive heat / noise / spending</code>。名詞 excess、動詞 exceed。"},{"w":"seasonal","jp":"季節的な","tier":"A","ref":"TSL 618","note_html":"<code>Demand is seasonal.</code>、<code>seasonal workers</code>（季節労働者）。名詞 season。"},{"w":"locally","jp":"地元で","tier":"A","ref":"TSL 606","note_html":"<code>produced locally</code>、<code>locally grown</code>。形容詞 local。"}],"translation":"高い湿度が保管室を不快にしており、過度の暑さは在庫品を傷めるおそれがあります。当社の扇風機の需要は季節的なもので、製品は地元で生産されています。","html":"High <b class=\"tg\">humidity</b> makes the storage room <b class=\"tg\">uncomfortable</b>, and <b class=\"tg\">excessive</b> heat can damage the stock. Demand for our fans is <b class=\"tg\">seasonal</b>, and the units are produced <b class=\"tg\">locally</b>.","part":7},{"id":134,"theme":"品質・評価","words":[{"w":"consistently","jp":"一貫して、常に","tier":"A","ref":"TSL 670","note_html":"<code>consistently rated as ~</code>。形容詞 consistent、名詞 consistency。"},{"w":"satisfactory","jp":"満足のいく、可もなく不可もない","tier":"A","ref":"TSL 617","note_html":"<code>rated as satisfactory</code>。「合格水準だが特別ではない」という含みがある。"},{"w":"exceptional","jp":"例外的に優れた","tier":"A","ref":"TSL 677","note_html":"<code>The dessert menu is exceptional.</code>、<code>exceptional service</code>。名詞 exception。"},{"w":"renowned","jp":"名高い、著名な","tier":"A","ref":"TSL 648","note_html":"<code>a renowned baker</code>、<code>renowned for ~</code>。famous の格式ばった語。"},{"w":"exceptionally","jp":"並外れて、非常に","tier":"A","ref":"TSL 677","note_html":"<code>works exceptionally quickly</code>。形容詞・副詞を強める用法が中心。"}],"translation":"そのサービスは一貫して満足のいく水準と評価されていますが、デザートのメニューは格別です。当店のパティシエはウィーンの著名なパン職人のもとで修業し、並外れて手際よく仕事をします。","html":"The service has been <b class=\"tg\">consistently</b> rated as <b class=\"tg\">satisfactory</b>, but the dessert menu is <b class=\"tg\">exceptional</b>. Our pastry chef trained under a <b class=\"tg\">renowned<
